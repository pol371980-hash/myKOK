<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ΚΟΚ">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>MyKOK — Ν. 5209/2025</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0071e3;--red:#ff3b30;--orange:#ff9500;--green:#34c759;--yellow:#ffcc00;--purple:#af52de;
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;
  --g3:#3a3a3c;--g4:#48484a;--g5:#636366;--g6:#aeaeb2;
  --sep:rgba(255,255,255,0.1);--text:#fff;--text2:#aeaeb2;--r:13px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)
}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-size:16px;min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;
  background:rgba(0,0,0,0.88);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(var(--st) + 10px) 16px 10px;border-bottom:.5px solid var(--sep)}
.hdr h1{font-size:17px;font-weight:700;text-align:center;letter-spacing:-.3px}
.hdr p{font-size:11px;color:var(--g6);text-align:center;margin-top:2px}
.hdr-stats{display:flex;justify-content:center;gap:12px;margin-top:6px}
.stat{font-size:11px;color:var(--g5);background:var(--g3);padding:3px 10px;border-radius:20px}
.stat span{color:var(--text);font-weight:600}

/* SEARCH */
.srch{padding:10px 16px 6px;background:var(--bg)}
.srch-box{display:flex;align-items:center;background:var(--g3);border-radius:12px;padding:9px 12px;gap:8px}
.srch-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:16px;font-family:inherit}
.srch-box input::placeholder{color:var(--g6)}
.clr{background:var(--g5);border:none;border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;flex-shrink:0}
.clr.on{opacity:1}

/* TABS */
.tabs{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;
  cursor:pointer;border:none;background:var(--g3);color:var(--text2);transition:all .15s}
.tab.on{background:var(--blue);color:#fff}

/* VEHICLE TYPE TABS */
.vtabs{display:flex;gap:6px;padding:8px 16px 4px;background:var(--bg)}
.vtab{flex:1;padding:9px 12px;border-radius:11px;font-size:13px;font-weight:600;
  cursor:pointer;border:none;background:var(--g3);color:var(--text2);transition:all .15s;text-align:center}
.vtab.on.fot{background:#3e1800;color:#ff9500;border:1.5px solid #ff9500}
.vtab.on.kok{background:#00214a;color:var(--blue);border:1.5px solid var(--blue)}

/* CONTENT */
.main{padding:0 0 calc(var(--sb) + 90px)}
.sec{font-size:12px;font-weight:600;color:var(--g6);text-transform:uppercase;
  letter-spacing:.5px;padding:18px 16px 6px}
.grp{background:var(--card);border-radius:var(--r);margin:0 16px 2px;overflow:hidden}
.row{display:flex;align-items:center;padding:13px 16px;gap:12px;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:background .1s;border-bottom:.5px solid var(--sep)}
.row:last-child{border-bottom:none}
.row:active{background:var(--g3)}
.ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0}
.body{flex:1;min-width:0}
.ttl{font-size:14px;font-weight:500;line-height:1.3}
.sub{font-size:12px;color:var(--g6);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rgt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.bdg{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.e1{background:rgba(52,199,89,.18);color:#34c759}
.e2{background:rgba(255,149,0,.18);color:#ff9500}
.e3{background:rgba(255,59,48,.18);color:#ff3b30}
.e4{background:rgba(175,82,222,.18);color:#af52de}
.sg{background:rgba(255,204,0,.18);color:#ffcc00}
.af{font-size:11px;color:var(--g6);background:var(--g3);padding:2px 8px;border-radius:10px}

/* SHEET */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:flex-end}
.ov.on{display:flex}
.sht{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:92vh;
  overflow-y:auto;padding:0 0 calc(var(--sb)+20px);
  animation:up .28s cubic-bezier(.34,1.2,.64,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hdl{width:36px;height:4px;background:var(--g4);border-radius:2px;margin:12px auto 0}
.sttl{font-size:20px;font-weight:700;padding:14px 20px 0;letter-spacing:-.4px;line-height:1.3}
.sart{font-size:13px;color:var(--blue);padding:4px 20px 14px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px}
.gc{background:var(--card2);border-radius:12px;padding:13px}
.gc.full{grid-column:1/-1}
.gclbl{font-size:11px;color:var(--g6);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.gcval{font-size:22px;font-weight:700;letter-spacing:-.5px}
.gcsub{font-size:13px;color:var(--g6);margin-top:4px;line-height:1.45}
.cg{color:var(--green)}.co{color:var(--orange)}.cr{color:var(--red)}.cp{color:var(--purple)}.cy{color:var(--yellow)}
.msec{padding:0 16px 8px}
.mi{display:flex;align-items:flex-start;gap:11px;background:var(--card2);
  border-radius:12px;padding:11px 13px;margin-bottom:7px}
.mdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.mtxt{font-size:14px;line-height:1.45}
.closebtn{float:right;margin:14px 18px 0 0;background:var(--g3);border:none;border-radius:50%;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--g6);font-size:18px;line-height:1}

/* CATS TAB */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:6px}
.cc{background:var(--card);border-radius:var(--r);padding:15px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .1s}
.cc:active{background:var(--card2)}
.ccode{font-size:26px;font-weight:800;letter-spacing:-1px;margin-bottom:3px}
.camt{font-size:16px;font-weight:600;margin-bottom:2px}
.clbl{font-size:11px;color:var(--g6);line-height:1.4}

/* EMPTY */
.empty{text-align:center;padding:60px 32px;color:var(--g6)}
.empty .ei{font-size:48px;margin-bottom:12px}
.empty .et{font-size:16px;font-weight:500;color:var(--text);margin-bottom:6px}
mark{background:rgba(0,113,227,.28);color:inherit;border-radius:2px;padding:0 1px}

/* ── Multi-select basket ── */
.row.sel{background:rgba(10,132,255,.13);}
.row.sel .chk{color:#0a84ff;}
.chk{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--g5);}
#basket{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--g2);border-top:1px solid var(--sep);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:none;flex-direction:column;gap:8px;}
#basket.on{display:flex;}
.bk-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.bk-ttl{font-size:13px;color:var(--g5);}
.bk-amt{font-size:24px;font-weight:700;color:#0a84ff;}
.bk-sub{font-size:12px;color:var(--g5);margin-top:2px;}
.bk-btns{display:flex;gap:8px;}
.bk-btn{padding:8px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;}
.bk-clear{background:var(--g3);color:var(--text);}
.bk-detail{background:#0a84ff;color:#fff;}
#selmode-btn{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:150;
  background:var(--g3);border:none;border-radius:20px;padding:6px 14px;
  font-size:13px;font-weight:600;color:var(--text);cursor:pointer;touch-action:manipulation;}
#selmode-btn.on{background:#0a84ff;color:#fff;}
/* basket summary sheet */
#bk-sheet{padding:0 0 16px;}
.bk-item{display:flex;justify-content:space-between;align-items:flex-start;
  padding:10px 16px;border-bottom:.5px solid var(--sep);gap:12px;}
.bk-item-ttl{font-size:14px;color:var(--text);flex:1;}
.bk-item-art{font-size:12px;color:var(--g5);margin-top:2px;}
.bk-item-amt{font-size:15px;font-weight:700;flex-shrink:0;}
.bk-item-amt.primary{color:#0a84ff;}
.bk-item-amt.concurrent{color:#ff9f0a;}
.bk-total-row{display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;margin-top:4px;}
.bk-total-lbl{font-size:15px;font-weight:600;}
.bk-total-val{font-size:28px;font-weight:700;color:#0a84ff;}
.bk-measures-hdr{padding:10px 16px 4px;font-size:13px;font-weight:600;color:var(--g5);text-transform:uppercase;letter-spacing:.5px;}
.bk-mitem{padding:6px 16px;font-size:13px;color:var(--text);}
.bk-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:6px;}
.bk-badge.primary{background:rgba(10,132,255,.2);color:#0a84ff;}
.bk-badge.concurrent{background:rgba(255,159,10,.2);color:#ff9f0a;}

.az-letter{font-size:1.4rem;font-weight:700;color:var(--blue);padding:12px 0 4px;border-bottom:2px solid var(--blue);margin:8px 0 4px;}
.art-header{display:flex;justify-content:space-between;align-items:center;background:var(--g2);border-radius:10px;padding:10px 14px;margin:6px 0;cursor:pointer;transition:.15s;}
.art-header:hover{background:var(--g3);}
.art-subj{font-size:.78rem;color:var(--g6);margin-top:2px;}
.art-cnt{font-size:.82rem;color:var(--g6);white-space:nowrap;margin-left:8px;}
.art-arrow{font-size:.7rem;margin-left:4px;}
.art-body{padding:4px 0 8px;}
.art-law-box{background:var(--g2);border-left:3px solid var(--blue);border-radius:8px;padding:10px 14px;margin:6px 0 10px;font-size:.82rem;line-height:1.55;}
.art-law-title{font-weight:600;color:var(--blue);margin-bottom:6px;}
.art-law-text{color:var(--g7);max-height:240px;overflow-y:auto;}
</style>
</head>

<div class="hdr">

</div>

<div class="vtabs" id="vtabs">

<button class="tab" onclick="setTab('az',this)">Α–Ω</button>
<button class="tab" onclick="setTab('art',this)">Κατ' Άρθρο</button>
</div>

<div class="main" id="main"></div>

<div class="ov" id="ov" onclick="ovClick(event)">
  <div class="sht" id="sht">
    <div class="hdl"></div>
    <button class="closebtn" onclick="closeSheet()">✕</button>

  </div>
</div>

let TAB='all', Q='', VEH='kok';

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function catCls(c){
  const u=c.toUpperCase();
  if(u.startsWith('Ε1')||u.startsWith('E1'))return'e1';
  if(u.startsWith('Ε2')||u.startsWith('E2'))return'e2';
  if(u.startsWith('Ε3')||u.startsWith('E3'))return'e3';
  if(u.startsWith('Ε4')||u.startsWith('E4'))return'e4';
  if(u==='Σ'||u==='S')return'sg';
  return'e1';
}
function fmt(n){return n==null?'—':n.toLocaleString('el-GR')+'€';}
function afmt(a){if(!a)return'';if(typeof a==='number')return a+' ημ.';return a;}
function afDays(a){
  if(!a)return 0;
  if(typeof a==='number')return a;
  const m=(a+'').match(/(\d+)/);
  return m?parseInt(m[1],10):0;
}
function hl(t,q){if(!q)return t;const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\$&')+')','gi');return t.replace(re,'<mark>$1</mark>');}
function n(s){return(s||'').toLowerCase()
  .replace(/ά/g,'α').replace(/έ/g,'ε').replace(/ή/g,'η').replace(/ί/g,'ι').replace(/ΐ/g,'ι')
  .replace(/ό/g,'ο').replace(/ύ/g,'υ').replace(/ΰ/g,'υ').replace(/ώ/g,'ω')
  .replace(/Ά/g,'α').replace(/Έ/g,'ε').replace(/Ή/g,'η').replace(/Ί/g,'ι')
  .replace(/Ό/g,'ο').replace(/Ύ/g,'υ').replace(/Ώ/g,'ω')
  .replace(/[αΑ]/g,'α').replace(/[εΕ]/g,'ε').replace(/[ηΗ]/g,'η')
  .replace(/[ιΙ]/g,'ι').replace(/[οΟ]/g,'ο').replace(/[υΥ]/g,'υ').replace(/[ωΩ]/g,'ω');}
function match(v,q){
  if(!q)return true;
  const nq=n(q);
  return n(v.title).includes(nq)||n(v.desc).includes(nq)||n(v.article).includes(nq)||
    (v.tags||[]).some(t=>n(t).includes(nq))||
    v.cat.toLowerCase().includes(q.toLowerCase())||
    (v.amount&&String(v.amount).includes(q));
}
function tabMatch(v){
  const isTruck=v.tags&&v.tags.includes('3446');
  if(VEH==='fot'&&!isTruck)return false;
  if(VEH==='kok'&&isTruck)return false;
  if(TAB==='all'||TAB==='az'||TAB==='art')return true;
  const c=v.cat.toUpperCase();
  if(TAB==='e1')return c.startsWith('Ε1')||c.startsWith('E1');
  if(TAB==='e2')return c.startsWith('Ε2')||c.startsWith('E2');
  if(TAB==='e3')return c.startsWith('Ε3')||c.startsWith('E3');
  if(TAB==='e4')return c.startsWith('Ε4')||c.startsWith('E4');
  return false;
}

function artNum(art){
  const m=(art||'').match(/(\d+)/);
  return m?parseInt(m[1],10):9999;
}
let SEL_MODE = false;
let SELECTED = new Set();

function render(){
  const el=document.getElementById('main');
  if(TAB==='cats'){renderCats(el);return;}
  if(TAB==='az'){renderAlpha(el);return;}
  if(TAB==='art'){renderByArticle(el);return;}
  const items=V.filter(v=>tabMatch(v)&&match(v,Q));
  document.getElementById('vcnt').textContent=items.length;
  if(!items.length){
    el.innerHTML=`<div class="empty"><div class="ei">🔍</div><div class="et">Δεν βρέθηκαν αποτελέσματα</div><div>Δοκιμάστε διαφορετικό όρο αναζήτησης</div></div>`;
    return;
  }
  const grps={};
  items.forEach(v=>{const key=v.article||'Άλλο';(grps[key]=grps[key]||[]).push(v);});
  const artKeys=Object.keys(grps).sort((a,b)=>artNum(a)-artNum(b));
  let h='';
  artKeys.forEach(art=>{
    const sorted=grps[art].sort((a,b)=>a.title.localeCompare(b.title,'el'));
    h+=`<div class="sec">${hl(art,Q)} <span style="color:var(--g5);font-weight:400">(${sorted.length})</span></div><div class="grp">`;
    sorted.forEach(v=>{
      const a=afmt(v.afairesi);
      const amtDisp=v.amount?fmt(v.amount)+'€':v.cat;
      const isSel = SELECTED.has(v.id);
      const rowClick = SEL_MODE ? `toggleSel(${v.id},event)` : `openDetail(${v.id})`;
      h+=`<div class="row${isSel?' sel':''}" data-id="${v.id}" onclick="${rowClick}">
        ${SEL_MODE?`<div class="chk">${isSel?'✓':'○'}</div>`:''}
        <div class="ico" style="background:${v.ibg||'#1a1a1a'}">${v.icon||'📋'}</div>
        <div class="body"><div class="ttl">${hl(v.title,Q)}</div><div class="sub">${hl(v.article,Q)}</div></div>
        <div class="rgt">
          <span class="bdg ${catCls(v.cat)}">${amtDisp}</span>
          ${a?'<span class="af">⏱ '+a+'</span>':''}
        </div>
      </div>`;
    });
    h+='</div>';
  });
  el.innerHTML=h;
}

    mh=`<div class="sec" style="padding-top:10px">Διοικητικά Μέτρα</div><div class="msec">`;

    </div>${mh}`;

function toggleSel(id, e){
  e.stopPropagation();
  if(SELECTED.has(id)) SELECTED.delete(id);
  else SELECTED.add(id);

  const row = document.querySelector(`.row[data-id="${id}"]`);

function clearSel(){
  SELECTED.clear();

}

/* Συρρέουσα λογική:
   - Η παράβαση με το μεγαλύτερο πρόστιμο → πλήρες ποσό
   - Κάθε άλλη → 50% του προστίμου της
*/
function calcBasket(){
  const items = [...SELECTED].map(id => V.find(v=>v.id===id)).filter(Boolean);
  if(!items.length) return {items:[], primary:null, total:0, totalDays:0};
  const sorted = [...items].sort((a,b)=>(b.amount||0)-(a.amount||0));
  const primary = sorted[0];
  let total = primary.amount || 0;
  sorted.slice(1).forEach(v=>{ total += Math.round((v.amount||0) * 0.5); });
  // Sum all afairesi days
  const totalDays = sorted.reduce((s,v)=>s+afDays(v.afairesi),0);
  return {items: sorted, primary, total, totalDays};
}

function updateBasket(){
  const {items, primary, total, totalDays} = calcBasket();
  const basket = document.getElementById('basket');
  if(!items.length || !SEL_MODE){
    basket.classList.remove('on');
    document.getElementById('main').style.paddingBottom = '';
    return;
  }
  basket.classList.add('on');
  document.getElementById('main').style.paddingBottom = '110px';
  document.getElementById('bk-cnt').textContent = items.length + ' παράβαση' + (items.length===1?'':'εις') + ' επιλεγμέν' + (items.length===1?'η':'ες');
  document.getElementById('bk-total').textContent = fmt(total);
  const concurrent = items.length > 1 ? items.slice(1) : [];
  const daysStr = totalDays > 0 ? ' · αφαίρεση ' + totalDays + ' ημ.' : '';
  document.getElementById('bk-sub').textContent = items.length > 1
    ? 'Κύρια: ' + fmt(primary.amount||0) + '€ + ' + concurrent.length + ' συρρέουσ' + (concurrent.length===1?'α':'ες') + ' (×50%)' + daysStr
    : (totalDays > 0 ? 'Αφαίρεση ' + totalDays + ' ημ.' : '');
}

function showBasketDetail(){
  const {items, primary, total, totalDays} = calcBasket();
  if(!items.length) return;

  // Collect all afairesi from selected violations (deduplicate by description)
  const measuresAll = [];
  items.forEach(v=>{
    if(v.measures && v.measures.length){
      v.measures.forEach(m=>{
        measuresAll.push({m, vtitle: v.title});
      });
    }
  });

  // Build afairesi summary (max days per type heuristic)
  const afaireseItems = items.filter(v=>v.afairesi);

  let html = `<div id="bk-sheet">`;
  html += `<div class="sec" style="padding-top:12px">Παραβάσεις &amp; Πρόστιμα</div>`;
  items.forEach((v,i)=>{
    const isPrimary = i===0;
    const amt = isPrimary ? (v.amount||0) : Math.round((v.amount||0)*0.5);
    const badgeCls = isPrimary ? 'primary' : 'concurrent';
    const badgeTxt = isPrimary ? 'Κύρια' : 'Συρρέουσα ×50%';
    const amtDisp = v.amount ? fmt(amt)+'€' : '—';
    const daysItem = afDays(v.afairesi);
    html += `<div class="bk-item">
      <div style="flex:1">
        <div class="bk-item-ttl">${v.title}</div>
        <div class="bk-item-art">${v.article}${daysItem?' · ⏱ '+daysItem+' ημ.':''}</div>
      </div>
      <div style="text-align:right">
        <div class="bk-item-amt ${badgeCls}">${amtDisp}</div>
        <div><span class="bk-badge ${badgeCls}">${badgeTxt}</span></div>
      </div>
    </div>`;
  });

  html += `<div class="bk-total-row">
    <div>
      <div class="bk-total-lbl">Σύνολο Προστίμου</div>
      ${totalDays?`<div style="font-size:13px;color:#ff9f0a;margin-top:2px">⏱ Αφαίρεση άδειας: ${totalDays} ημέρες</div>`:''}
    </div>
    <div class="bk-total-val">${fmt(total)}</div>
  </div>`;



  if(measuresAll.length){
    html += `<div class="bk-measures-hdr">Λοιπά Διοικητικά Μέτρα &amp; Ποινικές Κυρώσεις</div>`;
    measuresAll.forEach(({m, vtitle})=>{
      html += `<div class="bk-mitem">• <span style="color:var(--g5)">${vtitle}:</span> ${m}</div>`;
    });
  }

  html += `</div>`;

  document.getElementById('sc').innerHTML = html;
  openSheet();
}


function artNum(art){
  const m=art.match(/\d+/);
  return m?parseInt(m[0]):9999;
}


function cardHTML(v){
  const a=afmt(v.afairesi);
  const amtDisp=v.amount?fmt(v.amount)+'€':v.cat;
  const isSel=SELECTED&&SELECTED.has(v.id);
  const rowClick=SEL_MODE?`toggleSel(${v.id},event)`:`openDetail(${v.id})`;
  return `<div class="row${isSel?' sel':''}" data-id="${v.id}" onclick="${rowClick}">
    ${SEL_MODE?`<div class="chk">${isSel?'✓':'○'}</div>`:''}
    <div class="ico" style="background:${v.ibg||'#1a1a1a'}">${v.icon||'📋'}</div>
    <div class="body"><div class="ttl">${hl(v.title,Q)}</div><div class="sub">${hl(v.article,Q)}</div></div>
    <div class="rgt">
      <span class="bdg ${catCls(v.cat)}">${amtDisp}</span>
      ${a?'<span class="af">⏱ '+a+'</span>':''}
    </div>
  </div>`;
}
function renderAlpha(el){
  const items=V.filter(v=>tabMatch(v)&&match(v,Q));
  if(!items.length){el.innerHTML='<div class="empty"><div class="ei">🔍</div><div class="et">Δεν βρέθηκαν αποτελέσματα</div></div>';return;}
  const sorted=[...items].sort((a,b)=>a.title.localeCompare(b.title,'el'));
  let h='',curL='';
  sorted.forEach(v=>{
    const L=(v.title[0]||'').toUpperCase();
    if(L!==curL){curL=L;h+=`<div class="az-letter">${L}</div>`;}
    h+=cardHTML(v);
  });
  el.innerHTML=h;
}

  const el=document.getElementById(id);
  const arr=document.getElementById('arr_'+id);
  if(!el)return;

  el.style.display=open?'none':'block';

function renderByArticle(el){
  const items=V.filter(v=>tabMatch(v)&&match(v,Q));
  if(!items.length){el.innerHTML='<div class="empty"><div class="ei">🔍</div><div class="et">Δεν βρέθηκαν αποτελέσματα</div></div>';return;}
  const groups={};
  items.forEach(v=>{const k=v.article||'—';(groups[k]=groups[k]||[]).push(v);});
  const artKeys=Object.keys(groups).sort((a,b)=>{
    const ia=a.includes('Ν.3446')||a.includes('Ν.4663')||a.includes('Ν.5322');
    const ib=b.includes('Ν.3446')||b.includes('Ν.4663')||b.includes('Ν.5322');
    if(ia&&!ib)return 1; if(!ia&&ib)return-1;
    return artNum(a)-artNum(b);
  });
  let h='';
  artKeys.forEach((art,idx)=>{
    const vvs=groups[art];
    const aid='art_idx_'+idx;
    const isTruckLaw=art.includes('Ν.3446')||art.includes('Ν.4663')||art.includes('Ν.5322');
    const artN=isTruckLaw?null:artNum(art);
    const artSubj=artN&&ARTICLE_DESC[artN]?ARTICLE_DESC[artN]:(isTruckLaw?'Ν.3446/2006 — Παραβάσεις οδικών μεταφορών φορτηγών':'');
    h+=`<div class="art-header" onclick="toggleArt('${aid}')">
      <div><div>${art}</div>${artSubj?`<div class="art-subj">${artSubj}</div>`:''}</div>
      <span class="art-cnt">${vvs.length} παράβ. <span class="art-arrow" id="arr_${aid}">▶</span></span>
    </div>
    <div class="art-body" id="${aid}" style="display:none">
      ${(()=>{if(isTruckLaw||!artN)return'';const at=ARTICLE_TEXT[artN];if(!at)return'';return`<div class="art-law-box"><div class="art-law-title">📖 ${at.title}</div><div class="art-law-text">${at.text.replace(/\n/g,'<br>')}</div></div>`;})()}
      <div class="grp">${vvs.map(v=>cardHTML(v)).join('')}</div>
    </div>`;
  });
  el.innerHTML=h;
}

35. «Μικτό βάρος»: Το εκάστοτε πραγματικό βάρος του οχήματος στο οποίο συνυπολογίζεται το βάρος του φορτίου, του πληρώματος και των επιβατών.
36. «Μοτοποδήλατο»: ελαφρύ μηχανοκίνητο δίκυκλο, τρίκυκλο ή τετράκυκλο όχημα, με μέγιστη σχεδιαστική ταχύτητα σαράντα πέντε (45) χιλιομέτρων την ώρα. Αυτά τα οχήματα είναι τα εξής:
α) το δίκυκλο μοτοποδήλατο (L1e-B) με κινητήρα κυβισμού μικρότερου από ή ίσου με πενήντα κυβικά εκατοστά (50 cm3), εάν η διάταξη πρόωσης του οχήματος περιλαμβάνει έναν κινητήρα εσωτερικής καύσης επιβαλλόμενης ανάφλεξης (positive ignition PI) ή με κινητήρα μέγιστης συνεχούς ονομαστικής ή καθαρής ισχύος μικρότερης από ή ίσης με τέσσερα κιλοβάτ (4 kW),
β) το τρίκυκλο μοτοποδήλατο (L2e): τρίκυκλα με κινητήρα κυβισμού μικρότερου από ή ίσου με πενήντα κυβικά εκατοστά (50 cm3) με κυβισμό κινητήρα μικρότερου από ή ίσου με πενήντα κυβικά εκατοστά (50 cm3) για κινητήρα PI ή μικρότερου από ή ίσου με πεντακόσια κυβικά εκατοστά (500 cm3) για κινητήρα ανάφλεξης με συμπίεση (compression ignition CI) ή με κινητήρα μέγιστης συνεχούς ονομαστικής ή καθαρής ισχύος μικρότερης από ή ίσης με τέσσερα κιλοβάτ (4 kW) και μάζα σε κατάσταση ετοιμότητας προς κυκλοφορία μικρότερης από διακόσια εβδομήντα (270) χιλιόγραμμα (kg) και τα οποία διαθέτουν έως δύο (2) θέσεις καθίσματος, συμπεριλαμβανομένης της θέσης καθίσματος του οδηγού,
γ) το μηχανοκίνητο δίκυκλο (L1e-A), τρίκυκλο ή τετράκυκλο ποδήλατο: ποδήλατα που έχουν σχεδιαστεί για ποδηλάτηση, με βοηθητική μηχανή πρόωσης για υποβοήθηση της ποδηλάτησης με μέγιστη συνεχή ονομαστική ή καθαρή ισχύ μικρότερη από ή ίση με ένα κιλοβάτ (1 kW) και διακοπή της ισχύος της σε ταχύτητες οχήματος μικρότερες από ή ίσες με είκοσι πέντε (25) χιλιόμετρα την ώρα,
δ) το ελαφρύ τετράκυκλο (L6e), με μάζα σε κατάσταση ετοιμότητας προς κυκλοφορία μικρότερης από ή ίσης με τετρακόσια είκοσι πέντε χιλιόγραμμα (425 kg) με κυβισμό κινητήρα μικρότερου από ή ίσου με πενήντα κυβικά εκατοστά (50 cm3) για κινητήρα PI ή μικρότερου από ή ίσου με πεντακόσια κυβικά εκατοστά (500 cm3) για κινητήρα CI και διαθέτουν έως δύο (2) θέσεις καθίσματος, συμπεριλαμβανομένης της θέσης καθίσματος του οδηγού. Ως «καθαρή ισχύς» λογίζεται η μέγιστη συνεχής ονομαστική ισχύς για τα ηλεκτροκίνητα οχήματα και η μέγιστη καθαρή ισχύς για τα οχήματα με κινητήρα καύσης.
37. «Μοτοσικλέτα»: Κάθε δίτροχο μηχανοκίνητο όχημα με ή χωρίς καλάθι, του οποίου είτε η μέγιστη εκ κατασκευής ταχύτητα είναι μεγαλύτερη των σαράντα πέντε (45) χιλιομέτρων την ώρα είτε, εάν είναι εξοπλισμένο με κινητήρα εσωτερικής καύσης, ο κυλινδρισμός του κινητήρα είναι μεγαλύτερος των πενήντα κυβικών εκατοστών (50 cm3).
38. «Νησίδα ασφαλείας»: Το υπερυψωμένο τμήμα οδοστρώματος που προορίζεται είτε για καταφύγιο των πεζών είτε για την αποβίβαση επιβίβαση επιβατών σε συγκοινωνιακά μέσα.`},
  5: {title:`Εισαγωγή σε κυκλοφορία ή χρήση μη νόμιμου μέσου`,text:`ΜΕΡΟΣ Β’ ΣΗΜΑΝΣΗ - ΣΗΜΑΤΟΔΟΤΗΣΗ - ΟΔΙΚΗ ΣΥΜΠΕΡΙΦΟΡΑ ΚΕΦΑΛΑΙΟ Α’ ΣΗΜΑΝΣΗ - ΔΙΑΓΡΑΜΜΙΣΗ - ΣΗΜΑΤΟΔΟΤΗΣΗ
Εισαγωγή σε κυκλοφορία ή χρήση μη νόμιμου μέσου
1. Η κυκλοφορία μεταφορικών ή άλλων χρήσεων μέσων που δεν ορίζονται στο άρθρο 4, περί ορισμών, απαγορεύεται.
2. Η παράβαση γι’ αυτόν που θέτει σε κυκλοφορία και που οδηγεί το μεταφορικό ή άλλης χρήσεως μέσο κατά παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε2-Α.

  6: {title:`Υποδείξεις και σήματα που δίνουν οι τροχονόμοι`,text:`Υποδείξεις και σήματα που δίνουν οι τροχονόμοι
1. Αυτοί που χρησιμοποιούν τις οδούς συμμορφώνονται αμέσως με τις πιο κάτω υποδείξεις και σήματα που δίνουν οι τροχονόμοι, όταν ρυθμίζουν την κυκλοφορία:
α) βραχίονας υψωμένος κατακόρυφα, σημαίνει: προσοχή, διακοπή πορείας για όλους που χρησιμοποιούν την οδό, από όλες τις κατευθύνσεις πλην των οδηγών οι οποίοι δεν μπορούν να διακόψουν την πορεία του οχήματός τους αμέσως και ασφαλώς. Αν το σήμα αυτό δίνεται σε οδικό κόμβο, δεν απαιτείται τα οχήματα που βρίσκονται στον κόμβο να διακόψουν την πορεία τους.
β) βραχίονας ή βραχίονες τεντωμένοι οριζόντια σημαίνει: διακοπή πορείας για όλους που χρησιμοποιούν την οδό και πλησιάζουν από οποιαδήποτε κατεύθυνση η οποία διέρχεται κάθετα προς την οριζόμενη με τον τεντωμένο βραχίονα ή βραχίονες κατεύθυνση. Ο τροχονόμος που ρυθμίζει την κυκλοφορία μπορεί, αφού δώσει το σήμα αυτό, να κατεβάσει τον βραχίονα ή τους βραχίονές του. Η στάση αυτή σημαίνει ομοίως διακοπή πορείας γι’ αυτούς που κινούνται κατά μέτωπο και από πίσω από τον τροχονόμο.
γ) κίνηση του χεριού προς ορισμένη κατεύθυνση σημαίνει: κίνηση των οχημάτων προς την υποδεικνυόμενη κατεύθυνση.
δ) κινούμενο ερυθρό φως σημαίνει: διακοπή πορείας γι’ αυτούς που χρησιμοποιούν την οδό προς τους οποίους κατευθύνεται το φως.
2. Οι τροχονόμοι, όταν οι ανάγκες της κυκλοφορίας το απαιτούν, μπορούν να επιβάλλουν επιτάχυνση ή επιβράδυνση της κυκλοφορίας, καθώς και διακοπή ή αλλαγή πορείας οχημάτων ή πεζών.
3. Οι υποδείξεις και τα σήματα που δίνονται από τους τροχονόμους που ρυθμίζουν την κυκλοφορία υπερισχύουν των φωτεινών σηματοδοτών ρύθμισης της κυκλοφορίας ή των πινακίδων σήμανσης στις οδούς ή των διαγραμμίσεων ή συμβόλων στις οδούς, καθώς και των κανόνων κυκλοφορίας γενικά. Η ρύθμιση της κυκλοφορίας από τροχονόμο, με τρόπο αντίθετο από ενδείξεις των φωτεινών σηματοδοτών, γίνεται σε εξαιρετικές μόνο περιπτώσεις λήψης ειδικών και εκτάκτων μέτρων. Αν δεν είναι δυνατόν, μετά από προηγούμενη ειδοποίηση του τροχονόμου, να σβήσουν οι φωτεινοί σηματοδότες, η ως άνω ρύθμιση γίνεται με σήματα προς τους χρήστες της οδού και αφού βεβαιωθεί ο τροχονόμος ότι από την ενέργειά του αυτή δεν προκαλείται κίνδυνος ατυχημάτων.
4. Οι τροχονόμοι, όταν ρυθμίζουν την κυκλοφορία, πρέπει να διακρίνονται ευκρινώς από απόσταση τόσο κατά τη νύχτα όσο και κατά την ημέρα. 5. H παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε2-Β.`},
  7: {title:`Σήμανση οδών με πινακίδες`,text:`Σήμανση οδών με πινακίδες
1. Οι πινακίδες οι οποίες τοποθετούνται για τη σήμανση των οδών ανήκουν στις εξής κατηγορίες:
α) Αναγγελίας κινδύνου (Κ), δηλωτικές:
αα) επικίνδυνων θέσεων,
αβ) προσβάσεων οδικών κόμβων,
αγ) προσβάσεων ισόπεδων σιδηροδρομικών διαβάσεων ή διαβάσεων τροχιοδρόμου,
β) Ρυθμιστικές της κυκλοφορίας (Ρ), δηλωτικές:
βα) προτεραιότητας,
ββ) απαγορεύσεων ή περιορισμών,
βγ) υποχρεώσεων.
γ) Πληροφοριακές (Π), δηλωτικές:
γα) προειδοποίησης κατευθύνσεων,
γβ) κατευθύνσεων,
γγ) αριθμήσεων οδών και χιλιομετρήσεων,
γδ) τοπωνυμιών,
γε) επιβεβαιώσεων,
γστ) χρήσιμων πληροφοριών για τους οδηγούς οχημάτων και
γζ) εγκαταστάσεων.
δ) Πρόσθετες (Πρ).
2. Οι πινακίδες αναγγελίας κινδύνου (Κ-1 μέχρι και Κ-44) τοποθετούνται για να εφιστούν την προσοχή αυτών που χρησιμοποιούν τις οδούς για τους κινδύνους που υπάρχουν στην οδό προς την κατεύθυνση της κίνησής τους, ώστε να λαμβάνουν έγκαιρα τα κατάλληλα μέτρα και, σε περίπτωση ανάγκης, να μειώνουν την ταχύτητα πορείας τους για να τους αποφεύγουν. Η σημασία των πινακίδων αυτών είναι:
α) Κ-1α: Επικίνδυνη αριστερή στροφή.
β) Κ-1δ: Επικίνδυνη δεξιά στροφή.
γ) Κ-2α: Επικίνδυνες δύο αντίρροπες ή διαδοχικές (συνεχείς) στροφές, η πρώτη αριστερά.
δ) Κ-2δ: Επικίνδυνες δύο αντίρροπες ή διαδοχικές (συνεχείς) στροφές, η πρώτη δεξιά.
ε) Κ-3: Επικίνδυνη κατωφέρεια (με κλίση ως η αναγραφόμενη στην πινακίδα).
στ) Κ-4: Απότομη ανωφέρεια (με κλίση ως η αναγραφόμενη στην πινακίδα).
ζ) Κ-5: Επικίνδυνη στένωση οδοστρώματος και στις δύο πλευρές.
η) Κ-6α: Επικίνδυνη στένωση οδοστρώματος στην αριστερή πλευρά.
θ) Κ-6δ: Επικίνδυνη στένωση οδοστρώματος στη δεξιά πλευρά.
ι) Κ-7: Κινητή γέφυρα.
ια) Κ-8: Η οδός οδηγεί σε αποβάθρα ή όχθη ποταμού.
ιβ) Κ-9: Επικίνδυνο ανώμαλο οδόστρωμα, σε κακή κατάσταση, με λάκκους, κ.λπ.
ιγ) Κ-10: Επικίνδυνο υπερυψωμένο οδόστρωμα ή απότομη κυρτή αλλαγή της κατά μήκος κλίσης της οδού.
ιδ) Κ-11: Επικίνδυνο κάθετο ρείθρο (αυλάκι) ή απότομη κοίλη αλλαγής της κατά μήκος κλίσης της οδού.
ιε) Κ-12: Ολισθηρό οδόστρωμα.
ιστ) Κ-13: Επικίνδυνη εκτίναξη χαλίκων (ασύνδετο αμμοχάλικο).
ιζ) Κ-14: Κίνδυνος από πτώση βράχων και από την παρουσία τους στο οδόστρωμα.
ιη) Κ-15: Κίνδυνος λόγω διάβασης πεζών.
ιθ) Κ-16: Κίνδυνος λόγω συχνής κίνησης παιδιών (σχολεία, γήπεδα, κ.λπ.).
κ) Κ-17: Κίνδυνος λόγω συχνής εισόδου ή διάβασης ποδηλατιστών.
κα) Κ-18: Κίνδυνος από τη διέλευση οικόσιτων ζώων.
κβ) Κ-19: Κίνδυνος από τη διέλευση άγριων ζώων.
κγ) Κ-20: Κίνδυνος λόγω εκτελούμενων εργασιών στην οδό.
κδ) Κ-21: Προσοχή, κόμβος ή θέση όπου η κυκλοφορία ρυθμίζεται με τρίχρωμη φωτεινή σηματοδότηση.
κε) Κ-22: Κίνδυνος λόγω χαμηλής πτήσης προσγειούμενων ή απογειούμενων αεροσκαφών. κστ) Κ-23: Κίνδυνος λόγω συχνού ισχυρού ανέμου (που έχει την κατεύθυνση που δείχνει το ανεμούριο).
κζ) Κ-24: Προαναγγελία διπλής κυκλοφορίας. Η πινακίδα αυτή σημαίνει επικείμενη είσοδο από μονόδρομο ή από τμήμα οδού που περιλαμβάνει δύο καταστρώματα χωρισμένα ανά κατεύθυνση με μεσαία διαχωριστική νησίδα, σε τμήμα οδού με κυκλοφορία επί του αυτού οδοστρώματος προς τις δύο κατευθύνσεις, προσωρινά ή μόνιμα.
κη) Κ-25: Προσοχή, άλλοι κίνδυνοι (μη δηλούμενοι στις πινακίδες Κ-1 έως Κ-24).
κθ) Κ-26: Προσοχή, διασταύρωση όπου ισχύει η προτεραιότητα από δεξιά.
λ) Κ-27: Διασταύρωση με οδό, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.
λα) Κ-28α: Διακλάδωση με κάθετη οδό αριστερά, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.
λβ) Κ-28δ: Διακλάδωση με κάθετη οδό δεξιά, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.
λγ) Κ-29α: Διακλάδωση με λοξή οδό αριστερά, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.
λδ) Κ-29δ: Διακλάδωση με λοξή οδό δεξιά, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.
λε) Κ-30: Προσέγγιση σε κυκλική υποχρεωτική πορεία. λστ) Κ-31: Κίνδυνος λόγω ισόπεδης σιδηροδρομικής διάβασης ή διάβασης τροχιοδρόμου με κινητά φράγματα.
λζ) Κ-32: Κίνδυνος λόγω ισόπεδης σιδηροδρομικής διάβασης χωρίς κινητά φράγματα.
λη) Κ-33, Κ-34, Κ-35: Πρόσθετες επαναληπτικές πινακίδες στις προσβάσεις ισόπεδων σιδηροδρομικών διαβάσεων ή κινητών γεφυρών, οι οποίες δηλώνουν την προσέγγιση σε αυτές.
λθ) Κ-36: Κίνδυνος λόγω άμεσης γειτονιάς ισόπεδης σιδηροδρομικής διάβασης, χωρίς κινητά φράγματα, μονής σιδηροδρομικής γραμμής ή διάβασης τροχιοδρόμου.
μ) Κ-37: Κίνδυνος λόγω άμεσης γειτονίας ισόπεδης σιδηροδρομικής διάβασης, χωρίς κινητά φράγματα, δι πλής ή πολλαπλής σιδηροδρομικής γραμμής ή διάβασης τροχιοδρόμου.
μα) Κ-38α: Επικίνδυνο έρεισμα αριστερά.
μβ) Κ-38δ: Επικίνδυνο έρεισμα δεξιά.`},
  8: {title:`Οριζόντια σήμανση οδών, υποχρεώσεις οδηγών, κατηγορίες παραβάσεων`,text:`Οριζόντια σήμανση οδών, υποχρεώσεις οδηγών, κατηγορίες παραβάσεων
1. Οι σημάνσεις των οδοστρωμάτων με διαγραμμίσεις ή αναγραφή λέξεων ή απεικόνιση συμβόλων χρησιμοποιούνται για τη ρύθμιση της κυκλοφορίας ή για την προειδοποίηση ή καθοδήγηση αυτών που χρησιμοποιούν οδούς, είτε μόνες είτε σε συνδυασμό με πινακίδες σήμανσης ή σηματοδότες για να τονιστεί ή να διευκρινιστεί η σημασία αυτών. Όταν χρησιμοποιούνται για ρύθμιση της στάθμευσης, σε συνδυασμό με ανάλογες πινακίδες, υπερισχύουν των πινακίδων στάθμευσης. Οι διαγραμμίσεις οδών, που προορίζονται για κινούμενα οχήματα, πρέπει να αναγνωρίζονται εύκολα και έγκαιρα από τους οδηγούς και να είναι ορατές τόσο κατά την ημέρα όσο και κατά τη νύχτα.
2. Τα κύρια είδη των σημάνσεων επί των οδοστρωμάτων με διαγραμμίσεις είναι οι:
α) οι κατά μήκος διαγραμμίσεις,
β) οι κατά πλάτος (εγκάρσιες) διαγραμμίσεις και
γ) οι ειδικές διαγραμμίσεις.
3. Οι κατά μήκος διαγραμμίσεις είναι:
α) η αποτελούμενη από μία (1) ή δύο (2) συνεχείς γραμμές η οποία σημαίνει διαχωρισμό των λωρίδων αντίθετων κατευθύνσεων,
β) η αποτελούμενη από μία (1) διακεκομμένη γραμμή επί του οδοστρώματος, η οποία καθορίζει τα όρια των λωρίδων για την καθοδήγηση της κυκλοφορίας,
γ) η αποτελούμενη από μία (1) διακεκομμένη γραμμή, διπλάσιου πλάτους της προηγούμενης, η οποία καθορίζει τα όρια μεταξύ της λωρίδας επιτάχυνσης ή επιβράδυνσης και της παράπλευρης λωρίδας κυκλοφορίας,
δ) η αποτελούμενη από μία (1) διακεκομμένη γραμμή επί του οδοστρώματος με μήκη τμημάτων και των μεταξύ τους κενών, πολύ μικρότερα της διακεκομμένης γραμμής της περ. β’, η οποία σημαίνει προειδοποίηση για την προσέγγιση σε διπλή ή συνεχή γραμμή ή για την προσέγγιση σε άλλο τμήμα οδού, το οποίο παρουσιάζει ιδιαίτερο κίνδυνο.Η προειδοποιητική αυτή γραμμή μπορεί να συμπληρωθεί ή να αντικατασταθεί με βέλη εκτροπής,
ε) η αποτελούμενη από μία (1) συνεχή γραμμή και άλλη παράπλευρα διακεκομμένη, η οποία σημαίνει διαχωρισμό των λωρίδων αντίθετων κατευθύνσεων,
στ) η αποτελούμενη από διπλές διακεκομμένες γραμμές, η οποία καθορίζει λωρίδα ή λωρίδες κυκλοφορίας στις οποίες η κατεύθυνση της κυκλοφορίας μπορεί να αντιστραφεί.
4. Οι κατά πλάτος (εγκάρσιες) διαγραμμίσεις είναι:
α) η γραμμή διακοπής πορείας, αποτελούμενη από μία (1) συνεχή γραμμή επί του πλάτους μίας (1) ή περισσοτέρων λωρίδων κυκλοφορίας, η οποία καθορίζει τη θέση πριν από την οποία οι οδηγοί είναι υποχρεωμένοι να διακόψουν την πορεία τους:
αα) λόγω της πινακίδας «Ρ-2: υποχρεωτική διακοπή πορείας». Η λέξη «STOP» μπορεί να αναγράφεται επί του οδοστρώματος πριν από τις πιο πάνω διαγραμμίσεις,
αβ) λόγω ένδειξης φωτεινού σηματοδότη,
αγ) λόγω σήματος τροχονόμου, ή
αδ) πριν από σιδηροδρομική διάβαση,
β) η αποτελούμενη από μία (1) διακεκομμένη γραμμή επί του πλάτους μίας (1) ή περισσοτέρων λωρίδων κυκλοφορίας, η οποία καθορίζει τη θέση πριν από την οποία οι οδηγοί οχημάτων οφείλουν να παραχωρούν προτεραιότητα, συμμορφούμενοι προς την πινακίδα «Ρ-1: «υποχρεωτική παραχώρηση προτεραιότητας». Μπροστά από αυτή τη διακεκομμένη γραμμή μπορεί να σημειωθεί επί του οδοστρώματος, για να συμβολίζει την πινακίδα «Ρ-1: υποχρεωτική παραχώρηση προτεραιότητας», μεγάλο τρίγωνο με τη μία (1) πλευρά παράλληλη προς τη διακεκομμένη γραμμή και την απέναντι αυτής κορυφή προς τον υποχρεούμενο να παραχωρήσει προτεραιότητα. Η διακεκομμένη αυτή γραμμή μπορεί να αντικατασταθεί με περισσότερα του ενός (1) τρίγωνα σημειούμενα το ένα (1) κοντά στο άλλο επί του οδοστρώματος, με τη μία (1) πλευρά καθενός εξ αυτών παράλληλη προς τη διακεκομμένη γραμμή και την απέναντι αυτής κορυφή προς τον οδηγό ο οποίος υποχρεούται να παραχωρήσει προτεραιότητα,
γ) η διάβαση πεζών (ZEBRA), αποτελούμενη από ραβδώσεις μεγάλου πλάτους, παράλληλες προς τον άξονα του οδοστρώματος,
δ) η διάβαση ποδηλάτων, αποτελούμενη από τετράγωνα ή παραλληλόγραμμα σχήματα,
ε) η επιφάνεια αναμονής ποδηλάτων, Ε.Π.Η.Ο., μοτοσικλετών και μοτοποδηλάτων, αποτελούμενη από δύο (2) συνεχείς παράλληλες γραμμές, σε απόσταση τεσσάρων (4) έως πέντε (5) μέτρων μεταξύ τους. Η επιφάνεια αναμονής διαμορφώνεται σε σηματοδοτούμενες διασταυρώσεις μπροστά από τη γραμμή υποχρεωτικής διακοπής πορείας των οχημάτων και σημαίνεται με τα σύμβολα των οχημάτων του προηγούμενου εδαφίου. Για τα οχήματα αυτά, η επιφάνεια αναμονής είναι κοινή. Σε περίπτωση ύπαρξης λωρίδας ποδηλάτου, αυτή καταλήγει στην επιφάνεια αναμονής και είναι χρωματισμένη στο ίδιο χρώμα με αυτή.
5. Οι ειδικές διαγραμμίσεις είναι:
α) η αποτελούμενη από παράλληλες λοξές λωρίδες, οι οποίες πλαισιώνονται από μία (1) συνεχή ή διακεκομμένη γραμμή επί τμήματος ή επί ελαφρώς ανυψωμένης περιοχής του οδοστρώματος και η οποία σημαίνει απαγόρευση ή περιορισμό εισόδου οχημάτων στις περιοχές αυτές,
β) η τεθλασμένη κίτρινη γραμμή (ζιγκ-ζαγκ) στην πλευρά του οδοστρώματος, η οποία σημαίνει ότι σε όλο το μήκος της γραμμής επί της πλευράς αυτής απαγορεύεται η στάθμευση, ανεξαρτήτως της παράλληλης οδικής σήμανσης με κατακόρυφες πινακίδες απαγορευτικές της στάσης και της στάθμευσης και των απαγορεύσεων του άρθρου 38, περί στάσης και στάθμευσης. Διακοπή της τεθλασμένης γραμμής που συνοδεύεται από την αναγραφή της λέξης «ΛΕΩΦΟΡΕΙΟ» ή απεικόνιση λεωφορείου μπορεί να χρησιμοποιείται για την υπόδειξη αποκλειστικά στάσης λεωφορείου ή ηλεκτροκίνητου λεωφορείου,
γ) συνεχής κίτρινη γραμμή στο κράσπεδο ή στην άκρη του οδοστρώματος, η οποία σημαίνει ότι σε όλο το μήκος της και προς την πλευρά αυτή του οδοστρώματος απαγορεύεται η στάση και στάθμευση των οχημάτων, ανεξαρτήτως της παράλληλης οδικής σήμανσης με κατακόρυφες πινακίδες απαγορευτικές της στάσης και της στάθμευσης και των απαγορεύσεων στάθμευσης του άρθρου 38,
δ) διακεκομμένη κίτρινη γραμμή στο κράσπεδο ή στο άκρο του οδοστρώματος, η οποία σημαίνει ότι σε όλο το μήκος της γραμμής και επί της πλευράς αυτής του οδοστρώματος απαγορεύεται ή υπόκειται σε περιορισμούς η στάθμευση, όπως υποδεικνύεται με άλλα μέσα. Αν χρησιμοποιείται η γραμμή αυτή προς ένδειξη απαγόρευσης ή περιορισμών της στάσης ή στάθμευσης πρέπει, εφόσον υπάρχει λευκή γραμμή που υποδεικνύει το άκρο του οδοστρώματος, να βρίσκεται εξωτερικώς και παραπλεύρως της λευκής γραμμής,
ε) πλέγμα κίτρινων γραμμών, οι οποίες σχηματίζουν παραλληλόγραμμα, σε ισόπεδους οδικούς κόμβους, το οποίο σημαίνει περιοχή μέσα στην οποία δεν μπορεί να εισέλθει όχημα και αν ακόμη οι φωτεινοί σηματοδότες επιτρέπουν αυτό, όταν η πυκνότητα της κυκλοφορίας είναι τέτοια ώστε, αν εισέλθει, να υποχρεωθεί πιθανώς να παραμείνει στη διασταύρωση. Η παρ. 2 του άρθρου 30, περί ισόπεδων οδικών κόμβων και υποχρεώσεων παραχώρησης προτεραιότητας, εξακολουθεί να ισχύει και αν ακόμη δεν υπάρχει η πιο πάνω διαγράμμιση,
στ) συνεχής ή διακεκομμένη γραμμή που προσδιορίζει λωρίδα κυκλοφορίας που συνοδεύεται από πινακίδες σήμανσης ή αναγραφή λέξεων ή απεικόνιση συμβόλων στο οδόστρωμα, όπως λεωφορεία, «ΤΑΞΙ» και ποδήλατα, η οποία σημαίνει ότι η χρήση της λωρίδας κυκλοφορίας επιτρέπεται μόνο στα αναγραφόμενα ή απεικονιζόμενα οχήματα,
ζ) βέλη εκτροπής, βέλη επιλογής, παράλληλες ή λοξές λωρίδες, πικτογράμματα ή αναγραφές μπορούν να χρησιμοποιούνται για την επανάληψη των δεδομένων από πινακίδες οδηγιών ή για να δίνουν σε αυτούς που χρησιμοποιούν τις οδούς πληροφορίες, οι οποίες δεν μπορούν να δοθούν ικανοποιητικά με πινακίδες. Τέτοιες διαγραμμίσεις χρησιμοποιούνται ιδίως για να δείχνουν τις οριογραμμές ζωνών ή λωρίδων στάθμευσης, για να σημειώσουν στάσεις λεωφορείων και για την προεπιλογή λωρίδας κυκλοφορίας, μπροστά από διασταυρώσεις. Αν υπάρχει βέλος επιλογής στο οδόστρωμα, όπου αυτό είναι χωρισμένο σε λωρίδες κυκλοφορίας με κατά μήκος διαγραμμίσεις, οι οδηγοί υποχρεούνται να επιλέγουν έγκαιρα τη λωρίδα η οποία φέρει το βέλος της κατεύθυνσης την οποία θέλουν να ακολουθήσουν και δεν μπορούν πλέον να πάρουν άλλη κατεύθυνση,
η) περιγράμματα ρόμβων κατά αποστάσεις στο μέσο λωρίδας κυκλοφορίας, τα οποία σημαίνουν ότι η λωρίδα αυτή έχει καθοριστεί ως αμέσου ανάγκης, σύμφωνα με την παρ. 3 του άρθρου 48, περί οχημάτων άμεσης ανάγκης και έργων στις οδούς.
6. Δεν θεωρούνται ως κατά μήκος διαγραμμίσεις, με την έννοια του παρόντος:
α) οι κατά μήκος γραμμές που χρησιμοποιούνται ως οριογραμμές των άκρων του οδοστρώματος, για να καταστούν αυτά ευκολότερα ορατά,
β) οι κατά μήκος γραμμές που συνδέονται με τέτοιες καθέτους οι οποίες χρησιμοποιούνται για την οριοθέτηση χώρων στάθμευσης στο οδόστρωμα και κατά μήκος γραμμές που δείχνουν απαγορεύσεις ή περιορισμούς στις στάσεις ή στις σταθμεύσεις.
7. Οι διαγραμμίσεις των οδών είναι λευκές, εκτός από:
α) τις διαγραμμίσεις χώρων όπου επιτρέπεται ή περιορίζεται η στάθμευση, οι οποίες μπορούν να είναι κυανές,
β) τις τεθλασμένες γραμμες (ζιγκ-ζαγκ) σε χώρους όπου απαγορεύεται η στάθμευση, οι οποίες είναι κίτρινες,
γ) τη συνεχή ή διακεκομμένη γραμμή στο κράσπεδο ή το άκρο του οδοστρώματος, της απαγορευτικής ή περιοριστικής στάσης ή στάθμευσης, η οποία είναι κίτρινη,
δ) τις γραμμές πλέγματος των διασταυρώσεων της περ. ε) της παρ. 5, οι οποίες είναι κίτρινες. Ως λευκό χρώμα νοούνται και οι αποχρώσεις του αργυρόχρου ή του ανοικτού γκρίζου χρώματος. Σε περίπτωση ανάγκης προσωρινής ακύρωσης των μόνιμων διαγραμμίσεων με αντικατάσταση με άλλες, οι προσωρινές αυτές διαγραμμίσεις πρέπει να είναι χρώματος άλλου από το συνήθως χρησιμοποιούμενο και από υλικό το οποίο δύναται να εξαλείφεται εύκολα. Για τις προσωρινές διαγραμμίσεις οδών, μπορεί να χρησιμοποιούνται κατάλληλα προς τούτο υλικά ή αντικείμενα όπως είναι, ενδεικτικά, οι ανακλαστήρες, οι φωτεινοί δείκτες και οι κώνοι, οι προδιαγραφές των οποίων καθορίζονται σύμφωνα με την παρ. 5 του άρθρου 14, περί εγκατάστασης μέσων σήμανσης και σηματοδότησης.
8. Απαγορεύεται οι οδηγοί των οδικών οχημάτων:
α) να διαβαίνουν την εκ μίας (1) ή δύο (2) συνεχών γραμμών, κατά μήκος, διαγράμμιση, καθώς και να κινούνται στην αριστερή πλευρά αυτής,
β) να διαβαίνουν την εκ διπλών διακεκομμένων γραμμών, κατά μήκος, διαγράμμιση, καθώς και να κινούνται στην αριστερή πλευρά αυτής, όταν η διαγράμμιση αυτή διαχωρίζει τις δύο (2) κατευθύνσεις,
γ) σε μία (1) συνεχή γραμμή και άλλη παραπλεύρως διακεκομμένη, να διαβαίνουν τη συνεχή γραμμή, όταν κινούνται επί της πλευράς αυτής, επιτρεπόμενης της κίνησης και της προσπέρασης από την πλευρά της διακεκομμένης. Στην περίπτωση αυτή, η συνεχής γραμμή δεν εμποδίζει τον οδηγό ο οποίος προσπέρασε κατά τον επιτρεπόμενο τρόπο να επανέλθει στην κανονική του θέση επί του οδοστρώματος,
δ) να κινούνται πάνω σε κατά μήκος διαγραμμίσεις (ιππαστί), με την επιφύλαξη της περ. β) της παρ. 9 του άρθρου 21, περί προσπέρασης, κυκλοφορίας σε στοίχους, επιτρεπτής αλλαγής λωρίδας και κίνησης μοτοποδηλάτων και μοτοσυκλετών σε πυκνή κυκλοφορία,
ε) να υπερβαίνουν τη διαγράμμιση μιας συνεχούς γραμμής κατά πλάτος σε περίπτωση υποχρεωτικής διακοπής πορείας,
στ) να υπερβαίνουν τη διαγράμμιση μιας διακεκομμένης γραμμής κατά πλάτος σε περίπτωση υποχρεωτικής παραχώρησης προτεραιότητας,
ζ) να εισέρχονται σε περιοχή του οδοστρώματος η οποία προσδιορίζεται με παράλληλες λοξές λωρίδες και πλαισιώνεται με συνεχή γραμμή. Αν η περιοχή αυτή πλαισιώνεται με διακεκομμένη γραμμή, οι οδηγοί επιτρέπεται να εισέρχονται σε αυτή μόνον όταν βεβαιωθούν ότι είναι δυνατό να κάνουν αυτό ασφαλώς ή για να στρίψουν σε οδό η οποία συμβάλλεται στην πλευρά της αντίθετης κατεύθυνσης της κυκλοφορίας,
η) να σταθμεύουν στην πλευρά της οδού που έχει διαγραμμιστεί με κίτρινη τεθλασμένη γραμμή (ζιγκ-ζαγκ),
θ) να σταματούν ή να σταθμεύουν ή να μη συμμορφώνονται με τους περιορισμούς οι οποίοι υποδεικνύονται με άλλα μέσα, κατά περίπτωση επί της πλευράς του οδοστρώματος η οποία έχει τη συνεχή ή διακεκομμένη κίτρινη γραμμή στο κράσπεδο ή το άκρο του οδοστρώματος σε όλο το μήκος της γραμμής αυτής,
ι) να κινούνται μέσα σε λωρίδα κυκλοφορίας, η οποία έχει πινακίδες σήμανσης ή λέξεις ή σύμβολα επί του οδοστρώματος, όπως λεωφορεία, ταξί και ποδήλατα, αν δεν οδηγούν οχήματα της κατηγορία αυτής,
ια) να ακολουθούν στις διασταυρώσεις άλλη κατεύθυνση από αυτήν που δείχνουν τα βέλη επιλογής, αν κινούνται σε λωρίδα κυκλοφορίας προδιαλογής η οποία έχει τα βέλη αυτά,
ιβ) να εισέρχονται σε περιοχή οδοστρώματος η οποία έχει σημανθεί με πλέγμα κίτρινων γραμμών οι οποίες σχηματίζουν παραλληλόγραμμα, αν η πυκνότητα της κυκλοφορίας είναι τέτοια ώστε, αν εισέλθουν, να υποχρεωθούν, πιθανώς, να παραμείνουν στη διασταύρωση,
ιγ) να διαβαίνουν σε οδούς ταχείας κυκλοφορίας, τις διακεκομμένες κατά μήκος γραμμές, εκτός από την περίπτωση αλλαγής λωρίδας κυκλοφορίας,
ιδ) να παραμένουν, σε περίπτωση υποχρεωτικής διακοπής πορείας, σε επιφάνεια αναμονής της περ. ε) της παρ. 4, εφόσον δεν οδηγούν όχημα που σημαίνεται στην επιφάνεια αυτή.
9. Αν τα άκρα του οδοστρώματος διαγραμμίζονται μέσω φώτων ή αντανακλαστικών στοιχείων, τα φώτα ή αντανακλαστικά στοιχεία είναι:
α) είτε όλα λευκού ή ανοιχτού κίτρινου χρώματος,
β) είτε λευκού ή κίτρινου χρώματος, προς διαγράμμιση του αντίθετου προς την κατεύθυνση της κυκλοφορίας άκρου του οδοστρώματος, και ερυθρού ή σκούρου κίτρινου χρώματος, προς διαγράμμιση του αντίστοιχου προς την κατεύθυνση της κυκλοφορίας άκρου του οδοστρώματος. Η χάραξη και η σχεδίαση των διαγραμμίσεων των οδών εκτελούνται με βάση τις προδιαγραφές διαγραμμίσεων οδών της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών.
10. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Β, εκτός από εκείνες:
α) των περ. α), β), γ),`},
  9: {title:`Φωτεινή σηματοδότηση για την κυκλοφορία οχημάτων`,text:`Φωτεινή σηματοδότηση για την κυκλοφορία οχημάτων
1. Οι οδηγοί των οδικών οχημάτων συμμορφώνονται με τις πιο κάτω ενδείξεις των φωτεινών σηματοδοτών ρύθμισης της κυκλοφορίας, εκτός αν η ρύθμιση γίνεται από τροχονόμο κατά διαφορετικό τρόπο:
α) σταθερό πράσινο φως κυκλικής μορφής: O οδηγός προχωρεί κατευθείαν μπροστά ή στρίβει προς τα δεξιά ή αριστερά, εκτός αν άλλο σήμα ή πινακίδα απαγορεύει την κατευθείαν κίνηση ή στροφή. Ακόμη και αν ο φωτεινός σηματοδότης δείχνει πράσινο φως, ο οδηγός, κινούμενος κατευθείαν μπροστά, παραχωρεί προτεραιότητα σε άλλο όχημα ή πεζό που κινείται ακόμη από προηγούμενη σηματοδότηση, ενώ εάν ο ίδιος στρίβει, παραχωρεί προτεραιότητα στους πεζούς, οι οποίοι κινούνται στην οδό στην οποία πρόκειται να εισέλθει,
β) σταθερό ερυθρό φως κυκλικής μορφής: Ο οδηγός σταματά προ της ειδικής γραμμής διακοπής αυτής ή, αν δεν υπάρχει τέτοια, σε αρκετή απόσταση από τον σηματοδότη, ώστε η σηματοδότηση να είναι σε αυτόν ευχερώς ορατή, και παραμένει σε στάση μέχρις ότου ανάψει το πράσινο φως. Ο οδηγός δεν εισέρχεται στον οδικό κόμβο, ούτε κινείται πάνω στις διαβάσεις πεζών, εάν ο σηματοδότης είναι τοποθετημένος στο μέσο ή στην απέναντι πλευρά του κόμβου,
γ) σταθερό κίτρινο φως κυκλικής μορφής: Ο οδηγός σταματά, όπως και στην περ. β), εκτός εάν βρίσκεται τόσο κοντά στον σηματοδότη, ώστε να μην μπορεί να σταματήσει με ασφάλεια,
δ) απλό ή διπλό κίτρινο φως κυκλικής μορφής, το οποίο αναβοσβήνει (αναλάμπον): Ο οδηγός ανακόπτει ταχύτητα, προχωρεί με ιδιαίτερη προσοχή και παραχωρεί προτεραιότητα στους πεζούς και στα οχήματα,
ε) απλό ερυθρό φως, το οποίο αναβοσβήνει (αναλάμπον), κυκλικής μορφής ή διπλό εναλλασσόμενο στον ίδιο ιστό, στο ίδιο ύψος και προς την ίδια κατεύθυνση, το οποίο υποδηλώνει την ύπαρξη μεγάλου κινδύνου: Ο οδηγός ακινητοποιεί το όχημά του, όπως στην περ. β). Η σηματοδότηση αυτή χρησιμοποιείται μόνο σε ισόπεδες σιδηροδρομικές διαβάσεις, σε προσβάσεις σε κινητές γέφυρες ή αποβάθρες οχηματαγωγών, όταν πυροσβεστικά οχήματα εισέρχονται στην οδό ή πλησιάζουν αεροσκάφη, τα οποία θα διέλθουν σε χαμηλό ύψος πάνω από την οδό,
στ) πράσινο φως με μορφή ενός ή περισσοτέρων βελών: Ο οδηγός μπορεί να προχωρήσει μόνο προς την κατεύθυνση που δείχνει το βέλος ή τα βέλη. Βέλος το οποίο δείχνει προς τα πάνω σημαίνει υποχρεωτική κίνηση κατευθείαν μπροστά.
ζ) σηματοδότης τρίχρωμου συστήματος, ο οποίος περιλαμβάνει ένα (1) ή περισσότερα πρόσθετα πράσινα βέλη: Ο οδηγός μπορεί να προχωρεί προς την κατεύθυνση που δείχνει τα βέλος ή τα βέλη, ανεξάρτητα από το χρώμα το οποίο έχει ο σηματοδότης κατά τη στιγμή εκείνη, αφού προηγουμένως εισέλθει στη λωρίδα κυκλοφορίας, η οποία προορίζεται για τα οχήματα που κινούνται προς την κατεύθυνση που δείχνει το βέλος ή τα βέλη. Οδηγός, ο οποίος βρίσκεται μέσα στη λωρίδα κυκλοφορίας που προορίζεται για τα οχήματα που κινούνται προς την κατεύθυνση του βέλους, κινείται προς την κατεύθυνση αυτή, εκτός εάν η διακοπή της πορείας του δεν εμποδίζει την κίνηση των οχημάτων που κινούνται πίσω του στην ίδια λωρίδα. Ο οδηγός επιτρέπεται να προχωρήσει προς την κατεύθυνση που δείχνει το βέλος μόνο αν το επιτρέπουν οι συνθήκες κυκλοφορίας στην οδό στην οποία πρόκειται να εισέλθει και δεν εκτίθενται σε κίνδυνο οι πεζοί,
η) ερυθρό φως με μορφή βέλους: Ο οδηγός απαγορεύεται να κινηθεί προς την κατεύθυνση που δείχνει το βέλος και σταματά το όχημά του, όπως στην περ. β).
θ) κίτρινο φως με μορφή βέλους, το οποίο είναι σταθερό ή αναβοσβήνει: Ο οδηγός έχει τις ίδιες υποχρεώσεις όπως και προ κίτρινου φωτός κυκλικής μορφής.
ι) φως με μορφή δύο (2) ράβδων που τέμνονται σε σχήμα «Χ», το οποίο είναι τοποθετημένο πάνω από λωρίδα κυκλοφορίας, σε οδόστρωμα με περισσότερες από δύο (2) λωρίδες, οι οποίες χωρίζονται με κατά μήκος διαγραμμίσεις: Εφόσον το χρώμα του φωτός είναι κόκκινο, απαγορεύεται η χρησιμοποίηση της λωρίδας αυτής. Εφόσον το χρώμα του φωτός είναι πράσινο και έχει τη μορφή ενός βέλους το οποίο δείχνει προς τα κάτω, παρέχεται δικαίωμα κίνησης στη λωρίδα αυτή.
2. Φωτεινοί σηματοδότες οι οποίοι έχουν ένδειξη ποδήλατο, λεωφορείο ή άλλο όχημα στα φώτα ή σηματοδότες με μέγεθος μικρότερο του κανονικού, με ορθογώνια παραλληλόγραμμη πινακίδα που φέρει ένδειξη συγκεκριμένου οχήματος στον ιστό τους, ισχύουν μόνο για τους οδηγούς των αντίστοιχων οχημάτων.
3. Οι παραβάσεις για τον οδηγό των παρ. 1 και 2 κατατάσσονται στην κατηγορία Ε1-Α, εκτός από τις περ. β), ε),
η) και
ι) της παρ. 1, που κατατάσσονται στην κατηγορία Ε4 και για τις οποίες επιβάλλονται στον παραβάτη διοικητικό πρόστιμο επτακοσίων (700) ευρώ και το διοικητικό μέτρο της επί τόπου αφαίρεσης της άδειας οδήγησης για εξήντα (60) ημέρες.`},
  10: {title:`Φωτεινή σηματοδότηση για ποδηλάτες`,text:`Φωτεινή σηματοδότηση για ποδηλάτες
1. Οι ποδηλάτες συμμορφώνονται με τις ενδείξεις των ειδικών για αυτούς φωτεινών σηματοδοτών, εκτός εάν η ρύθμιση της κυκλοφορίας γίνεται από τροχονόμους κατά διαφορετικό τρόπο, ως εξής:
α) σταθερό πράσινο φως με σύμβολο ποδήλατου: Ο ποδηλάτης προχωρεί κατευθείαν μπροστά ή στρίβει προς τα δεξιά ή αριστερά εκτός εάν άλλο σήμα ή πινακίδα απαγορεύει την κατευθείαν κίνηση ή στροφή. Ακόμη και αν ο φωτεινός σηματοδότης έχει πράσινη ένδειξη, ο ποδηλάτης, κινούμενος κατευθείαν μπροστά, παραχωρεί προτεραιότητα σε όχημα ή ποδήλατο ή πεζό που κινείται ακόμη από προηγούμενη σηματοδότηση, ενώ ο ίδιος στρίβει, παραχωρεί προτεραιότητα στους ποδηλάτες ή τους πεζούς οι οποίοι κινούνται στην οδό στην οποία πρόκειται να εισέλθει,
β) σταθερό ερυθρό φως με σύμβολο ποδηλάτου: Ο ποδηλάτης σταματά πριν από την ειδική γραμμή διακοπής πορείας ή, εάν δεν υπάρχει τέτοια, σε αρκετή απόσταση από τον σηματοδότη, ώστε η σηματοδότηση να είναι σε αυτόν ευχερώς ορατή και παραμένει σε στάση μέχρις ότου ανάψει η πράσινη ένδειξη του ποδηλάτη. Ο ποδηλάτης υποχρεούται να μην εισέρχεται στον οδικό κόμβο και να μην κινείται πάνω στις διαβάσεις πεζών ή ποδηλάτων αν o σηματοδότης είναι τοποθετημένος στο μέσο ή στην απέναντι πλευρά του κόμβου,
γ) σταθερό κίτρινο φως με σύμβολο ποδήλατου: O ποδηλάτης σταματά, όπως και στην περ. β), εκτός εάν βρίσκεται τόσο κοντά στον σηματοδότη, ώστε να μην μπορεί να σταματήσει με ασφάλεια,
δ) απλό ή διπλό κίτρινο φως με σύμβολο ποδηλάτου το οποίο αναβοσβήνει (αναλάμπoν): O ποδηλάτης ανακόπτει ταχύτητα, προχωρεί με ιδιαίτερη προσοχή και παραχωρεί προτεραιότητα στους πεζούς, στους ποδηλάτες και στα οχήματα.
ε) πράσινο φως με σύμβολο ποδηλάτου και με ένα (1) ή περισσότερα βέλη από κάτω: Ο ποδηλάτης μπορεί να προχωρήσει μόνο προς την κατεύθυνση που δείχνει το βέλος ή τα βέλη. Βέλος το οποίο δείχνει προς τα πάνω σημαίνει υποχρεωτική κίνηση κατευθείαν μπροστά.
στ) ερυθρό φως με σύμβολο ποδηλάτου και με (1) ένα βέλος από κάτω: Ο ποδηλάτης απαγορεύεται να κινηθεί προς την κατεύθυνση που δείχνει το βέλος και σταματά το ποδήλατό του, όπως και πριν από ερυθρό σύμβολο ποδηλάτου.
ζ) κίτρινο φως με σύμβολο ποδηλάτου και με ένα (1) βέλος από κάτω το οποίο είναι σταθερό ή αναβοσβήνει: Ο ποδηλάτης έχει τις ίδιες υποχρεώσεις, όπως και πριν από κίτρινο σύμβολο ποδηλάτη.
2. Σηματοδότες σε κοινή διάβαση ποδηλάτων και πεζών:
α) πράσινο φως με σύμβολο ατόμου που βαδίζει και με πράσινο σύμβολο ποδηλάτου από κάτω: Οι πεζοί και οι ποδηλάτες μπορούν να διασχίσουν το οδόστρωμα.
β) κόκκινο φως με σύμβολο ατόμου σε στάση και με κόκκινο σύμβολο ποδηλάτου από κάτω: Οι πεζοί και οι ποδηλάτες απαγορεύεται να διασχίσουν το οδόστρωμα.
γ) πράσινο φως με σύμβολο ατόμου που βαδίζει και με πράσινο σύμβολο ποδηλάτου από κάτω που αναβοσβήνει: Οι πεζοί και οι ποδηλάτες μπορούν να διασχίσουν το οδόστρωμα με ιδιαίτερη προσοχή.
3. Σηματοδότες σε αποκλειστική διάβαση ποδηλάτων:
α) πράσινο φως με σύμβολο ποδηλάτου: Οι ποδηλάτες μπορούν να διασχίσουν το οδόστρωμα.
β) κόκκινο φως με σύμβολο ποδηλάτου: Οι ποδηλάτες απαγορεύεται να διασχίσουν το οδόστρωμα.
γ) πράσινο σύμβολο ποδηλάτου, που αναβοσβήνει: Οι ποδηλάτες μπορούν να διασχίσουν το οδόστρωμα, με ιδιαίτερη προσοχή.
4. Αν ο ποδηλάτης καταληφθεί στη διάβαση από την ερυθρά ένδειξη του σηματοδότη του (με το σύμβολο του ποδηλάτη σε στάση), δικαιούται να συνεχίσει την πορεία του προς την απέναντι πλευρά της οδού.
5. Οι φωτεινοί σηματοδότες τοποθετούνται κατακόρυφα με το ερυθρό φως πάντοτε πάνω και το πράσινο φως πάντοτε κάτω.
6. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α, με εξαίρεση τις παραβάσεις των περ. β) και
στ) της παρ. 1, οι οποίες κατατάσσονται στην κατηγορία Ε2-Α.`},

1. Οι πεζοί συμμορφώνονται με τις ενδείξεις των ειδικών για τους ίδιους φωτεινών σηματοδοτών ως ακολούθως, εκτός εάν η ρύθμιση της κυκλοφορίας γίνεται από τροχονόμους κατά διαφορετικό τρόπο.

2. Αν ο πεζός καταληφθεί στη διάβαση από την ερυθρά ένδειξη του σηματοδότη του (με το σύμβολο του ατόμου σε στάση), δικαιούται να συνεχίσει την πορεία του προς την απέναντι πλευρά της οδού.

  12: {title:`Σήμανση ισόπεδων σιδηροδρομικών διαβάσεων`,text:`Σήμανση ισόπεδων σιδηροδρομικών διαβάσεων
1. Στις σιδηροδρομικές διαβάσεις τοποθετούνται, κατά περίπτωση, οι πινακίδες αναγγελίας κινδύνου Κ-31 ή Κ-32, όπως ορίζεται στην παρ. 2 του άρθρου 7, περί σήμανσης οδών με πινακίδες.
2. Στις ισόπεδες σιδηροδρομικές διαβάσεις, χωρίς κινητά φράγματα, η φωτεινή σηματοδότηση τοποθετείται πλησίον και προ της διάβασης και επί του αυτού ιστού τοποθετείται η πινακίδα υποχρεωτικής διακοπής πορείας (Ρ-2) σε συνδυασμό με τις πινακίδες Κ-36 ή Κ-37.`},
  13: {title:`Σήμανση των εργασιών που εκτελούνται στις οδούς`,text:`Σήμανση των εργασιών που εκτελούνται στις οδούς
1. Όταν εκτελούνται στις οδούς εργασίες, όλες οι πινακίδες σήμανσης που απαιτούνται κατά περίπτωση (κινδύνου, ρυθμιστικές, πληροφοριακές) τοποθετούνται σε κατάλληλες θέσεις, σύμφωνα με το άρθρο 14, περί εγκατάστασης μέσων σήμανσης και σηματοδότησης.
2. Τα όρια των εργασιών που εκτελούνται επί του οδοστρώματος και οι χώροι εναπόθεσης υλικών επισημαίνονται με την τοποθέτηση συνεχών ή διακεκομμένων εμποδίων, τα οποία φέρουν εναλλασσόμενες λωρίδες ερυθρού και λευκού χρώματος. Κατά τη νύχτα, εάν τα εμπόδια δεν είναι αντανακλαστικά, με φώτα και αντανακλαστικά στοιχεία, τα αντανακλαστικά στοιχεία και σταθερά φώτα που χρησιμοποιούνται για τον σκοπό αυτό είναι χρώματος ερυθρού, και αν χρησιμοποιηθούν φώτα τα οποία αναβοσβήνουν, έχουν χρώμα βαθύ κίτρινο. Κατ’ εξαίρεση:
α) φώτα και αντανακλαστικά στοιχεία ορατά μόνο από τη μία (1) κατεύθυνση της κυκλοφορίας, τα οποία επισημαίνουν τα όρια οδικών εργασιών επί της απέναντι πλευράς της οδού, είναι λευκά,
β) φώτα και αντανακλαστικά στοιχεία, τα οποία επισημαίνουν τα όρια οδικών εργασιών, οι οποίες διαχωρίζουν τις δύο (2) κατευθύνσεις της κυκλοφορίας, είναι λευκά ή κίτρινα ανοικτού χρώματος.
3. Τα μέσα σήμανσης των παρ. 1 και 2 τοποθετούνται με μέριμνα και ευθύνη των εργοληπτών ή των εκτελούντων τις εργασίες και, σε περίπτωση κατά την οποία οι εργασίες εκτελούνται απολογιστικά, από τον επιβλέποντα το έργο. Οι φορείς που κατασκευάζουν τα διάφορα έργα στις οδούς ή αναθέτουν την κατασκευή τους σε τρίτους ελέγχουν την τοποθέτηση των μέσων σήμανσης.
4. Οι παραβάσεις της παράλειψης τοποθέτησης και συντήρησης των ανωτέρω μέσων σήμανσης, της πλημμελούς τοποθέτησης και της παράλειψης αφαίρεσής τους μετά την ολοκλήρωση των εργασιών του παρόντος κατατάσσονται στην κατηγορία Ε4 και τιμωρούνται με διοικητικό πρόστιμο χιλίων πεντακοσίων (1.500) ευρώ και ποινή φυλάκισης έως δώδεκα (12) μηνών, ανεξαρτήτως εάν η πρόκληση κινδύνου ή ζημιάς ή βλάβης τιμωρείται αυτοτελώς από άλλες διατάξεις.`},
  14: {title:`Εγκατάσταση μέσων σήμανσης και σηματοδότησης`,text:`Εγκατάσταση μέσων σήμανσης και σηματοδότησης
1. Οποίος έχει τις κατά τον παρόντα αρμοδιότητες ή την εξουσία επί του πράγματος, επί του οποίου διεξάγεται δημόσια κυκλοφορία, λαμβάνει κάθε μέτρο, ώστε από τη δημόσια κυκλοφορία να μην προκαλείται κίνδυνος ή ζημία τρίτων προσώπων ή άλλων έννομων αγαθών.
2. Η κατακόρυφη και οριζόντια σήμανση των οδών εκτελείται μόνο κατόπιν σχετικής μελέτης. Αρμόδιοι φορείς για την εκπόνηση ή έγκριση μελετών εφαρμογής, που αφορούν την κατακόρυφη και οριζόντια σήμανση των οδών (πινακίδες και διαγραμμίσεις), για την εγκατάσταση, συντήρηση και διασφάλιση της ορατότητας και αποτελεσματικότητας της σήμανσης αυτής είναι είτε η Γενική Γραμματεία Υποδομών του Υπουργείου Υποδομών και Μεταφορών, είτε οι υπηρεσίες των Οργανισμών Τοπικής Αυτοδιοίκησης Α’ και Β’ βαθμού που έχουν την αρμοδιότητα συντήρησης των οδών, είτε οι φορείς διοίκησης και εκμετάλλευσης λιμένων, κατά περίπτωση. Οι αρμόδιες υπηρεσίες των φορέων αυτών έχουν την υποχρέωση της υλοποίησης, σε εύλογο χρονικό διάστημα και των σχετικών αστυνομικών αποφάσεων. Η Γενική Γραμματεία Υποδομών του Υπουργείου Υποδομών και Μεταφορών ασκεί σε όλη τη χώρα την εποπτεία και παρέχει οδηγίες για θέματα κυκλοφοριακής σήμανσης. Εάν τα αρμόδια όργανα της Γενικής Γραμματείας Υποδομών διαπιστώνουν την ελλιπή ή εσφαλμένη σήμανση ή πλημμελή συντήρηση μέσων σήμανσης από τις προς τούτο αρμόδιες υπηρεσίες, δύνανται να τις καλούν προς εκτέλεση των αναγκαίων ενεργειών εγκατάστασης νέας, απομάκρυνσης ή αντικατάστασης εσφαλμένης σήμανσης, καθώς και συντήρησης μέσων σήμανσης, τάσσοντας σε αυτές σχετική προθεσμία ενέργειας. Εάν η προθεσμία παρέλθει άπρακτη, τα αρμόδια όργανα της Γενικής Γραμματείας Υποδομών δύνανται να προβούν σε όλες τις αναγκαίες ενέργειες καθ’ υποκατάσταση των υπηρεσιών αυτών. Η υποκατάσταση αυτή περιλαμβάνει κάθε πρό σφορη ενέργεια για την εγκατάσταση, απομάκρυνση, αντικατάσταση και συντήρηση των μέσων σήμανσης. Η σχετική δαπάνη βαραίνει τις ανωτέρω υπηρεσίες και εγγράφεται στον προϋπολογισμό τους ως υποχρεωτική δαπάνη, βάσει των σχετικών διατάξεων. Ο Υπουργός Υποδομών και Μεταφορών μπορεί να ακυρώνει αποφάσεις των αρμόδιων υπηρεσιών, που αναφέρονται στα θέματα οδικής σήμανσης και οι οποίες δεν είναι σύμφωνες με τις τεχνικές προδιαγραφές και οδηγίες της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών.
3. Για την εγκατάσταση και λειτουργία των φωτεινών σηματοδοτών, οι οποίοι ρυθμίζουν την κυκλοφορία οχημάτων και πεζών, απαιτείται προηγούμενη εκπόνηση ή έγκριση της σχετικής μελέτης από την αρμόδια υπηρεσία της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών ή από την αρμόδια Διεύθυνση Ελέγχου και Συντήρησης Έργων της Περιφέρειας ή άλλη αρμόδια, κατά νόμο, υπηρεσία.
4. Επιτρέπονται η εγκατάσταση ειδικών μέσων σήμανσης και σηματοδότησης και η δημιουργία ειδικής διαμόρφωσης των χώρων κυκλοφορίας για τη διευκόλυνση της κυκλοφορίας ατόμων με αναπηρία. Τα ειδικά αυτά μέτρα περιλαμβάνουν ιδίως συσκευές εκπομπής ηχητικών σημάτων, δημιουργία ανάγλυφων σημείων επί των χώρων δημόσιας κυκλοφορίας και κάθε άλλο κατάλληλο μέσο, σύμφωνα με τις προδιαγραφές του Υπουργείου Υποδομών και Μεταφορών.
5. Επιτρέπεται ο διαχωρισμός των λωρίδων κυκλοφορίας με κατάλληλη διαμόρφωση και εγκατάσταση εξοπλισμού, ύστερα από έγκριση της αρμόδιας υπηρεσίας της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών ή από την αρμόδια Διεύθυνση Ελέγχου και Συντήρησης Έργων της Περιφέρειας ή άλλη αρμόδια, κατά νόμο, υπηρεσία.
6. Για τη μελέτη, εγκατάσταση και συντήρηση των κάθε είδους σηματοδοτών, ηχητικών συσκευών ή κινητών φραγμάτων στις ισόπεδες σιδηροδρομικές διαβάσεις, αρμόδιες είναι οι υπηρεσίες του φορέα εκμετάλλευσης.
7. Απαγορεύεται η τοποθέτηση πινακίδων σήμανσης ή η χάραξη διαγραμμίσεων, καθώς και η εγκατάσταση σηματοδοτών από άλλους, εκτός από τις παραπάνω καθοριζόμενες αρμόδιες υπηρεσίες. Απαγορεύονται η καταστροφή, παραποίηση, μετάθεση, αλλοίωση και γενικά η με οποιονδήποτε τρόπο επενέργεια στις πινακίδες σήμανσης, στους σηματοδότες και το σύστημα στήριξής τους, στις διαγραμμίσεις πάνω στο οδόστρωμα, καθώς και στις συσκευές ρύθμισης ή μέτρησης της κυκλοφορίας. Για τον καταλογισμό της σχετικής δαπάνης σε βάρος των παραβατών, εφαρμόζεται αναλόγως το άρθρο 51, περί εργασιών και εναπόθεσης υλικών στις οδούς.
8. Απαγορεύεται η εγκατάσταση οποιασδήποτε πινακίδας, αφίσας, διαγράμμισης ή συσκευής, η οποία μπορεί είτε να προκαλέσει σύγχυση με πινακίδες σήμανσης ή με κυκλοφοριακή διαγράμμιση ή με άλλη συσκευή ρύθμισης της κυκλοφορίας, είτε να τις καταστήσει λιγότερο ορατές ή αποτελεσματικές, είτε να προκαλέσει θάμβωση στους χρήστες της οδού και γενικά να αποσπάσει την προσοχή τους με τρόπο που μπορεί να έχει δυσμενή επίδραση στην ασφάλεια της κυκλοφορίας. Οι πινακίδες, οι αφίσες, οι διαγραμμίσεις και οι συσκευές, οι οποίες τοποθετούνται, κατά παράβαση της παρούσας, αφαιρούνται ή εξαλείφονται σύμφωνα με τη διαδικασία που προβλέπεται στην παρ. 3 του άρθρου 18 του ν. 2130/1993 (Α’ 62), περί συμπλήρωσης και τροποποίησης διατάξεων για τις διαφημίσεις. Εάν τα αρμόδια όργανα της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών διαπιστώσουν την παράλειψη άσκησης των αρμοδιοτήτων της παρούσας, από τους προς τούτο υπόχρεους δήμους, δύνανται να τους καλούν προς εκτέλεση των αναγκαίων ενεργειών αφαίρεσης ή εξάλειψης των αντικειμένων που έχουν τοποθετηθεί παράνομα, τάσσοντάς τους σχετική προθεσμία ενέργειας. Αν η προθεσμία παρέλθει άπρακτη, τα αρμόδια όργανα της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών δύνανται να προβούν σε όλες τις αναγκαίες ενέργειες καθ’ υποκατάσταση του Δήμου. Η υποκατάσταση αυτή περιλαμβάνει κάθε πρόσφορη ενέργεια για την αφαίρεση ή εξάλειψη των πινακίδων, αφισών, διαγραμμίσεων ή συσκευών που έχουν τοποθετηθεί παράνομα. Η σχετική δαπάνη βαραίνει τον δήμο και εγγράφεται στον προϋπολογισμό του ως υποχρεωτική δαπάνη, σύμφωνα με τον Κώδικα Δήμων και Κοινοτήτων (ν. 3463/2006, Α’ 114). Η υπηρεσία που προβαίνει στην αφαίρεση ή εξάλειψη των πινακίδων, των αφισών, των διαγραμμίσεων ή των συσκευών που έχουν τοποθετηθεί παράνομα, καθώς και ο Δήμος, στον προϋπολογισμό του οποίου εγγράφεται υποχρεωτική δαπάνη για σχετικές ενέργειες που έγιναν καθ’ υποκατάστασή του, δύναται να καταλογίζει τη σχετική δαπάνη σε βάρος των παραβατών, η είσπραξη της οποίας γίνεται σύμφωνα με τον Κώδικα Είσπραξης Δημοσίων Εσόδων (ν. 4878/2022, Α’ 190).
9. H παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε4 και τιμωρείται με διοικητικό πρόστιμο χιλίων πεντακοσίων (1.500) ευρώ και ποινή φυλάκισης έως δώδεκα (12) μήνες, ανεξαρτήτως εάν η πρόκληση κινδύνου ή ζημιάς ή βλάβης τιμωρείται αυτοτελώς από άλλες διατάξεις.`},
  15: {title:`Επιγραφές - Διαφημίσεις`,text:`ΚΕΦΑΛΑΙΟ Β’ ΚΑΝΟΝΕΣ ΟΔΙΚΗΣ ΣΥΜΠΕΡΙΦΟΡΑΣ ΚΑΙ ΡΥΘΜΙΣΕΙΣ ΓΙΑ ΤΗ ΧΡΗΣΗ ΤΟΥ ΟΔΙΚΟΥ ΔΙΚΤΥΟΥ
Επιγραφές - Διαφημίσεις
1. Απαγορεύεται κάθε διαφήμιση που πραγματοποιείται με οποιονδήποτε τρόπο και μέσο, στα εκτός κατοικημένης περιοχής τμήματα των χαρακτηρισμένων εθνικών και επαρχιακών οδών ή αυτοκινητοδρόμων και σε ζώνη μέχρι εκατόν πενήντα (150) μέτρων και από τις δύο (2) πλευρές του άξονα των οδών αυτών και είναι ορατή από τους χρήστες των οδών. Η ζώνη απαγόρευσης του πρώτου εδαφίου περιορίζεται στα σαράντα (40) μέτρα και από τις δύο (2) πλευρές του άξονα των ανωτέρω τμημάτων εθνικών και επαρχιακών οδών ή αυτοκινητοδρόμων, που διέρχονται μέσα από κατοικημένη περιοχή, εάν το επιτρεπόμενο όριο ταχύτητας στα τμήματα αυτά υπερβαίνει τα εβδομήντα (70) χιλιόμετρα την ώρα. Σε κλάδους ανισόπεδων κόμβων αυτοκινητοδρόμων και στις περιοχές των σταθμών διοδίων, η απόσταση των εκατόν πενήντα (150) μέτρων από τις δύο πλευρές του άξονα της κατεύθυνσης ισχύει ανεξαρτήτως του επιτρε πόμενου ορίου ταχύτητας. Για τα αεροδρόμια, εντός της ζώνης αεροδρομίου επιτρέπεται η διαφήμιση, σύμφωνα με το άρθρο 219 του ν. 4782/2021 (Α’ 36), περί υπαίθριας διαφήμισης σε ζώνες αεροδρομίων.
2. Απαγορεύεται η τοποθέτηση επιγραφών ή διαφημίσεων ή η εγκατάσταση οποιασδήποτε πινακίδας, αφίσας, διαγράμμισης ή συσκευής, σε θέση ή με τρόπο που μπορεί να έχει οποιεσδήποτε αρνητικές συνέπειες στους χρήστες της οδού ή να επηρεάσει με οποιονδήποτε τρόπο την κυκλοφορία. Ιδίως απαγορεύεται η τοποθέτηση ή εγκατάσταση των ανωτέρω σε τέτοιες θέσεις, ώστε να παρεμποδίζεται η θέα των πινακίδων κατακόρυφης σήμανσης ή φωτεινών σηματοδοτών ή να προκαλείται σύγχυση με πινακίδες σήμανσης ή με κυκλοφοριακή διαγράμμιση ή με άλλη συσκευή ρύθμισης της κυκλοφορίας ή να τις καταστήσει λιγότερο ορατές ή αποτελεσματικές ή να προκαλέσει θάμβωση στους χρήστες της οδού και γενικά να αποσπάσουν την προσοχή τους με τρόπο που μπορεί να έχει δυσμενή επίδραση στην οδική ασφάλεια γενικά.
3. Σε οδούς, στις οποίες είναι εγκατεστημένοι φωτεινοί σηματοδότες ρύθμισης της κυκλοφορίας, απαγορεύεται η τοποθέτηση έγχρωμων φωτεινών διαφημίσεων ή πινακίδων ή αναγραφών με χρώματα που χρησιμοποιούνται στη φωτεινή σηματοδότηση, σε απόσταση εκατέρωθεν και ύψος μικρότερο των είκοσι (20) μέτρων από κάθε φανό σηματοδότησης.
4. Με παράλληλη τήρηση των προηγούμενων παραγράφων, επιτρέπεται να τοποθετούνται ή να λειτουργούν επιγραφές, που αναφέρονται στην επωνυμία ή σε άλλο διακριτικό σημείο ή τίτλο επιχείρησης που λειτουργεί παρά την οδό. Οι διαφημιστικές ως άνω πινακίδες και επιγραφές, όπου επιτρέπεται, τοποθετούνται παράλληλα προς τον άξονα της οδού, εκτός από τις διαφημίσεις και τις επιγραφές των εγκεκριμένων πλαισίων και των πρατηρίων καυσίμων που λειτουργούν παρά την οδό, οι οποίες μπορούν να τοποθετούνται και κάθετα προς τον άξονα αυτής.
5. Η τοποθέτηση διαφημιστικών πλαισίων στα στέγαστρα στάσεων αναμονής των αστικών και υπεραστικών συγκοινωνιών που βρίσκονται σε οδούς ταχείας κυκλοφορίας, στα εκτός κατοικημένης περιοχής τμήματα των εθνικών, επαρχιακών και δημοτικών οδών, καθώς και στα εντός κατοικημένης περιοχής τμήματα των εθνικών, επαρχιακών και δημοτικών οδών στα οποία το επιτρεπόμενο όριο ταχύτητας για τα επιβατηγά οχήματα υπερβαίνει τα εβδομήντα (70) χιλιόμετρα την ώρα, επιτρέπεται μόνο στην παράλληλη, προς τον άξονα της οδού πλευρά (πλάτη) αυτών, με την προϋπόθεση ότι η πλευρά αυτή ή τμήμα της προβλέπεται να είναι κλειστό. Η διαφήμιση επιτρέπεται και στις δύο όψεις των πλαισίων αυτών, εφόσον δεν είναι κάθετες προς τον άξονα οποιασδήποτε άλλης οδού. Στις λοιπές περιπτώσεις επιτρέπεται η τοποθέτηση πλαισίων στην αντίθετη, προς την κατεύθυνση της κυκλοφορίας, πλευρά των στεγάστρων, καθώς και στην παράλληλη προς τον άξονα της οδού πλευρά (πλάτη) αυτών, με την προϋπόθεση ότι οι πλευρές αυτές ή τμήμα αυτών προβλέπεται να είναι κλειστά. Όταν τοποθετούνται πλαίσια σε δύο (2) πλευρές των στεγάστρων, στην πλάτη αυτών εξασφαλίζεται ελεύθερη δίοδος μήκους τουλάχιστον ενός (1) μέτρου καθ’ όλο το ύψος αυτής. Η προβολή της διαφήμισης επιτρέπεται και στις δύο (2) όψεις των πλαισίων αυτών.
6. Απαγορεύονται επί οχημάτων οι φωτεινές ή φωτιζόμενες διαφημίσεις, οι διαφημίσεις για τις οποίες χρησιμοποιούνται αντανακλαστικά στοιχεία, καθώς και οι διαφημίσεις με εναλλασσόμενα μηνύματα.
7. Απαγορεύεται κάθε διαφήμιση εκτός των καθορισμένων πλαισίων ή οποιαδήποτε αναγραφή λέξεων, εικόνων ή συμβόλων σε στύλους ηλεκτροφωτισμού ή φωτεινών σηματοδοτών, σε διαχωριστικές νησίδες ή νησίδες ασφαλείας σε πεζοδρόμια, σε επιφάνειες τεχνικών έργων, οδοποιίας, είτε αυτή γίνεται απευθείας στις επιφάνειες αυτές, είτε σε επιφάνειες μέσων εξαρτώμενων από τα τεχνικά έργα.
8. Διαφημίσεις, επιγραφές, πινακίδες, αφίσες, διαγραμμίσεις ή συσκευές που τοποθετούνται κατά παράβαση του παρόντος, αφαιρούνται ή εξαλείφονται ή, εφόσον είναι φωτεινές, τίθενται εκτός λειτουργίας, κατά τη διαδικασία της παρ. 3 του άρθρου 18 του ν. 2130/1993 (Α’ 62), περί συμπλήρωσης και τροποποίησης διατάξεων για τις διαφημίσεις. Εάν τα αρμόδια όργανα της Γενικής Γραμματείας Υποδομών ή της οικείας Αποκεντρωμένης Διοίκησης διαπιστώσουν την παράλειψη τήρησης των υποχρεώσεων του προηγούμενου εδαφίου από τους προς τούτο υπόχρεους, δύνανται να τους καλούν προς εκτέλεση των αναγκαίων ενεργειών, τάσσοντάς τους σχετική προθεσμία ενέργειας. Εάν η προθεσμία παρέλθει άπρακτη, τα αρμόδια όργανα της Γενικής Γραμματείας Υποδομών ή της οικείας Αποκεντρωμένης Διοίκησης δύνανται να προβούν σε όλες τις αναγκαίες ενέργειες καθ’ υποκατάσταση των Οργανισμών Τοπικής Αυτοδιοίκησης. Η υποκατάσταση αυτή περιλαμβάνει κάθε πρόσφορη ενέργεια για την αφαίρεση, εξάλειψη ή θέση εκτός λειτουργίας των διαφημίσεων και επιγραφών από οποιονδήποτε χώρο της οδού ανεξάρτητα από τον φορέα που τη συντηρεί. Η σχετική δαπάνη βαραίνει τους Οργανισμούς Τοπικής Αυτοδιοίκησης και εγγράφεται στον προϋπολογισμό τους ως υποχρεωτική δαπάνη, βάσει των σχετικών διατάξεων του παρόντος. Η υπηρεσία που προβαίνει στην αφαίρεση, εξάλειψη ή θέση εκτός λειτουργίας παράνομων επιγραφών ή διαφημίσεων, καθώς και οι Οργανισμοί Τοπικής Αυτοδιοίκησης, στον προϋπολογισμό των οποίων εγγράφεται υποχρεωτική δαπάνη για σχετικές ενέργειες που έγιναν καθ’ υποκατάστασή τους, δύνανται να καταλογίζουν τη σχετική δαπάνη σε βάρος των διαφημιστών ή των διαφημιζομένων, η είσπραξη της οποίας γίνεται σύμφωνα με τις διατάξεις για την είσπραξη των δημοσίων εσόδων. Οι ανωτέρω υπηρεσίες δεν φέρουν καμία ευθύνη για ζημιές κατά την αποξήλωση, καθώς και για τη φύλαξη και την απόδοση των σχετικών υλικών στους διαφημιστές ή τους διαφημιζόμενους.
9. Αυτός που παραβαίνει με οποιονδήποτε τρόπο το παρόν και ιδίως αυτός που επικολλά ή αναρτά έντυπα ή διενεργεί γενικά διαφημιστικές πράξεις κατά παράβαση του παρόντος τιμωρείται με ποινή φυλάκισης έως ένα (1) έτος και χρηματική ποινή έως δέκα χιλιάδες (10.000) ευρώ, με την επιφύλαξη της εφαρμογής διατάξεων ειδικών ποινικών νόμων. Πρόεδροι διοικητικών συμβουλίων, εντεταλμένοι ή διευθύνοντες σύμβουλοι Ανώνυμων Εταιριών (Α.Ε.), διαχειριστές Εταιριών Περιορισμένης Ευθύνης (Ε.Π.Ε.), καθώς και πρόσωπα που ασκούν τη διοίκηση ή τη διαχείριση νομικών προσώπων του Δημοσίου ή των Οργανισμών Τοπικής Αυτοδιοίκησης ή του εν γένει ιδιωτικού τομέα, που αναθέτουν διαφημιστικές πράξεις κατά παράβαση του παρόντος, τιμωρούνται ως αυτουργοί, ανεξάρτητα από την ποινική ευθύνη άλλου φυσικού προσώπου.
10. Οι ποινές της παρ. 9 επιβάλλονται εφόσον δεν προβλέπονται ποινές αυστηρότερες από άλλες διατάξεις.

  16: {title:`Κανόνες οδικής συμπεριφοράς`,text:`Κανόνες οδικής συμπεριφοράς
1. Όποιος χρησιμοποιεί το οδικό δίκτυο πρέπει να αποφεύγει οποιαδήποτε συμπεριφορά η οποία ενδεχομένως προκαλεί κίνδυνο ή εμπόδια στην κυκλοφορία, εκθέτει σε κίνδυνο πρόσωπα ή ζώα ή προκαλεί ζημιές σε δημόσιες ή ιδιωτικές περιουσίες. Οι οδηγοί υποχρεούνται να οδηγούν με σύνεση και με διαρκώς τεταμένη την προσοχή, να επιδεικνύουν ιδιαίτερη προσοχή στα παιδιά, τους υπερήλικες, τα άτομα με αναπηρία και γενικώς στα πρόσωπα που χρειάζονται βοήθεια και να μην προκαλούν γενικά με τη συμπεριφορά τους τρόμο, ανησυχία ή παρενόχληση στους λοιπούς χρήστες των οδών, τους παρόδιους ή τους κατοικούντες πλησίον αυτών.
2. Δεν επιτρέπεται η απόθεση ή εγκατάλειψη ή η απόρριψη οποιουδήποτε αντικειμένου ή ύλης στις οδούς, εφόσον παρακωλύει έστω και κατ’ ελάχιστο την κυκλοφορία των πεζών και των οχημάτων, καθώς και τη στάθμευση των οχημάτων. Δεν επιτρέπεται να χύνονται στις οδούς ουσίες ή υλικά, όπως είναι τα νερά, τα λάδια και ο ασβέστης, τα οποία μπορούν να καταστήσουν την οδό ολισθηρή.
3. Δεν επιτρέπεται η απόρριψη από το όχημα οποιουδήποτε αντικειμένου, έστω και αν από αυτό δεν καθίσταται επικίνδυνη ούτε παρακωλύεται η κυκλοφορία. Δεν επιτρέπεται η απόρριψη από το όχημα κάθε αντικειμένου ή ουσίας που μπορεί να προκαλέσει πυρκαγιά ή να ρυπάνει το περιβάλλον.
4. Αν οι χρήστες των οδών δεν μπορούν να αποφύγουν την πρόκληση εμποδίου ή κινδύνου, υποχρεούνται να λαμβάνουν αμέσως τα αναγκαία μέτρα για την απομάκρυνση ή αποτροπή αυτού και, εάν δεν μπορούν, οφείλουν να ειδοποιούν τους λοιπούς χρήστες της οδού για την ύπαρξη του εμποδίου ή του κινδύνου. Αυτοί που επιθυμούν, για εύλογη αιτία, όπως είναι οι μεταφορές, η επιβίβαση και η αποβίβαση, να καταλάβουν για λίγο μέρος του πεζοδρομίου ή του οδοστρώματος, οφείλουν να λάβουν τα κατάλληλα μέτρα για την απρόσκοπτη και ασφαλή κυκλοφορία πεζών και οχημάτων.
5. Η χρήση των ζωνών ασφαλείας είναι υποχρεωτική τόσο για τους οδηγούς όσο και για τους επιβάτες. Σε περίπτωση μεταφοράς ανηλίκων επιβατών, εφόσον στο όχημα υπάρχει συνοδός, την ευθύνη φέρει αυτός. Για τη μεταφορά παιδιών με αυτοκίνητο είναι υποχρεωτική η χρήση ειδικών μέσων συγκράτησης και προστασίας, όπως είναι τα καθίσματα και οι ζώνες ασφαλείας.
6. Οι οδηγοί και οι επιβάτες μοτοποδηλάτων, μοτοσικλετών και τρίτροχων οχημάτων, τα οποία δεν διαθέτουν κουβούκλιο, υποχρεούνται να φορούν προστατευτικό κράνος, κανονικά δεμένο.
7. Οι οδηγοί οχημάτων οφείλουν να συμπεριφέρονται με ευγένεια στους πεζούς και τους άλλους οδηγούς. Οι οδηγοί των επιβατηγών αυτοκινήτων δημόσιας χρήσης (Ε.Δ.Χ.) της περ. 19 του άρθρου 4 και οι οδηγοί των μέσων μαζικής μεταφοράς, περιλαμβανομένων και των τουριστικών οχημάτων, οφείλουν να συμπεριφέρονται με ευγένεια στους επιβάτες.
8. Για την εξοικείωση των μαθητών με τους κανόνες οδικής συμπεριφοράς, μπορεί να προβλέπεται η καθιέρωση αντίστοιχου μαθήματος.
9. Απαγορεύεται η οδήγηση οδικών οχημάτων για επίδειξη ικανότητας, εντυπωσιασμό, ανταγωνισμό ή τέλεση αυτοσχέδιων αγώνων.
10. Απαγορεύεται, εκατέρωθεν του οδοστρώματος των αυτοκινητοδρόμων, η στάθμευση οχημάτων και η εγκατάσταση υπαίθριων μικροκαταστημάτων ή κινητών και ακίνητων καντινών για την πώληση διαφόρων ειδών. Στο λοιπό οδικό δίκτυο είναι δυνατή η εγκατάσταση των ανωτέρω, μετά από άδεια των αρμόδιων για τη συντήρηση του οδικού δικτύου αρχών, που χορηγείται μόνο μετά από σύμφωνη γνώμη των κατά τόπους αρμόδιων υπηρεσιών της Τροχαίας. 11.α) Οι παραβάσεις των παρ. 1 και 4 κατατάσσονται στην κατηγορία Ε2-Α. Στην ίδια κατηγορία κατατάσσεται η παράβαση της παρ. 5 όσον αφορά τη μη χρήση ζώνης ασφαλείας από τους επιβάτες.
β) Οι παραβάσεις των παρ. 2 και 6, όσον αφορά στη μη χρήση προστατευτικού κράνους από τους επιβάτες, κατατάσσονται στην κατηγορία Ε3-Α.
γ) Οι παραβάσεις των παρ. 3 και 7 κατατάσσονται στην κατηγορία Ε2-Α και στην κατηγορία Σ.
δ) Οι παραβάσεις του πρώτου και του τρίτου εδαφίου της παρ. 5 που αφορούν στη μη χρήση ζώνης ασφαλείας από τον οδηγό και στη μη χρήση ειδικών μέσων συγκράτησης και προστασίας για τη μεταφορά παιδιών, της παρ. 6, όσον αφορά στη μη χρήση προστατευτικού κράνους από τον οδηγό, καθώς και η παράβαση της παρ. 10, κατατάσσονται στην κατηγορία Ε3-Β.
ε) Η παράβαση της παρ. 9 κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της επί τόπου αφαίρεσης της άδειας οδήγησης για ένα (1) έτος.`},
  17: {title:`Οδηγοί`,text:`Οδηγοί
1. Κάθε κινούμενο όχημα ή συνδυασμός οχημάτων επιβάλλεται να έχει οδηγό. α.
αα) Κατ’ εξαίρεση του πρώτου εδαφίου της παρούσας παραγράφου επιτρέπεται να κυκλοφορεί επί της οδού, χωρίς την παρουσία οδηγού επ’ αυτού, Λεωφορείο Αστικού Τύπου στο πλαίσιο πιλοτικής εφαρμογής ή δοκιμαστικής λειτουργίας για ερευνητικούς ή άλλους σκοπούς. Η κυκλοφορία του επιτρέπεται, με απόφαση του δημοτικού συμβουλίου μετά από σύμφωνη γνώμη των κατά τόπους αρμοδίων υπηρεσιών τροχαίας ή των αστυνομικών υπηρεσιών που ασκούν καθήκοντα τροχαίας, για καθορισμένη χρονική περίοδο και συγκεκριμένη αστική ή περιαστική διαδρομή, που καθορίζεται μετά από κυκλοφοριακή μελέτη, σύμφωνα με το άρθρο 55 του παρόντος, περί μέτρων ρύθμισης οδικής κυκλοφορίας, και το άρθρο 83 του Κώδικα Δήμων και Κοινοτήτων (ν. 3463/2006, Α’ 114), περί δημοτικής συγκοινωνίας, εφόσον η κυκλοφορία του οχήματος πραγματοποιείται στο πλαίσιο εκτέλεσης δημοτικής συγκοινωνίας. Ειδικώς για την εκτέλεση της δημοτικής συγκοινωνίας επιτρέπεται, για τους σκοπούς του παρόντος, η χρήση οχημάτων ιδιοκτησίας του φορέα υλοποίησης του ερευνητικού προγράμματος ή του προμηθευτή/κατασκευαστή, στην περίπτωση που το υπόψη πρόγραμμα αποτελεί δράση προεμπορικών δημόσιων συμβάσεων.
αβ) Το Λεωφορείο Αστικού Τύπου χωρίς οδηγό επιβάλλεται να διαθέτει κατάλληλους μηχανισμούς και αυτόματα συστήματα, τα οποία εξασφαλίζουν συμπεριφορά κίνησης, πέδησης και ακινητοποίησης, αντίστοιχη με λεωφορείο, το οποίο χειρίζεται οδηγός.
αγ) Για τη διασφάλιση της απρόσκοπτης κίνησης του Λεωφορείου Αστικού Τύπου χωρίς οδηγό, την ασφάλεια των επιβατών και των λοιπών χρηστών της οδού, επιβάλλεται η παρακολούθηση του λεωφορείου και της οδού, στην οποία κινείται, καθ’ όλη τη διάρκεια κίνησής του, από Κέντρο Ελέγχου μέσω ηλεκτρονικών συσκευών λήψης και καταγραφής εικόνας (κάμερες) και ήχου. Οι παραπάνω συσκευές τοποθετούνται επί της εξωτερικής πλευράς του οχήματος και σε προκαθορισμένα σημεία της διαδρομής, προκειμένου να υπάρχει πλήρης έλεγχος της κίνησης του λεωφορείου, της λοιπής κυκλοφορίας της οδού και του οδικού περιβάλλοντος, ώστε να παρέχεται η δυνατότητα από το κέντρο ελέγχου, ακινητοποίησής του ή πραγματοποίησης ελιγμών για την αποφυγή εμποδίων, σε περίπτωση που το επιβάλλουν οι συνθήκες κυκλοφορίας ή λόγοι έκτακτης ανάγκης. Για λόγους ασφάλειας των επιβατών και για λόγους δημόσιας ασφάλειας είναι δυνατή η παρακολούθηση του εσωτερικού του λεωφορείου χωρίς οδηγό, καθ’ όλη τη διάρκεια κίνησής του, από κέντρο ελέγχου μέσω ηλεκτρονικών συσκευών λήψης και καταγραφής εικόνας (κάμερες) και ήχου.
αδ) Ο υπεύθυνος για την παρακολούθηση της κίνησης του λεωφορείου που βρίσκεται στο Κέντρο Ελέγχου οφείλει να είναι κάτοχος αντίστοιχης ισχύουσας κατηγορίας άδειας οδήγησης και Πιστοποιητικού Επαγγελματικής Ικανότητας οδηγού οχημάτων μεταφοράς επιβατών και είναι υπεύθυνος για την κυκλοφορία του οχήματος χωρίς οδηγό. Ευθύνεται, κατά τις διατάξεις του παρόντος, ως οδηγός του οχήματος, για την ακινητοποίηση αυτού ή την πραγματοποίηση ελιγμών για την αποφυγή εμποδίων, σε περίπτωση που το επιβάλλουν οι συνθήκες κυκλοφορίας ή λόγοι έκτακτης ανάγκης. Ο υπεύθυνος για την παρακολούθηση της κίνησης του λεωφορείου στο κέντρο ελέγχου παρακολουθεί ταυτόχρονα την κίνηση έως τεσσάρων (4) λεωφορείων, εκτός αν ιδιαίτεροι λόγοι ασφαλείας, όπως αυξημένη ταχύτητα, υψηλός κυκλοφοριακός φόρτος, επιβάλλουν τον περιορισμό του αριθμού αυτού.
αε) Το Λεωφορείο Αστικού Τύπου χωρίς οδηγό κυκλοφορεί επί της προκαθορισμένης διαδρομής που προβλέπεται στην ως άνω κυκλοφοριακή μελέτη και η θέση του επί της οδού καθορίζεται από το άρθρο 20, περί θέσης επί της οδού. Το Λεωφορείο Αστικού Τύπου χωρίς οδηγό συμμορφώνεται πλήρως με τους κανόνες οδικής κυκλοφορίας συμπεριλαμβανομένων εκείνων που δίνονται μέσω οδικής σήμανσης και σηματοδότησης, καθώς και με τα σήματα των τροχονόμων.
