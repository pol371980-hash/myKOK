1. Το ηλεκτρικό σύστημα των αυτοκινήτων οχημάτων και των συνδυασμών οχημάτων, οι οποίοι αποτελούνται από ένα έλκον αυτοκίνητο όχημα και ένα ή περισσότερα ρυμουλκούμενα, πρέπει να είναι κατασκευασμένο με τρόπο ώστε τα φώτα πορείας, διασταύρωσης, ομίχλης, τα μετωπικά φώτα θέσης του αυτοκινήτου οχήματος και το φως της πινακίδας αριθμού κυκλοφορίας, να μην ανάβουν όταν δεν είναι αναμμένα τα πίσω ερυθρά φώτα θέσης. Επίσης, τα μπροστινά λευκά φώτα θέσης του αυτοκινήτου οχήματος είναι πάντοτε αναμμένα όταν ανάβουν τα φώτα πορείας, διασταύρωσης ή ομίχλης. Η παρούσα δεν εφαρμόζεται όταν τα φώτα πορείας ή διασταύρωσης χρησιμοποιούνται για φωτεινή προειδοποίηση, όπως στην παρ. 4 του άρθρου 40, περί κανόνων χρήσης των φώτων οχημάτων.
2. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα ή συνδυασμό οχημάτων, που δεν είναι εφοδιασμένο με το πιο πάνω προβλεπόμενο ηλεκτρικό σύστημα, το οποίο να λειτουργεί σύμφωνα με το παρόν άρθρο κατατάσσονται στην κατηγορία Ε1-Α.`},
  78: {title:`Φώτα μοτοποδηλάτων και μοτοσικλετών`,text:`Φώτα μοτοποδηλάτων και μοτοσικλετών
1. Τα τρίτροχα μοτοποδήλατα είναι εφοδιασμένα με:
α) Ένα (1) ή δύο (2) φώτα διασταύρωσης,
β) ένα (1) ή δύο (2) οπίσθια φώτα θέσης,
γ) ένα (1) ή δύο (2) φώτα τροχοπέδησης.
δ) ένα (1) ή δύο (2) σε κάθε πλευρά μη τριγωνικούς ανακλαστήρες,
ε) έναν (1) μη τριγωνικό ανακλαστήρα πίσω,
στ) δύο (2) ανακλαστήρες σε κάθε ποδομοχλό, όταν αυτοί δεν είναι αναδιπλούμενοι. Τα δίτροχα μοτοποδήλατα μπορεί να είναι εφοδιασμένα και με:
α) Ένα (1) ή δύο (2) φώτα πορείας,
β) δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης,
γ) φώτα για τον φωτισμό της πινακίδας του αριθμού κυκλοφορίας,
δ) ένα (1) ή δύο (2) φώτα θέσης μπροστά,
ε) έναν (1) μη τριγωνικό ανακλαστήρα μπροστά.
2. Τα τρίτροχα μοτοποδήλατα και τα ελαφρά τετράτροχα είναι εφοδιασμένα με:
α) Ένα (1) ή δύο (2) φώτα διασταύρωσης.
β) Ένα (1) ή δύο (2) φώτα θέσης μπροστά. Τα τρίτροχα μοτοποδήλατα με μέγιστο πλάτος άνω των χιλίων τριακοσίων (1.300) χιλιοστών είναι εφοδιασμένα με δύο (2) φώτα θέσης μπροστά.
γ) Ένα (1) ή δύο (2) φώτα θέσης πίσω. Τα τρίκυκλα μοτοποδήλατα με μέγιστο πλάτος άνω των χιλίων τριακοσίων (1.300) χιλιοστών είναι εφοδιασμένα με δύο (2) φώτα θέσης πίσω.
δ) Έναν (1) ή δύο (2) μη τριγωνικούς ανακλαστήρες πίσω. Τα τρίκυκλα μοτοποδήλατα με μέγιστο πλάτος άνω των χιλίων (1.000) χιλιοστών είναι εφοδιασμένα με δύο (2) μη τριγωνικούς ανακλαστήρες πίσω.
ε) Δύο (2) ανακλαστήρες σε κάθε ποδομοχλό, όταν αυτοί δεν είναι αναδιπλούμενοι.
στ) Ένα (1) ή δύο (2) φώτα τροχοπέδησης. Τα τρίτροχα μοτοποδήλατα με μέγιστο πλάτος χιλίων τριακοσίων (1.300) χιλιοστών είναι εφοδιασμένα με δύο (2) φώτα τροχοπέδησης.
ζ) Δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης, για τα τρίτροχα μοτοποδήλατα με κλειστό αμάξωμα. Επίσης, τα τρίτροχα μοτοποδήλατα μπορεί να είναι εφοδιασμένα και με:
α) Ένα (1) ή δύο (2) φώτα πορείας,
β) δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης, για τα τρίτροχα μοτοποδήλατα χωρίς κλειστό αμάξωμα,
γ) φώτα για τον φωτισμό της πινακίδας του αριθμού κυκλοφορίας,
δ) έναν (1) ή δύο (2) σε κάθε πλευρά μη τριγωνικούς ανακλαστήρες.
3. Οι δίτροχες μοτοσικλέτες είναι εφοδιασμένες με:
α) Ένα (1) ή δύο (2) φώτα πορείας,
β) ένα (1) ή δύο (2) φώτα διασταύρωσης,
γ) δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης,
δ) ένα (1) ή δύο (2) φώτα τροχοπέδησης,
ε) ένα (1) ή δύο (2) φώτα θέσης μπροστά,
στ) ένα (1) ή δύο (2) φώτα θέσης πίσω,
ζ) φως για τον φωτισμό της οπίσθιας πινακίδας του αριθμού κυκλοφορίας,
η) Έναν (1) μη τριγωνικό ανακλαστήρα πίσω. Επίσης, οι δίτροχες μοτοσικλέτες μπορεί να είναι εφοδιασμένες και με:
α) Ένα (1) ή δύο (2) φώτα ομίχλης μπροστά,
β) ένα (1) ή δύο (2) φώτα ομίχλης πίσω,
γ) ένα (1) φως έκτακτης ανάγκης,
δ) έναν (1) ή δύο (2) σε κάθε πλευρά μη τριγωνικούς ανακλαστήρες.
4. Οι δίτροχες μοτοσικλέτες με πλευρικό κάνιστρο είναι εφοδιασμένες με:
α) Ένα (1) ή δύο (2) φώτα πορείας,
β) ένα (1) ή δύο (2) φώτα διασταύρωσης,
γ) δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης,
δ) ένα (1) ή δύο (2) φώτα τροχοπέδησης,
ε) δύο (2) ή τρία (3) φώτα θέσης μπροστά, από τα οποία το ένα (1) στο καλάθι,
στ) δύο (2) ή τρία (3) φώτα θέσης πίσω, από τα οποία το ένα (1) στο καλάθι,
ζ) φως για τον φωτισμό της οπίσθιας πινακίδας του αριθμού κυκλοφορίας,
η) δύο (2) μη τριγωνικούς ανακλαστήρες πίσω. Επίσης, οι δίτροχες μοτοσικλέτες με πλευρικό καλάθι μπορεί να είναι εφοδιασμένες και με:
α) Ένα (1) ή δύο (2) φώτα ομίχλης μπροστά,
β) ένα (1) ή δύο (2) φώτα ομίχλης πίσω,
γ) ένα (1) φως έκτακτης ανάγκης,
δ) έναν (1) ή δύο (2) σε κάθε πλευρά μη τριγωνικούς ανακλαστήρες.
5. Το ηλεκτρικό σύστημα μοτοσικλέτας και καλαθιού είναι κατασκευασμένο με τρόπο, ώστε τα φώτα θέσης (μετωπικό και πίσω) του καλαθιού να ανάβουν συγχρόνως με το πίσω φως θέσης της μοτοσικλέτας.
6. Τα φώτα που προβλέπονται στις παρ. 3 και 4 πληρούν τις προδιαγραφές ως προς το χρώμα, την ένταση και την τοποθέτηση, οι οποίες καθορίζονται για τα αντίστοιχα φώτα των αυτοκινήτων οχημάτων, εκτός των μοτοποδηλάτων, τα οποία έχουν φανούς μέτριας έντασης.
7. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα από τα πιο πάνω, το οποίο δεν είναι εφοδιασμένο με τα ως άνω προβλεπόμενα φώτα, που να λειτουργούν σύμφωνα με το άρθρο αυτό κατατάσσονται στην κατηγορία Ε2-Α.`},
  79: {title:`Φώτα τρίτροχων οχημάτων`,text:`Φώτα τρίτροχων οχημάτων
1. Τα τρίτροχα οχήματα είναι εφοδιασμένα με:
α) Ένα (1) ή δύο (2) φώτα πορείας. Τα τρίτροχα οχήματα, των οποίων το μέγιστο πλάτος είναι άνω των χιλίων τριακοσίων (1.300) χιλιοστών, είναι εφοδιασμένα με δύο (2) φώτα πορείας.
β) Ένα (1) ή δύο (2) φώτα διασταύρωσης. Τα τρίτροχα οχήματα, των οποίων το μέγιστο πλάτος είναι άνω των χιλίων τριακοσίων (1.300) χιλιοστών, είναι εφοδιασμένα με δύο (2) φώτα διασταύρωσης.
γ) Έναν (1) ή δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης.
δ) Ένα (1) ή δύο (2) φώτα πέδησης. Τα τρίτροχα οχήματα, των οποίων το μέγιστο πλάτος είναι άνω των χιλίων τριακοσίων (1.300) χιλιοστών είναι εφοδιασμένα με δύο (2) φώτα πέδησης.
ε) Ένα (1) ή δύο (2) φώτα θέσης μπροστά. Τα τρίτροχα οχήματα, των οποίων το μέγιστο πλάτος είναι άνω των χιλίων τριακοσίων (1.300) χιλιοστών είναι εφοδιασμένα με δύο (2) φώτα θέσης μπροστά.
στ) Ένα (1) ή δύο (2) φώτα θέσης πίσω. Τα τρίτροχα οχήματα, των οποίων το μέγιστο πλάτος είναι άνω των χιλίων τριακοσίων (1.300) χιλιοστών είναι εφοδιασμένα με δύο (2) φώτα θέσης πίσω.
ζ) Φως για τον φωτισμό της οπίσθιας πινακίδας του αριθμού κυκλοφορίας.
η) Δύο (2) μη τριγωνικούς ανακλαστήρες πίσω.
θ) Φως έκτακτης ανάγκης.
ι) Έναν (1) ή δύο (2) μη τριγωνικούς ανακλαστήρες πίσω. Τα τρίτροχα οχήματα, των οποίων το μέγιστο πλάτος είναι μέχρι χίλια (1.000) χιλιοστά, δεν επιβάλλεται να έχουν ανακλαστήρα πίσω. Επίσης, τα τρίτροχα οχήματα μπορεί να είναι εφοδιασμένα και με:
β) ένα (1) ή δύο (2) φώτα ομίχλης πίσω,
γ) ένα (1) ή δύο (2) φώτα οπισθοπορείας,
δ) έναν (1) ή δύο (2) σε κάθε πλευρά μη τριγωνικούς ανακλαστήρες.
2. Τα φώτα της παρ. 1 πληρούν τις προδιαγραφές ως προς το χρώμα, την ένταση και την τοποθέτηση, οι οποίες καθορίζονται για τα αντίστοιχα φώτα των αυτοκινήτων οχημάτων.
3. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί τρίτροχο όχημα, το οποίο δεν είναι εφοδιασμένο με τα πιο πάνω προβλεπόμενα φώτα και αντανακλαστικά στοιχεία, που να λειτουργούν σύμφωνα με το παρόν άρθρο κατατάσσονται στην κατηγορία Ε2-Α.`},
  80: {title:`Φώτα ποδηλάτων και Ελαφρών Προσωπικών Ηλεκτρικών Οχημάτων (Ε.Π.Η.Ο.)`,text:`Φώτα ποδηλάτων και Ελαφρών Προσωπικών Ηλεκτρικών Οχημάτων (Ε.Π.Η.Ο.)
1. Τα ποδήλατα είναι εφοδιασμένα με ένα (1) λευκό ή κίτρινο φως μπροστά, ένα (1) ερυθρό φως αντανακλαστικό στοιχείο πίσω και με έναν (1) τουλάχιστον αντανακλαστήρα σε κάθε πλευρά. Ομοίως, αντανακλαστικό στοιχείο κίτρινου χρώματος τοποθετείται σε κάθε ποδομοχλό. Εξαιρούνται της υποχρέωσης να φέρουν τα ως άνω φώτα, εφόσον δεν κυκλοφορούν τη νύχτα, τα ποδήλατα των οποίων η διάμετρος τροχού δεν υπερβαίνει τα πεντακόσια (500) χιλιοστά, τα αγωνιστικά και τα ορειβατικά ποδήλατα.
2. Τα Ε.Π.Η.Ο. είναι εφοδιασμένα με ένα (1) λευκό ή κίτρινο φως μπροστά, ένα (1) ερυθρό φως και αντανακλαστικό στοιχείο πίσω και με έναν (1) τουλάχιστον αντανακλαστήρα σε κάθε πλευρά. Εξαιρούνται της υποχρέωσης να φέρουν τα ως άνω φώτα, εφόσον δεν κυκλοφορούν τη νύχτα, ηλεκτροκίνητα αμαξίδια, scooters και handbikes ατόμων με αναπηρία.
3. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί ποδήλατο ή Ε.Π.Η.Ο, το οποίο δεν είναι εφοδιασμένο με τα πιο πάνω προβλεπόμενα φώτα και αντανακλαστικά στοιχεία, που να λειτουργούν σύμφωνα με το παρόν άρθρο κατατάσσονται στην κατηγορία Ε1-Α.`},
  81: {title:`Φώτα ζωήλατων οχημάτων`,text:`Φώτα ζωήλατων οχημάτων
1. Τα ζωήλατα οχήματα είναι εφοδιασμένα με δύο (2) λευκά φώτα μπροστά και δύο (2) ερυθρά πίσω. Αντί των ερυθρών φώτων, επιτρέπεται να τοποθετηθούν αντανακλαστικά στοιχεία ερυθρού φωτός.
2. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί ζωήλατο όχημα, το οποίο δεν είναι εφοδιασμένο με τα πιο πάνω προβλεπόμενα φώτα και αντανακλαστικά στοιχεία, που να λειτουργούν σύμφωνα με το παρόν άρθρο κατατάσσονται στην κατηγορία Ε2-Α.`},
  82: {title:`Φώτα αγροτικών μηχανημάτων`,text:`Φώτα αγροτικών μηχανημάτων
1. Οι διατάξεις του παρόντος Κεφαλαίου για το σύστημα φωτισμού και οπτικής γενικά σήμανσης των οχημάτων έχουν ανάλογη εφαρμογή και στα αγροτικά
α) Ένα (1) ή δύο (2) φώτα ομίχλης μπροστά, μηχανήματα τα οποία κινούνται αυτοδύναμα και επί των υπ’ αυτών ρυμουλκούμενων, αν αυτά καλύπτουν τα πίσω φώτα του έλκοντος οχήματος. Ειδικότερα, στις περιπτώσεις συνδυασμών μονοαξονικών γεωργικών ελκυστήρων, των οποίων η πραγματική ισχύς του κινητήρα στον άξονα δεν υπερβαίνει τους επτά (7) ίππους, μετά ρυμουλκούμενων, εφαρμόζονται οι διατάξεις του παρόντος Κεφαλαίου για τις δίτροχες μοτοσικλέτες με ή χωρίς καλάθι. Αν η πραγματική ισχύς του κινητήρα στον άξονα υπερβαίνει τους (7) ίππους, εφαρμόζονται οι διατάξεις του παρόντος Κεφαλαίου για τις τρίτροχες μοτοσικλέτες.
2. Τα αγροτικά μηχανήματα μπορούν να φέρουν ειδικό προβολέα, ο οποίος χρησιμοποιείται μόνο κατά την εκτέλεση μηχανοαγροτικών εργασιών, απαγορευμένης της χρήσης αυτού κατά την κίνησή τους στις οδούς.
3. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα από τα πιο πάνω, το οποίο δεν είναι εφοδιασμένο με το προβλεπόμενο σύστημα φωτισμού, που να λειτουργεί σύμφωνα με τις διατάξεις του άρθρου αυτού, όπως και αυτόν που παραβαίνει την παρ. 2 του άρθρου αυτού, κατατάσσονται στην κατηγορία Ε2-Β.`},
  83: {title:`Φώτα μηχανημάτων έργου`,text:`Φώτα μηχανημάτων έργου
1. Οι διατάξεις του παρόντος Κεφαλαίου για το σύστημα φωτισμού και οπτικής γενικά σήμανσης των οχημάτων, έχουν ανάλογη εφαρμογή και επί των μηχανημάτων έργου και επί των υπ’ αυτών ρυμουλκούμενων, αν αυτά καλύπτουν τα πίσω φώτα του έλκοντος οχήματος. Τα χιονοκαθαριστικά μηχανήματα είναι εφοδιασμένα και με φανούς κίτρινου φωτός.
2. Τα μηχανήματα έργου μπορεί να έχουν ειδικούς προβολείς, οι οποίοι χρησιμοποιούνται μόνο κατά την εκτέλεση έργων, απαγορευμένης της χρήσης αυτών κατά την κίνησή τους επί των οδών.
3. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα από τα πιο πάνω, το οποίο δεν είναι εφοδιασμένο με το προβλεπόμενο σύστημα φωτισμού, που να λειτουργεί σύμφωνα με τις διατάξεις του παρόντος άρθρου, όπως και αυτόν που παραβαίνει την παρ. 2 του παρόντος κατατάσσονται στην κατηγορία Ε2-Β.`},
  84: {title:`Γενικές διατάξεις για τον φωτισμό KEΦAΛAIO ΣΤ’ ΤΕΧΝΙΚΕΣ ΠΡΟΔΙΑΓΡΑΦΕΣ ΟΧΗΜΑΤΩΝ`,text:`Γενικές διατάξεις για τον φωτισμό
1. Τα φώτα οδικού οχήματος ή ρυμουλκούμενου, εκτός από τα φώτα των δεικτών κατεύθυνσης και τα φώτα έκτακτης ανάγκης, απαγορεύεται να αναβοσβήνουν ή να μεταβάλλουν ένταση. Κατ’ εξαίρεση, αυτό επιτρέπεται για φώτα χρησιμοποιούμενα για την επισήμανση οχημάτων ή συνδυασμών οχημάτων, όπως οχημάτων προτεραιότητας, επί φάλαγγας οχημάτων, οχημάτων μεγάλου μεγέθους και οχημάτων εξοπλισμού κατασκευής ή συντήρησης των οδών, ως προς τα οποία δεν εφαρμόζονται οι γενικοί κανόνες κυκλοφορίας ή η παρουσία των οποίων επί της οδού επιβάλλει στους λοιπούς χρήστες τις οδούς να λαμβάνουν ειδικές προφυλάξεις.
2. Συνδυασμός δύο (2) ή περισσότερων ομοίων ή όχι φώτων, τα οποία εκτελούν την αυτή λειτουργία και τα οποία έχουν το ίδιο χρώμα, θεωρείται ότι αποτελούν ένα (1) φως, αν οι προβολές των φωτιστικών επιφανειών τους, σε εγκάρσιο κατακόρυφο επίπεδο, καταλαμβάνουν ποσοστό πενήντα τοις εκατό (50%) τουλάχιστον της επιφάνειας του μικρότερου ορθογώνιου παραλληλόγραμμου, το οποίο περιγράφει τις προβολές αυτές των φωτιστικών επιφανειών.
3. Απλή φωτιστική επιφάνεια, η οποία έχει σχήμα ταινίας, θεωρείται ότι είναι δύο (2) ή ζυγός αριθμός φώτων, αν είναι τοποθετημένη συμμετρικά ως προς το μέσο κατά μήκος επίπεδο του οχήματος, εκτείνεται μέχρις απόστασης όχι μεγαλύτερης των σαράντα εκατοστών (0,40 μ.) από το ακρότατο εξωτερικό όριο του οχήματος και έχει μήκος τουλάχιστον ογδόντα εκατοστών (0,80 μ.). Ο φωτισμός μιας τέτοιας επιφάνειας παρέχεται από δύο (2) τουλάχιστον φωτεινές πηγές που βρίσκονται κατά το δυνατόν πλησιέστερα προς τα άκρα αυτής. Η πιο πάνω φωτιστική επιφάνεια μπορεί να αποτελείται από αριθμό στοιχείων, τα οποία είναι τοποθετημένα με τρόπο ώστε οι προβολές των φωτιστικών επιφανειών των διαφόρων στοιχείων σε εγκάρσιο κατακόρυφο επίπεδο να καταλαμβάνουν ποσοστό πενήντα τοις εκατό (50%) τουλάχιστον της επιφάνειας του μικρότερου ορθογώνιου παραλληλόγραμμου, το οποίο περιγράφει τις προβολές αυτές των φωτιστικών επιφανειών.
4. Φώτα οχήματος, τα οποία εκτελούν την αυτή λειτουργία και φωτίζουν προς την ίδια κατεύθυνση, είναι του ίδιου χρώματος. Φώτα και αντανακλαστήρες, ζυγού αριθμού, τοποθετούνται συμμετρικά ως προς το μέσο κατά μήκος επίπεδο του οχήματος, εκτός των οχημάτων, τα οποία έχουν ασύμμετρο εξωτερικό σχήμα. Η ένταση των φώτων κάθε ζεύγους είναι ίδια. Τα φώτα δεν επικαλύπτονται από διάφορα αντικείμενα και διατηρούνται καθαρά.
5. Τηρουμένων των λοιπών διατάξεων του παρόντος Κεφαλαίου, φώτα διαφόρων ειδών και αντανακλαστήρες μπορούν να ενώνονται ή να ενσωματώνονται μέσα στην αυτή συσκευή.
6. Απαγορεύεται η προσθήκη άλλων φωτιστικών ή αντανακλαστικών στοιχείων πέραν των προβλεπόμενων στο άρθρο 4, περί ορισμών.
7. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α. KEΦAΛAIO ΣΤ’ ΤΕΧΝΙΚΕΣ ΠΡΟΔΙΑΓΡΑΦΕΣ ΟΧΗΜΑΤΩΝ`},
  85: {title:`Μηχανισμοί, εξαρτήματα και συσκευές οχημάτων`,text:`Μηχανισμοί, εξαρτήματα και συσκευές οχημάτων
1. Τα αυτοκίνητα οχήματα είναι εφοδιασμένα με σύστημα διεύθυνσης, το οποίο επιτρέπει στον οδηγό την ευχερή, ταχεία και ασφαλή αλλαγή κατεύθυνσης του οχήματός του.
2. Τα αυτοκίνητα οχήματα, τα τρίτροχα οχήματα, οι μοτοσικλέτες και τα μοτοποδήλατα είναι εφοδιασμένα με έναν (1) τουλάχιστον καθρέπτη, τοποθετημένο σε θέση η οποία εξασφαλίζει την ορατότητα της οδού πίσω από το όχημα.
3. Τα αυτοκίνητα οχήματα, τα αγροτικά μηχανήματα και τα μηχανήματα έργου, τα οποία κινούνται στις οδούς είναι εφοδιασμένα με ένα (1) τουλάχιστον ηχητικό όργανο προειδοποίησης ικανής έντασης, τα τρίτροχα οχήματα, οι μοτοσικλέτες και τα μοτοποδήλατα με όμοιο όργανο μικρότερης έντασης. Ο ήχος, ο οποίος εκπέμπεται από το ηχητικό όργανο, είναι συνεχής, του αυτού τόνου και όχι διαπεραστικός. Τα επιβατηγά οχήματα, αντί για εφεδρικό τροχό, δύνανται να είναι εφοδιασμένα με κιβώτιο επισκευής ελαστικού ή με ειδικά συστήματα συνέχισης οδήγησης.
4. Τα οχήματα άμεσης ανάγκης, τα έχοντα προτεραιότητα και τα οχήματα δημόσιας μαζικής μεταφοράς επιβατών, μπορούν να είναι εφοδιασμένα και να χρησιμοποιούν άλλα ηχητικά όργανα, διαφόρων ήχων.
5. Η χρήση σαλπίγγων εναλλασσόμενου ήχου, σειρήνων, σφυρικτών και άλλων παρόμοιων συσκευών απαγορεύεται, εκτός των οχημάτων της παρ. 4. 6. Τα ποδήλατα, εκτός από αυτά που χρησιμοποιούνται σε αθλητικούς αγώνες, είναι εφοδιασμένα με ένα κουδούνι. 7. Τα Ε.Π.Η.Ο. είναι εφοδιασμένα με:
α) συσκευή ηχητικής προειδοποίησης,
β) σύστημα πρόωσης που εφαρμόζεται στον εμπρόσθιο ή στους εμπρόσθιους και στον οπίσθιο ή στους οπίσθιους τροχούς, εφόσον υφίστανται. Σε περίπτωση ηλεκτρικής βλάβης ή βλάβης του συστήματος πρόωσης, το Ε.Π.Η.Ο. δεν επιταχύνει ή επιβραδύνει απότομα. 8. Τα διαφανή μέρη των αυτοκινήτων, οχημάτων και των ρυμουλκούμενων, τα οποία αποτελούν τμήμα του αμαξώματος αυτών, περιλαμβανομένου και του ανεμοθώρακα, καθώς και οποιουδήποτε εσωτερικού χωρίσματος, είναι κατασκευασμένα με τρόπο ώστε σε περίπτωση θραύσης τους, ο κίνδυνος τραυματισμού προσώπων να μειώνεται στο ελάχιστο και να είναι ορατοί ο οδηγός και οι άλλοι επιβαίνοντες. Τα διαφανή μέρη του ανεμοθώρακα είναι κατασκευασμένα από τέτοια ύλη, ώστε:
α) η διαφάνεια του ανεμοθώρακα να μην ελαττώνεται με την πάροδο του χρόνου,
β) να μην παραμορφώνουν τις εικόνες των αντικειμένων που φαίνονται δια μέσου του ανεμοθώρακα,
γ) σε περίπτωση θραύσης τους, ο οδηγός να έχει ικανή καθαρή θέα της οδού. Επιτρέπεται η επικόλληση μεμβρανών στα παράθυρα πίσω από τη θέση του οδηγού - συνοδηγού, όταν το αυτοκίνητο διαθέτει δεξιό καθρέπτη, και σε όλα τα παράθυρα του αυτοκινήτου για ιατρικούς λόγους. 9. Το αυτοκίνητο όχημα, το οποίο έχει ανεμοθώρακα διαστάσεων και σχήματος που δεν επιτρέπει στον οδηγό να βλέπει κανονικά μπροστά του, παρά μόνο μέσα από το διαφανές μέρος του ανεμοθώρακα, είναι εφοδιασμένο με έναν (1) τουλάχιστον αποτελεσματικό καθαριστήρα του ανεμοθώρακα, τοποθετημένο σε κατάλληλη θέση, ο οποίος λειτουργεί με τρόπο ώστε να μην απαιτείται διαρκής ενέργεια του οδηγού. Επιπλέον, το όχημα της παρούσας είναι εφοδιασμένο με πλυντήρια του ανεμοθώρακα. Απαγορεύεται η τοποθέτηση ή ανάρτηση μπροστά ή πίσω από τον ανεμοθώρακα, καθώς και η επικόλληση σε αυτόν αντικειμένων που περιορίζουν την ορατότητα του οδηγού. 10. Τα φορτηγά όλων των κατηγοριών, τα λεωφορεία και τα ρυμουλκούμενα φέρουν στους τροχούς του οπίσθιου τελευταίου άξονα λασπωτήρες. 11. Τα αυτοκίνητα οχήματα, εκτός από τα τρίτροχα οχήματα και τις μοτοσικλέτες, είναι εφοδιασμένα με σύστημα κίνησης του οχήματος προς τα πίσω, ο χειρισμός του οποίου γίνεται από τη θέση του οδηγού. 12. Ο κινητήρας εσωτερικής καύσης, ο οποίος χρησιμοποιείται για την προώθηση οδικού οχήματος, είναι εφοδιασμένος με αποτελεσματικό σιγαστήρα, κατάλληλο να μειώνει τον θόρυβο, ο οποίος προκαλείται από την έξοδο των καυσαερίων και τέτοιας κατασκευής, ώστε να μην δύναται να τεθεί εκτός λειτουργίας από τον οδηγό από τη θέση του. 13. Οι τροχοί των μηχανοκίνητων οχημάτων, των ρυμουλκούμενων, των μοτοποδηλάτων και των ποδηλάτων φέρουν ελαστικά με ή χωρίς αεροθάλαμο ή άλλα ελαστικά ανάλογης αποτελεσματικότητας που είναι σε τέτοια κατάσταση, ώστε να εξασφαλίζονται οι συνθήκες ασφάλειας και η πρόσφυση, ακόμη και επί υγρού οδοστρώματος. Τα αυτοκίνητα οχήματα, εκτός των δίτροχων μοτοσικλετών και μοτοποδηλάτων, είναι εφοδιασμένα με έναν (1) εφεδρικό τροχό. Τα επιβατηγά οχήματα, αντί για εφεδρικό τροχό, δύνανται να είναι εφοδιασμένα με κιβώτιο επισκευής ελαστικού ή με ειδικά συστήματα συνέχισης οδήγησης. 14. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα είναι εφοδιασμένα με σύστημα ανάρτησης των τροχών, το οποίο εξασφαλίζει την ελαστική σύνδεση του αμαξώματος του οχήματος με αυτούς και την απόσβεση των ταλαντώσεων. 15. Αυτοκίνητο όχημα, το οποίο μπορεί να υπερβεί την ταχύτητα των σαράντα (40) χιλιομέτρων την ώρα, σε ευθεία οριζόντια οδό, είναι εφοδιασμένο με μετρητή ταχύτητας (ταχόμετρο) που να λειτουργεί σωστά. 16. Τα μηχανοκίνητα οχήματα, εκτός από τις δίτροχες μοτοσικλέτες χωρίς καλάθι, τα τρίτροχα μοτοποδήλατα και τα ρυμουλκούμενα, είναι εφοδιασμένα με την πινακίδα ή την ειδική συσκευή επισήμανσης, σύμφωνα με την παρ. 3 του άρθρου 33, περί κίνησης οχημάτων σε αυτοκινητόδρομους, οδούς ταχείας κυκλοφορίας και σήραγγες, και την παρ. 10 του άρθρου 38, περί στάσης και στάθμευσης. Η πιο πάνω πινακίδα αποτελείται από ισόπλευρο τρίγωνο που έχει πλευρά μήκους όχι μικρότερου των σαράντα εκατοστών (0,40 μ.) και πλάτους όχι μικρότερου των πέντε εκατοστών (0,05 μ.), και το εσωτερικό μέρος του μπορεί να είναι κενό ή χρωματισμένο με ανοικτό χρώμα. Οι πλευρές του τριγώνου αυτού είναι κατασκευασμένες από αντανακλαστική ύλη ερυθρού χρώματος. Η πινακίδα είναι κατασκευασμένη με τρόπο ώστε να μπορεί να τοποθετείται σταθερά σε κατακόρυφη θέση. 17. Τα επιβατηγά αυτοκίνητα οχήματα και τα φορτηγά μέγιστου επιτρεπόμενου βάρους μέχρι και τριών χιλιάδων πεντακοσίων χιλιόγραμμων (3.500 χλγρ.) είναι εφοδιασμένα με ζώνες ασφαλείας στα μπροστινά καθίσματα. 18. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα, μέγιστου επιτρεπόμενου βάρους μεγαλύτερου των τριών χιλιάδων πεντακοσίων χιλιόγραμμων (3.500 χλγρ.), είναι εφοδιασμένα με κατάλληλες σφήνες αναστολής κύλισης (τάκοι). 19. Τα ζωήλατα οχήματα, μέγιστου επιτρεπόμενου βάρους μέχρι τριών χιλιάδων χιλιόγραμμων (3.000 χλγρ.), μπορούν να φέρουν μεταλλική στεφάνη στους τροχούς, το πλάτος της οποίας δεν επιτρέπεται να είναι μικρότερο των πέντε εκατοστών (0,05 μ.). Η στεφάνη αυτή είναι συνεχής, κυλινδρική και χωρίς προεξοχές, γωνίες ή διακοπές και δεν στερεώνεται στους τροχούς με καρφιά των οποίων η κεφαλή εξέχει της επιφάνειας της στεφάνης. 20. Τα μηχανήματα έργου και τα αγροτικά μηχανήματα, τα οποία δεν μπορούν να αναπτύξουν ταχύτητα μεγαλύτερη από σαράντα (40) χιλιόμετρα την ώρα σε ευθεία οριζόντια οδό, φέρουν, για την αναγνώρισή τους, στην πίσω πλευρά, ειδική μεταλλική τριγωνική πινακίδα, της οποίας το περίγραμμα φέρει αντανακλαστικό υλικό ερυθρού χρώματος, η δε υπόλοιπη επιφάνεια φθορίζον υλικό επίσης ερυθρού χρώματος. 21. Τα οχήματα, μέγιστου επιτρεπόμενου βάρους επτά χιλιάδων πεντακοσίων χιλιόγραμμων (7.500 χλγρ.) και άνω και τα ρυμουλκούμενα οχήματα μέγιστου επιτρεπόμενου βάρους τριών χιλιάδων χιλιόγραμμων (3.000 χλγρ.) και άνω, φέρουν, για την αναγνώρισή τους, στην οπίσθια πλευρά τους, μία (1) ή δύο (2) μεταλλικές πινακίδες, οι οποίες έχουν εναλλασσόμενες λοξές λωρίδες με φθορίζον υλικό ερυθρού χρώματος και αντανακλαστικό υλικό κίτρινου χρώματος. 22. Τα οχήματα ή οι συνδυασμοί οχημάτων μήκους δεκατριών (13) μέτρων και άνω, φέρουν, για την αναγνώρισή τους, στην οπίσθια πλευρά τους, μία (1) ή δύο (2) πινακίδες, των οποίων η επιφάνεια καλύπτεται με φθορίζον υλικό χρώματος ερυθρού και αντανακλαστικό υλικό χρώματος κίτρινου και επί των οποίων αναγράφονται ειδικά σύμβολα. 23. Τα οχήματα τα οποία μεταφέρουν επικίνδυνα εμπορεύματα φέρουν αναγνωριστικές της επικινδυνότητας του φορτίου πινακίδες και ειδικά σήματα, σύμφωνα με τις ισχύουσες για τις μεταφορές αυτές διατάξεις. 24. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί οδικό όχημα, τρίτροχο όχημα, μοτοσικλέτα, μοτοποδήλατο, αγροτικό μηχάνημα ή μηχάνημα έργων, κατατάσσονται ως εξής:
α) οι παραβάσεις των παρ. 1, 8, 9 και 11, στην κατηγορία Ε1-Β,
β) η παράβαση της παρ. 17, στην κατηγορία Ε2-Α,
γ) οι παραβάσεις των παρ. 2, 3, 4, 5, 6, 7, 10, 14, 15, 16, 18, 19, 20, 21, 22 και 23 στην κατηγορία Ε1-Α,
δ) η παράβαση της παρ. 13:
δα) στην κατηγορία Ε2-Β για τρίτροχο όχημα, μοτοσικλέτα, μοτοποδήλατο, επιβατηγό όχημα ιδιωτικής χρήσης ή φορτηγό όχημα έως και τρεισήμισι (3,5) τόνους και
δβ) στην κατηγορία Ε3-Β για φορτηγό όχημα άνω των τρεισήμισι (3,5) τόνων, λεωφορείο, αγροτικό μηχάνημα ή μηχάνημα έργου. Προκειμένου για φορτηγά οχήματα άνω των τρεισήμισι (3,5) τόνων, λεωφορεία, αγροτικά οχήματα και μηχανήματα έργου, το προβλεπόμενο διοικητικό πρόστιμο επιβάλλεται στον ιδιοκτήτη του οχήματος. 25. Η παράβαση για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα άλλης κατηγορίας, κατά παράβαση του παρόντος άρθρου ή που δεν είναι εφοδιασμένο με τους προβλεπόμενους στο παρόν άρθρο, κατά περίπτωση, μηχανισμούς, πινακίδες, συσκευές ή συστήματα ή που έχει μηχανισμούς, πινακίδες, συσκευές ή συστήματα, που δεν πληρούν τις απαιτήσεις του παρόντος άρθρου, κατατάσσεται στην κατηγορία Ε1-Α. 26. Κατ’ εξαίρεση των παρ. 24 και 25, η παράβαση της παρ. 12 κατατάσσεται στην κατηγορία Ε2-Α και στην κατηγορία Σ.`},
  86: {title:`Ειδικές διατάξεις`,text:`Ειδικές διατάξεις
1. Η κατασκευή των μηχανοκίνητων οχημάτων, μοτοποδηλάτων, ποδηλάτων και Ε.Π.Η.Ο. είναι τέτοια, ώστε να αποφεύγεται η πρόκληση οποιουδήποτε κινδύνου, εκπομπής υπερβολικών ρύπων, οσμών, θορύβων, πυρκαγιάς ή έκρηξης.
2. Η λειτουργία των κυκλωμάτων υψηλής τάσης των οδικών οχημάτων απαγορεύεται να προκαλεί, από την υπερβολική εκπομπή ραδιοπαρασίτων, αισθητή παρενόχληση.
3. Το μηχανοκίνητο όχημα είναι κατασκευασμένο με τρόπο ώστε το πεδίο ορατότητας του οδηγού, μπροστά, δεξιά, και αριστερά αυτού, να είναι αρκετό για να είναι δυνατή η ασφαλής οδήγηση.
4. Τα μηχανοκίνητα οχήματα, τα μοτοποδήλατα και τα ρυμουλκούμενα είναι κατασκευασμένα και εξοπλισμένα με τρόπο ώστε να περιορίζεται κατά το δυνατόν, σε περίπτωση ατυχήματος, ο κίνδυνος, τόσο για τους επιβαίνοντες αυτών όσο και για τους λοιπούς χρήστες της οδού. Ιδιαιτέρως, τα οχήματα αυτά δεν φέρουν στο εσωτερικό και εξωτερικό τους μέρος διακοσμητικά ή άλλα αντικείμενα που προεξέχουν και τα οποία είναι δυνατόν να καταστούν επικίνδυνα για τους επιβάτες ή τους λοιπούς χρηστές της οδού.
5. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε1-Α.`},
  87: {title:`Εξωτερική εμφάνιση αυτοκινήτων οχημάτων KEΦAΛAIO Ζ’ ΤΑΞΙΝΟΜΗΣΗ, ΑΠΟΓΡΑΦΗ ΚΑΙ ΘΕΣΗ ΟΧΗΜΑΤΩΝ ΣΕ ΚΥΚΛΟΦΟΡΙΑ`,text:`Εξωτερική εμφάνιση αυτοκινήτων οχημάτων
1. Σε περίπτωση μεταβολής του εξωτερικού χρωματισμού που αναγράφεται στην άδεια κυκλοφορίας του αμαξώματος αυτοκινήτου οχήματος, ο κάτοχος αυτού, μέσα σε δεκαπέντε (15) ημέρες από τη μεταβολή, γνωστοποιεί αυτό στην αρμόδια υπηρεσία του Υπουργείου Υποδομών και Μεταφορών.
2. Η αναγραφή ή τοποθέτηση διαφημίσεων στο εσωτερικό ή εξωτερικό του αμαξώματος αυτοκινήτων οχημάτων, τα οποία εκτελούν δημόσια συγκοινωνία, επιτρέπεται εφόσον δεν ανατρέπεται ο ομοιόμορφος χρωματισμός που χαρακτηρίζει το δημόσιο μέσο μεταφοράς.
3. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε1-Α. KEΦAΛAIO Ζ’ ΤΑΞΙΝΟΜΗΣΗ, ΑΠΟΓΡΑΦΗ ΚΑΙ ΘΕΣΗ ΟΧΗΜΑΤΩΝ ΣΕ ΚΥΚΛΟΦΟΡΙΑ`},
  88: {title:`Έγκριση τύπου οχημάτων`,text:`Έγκριση τύπου οχημάτων
1. Για την κυκλοφορία στη χώρα των μηχανοκίνητων οχημάτων, των ρυμουλκούμενων από αυτά και των τρίτροχων οχημάτων, μοτοσικλετών και μοτοποδηλάτων, είτε αυτά εισάγονται από το εξωτερικό είτε κατασκευάζονται ή συναρμολογούνται στο εσωτερικό, απαιτείται προηγούμενη έγκριση του τύπου αυτών, η οποία χορηγείται από τις αρμόδιες υπηρεσίες των Υπουργείων Αγροτικής Ανάπτυξης και Τροφίμων, για τα αγροτικά μηχανήματα, Υποδομών και Μεταφορών για τα μηχανήματα έργου και για τα λοιπά οχήματα.
2. Η έγκριση τύπου τεχνικών ολοτήτων και συστατικών στοιχείων αυτοκινήτων οχημάτων, των ρυμουλκούμενών τους και των τρίτροχων οχημάτων και μοτοσικλετών, χορηγείται από την αρμόδια υπηρεσία του Υπουργείου Υποδομών και Μεταφορών.
3. Εκτός του οδικού δικτύου ή σε οδούς και χώρους που είναι αδύνατη η δημόσια κυκλοφορία οχημάτων, επιτρέπεται η μεταφορά επιβατών με κατάλληλα για αυτό τον σκοπό μηχανήματα έργου.
4. Για την κυκλοφορία οχημάτων που προορίζονται να κυκλοφορούν μέσα σε ειδικούς περιφραγμένους χώρους, μπορεί να προβλέπεται ειδικότερη διαδικασία, σε σχέση με εκείνη των παρ. 1 έως 3. 5. Για την άρση αμφισβητήσεων σχετικά με τον χαρακτηρισμό μηχανοκίνητου οχήματος ως αυτοκινήτου, αγροτικού μηχανήματος ή μηχανήματος έργου, αποφασίζει αρμόδια επιτροπή. 6. Τα επιβατηγά αυτοκίνητα οχήματα, που τέθηκαν το πρώτον σε κυκλοφορία στη χώρα μετά από την 1η Ιανουαρίου 1993 είναι εφοδιασμένα με ζώνες ασφαλείας και στα πίσω καθίσματα.`},
  89: {title:`Στοιχεία αναγνώρισης πλαισίου και κινητήρα`,text:`Στοιχεία αναγνώρισης πλαισίου και κινητήρα
1. Στο πλαίσιο ή το αμάξωμα των αυτοκινήτων οχημάτων και των υπ’ αυτών ρυμουλκούμενων και των τρίτροχων οχημάτων και μοτοσικλετών, σημειώνονται το όνομα του κατασκευαστή, τα στοιχεία τα οποία χαρακτηρίζουν τον τύπο του οχήματος και ο αύξων αριθμός κατασκευής του. Στον κινητήρα των οχημάτων του προηγούμενου εδαφίου, σημειώνονται τα στοιχεία που χαρακτηρίζουν τον τύπο αυτού και ο αριθμός σειράς κατασκευής του.
2. Πριν από την αντικατάσταση ή επιδιόρθωση τμήματος του αμαξώματος ή του πλαισίου των αυτοκινήτων, των τρίτροχων οχημάτων και των μοτοσικλετών, η οποία έχει ως αποτέλεσμα την εξαφάνιση ή την αλλοίωση, ολικά ή μερικά, του τύπου και του αριθμού πλαισίου, οι κάτοχοι αυτών ενημερώνουν, πριν από την επέμβαση, τις κατά τόπους αρμόδιες υπηρεσίες της αποκεντρωμένης διοίκησης, οι οποίες προβαίνουν στη χάραξη του αριθμού κυκλοφορίας ή του αριθμού πλαισίου σε άλλη κατάλληλη θέση.
3. Η παράβαση για τον κάτοχο οχήματος των κατηγοριών του παρόντος, ο οποίος παραποιεί ή εξαφανίζει τα αναφερόμενα στην παρ. 1 στοιχεία αναγνώρισης του οχήματος, καθώς και αυτόν που ενεργεί την παραποίηση ή αλλοίωση, κατατάσσεται στην κατηγορία Ε3-Β και τιμωρείται με ποινή φυλάκισης μέχρι ενός (1) έτους και με οριστική αφαίρεση των στοιχείων κυκλοφορίας του οχήματος, η οποία επιβάλλεται από το δικαστήριο.
4. Η παράβαση για τον κάτοχο οχήματος των κατηγοριών του παρόντος και αυτόν που ενεργεί την αντικατάσταση ή επιδιόρθωση της παρ. 2, χωρίς να τηρηθεί η σε αυτή προβλεπόμενη διαδικασία, κατατάσσεται στην κατηγορία Ε3-Β και τιμωρείται με φυλάκιση μέχρι ενός (1) έτους και με αφαίρεση των στοιχείων κυκλοφορίας του οχήματος για χρονικό διάστημα ενός (1) έως τριών (3) μηνών, η οποία επιβάλλεται από το δικαστήριο.`},
  90: {title:`Τεχνικός έλεγχος οχημάτων`,text:`Τεχνικός έλεγχος οχημάτων
1. Τα αυτοκίνητα οχήματα, τρίτροχα οχήματα, μοτοσικλέτες και μοτοποδήλατα, τα οποία κυκλοφορούν στη χώρα, και τα υπ’ αυτών ρυμουλκούμενα, υπόκεινται σε τακτικό περιοδικό τεχνικό έλεγχο.
2. Εάν για οδικό όχημα ή ρυμουλκούμενο της παρ. 1, δημιουργούνται αμφιβολίες για την ασφαλή και κανονική γενικά κυκλοφορία του στις οδούς, οι Αστυνομικές Αρχές και οι υπηρεσίες που είναι εξουσιοδοτημένες από τους αρμόδιους υπουργούς ή περιφερειάρχες μπορούν να διατάσσουν τον έκτακτο τεχνικό έλεγχο αυτού.
3. Η παράβαση για τον οδηγό ή τον κάτοχο επιβατικού δημοσίας χρήσης, ασθενοφόρου, φορτηγού και ρυμουλκούμενου άνω των τρεισήμισι (3,5) τόνων και λεωφορείου που δεν το προσκομίζει για τον τακτικό ή έκτακτο τεχνικό έλεγχο εντός της καθοριζόμενης προθεσμίας ή παραβαίνει την παρ. 1 του άρθρου 5 του ν. 1350/1983 (Α’ 55), περί απαγόρευσης κυκλοφορίας οδικών οχημάτων όταν αυτά δεν έχουν εφοδιαστεί με πιστοποιητικό τεχνικού ελέγχου, κατατάσσεται στην κατηγορία Ε3-Β. Η ίδια παράβαση για τα υπόλοιπα οχήματα κατατάσσεται στην κατηγορία Ε2-Β.
4. Το προβλεπόμενο στην παρ. 3 διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης επιβάλλεται μόνο στον οδηγό. Το διοικητικό πρόστιμο και το διοικητικό μέτρο της αφαίρεσης των στοιχείων κυκλοφορίας, όπου προβλέπεται, επιβάλλονται στον ιδιοκτήτη του οχήματος. 5.α. Όλα τα μηχανήματα έργου υπόκεινται σε περιοδικό έλεγχο τεχνικής επάρκειας κάθε πέντε (5) έτη, μετά την έκδοση αρχικής άδειας μηχανημάτων έργου. β. Το αντικείμενο του περιοδικού ελέγχου τεχνικής επάρκειας μηχανημάτων έργου αφορά σε θέματα ασφάλειας λειτουργίας και κυκλοφορίας του μηχανήματος έργου. γ. Ο περιοδικός έλεγχος τεχνικής επάρκειας των μηχανημάτων έργου διενεργείται από Φορείς Ελέγχου (Φ.Ε.) οι οποίοι έχουν εγκριθεί από το Υπουργείο Ανάπτυξης, σύμφωνα με τη διαδικασία της υπ’ αρ. 3354/91/8.2.2001 απόφασης του Υφυπουργού Ανάπτυξης «Καθορισμός πλαισίου για την αναγνώριση της ικανότητας και την έγκριση φορέων πιστοποίησης ή ελέγχου στον υποχρεωτικό τομέα» (Β’ 149), όπως εκάστοτε ισχύει και είναι διαπιστευμένοι για τον σκοπό αυτόν, σύμφωνα με το πρότυπο «ISO ΕΝ 17020», όπως κάθε φορά ισχύει. Τα πρόσωπα του Φ.Ε. που διενεργούν περιοδικούς ελέγχους τεχνικής επάρκειας μηχανημάτων έργου είναι μηχανικοί τριτοβάθμιας εκπαίδευσης. δ. Οι κυρώσεις των παρ. 3 και 4 εφαρμόζονται αναλογικά και για τα μηχανήματα έργου. ε. Για την «Οριστική Διαγραφή» και «Προσωρινή Διαγραφή» μηχανήματος έργου και οχήματος ειδικής κατηγορίας από το μητρώο μηχανημάτων έργου και οχημάτων ειδικής κατηγορίας, όπως καθορίζεται στην υπό στοιχεία οικ. 21867/26.9.2016 κοινή απόφαση των Υπουργών Οικονομικών και Υποδομών, Μεταφορών και Δικτύων «Όροι, προϋποθέσεις και διαδικασίες εγκρίσεων τύπου και αδειών κυκλοφορίας που αφορούν τα Μηχανήματα Έργων (Μ.Ε.) και τα οχήματα ειδικής κατηγορίας» ( Β’ 3276), όπως εκάστοτε ισχύει, που δεν εξαιρούνται από την καταβολή τελών χρήσης, αρκεί η προσκόμιση βεβαίωσης της αρμόδιας υπηρεσίας της Φορολογικής Διοίκησης ότι τα υπόψη τέλη είναι βεβαιωμένα και εξοφλημένα για τα προηγούμενα έτη και κατ’ ανώτατο για τα τελευταία δέκα (10) έτη από την ημερομηνία διαγραφής, όπως ορίζεται στην ανωτέρω κοινή υπουργική απόφαση. Η προσκόμιση της βεβαίωσης του προηγούμενου εδαφίου δεν επηρεάζει τις οφειλές από τέλη πέραν του άνω χρονικού διαστήματος.`},
  91: {title:`Γενική απογραφή και ταξινόμηση οχημάτων`,text:`Γενική απογραφή και ταξινόμηση οχημάτων
1. Δεν επιτρέπεται σε κανένα μηχανοκίνητο όχημα ή ρυμουλκούμενο να κυκλοφορεί οπουδήποτε στη χώρα, εάν δεν έχει απογραφεί και ταξινομηθεί κατά την οριζόμενη εκάστοτε γενική απογραφή και ταξινόμηση των οχημάτων.
2. Η παράβαση για αυτόν που κυκλοφορεί μηχανοκίνητο όχημα, το οποίο δεν έχει νόμιμα απογραφεί και ταξινομηθεί, κατατάσσεται στην κατηγορία Ε3-Β και τα στοιχεία κυκλοφορίας του οχήματός του επιστρέφονται μετά την απογραφή του. Για τη σχετική παράβαση που αφορά σε φορτηγά οχήματα εφαρμόζεται ο ν. 3446/2006 (Α’ 49), περί οργάνωσης και λειτουργίας αρχών ελέγχου κυκλοφορίας των οχημάτων. Το άρθρο 50, περί ακινητοποίησης οχήματος, μπορεί να εφαρμοστεί και στην περίπτωση του παρόντος.`},
  92: {title:`Άδεια κυκλοφορίας οχημάτων`,text:`Άδεια κυκλοφορίας οχημάτων
1. Δεν επιτρέπεται μηχανοκίνητο όχημα, ρυμουλκούμενο, μοτοποδήλατο, ή ζωήλατο όχημα να κυκλοφορεί οπουδήποτε στη ώρα, αν δεν έχει εκδοθεί γι’ αυτό άδεια κυκλοφορίας.
2. Η παράβαση για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί αυτοκίνητο όχημα ή ρυμουλκούμενο από αυτό, καθώς και τρίτροχο όχημα ή μοτοσικλέτα, που δεν είναι εφοδιασμένο με άδεια κυκλοφορίας ή του οποίου η άδεια κυκλοφορίας έχει αφαιρεθεί κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ, η επί τόπου αφαίρεση για τριάντα (30) ημέρες της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος. Εφόσον αυτά υπάρχουν και έχουν αφαιρεθεί, το χρονικό διάστημα αφαίρεσής τους προστίθεται στο ήδη επιβαλλόμενο χρονικό διάστημα αφαίρεσής τους. Για τη σχετική παράβαση που αφορά φορτηγά οχήματα έχουν εφαρμογή οι ειδικές διατάξεις του ν. 3446/2006 (Α’ 49).
3. Η παράβαση για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί αγροτικό μηχάνημα με ή χωρίς ρυμουλκούμενο ή μηχάνημα έργου με ή χωρίς ρυμουλκούμενο, που δεν είναι εφοδιασμένο με άδεια κυκλοφορίας ή του οποίου η άδεια κυκλοφορίας έχει αφαιρεθεί κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ, η επί τόπου αφαίρεση για τριάντα (30) ημέρες της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος. Εφόσον αυτά υπάρχουν και έχουν αφαιρεθεί, το χρονικό διάστημα αφαίρεσής τους προστίθεται στο ήδη επιβαλλόμενο χρονικό διάστημα αφαίρεσής τους.
4. Η παράβαση για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί μοτοποδήλατο που δεν είναι εφοδιασμένο με άδεια κυκλοφορίας ή του οποίου η άδεια κυκλοφορίας έχει αφαιρεθεί ή έχει λήξει, κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ, η επί τόπου αφαίρεση για τριάντα (30) ημέρες της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος. Εφόσον αυτά υπάρχουν και έχουν αφαιρεθεί, το χρονικό διάστημα αφαίρεσής τους προστίθεται στο ήδη επιβαλλόμενο χρονικό διάστημα αφαίρεσής τους. Η παράβαση για αυτόν που θέτει σε κυκλοφορία και αυτόν που οδηγεί ζωήλατο όχημα, που δεν είναι εφοδιασμένο με άδεια κυκλοφορίας, κατατάσσεται στην κατηγορία Ε2-Α.`},
  93: {title:`Μεταβολή στοιχείων της αδείας κυκλοφορίας`,text:`Μεταβολή στοιχείων της αδείας κυκλοφορίας
1. Κατά την αλλαγή κατόχου οδικού οχήματος και κατά τη μεταβολή των αναγραφόμενων κύριων χαρακτηριστικών στοιχείων στην άδεια κυκλοφορίας, όταν αυτά επιτρέπονται, απαιτείται η έκδοση νέας άδειας, μετά από εξακρίβωση των νέων στοιχείων, από τις κατά περίπτωση αρμόδιες για την έκδοση των αδειών κυκλοφορίας υπηρεσίες.
2. Αν διαπιστωθεί από αρμόδιο όργανο ότι δεν τηρήθηκε η παρ. 1, μέσα στην προθεσμία που καθορίζεται στην απόφαση της περ. γ) της παρ. 27 του άρθρου 112, αφαιρούνται η άδεια και οι πινακίδες αριθμού κυκλοφορίας του οχήματος, οι οποίες επιστρέφονται μετά από την έκδοση νέας άδειας, σύμφωνα με την παρ. 1. 3. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε3-Β. Για τη σχετική παράβαση που αφορά σε φορτηγά οχήματα έχουν εφαρμογή οι ειδικές διατάξεις του ν. 3446/2006 (Α’ 49).`},
  94: {title:`Πινακίδες αριθμού κυκλοφορίας`,text:`Πινακίδες αριθμού κυκλοφορίας
1. Δεν επιτρέπεται μηχανοκίνητο όχημα, ρυμουλκούμενο, μοτοποδήλατο, ή ζωήλατο όχημα να κυκλοφορεί οπουδήποτε στη χώρα, αν δεν φέρει τις πινακίδες αριθμού κυκλοφορίας, οι οποίες χορηγήθηκαν νόμιμα. Οι χορηγούμενες πινακίδες είναι αντανακλαστικές.
2. Απαγορεύεται για οποιαδήποτε αιτία η αντικατάσταση των πινακίδων, που καθορίζονται στην παρ. 1 με άλλες που δεν έχουν χορηγηθεί νόμιμα ή η παραποίηση αυτών με οποιαδήποτε μορφή, όπως με τεμαχισμό, αλλαγή σχήματος ή γράμματος ή με κάμψη της πινακίδας, ή η μετάθεση της πινακίδας από το ένα όχημα σε άλλο ή η κατασκευή από άλλον πλην του κατά τις διατάξεις του παρόντος οριζομένου και με τρόπο διάφορο, καθώς και η πώληση, αγορά και χρήση τέτοιων πινακίδων. Οι παραβάτες της παρούσας και αυτοί που υποβάλλουν ψευδή στοιχεία για τη λήψη ανταλλακτικών πινακίδων, έχοντας ως σκοπό την παράνομη χρησιμοποίησή τους, τιμωρούνται με φυλάκιση μέχρι ενός (1) έτους.
3. Η παράβαση για αυτόν που θέτει σε κυκλοφορία αυτοκίνητο όχημα, το οποίο δεν έχει τοποθετημένες και τις δύο (2) πινακίδες αριθμού κυκλοφορίας, οι οποίες έχουν νόμιμα χορηγηθεί, καθώς και για εκείνον, ο οποίος κυκλοφορεί άλλης κατηγορίας όχημα, που δεν είναι εφοδιασμένο με κανονικές πινακίδες αριθμού κυκλοφορίας, κατατάσσεται στην κατηγορία Ε3-Β. Στην ίδια κατηγορία κατατάσσεται και η παράβαση για αυτόν που οδηγεί οδικό όχημα του οποίου οι πινακίδες δεν είναι, για οποιονδήποτε λόγο, ευκρινώς ορατές ή αναγνωρίσιμες από τεχνικά μέσα βεβαίωσης παραβάσεων ή τοποθετεί επ’ αυτών μη αντανακλαστικό υλικό. Για τη σχετική παράβαση που αφορά φορτηγά οχήματα έχουν εφαρμογή οι ειδικές διατάξεις του ν. 3446/2006 (Α’ 49). Επιπλέον των διοικητικών κυρώσεων της παρούσας, όποιος καταλαμβάνεται να θέτει σε κυκλοφορία όχημα οι πινακίδες του οποίου έχουν αφαιρεθεί για παραβάσεις του παρόντος νόμου τιμωρείται με ποινή φυλάκισης έως ενός (1) έτους και χρηματική ποινή τουλάχιστον δύο χιλιάδων (2.000) ευρώ, εφόσον η πράξη δεν τιμωρείται βαρύτερα με άλλη διάταξη.`},
  95: {title:`Κυκλοφορία αυτοκινήτων οχημάτων στο εξωτερικό - Κυκλοφορία ξένων αυτοκινήτων`,text:`Κυκλοφορία αυτοκινήτων οχημάτων στο εξωτερικό - Κυκλοφορία ξένων αυτοκινήτων
1. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα, που έχουν απογραφεί στη χώρα, δεν επιτρέπεται να εξέλθουν των ορίων της, αν δεν είναι εφοδιασμένα με τα υπό των σχετικών διεθνών συμβάσεων και κανονισμών καθοριζόμενα πιστοποιητικά και λοιπά έγγραφα, καθώς και με το διεθνές διακριτικό σήμα των αυτοκινήτων της Ελλάδας. Ξένα αυτοκίνητα απαγορεύεται να εισέρχονται και να κυκλοφορούν στη χώρα, αν δεν φέρουν τα διακριτικό σήμα της χώρας στην οποία έχουν απογραφεί.
2. Τα οχήματα και τα ρυμουλκούμενα από αυτά τα οποία έχουν απογραφεί στη χώρα, απαγορεύεται να φέρουν διεθνές διακριτικό σήμα ξένου κράτους.
3. Η παράβαση της παρ. 2 κατατάσσεται στην κατηγορία Ε1-Α.`},
  96: {title:`Αφαίρεση άδειας και αριθμού κυκλοφορίας`,text:`Αφαίρεση άδειας και αριθμού κυκλοφορίας Η άδεια και οι πινακίδες αριθμού κυκλοφορίας αφαιρούνται, εκτός των περιπτώσεων οι οποίες προβλέπονται από τις ισχύουσες διατάξεις και:
α) όταν δεν συντρέχουν πλέον οι προϋποθέσεις με τις οποίες χορηγήθηκαν,
β) όταν δεν συντρέχουν οι όροι για την ασφαλή κυκλοφορία του οχήματος.`},
  97: {title:`Παύση κυκλοφορίας οχήματος KEΦAΛAIO Η’ ΙΚΑΝΟΤΗΤΑ ΟΔΗΓΗΣΗΣ - ΕΓΓΡΑΦΑ ΑΠΟΔΕΙΞΗΣ ΙΚΑΝΟΤΗΤΑΣ - ΕΙΔΙΚΗ ΣΗΜΑΝΣΗ`,text:`Παύση κυκλοφορίας οχήματος
1. Όταν μηχανοκίνητο όχημα ή ρυμουλκούμενο, τρίτροχο όχημα, μοτοσικλέτα, που έχει απογραφεί, καταστρέφεται, διαλύεται ή εξάγεται οριστικά στην αλλοδαπή, ο κάτοχός του, μέσα σε δύο (2) μήνες, από τον χρόνο της καταστροφής, διάλυσης ή εξαγωγής, υποβάλλει σχετική δήλωση στην αρμόδια υπηρεσία της οικείας αποκεντρωμένης διοίκησης και παραδίδει σε αυτήν την άδεια και τις πινακίδες αριθμού κυκλοφορίας του οχήματος.
2. Οι κάτοχοι αγροτικών μηχανημάτων ή μηχανημάτων έργου που έχουν απογραφεί, στις περιπτώσεις της παρ. 1, υποχρεούνται να παραδώσουν την άδεια κυκλοφορίας και τις πινακίδες των οχημάτων αυτών στην αρμόδια υπηρεσία του Υπουργείου Αγροτικής Ανάπτυξης και Τροφίμων ή του Υπουργείου Περιβάλλοντος και Ενέργειας, κατά περίπτωση.
3. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε1-Α. KEΦAΛAIO Η’ ΙΚΑΝΟΤΗΤΑ ΟΔΗΓΗΣΗΣ - ΕΓΓΡΑΦΑ ΑΠΟΔΕΙΞΗΣ ΙΚΑΝΟΤΗΤΑΣ - ΕΙΔΙΚΗ ΣΗΜΑΝΣΗ`},
  98: {title:`Άδειες οδήγησης - Κυρώσεις - Άδειες εκπαιδευτών υποψήφιων οδηγών`,text:`Άδειες οδήγησης - Κυρώσεις - Άδειες εκπαιδευτών υποψήφιων οδηγών
1. Για την οδήγηση μοτοποδηλάτων και ελαφρών τετρακύκλων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και αυτοκινήτων απαιτείται η κατοχή της κατάλληλης κατηγορίας άδειας οδήγησης. Οι κατηγορίες των αδειών οδήγησης, η κλιμάκωση και η ισοδυναμία μεταξύ των κατηγοριών, καθώς και η χορήγηση, η ανανέωση και η αμοιβαία αναγνώριση και ανταλλαγή αυτών ορίζονται στο π.δ. 51/2012 (Α’ 101).
2. Απαγορεύεται η οδήγηση μοτοποδηλάτων και ελαφρών τετρακύκλων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και αυτοκινήτων:
α) από πρόσωπα τα οποία δεν κατέχουν ισχύουσα ελληνική άδεια οδήγησης της κατάλληλης κατηγορίας. Η απαγόρευση αυτή δεν ισχύει για τα πρόσωπα, τα οποία εκπαιδεύονται ή εξετάζονται προκειμένου να αποκτήσουν ή ανανεώσουν συγκεκριμένης κατηγορίας άδεια οδήγησης, εφόσον είναι εφοδιασμένα με τα προβλεπόμενα έγγραφα για τον σκοπό αυτόν,
β) από πρόσωπα τα οποία δεν κατέχουν ισχύουσα ελληνική ειδική άδεια ή ισχύον ελληνικό πιστοποιητικό, τα οποία απαιτούνται για την οδήγηση ειδικών κατηγοριών οδικών οχημάτων, ακόμα και εάν κατέχουν την άδεια οδήγησης της περ. α),
γ) ειδικά για τα μοτοποδήλατα με μέγιστη εκ κατασκευής ανώτατη ταχύτητα έως είκοσι πέντε (25) χιλιόμετρα την ώρα, από πρόσωπα που δεν έχουν συμπληρώσει την ηλικία των δεκαπέντε (15) ετών.
δ) από πρόσωπα των οποίων έχει παύσει αυτοδικαίως να ισχύει η άδεια οδήγησης λόγω παύσης πλήρωσης των απαιτούμενων προδιαγραφών σωματικής και διανοητικής ικανότητας υπό τις οποίες τους χορηγήθηκε, όπως οι προδιαγραφές αυτές ορίζονται στο Παράρτημα ΙΙΙ του π.δ. 51/2012.
3. Δεν υπάγονται στις απαγορεύσεις της περ. α) της παρ. 2 και εφόσον έχουν συμπληρώσει την ελάχιστη απαιτούμενη ηλικία που προβλέπεται για τη χορήγηση ελληνικής άδειας οδήγησης:
α) οι κάτοχοι ισχύουσας άδειας οδήγησης, αντίστοιχης κατηγορίας, η οποία έχει εκδοθεί από κράτος μέλος της Ευρωπαϊκής Ένωσης ή από τη Νορβηγία, την Ισλανδία ή το Λιχτενστάιν,
β) οι κάτοχοι ισχύουσας διεθνούς άδειας οδήγησης η οποία έχει εκδοθεί από οποιοδήποτε κράτος, εκτός της Ελλάδος, και δεν έχουν τη συνήθη διαμονή τους στην Ελλάδα,
γ) οι κάτοχοι ισχύουσας άδειας οδήγησης, η οποία έχει εκδοθεί από κράτη εκτός της Ευρωπαϊκής Ένωσης, με τα οποία η Ελλάδα έχει συνάψει ειδική συμφωνία, η οποία έχει κυρωθεί με νόμο και οι οποίοι δεν έχουν τη συνήθη διαμονή τους στην Ελλάδα,
δ) οι κάτοχοι ισχύουσας άδειας οδήγησης κατά τα οριζόμενα σε διεθνείς συμβάσεις ή συμφωνίες που έχουν κυρωθεί με νόμο και οι οποίοι δεν έχουν τη συνήθη διαμονή τους στην Ελλάδα,
ε) οι οδηγοί μοτοποδηλάτων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και αυτοκινήτων, τα οποία ανήκουν στις ελληνικές ένοπλες δυνάμεις ή στα σώματα ασφαλείας, εφόσον είναι κάτοχοι ισχύουσας άδειας οδήγησης που έχει εκδοθεί από τις αρμόδιες υπηρεσίες τους,
στ) τα μέλη διπλωματικών αποστολών και προξενικών αρχών, τα μέλη Διεθνών Οργανισμών και Γραφείων Διεθνών Οργανισμών στην Ελλάδα και τα μέλη των οικογενειών τους, υπήκοοι τρίτων χωρών, πλην των κρατών μελών της Ευρωπαϊκής Ένωσης, της Νορβηγίας, της Ισλανδίας ή του Λιχτενστάιν, καθώς και κάτοχοι δελτίου ταυτότητας εκδοθέντος από τη Διεύθυνση Εθιμοτυπίας του Υπουργείου Εξωτερικών, εφόσον κατέχουν ισχύουσα άδεια οδήγησης της χώρας τους, υπό την προϋπόθεση ότι αυτή συνοδεύεται από βεβαίωση της εκδούσας αρχής, για το δικαίωμα οδήγησης οχήματος βάσει των κατηγοριών που κατέχουν, επίσημα μεταφρασμένη,
ζ) οι κάτοχοι ισχύουσας άδειας οδήγησης μοτοποδηλάτων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και επιβατικών αυτοκινήτων που δεν έχουν τη συνήθη διαμονή τους στην Ελλάδα και η οποία έχει εκδοθεί από κράτος στο οποίο δεν εκδίδεται διεθνής άδεια οδήγησης. Προς τούτο, απαιτείται η εθνική άδεια των αντίστοιχων κατηγοριών να συνοδεύεται από επίσημη μετάφρασή της στην ελληνική ή την αγγλική γλώσσα,
η) οι κάτοχοι ισχύουσας άδειας οδήγησης μοτοποδηλάτων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και επιβατικών αυτοκινήτων, κατά τη διαμονή τους στην Ελλάδα, η οποία έχει εκδοθεί από τις Ηνωμένες Πολιτείες Αμερικής, τον Καναδά, την Κοινοπολιτεία της Αυστραλίας, το Ηνωμένο Βασίλειο της Μεγάλης Βρετανίας και της Βόρειας Ιρλανδίας, τα εξαρτώμενα εδάφη του Βρετανικού Στέμματος (Γκέρνσεϊ, Νήσος Μαν και Τζέρσεϋ) ή το Γιβραλτάρ. 4.α) Η παράβαση για αυτόν που καταλαμβάνεται να οδηγεί και στερείται ή δεν κατέχει την κατάλληλη άδεια οδήγησης, σύμφωνα με τους όρους και τις προϋποθέσεις του π.δ. 51/2012 ή η άδεια οδήγησής του έχει ανακληθεί ή αφαιρεθεί για οποιονδήποτε λόγο, κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται η επί τόπου αφαίρεση της άδειας οδήγησης για ένα (1) έτος, εφόσον υπάρχει και των στοιχείων κυκλοφορίας του οχήματος, για τριάντα (30) ημέρες καθώς και οι ακόλουθες διοικητικές κυρώσεις, ανά περίπτωση:
αα) για μοτοποδήλατα, μοτοσικλέτες, μηχανοκίνητα τρίκυκλα, ελαφρά τετράκυκλα ή τετράκυκλα, επιβάλλεται διοικητικό πρόστιμο πεντακοσίων (500) ευρώ,
αβ) για επιβατηγά αυτοκίνητα ιδιωτικής χρήσης, επιβάλλεται διοικητικό πρόστιμο επτακοσίων (700) ευρώ,
αγ) για επιβατηγά αυτοκίνητα δημόσιας χρήσης και λεωφορεία, επιβάλλεται διοικητικό πρόστιμο χιλίων (1.000) ευρώ, επιπλέον των κυρώσεων του ν. 4070/2012 (Α’ 82),
αδ) για φορτηγά επιβάλλονται τα διοικητικά πρόστιμα και οι κυρώσεις του ν. 3446/2006 (Α’ 49) στα πρόσωπα που ορίζονται με τις διατάξεις του νόμου αυτού.
β) Επιπλέον των διοικητικών κυρώσεων της περ. α), αυτός που καταλαμβάνεται να οδηγεί όχημα, ενώ η άδεια οδήγησής του έχει αφαιρεθεί για παραβάσεις του παρόντος νόμου τιμωρείται με ποινή φυλάκισης έως ενός (1) έτους και με χρηματική ποινή τουλάχιστον δύο χιλιάδων (2.000) ευρώ.
γ) Όποιος οδηγεί και στερείται ή δεν κατέχει την κατάλληλη άδεια οδήγησης, σύμφωνα με τους όρους και τις προϋποθέσεις του π.δ. 51/2012 ή η άδεια οδήγησής του έχει ανακληθεί ή αφαιρεθεί σύμφωνα με την περ. γ) της παρ. 7 και την παρ. 8 του άρθρου 46, την περ. α) της παρούσας και τις παρ. 3 και 4 του άρθρου 100, τα άρθρα 101 και 110 εάν γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε βαριά σωματική βλάβη ή σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων τιμωρείται με τις ποινές των περ. γγ) και
δδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί επικίνδυνης οδήγησης. 5. Δικαίωμα συμμετοχής στις εξετάσεις για τη χορήγηση (αρχικής) άδειας οδήγησης σύμφωνα με την παρ. 1, έχει ο παραβάτης, μετά από το πέρας του χρονικού διαστήματος από την ημερομηνία που καταλήφθηκε να οδηγεί χωρίς άδεια, με την προσκόμιση του αποδεικτικού καταβολής του διοικητικού προστίμου. 6. Η παράβαση για αυτόν που καταλαμβάνεται να οδηγεί αυτοκίνητο φορτηγό ή λεωφορείο χωρίς να κατέχει το κατάλληλο Πιστοποιητικό Επαγγελματικής Ικανότητας σύμφωνα με το π.δ. 74/2008 (Α’ 112), κατατάσσεται στην κατηγορία Ε3-Β. 7. Για οδήγηση οχημάτων σε χώρα όπου δεν αναγνωρίζεται η ελληνική άδεια οδήγησης απαιτείται η κατοχή της κατάλληλης κατηγορίας διεθνούς άδειας οδήγησης, σύμφωνα με διεθνείς συμβάσεις ή συμφωνίες που έχουν κυρωθεί με νόμο. Η διεθνής άδεια οδήγησης εκδίδεται στην Ελλάδα από τους εθνικούς εκπροσώπους των διεθνών αυτοκινητιστικών ενώσεων.`},
  99: {title:`Ισχύς αδειών οδήγησης`,text:`Ισχύς αδειών οδήγησης
1. Η ισχύς των αδειών οδήγησης ορίζεται στο π.δ. 51/2012 (Α’ 101).
2. Η παράβαση για αυτόν που καταλαμβάνεται να οδηγεί μοτοποδήλατο, μοτοσικλέτα, μηχανοκίνητο τρίκυκλο, ελαφρύ τετράκυκλο, τετράκυκλο και αυτοκίνητο, ενώ το έντυπο της άδειας οδήγησης ή η αντίστοιχη κατηγορία άδειας οδήγησης έχει λήξει, κατατάσσεται στην κατηγορία Ε2-Α. Παράλληλα, αφαιρείται από αρμόδιο όργανο ελέγχου το έντυπο της άδειας οδήγησής του και αποστέλλεται στην αρμόδια υπηρεσία Μεταφορών και Επικοινωνιών της Περιφέρειας που το χορήγησε ή σε αυτή, στην περιοχή της οποίας θα δηλώσει ο κάτοχός της ότι κατοικεί. Νέο έντυπο άδειας οδήγησης εκδίδεται μετά από την ανανέωσή της. Για τη σχετική παράβαση που αφορά φορτηγά οχήματα έχουν εφαρμογή οι ειδικές διατάξεις του ν. 3446/2006 (Α’ 49). Για τη σχετική παράβαση που αφορά στην ειδική άδεια οδήγησης οδηγού επιβατικού δημοσίας χρήσης αυτοκινήτου έχουν εφαρμογή οι ειδικές διατάξεις του ν. 4070/2012 (Α’ 82).
3. Η παράβαση για αυτόν που καταλαμβάνεται να οδηγεί αυτοκίνητο φορτηγό ή λεωφορείο ενώ έχει λήξει το Πιστοποιητικό Επαγγελματικής Ικανότητας, σύμφωνα με το π.δ. 74/2008 (Α’ 112), κατατάσσεται στην κατηγορία Ε3-Α. Παράλληλα, αφαιρείται από αρμόδιο όργανο ελέγχου, το έντυπο της άδειας οδήγησής του και αποστέλλεται στην αρμόδια Υπηρεσία Μεταφορών και Επικοινωνιών της Περιφέρειας που τη χορήγησε ή σε αυτή, στην περιοχή της οποίας δηλώνει ο κάτοχός της ότι κατοικεί. Νέο έντυπο άδειας οδήγησης εκδίδεται μετά από την ανανέωση του Π.Ε.Ι..`},
  100: {title:`Άδειες οδήγησης αγροτικών μηχανημάτων και μηχανημάτων έργου`,text:`Άδειες οδήγησης αγροτικών μηχανημάτων και μηχανημάτων έργου
1. Δεν επιτρέπεται σε κανέναν να οδηγεί αγροτικό μηχάνημα ή μηχάνημα έργου αν δεν έχει την κατά νόμο άδεια οδήγησης ή όταν η άδεια αυτή έχει αφαιρεθεί.
2. Κατ’ εξαίρεση της παρ. 1, οχήματα ειδικής κατηγορίας που έχουν χαρακτηριστεί ως ειδικοί ελκυστήρες ή ως μηχανήματα έργου - μετατοπιστικά βαρέων αντικειμένων και κυκλοφορούν αποκλειστικά εντός εγκαταστάσεων λιμένων ή αερολιμένων δύναται να οδηγούνται από οδηγούς κατόχους αδειών οδήγησης κατηγορίας CE, σύμφωνα με το π.δ. 51/2012 (Α’ 101) ή από οδηγούς κατόχους αδειών οδήγησης μηχανημάτων έργου.
3. Η παράβαση για αυτόν που οδηγεί αγροτικό μηχάνημα ή μηχάνημα έργου χωρίς να έχει την απαιτούμενη άδεια οδήγησης ή όταν αυτή έχει ανακληθεί, αφαιρεθεί ή έχει λήξει, κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ, η επί τόπου αφαίρεση της άδειας οδήγησης για ένα (1) έτος, εφόσον υπάρχει και των στοιχείων κυκλοφορίας του οχήματος, για τριάντα (30) ημέρες. Επιπλέον των ανωτέρω διοικητικών κυρώσεων, εκείνος που οδηγεί όχημα του προηγούμενου εδαφίου ενώ η άδεια οδήγησής του έχει αφαιρεθεί, για παραβάσεις του παρόντος νόμου τιμωρείται με ποινή φυλάκισης έως ενός (1) έτους και χρηματική ποινή τουλάχιστον δύο χιλιάδων (2.000) ευρώ.
4. Όποιος οδηγεί αγροτικό μηχάνημα ή μηχάνημα έργου χωρίς να έχει την απαιτούμενη άδεια οδήγησης ή όταν αυτή έχει λήξει ή ανακληθεί ή αφαιρεθεί σύμφωνα με την περ. γ) της παρ. 7 και την παρ. 8 του άρθρου 46, την περ. α) της παρ. 4 του άρθρου 98 και την παρούσα, τα άρθρα 101 και 110 εάν γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε βαριά σωματική βλάβη ή σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων επιβάλλονται οι ποινές των περ. γγ) και
δδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί επικίνδυνης οδήγησης.
5. Δικαίωμα συμμετοχής στις εξετάσεις για τη χορήγηση (αρχικής) άδειας οδήγησης σύμφωνα με την παρ. 1, έχει ο παραβάτης, μετά από το πέρας του χρονικού διαστήματος από την ημερομηνία που καταλήφθηκε να οδηγεί χωρίς άδεια, μόνο με την προσκόμιση του αποδεικτικού καταβολής του διοικητικού προστίμου.`},
  101: {title:`Ειδικές περιπτώσεις αφαίρεσης άδειας οδήγησης`,text:`Ειδικές περιπτώσεις αφαίρεσης άδειας οδήγησης
1. Αν για τη διάπραξη κακουργήματος ή εκ δόλου πλημμελήματος χρησιμοποιήθηκε οδικό όχημα ως μέσο για τη τέλεση αυτού, αφαιρούνται, με απόφαση δικαστηρίου, η άδεια και οι πινακίδες κυκλοφορίας του οχήματος, καθώς επίσης και η άδεια οδήγησης του οδηγού που οδηγούσε το πιο πάνω όχημα, για χρονικό διάστημα ενός (1) μέχρι δέκα (10) ετών, εφόσον η επιβαλλόμενη ποινή είναι φυλάκιση τριών (3) τουλάχιστον μηνών.
2. Αυτός που καταλαμβάνεται να κατέχει πλαστή ή παραποιημένη άδεια οδήγησης ή να κάνει χρήση αυτής, τιμωρείται με τις ποινές του άρθρου 216 του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί πλαστογραφίας.
3. Η άδεια οδήγησης οδικού οχήματος αφαιρείται με δικαστική απόφαση, αν από τις γενόμενες ανακρίσεις αποδειχθεί ότι ο κάτοχός της έγινε υπαίτιος τραυματισμού ή θανάτου με το όχημα που οδηγούσε, παραβαίνοντας διατάξεις του παρόντος. Ειδικότερα τα πιο πάνω αναφερόμενα στοιχεία αφαιρούνται ως εξής.
α) Για χρονικό διάστημα τουλάχιστον τριών (3) μηνών και μέχρι δύο (2) ετών, αν από το τροχαίο ατύχημα προκλήθηκε σοβαρός τραυματισμός επιβαινόντων σε οποιοδήποτε όχημα ή πεζού.
β) Για χρονικό διάστημα τουλάχιστον δύο (2) ετών και μέχρι πέντε (5) ετών, εάν επήλθε θάνατος κατά την πρό κληση του ατυχήματος, συμπεριλαμβανομένων και των περιπτώσεων που ο θάνατος επήλθε σε χρόνο μεταγενέστερο του ατυχήματος και συνδέεται αιτιωδώς με αυτό. Στην περίπτωση αυτή η επαναχορήγηση της άδειας γίνεται μόνο μετά από επιτυχή θεωρητική και πρακτική εξέταση και εφόσον ο υπαίτιος οδηγός παρακολουθήσει το ισχύον πρόγραμμα θεωρητικής και πρακτικής εκπαίδευσης υποψήφιων οδηγών σύμφωνα με το π.δ. 51/2012 (Α’ 101).
γ) Σε περίπτωση υποτροπής, τα παραπάνω στοιχεία αφαιρούνται, με δικαστική απόφαση, τουλάχιστον για διπλάσιο χρονικό διάστημα από τα προβλεπόμενα στις περ. α) και β). Το δικαστήριο δύναται σε αυτή την περίπτωση να επιβάλλει και την ποινή της οριστικής αφαίρεσης της άδειας οδήγησης.
4. Αυτός που καταλαμβάνεται να οδηγεί οδικό όχημα χωρίς τη νόμιμη άδεια οδήγησης, εκτός των λοιπών προβλεπόμενων ποινών, στερείται του δικαιώματος απόκτησης άδειας οδήγησης οποιασδήποτε κατηγορίας, με απόφαση του δικαστηρίου, για τρία (3) τουλάχιστον έτη και για δέκα (10) τουλάχιστον έτη, αν έγινε υπαίτιος τροχαίου ατυχήματος με σοβαρό τραυματισμό ή θάνατο.
5. Αυτός που καταλαμβάνεται να οδηγεί οδικό όχημα, κατά το διάστημα που του έχει αφαιρεθεί η άδεια οδήγησης για οποιονδήποτε λόγο, εκτός των λοιπών προβλεπόμενων ποινών, στερείται, με απόφαση του δικαστηρίου, του δικαιώματος επαναχορήγησης της άδειας οδήγησης για τρία (3) επιπλέον έτη, ενώ αν γίνει υπαίτιος τροχαίου ατυχήματος με τραυματισμό ή θάνατο, το δικαστήριο δύναται να επιβάλλει και την ποινή της δια βίου αφαίρεσης της άδειας οδήγησης οποιουδήποτε οδικού οχήματος.`},
  102: {title:`Παραχώρηση της οδήγησης οχήματος`,text:`Παραχώρηση της οδήγησης οχήματος
1. Απαγορεύεται η παραχώρηση της οδήγησης οδικού οχήματος σε πρόσωπο το οποίο δεν έχει τη νόμιμη, κατά περίπτωση, άδεια οδήγησης και το αναγκαίο, κατά περίπτωση, πιστοποιητικό επαγγελματικής ικανότητας ή σε πρόσωπο του οποίου τα στοιχεία αυτά έχουν αφαιρεθεί για οποιαδήποτε παράβαση. Στη δεύτερη περίπτωση η απαγόρευση ισχύει μόνο κατά τη διάρκεια της αφαίρεσης των ως άνω στοιχείων.
2. Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε3-Β.`},
  103: {title:`Έγγραφα τα οποία πρέπει να φέρει ο οδηγός`,text:`Έγγραφα τα οποία πρέπει να φέρει ο οδηγός
1. Ο οδηγός οδικού οχήματος, όταν οδηγεί, φέρει:
α) τη νόμιμη άδεια οδήγησης σε έντυπη ή ψηφιακή μορφή,
β) την άδεια κυκλοφορίας του οχήματος,
γ) το αποδεικτικό ασφάλισης,
δ) την απόδειξη πληρωμής των τελών κυκλοφορίας,
ε) κατά περίπτωση:
εα) την ειδική άδεια οδήγησης οδηγού επιβατικού δημοσίας χρήσης αυτοκινήτου,
εβ) το Πιστοποιητικό Επαγγελματικής Ικανότητας,
εγ) το Πιστοποιητικό Επαγγελματικής Κατάρτισης Οδηγού Οχημάτων Μεταφοράς Επικίνδυνων Εμπορευμάτων (ΑDR) και τα λοιπά έγγραφα που απαιτεί η Ευρωπαϊκή Συμφωνία για τη Διεθνή Οδική Μεταφορά Επικίνδυνων Εμπορευμάτων (ΑDR), η οποία κυρώθηκε με τον ν. 1741/1987 (Α’ 225),
εδ) το δελτίο τεχνικού ελέγχου,
εε) την κάρτα ελέγχου καυσαερίων, εστ) τη βεβαίωση καλής λειτουργίας ταχογράφου,
εζ) τη βεβαίωση περιοριστή ταχύτητας και
εη) το σχετικό αυτοκόλλητο σήμα, καθώς και
στ) οποιοδήποτε άλλο έγγραφο, βεβαίωση, ή πιστοποιητικό απαιτείται ανάλογα με την κατηγορία του οχήματος από τις ειδικές διατάξεις. Οι οδηγοί των ποδηλάτων και των Ε.Π.Η.Ο. από δώδεκα (12) ετών και άνω φέρουν, όταν οδηγούν, οποιοδήποτε νόμιμο έγγραφο ταυτοποίησης προσώπου. Ειδικά τα οχήματα που είναι μισθωμένα από εταιρείες ενοικιαζόμενων αυτοκινήτων ή χρηματοδοτικής μίσθωσης (leasing), φέρουν μόνο αντίγραφο της άδειας κυκλοφορίας, ενώ δεν υποχρεούνται να φέρουν το αποδεικτικό ασφάλισης και την απόδειξη πληρωμής των τελών κυκλοφορίας.
2. Η παράβαση της παρ. 1 για την έλλειψη καθενός από τα παραπάνω έγγραφα κατατάσσεται στην κατηγορία Ε1-Α.`},
  104: {title:`Χρήση βοηθητικών οργάνων κατά την οδήγηση`,text:`Χρήση βοηθητικών οργάνων κατά την οδήγηση
1. Οι οδηγοί οδικών οχημάτων, όταν οδηγούν, φορούν γυαλιά ή χρησιμοποιούν άλλα βοηθητικά όργανα ή μέσα, αν αυτό αναγράφεται στην άδειά τους. Οι οδηγοί μοτοσικλετών, αν το κράνος το οποίο φορούν δεν έχει διαφανές προστατευτικό κάλυμμα, φορούν και γυαλιά κατά του ανέμου.
2. Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε2-Α.`},
  105: {title:`Ειδικό σήμα αναγνώρισης νέων οδηγών αυτοκινήτων οχημάτων`,text:`ΜΕΡΟΣ Γ’ ΔΙΟΙΚΗΤΙΚΑ ΜΕΤΡΑ - ΚΥΡΩΣΕΙΣ ΚΑΙ ΥΠΟΤΡΟΠΗ
Ειδικό σήμα αναγνώρισης νέων οδηγών αυτοκινήτων οχημάτων
1. Οι νέοι οδηγοί τοποθετούν στο αυτοκίνητο που οδηγούν ειδικό σήμα αναγνώρισης για έναν (1) χρόνο από την απόκτηση της άδειας.
2. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε1-Α.
ΜΕΡΟΣ Γ’ ΔΙΟΙΚΗΤΙΚΑ ΜΕΤΡΑ - ΚΥΡΩΣΕΙΣ ΚΑΙ ΥΠΟΤΡΟΠΗ`},
  106: {title:`Επιβολή διοικητικών μέτρων`,text:`Επιβολή διοικητικών μέτρων
1. Τα στοιχεία κυκλοφορίας, άδεια και κρατικές πινακίδες κυκλοφορίας, όλων των κατηγοριών οχημάτων δεν αφαιρούνται, με εξαίρεση:
α) παραβάσεις που η αφαίρεση επιβάλλεται με απόφαση δικαστηρίου,
β) παραβάσεις οι οποίες αναφέρονται σε ελλείψεις ή ελαττωματική λειτουργία του οχήματος και οι οποίες επηρεάζουν την οδική ασφάλεια ή προκαλούν εκπομπές επικίνδυνων καυσαερίων και υπερβολικούς θορύ βους, όπως προβλέπονται στην παρ. 2 του άρθρου 19, περί εκπομπών, ρύπων και θορύβων, στις παρ. 11 και 12 του άρθρου 24, περί ορίων ταχύτητας, στην παρ. 6 του άρθρου 36, περί φόρτωσης οχημάτων, στις περ. ιστ),
ιζ) και
ιη) της παρ. 2 του άρθρου 38, περί στάσης και στάθμευσης, στην περ. γ της παρ. 7 του άρθρου 46, περί οδήγησης υπό την επίδραση αλκοόλ, στην παρ. 8 του άρθρου 46, περί οδήγησης υπό την επίδραση τοξικών ουσιών, στο άρθρο 50, περί ακινητοποίησης οχήματος, στην παρ. 13 του άρθρου 85, περί μηχανισμών, εξαρτημάτων και συσκευών οχημάτων, στα άρθρα 89, περί στοιχείων αναγνώρισης πλαισίου και κινητήρα, 90, περί τεχνικού ελέγχου οχημάτων, 91, περί γενικής απογραφής και ταξινόμησης οχημάτων, στην παρ. 4 του άρθρου 92, περί άδειας κυκλοφορίας οχημάτων, στο άρθρο 93, περί μεταβολής στοιχείων της άδειας κυκλοφορίας, στο άρθρο 94, περί πινακίδων αριθμού κυκλοφορίας, στην παρ. 2 του άρθρου 98, περί αδειών οδήγησης, κυρώσεων και αδειών εκπαιδευτών υποψήφιων οδηγών, καθώς και στα άρθρα 100, περί αδειών οδήγησης αγροτικών μηχανημάτων και μηχανημάτων έργου, και 102, περί παραχώρησης της οδήγησης οχήματος,
γ) παραβάσεις των άρθρων 7 και 8 και του άρθρου 38, περί στάσης και στάθμευσης, που αφορούν στη στάθμευση και προβλέπεται αφαίρεση της άδειας οδήγησης, όταν αυτή δεν ενεργείται αμέσως και επί τόπου από τον βεβαιούντα την παράβαση. Στην περίπτωση αυτή, τα στοιχεία κυκλοφορίας του οχήματος που αφαιρούνται επιστρέφονται στον κάτοχο με την προσκόμιση της άδειας οδήγησης.
2. Για τις παραβάσεις της παρ. 1, οι οποίες αναφέρονται σε ελλείψεις ή ελαττωματική λειτουργία του οχήματος που επηρεάζουν την οδική ασφάλεια ή σε εκπομπές επικίνδυνων καυσαερίων και την πρόκληση υπερβολικών θορύβων, η επιστροφή των αφαιρεθέντων στοιχείων κυκλοφορίας του οχήματος γίνεται μόνον εφόσον διαπιστωθεί αρμοδίως η αποκατάσταση του ελαττώματος ή των ελλείψεων του οχήματος. Για τα οχήματα που είναι υπόχρεα σε περιοδικό τεχνικό έλεγχο, η διαπίστωση αυτή προκύπτει από την προσκόμιση δελτίου τεχνικού ελέγχου, χωρίς σοβαρές ή επικίνδυνες ελλείψεις και χωρίς τις ελλείψεις για τις οποίες σημειώθηκε η παράβαση. Αν δεν έχει αποκατασταθεί το ελάττωμα ή η έλλειψη για τα οποία έγινε η αφαίρεση των στοιχείων της κυκλοφορίας του οχήματος, μετά από την παρέλευση του χρόνου μέχρι τον οποίο διαρκεί το ληφθέν διοικητικό μέτρο, παρατείνεται η λήψη του μέτρου αυτού μέχρι να διαπιστωθεί αρμοδίως η αποκατάσταση των ελαττωμάτων ή ελλείψεων του οχήματος.
3. Για τις παραβάσεις της παρ. 1 που αφορούν την οδήγηση οχήματος κατά παράβαση των άρθρων 46, 98, 100 και 102, η επιστροφή των αφαιρεθέντων στοιχείων κυκλοφορίας του οχήματος γίνεται μετά από την παρέλευση του χρόνου αφαίρεσης, μόνο με την προσκόμιση αποδεικτικού καταβολής των διοικητικών προστίμων. Για οχήματα που είναι μισθωμένα από εταιρείες ενοικιαζόμενων αυτοκινήτων ή από εταιρείες χρηματοδοτικής μίσθωσης (leasing), εφόσον η διάρκεια της μίσθωσης είναι μικρότερη του χρονικού διαστήματος της επιβληθείσας αφαίρεσης, τα στοιχεία κυκλοφορίας επιστρέφονται στην εκμισθώτρια εταιρεία, με την προσκόμιση του σχετικού συμφωνητικού μίσθωσης του οχήματος.
4. Για τις παραβάσεις, στην περίπτωση των οποίων προβλέπεται αφαίρεση της άδειας οδήγησης και οι οποίες κατατάσσονται στην κατηγορία Ε4, καθώς και για τις παραβάσεις των άρθρων 46, περί οδήγησης υπό την επίδραση οινοπνεύματος, φαρμάκων ή τοξικών ουσιών, και 102, περί παραχώρησης της οδήγησης οχήματος, οι οποίες κατατάσσονται στην κατηγορία Ε3-Β, η άδεια οδήγησης επιστρέφεται μετά από την παρέλευση του χρόνου αφαίρεσής της, μόνο με την προσκόμιση αποδεικτικού καταβολής των διοικητικών προστίμων.
5. Η αφαίρεση της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος ενεργείται αμέσως και επί τόπου από τον βεβαιούντα την παράβαση αστυνομικό ή άλλα αρμόδια όργανα. Η άδεια οδήγησης και τα στοιχεία κυκλοφορίας του οχήματος προσκομίζονται άμεσα από το όργανο που ενέργησε την αφαίρεση, στην αρμόδια Αστυνομική Αρχή μαζί με τη σχετική έκθεση της παράβασης.
6. Τα προβλεπόμενα στις παρ. 1 έως 5 διοικητικά μέτρα μπορούν να επικυρωθούν ή να αρθούν κατόπιν υποβολής αντιρρήσεων αυτού σε βάρος του οποίου λαμβάνονται, στην αρμόδια Αρχή. Αν η άμεση αφαίρεση των πινακίδων είναι αδύνατη, ενεργείται αμέσως μόλις καταστεί αυτό δυνατόν και σε κάθε περίπτωση, πριν από την παραγραφή της παράβασης για την οποία προβλέπεται η αφαίρεση των πινακίδων. Σε κάθε περίπτωση επιβολής των διοικητικών μέτρων των παρ. 1 έως 5, ο οδηγός, κάτοχος ή ιδιοκτήτης, κατόπιν έγγραφης ή ηλεκτρονικής ειδοποίησης της οικείας αστυνομικής αρχής, παραδίδουν τα στοιχεία κυκλοφορίας του οχήματος, καθώς και την άδεια οδήγησης εντός πέντε (5) ημερών από την ειδοποίηση. Αυτός που δεν συμμορφώνεται, τιμωρείται με τις ποινές του άρθρου 169 του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί απείθειας. Η εκτέλεση του διοικητικού μέτρου δεν επηρεάζεται από την έκβαση της ποινικής δίκης.
7. Τα προβλεπόμενα διοικητικά μέτρα του παρόντος επιβάλλονται παράλληλα και ανεξάρτητα από τις ποινικές ή άλλες κυρώσεις, που προβλέπονται από τις οικείες διατάξεις.
8. Όταν η άδεια οδήγησης έχει αφαιρεθεί για παράβαση του παρόντος και επιβάλλεται εκ νέου αφαίρεση από άλλη παράβαση, η επιβολή του διοικητικού μέτρου αρχίζει κάθε φορά από τη λήξη του χρόνου της προηγούμενης αφαίρεσης.
9. Στους παραβάτες των οχημάτων για την κυκλοφορία των οποίων δεν απαιτούνται στοιχεία κυκλοφορίας ή άδεια οδήγησης ή και τα δύο, επιβάλλονται οι κυρώσεις μόνο κατά το σκέλος του διοικητικού προστίμου. Σε παραβάσεις για τις οποίες δεν προβλέπεται άλλη κύρωση, επιβάλλεται το διοικητικό πρόστιμο της κατηγορίας Ε1-Α.
10. Σε περίπτωση συρροής παραβάσεων, επιβάλλεται συνολικό διοικητικό μέτρο, το οποίο αποτελείται από το σύνολο των διοικητικών μέτρων τα οποία προβλέπονται για κάθε μία από τις επιμέρους παραβάσεις σύμφωνα με τα προβλεπόμενα στον παρόντα.
11. Σε περίπτωση παραβίασης των πινακίδων Ρ-67 και Ρ-67α της παρ. 3 του άρθρου 7 και της περ. ι) της παρ. 8 του άρθρου 8 εξαιρούνται από την επιβολή του διοικητικού μέτρου αφαίρεσης της άδειας οδήγησης οι οδηγοί επιβατικών δημόσιας χρήσης (ΤΑΞΙ) της υποπερ. α) της περ. 19 του άρθρου 4.`},
  107: {title:`Επιβολή διοικητικών προστίμων από αστυνομικά όργανα`,text:`Επιβολή διοικητικών προστίμων από αστυνομικά όργανα
1. Στον καταλαμβανόμενο επ’ αυτοφώρω να διαπράττει παραβάσεις, για τις οποίες προβλέπονται διοικητικά πρόστιμα, βεβαιώνεται, με έντυπο ή ηλεκτρονικό τρόπο από το αρμόδιο κατά περίπτωση όργανο το προβλεπόμενο διοικητικό πρόστιμο για καθεμία από αυτές. Σε περιπτώσεις συγκρότησης μικτών συνεργείων για τη διαπίστωση συγκεκριμένων παραβάσεων, την ποινή του προστίμου επιβάλλει το κατά περίπτωση αρμόδιο όργανο που παρίσταται κατά τον έλεγχο.
2. Ο παραβάτης έχει δικαίωμα να υποβάλει αντιρρήσεις εντός προθεσμίας τριών (3) ημερών, με την επιφύλαξη της παρ. 5, που αρχίζει από την επίδοση της βεβαίωσης, με ηλεκτρονικό τρόπο ή, εφόσον αυτό δεν καταστεί δυνατόν, με κάθε άλλο πρόσφορο μέσο στην αρχή, στην οποία ανήκει το ανωτέρω όργανο, όπως αυτή προσδιορίζεται στη σχετική βεβαίωση παράβασης. Η απόφαση με την οποία εξετάζονται οι αντιρρήσεις είναι πλήρως αιτιολογημένη με αναφορά σε συγκεκριμένα περιστατικά και στοιχεία. Αν δεν προβληθούν αντιρρήσεις ή αν αυτές απορριφθούν, επικυρώνεται το διοικητικό πρόστιμο από τον προϊστάμενο της αρχής, εντός προθεσμίας τριών (3) ημερών που εκκινεί από την πάροδο της προθεσμίας του προηγούμενου εδαφίου με την επιφύλαξη της παρ. 5 του παρόντος, εκτός των παρ. 4 και 5 του άρθρου 90, περί τεχνικού ελέγχου οχημάτων, στις οποίες καταβάλλεται διοικητικό πρόστιμο σαράντα πέντε (45) ευρώ, εφόσον ο κάτοχος ή ο οδηγός του οχήματος, εξαιρουμένων επιβατικών δημόσιας χρήσης, ασθενοφόρων, φορτηγών άνω των τρεισήμισι (3,5) τόνων και λεωφορείων, προσκομίσει, εντός προθεσμίας δέκα (10) ημερών, στις αρμόδιες ελεγκτικές αρχές που επέβαλαν το διοικητικό πρόστιμο, ισχύον δελτίο τεχνικού ελέγχου, και επιστρέφονται η άδεια οδήγησης και τα στοιχεία κυκλοφορίας.
3. Το διοικητικό πρόστιμο καταβάλλεται στον δικαιούχο οργανισμό τοπικής αυτοδιοίκησης (Ο.Τ.Α.), εντός προθεσμίας δύο (2) μηνών από τη βεβαίωσή του. Το ίδιο ισχύει και για το πρόστιμο του τελευταίου εδαφίου της παρ. 2, το οποίο καταβάλλεται χωρίς έκπτωση, εφόσον παρέλθει άπρακτη η ανωτέρω προθεσμία των δέκα (10) ημερών.
4. Η παρ. 2 εφαρμόζεται και αν η παράβαση διαπιστώνεται με ειδικές ηλεκτρονικές συσκευές ή με άλλα τεχνικά μέσα, όπως σταθερές ή κινητές κάμερες, με την επιφύλαξη της παρ.
5. Οι ως άνω ειδικές ηλεκτρονικές συσκευές ή τεχνικά μέσα, με τα οποία διενεργείται η διαπίστωση παραβάσεων, δύνανται να τοποθετούνται και σε σταθερά σημεία, καθώς και σε οχήματα έκτακτης ανάγκης του άρθρου 48, περί οχήματος άμεσης ανάγκης και έργων στις οδούς, και δημόσιας οδικής μαζικής μεταφοράς επιβατών και επιτρέπεται να χρησιμοποιούνται, μόνον εφόσον υπάρχει σχετική προειδοποίηση προς το κοινό με σταθερές ή κινητές πινακίδες για την ύπαρξη και λειτουργία τους. 5. Αν η παράβαση διαπιστώνεται με ειδικές ηλεκτρονικές συσκευές της παρ. 4, το διοικητικό πρόστιμο καταβάλλεται στο Εθνικό Ταμείο Οδικής Ασφάλειας της Υπηρεσίας Οδικών Τελών - Ηλεκτρονικής Διαχείρισης Οδικών Υποδομών (Υ.Ο.Τ. - Η.Δ.Ο.Υ.) εντός προθεσμίας δύο (2) μηνών από την επίδοσή της. Η Υ.Ο.Τ. - Η.Δ.Ο.Υ. εισπράττει τα πρόστιμα του προηγούμενου εδαφίου, τα αποδίδει στον δικαιούχο Ο.Τ.Α., παρακρατώντας ποσοστό επί των προστίμων για τη χρηματοδότηση των λειτουργικών της δαπανών, για μέτρα οδικής ασφάλειας και για τη χρηματοδότηση του έργου προμήθειας και εγκατάστασης, λειτουργίας και συντήρησης του δικτύου καμερών καταγραφής παραβάσεων υπέρ του αναδόχου για όσο χρόνο ο ανάδοχος λειτουργεί και συντηρεί το ανωτέρω δίκτυο και για ποσό που δεν υπερβαίνει το οικονομικό αντικείμενο της σύμβασης.
6. Αν η βεβαίωση της παράβασης γίνει μόνο με βάση τον αριθμό κυκλοφορίας του οχήματος, η σχετική βεβαίωση της παράβασης επικολλάται επί του ανεμοθώρακα και στις παραβάσεις που βεβαιώνονται με ηλεκτρονικά μέσα επιδίδεται με δημόσιο έγγραφο, με ηλεκτρονικό τρόπο ή εφόσον δεν είναι δυνατόν, με κάθε άλλο πρόσφορο μέσο στον φερόμενο ως ιδιοκτήτη αυτού και, σε περίπτωση συνιδιοκτησίας, σε έναν από τους συνιδιοκτήτες. Αν ο αναφερόμενος στο προηγούμενο εδάφιο ιδιοκτήτης ισχυριστεί ότι δεν ήταν αυτός ο παραβάτης - οδηγός, για τη συγκεκριμένη παράβαση, υποβάλλει, εντός αποκλειστικής προθεσμίας επτά (7) ημερών από την ημερομηνία της επίδοσης ή της επικόλλησης στον ανεμοθώρακα της πιο πάνω βεβαίωσης, υπεύθυνη δήλωση του ν. 1599/1986 (Α’ 75) στο αστυνομικό τμήμα της περιοχής κατοικίας του ή στην υπηρεσία του οργάνου που βεβαίωσε την παράβαση, στην οποία να δηλώνει ότι δεν είναι αυτός ο παραβάτης - οδηγός, υποδεικνύει τον αληθή οδηγό, προσκομίζοντας και αντίστοιχη υπεύθυνη δήλωση του υποδεικνυόμενου προσώπου, συνοδευόμενη με ενδεχόμενες αντιρρήσεις του υποδεικνυόμενου προσώπου για την παράβαση. Η παρούσα ισχύει και σε περιπτώσεις που τα οχήματα είναι μισθωμένα είτε από εταιρείες ενοικιαζόμενων αυτοκινήτων είτε από εταιρείες χρηματοδοτικής μίσθωσης (leasing). Αν δεν υποβάλει την παραπάνω δήλωση στην καθοριζόμενη προθεσμία, παραβάτης λογίζεται ο ιδιοκτήτης του οχήματος. Επί συνιδιοκτητών που το ποσοστό συνιδιοκτησίας είναι πενήντα τοις εκατό (50%), παραβάτης λογίζεται αυτός, το όνομα του οποίου αναγράφεται πρώτο στην άδεια κυκλοφορίας του οχήματος, εκτός αν ο έτερος συνιδιοκτήτης με υπεύθυνη δήλωσή του αποδεχθεί ότι διέπραξε αυτός την παράβαση. Επί συνιδιοκτητών με διαφορετικό ποσοστό ιδιοκτησίας ο καθένας, παραβάτης λογίζεται αυτός που έχει το μεγαλύτερο ποσοστό ιδιοκτησίας του οχήματος ή επί εταιρείας ο νόμιμος εκπρόσωπός της. Η έναρξη της διαδικασίας γίνεται με την επίδοση της σχετικής βεβαίωσης της παράβασης ή την επικόλληση αυτής στον ανεμοθώρακα. Κατά τα λοιπά εφαρμόζεται η παρ. 3.
7. Τα πρόστιμα από τις διοικητικές παραβάσεις του παρόντος, που δεν καταβλήθηκαν εντός της προθεσμίας των δύο (2) μηνών, βεβαιώνονται από τον οικείο Ο.Τ.Α., προκειμένου να εισπραχθούν σύμφωνα με τον Κώδικα Είσπραξης Δημοσίων Εσόδων (ν. 4978/2022, Α’ 190 - Κ.Ε.Δ.Ε.). Ειδικά για τα πρόστιμα από τις διοικητικές παραβάσεις που διαπιστώνονται με ηλεκτρονικές συσκευές, τα οποία δεν έχουν καταβληθεί εντός προθεσμίας δυο (2) μηνών, βεβαιώνονται από την Υ.Ο.Τ. - Η.Δ.Ο.Υ., προκειμένου να εισπραχθούν σύμφωνα με τις διατάξεις του Κ.Ε.Δ.Ε..
8. Για τις παραβάσεις του παρόντος από οδηγούς που είναι και ιδιοκτήτες ή κάτοχοι του οχήματος, εφόσον προβλέπεται διοικητικό πρόστιμο και στους ιδιοκτήτες, καταλογίζεται μόνο το πρόστιμο που αφορά τον ιδιοκτήτη ή τον κάτοχο.
9. Σε περίπτωση συρροής παραβάσεων επιβάλλεται συνολικό διοικητικό πρόστιμο, το οποίο αποτελείται από το πρόστιμο που προβλέπεται για τη βαρύτερη παράβαση και το οποίο επαυξάνεται κατά το ήμισυ (1/2) των προστίμων, τα οποία προβλέπονται για τις άλλες συντρέχουσες παραβάσεις, κατά τον υπολογισμό που προβλέπεται παραπάνω.
10. Σε περίπτωση διαρκούς παράβασης, το αρμόδιο κατά περίπτωση όργανο, που τη βεβαιώνει, ορίζει εύλογο χρόνο για την άρση της και αν ο παραβάτης δεν συμμορφωθεί, επιβάλλει νέο πρόστιμο, σύμφωνα με την παρ. 1, μετά από κάθε νέα βεβαίωση της παράβασης.`},
  108: {title:`Κατηγοριοποίηση παραβάσεων`,text:`Κατηγοριοποίηση παραβάσεων
1. Οι παραβάσεις του παρόντος κατατάσσονται ανάλογα με την επικινδυνότητά τους για τη ζωή, την υγεία και τη σωματική ακεραιότητα των χρηστών του οδικού δικτύου, την υποχρέωση για ιδιαίτερη μέριμνα και προστασία για τα άτομα με αναπηρία, την πρόληψη της πρόκλησης τροχαίων ατυχημάτων, καθώς και τις επιπτώσεις της παράβασης στην οδική ασφάλεια, στις εξής κατηγορίες:
α) κατηγορία Ε1,
β) κατηγορία Ε2,
γ) κατηγορία Ε3,
δ) κατηγορία Ε4,
ε) κατηγορία Σ (αντικοινωνικής οδικής συμπεριφοράς).
2. Η κάθε μία από τις κατηγορίες των περ. α), β),
γ) της παρ. 1 διακρίνεται σε δύο υποκατηγορίες, ως εξής:
α) υποκατηγορία Α, για την οποία επιβάλλεται μόνο διοικητικό πρόστιμο, και
β) υποκατηγορία Β για την οποία επιβάλλονται διοικητικό πρόστιμο και διοικητικό μέτρο.
3. Οι παραβάσεις του παρόντος που υποδηλώνουν αντικοινωνική οδική συμπεριφορά, κατατάσσονται, επιπλέον των κατηγοριών των παρ. 1 και 2, και στην κατηγορία Σ. Στις παραβάσεις του προηγούμενου εδαφίου, πέραν του διοικητικού προστίμου και του διοικητικού μέτρου που επιβάλλεται βάσει της κατηγορίας και υποκατηγορίας στην οποία κατατάσσονται, επιβάλλεται και επιπλέον διοικητικό μέτρο.
4. Στην κατηγορία Ε4 κατατάσσονται παραβάσεις με ιδιαίτερες επιπτώσεις για την οδική ασφάλεια. Για τις παραβάσεις που εντάσσονται στην κατηγορία αυτή, επιβάλλονται το διοικητικό πρόστιμο και το διοικητικό μέτρο που αναφέρεται στη συγκεκριμένη σχετική διάταξη.
β) Κάποιες εκ των παραβάσεων επιφέρουν επιπλέον ή μόνο ποινικές κυρώσεις που επιβάλλονται από το δικαστήριο, όπως αναφέρονται στα επιμέρους άρθρα του παρόντος.
5. Για κάθε παράβαση που ανήκει στην ίδια κατηγορία και υποκατηγορία επιβάλλονται οι παρακάτω διοικητικές κυρώσεις:
α) Παράβαση κατηγορίας Ε1:
αα) Ε1-Α επιβάλλεται διοικητικό πρόστιμο τριάντα (30) ευρώ,
αβ) Ε1-Β επιβάλλεται το διοικητικό πρόστιμο της υποκατηγορίας Ε1-Α και το διοικητικό μέτρο αφαίρεσης της άδειας οδήγησης για δέκα (10) ημέρες.
β) Παράβαση κατηγορίας Ε2:
βα) Ε2-Α επιβάλλεται διοικητικό πρόστιμο εκατόν πενήντα (150) ευρώ,
ββ) Ε2-Β επιβάλλεται το διοικητικό πρόστιμο της υποκατηγορίας Ε2-Α και το διοικητικό μέτρο αφαίρεσης της άδειας οδήγησης για είκοσι (20) ημέρες.
γ) Παράβαση κατηγορίας Ε3:
γα) Ε3-Α επιβάλλεται διοικητικό πρόστιμο τριακοσίων πενήντα (350) ευρώ,
γβ) Ε3-Β επιβάλλεται το διοικητικό πρόστιμο της υποκατηγορίας Ε3-Α και το διοικητικό μέτρο αφαίρεσης της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος για τριάντα (30) ημέρες, τηρουμένης της παρ. 1 του άρθρου 106, περί επιβολής διοικητικών μέτρων.
δ) Για τις παραβάσεις της κατηγορίας Σ, πέραν των κυρώσεων που επιβάλλονται σύμφωνα με τις περ. α) έως γ), επιβάλλεται επιπρόσθετα και το διοικητικό μέτρο αφαίρεσης της άδειας οδήγησης του οδηγού για σαράντα (40) ημέρες.
6. Στις επιμέρους διατάξεις του παρόντος αναφέρονται οι παραβάσεις που επιφέρουν, πέραν των διοικητικών κυρώσεων, και ποινικές κυρώσεις ή που επιφέρουν μόνο ποινικές κυρώσεις που επιβάλλονται από το δικαστήριο.`},
  109: {title:`Ανάκληση άδειας ικανότητας οδηγού`,text:`Ανάκληση άδειας ικανότητας οδηγού
1. Αν διαταχθεί κατ’ εφαρμογή του παρόντος, η ανάκληση της άδειας ικανότητας οδηγού, μπορεί ο οδηγός κατά του οποίου λαμβάνεται το μέτρο αυτό, αν συντρέχουν οι νόμιμες προϋποθέσεις, να λάβει νέα άδεια μετά από τρία (3) έτη από την ανάκληση, εκτός και αν πρόκειται για ανάκληση εφ’ όρου ζωής. Η λήψη νέας αδείας ικανότητας οδηγού τελεί υπό την επιφύλαξη του άρθρου 110, περί υποτροπής.
2. Σε περίπτωση ανάκλησης άδειας ικανότητας οδηγού αυτοκινήτων οχημάτων, η Αστυνομική Αρχή, η οποία εκτελεί τη σχετική απόφαση, διαβιβάζει την άδεια στην αρμόδια υπηρεσία της Περιφερειακής Ενότητας που την εξέδωσε.`},
  110: {title:`Υποτροπή - Σύστημα ελέγχου συμπεριφοράς των οδηγών`,text:`Υποτροπή - Σύστημα ελέγχου συμπεριφοράς των οδηγών
1. Ως υποτροπή νοείται η διάπραξη της ίδιας παράβασης εντός χρονικού διαστήματος που ορίζεται στην από φαση της παρ. 2, ανεξάρτητα από την τοπική ή χρονική εγγύτητα από την τέλεση της προηγούμενης παράβασης και ανεξάρτητα από την επίδοση ή μη των εκθέσεων βεβαίωσης παραβάσεων, με την επιφύλαξη των παρ. 3, 4 και 5. Ειδικά για την περίπτωση της παράνομης στάθμευσης του άρθρου 38, περί στάσης και στάθμευσης, όταν αυτή συνεχίζεται πέραν των τριών (3) ωρών, βεβαιώνεται νέα παράβαση και υφίσταται υποτροπή.
2. Στο Σύστημα Ελέγχου της Συμπεριφοράς των Οδηγών (Σ.Ε.Σ.Ο.) μηχανοκίνητων οχημάτων και μοτοποδηλάτων συγκεντρώνονται και καταχωρίζονται τα στοιχεία για τις διαπραττόμενες παραβάσεις του παρόντος και του συνδυασμού κατηγορίας και υποκατηγορίας αυτών, σύμφωνα με το άρθρο 108, περί κατηγοριοποίησης παραβάσεων.
3.
α) Σε περίπτωση διάπραξης για δεύτερη φορά μέσα σε διάστημα πέντε (5) ετών των παραβάσεων του παρόντος που συνδέονται με:
αα) την οδήγηση υπό την επίδραση οινοπνεύματος, σύμφωνα με τις περ. α) και
β) της παρ. 7 του άρθρου 46, περί οδήγησης υπό την επίδραση οινοπνεύματος, φαρμάκων ή τοξικών ουσιών,
αβ) τη Ρυθμιστική Πινακίδα Ρ-2 Υποχρεωτικής διακοπής πορείας (STOP) και τη Ρυθμιστική Πινακίδα Ρ-29, σύμφωνα με τις παρ. 3 και 11 του άρθρου 7, περί σήμανσης οδών με πινακίδες ή την περ. α) της παρ. 2 του άρθρου 33, περί πραγματοποίησης επιτόπιας στροφής,
αγ) τον ερυθρό φωτεινό σηματοδότη, σύμφωνα με τις περ. β), ε),η) καιι) της παρ. 1 του άρθρου 9, περί φωτεινής σηματοδότησης για την κυκλοφορία οχημάτων,
αδ) την οδήγηση οχημάτων για επίδειξη ικανότητας, εντυπωσιασμού, ανταγωνισμού ή την τέλεση αυτοσχέδιων αγώνων, σύμφωνα με την παρ. 8 του άρθρου 16, περί κανόνων οδικής συμπεριφοράς, ή τον συναγωνισμό στην ταχύτητα, σύμφωνα με την παρ. 5 του άρθρου 23, περί ταχύτητας και απόστασης μεταξύ οχημάτων, την οδήγηση που υπερβαίνει τα διακόσια (200) χιλιόμετρα την ώρα της περ. δ) της παρ. 9 του άρθρου 24, περί ορίων ταχύτητας,
αε) τη μη χρήση ζώνης από τους οδηγούς, σύμφωνα με την παρ. 5 και τη μη χρήση κράνους ασφαλείας από τους οδηγούς και από τους συνεπιβάτες σύμφωνα με την παρ. 6 του άρθρου 16, περί κανόνων οδικής συμπεριφοράς,
αστ) τη μη χρήση ειδικών μέσων συγκράτησης και προστασίας κατά τη μεταφορά παιδιών, σύμφωνα με την παρ. 5 του άρθρου 16, την περ. β) της παρ. 2 και την παρ. 3 του άρθρου 37, περί μεταφοράς επιβατών με οχήματα, όσον αφορά το προστατευτικό κράνος συνεπιβάτη,
αζ) τη χρήση κινητού κατά την οδήγηση, σύμφωνα με την παρ. 2 του άρθρου 17, περί οδηγών, και την παρ. 1 του άρθρου 44, περί ειδικών κανόνων για τους οδηγούς ποδηλάτων, μοτοποδηλάτων, μοτοσικλετών, τρίτροχων οχημάτων και Ε.Π.Η.Ο.,
αη) την υπέρβαση κατά πενήντα (50) χιλιόμετρα και άνω του εκάστοτε ισχύοντος ορίου ταχύτητας, σύμφωνα με την περ. γ της παρ. 12 του άρθρου 24,
αθ) τη χρήση της Λ.Ε.Α., σύμφωνα με την παρ. 9 του άρθρου 33, περί κίνησης οχημάτων σε αυτοκινητόδρομους, οδούς ταχείας κυκλοφορίας και σήραγγες,
αι) τη στάση ή στάθμευση σε θέση όπου βρίσκεται ράμπα διάβασης ατόμων με αναπηρία, σύμφωνα με την περ. ιστ) της παρ. 2 του άρθρου 38, ή σε αποκλειστικές ή γενικές θέσεις στάθμευσης ατόμων με αναπηρία, σύμφωνα με την παρ. 3 του άρθρου 7, περί σήμανσης οδών με πινακίδες, και τις περ. ιζ) και ιη) της παρ. 4 του άρθρου 38, στον παραβάτη οδηγό επιβάλλονται διοικητικό πρόστιμο χιλίων (1.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για εκατόν ογδόντα (180) ημέρες, με εξαίρεση την παράβαση της περ. αδ) της παρούσας, για την οποία επιβάλλονται στον παραβάτη διοικητικό πρόστιμο τεσσάρων χιλιάδων (4.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για δύο (2) έτη.
β) Σε περίπτωση διάπραξης για δεύτερη φορά μέσα σε διάστημα πέντε (5) ετών των παραβάσεων του παρόντος που συνδέονται με:
βα) μη συμμόρφωση με σταθερό ερυθρό σηματοδότη του άρθρου 9, όταν αυτή έχει ως αποτέλεσμα την πρόκληση τροχαίου ατυχήματος,
ββ) μη συμμόρφωση με την πινακίδα P-2 ή Ρ-29 ή τον συνδυασμό αυτής με πρόσθετες πινακίδες της περ. β) της παρ. 11 του άρθρου 7 ή την πραγματοποίηση επιτόπιας στροφής της περ. α) της παρ. 2 του άρθρου 33 όταν αυτή έχει ως αποτέλεσμα την πρόκληση τροχαίου ατυχήματος,
βγ) τη χρήση κινητού κατά την οδήγηση, σύμφωνα με την υποπερ. βα) της περ. β) της παρ. 6 του άρθρου 17, περί οδηγών, και της παρ. 16 του άρθρου 44, περί ειδικών κανόνων για τους οδηγούς ποδηλάτων, μοτοποδηλάτων, μοτοσικλετών, τρίτροχων οχημάτων και Ε.Π.Η.Ο.,
βδ) τη μη παραχώρηση προτεραιότητας της περ. ε) της παρ. 5 του άρθρου 30, την παραβίαση φωτεινής σηματοδότησης ή κινητού φράγματος προ ισόπεδης σιδηροδρομικής διάβασης σύμφωνα με τις περ. β),γ) καιδ) της παρ. 1 του άρθρου 31 και τη στάθμευση σε σιδηροδρομική διάβαση της περ. δ) της παρ. 2 του άρθρου 38, περί στάσης και στάθμευσης, και
βε) την οδήγηση υπό την επίδραση οινοπνεύματος, με ποσοστό αλκοόλ άνω του ορίου της περ. γ) της παρ. 7 του άρθρου 46, περί οδήγησης υπό την επίδραση οινοπνεύματος, φαρμάκων ή τοξικών ουσιών, ή υπό την επήρεια ουσιών της παρ. 8 του άρθρου 46, βστ) την εγκατάλειψη των περ. α) και β) της παρ. 2 του άρθρου 47, περί συμπεριφοράς σε περίπτωση ατυχήματος,
