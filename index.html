ε απόφαση του Υπουργού Προστασίας του Πολίτη, καθώς και τα φύλακτρα του οχήματος, βαρύνουν τον ιδιοκτήτη ή κάτοχο αυτού ή του σκάφους ή των άλλων αντικειμένων, ο οποίος μπορεί να τα παραλάβει αμέσως μετά την καταβολή των εξόδων αυτών. Μεταφορά οχήματος, έστω και αν τούτο σταθμεύει νόμιμα, μπορεί να πραγματοποιηθεί σύμφωνα με τα παραπάνω, χωρίς επιβολή διοικητικών ποινών ή άλλων επιβαρύνσεων, όταν υφίσταται κατάσταση ανάγκης ή για λόγους ασφαλείας, ειδοποιημένου όμως προς τούτο, με κάθε πρόσφορο μέσο, του ιδιοκτήτη ή κατόχου, μέσα σε εύλογη προθεσμία.\n10. Ο οδηγός μηχανοκίνητου οχήματος, εκτός των δίτροχων μοτοποδηλάτων και δίτροχων μοτοσικλετών χωρίς καλάθι και των Ε.Π.Η.Ο., αν υποχρεωθεί να σταθμεύσει σε οδόστρωμα σε θέση που απαγορεύεται η στάθμευση, τοποθετεί πινακίδα ή κατάλληλη συσκευή, σύμφωνα με το άρθρο 85, περί μηχανισμών, εξαρτημάτων και συσκευών οχημάτων, με τρόπο ώστε να ειδοποιούνται από απόσταση οι οδηγοί που πλησιάζουν. Η πινακίδα τοποθετείται στο οδόστρωμα και σε απόσταση μεγαλύτερη από είκοσι (20) μέτρα στις κατοικημένες περιοχές, πενήντα (50) δε μέτρα εκτός κατοικημένων περιοχών, με την επιφύλαξη της παρ. 3 του άρθρου 33, περί κίνησης οχημάτων σε αυτοκινητόδρομους, οδούς ταχείας κυκλοφορίας και σήραγγες. Η αυτή υποχρέωση υφίσταται και για τα ρυμουλκούμενα στην ως άνω περίπτωση.\n11.α) Οι παραβάσεις των περ. β), γ), στ), ζ), η), θ),ι) και ιε) της παρ. 2, των περ. δ), στ), η), θ),ι) και ια) της παρ. 3 και των παρ. 7 και 8 κατατάσσονται στην κατηγορία Ε1-Α.\nβ) Οι παραβάσεις των περ. ια), ιβ), ιγ),ιδ) και ιθ) της παρ. 2, των περ. α), β),γ) και ε) της παρ. 3 και των παρ. 5, 6 και 10 κατατάσσονται στην κατηγορία Ε1-Β.\nγ) Οι παραβάσεις της περ. α) της παρ. 2 και της περ. ζ) της παρ. 3 κατατάσσονται στην κατηγορία Ε1-Α και στην κατηγορία Σ.\nδ) Οι παραβάσεις των περ. ιστ),ιζ) και ιη) της παρ. 2 κατατάσσονται στην κατηγορία Ε2-Β και στην κατηγο ρία Σ και αφαιρούνται και τα στοιχεία κυκλοφορίας για εβδομήντα (70) ημέρες.\nε) Οι παραβάσεις της περ. κ) της παρ. 2 κατατάσσονται στην κατηγορία Ε3 - Β και στην κατηγορία Σ.\nστ) Οι παραβάσεις της περ. δ) της παρ. 2 κατατάσσονται στην κατηγορία Ε4 και τιμωρούνται με διοικητικό πρόστιμο χιλίων διακοσίων (1.200) ευρώ και με επί τόπου αφαίρεση της άδειας οδήγησης για εξήντα (60) ημέρες. Επιπλέον των διοικητικών κυρώσεων του προηγουμένου εδαφίου, οι παραβάσεις των περ. δ) της παρ. 2 τιμωρούνται με ποινή φυλάκισης τουλάχιστον ενός έτους και χρηματική ποινή έως δύο χιλιάδες (2.000) ευρώ, εφόσον η πράξη δεν τιμωρείται βαρύτερα σύμφωνα με το άρθρο 291 του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95) ή από άλλη διάταξη.\nζ) Οι παραβάσεις της περ. ε) της παρ. 2 κατατάσσονται στην κατηγορία Ε2-Β. Τα παραπάνω διοικητικά πρόστιμα ορίζονται στο ήμισυ, όταν οι παραβάσεις αφορούν σε μοτοποδήλατα ή μοτοσικλέτες. Αν η παράνομη στάθμευση συνεχίζεται και πέραν των τριών (3) ωρών από τη βεβαίωση της παράβασης, βεβαιώνεται νέα παράβαση από το ίδιο ή άλλο όργανο και μετά την πάροδο του δεύτερου τρίωρου γίνεται μεταφορά του οχήματος, τροχόσπιτου, σκάφους ή των άλλων ογκωδών αντικειμένων, σύμφωνα με την παρ. 9, εκτός αν παρεμποδίζεται η κυκλοφορία ή η στάθμευση οχημάτων ατόμων με αναπηρία ή κυκλοφορία σιδηροδρομικού ή τροχιοδρομικού οχήματος, οπότε η μεταφορά γίνεται αμέσως.\n12. Ειδικά για τους οδηγούς Ε.Π.Η.Ο.:\nα) Οι παραβάσεις των παρ. 1 έως 10 κατατάσσονται στην κατηγορία Ε1-Α.\nβ) Η παράβαση της παρ. 4 κατατάσσεται στην κατηγορία Ε1-Α, πλην των περ. ι), ια),ιβ) και ιθ), οι παραβάσεις των οποίων κατατάσσονται στην κατηγορία Ε2-Α. 13. Ως παραβάτης των διατάξεων που ρυθμίζουν τη στάθμευση θεωρείται ο οδηγός του οχήματος που καταλαμβάνεται επ’ αυτοφώρω και, σε περίπτωση απουσίας του οδηγού, ο κάτοχος αυτού. Εάν το όχημα ανήκει σε επιχείρηση ενοικίασης και είναι μισθωμένο, ως παραβάτης λογίζεται ο μισθωτής που προκύπτει από το μισθωτήριο συμβόλαιο.\n14. Για τα Ε.Π.Η.Ο.:\nα) ως παραβάτης των διατάξεων που ρυθμίζουν τη στάθμευση θεωρείται μόνο ο οδηγός του οχήματος που καταλαμβάνεται επ’ αυτοφώρω,\nβ) σε χώρους μαζικής απόθεσης Ε.Π.Η.Ο. που παραχωρούνται προς χρήση ή ενοικίαση από εταιρείες ενοικίασης ή παραχώρησης προς χρήση, αυτοί καθορίζονται σύμφωνα με το παρόν και οι παραβάσεις για τις εταιρείες παραβάτες κατατάσσονται στην κατηγορία Ε2-Α. Αν η χρήση του χώρου συνεχίζεται και πέραν των πέντε (5) ωρών από τη βεβαίωση της παράβασης, βεβαιώνεται νέα παράβαση κατηγορίας Ε2-Α, από το ίδιο ή άλλο όργανο και μετά την πάροδο του δεύτερου πενταώρου γίνεται μεταφορά των οχημάτων κατά τα οριζόμενα στην παρ. 9, εκτός αν παρεμποδίζεται η κυκλοφορία, οπότε η μεταφορά γίνεται αμέσως.\n15. Απαγορεύεται η κατάληψη με οποιοδήποτε μέσο και για οποιονδήποτε λόγο μέρους ή ολοκλήρου του οδοστρώματος των εθνικών, επαρχιακών, και δημοτικών ή κοινοτικών οδών δια των οποίων διεξάγεται η κυκλοφορία μηχανοκίνητων και μη οχημάτων. Αυτοί που παραβαίνουν με πρόθεση τη διάταξη του προηγουμένου εδαφίου τιμωρούνται με τις ποινές της παρ. 1 του άρθρου 292 του Ποινικού Κώδικα. Παράλληλα, και ανεξάρτητα της κατά το προηγούμενο εδάφιο ποινής, με πράξη του οικείου Περιφερειάρχη, μετά από προηγούμενη ακρόαση αυτού σε βάρος του οποίου λαμβάνεται το μέτρο, ανακαλείται για ένα (1) έτος και σε περίπτωση υποτροπής, οριστικά, αν πρόκειται για όχημα δημόσιας χρήσης, το δικαίωμα κυκλοφορίας αυτού ως δημόσιας χρήσης, διατασσόμενης συγχρόνως της αφαίρεσης των στοιχείων κυκλοφορίας του οχήματος.\n16. Απαγορεύεται η κατάληψη μέρους ή ολόκληρου του οδοστρώματος και των εγκατεστημένων σε αυτό σταθμών διοδίων των αυτοκινητοδρόμων, καθώς και η παρεμπόδιση ή διακοπή (μερική ή ολική) της λειτουργίας των σταθμών διοδίων με οποιονδήποτε τρόπο. Όποιος παραβαίνει με πρόθεση την απαγόρευση του πρώτου εδαφίου τιμωρείται σύμφωνα με την παρ. 1 του άρθρου 292 του Ποινικού Κώδικα.\n17. Επιτρέπεται παρέκκλιση από τις παρ. 2 και 3:\nα) Για τον καθορισμό στις κατοικημένες περιοχές των θέσεων στάσης, αφετηρίας ή στάθμευσης αστικών, υπεραστικών, ηλεκτροκίνητων λεωφορείων ως και τροχιοδρομικών οχημάτων. Στις στάσεις μέσων μαζικής μεταφοράς είναι δυνατή η τοποθέτηση επί του οδοστρώματος ειδικών προεξοχών για την επιβίβαση και την αποβίβαση επιβατών και τη διασφάλιση της προσβασιμότητας των ατόμων με αναπηρία και των εμποδιζομένων ατόμων γενικότερα. Επίσης, επιτρέπεται η τοποθέτηση κατακόρυφων ελαστικών εύκαμπτων επαναφερόμενων κυλίνδρων (οριοδεικτών) στις διασταυρώσεις.\nβ) Για τον καθορισμό των θέσεων αφετηρίας, στάσης/ στάθμευσης (πιάτσες) των επιβατηγών αυτοκινήτων δημόσιας χρήσης (ΤΑΞΙ) στις κατοικημένες περιοχές. Οι θέσεις στάσης/στάθμευσης (πιάτσες) χωροθετούνται πλησίον κεντρικών σημείων σημαντικής προσέλκυσης μετακινήσεων, σε θέσεις όπου εξασφαλίζονται η ασφαλής κυκλοφοριακή ροή και τα επίπεδα κυκλοφοριακής εξυπηρέτησης για όλους τους χρήστες της οδού, σε σημεία του οδικού δικτύου, όπου επιτρέπεται η στάση και στάθμευση. 18. Για τον καθορισμό στις κατοικημένες περιοχές ειδικών χώρων στάθμευσης Ε.Π.Η.Ο., επιτρέπεται παρέκκλιση από τις παρ. 2, 3 και 4. 19. Η στάθμευση οχημάτων σε χώρους ελεγχόμενης στάθμευσης επιτρέπεται για το χρονικό διάστημα για το οποίο έχει καταβληθεί αποδεδειγμένα το τέλος στάθμευσης που καθορίζεται κάθε φορά από την αρμόδια αρχή. Αν η στάθμευση, χωρίς την καταβολή του καθορισμένου τέλους στάθμευσης, συνεχίζεται και πέραν των τριών (3) ωρών από τη βεβαίωση της παράβασης, βεβαιώνεται νέα παράβαση από το ίδιο ή άλλο όργανο. 20. Η παρ. 17 εφαρμόζεται και για τον καθορισμό των θέσεων στάσης και αφετηρίας των λεωφορείων που διενεργούν διεθνείς λεωφορειακές γραμμές, στις περιοχές της Περιφέρειας Αττικής και της Περιφερειακής Ενότητας Θεσσαλονίκης. 21. Για τις παραβάσεις του παρόντος που αφορούν στη στάθμευση προβλέπεται αφαίρεση της άδειας οδήγησης, όταν αυτή δεν ενεργείται αμέσως και επί τόπου από τον βεβαιούντα την παράβαση, αφαιρούνται επί τόπου τα στοιχεία κυκλοφορίας του οχήματος, τα οποία επιστρέφονται στον κάτοχο με την προσκόμιση της άδειας οδήγησης. Για οχήματα που είναι μισθωμένα από εταιρείες ενοικιαζόμενων αυτοκινήτων ή χρηματοδοτικής μίσθωσης (leasing), τα στοιχεία κυκλοφορίας του οχήματος επιστρέφονται με την προσκόμιση του συμφωνητικού μίσθωσης του οχήματος.`},
  39: {title:`Κανόνες χρήσης φώτων εντοπισμού θέσης`,text:`1. Τα μηχανοκίνητα οχήματα στις οδούς, πλην των δίτροχων μοτοσικλετών χωρίς καλάθι, επιβάλλεται να έχουν τη νύχτα και οποτεδήποτε η ορατότητα είναι ανεπαρκής, αναμμένα τουλάχιστον τα δύο (2) λευκά ή ειδικής επιλογής κίτρινα φώτα θέσης στο εμπρόσθιο μέρος τους και ίσο αριθμό ερυθρών φώτων θέσης στο οπίσθιο μέρος τους, σύμφωνα με τα άρθρα 69, περί φώτων θέσης (μικρών), και 70, περί φώτων όγκου και φώτων πλευρικών. Στον συνδυασμό μηχανοκίνητου οχήματος με ένα (1) ή περισσότερα ρυμουλκούμενα, πρέπει τα ερυθρά φώτα θέσης να είναι προσαρμοσμένα και στο οπίσθιο μέρος του τελευταίου ρυμουλκούμενου. Τα ρυμουλκούμενα, των οποίων το πλάτος υπερβαίνει το ένα μέτρο και εξήντα εκατοστά (1,60), επιβάλλεται να έχουν αναμμένα στο εμπρόσθιο μέρος τους τα δύο (2) λευκά φώτα θέσης (πλευρικά) του άρθρου 69.\n2. Οχήματα ή συνδυασμός οχημάτων, στα οποία δεν εφαρμόζεται η παρ. 1, επιβάλλεται τη νύχτα να έχουν αναμμένα τουλάχιστον ένα (1) λευκό ή ειδικής επιλογής κίτρινο φως στο εμπρόσθιο μέρος και τουλάχιστον ένα (1) ερυθρό φως στο οπίσθιο μέρος αυτών. Αν υπάρχει μόνο ένα (1) φως μπροστά και ένα (1) φως πίσω, πρέπει να τοποθετείται αυτό στην κεντρική γραμμή του οχήματος ή στην αριστερή του πλευρά.\n3. Τη νύχτα και οποτεδήποτε η ορατότητα είναι ανεπαρκής, η παρουσία μηχανοκίνητων οχημάτων και των ρυμουλκούμενων οχημάτων που βρίσκονται σε στάση ή στάθμευση πρέπει να επισημαίνεται με τα εμπρόσθια και οπίσθια φώτα θέσης ή στάθμευσης. Εξαιρούνται:\nα) Τα οχήματα που βρίσκονται σε στάση ή στάθμευση σε οδό που φωτίζεται αρκετά,\nβ) τα δίτροχα ποδήλατα, δίτροχα μοτοποδήλατα ή δίτροχες μοτοσικλέτες χωρίς καλάθι, που βρίσκονται σε στάση ή στάθμευση στο άκρο του οδοστρώματος σε κατοικημένη περιοχή και δεν είναι εφοδιασμένα με συσσωρευτή (μπαταρία),\nγ) τα οχήματα που βρίσκονται σε στάση ή στάθμευση σε ειδικούς χώρους έξω από το οδόστρωμα και\nδ) τα οχήματα που βρίσκονται σε στάση ή στάθμευση σε οδούς κατοικημένων περιοχών με ελάχιστη κυκλοφορία οχημάτων.\n4. Τα φώτα που καθορίζονται στην παρ. 1 πρέπει να είναι ικανά ώστε να γίνεται αντιληπτή η παρουσία του οχήματος στους χρήστες της οδού. Κατά τις ώρες της ημέρας, οι οδηγοί μοτοποδηλάτων και μοτοσικλετών πρέπει να κινούνται με αναμμένο ένα (1) τουλάχιστον εμπρόσθιο φως διασταύρωσης και ένα οπίσθιο ερυθρό φως. Το εμπρόσθιο και οπίσθιο φως απαγορεύεται να εκπέμπονται από τον ίδιο φανό ή την ίδια συσκευή, εκτός αν το επιτρέπουν τα χαρακτηριστικά του οχήματος, ιδιαίτερα το μήκος του.\n5. Τα μηχανοκίνητα οχήματα, το μήκος των οποίων δεν υπερβαίνει τα έξι (6) μέτρα και το πλάτος τα δύο (2) μέτρα και στα οποία δεν έχει συνδεθεί άλλο όχημα, επιτρέπεται, όταν βρίσκονται σε στάση ή στάθμευση, σε οδό κατοικημένης περιοχής, να έχουν αναμμένο ένα πλευρικό φως προς το μέρος όπου διεξάγεται η κυκλοφορία. Το φως αυτό πρέπει να είναι λευκό ή κίτρινο μπροστά και ερυθρό ή κίτρινο πίσω.\n6. Δεν επιτρέπεται σε όχημα να φέρει μπροστά ερυθρά φώτα, ερυθρές αντανακλαστικές συσκευές ή ερυθρά αντανακλαστικά υλικά και πίσω λευκά ή ειδικής επιλογής κίτρινα φώτα, λευκής ή ειδικής επιλογής κίτρινες αντανακλαστικές συσκευές ή λευκά ή ειδικής επιλογής κίτρινα αντανακλαστικά υλικά. Το προηγούμενο εδάφιο δεν εφαρμόζεται προκειμένου για χρήση λευκών ή ειδικής επιλογής κίτρινων φώτων οπισθοδρόμησης ούτε για την αντανάκλαση των ανοικτού χρώματος αριθμών ή γραμμάτων των οπίσθιων πινακίδων αναγνώρισης ή άλλων χαρακτηριστικών ή διακριτικών σημάτων, που προβλέπονται και περιγράφονται στο Κεφάλαιο Ε’. Επίσης, δεν εφαρμόζεται για την αντανάκλαση του ανοικτού χρώματος των ως άνω πινακίδων ή σημάτων, ούτε για τα ερυθρά φώτα ορισμένων οχημάτων άμεσης ανάγκης, τα οποία περιστρέφονται ή αναβοσβήνουν.\n7. Οι οδηγοί των οδικών και τροχιοδρομικών οχημάτων που κυκλοφορούν κατά τη διάρκεια της νύχτας, υποχρεούνται να μεριμνούν για τον φωτισμό της οπίσθιας πινακίδας αριθμού κυκλοφορίας, ώστε να είναι εύκολη η αναγνώριση των στοιχείων της.\n8. Στα ζωήλατα οχήματα και χειράμαξες η συσκευή που εκπέμπει τον φωτισμό μπορεί να φέρεται από τον οδηγό ή από τον συνοδό, ο οποίος βαδίζει στην αριστερή πλευρά αυτών.\n9. Ομάδες πεζών οι οποίες οδηγούνται από επιφορτισμένο για τον σκοπό αυτό πρόσωπο ή σχηματίζουν πομπή, όπως επίσης οι οδηγοί ζώων ή ζώων έλξης φορτίου ή ιππασίας, οι οποίοι κινούνται κατά μήκος του οδοστρώματος τη νύχτα, υποχρεούνται να έχουν προς την πλευρά στην οποία διεξάγεται η κυκλοφορία αντανακλαστικό στοιχείο ή ένα (1) τουλάχιστον αναμμένο φως λευκό ή ειδικής επιλογής κίτρινο μπροστά και ένα ερυθρό φως πίσω ή κίτρινο φως και στα δύο πιο πάνω σημεία. Τα φώτα αυτά είναι δυνατόν να εκπέμπονται και από την αυτή συσκευή. Η παρούσα δεν εφαρμόζεται σε κατοικημένη περιοχή που φωτίζεται αρκετά.\n10. Εξαιρούνται του παρόντος άρθρου τα αμαξίδια βρεφών και ατόμων με αναπηρία καθώς και άλλα μικρά οχήματα χωρίς μηχανή, τα οποία σύρονται ή προωθούνται από τους πεζούς, εκτός αν κυκλοφορούν τη νύχτα εκτός κατοικημένης περιοχής, οπότε υποχρεούνται να φέρουν αντανακλαστικά στοιχεία χρώματος λευκού ή κίτρινου.\n11. Δεν επιτρέπεται σε όχημα να έχει φώτα διαφορετικού χρώματος από αυτά που ορίζονται κατά περίπτωση στο παρόν.\n12. Οι παραβάσεις των παρ. 1 έως 11 κατατάσσονται στην κατηγορία Ε1-Α πλην της παράβασης της παρ. 7 που κατατάσσεται στην κατηγορία Ε1-Β.`},
  40: {title:`Κανόνες χρήσης των φώτων οχημάτων`,text:`1. Κατά τη διάρκεια της νύχτας ο οδηγός υποχρεούται να έχει τα φώτα του οχήματός του αναμμένα και να τα χρησιμοποιεί ως εξής:\nα) Τα φώτα πορείας απαγορεύεται να είναι αναμμένα, όταν το οδόστρωμα φωτίζεται, αρκετά μεν μέσα στις κατοικημένες περιοχές, αρκετά δε και συνεχώς εκτός κατοικημένων περιοχών, ώστε ο οδηγός να μπορεί να βλέπει ευκρινώς από απόσταση τουλάχιστον εκατό (100) μέτρων, καθώς και όταν το όχημα βρίσκεται σε στάση ή στάθμευση.\nβ) Τα φώτα πορείας πρέπει να μην είναι αναμμένα ή, όταν είναι αναμμένα, η λειτουργία τους να ρυθμίζεται με τρόπο ώστε να αποτρέπεται η θάμβωση, στις ακόλουθες περιπτώσεις:\nαα) Όταν ο οδηγός πρόκειται να συναντηθεί με όχημα που έρχεται αντίθετα, τα τυχόν αναμμένα φώτα πορείας πρέπει να σβήνουν ή η λειτουργία τους να ρυθμίζεται με τρόπο ώστε να αποτρέπεται η θάμβωση για αρκετό διάστημα και αντ’ αυτών να είναι αναμμένα τα φώτα διασταύρωσης, για να μπορεί ο οδηγός του άλλου οχήματος να προχωρήσει εύκολα και ακίνδυνα.\nββ) Όταν ένα όχημα ακολουθεί πίσω και πλησίον άλλου, τα φώτα πορείας μπορούν να χρησιμοποιούνται κατά την παρ. 4 για να δοθεί προειδοποίηση για την πρόθεση προσπέρασης σύμφωνα με το άρθρο 41, περί ηχητικών και φωτεινών προειδοποιήσεων.\nγγ) Σε κάθε άλλη περίπτωση, κατά την οποία είναι αναγκαίο να αποφευχθεί η θάμβωση των άλλων που χρησιμοποιούν την ίδια οδό, ή αυτών που χρησιμοποιούν άλλη οδό ή υδάτινη οδό ή σιδηροδρομική γραμμή, οι οποίες βαίνουν παράπλευρα αυτής.\nγ) Τα φώτα διασταύρωσης επιβάλλεται να ανάβουν μέσα και έξω από τις κατοικημένες περιοχές όπου απαγορεύεται η χρήση των φώτων πορείας.\nδ) Τα φώτα θέσης επιβάλλεται να χρησιμοποιούνται εκτός των περιπτώσεων του άρθρου 39, περί κανόνων χρήσης φώτων εντοπισμού θέσης, και με τα φώτα πορείας, τα φώτα διασταύρωσης και τα φώτα ομίχλης. Σε περίπτωση στάσης ή στάθμευσης, μπορούν να ανάβουν τα φώτα θέσης ή τα φώτα στάθμευσης.\n2. Αν υπάρχουν φώτα ομίχλης, σύμφωνα με το άρθρο 73, πρέπει να χρησιμοποιούνται μόνο σε περίπτωση ομίχλης, χιονόπτωσης ή καταρρακτώδους βροχής, μόνα τους ή μαζί με τα φώτα διασταύρωσης. Τα φώτα αυτά επιτρέπεται να χρησιμοποιούνται σε στενούς ελικοειδείς οδούς ακόμα και αν δεν συντρέχουν οι πιο πάνω προϋποθέσεις.\n3. Με εξαίρεση τις περιπτώσεις της παρ. 3 του άρθρου 41 απαγορεύονται, κατά τη συνάντηση με όχημα που έρχεται αντίθετα, το άναμμα και το σβήσιμο των φώτων ή η εναλλαγή της χρήσης τους κατά μικρά χρονικά διαστήματα.\n4. Η κατά την παρ. 3 του άρθρου 41 φωτεινή προειδοποίηση είναι το άναμμα των φώτων διασταύρωσης, με διακοπές σε μικρά χρονικά διαστήματα ή το άναμμα με διακοπές των φώτων πορείας ή η εναλλαγή των φώτων διασταύρωσης και των φώτων πορείας με διακοπές επίσης σε μικρά χρονικά διαστήματα.\n5. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α, πλην της περ. β) της παρ. 1 που κατατάσσεται στην κατηγορία Ε3-Β.`},
  41: {title:`Ηχητικές και φωτεινές προειδοποιήσεις`,text:`1. Η χρήση ηχητικών οργάνων προειδοποίησης επιτρέπεται μόνο:\nα) Σε περίπτωση έκτακτης ανάγκης, για την αποφυγή δυστυχήματος,\nβ) εκτός κατοικημένων περιοχών, κατά την προσπέραση, για να ειδοποιηθεί ο οδηγός του προπορευόμενου οχήματος, αν αυτό είναι απαραίτητο,\nγ) όταν μεταφέρονται με οχήματα άτομα, τα οποία κινδυνεύουν ή έχουν άμεση ανάγκη ιατρικής βοήθειας.\n2. Η χρήση των ηχητικών οργάνων πρέπει να μην παρατείνεται πέραν του απολύτως αναγκαίου χρόνου.\n3. Οι οδηγοί αυτοκινήτων οχημάτων μπορούν τη νύχτα, αντί ηχητικών προειδοποιήσεων, να δίνουν τις φωτεινές προειδοποιήσεις της παρ. 4 του άρθρου 40, περί κανόνων χρήσης των φώτων οχημάτων.\n4. Ο οδηγός σχολικού λεωφορείου ή οχήματος μεταφοράς ατόμων με αναπηρία οφείλει να έχει αναμμένο το σύστημα φωτεινού συναγερμού, όσο χρόνο διαρκεί η επιβίβαση ή αποβίβαση.\n5. Οι οδηγοί αυτοκινήτων οχημάτων, εκτός από την περίπτωση ακινησίας του οχήματος, επιτρέπεται να θέτουν σε λειτουργία τα φώτα έκτακτης ανάγκης (σύστημα φωτεινού συναγερμού), μόνο όταν κινδυνεύουν τρίτοι από το δικό τους όχημα.\n6. Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε1-Α και οι παραβάσεις των παρ. 2 έως 5 κατατάσσονται στην κατηγορία Ε1-Β.`},
  42: {title:`Κανόνες κυκλοφορίας πεζών`,text:`1. Οι πεζοί υποχρεούνται να χρησιμοποιούν τα πεζοδρόμια ή τα ειδικά γι’ αυτούς ερείσματα. Κατ’ εξαίρεση, μπορούν να χρησιμοποιούν το οδόστρωμα, αφού λάβουν τις αναγκαίες προφυλάξεις:\nα) Πεζοί που ωθούν, σύρουν ή μεταφέρουν ογκώδη αντικείμενα, οι οποίοι, αν βάδιζαν στο πεζοδρόμιο ή το έρεισμα, θα προκαλούσαν σοβαρή δυσχέρεια στην κίνηση των άλλων πεζών,\nβ) ομάδες πεζών, όταν οδηγούνται από ειδικά για τον σκοπό αυτό επιφορτισμένο πρόσωπο ή σχηματίζουν πομπή,\nγ) άτομα με αναπηρία, τα οποία κινούνται σε αναπηρικά καθίσματα.\n2. Αν είναι αδύνατη η χρησιμοποίηση των πεζοδρομίων ή των ερεισμάτων, που προορίζονται για τους πεζούς, ή δεν υπάρχουν πεζοδρόμια ή ερείσματα, οι πεζοί μπορούν να βαδίζουν στο οδόστρωμα, με τρόπο ώστε να μην παρεμποδίζουν την κυκλοφορία. Αν το οδόστρωμα διαθέτει λωρίδα για ποδήλατα ή μοτοποδήλατα, μπορούν να βαδίζουν σ’ αυτή, αν το επιτρέπει η πυκνότητα της κυκλοφορίας και δεν παρεμποδίζουν την κίνηση των μοτοποδηλάτων ή ποδηλάτων στη λωρίδα. Οι πεζοί δεν επιτρέπεται να υπερπηδούν εμπόδια όπως δοκούς, αλυσίδες, νησίδες, στηθαία και κιγκλιδώματα, που έχουν τοποθετηθεί από τις αρμόδιες αρχές για ειδικούς λόγους. Η ύπαρξη τέτοιων εμποδίων σημαίνει απαγόρευση εισόδου του πεζού στην αποκλεισμένη επιφάνεια της οδού.\n3. Οι πεζοί που χρησιμοποιούν το οδόστρωμα υποχρεούνται να βαδίζουν αντίθετα με την κατεύθυνση της κυκλοφορίας και όσο το δυνατόν πλησιέστερα στο άκρο του οδοστρώματος, εκτός αν κατ’ αυτόν τον τρόπο κινδυνεύουν ή δεν το επιτρέπουν ειδικές περιστάσεις. Κατ’ εξαίρεση, πρόσωπα που ωθούν ή σύρουν χειράμαξες, ωθούν ποδήλατο, μοτοποδήλατο ή μοτοσικλέτα, άτομα με αναπηρία, που κινούνται σε αναπηρικά καθίσματα και ομάδες πεζών, όταν σχηματίζουν πομπή ή οδηγούνται από ειδικά επιφορτισμένο πρόσωπο, υποχρεούνται να βαδίζουν πλησίον του δεξιού άκρου του οδοστρώματος. Οι πεζοί που βαδίζουν στο οδόστρωμα, αν δεν σχηματίζουν πομπή, υποχρεούνται να βαδίζουν σε απλό στοίχο, όταν το απαιτεί η ασφάλεια της κυκλοφορίας, εξαιτίας των συνθηκών ορατότητας, της πυκνότητας ή άλλων λόγων. Ομάδες πεζών που κινούνται στις οδούς υποχρεούνται να αφήνουν ελεύθερη στα δεξιά της οδού επαρκή επιφάνεια του οδοστρώματος, ώστε να μπορεί να διέρχεται ένα όχημα.\n4. Οι πεζοί προκειμένου να διασχίσουν το οδόστρωμα, υποχρεούνται:\nα) Αν υπάρχουν στο οδόστρωμα διαβάσεις πεζών, να τις χρησιμοποιούν,\nβ) αν στη διάβαση πεζών την οποία πρόκειται να χρησιμοποιήσουν, υπάρχουν φωτεινοί σηματοδότες πεζών, να συμμορφώνονται στα σήματά τους,\nγ) αν στη διάβαση δεν υπάρχουν φωτεινοί σηματοδότες πεζών, αλλά η κυκλοφορία ρυθμίζεται με φωτεινούς σηματοδότες οχημάτων ή από τροχονόμους και δίνεται σήμα για να προχωρήσουν τα οχήματα, να μην κατέρχονται στο οδόστρωμα,\nδ) σε διαβάσεις που η κυκλοφορία τόσο των πεζών όσο και των οχημάτων δεν ρυθμίζεται με φωτεινούς σηματοδότες, να μην κατεβαίνουν στο οδόστρωμα πριν λάβουν υπόψη τους την απόσταση και την ταχύτητα των οχημάτων τα οποία πλησιάζουν,\nε) αν δεν υπάρχουν στο οδόστρωμα διαβάσεις πεζών, να μην κατεβαίνουν σ’ αυτό, αν δεν βεβαιωθούν ότι δεν θα παρεμποδίσουν την κυκλοφορία των οχημάτων, στη συνέχεια δε να διασχίζουν το οδόστρωμα κάθετα προς τον άξονά του,\nστ) σε ισόπεδους οδικούς κόμβους, στους οποίους η κυκλοφορία ρυθμίζεται με φωτεινούς σηματοδότες οχημάτων ή τροχονόμους, να διασχίζουν το οδόστρωμα βαδίζοντας παράλληλα με τα κινούμενα οχήματα,\nζ) να διασχίζουν το οδόστρωμα κάθετα, χωρίς να βραδυπορούν ή να σταματούν σε αυτό αδικαιολόγητα.\n5. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α.`},
  43: {title:`Συμπεριφορά των οδηγών προς τους πεζούς`,text:`1. Οι οδηγοί πρέπει να αποφεύγουν να συμπεριφέρονται με τρόπο που μπορεί να θέσει σε κίνδυνο τους πεζούς. Τηρουμένων της παρ. 1 του άρθρου 16, περί κανόνων οδικής συμπεριφοράς, της περ. στ) της παρ. 3 του άρθρου 21, περί προσπέρασης, κυκλοφορίας σε στοίχους, επιτρεπτής αλλαγής λωρίδας και κίνησης μοτοποδηλάτων και μοτοσυκλετών σε πυκνή κυκλοφορία, και της παρ. 1 του άρθρου 23, περί ταχύτητας και απόστασης μεταξύ οχημάτων, όπου σε οδοστρώματα υπάρχουν διαβάσεις πεζών, οι οποίες έχουν σημανθεί με πινακίδες ή διαγραμμίσεις και η κυκλοφορία των οχημάτων ρυθμίζεται με φωτεινή σηματοδότηση ή τροχονόμους, οι οδηγοί οχημάτων υποχρεούνται:\nα) Να σταματούν πριν από τη διάβαση, όταν απαγορεύεται σε αυτούς με σήμα να προχωρήσουν ή όταν τυφλοί χρησιμοποιούν και επιδεικνύουν το λευκό μπαστούνι τους, για να δείξουν ότι πρόκειται να διασχίσουν την οδό ή όταν τα άτομα με αναπηρία πρόκειται να διασχίσουν την οδό. Όταν επιτραπεί να προχωρήσουν, να μη διακόπτουν ή παρεμποδίζουν τη διέλευση των πεζών, τυφλών ή των ατόμων με αναπηρία, οι οποίοι έχουν ήδη εισέλθει και προχωρούν στη διάβαση, σύμφωνα με το άρθρο 42, περί κανόνων κυκλοφορίας πεζών.\nβ) Αυτοί που προτίθενται να στρίψουν σε άλλη οδό, στην είσοδο της οποίας υπάρχει διάβαση πεζών, να κινούνται αργά και να παραχωρούν προτεραιότητα στους πεζούς που ήδη χρησιμοποιούν ή εισέρχονται στη διάβαση, κατά τα οριζόμενα στο άρθρο 42. Σε περίπτωση ανάγκης υποχρεούνται να διακόπτουν την πορεία του οχήματός τους.\n2. Αν σε σημασμένη διάβαση πεζών η κυκλοφορία των οχημάτων δεν ρυθμίζεται με φωτεινή σηματοδότηση ή με τροχονόμο, οι οδηγοί υποχρεούνται να πλησιάζουν στη διάβαση με μικρή ταχύτητα ώστε να μην εκθέτουν σε κίνδυνο τους πεζούς. Αν πεζοί χρησιμοποιούν ή ετοιμάζονται να χρησιμοποιήσουν τη διάβαση, οι οδηγοί ακινητοποιούν το όχημά τους μέχρι να εξέλθουν της διάβασης οι πεζοί. Σε σημασμένους με ειδική σήμανση πεζοδρόμους, τα οχήματα τα οποία επιτρέπεται να εισέλθουν σε αυτούς οφείλουν να κινούνται με ταχύτητα βαδίσματος και να παραχωρούν προτεραιότητα στους πεζούς. Στους οδηγούς οδικών οχημάτων επιβάλλεται να παραχωρούν προτεραιότητα στις διαβάσεις πεζών ή ποδηλατιστών, όταν σε αυτές κινούνται πεζοί ή ποδηλατιστές αντίστοιχα.\n3. Σε περιοχές κατοικίας και πολεοδομικά κέντρα που έχουν χαρακτηρισθεί και σημανθεί ως περιοχές ήπιας κυκλοφορίας εφαρμόζονται οι εξής ειδικοί κανόνες:\nα) Οι πεζοί μπορούν να χρησιμοποιούν το οδόστρωμα σε όλο το πλάτος του.\nβ) Οι οδηγοί πρέπει να προχωρούν με πολύ χαμηλή ταχύτητα, η οποία σε καμία περίπτωση δεν πρέπει να υπερβαίνει τα είκοσι (20) χιλιόμετρα την ώρα.\nγ) Οι οδηγοί μηχανοκίνητων οχημάτων δεν πρέπει να θέτουν τους πεζούς σε κίνδυνο ούτε να συμπεριφέρονται με παρεμποδιστικό τρόπο, αλλά να παραχωρούν προτεραιότητα σε πεζούς, ποδήλατα και Ε.Π.Η.Ο. Αν είναι αναγκαίο πρέπει να σταματούν.\nδ) Οι πεζοί δεν πρέπει να εμποδίζουν χωρίς λόγο την κυκλοφορία των οχημάτων.\nε) Απαγορεύεται η στάθμευση, εκτός από εκεί που επιτρέπεται από σήματα στάθμευσης.\nστ) Σε διασταυρώσεις, χρήστες της οδού που εξέρχονται από περιοχή κατοικίας πρέπει να παραχωρούν την προτεραιότητα στους άλλους χρήστες της οδού.\n4. Οι οδηγοί, οι οποίοι πρόκειται να στρίψουν σε άλλη οδό στην οποία δεν υπάρχουν σημασμένες με πινακίδες διαβάσεις πεζών ή διαγραμμίσεις στο οδόστρωμα, υποχρεούνται να παραχωρούν προτεραιότητα στους πεζούς, οι οποίοι στις περιπτώσεις της παρ. 2 του άρθρου 42, έχουν κατέλθει στο οδόστρωμα της οδού, στην οποία πρόκειται να εισέλθουν οι οδηγοί. Σε περίπτωση ανάγκης, υποχρεούνται να διακόπτουν την πορεία του οχήματός τους. Οι οδηγοί υποχρεούνται να δείχνουν ιδιαίτερη προσοχή στους πεζούς που διασχίζουν την οδό προκειμένου να επιβιβαστούν σε μέσα μαζικής μεταφοράς ή όταν απομακρύνονται από αυτά.\n5. Οι οδηγοί που προτίθενται να προσπεράσουν από δεξιά, όταν αυτό επιτρέπεται, όχημα δημόσιων συγκοινωνιών, που βρίσκεται σε στάση σε καθορισμένο σημείο, υποχρεούνται να σταματούν, για να επιτρέπουν την αποβίβαση ή επιβίβαση των επιβατών.\n6. Οι παραβάσεις του παρόντος για τον οδηγό κατατάσσονται στην κατηγορία E2-Α και στην κατηγορία Σ.`},
  44: {title:`β) ρυμουλκούν ή ωθούν διάφορα αντικείμενα. Εξαιρούνται της απαγόρευσης οι οδηγοί ποδηλάτων,`,text:`Ειδικοί κανόνες για τους οδηγούς ποδηλάτων, μοτοποδηλάτων, μοτοσικλετών, τρίτροχων οχημάτων και Ελαφρών Προσωπικών Ηλεκτρικών Οχημάτων\n1. Οι οδηγοί ποδηλάτων, μοτοποδηλάτων, μοτοσικλετών, τρίτροχων οχημάτων και Ελαφρών Προσωπικών Ηλεκτρικών Οχημάτων (Ε.Π.Η.Ο.) απαγορεύεται να:\nα) ρυμουλκούνται από άλλο όχημα,\nγ) μεταφέρουν αντικείμενα, τα οποία εμποδίζουν την οδήγηση του οχήματός τους ή εκθέτουν σε κίνδυνο τους λοιπούς χρήστες της οδού,\nδ) κινούνται ανά δύο (2) ή και πλείονες παράλληλα,\nε) σύρουν μαζί τους ζώα δεμένα με λουρί,\nστ) χρησιμοποιούν εν κινήσει ακουστικά που έχουν συνδεθεί με φορητά ραδιόφωνα και άλλες παρεμφερείς ηχητικές συσκευές. Από τη διάταξη αυτή εξαιρούνται ακουστικά και κεφαλόφωνα ανοικτής ακρόασης φορητών συσκευών ραδιοεπικοινωνίας, που χρησιμοποιούνται για την επικοινωνία σε μικρή απόσταση μεταξύ των οδηγών ποδηλάτων, μοτοποδηλάτων, μοτοσικλετών και Ε.Π.Η.Ο. ή μεταξύ των οδηγών των οχημάτων αυτών και σταθμών βάσης ή άλλων κινητών σταθμών ραδιοδικτύων, καθώς επίσης και μεταξύ των οδηγών εκπαιδευτικών μοτοποδηλάτων και μοτοσικλετών και των εκπαιδευτικών αυτοκινήτων κατά τις φάσεις της εκπαίδευσης ή της εξέτασης των υποψηφίων οδηγών,\nζ) να χρησιμοποιούν εν κινήσει κινητό τηλέφωνο, το οποίο δεν είναι τοποθετημένο σε ειδική θέση για ανοικτή ακρόαση, να χρησιμοποιούν εν κινήσει κινητό ή άλλες συσκευές τηλεπικοινωνίας, όπως φορητές ηλεκτρονικές συσκευές με τη μορφή ρολογιού χειρός ή άλλη ηλεκτρονική συσκευή για βιντεοσκόπηση ή ζωντανή αναμετάδοση από τη θέση του οδηγού εκτός εάν το κινητό ή η συσκευή έχουν τοποθετηθεί σε ειδική θέση.\n2. Οι οδηγοί ποδηλάτων, μοτοποδηλάτων, μοτοσικλετών, τρίτροχων οχημάτων και Ε.Π.Η.Ο. υποχρεούνται, όταν οδηγούν, να κρατούν το τιμόνι (εφόσον υπάρχει) και με τα δύο (2) τους χέρια, εκτός αν δίνουν σήμα σύμφωνα με τα άρθρα 25 και 28.\n3. Οι οδηγοί ποδηλάτων και Ε.Π.Η.Ο. υποχρεούνται να κατεβαίνουν από αυτά και να τα οδηγούν βαδίζοντας, όταν προκαλείται εμπόδιο ή κίνδυνος για την κυκλοφορία των πεζών. 4. Οι οδηγοί ποδηλάτων και Ε.Π.Η.Ο. απαγορεύεται να μεταφέρουν επιβάτες στα οχήματά τους. Κατ’ εξαίρεση, επιτρέπεται στους οδηγούς ποδηλάτων η μεταφορά ενός (1) μόνο επιβάτη σε ποδήλατο που έχει δύο (2) ζεύγη ποδοστροφάλων και διαθέτει, από κατασκευή, μόνιμο πρόσθετο κάθισμα, καθώς και η μεταφορά παιδιού η βρέφους με μη μόνιμο κάθισμα ειδικής προδιαγραφής. Οι οδηγοί μοτοποδηλάτων, μοτοσυκλετών και τρίτροχων οχημάτων επιτρέπεται να μεταφέρουν επιβάτη σε πρόσθετο κάθισμα, το οποίο είναι σταθερά προσαρμοσμένο, από κατασκευή, πίσω ή δίπλα από τη θέση του οδηγού. Ειδικότερα, οι οδηγοί μοτοσυκλετών επιτρέπεται να μεταφέρουν επιβάτη και μέσα στο ειδικό καλάθι, αν υπάρχει για τον σκοπό αυτό.\n5. Σε οδούς, οι οποίες έχουν λωρίδα κυκλοφορίας για την κίνηση ποδηλάτων ή μοτοποδηλάτων, απαγορεύεται στους οδηγούς αυτών και των Ε.Π.Η.Ο. της υποπερ. β) της περ. 17 του άρθρου 4, περί ορισμών, να χρησιμοποιούν το υπόλοιπο του οδοστρώματος.\n6. Η κίνηση των ποδηλάτων στις οδούς ποδηλάτων δύναται να πραγματοποιείται και στις δύο (2) κατευθύνσεις.\n7. Σε ποδηλατοδρόμους που καταλαμβάνουν όλο το πλάτος της οδού (οδοί ποδηλάτων), απαγορεύεται η είσοδος μηχανοκίνητων οχημάτων και μοτοποδηλάτων με εξαίρεση την είσοδο - έξοδο οχημάτων προς και από ιδιωτικούς χώρους στάθμευσης παρόδιων ιδιοκτησιών και τα οχήματα εφοδιασμού ή έκτακτης ανάγκης. Τα οχήματα του πρώτου εδαφίου εισέρχονται και εξέρχονται του ποδηλατοδρόμου από την πλησιέστερη επιτρεπόμενη οδό πρόσβασης και κινούνται με ταχύτητα που δεν υπερβαίνει τα είκοσι (20) χιλιόμετρα την ώρα, παραχωρώντας προτεραιότητα σε ποδήλατα, πεζούς και Ε.Π.Η.Ο.\n8. Στις οδούς ποδηλάτων επιτρέπεται η κυκλοφορία πεζών, οι οποίοι παραχωρούν προτεραιότητα στα κινούμενα ποδήλατα, εκτός εάν κινούνται σε ειδικό διάδρομο για τους πεζούς.\n9. Οι οδηγοί, οι οποίοι για την εκτέλεση της εργασίας τους οδηγούν ποδήλατο, μοτοποδήλατο, μοτοσικλέτα, τρίτροχο όχημα ή Ε.Π.Η.Ο. για τη μεταφορά ή διανομή προϊόντων και αντικειμένων, υποχρεούνται κατά την εκτέλεση της εργασίας τους κατά τη νύχτα να φορούν ανακλαστικό ρουχισμό, όπως γιλέκο ή πανωφόρι, που τους καθιστά ορατούς από όλες τις κατευθύνσεις. Επίσης, οι οδηγοί των Ε.Π.Η.Ο. κατά τη νύχτα υποχρεούνται να φορούν ανακλαστικό ρουχισμό ή άλλο ανακλαστικό εξοπλισμό που τους καθιστά ορατούς από όλες τις κατευθύνσεις.\n10. Οι οδηγοί των Ε.Π.Η.Ο. πρέπει να έχουν συμπληρώσει:\nα) για τα οχήματα της του στοιχείου\nαα) της υποπερ. α) της περ. 17 του άρθρου 4, την ηλικία των δώδεκα (12) ετών και\nβ) για τα οχήματα του στοιχείου\nαβ) της υποπερ. α) της περ. 2 του άρθρου 4, την ηλικία των δεκαπέντε (15) ετών.\n11. Οι οδηγοί των ποδηλάτων που δεν έχουν συμπληρώσει την ηλικία των δώδεκα (12) ετών και κινούνται σε οδικό δίκτυο που προορίζεται για την κυκλοφορία μηχανοκίνητων οχημάτων, πρέπει να συνοδεύονται από άτομα που έχουν συμπληρώσει την ηλικία των δεκαέξι (16) ετών.\n12. Οι οδηγοί των ποδηλάτων συστήνεται να φορούν εγκεκριμένου τύπου προστατευτικό κράνος, κανονικά δεμένο. Οι οδηγοί των Ε.Π.Η.Ο. των στοιχείων αα’ έως αδ’ της υποπερ. α) της περ. 17 του άρθρου 4, υποχρεούνται να φορούν εγκεκριμένου τύπου προστατευτικό κράνος, κανονικά δεμένο, εξαιρουμένων των οδηγών ηλεκτροκίνητων αμαξιδίων ατόμων με αναπηρία, ενισχυμένων και απλών, scooters και handbikes ατόμων με αναπηρία.\n13. Οι οδηγοί των Ε.Π.Η.Ο. και των ποδηλάτων, εφόσον το όχημά τους δεν διαθέτει δείκτες κατεύθυνσης, πριν από την αλλαγή κατεύθυνσης, δίνουν με το χέρι τους την κατάλληλη προειδοποίηση σύμφωνα με την παρ. 2 του άρθρου 25, περί κανόνων για τους ελιγμούς των οχημάτων.\n14. Σε όσες περιπτώσεις σύμφωνα με το παρόν επιτρέπεται η κυκλοφορία σε χώρους που κυκλοφορούν πεζοί, οι οδηγοί Ε.Π.Η.Ο. κινούνται με ταχύτητα ανάλογη με τους πεζούς, χωρίς να τους παρενοχλούν και τους παραχωρούν προτεραιότητα.\n15. Οι παραβάσεις των παρ. 1 έως 14 κατατάσσονται στην κατηγορία Ε1-Α πλην:\nα) των παραβάσεων των περ. στ) και\nζ) της παρ. 1 που κατατάσσονται στην κατηγορία Ε3-Β, με εξαίρεση τις παραβάσεις της περ. ε) της παρ. 1 που κατατάσσονται στην κατηγορία Ε3-Β, εκτός εάν τιμωρούνται βαρύτερα με άλλη διάταξη και\nβ) της παράβασης της παρ. 7 που κατατάσσεται στην κατηγορία Ε2-Α και στην κατηγορία Σ. 16. Η παράβαση των περ. στ) και\nζ) της παρ. 1, που αφορά στη χρήση ακουστικών και στην εν κινήσει χρήση κινητού τηλεφώνου, επιπλέον των διοικητικών κυρώσεων της περ. α) της παρ. 15 του παρόντος, εάν ο οδηγός γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε βαριά σωματική βλάβη ή σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων επισύρει τις ποινές των περ. γγ) και\nδδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί επικίνδυνης οδήγησης. Για την αξιόποινη πράξη του προηγούμενου εδαφίου η έρευνα μπορεί να συμπεριλάβει και τη διενέργεια άρσης του απορρήτου του περιεχομένου των επικοινωνιών και των δεδομένων θέσης και κίνησης αυτών, με την τήρηση των εγγυήσεων και τις διαδικασίες των άρθρων 6, περί άρσης του απορρήτου των επικοινωνιών για τη διακρίβωση εγκλημάτων, 7, περί διαχείρισης υλικού σε άρσεις για τη διερεύνηση εγκλημάτων, και 8, περί διαδικασίας άρσης του απορρήτου του ν. 5002/2022 (Α’ 228).`},
  45: {title:`Ειδικοί κανόνες για συνοδείες, πομπές και κίνηση αμαξιδίων ατόμων με αναπηρία ή βρεφών`,text:`1. Απαγορεύεται στους χρήστες της οδού να διακόπτουν στρατιωτικές φάλαγγες, στοίχους μαθητών, οι οποίοι συνοδεύονται από επιφορτισμένο ειδικά για τον σκοπό αυτό πρόσωπο και άλλες πομπές.\n2. Για την κίνηση αμαξιδίων ατόμων με αναπηρία, τα οποία προωθούνται από τους ίδιους ή τους συνοδούς τους και αμαξιδίων βρεφών, επιτρέπεται να χρησιμοποιούνται τα πεζοδρόμια, οι πεζόδρομοι ή κατάλληλα ερείσματα.\n3. Οι παραβάσεις των παρ. 1 και 2 κατατάσσονται στην κατηγορία Ε1-Α.`},
  46: {title:`Οδήγηση υπό την επίδραση οινοπνεύματος, φαρμάκων ή τοξικών ουσιών`,text:`1. Απαγορεύεται η οδήγηση κάθε οδικού οχήματος από οδηγό, ο οποίος κατά την οδήγηση του οχήματος βρίσκεται υπό την επίδραση οινοπνεύματος, τοξικών ουσιών ή φαρμάκων που σύμφωνα με τις οδηγίες χρήσης τους ενδέχεται να επηρεάζουν την ικανότητα του οδηγού. Ο ελεγχόμενος οδηγός θεωρείται ότι βρίσκεται υπό την επίδραση οινοπνεύματος όταν το ποσοστό αυτού στον οργανισμό είναι από μηδέν κόμμα πενήντα (0,50) γραμμάρια ανά λίτρο αίματος (0,50 gr./l) και άνω, μετρούμενο με τη μέθοδο της αιμοληψίας ή από μηδέν κόμμα είκοσι πέντε (0,25) χιλιοστά του γραμμαρίου ανά λίτρο εκπνεόμενου αέρα και άνω, όταν η μέτρηση γίνεται στον εκπνεόμενο αέρα με αντίστοιχη συσκευή αλκοολομέτρου.\n2. Τα αρμόδια αστυνομικά και λιμενικά όργανα μπορούν κατά περίπτωση να ασκούν έλεγχο για τη διαπίστωση ύπαρξης, στον οργανισμό των οδηγών, οινοπνεύματος, τοξικών ουσιών ή φαρμάκων κατά την παρ. 1, οι δε οδηγοί υποχρεούνται να δέχονται τον έλεγχο αυτό.\n3. Σε περίπτωση θανατηφόρου τροχαίου ατυχήματος, ο έλεγχος για τη διαπίστωση ύπαρξης στον οργανισμό οινοπνεύματος, τοξικών ουσιών ή φαρμάκων, κατά την παρ. 1, γίνεται υποχρεωτικά με αιμοληψία από τα θανόντα πρόσωπα, καθώς και από τους ζώντες, εκτός και αν για τους τελευταίους ειδικοί παθολογικοί λόγοι δεν το επιτρέπουν, οπότε στην περίπτωση αυτή η μέτρηση γίνεται, για μεν το οινόπνευμα στον εκπνεόμενο αέρα με τη συσκευή αλκοολομέτρου, για δε τις τοξικές ουσίες και φάρμακα με τη λήψη ούρων ή άλλο πρόσφορο μέσο. Για την ύπαρξη ή μη των προβαλλόμενων αυτών λόγων χρειάζεται ιατρική πιστοποίηση από δημόσιο νοσοκομείο.\n4. Σε περίπτωση τροχαίου ατυχήματος με σωματικές βλάβες ο έλεγχος για τη διαπίστωση ύπαρξης στον ορ γανισμό οινοπνεύματος γίνεται είτε στον εκπνεόμενο αέρα με αντίστοιχη συσκευή αλκοολομέτρων είτε με αιμοληψία. Ο έλεγχος για τη διαπίστωση ύπαρξης στον οργανισμό τοξικών ουσιών ή φαρμάκων γίνεται με τη χρήση κάθε επιστημονικά ενδεδειγμένου τρόπου.\n5. Στους τροχονομικούς ελέγχους στον δρόμο ή σε τροχαία ατυχήματα χωρίς σωματικές βλάβες, ο έλεγχος για τη διαπίστωση ύπαρξης στον οργανισμό οινοπνεύματος γίνεται στον εκπνεόμενο αέρα με αντίστοιχη συσκευή αλκοολομέτρου, για τη διαπίστωση δε της ύπαρξης τοξικών ουσιών ή φαρμάκων της παρ. 1 γίνεται με τη χρησιμοποίηση κάθε κατάλληλου επιστημονικού μέσου. Η διαπίστωση του ποσοστού συγκέντρωσης οινοπνεύματος σε ατύχημα πεζού, στις περιπτώσεις της παρούσας και των παρ. 3 και 4, διαπιστώνεται με τον ίδιο τρόπο.\n6. Με την επιφύλαξη του τελευταίου εδαφίου της παρ. 3, όποιος αρνείται να υποβληθεί σε έλεγχο για τη διαπίστωση της ύπαρξης στον οργανισμό του οινοπνεύματος, είτε δια αιμοληψίας είτε με τη χρήση συσκευής αλκοολομέτρου, τεκμαίρεται ότι η συγκέντρωση οινοπνεύματος στο αίμα του είναι άνω του ενός κόμμα δέκα γραμμαρίου ανά λίτρο (1,10 gr/l) σύμφωνα με τη μέθοδο της αιμοληψίας. Όποιος αρνείται να υποβληθεί σε έλεγχο για τη διαπίστωση της ύπαρξης τοξικών ουσιών ή φαρμάκων στον οργανισμό, τεκμαίρεται ότι βρίσκεται υπό την επίδραση τοξικών ουσιών ή φαρμάκων που σύμφωνα με τις οδηγίες τους ενδέχεται να επηρεάζουν την ικανότητα οδήγησης, σύμφωνα με την παρ. 8. 7. Οι παραβάσεις της οδήγησης οχήματος υπό την επίδραση οινοπνεύματος κατατάσσονται ως εξής:\nα. Στην κατηγορία Ε3-Β, εάν η συγκέντρωση οινοπνεύματος στο αίμα κυμαίνεται από μηδέν κόμμα πενήντα γραμμάρια ανά λίτρο (0,50 g/l) έως μηδέν κόμμα ογδόντα γραμμάρια ανά λίτρο (0,80 g/l), μετρούμενη με τη μέθοδο της αιμοληψίας ή από μηδέν κόμμα είκοσι πέντε (0,25) έως μηδέν κόμμα σαράντα (0,40) χιλιοστά του γραμμαρίου ανά λίτρο εκπνεόμενου αέρα, όταν η μέτρηση γίνεται στον εκπνεόμενο αέρα με αντίστοιχη συσκευή αλκοολομέτρου. Στην περίπτωση αυτή η άδεια οδήγησης επιστρέφεται μετά την παρέλευση του χρονικού διαστήματος αφαίρεσης, μόνο με την προσκόμιση του αποδεικτικού καταβολής του διοικητικού προστίμου.\nβ. Στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ και η επιτόπου αφαίρεση της άδειας οδήγησης για ενενήντα (90) ημέρες, σύμφωνα με τις προϋποθέσεις και τη διαδικασία του άρθρου 106, περί επιβολής διοικητικών μέτρων, εάν η συγκέντρωση οινοπνεύματος στο αίμα είναι άνω του μηδέν κόμμα ογδόντα γραμμάρια ανά λίτρο (0,80 g/l) και μέχρι ενός κόμμα δέκα γραμμαρίων ανά λίτρο (1,10g/l), μετρούμενη με τη μέθοδο της αιμοληψίας ή άνω των μηδέν κόμμα σαράντα (0,40) έως μηδέν κόμμα εξήντα (0,60) χιλιοστών του γραμμαρίου ανά λίτρο εκπνεόμενου αέρα, όταν η μέτρηση γίνεται στον εκπνεόμενο αέρα με αντίστοιχη συσκευή αλκοολομέτρου. Στην περίπτωση αυτή η άδεια οδήγησης επιστρέφεται μετά την παρέλευση του χρονικού διαστήματος αφαίρεσης, μόνο με την προσκόμιση του αποδεικτικού καταβολής του διοικητικού προστίμου.\nγ. Στην κατηγορία Ε4 και τιμωρούνται με φυλάκιση τουλάχιστον δύο (2) μηνών, διοικητικό πρόστιμο χιλίων διακοσίων (1.200,00) ευρώ και αφαίρεση, επί τόπου, της άδειας οδήγησης και των στοιχείων κυκλοφορίας για εκατόν ογδόντα (180) ημέρες, σύμφωνα με τις προϋποθέσεις και τη διαδικασία του άρθρου 106, εάν η συγκέντρωση οινοπνεύματος στο αίμα είναι άνω του ενός κόμμα δέκα γραμμαρίων ανά λίτρο (1,10g/l), μετρούμενη με τη μέθοδο της αιμοληψίας ή άνω των μηδέν κόμμα εξήντα (0,60) χιλιοστών του γραμμαρίου ανά λίτρο εκπνεόμενου αέρα, όταν η μέτρηση γίνεται στον εκπνεόμενο αέρα με αντίστοιχη συσκευή αλκοολομέτρου. Στην περίπτωση αυτή η άδεια οδήγησης επιστρέφεται μετά την παρέλευση έξι (6) μηνών, μόνο με την προσκόμιση αποδεικτικού καταβολής του διοικητικού προστίμου.\nδ. Στις περ. α’, β’ και γ’ το όχημα ακινητοποιείται υποχρεωτικά και φυλάσσεται, σύμφωνα με το άρθρο 50, περί ακινητοποίησης οχήματος, και τις, κατ’ εξουσιοδότηση αυτού, εκδιδόμενες αποφάσεις. Ο έλεγχος και η βεβαίωση των παραβάσεων της παρούσας παραγράφου γίνονται από συνεργείο δύο (2) τουλάχιστον αστυνομικών ή λιμενικών, εκ των οποίων ο ένας είναι ανακριτικός υπάλληλος.\n8. Εάν ο οδηγός καταληφθεί να οδηγεί υπό την επίδραση τοξικών ουσιών ή φαρμάκων, που σύμφωνα με τις οδηγίες τους ενδέχεται να επηρεάζουν την ικανότητα οδήγησης, τιμωρείται με φυλάκιση τουλάχιστον δύο (2) μηνών και με χρηματική ποινή τουλάχιστον διακοσίων (200) ευρώ και με αφαίρεση της άδειας ικανότητας οδηγού για χρονικό διάστημα τριών (3) μέχρι έξι (6) μηνών, η οποία επιβάλλεται υποχρεωτικά από το δικαστήριο.\n9. Στην περ. γ) της παρ. 7, η παράβαση τιμωρείται, παράλληλα και ανεξάρτητα από τις ποινικές και λοιπές κυρώσεις που προβλέπουν οι διατάξεις αυτές, και με την ποινή της αφαίρεσης των στοιχείων κυκλοφορίας του οχήματος για χρονικό διάστημα από δέκα (10) ημέρες έως έξι (6) μήνες, η οποία επιβάλλεται από το δικαστήριο.\n10. Οι παρ. 1 έως και 6, εφαρμόζονται κατ’ αναλογία στους κυβερνήτες ή χειριστές των μικρών σκαφών, των θαλάσσιων μέσων αναψυχής και των μηχανοκίνητων λέμβων και ταχύπλοων σκαφών, η κίνηση και κυκλοφορία των οποίων καθορίζεται με τους Γενικούς Κανονισμούς Λιμένα, που εκδίδονται κατ’ εξουσιοδότηση του άρθρου 156 του Κώδικα Δημοσίου Ναυτικού Δικαίου (Κ.Δ.Ν.Δ., ν.δ. 187/1973, Α’ 261), στους κυβερνήτες των πλοίων αναψυχής του ν. 2743/1999 (Α’ 211) και του ν. 4926/2022 (Α’ 82), εφόσον αυτά δεν έχουν συγκροτημένο πλήρωμα. Στις περιπτώσεις αυτές, εφαρμόζονται κατ’ αναλογία οι ποινικές διατάξεις της παρ. 7 και επιβάλλονται οι διοικητικές κυρώσεις του άρθρου 157 του Κ.Δ.Ν.Δ., με τη διαδικασία που ορίζεται σ’ αυτό.`},
  47: {title:`Συμπεριφορά σε περίπτωση ατυχήματος`,text:`1. Αν συμβεί οδικό τροχαίο ατύχημα, από το οποίο επήλθε βλάβη σε πρόσωπα ή πράγματα, κάθε οδηγός ή άλλος που χρησιμοποιεί την οδό, ο οποίος ενεπλάκη με οποιονδήποτε τρόπο στο ατύχημα υποχρεούται:\nα) Να σταθμεύσει αμέσως στον τόπο του ατυχήματος χωρίς να προκαλέσει πρόσθετους κινδύνους στην κυκλοφορία,\nβ) να λάβει μέτρα κυκλοφοριακής ασφάλειας στον τόπο του ατυχήματος και, αν δεν μπορεί, να ειδοποιήσει για το ατύχημα την πλησιέστερη αστυνομική αρχή,\nγ) να δώσει τα στοιχεία της ταυτότητάς του καθώς και κάθε χρήσιμη πληροφορία σχετική με το όχημά του, αν οι εμπλακέντες στο ατύχημα τα ζητήσουν. Σε περίπτωση υλικών ζημιών, αν ο ζημιωθείς δεν είναι παρών, τα εμπλακέντα στο ατύχημα πρόσωπα υποχρεούνται, μέσα σε είκοσι τέσσερις (24) ώρες, να του δώσουν τις πιο πάνω πληροφορίες κατά τον καταλληλότερο τρόπο ή μέσω του πλησιέστερου αστυνομικού τμήματος, το οποίο φροντίζει για την ενημέρωση του ζημιωθέντα.\n2. Αν από το οδικό τροχαίο ατύχημα επήλθε θάνατος ή σωματική βλάβη, κάθε οδηγός ή άλλος που χρησιμοποιεί την οδό, ο οποίος ενεπλάκη με οποιονδήποτε τρόπο στο ατύχημα, υποχρεούται επιπλέον:\nα) Να δώσει την αναγκαία βοήθεια και συμπαράσταση στους παθόντες,\nβ) να ειδοποιήσει την πλησιέστερη αστυνομική αρχή και να παραμείνει στον τόπο του ατυχήματος μέχρι την άφιξή της, εκτός αν είναι αναγκαία η απομάκρυνσή του για την ειδοποίηση της αστυνομίας ή για την περίθαλψη των τραυματιών ή του ίδιου. Και στην περίπτωση αυτή ο οδηγός υποχρεούται να αναγγείλει το ατύχημα στην αστυνομική αρχή το ταχύτερο δυνατόν,\nγ) να αποτρέψει οποιαδήποτε μεταβολή στον τόπο του ατυχήματος, η οποία θα μπορούσε να δυσκολέψει το έργο της αστυνομίας με εξαίρεση τις ενέργειές του εκείνες οι οποίες αποβλέπουν στην αποκατάσταση της τυχόν διακοπείσας κυκλοφορίας.\n3. Οι παραβάσεις της παρ. 1 και της περ. γ) της παρ. 2 κατατάσσονται στην κατηγορία Ε3-Β και τιμωρούνται με ποινή φυλάκισης έως έξι (6) μήνες ή χρηματική ποινή.\n4. Η παράβαση για αυτόν που παραβαίνει τις περ. α) και\nβ) της παρ. 2, κατατάσσεται στην κατηγορία Ε4 και τιμωρείται με διοικητικό πρόστιμο χιλίων διακοσίων (1.200) ευρώ, αφαίρεση της άδειας οδήγησης για εκατόν ογδόντα (180) ημέρες και ποινή φυλάκισης τουλάχιστον τριών (3) μηνών. Πέραν των διοικητικών κυρώσεων του προηγούμενου εδαφίου, αν από τη συμπεριφορά του υπαιτίου ο παθών περιήλθε σε κίνδυνο ζωής επιβάλλεται κάθειρξη έως έξι (6) ετών, αν επήλθε βαριά σωματική βλάβη κάθειρξη έως δέκα (10) ετών, και αν επήλθε θάνατος κάθειρξη έως είκοσι (20) ετών, εφόσον η πράξη δεν τιμωρείται βαρύτερα από άλλη διάταξη. Σε κάθε περίπτωση επιβάλλεται ως παρεπόμενη ποινή η αφαίρεση της αδείας οδήγησης για χρονικό διάστημα τριών (3) έως έξι (6) μηνών, η οποία επιβάλλεται υποχρεωτικά από το δικαστήριο.\n5. Σε περίπτωση σωματικής βλάβης, η οποία προκαλείται από όχημα, αν ο οδηγός αυτού συμμορφώθηκε με τις υποχρεώσεις της παρ. 2 του παρόντος, δεν εφαρμόζεται το άρθρο 419 του Κώδικα Ποινικής Δικονομίας (Κ.Π.Δ., ν. 4620/2019, Α’ 96). Στην περίπτωση αυτή οι αστυνομικοί που επιλαμβάνονται ως προανακριτικοί υπάλληλοι, μετά τη συλλογή των απαραίτητων στοιχείων και την ενέργεια των σχετικών προανακριτικών πράξεων, παύουν την προσωρινή κράτηση του οδηγού. Αν πρόκειται για οδηγούς οι οποίοι είναι ύποπτοι φυγής ή ιδιαίτερα επικίνδυνοι, προκύπτουν δε σε βάρος τους στοιχεία ενοχής, οι πιο πάνω υπάλληλοι, προσάγουν αυτούς στον αρμόδιο εισαγγελέα, ο οποίος μπορεί να εφαρμόσει το άρθρο 419 του Κώδικα Ποινικής Δικονομίας.\n6. Δεν έχει επίσης εφαρμογή στα αυτοκίνητα οχήματα, στα τρίτροχα οχήματα και τις μοτοσικλέτες, κατά την έννοια του παρόντος Κώδικα, το άρθρο 11 του ν. ΓϡΝ/1911 (Α’ 332) για την κράτηση από την αστυνομική αρχή, αν ο οδηγός συμμορφώθηκε με την παρ. 2 του άρθρου αυτού και κατέθεσε αποδεικτικό ασφάλισης (βεβαίωση αναγνωρισμένης στην Ελλάδα ασφαλιστικής εταιρείας) του οχήματος ή αποδείξει ότι είναι κάτοχος δελτίου διεθνούς ασφάλισης, τα οποία αποτελούν δήλωση αναδοχής χρέους για τα ισχύοντα στην Ελλάδα ελάχιστα ποσά ασφαλιστικής κάλυψης, τα οποία προβλέπονται από τα νομίμως εγκεκριμένα τιμολόγια ασφαλίστρων ή προκειμένου για αυτοκίνητα και τρίτροχα οχήματα δημόσιας χρήσης, καταθέσει δήλωση αναδοχής χρέους αλληλοασφαλιστικού συνεταιρισμού ή αλληλοασφαλιστικού ταμείου συνεταιρισμού, που λειτουργεί νόμιμα, στον οποίο το όχημα είναι ασφαλισμένο.\n7. Τα οχήματα που εγκαταλείπονται για οποιονδήποτε λόγο στον τόπο του ατυχήματος, καθώς και τα απομακρυνθέντα και μη παραληφθέντα οχήματα λόγω παράνομης στάθμευσης, σύμφωνα με την παρ. 9 του άρθρου 38, περί στάσης και στάθμευσης, εφόσον εμποδίζουν την οδική κυκλοφορία, απομακρύνονται με μέριμνα των ιδιοκτητών ή κατόχων τους και σε περίπτωση αδυναμίας ή αδιαφορίας αυτών, απομακρύνονται από την αρμόδια αστυνομική αρχή, η οποία, μετά την παρέλευση δύο (2) μηνών, τα παραδίδει στη Διεύθυνση Διαχείρισης Δημόσιου Υλικού για εκποίηση.`},
  48: {title:`Οχήματα άμεσης ανάγκης - Έργα στις οδούς`,text:`1. Αυτοί που χρησιμοποιούν την οδό, όταν ειδοποιούνται με τις συσκευές ηχητικής ή φωτεινής προειδοποίησης, ότι πλησιάζει όχημα άμεσης ανάγκης ή όχημα της τεχνικής επιτήρησης των φορέων λειτουργίας και συντήρησης των οδών ή όχημα με το οποίο μεταφέρονται πρόσωπα που έχουν ανάγκη άμεσης βοήθειας, υποχρεούνται να αφήνουν χώρο, κινούμενοι προς τα δεξιά της οδού, για να διέλθει το όχημα αυτό και σε περίπτωση ανάγκης, να σταματούν. Ως οχήματα άμεσης ανάγκης, για την εφαρμογή του παρόντος, θεωρούνται τα οχήματα που φέρουν ειδικά πρόσθετα μπλε ή ερυθρά φώτα. Με ένα (1) ή περισσότερα μπλε φώτα που αναβοσβήνουν, μπορούν να εφοδιάζονται μόνο τα νοσοκομειακά οχήματα, τα οχήματα πρώτων βοηθειών και κλινικών, τα οχήματα της Ελληνικής Αστυνομίας, της Υπηρεσίας Εξωτερικής Φρούρησης Καταστημάτων Κράτησης, της Δημοτικής Αστυνομίας, καθώς και τα οχήματα των στρατιωτικών και λιμενικών αρχών. Με ένα (1) ή περισσότερα ερυθρά φώτα που αναβοσβήνουν, μπορούν να εφοδιάζονται μόνο τα οχήματα της Πυροσβεστικής Υπηρεσίας, του Δασαρχείου και της αρμόδιας υπηρεσίας για την αποκατάσταση βλαβών ηλεκτρικού δικτύου, καθώς και τα οχήματα των υπηρεσιών ύδρευσης και αποχέτευσης.\n2. Αν η ειδοποίηση για την κίνηση των οχημάτων άμεσης ανάγκης ή οχημάτων, με τα οποία μεταφέρονται πρόσωπα, που έχουν ανάγκη άμεσης βοήθειας, δίνεται με τις ειδικές συσκευές προειδοποίησης και δεν προκαλείται κίνδυνος για τους λοιπούς χρήστες της οδού, οι οδηγοί των οχημάτων αυτών δεν υποχρεούνται να τηρήσουν τα άρθρα 16 έως 45 και 47. Δεν μπορούν όμως να διέρχονται αντίθετα στους μονόδρομους ή να μην συμμορφώνονται στα σήματα που δίνουν οι τροχονόμοι.\n3. Αν οι οδηγοί κινούνται στο οδόστρωμα με περισσότερες από δύο (2) λωρίδες κυκλοφορίας κατά κατεύθυνση υποχρεούνται, αν χρησιμοποιούν τη λωρίδα που ορίζεται με κατάλληλη διαγράμμιση ως λωρίδα άμεσης ανάγκης, να την εγκαταλείψουν αμέσως, κινούμενοι στις παραπλεύρως λωρίδες. Αυτοί που κινούνται στις παρακείμενες λωρίδες υποχρεούνται να παρέχουν προτεραιότητα στους εισερχομένους. Απαγορεύεται στους οδηγούς οχημάτων να ακολουθούν από κοντά τα οχήματα άμεσης ανάγκης, όταν κινούνται για εκτέλεση επείγουσας αποστολής.\n4. Οι οδηγοί των οχημάτων άμεσης ανάγκης επιτρέπεται να χρησιμοποιούν τις ειδικές συσκευές προειδοποίησης μόνο σε περιπτώσεις κατά τις οποίες αυτό δικαιολογείται λόγω του κατεπείγοντος της αποστολής τους.\n5. Οι εργαζόμενοι στην κατασκευή, επισκευή ή συντήρηση τμημάτων οδών και όσοι χειρίζονται τεχνικό εξοπλισμό, ο οποίος χρησιμοποιείται για την εκτέλεση των έργων αυτών, αν τηρούν το άρθρο 13, περί σήμανσης των εργασιών που εκτελούνται στις οδούς, και παίρνουν τα αναγκαία μέτρα προφύλαξης, δεν υποχρεούνται να συμμορφωθούν στις διατάξεις που αναφέρονται στους κανόνες κυκλοφορίας του παρόντος.\n6. Οι οδηγοί οχημάτων, για να προσπεράσουν ή να παρακάμψουν τον τεχνικό εξοπλισμό, που αναφέρεται στην παρ. 5, όταν αυτός χρησιμοποιείται για εκτέλεση έργων στην οδό, δεν υποχρεούνται να τηρήσουν τα άρθρα 21, περί προσπέρασης και κυκλοφορίας σε στοίχους, και 22, περί διέλευσης οχημάτων που κινούνται αντίθετα, αν λαμβάνουν τα αναγκαία μέτρα προφύλαξης.\n7. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε2-Α και στην κατηγορία Σ. Στις κατηγορίες αυτές κατατάσσεται και η παράβαση για αυτόν που για να επιτύχει την κατά προτεραιότητα κίνησή του προσποιείται ότι το όχημα που οδηγεί είναι όχημα άμεσης ανάγκης ή μεταφέρονται με αυτό πρόσωπα που έχουν ανάγκη άμεσης βοήθειας.`},
  49: {title:`Ειδικές υποχρεώσεις οδηγών και πεζών προς τα αστυνομικά όργανα και τους σχολικούς τροχονόμους`,text:`1. Οι οδηγοί οχημάτων και οι πεζοί υποχρεούνται να συμμορφώνονται στο σήμα στάσης το οποίο δίνουν τα αστυνομικά όργανα που φορούν στολή.\n2. Οι οδηγοί οχημάτων, όταν καλούνται από τα όργανα αυτά, υποχρεούνται να δείχνουν κάθε στοιχείο σχετικό με την κυκλοφορία του οχήματός τους.\n3. Για την οδική ασφάλεια των πεζών μαθητών κατά τις μετακινήσεις τους προς και από τα σχολεία, μπορούν να χρησιμοποιούνται σχολικοί τροχονόμοι. Ο σχολικός τροχονόμος ρυθμίζει την κυκλοφορία σε ορισμένο σημείο της οδού (και όχι σε διασταύρωση), διακόπτοντας τη ροή οχημάτων σε διατομή της οδού, όπου υπάρχει σημασμένη διάβαση πεζών. Προς τον σκοπό αυτό είναι εφοδιασμένος με φορητή πινακίδα STOP, την οποία εκτείνει κατάλληλα πάνω από την επιφάνεια του οδοστρώματος. Ο τροχονόμος αυτός φέρει αντανακλαστικό χιτώνιο που πληροί τις προδιαγραφές του αντίστοιχου χιτωνίου της Ελληνικής Αστυνομίας, αντί όμως των διακριτικών της Αστυνομίας φέρει την ένδειξη «σχολικός τροχονόμος». Οι σχολικοί τροχονόμοι ορίζονται από τον διευθυντή του σχολείου, μπορεί να προέρχονται είτε από το προσωπικό του σχολείου είτε να προτείνονται από τον οικείο σύλλογο γονέων και κηδεμόνων και εξοπλίζονται με μέριμνα του οικείου σχολείου.\n4. Η παράβαση των παρ. 1 και 3, και η παράβαση εκείνου που αρνείται να επιδείξει κάθε στοιχείο σχετικό με την κυκλοφορία του οχήματός του κατατάσσεται στην κατηγορία Ε3-Β και τιμωρείται με ποινή φυλάκισης μέχρι ενός (1) έτους. Στην ίδια κατηγορία κατατάσσεται και η παράβαση για τον οδηγό οχήματος, ο οποίος συμπεριφέρεται με πράξεις ή λόγια, υβριστικά ή απειλητικά προς τα όργανα που εκτελούν υπηρεσία τροχαίας κίνησης ή παρεμβάλλει δυσχέρειες στο έργο αυτών κατά τη βεβαίωση παραβάσεων του παρόντος Κώδικα ή δίνει ψευδή στοιχεία ταυτότητας ή στοιχεία σχετικά με την κυκλοφορία του οχήματός του.`},
  50: {title:`Ακινητοποίηση οχήματος`,text:`1. Αν διαπιστωθεί ότι η κίνηση οδικού οχήματος είναι επικίνδυνη για τους επιβαίνοντες ή τους λοιπούς χρήστες της οδού, συνεπεία βλαβών, φθορών, εκπομπής ρύπων, προσθήκης εξαρτημάτων και άλλων παράνομων μετατροπών ή εξαιτίας σωματικής ή πνευματικής κατάστασης του οδηγού, τα αστυνομικά όργανα μπορούν να ακινητοποιήσουν το όχημα μέχρι να εξασφαλισθούν οι προϋποθέσεις ασφαλούς κίνησης και λειτουργίας του οχήματος. Ακινητοποίηση κάθε οδικού οχήματος μπορούν να επιβάλλουν τα αστυνομικά όργανα, κατά τις ώρες κοινής ησυχίας και μέσα στις κατοικημένες περιοχές αν από τη λειτουργία του προκαλούνται υπερβολικοί θόρυβοι. Η ακινητοποίηση οχήματος σύμφωνα με την παρ. 8 του άρθρου δεύτερου του ν. 4388/2016 (Α’ 93) γίνεται σύμφωνα με την παρ. 12 του άρθρου αυτού.\n2. Η παράβαση για τον οδηγό που αρνείται να συμμορφωθεί με τις υποδείξεις του αστυνομικού οργάνου για την ακινητοποίηση του οχήματός του ή για εκείνον που κινεί όχημα του οποίου διατάχθηκε η ακινητοποίηση, σύμφωνα με την παρ. 1 κατατάσσεται στην κατηγορία Ε3-Β και τιμωρείται με φυλάκιση μέχρι ενός (1) έτους.`},
  51: {title:`Εργασίες και εναπόθεση υλικών στις οδούς`,text:`1. Αυτοί που εκτελούν έργα και εναποθέτουν υλικά και εργαλεία στις οδούς υποχρεούνται:\nα) Να εκτελούν το έργο και να εναποθέτουν τα υλικά και τα εργαλεία με τρόπο, που να μην παρεμποδίζει την κυκλοφορία. Αν η παρεμπόδιση δεν μπορεί να αποφευχθεί, επιβάλλεται να επισημαίνονται, σύμφωνα με το άρθρο 13, περί σήμανσης των εργασιών που εκτελούνται στις οδούς, οι χώροι εκτέλεσης του έργου και τα υλικά,\nβ) να περιφράσσουν τα ορύγματα ή άλλους επικίνδυνους για την κυκλοφορία χώρους των έργων και να επισημαίνουν αυτούς σύμφωνα με το άρθρο 13.\n2. Απαγορεύεται η απόρριψη χωμάτων ή άχρηστων υλικών στην οδό (όπως οδοστρώματα, ερείσματα, πεζοδρόμια, πεζόδρομους και τάφρους). Για την απομάκρυνση των πιο πάνω υλικών εφαρμόζεται η παρ. 3.\n3.α) Οποιαδήποτε τομή ή εκσκαφή οδοστρώματος, ερείσματος, πεζόδρομου ή πεζοδρομίου εθνικής, επαρχιακής, δημοτικής ή κοινοτικής οδού, η οποία είναι απαραίτητη για την κατασκευή έργου, που εκτελείται από επιχείρηση κοινής ωφέλειας, οργανισμό, νομικό ή φυσικό πρόσωπο, επιτρέπεται να γίνει μόνο ύστερα από άδεια της αρμόδιας για τη συντήρηση της οδού υπηρεσίας, η οποία θεωρείται πριν από την έναρξη των εργασιών από την αρμόδια αστυνομική αρχή. Στην άδεια αυτή ορίζεται ο χρόνος μέσα στον οποίο ενεργείται η πλήρης αποκατάσταση της φθοράς του οδοστρώματος από την επιχείρηση ή το πρόσωπο για λογαριασμό του οποίου εκτελείται το έργο. Οι αρμόδιες υπηρεσίες συντήρησης των οδών υποχρεούνται, μετά την παρέλευση της προθεσμίας η οποία ορίζεται στην άδεια, να αποκαθιστούν τις γενόμενες φθορές και να καταλογίζουν τη σχετική δαπάνη σε βάρος του οργανισμού, της επιχείρησης ή του προσώπου που εκτελεί ή για λογαριασμό του οποίου εκτελείται το έργο, κατά τις διατάξεις για την είσπραξη των δημοσίων εσόδων.\nβ) Στο πεδίο εφαρμογής του παρόντος άρθρου, καθώς και της παρ. 7 του άρθρου 7 του ν. 3481/2006 (Α’ 162) δεν εμπίπτουν οι εταιρείες που εκτελούν εργασίες εγκατάστασης, τακτικής και έκτακτης συντήρησης των υπογείων δικτύων διανομής και παροχετεύσεων φυσικού αερίου, συμπεριλαμβανομένων των εργασιών εγκατάστασης, τακτικής και έκτακτης συντήρησης των μετρητικών και των ρυθμιστικών διατάξεων φυσικού αερίου, καθώς και οι εταιρείες παραγωγής και διανομής θερμικής ενέργειας για την εγκατάσταση υπογείων δικτύων διανομής θερμότητας, για τις οποίες εφαρμόζεται η παρ. 3 του άρθρου 7 του ν. 2364/1995 (Α’ 252). 4. Αυτοί που εργάζονται στις οδούς υποχρεούνται να φορούν ειδικούς επενδύτες ασφάλειας, αντανακλαστικούς και φθορίζοντες, ώστε να διακρίνονται ευχερώς από τα κινούμενα σε αυτές οχήματα. Υπόχρεοι για τον εφοδιασμό των εργαζομένων στις οδούς με τους επενδύτες αυτούς είναι οι εργοδότες. 5. Οι παραβάσεις της παρ. 2 κατατάσσονται στην κατηγορία Ε3-Α. Οι παραβάσεις της παρ. 4 κατατάσσονται στην κατηγορία Ε1-Α. Αυτός που παραβαίνει τις λοιπές διατάξεις του παρόντος, καθώς και αυτός που επιφέρει με οποιονδήποτε τρόπο, και από αμέλεια ακόμη, φθορές στην οδό, στα στηθαία ασφαλείας, στις διαχωριστικές νησίδες ή εν γένει στον εξοπλισμό της οδού ή σε συστατικά και παραρτήματα αυτής, εφόσον από άλλη διάταξη δεν προβλέπεται αυστηρότερη ποινή, τιμωρείται με φυλάκιση μέχρι δύο (2) ετών.`},
  52: {title:`Κατάληψη τμήματος οδού και πεζόδρομου`,text:`1. Η προσωρινή ή διαρκής κατάληψη τμήματος του οδοστρώματος με εγκαταστάσεις ή εμπόδια απαγορεύεται, ιδιαίτερα αν με αυτά παρεμποδίζεται η κυκλοφορία, η επιτρεπόμενη στάση ή στάθμευση οχημάτων ή περιορίζεται η ορατότητα αυτών που χρησιμοποιούν τις οδούς.\n2. Κατά παρέκκλιση της παρ. 1, μπορεί να επιτραπεί σε έκτακτες περιπτώσεις ή ζώνες μικρής κυκλοφορίας εντός κατοικημένων περιοχών ή σε χερσαίες ζώνες λιμένων, αν υπάρχει αρκετός χώρος γι’ αυτό, η κατάληψη τμήματος οδού με προσωρινές εγκαταστάσεις ή εμπόδια ύστερα από άδεια του αρμόδιου οργανισμού τοπικής αυτοδιοίκησης ή του αρμόδιου φορέα διοίκησης και εκμετάλλευσης λιμένα μετά από σύμφωνη γνώμη των αρμόδιων αστυνομικών ή λιμενικών αρχών, αντίστοιχα. Επιτρέπεται να τοποθετείται στην οδό ειδικός εξοπλισμός καταγραφής κυκλοφοριακών μετρήσεων (λάστιχα) στο πλαίσιο εκπόνησης κυκλοφοριακής μελέτης, μετά από ενημέρωση των αρμοδίων αστυνομικών ή λιμενικών αρχών.\n3. Αυτοί που ανεγείρουν οικοδομές μέσα σε κατοικημένες περιοχές ή εκτελούν άλλα έργα και καταλαμβάνουν ολόκληρο το πεζοδρόμιο μπροστά από την οικοδομή ή το έργο, υποχρεούνται να κατασκευάσουν πρόσθετο πεζοδρόμιο ή να πάρουν άλλα κατάλληλα μέτρα για την ασφαλή διέλευση των πεζών.\n4. Όταν επιτρέπεται η κατάληψη τμήματος οδού πρέπει αυτό να επισημαίνεται υποχρεωτικά από αυτόν που το κατέλαβε σύμφωνα με το άρθρο 13, περί σήμανσης των εργασιών που εκτελούνται στις οδούς.\n5. Απαγορεύεται η κατάληψη επιφάνειας πεζόδρομου για οποιαδήποτε άλλη χρήση εκτός από αυτή για την οποία έχει κατασκευαστεί, εφόσον παρεμποδίζεται η κυκλοφορία των πεζών, καθώς και η είσοδος - έξοδος οχημάτων άμεσης ανάγκης ή η εξυπηρέτηση των παροδίων.\n6. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε3-Α.`},
  53: {title:`Αγώνες στις οδούς`,text:`1. Αγώνες ζωηλάτων οχημάτων, ζώων, ποδηλάτων, αυτοκινήτων, τετράτροχων οχημάτων, μοτοσυκλετών και μοτοποδηλάτων σε οδούς και χώρους του πεδίου εφαρμογής του παρόντος, επιτρέπεται να γίνονται μόνο έπειτα από σχετική άδεια.\n2. Η κατά την παρ. 1 άδεια χορηγείται:\nα) Για τους αγώνες ζωηλάτων οχημάτων και ζώων, από τις κατά τόπους αστυνομικές διευθύνσεις ή διευθύνσεις τροχαίας,\nβ) για τους αγώνες ποδηλάτων, ομοίως από τις αρχές της περ. α, έπειτα από προηγούμενη αίτηση των ενδι αφερομένων και γνώμη της Ελληνικής Ομοσπονδίας Ποδηλασίας ή της Τριαθλητικής Ομοσπονδίας Ελλάδας, κατά περίπτωση,\nγ) για όλους τους αγώνες μοτοσυκλετών, μοτοποδηλάτων και τετράτροχων οχημάτων, που διενεργούνται από συλλόγους, μέλη της ειδικώς αναγνωρισμένης αθλητικής ομοσπονδίας, ή από την ίδια, από το αρμόδιο όργανο του Υπουργείου Προστασίας του Πολίτη, ή τις εξουσιοδοτημένες από αυτό αρχές, έπειτα από σύμφωνη γνώμη της Αθλητικής Ομοσπονδίας Μοτοσυκλετών ή του νομικού προσώπου που εκπροσωπεί νόμιμα το άθλημα στη Διεθνή Ομοσπονδία Μοτοσυκλέτας, σύμφωνα με τους κανόνες ασφαλείας που ορίζει η Διεθνής Ομοσπονδία Μοτοσυκλέτας. Ειδικά για τους αγώνες που διοργανώνονται από την Αθλητική Ομοσπονδία Μοτοσυκλετών, απαιτείται γνωστοποίηση προς τις αρμόδιες αρχές,\nδ) για όλους τους εθνικούς αγώνες αυτοκινήτων, οχημάτων καρτ, παλαιών αυτοκινήτων ιστορικού ενδιαφέροντος, από το αρμόδιο όργανο του Υπουργείου Προστασίας του Πολίτη ή τις εξουσιοδοτημένες από αυτό αρχές, έπειτα από σύμφωνη γνώμη της, αναγνωρισμένης από τη Γενική Γραμματεία Αθλητισμού, Αθλητικής Ομοσπονδίας Αυτοκινήτων. Για όλους τους διεθνείς αγώνες αυτοκινήτων, οχημάτων καρτ, παλαιών αυτοκινήτων ιστορικού ενδιαφέροντος, που αναγράφονται στο πρόγραμμα αγώνων της Διεθνούς Ομοσπονδίας Αυτοκινήτου, από το αρμόδιο όργανο του Υπουργείου Προστασίας του Πολίτη ή τις εξουσιοδοτημένες από αυτό αρχές, έπειτα από σύμφωνη γνώμη του νομικού προσώπου που εκπροσωπεί νόμιμα το άθλημα στη Διεθνή Ομοσπονδία Αυτοκινήτου ή της αναγνωρισμένης από τη Γενική Γραμματεία Αθλητισμού αθλητικής ομοσπονδίας για τον μηχανοκίνητο αθλητισμό, σύμφωνα με τους κανόνες ασφαλείας που ορίζει η Διεθνής Ομοσπονδία Αυτοκινήτων,\nε) για τις λοιπές διοργανώσεις των φορέων παλαιών μηχανοκίνητων οχημάτων ιστορικού ενδιαφέροντος (αυτοκινήτων ή μοτοσυκλετών) από το αρμόδιο όργανο του Υπουργείου Προστασίας του Πολίτη ή τις εξουσιοδοτημένες από αυτό αρχές, έπειτα από σύμφωνη γνώμη του νομικού προσώπου που εκπροσωπεί νόμιμα τα παραπάνω στη Διεθνή Ομοσπονδία Παλαιών Οχημάτων ή τη Διεθνή Ομοσπονδία Αυτοκινήτων ή τη Διεθνή Ομοσπονδία Μοτοσυκλέτας. Η αίτηση των ενδιαφερομένων για τις περ. γ’, δ’ και ε’ υποβάλλεται στις ανωτέρω αθλητικές ομοσπονδίες (αυτοκινήτου ή μοτοσυκλετών) ή στα νομικά πρόσωπα που εκπροσωπούν νόμιμα το άθλημα στην Ελλάδα είτε στη Διεθνή Ομοσπονδία Αυτοκινήτου είτε στη Διεθνή Ομοσπονδία Μοτοσυκλέτας είτε στη Διεθνή Ομοσπονδία Παλαιών Οχημάτων και διαβιβάζεται στο αρμόδιο όργανο του Υπουργείου Προστασίας του Πολίτη ή στις εξουσιοδοτημένες από αυτό αρχές, μαζί με την απαιτούμενη σύμφωνη γνώμη τους, προκειμένου να εκδοθεί η σχετική άδεια.\n3. Για την περίπτωση των οχημάτων καρτ απαιτείται άδεια οδήγησης αυτοκινήτου ή άδεια οδηγού αγώνων κάρτινγκ οποιασδήποτε κατηγορίας, που έχει εκδοθεί από την αναγνωρισμένη από τη Γενική Γραμματεία Αθλητισμού αθλητική ομοσπονδία για τον μηχανοκίνητο αθλητισμό ή σε ό,τι αφορά τους διεθνείς αγώνες καρτ από το νομικό πρόσωπο που εκπροσωπεί νόμιμα το άθλημα στη Διεθνή Ομοσπονδία Αυτοκινήτου. Τα μέτρα ασφαλείας που προβλέπονται από τον Διεθνή Κανονισμό Καρτ, τόσο για τους οδηγούς όσο και για τους θεατές, εφαρμόζονται αναλόγως.\n4. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε4 και τιμωρούνται αυτοτελώς με διοικητικό πρόστιμο πενήντα χιλιάδες (50.000) ευρώ και με ποινή απαγόρευσης διοργάνωσης αγώνων για χρονικό διάστημα μέχρι πέντε (5) ετών από την ημερομηνία της παράβασης.\nΆρθρο 54 Τεκμήριο υπαιτιότητας Τεκμαίρεται υπαιτιότητα του τρίτου που ζημιώθηκε από την κυκλοφορία οδικού οχήματος, το οποίο οδηγείται κατά τις περί κυκλοφορίας διατάξεις, αν αυτός παραβίασε κατά την επέλευση της ζημίας, τις διατάξεις αυτές. Σε κάθε άλλη περίπτωση έχει εφαρμογή ο ν. ΓϡΝ/1911 (Α’ 332) περί της εκ των αυτοκινήτων ποινικής και αστικής ευθύνης.`},
  55: {title:`Μέτρα ρύθμισης οδικής κυκλοφορίας`,text:`1. Επιτρέπεται η λήψη μέτρων που αφορούν στη ρύθμιση της κυκλοφορίας, όπως στον καθορισμό των μονόδρομων, ποδηλατοδρόμων και κατευθύνσεων της κυκλοφορίας, στην προτεραιότητα οδών, στην αλλαγή της διατομής του οδοστρώματος ή της οδού, στην εγκατάσταση και λειτουργία φωτεινής σηματοδότησης, στον προσδιορισμό και τη λειτουργία των χώρων στάθμευσης οχημάτων σε κοινόχρηστους χώρους και γενικά στον καθορισμό χώρων στάθμευσης και στην επιβολή περιορισμών ή απαγορεύσεων κυκλοφορίας ή στάθμευσης. Αν από τη λήψη των μέτρων για την εφαρμογή της παρούσας επηρεάζονται οι υπηρεσίες οδικής μαζικής μεταφοράς, απαιτείται και η σύμφωνη γνώμη του Οργανισμού Αστικών Συγκοινωνιών Αθηνών (Ο.Α.Σ.Α.) ή του Οργανισμού Συγκοινωνιακού Έργου Θεσσαλονίκης (Ο.Σ.Ε.Θ.), για την περιοχή αρμοδιότητάς τους ή των αρμοδίων Υπηρεσιών των Περιφερειών για λεωφορειακές διαδρομές ΚΤΕΛ ή των δήμων για αστικές λεωφορειακές διαδρομές, για τις άλλες περιοχές της χώρας. Επιτρέπεται να προσδιορίζεται δίκτυο οδών που επηρεάζονται από την κατασκευή εκτελούμενων ή προγραμματιζόμενων συγκοινωνιακών έργων του Υπουργείου Υποδομών και Μεταφορών, που υλοποιούνται ως συμβάσεις παραχώρησης ή Σύμπραξη Δημοσίου και Ιδιωτικού Τομέα (ΣΔΙΤ) ή χρηματοδοτούνται από το Ταμείο Ανάκαμψης και Ανθεκτικότητας. Κατ’ εξαίρεση κάθε αντίθετης διάταξης, τα μέτρα της παρούσας για τα ανωτέρω συγκοινωνιακά έργα που κατασκευάζονται από το Υπουργείο Υποδομών και Μεταφορών και το προσδιοριζόμενο δίκτυο οδών που επηρεάζεται από αυτά, ανεξαρτήτως του χαρακτηρισμού τους, καθορίζονται με μελέτες που εκπονούνται ή εγκρίνονται από τις αρμόδιες υπηρεσίες κατασκευής και κυκλοφορίας του Υπουργείου Υποδομών και Μεταφορών ή από τον ανεξάρτητο μηχανικό στο πλαίσιο των συμβάσεων παραχώρησης του Υπουργείου Υποδομών και Μεταφορών. Κατ’ εξαίρεση, επιτρέπεται να ανατίθεται, σε εποπτευόμενους φορείς του Υπουργείου Υποδομών και Μεταφορών η αρμοδιότητα για τη λειτουργία, συντήρηση, σήμανση, διαγράμμιση, καθαριότητα και τον ηλεκτροφωτισμό του δικτύου των οδών που επηρεάζονται κατά την κατασκευή των έργων του Υπουργείου αυτού, που υλοποιούνται με συμβάσεις παραχώρησης ή ΣΔΙΤ ή χρηματοδοτούνται από το Ταμείο Ανάκαμψης και Ανθεκτικότητας. Αν από τη λήψη των μέτρων της παρούσας, επηρεάζονται οι υπηρεσίες οδικής μαζικής μεταφοράς, για τα παραπάνω συγκοινωνιακά έργα του Υπουργείου Υποδομών και Μεταφορών και το επηρεαζόμενο δίκτυο οδών, η απαιτούμενη γνώμη του Ο.Α.Σ.Α. ή του Ο.Σ.Ε.Θ., για την περιοχή αρμοδιότητάς τους ή των αρμοδίων υπηρεσιών των Περιφερειών για λεωφορειακές διαδρομές ΚΤΕΛ ή των δήμων για αστικές λεωφορειακές διαδρομές, για τις άλλες περιοχές της χώρας, παρέχεται υποχρεωτικά εντός προθεσμίας πέντε (5) ημέρων από την υποβολή του σχετικού φακέλου, άλλως τεκμαίρεται ως σύμφωνη.\n2. Τα μέτρα που αναφέρονται στην παρ. 1 μπορεί να λαμβάνονται προσωρινά εντός και εκτός κατοικημένων περιοχών, όταν αυτό επιβάλλεται από ιδιαίτερους λόγους ασφαλείας ή σε έκτακτες περιπτώσεις για την αντιμετώπιση τελείως προσωρινών καταστάσεων.\n3. Με τις αποφάσεις των αρμόδιων οργάνων των παρ. 1 και 2 και με την ίδια διαδικασία, μπορεί να καθορίζονται σε κατοικημένες περιοχές, πεζόδρομοι ή περιοχές μόνο για την κυκλοφορία πεζών ή ατόμων με αναπηρία ή περιοχές ήπιας κυκλοφορίας. Όπου οι αποφάσεις αυτές επηρεάζουν τις υπηρεσίες οδικής μαζικής μεταφοράς, εφαρμόζεται και το τελευταίο εδάφιο της παρ. 1. Στις μελέτες, βάσει των οποίων εκδίδονται οι σχετικές αποφάσεις, περιλαμβάνεται και ο κανονισμός λειτουργίας του πεζόδρομου. Όπου από τον κανονισμό λειτουργίας του πεζόδρομου προβλέπεται η συνύπαρξη πεζών, ποδηλάτων και Ε.Π.Η.Ο, οι πεζοί έχουν προτεραιότητα έναντι των ποδηλάτων και των Ε.Π.Η.Ο. Σε συνθήκες ιδιαίτερα αυξημένης κίνησης, εφαρμόζεται η παρ. 3 του άρθρου 44. 4.α) Με βάση κυκλοφοριακές μελέτες, που έχουν εκπονηθεί ή εγκριθεί από κοινού από τις αρμόδιες υπηρεσίες της οικείας περιφέρειας ή του οικείου δήμου και του φορέα ή της υπηρεσίας που είναι κατά περίπτωση αρμόδιος για τις υπηρεσίες δημόσιας οδικής μαζικής μεταφοράς μπορούν να καθορίζονται οδοί ή λωρίδες κυκλοφορίας, στις οποίες κυκλοφορούν μόνο μέσα δημόσιας οδικής μαζικής μεταφοράς προσώπων, συμπεριλαμβανομένων των τροχιοδρομικών οχημάτων, εξαιρουμένων των περιοχών αρμοδιότητας των Ο.Α.Σ.Α. και Ο.Σ.Ε.Θ.\nβ) Για τις περιοχές αρμοδιότητας των Ο.Α.Σ.Α. και Ο.Σ.Ε.Θ., ο καθορισμός οδών ή λωρίδων κυκλοφορίας, στις οποίες κυκλοφορούν μόνο μέσα δημόσιας οδικής μαζικής μεταφοράς προσώπων, συμπεριλαμβανομένων των τροχιοδρομικών οχημάτων, γίνεται με βάση μελέτες που εκπονούνται από τους Ο.Α.Σ.Α. και Ο.Σ.Ε.Θ. για τα μέτρα προτεραιότητας των δημόσιων μέσων μαζικής μεταφοράς έναντι των λοιπών οχημάτων, καθώς επίσης για την εγκατάσταση ειδικών σημάνσεων και για κάθε μέτρο που θα εξασφαλίζει την απρόσκοπτη κυκλοφορία των οχημάτων των αστικών συγκοινωνιών και την ασφαλή και άνετη διακίνηση των επιβατών. Η υλοποίηση της σήμανσης, η τοποθέτηση και συντήρηση των διαχωριστικών μέσων ανήκουν στην αρμοδιότητα των εποπτευόμενων από αυτό Οργανισμών που βαρύνονται και με τις σχετικές δαπάνες.\nγ) Στις λωρίδες των περ. α) και\nβ) επιτρέπεται η στάση επιβατικών δημόσιας χρήσης (Ε.Δ.Χ.), εφόσον δεν παρακωλύεται η κυκλοφορία των μέσων δημόσιας οδικής μαζικής μεταφοράς προσώπων για χρονικό διάστημα που δεν υπερβαίνει τα τριάντα (30) δευτερόλεπτα, και μόνο με σκοπό την επιβίβαση και αποβίβαση. Ειδικότερα, η αποβίβαση επιτρέπεται όπισθεν των λεωφορείων και με την προϋπόθεση να μην παρακωλύεται η κυκλοφορία των λεωφορείων και των οχημάτων, που χρησιμοποιούν τις λωρίδες των περ. α) και β). Κατά παρέκκλιση του χρονικού περιορισμού του δεύτερου εδαφίου επιτρέπεται στα Ε.Δ.Χ. σύντομη στάση σε εσοχές οδών μόνο για επιβίβαση και αποβίβαση. Από την εφαρμογή των δύο πρώτων εδαφίων εξαιρείται η στάση Ε.Δ.Χ., για την επιβίβαση ή αποβίβαση ατόμων με εμφανείς βαριές κινητικές αναπηρίες ή τυφλότητα, σύμφωνα με την παρ. 1 του άρθρου 16 του ν. 4530/2018 (Α’ 59).\nδ) Στις λωρίδες των περ. α) και\nβ) επιτρέπεται η κυκλοφορία έμφορτων Ε.Δ.Χ. ΕΙΔΜΙΣΘ αυτοκινήτων της υποπερ. β της περ. 19 του άρθρου 4, που προορίζονται για τη μεταφορά ατόμων με αναπηρία και έμφορτων επιβατικών δημόσιας χρήσης (Ε.Δ.Χ.) μηδενικών ρύπων.\nε) Για την περιοχή αρμοδιότητας του Ο.Σ.Ε.Θ., οι σχετικές δαπάνες που αφορούν στην κατασκευή και συντήρηση των λωρίδων κυκλοφορίας δημόσιας οδικής μαζικής μεταφοράς προσώπων, βαρύνουν τον αντίστοιχο δήμο, ενώ το κόστος εγκατάστασης και συντήρησης των ηλεκτρονικών μέσων ελέγχου βαρύνουν τον Φορέα Λειτουργίας. 5. Σε οδούς, στις οποίες για ειδικούς λόγους επιβάλλεται η αναγκαστική μείωση της ταχύτητας των οχημάτων ή ο περιορισμός της κυκλοφορίας τους, μπορεί να προβλέπεται η δημιουργία ειδικών διαμορφώσεων του οδοστρώματος ή η τοποθέτηση κινητών εμποδίων. Εκείνος που παραβαίνει την απόφαση της παρ. 16 του άρθρου 112, τιμωρείται με φυλάκιση έως δώδεκα (12) μήνες και χρηματική ποινή από χίλια (1.000) έως δέκα χιλιάδες (10.000) ευρώ. 6. Για την ανακούφιση, την ομαλή και ασφαλή διεξαγωγή της οδικής κυκλοφορίας, σε συνδυασμό με την ανάγκη εξασφάλισης καλύτερων συνθηκών διεξαγωγής της οδικής κυκλοφορίας με τα μέσα δημόσιας οδικής μαζικής μεταφοράς προσώπων ή για λόγους γενικότερου δημόσιου συμφέροντος, μπορούν να λαμβάνονται μέτρα περιορισμού ή απαγόρευσης της κυκλοφορίας ή της στάθμευσης μηχανοκίνητων οχημάτων οποιασδήποτε κατηγορίας ή ορισμένων κατηγοριών, καθώς και μοτοποδηλάτων σε ορισμένη περιοχή ή περιοχές της χώρας ή πόλεων ή κωμοπόλεων ή σε ορισμένη οδό ή οδούς ή και σε τμήμα οδού ή οδών. Στις περιοχές όπου, σύμφωνα με το προηγούμενο εδάφιο, έχει απαγορευθεί η στάθμευση οχημάτων και μοτοποδηλάτων, εκτός από τις κυρώσεις της παρούσας, μπορεί να γίνεται και η μεταφορά του οχήματος ή του μοτοποδηλάτου, σύμφωνα με την παρ. 9 του άρθρου 38, περί στάσης και στάθμευσης. Τα μέτρα που προβλέπονται στην παρούσα λαμβάνονται για την περιοχή της τέως Διοικήσεως Πρωτευούσης. Η παράβαση των αποφάσεων της παρ. 16 του άρθρου 112 τιμωρείται, για τη μεν στάθμευση σύμφωνα με το άρθρο 8, για τα δε μέτρα περιορισμού ή απαγόρευσης της κυκλοφορίας κατατάσσεται στην κατηγορία Ε2-Α. Επιπλέον, στους παραβάτες που δεν συμμορφώνονται με τις υποδείξεις των αστυνομικών οργάνων για στάθμευση σε συγκεκριμένο σημείο ή άμεση έξοδο από την απαγορευμένη περιοχή, επιβάλλεται φυλάκιση μέχρι ενός (1) έτους. Η παράβαση των αποφάσεων που εκδίδονται κατ’ εξουσιοδότηση της περ. ζ) της παρ. 16 του άρθρου 111 κατατάσσεται στην κατηγορία Ε2-Α.\n7. Τα μέτρα που λαμβάνονται βάσει του παρόντος ισχύουν από την τοποθέτηση των οικείων πινακίδων σήμανσης, των σηματοδοτών ή των διαγραμμίσεων στο οδόστρωμα, εκτός εάν κατά τον χρόνο ισχύος των μέτρων αυτών η κυκλοφορία ρυθμίζεται από τροχονόμους ή τα μέτρα έχουν ληφθεί κατ’ εφαρμογή της παρ. 6 και δεν προβλέπονται αντίστοιχες πινακίδες σήμανσης, οπότε τα μέτρα αυτά ισχύουν από τη δημοσίευση των σχετικών αποφάσεων, κατά την παρ. 1 του άρθρου 112, ή από τη χρονολογία που ορίζουν οι ίδιες αυτές αποφάσεις.\n8. Επιτρέπεται να επιβάλλονται περιορισμοί στην κίνηση φορτηγών αυτοκινήτων στο οδικό δίκτυο της χώρας και να καθορίζεται η προσωρινή κίνησή τους σε χώρους στάθμευσης. Επιτρέπεται ο καθορισμός συγκεκριμένου ωραρίου τροφοδοσίας των επιχειρήσεων, υπεραγορών και λοιπών καταστημάτων. Οι παραβάτες της παρ. 16 του άρθρου 116 τιμωρούνται με τις ειδικές διατάξεις του ν. 3446/2006 (Α’ 49) που αφορούν τα φορτηγά οχήματα. Η παράβαση της παρ. 16 του άρθρου 112, κατατάσσεται στην κατηγορία Ε2-Α.\n9. Απαγορεύεται η διέλευση από το οδικό δίκτυο που χρησιμοποιείται παραπλεύρως και εναλλακτικά των αυτοκινητοδρόμων και οδών ταχείας κυκλοφορίας, στα μηχανοκίνητα οχήματα μικτού βάρους άνω των τρεισήμισι (3,5) τόνων. Εξαιρούνται της απαγόρευσης του προηγούμενου εδαφίου, οι διελεύσεις οχημάτων άμεσης ή έκτακτης ανάγκης, οδικής βοήθειας ή λόγω ανωτέρας βίας. Οι παραβάτες της παρούσας και της παρ. 16 του άρθρου 112, τιμωρούνται με ανάλογη εφαρμογή των παρ. 12 και 13 του άρθρου δεύτερου του ν. 4388/2016 (Α’ 93), περί Συστήματος Ηλεκτρονικής Διαχείρισης Οδικών Υποδομών Υπηρεσίας Οδικών Τελών και Ηλεκτρονικής Διαχείρισης Οδικών Υποδομών.\n10. Επιτρέπεται η ίδρυση Κέντρου Οδικών Πληροφοριών, το οποίο δεν επιχορηγείται από τον κρατικό προϋπολογισμό, έργο του οποίου είναι η παροχή πληροφοριών σχετικά με την πυκνότητα της κυκλοφορίας, τα εμπόδια και την κατάσταση των οδών, τις τοπικές καιρικές συνθήκες, καθώς και κάθε άλλη πληροφορία χρήσιμη για την κυκλοφορία των οχημάτων, σύμφωνα με την περ. ιε) της παρ. 16 του άρθρου 112.`},
  57: {title:`Διαστάσεις και βάρη`,text:`1. Τα οχήματα των οποίων οι διαστάσεις, το βάρος, το φορτίο και οι ανά άξονα επιβαρύνσεις υπερβαίνουν τα καθοριζόμενα ανώτατα όρια της κάθε περίπτωσης, όπως αυτή ορίζεται στην παρ. 18 του άρθρου 112, επιτρέπεται να κυκλοφορούν μόνο ύστερα από ειδική άδεια, η οποία μπορεί να δοθεί από τον Υπουργό Υποδομών και Μεταφορών ή τις εξουσιοδοτημένες από αυτόν αρχές. Στην άδεια αυτή καθορίζονται περιορισμοί για την κυκλοφορία των οχημάτων αυτών που αναφέρονται ιδίως στις οδούς διέλευσης, τον χρόνο κυκλοφορίας, τη μέγιστη επιτρεπόμενη ταχύτητα και τα απαιτούμενα μέτρα οδικής ασφάλειας.\n2. Στον καθορισμό του πλάτους των ρυμουλκούμενων και των συνδυασμών οχημάτων δεν συμπεριλαμβάνεται η εγκάρσια προέκταση:\nα) των ελαστικών πλησίον του σημείου επαφής τους με το έδαφος και των συνδέσεων των δεικτών πίεσης αυτών,\nβ) των αντιολισθητικών συσκευών που έχουν προσαρμοστεί στους τροχούς,\nγ) των καθρεπτών οδήγησης, όταν είναι τέτοιας κατασκευής, ώστε να υποχωρούν τόσο προς τα μπρος όσο και προς τα πίσω με μέτρια πίεση, για να μην εξέχουν πέραν του επιτρεπόμενου μέγιστου πλάτους,\nδ) των πλευρικών δεικτών κατεύθυνσης και των ενδεικτικών φωτών του όγκου τους,\nε) των τελωνειακών σφραγίδων, οι οποίες είναι προσαρμοσμένες στο φορτίο, και των συσκευών που χρησιμοποιούνται για την εξασφάλιση και προστασία των σφραγίδων αυτών.\n3. Τα άκρα των αξόνων και τα κεντρικά τμήματα των τροχών (πλήμνες) των οδικών οχημάτων απαγορεύεται να εξέχουν του εξωτερικού περιγράμματος του οχήματος, εξαιρουμένων των μηχανημάτων έργου, των αγροτικών μηχανημάτων και ζωήλατων οχημάτων, τα οποία στερούνται προφυλακτήρων λάσπης (φτερών) ή έχουν αμάξωμα το οποίο δεν εξέχει των τροχών και για τα οποία επιτρέπεται τα άκρα των αξόνων και των κεντρικών τμημάτων των τροχών να εξέχουν του επιπέδου της στεφάνης των τροχών έως είκοσι πέντε (25) εκατοστά.\n4. Το όχημα το οποίο κυκλοφορεί κατά παράβαση του παρόντος ακινητοποιείται από το αρμόδιο αστυνομικό όργανο που διαπίστωσε την παράβαση, σύμφωνα με το άρθρο 50, περί ακινητοποίησης οχήματος.\n5. Οι παραβάσεις των παρ. 2 έως 4 κατατάσσονται στην κατηγορία Ε2-Β, εκτός των φορτηγών αυτοκινήτων για τα οποία εφαρμόζεται ο ν. 3446/2006 (Α’ 49), περί οργάνωσης και λειτουργίας αρχών ελέγχου κυκλοφορίας των οχημάτων και ρυθμίσεων για τις επιβατικές μεταφορές.`},
  59: {title:`Τροχοπέδηση αυτοκινήτων οχημάτων`,text:`1. Τα αυτοκίνητα οχήματα είναι εφοδιασμένα με συστήματα τροχοπέδησης, τα οποία μπορεί να χειρίζεται με ευχέρεια ο οδηγός από τη θέση οδήγησης και είναι ικανά να εκτελούν τις πιο κάτω λειτουργίες τροχοπέδησης:\nα) τροχοπέδηση πορείας, ικανή να επιβραδύνει την κίνηση του οχήματος, μέχρι να το σταματήσει, με τρόπο ασφαλή, ταχύ και αποτελεσματικό, όποιες και αν είναι οι συνθήκες φόρτωσής του και οποιαδήποτε η ανωφερική ή κατωφερική κλίση της οδού,\nβ) τροχοπέδηση στάθμευσης, ικανή να συγκρατεί το όχημα ακίνητο, όποιες και αν είναι οι συνθήκες φόρτωσής του και σε σημαντική ανωφερική ή κατωφερική κλίση της οδού. Οι επιφάνειες τριβής της τροχοπέδης αυτής διατηρούνται στη θέση πέδησης με συσκευή, η ενέργεια της οποίας είναι καθαρά μηχανική,\nγ) τροχοπέδηση έκτακτης ανάγκης (δευτερεύουσα), ικανή να επιβραδύνει την κίνηση του οχήματος, μέχρι να το σταματήσει σε εύλογη απόσταση, όποιες και αν είναι οι συνθήκες φόρτωσής του, ακόμη και σε περίπτωση αποτυχίας της τροχοπέδης πορείας.\n2. Τα συστήματα πέδησης της παρ. 1 μπορούν να έχουν κοινά τμήματα. Ο συνδυασμός των συστημάτων αυτών επιτρέπεται μόνον όταν μπορούν να λειτουργήσουν με δύο (2) τουλάχιστον ανεξάρτητους χειρισμούς.\n3. Η τροχοπέδη πορείας επενεργεί σε όλους τους τροχούς του οχήματος.\n4. Η τροχοπέδη στάθμευσης και η τροχοπέδη έκτακτης ανάγκης επενεργούν σε έναν (1) τουλάχιστον τροχό σε κάθε πλευρά του άξονα κατά μήκος του οχήματος.\n5. Η τροχοπέδη πορείας και η τροχοπέδη στάθμευσης επενεργούν σε επιφάνειες τριβής σταθερά συνδεδεμένες με το σύστημα των τροχών, δια μέσου στοιχείων επαρκούς αντοχής.\n6. Όταν η τροχοπέδη βρίσκεται σε κατάσταση πέδησης, οι επιφάνειες τριβής δεν επιτρέπεται να μπορούν να αποσυνδέονται. Η αποσύνδεση αυτή είναι δυνατή σε ορισμένες επιφάνειες τριβής στη μεν τροχοπέδη στάθμευσης μόνο μετά από ενέργεια του οδηγού, στη δε τροχοπέδη πορείας ή έκτακτης ανάγκης, αν εξασφαλίζεται η αποτελεσματικότητα της πέδησης.\n7. Το σύνολο των τμημάτων του συστήματος τροχοπέδησης πορείας σχεδιάζεται και κατασκευάζεται κατά τέτοιο τρόπο, ώστε να εξασφαλίζεται η αποτελεσματικότητα της πέδησης μετά από παρατεταμένη ή επαναλαμβανόμενη επενέργεια.\n8. Η επενέργεια της τροχοπέδης πορείας κατανέμεται κατάλληλα και συγχρονίζεται μεταξύ των διάφορων αξόνων του οχήματος.\n9. Εάν η τροχοπέδη πορείας ενεργοποιείται υποβοηθητικά ή εξ ολοκλήρου από πηγή ενέργειας, πλην της μυϊκής ενέργειας του οδηγού, εξασφαλίζεται η δυνατότητα ακινητοποίησης του οχήματος μέσα σε εύλογη απόσταση, ακόμη και σε περίπτωση αποτυχίας της πηγής ενέργειας.\n10. Οι παραβάσεις για αυτόν που θέτει στην κυκλοφορία και για αυτόν που οδηγεί αυτοκίνητο όχημα που δεν είναι εφοδιασμένο με σύστημα τροχοπέδησης, το οποίο να λειτουργεί σύμφωνα το παρόν, κατατάσσονται στην κατηγορία Ε2-Β.`},
  60: {title:`Τροχοπέδηση ρυμουλκούμενων`,text:`1. Με την επιφύλαξη της περ. γ) της παρ. 1 του άρθρου 61, περί τροχοπέδησης συνδυασμών οχημάτων, τα ρυμουλκούμενα, εκτός από τα ελαφρά, επιβάλλεται να είναι εφοδιασμένα με τα ακόλουθα δύο (2) συστήματα τροχοπέδησης:\nα) τροχοπέδη πορείας, ικανή να επιβραδύνει την κίνηση του οχήματος, μέχρι να το σταματήσει με τρόπο ασφαλή, ταχύ και αποτελεσματικό, όποιες και αν είναι οι συνθήκες φόρτωσής του και οποιαδήποτε η ανωφερική ή κατωφερική κλίση της οδού,\nβ) τροχοπέδη στάθμευσης, ικανή να επιβραδύνει την κίνηση του οχήματος, μέχρι να το σταματήσει με τρόπο ασφαλή, ταχύ και αποτελεσματικό, με την οποία παραμένει το όχημα ακίνητο, όποιες και αν είναι οι συνθήκες φόρτωσής του σε σημαντική ανωφερική ή κατωφερική κλίση της οδού. Οι επιφάνειες τριβής της τροχοπέδης αυτής διατηρούνται στη θέση πέδησης με συσκευή, η ενέργεια της οποίας είναι καθαρά μηχανική. Η παρούσα περίπτωση δεν εφαρμόζεται σε ρυμουλκούμενα, τα οποία δεν μπορούν να αποσυνδεθούν από το έλκον όχημα, χωρίς τη χρήση εργαλείων, με την προϋπόθεση ότι τηρείται η περ. α) της παρ. 1 του άρθρου 61 για την τροχοπέδη στάθμευσης του συνδυασμού οχημάτων.\n2. Τα συστήματα τροχοπέδησης της παρ. 1 είναι δυνατό να έχουν κοινά τμήματα, επιτρεπόμενου του συνδυασμού αυτών.\n3. Η επενέργεια της τροχοπέδης πορείας πρέπει να κατανέμεται κατάλληλα σε όλους τους τροχούς του ρυμουλκούμενου και να συγχρονίζεται μεταξύ των διάφορων αξόνων αυτού.\n4. Η τροχοπέδη πορείας πρέπει να τίθεται σε ενέργεια από τη θέση οδήγησης με τον χειρισμό της τροχοπέδης πορείας του έλκοντος οχήματος. Από το πρώτο εδάφιο εξαιρούνται τα ρυμουλκούμενα με μέγιστο επιτρεπόμενο μικτό βάρος μέχρι τρεις χιλιάδες πεντακόσια (3.500) χιλιόγραμμα, η τροχοπέδη των οποίων μπορεί να είναι κατασκευασμένη, ώστε να τίθεται σε ενέργεια αυτόματα, όταν το ρυμουλκούμενο κινείται προς το επιβραδύνον έλκον όχημα.\n5. Η τροχοπέδη πορείας και στάθμευσης πρέπει να επενεργεί επί επιφανειών πέδησης, οι οποίες είναι σταθερά συνδεδεμένες με τους τροχούς, δια μέσου στοιχείων επαρκούς αντοχής.\n6. Η τροχοπέδη πορείας, σε περίπτωση απόσπασης του ρυμουλκούμενου, πρέπει να το ακινητοποιεί αυτόματα. Από το πρώτο εδάφιο εξαιρούνται τα μονοαξονικά ρυμουλκούμενα και από τα διαξονικά, εκείνα των οποίων η απόσταση των αξόνων είναι μικρότερη του ενός (1) μέτρου με την προϋπόθεση ότι:\nα) το μέγιστο επιτρεπόμενο μικτό βάρος τους δεν υπερβαίνει τα χίλια πεντακόσια (1.500) χιλιόγραμμα, και\nβ) εκτός των ημιρυμουλκούμενων, είναι εφοδιασμένα, πλην της κύριας συσκευής σύνδεσης και με δευτερεύουσα σύνδεση, η οποία, σε περίπτωση θραύσης της κύριας συσκευής, εμποδίζει την πτώση της ράβδου έλξης του ρυμουλκούμενου στο έδαφος και εξασφαλίζει τη συνέχιση της ασφαλούς έλξης.\n7. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα που έλκει ρυμουλκούμενο των παρ. 1 έως 6, το οποίο δεν είναι εφοδιασμένο με σύστημα τροχοπέδησης που λειτουργεί σύμφωνα με το παρόν, κατατάσσονται στην κατηγορία Ε2-Β.`},
