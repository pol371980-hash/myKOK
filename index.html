  62: {title:`Τροχοπέδηση μοτοποδηλάτων, μοτοσικλετών και τρίτροχων οχημάτων`,text:`1. Τα δίτροχα μοτοποδήλατα και οι μοτοσικλέτες, χωρίς πλευρικό κάνιστρο, εφοδιάζονται με δύο (2) συστήματα τροχοπέδησης, εκ των οποίων το ένα (1) επενεργεί στον εμπρόσθιο τροχό τουλάχιστον, ενώ το άλλο στον οπίσθιο τροχό τουλάχιστον. Σε μοτοσικλέτα με πλευρικό καλάθι δεν απαιτείται να υπάρχει σύστημα τροχοπέδησης που να επενεργεί στον τροχό του καλαθιού.\n2. Τα μοτοποδήλατα με τρεις (3) τροχούς εφοδιάζονται, είτε με δύο (2) ανεξάρτητα συστήματα τροχοπέδησης, που επενεργούν συγχρόνως σε όλους τους τροχούς, είτε με ένα (1) σύστημα τροχοπέδησης, που επενεργεί σε όλους τους τροχούς και ένα (1) σύστημα εφεδρικής τροχοπέδησης (έκτακτης ανάγκης), το οποίο μπορεί να είναι η τροχοπέδη στάθμευσης.\n3. Τα συστήματα τροχοπέδησης μοτοποδηλάτων και μοτοσικλετών είναι ικανά να επιβραδύνουν την κίνηση του οχήματος, μέχρι να το σταματήσουν, με τρόπο ασφαλή, ταχύ και αποτελεσματικό, όποιες και αν είναι οι συνθήκες φόρτωσής του και οποιαδήποτε η ανωφερική ή κατωφερική κλίση της οδού.\n4. Τα τρίτροχα οχήματα εφοδιάζονται με ένα (1) σύστημα τροχοπέδησης, το οποίο με χειρισμό με το πόδι επενεργεί σε όλους τους τροχούς, ένα (1) σύστημα τροχοπέδησης στάθμευσης και ένα (1) σύστημα εφεδρικής τροχοπέδησης (έκτακτης ανάγκης), το οποίο μπορεί να είναι η τροχοπέδη στάθμευσης. Η τροχοπέδη στάθμευσης πληροί τις προϋποθέσεις της περ. β) της παρ. 1 του άρθρου 59. 5. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί, μοτοποδήλατο ή μοτοσικλέτα ή τρίτροχο όχημα που δεν είναι εφοδιασμένα με σύστημα τροχοπέδησης των παρ. 1 έως 4, κατατάσσονται στην κατηγορία Ε2-Β.`},
  63: {title:`Τροχοπέδηση ποδηλάτων και Ελαφρών Προσωπικών Ηλεκτρικών Οχημάτων`,text:`1. Τα ποδήλατα εφοδιάζονται με δύο (2) συστήματα τροχοπέδησης, ανεξάρτητα μεταξύ τους, άμεσης και αποτελεσματικής επενέργειας, εκ των οποίων το ένα (1) επενεργεί στον εμπρόσθιο και το άλλο στον οπίσθιο τροχό.\n2. Τα Ελαφρά Προσωπικά Ηλεκτρικά Οχήματα εφοδιάζονται με σύστημα τροχοπέδησης, εύχρηστο, άμεσης και αποτελεσματικής επενέργειας.\n3. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί, ποδήλατο ή Ε.Π.Η.Ο. που δεν είναι εφοδιασμένο με σύστημα τροχοπέδησης των παρ. 1 και 2, κατατάσσονται στην κατηγορία Ε1-Α.`},
  65: {title:`Τροχοπέδηση αγροτικών μηχανημάτων`,text:`1. Αγροτικά μηχανήματα, τα οποία εκ κατασκευής μπορούν να αναπτύξουν ταχύτητα μεγαλύτερη των τριάντα (30) χιλιομέτρων την ώρα, εφοδιάζονται με δύο (2) ανεξάρτητα μεταξύ τους συστήματα τροχοπέδησης. Οι περ. α) και\nβ) της παρ. 1 και η παρ. 3 του άρθρου 59, περί τροχοπέδησης αυτοκινήτων οχημάτων, εφαρμόζονται ανάλογα.\n2. Αγροτικά μηχανήματα, τα οποία εκ κατασκευής δεν μπορούν να αναπτύξουν ταχύτητα μεγαλύτερη των τριάντα (30) χιλιομέτρων την ώρα, μπορεί να είναι εφοδιασμένα με ένα (1) μόνο σύστημα τροχοπέδησης (τροχοπέδη πορείας), αν το σύστημα αυτό λειτουργεί και ως τροχοπέδη στάθμευσης.\n3. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί, αγροτικό μηχάνημα που δεν είναι εφοδιασμένο με το σύστημα τροχοπέδησης των παρ. 1 και 2, ή στο οποίο αυτό δεν λειτουργεί, κατατάσσονται στην κατηγορία Ε2-Β.`},
  66: {title:`Τροχοπέδηση μηχανημάτων έργου`,text:`1. Μηχανήματα έργου, τα οποία εκ κατασκευής μπορούν να αναπτύξουν ταχύτητα μεγαλύτερη των είκοσι πέντε (25) χιλιομέτρων την ώρα, εφοδιάζονται με δύο (2) ανεξάρτητα μεταξύ τους συστήματα τροχοπέδησης. Οι περ. α) και\nβ) της παρ. 1 και η παρ. 5 του άρθρου 59, περί τροχοπέδησης αυτοκινήτων οχημάτων, εφαρμόζονται ανάλογα.\n2. Μηχανήματα έργου, τα οποία εκ κατασκευής δεν μπορούν να αναπτύξουν ταχύτητα μεγαλύτερη των είκοσι πέντε (25) χιλιομέτρων την ώρα, μπορούν να είναι εφοδιασμένα με ένα (1) μόνο σύστημα τροχοπέδησης, εάν το σύστημα αυτό λειτουργεί και ως τροχοπέδη στάθμευσης.\n3. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί, μηχάνημα έργου που δεν είναι εφοδιασμένο με το σύστημα τροχοπέδησης της παρ. 1, ή στο οποίο αυτό δεν λειτουργεί, κατατάσσονται στην κατηγορία Ε2-Β. KEΦAΛAIO Ε’ ΦΩΤΑ ΚΑΙ ΑΝΤΑΝΑΚΛΑΣΤΙΚΑ ΣΤΟΙΧΕΙΑ (ΑΝΤΑΝΑΚΛΑΣΤΗΡΕΣ)`},
  67: {title:`Φώτα πορείας (μεγάλα)`,text:`1. Τα αυτοκίνητα οχήματα, τα οποία μπορούν να υπερβούν την ταχύτητα των σαράντα (40) χιλιομέτρων την ώρα σε ευθεία οριζόντια οδό, έχουν στο εμπρόσθιο μέρος τους δύο (2) λευκά ή ειδικής επιλογής κίτρινα φώτα πορείας, ικανής έντασης, για τον επαρκή φωτισμό της οδού κατά τη διάρκεια νύχτας, με καθαρές καιρικές συνθήκες, σε απόσταση τουλάχιστον εκατό (100) μέτρων μπροστά από το όχημα.\n2. Η απόσταση μεταξύ των εξωτερικών ορίων των φώτων πορείας και του ακρότατου εξωτερικού ορίου του οχήματος δεν είναι μικρότερη από την αντίστοιχη απόσταση των φώτων διασταύρωσης.\n3. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και από αυτόν που οδηγεί όχημα χωρίς τα φώτα πορείας που προβλέπονται στις παρ. 1 και 2, κατατάσσονται στην κατηγορία Ε2-Α.`},
  68: {title:`Φώτα διασταύρωσης (μεσαία)`,text:`1. Τα αυτοκίνητα οχήματα, τα οποία μπορούν να υπερβούν την ταχύτητα των δέκα (10) χιλιομέτρων την ώρα σε ευθεία οριζόντια οδό, έχουν στο εμπρόσθιο μέρος τους ζυγό αριθμό λευκών φώτων ή ειδικής επιλογής κίτρινα φώτα διασταύρωσης, ικανής έντασης, για τον επαρκή φωτισμό της οδού κατά τη διάρκεια νύχτας με καθαρές καιρικές συνθήκες, σε απόσταση τουλάχιστον σαράντα (40) μέτρων μπροστά από το όχημα. Τα αυτοκίνητα οχήματα δεν επιτρέπεται να είναι εφοδιασμένα με περισσότερα από δύο (2) φώτα διασταύρωσης που να ανάβουν ταυτόχρονα.\n2. Το εξωτερικό σημείο της φωτιστικής επιφάνειας των φώτων διασταύρωσης απέχει το πολύ σαράντα εκατοστά (0,40 μ.) από το ακρότατο εξωτερικό όριο της ίδιας πλευράς του οχήματος.\n3. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί αυτοκίνητο όχημα το οποίο δεν είναι εφοδιασμένο με τα φώτα διασταύρωσης των παρ. 1 και 2, κατατάσσονται στην κατηγορία Ε2-Β.`},
  69: {title:`Φώτα θέσης (μικρά)`,text:`1. Τα αυτοκίνητα οχήματα έχουν δύο (2) μετωπικά λευκά φώτα θέσης. Επιτρέπεται η χρήση ειδικής επιλογής κίτρινου χρώματος για τα φώτα αυτά, όταν είναι ενσωματωμένα σε φώτα πορείας ή διασταύρωσης, τα οποία εκπέμπουν ειδικής επιλογής κίτρινες δέσμες.\n2. Τα φώτα θέσης της παρ. 1, όταν είναι τα μόνα αναμμένα, κατά τη διάρκεια νύχτας με καθαρές καιρικές συνθήκες, είναι ορατά από απόσταση τουλάχιστον τριακοσίων (300) μέτρων, χωρίς να προκαλούν θάμβωση ή δυσχέρεια σε όσους χρησιμοποιούν την οδό.\n3. Τα αυτοκίνητα και τα ρυμουλκούμενα έχουν, στο οπίσθιο μέρος τους, ζυγό αριθμό ερυθρών φώτων θέσης, ορατών από απόσταση τουλάχιστον τριακοσίων (300) μέτρων κατά τη διάρκεια νύχτας με καθαρές καιρικές συνθήκες, χωρίς να προκαλείται θάμβωση ή δυσχέρεια σε όσους χρησιμοποιούν την οδό.\n4. Το εξωτερικό σημείο της φωτιστικής επιφάνειας των φώτων θέσης απέχει το πολύ σαράντα εκατοστά (0,40 μ.) από το ακρότατο εξωτερικό όριο της ίδια πλευράς του οχήματος.\n5. Τα ρυμουλκούμενα, με πλάτος μεγαλύτερο από ένα μέτρο και εξήντα εκατοστά (1,60 μ.) έχουν δύο (2) μετωπικά λευκά φώτα θέσης, όπως στην παρ. 1, προσαρμοσμένα σε τέτοια θέση ώστε το εξωτερικό σημείο της φωτιστικής τους επιφάνειας να μην απέχει περισσότερο από δεκαπέντε εκατοστά (0,15 μ.) από το ακρότατο εξωτερικό όριο της ίδιας πλευράς του ρυμουλκούμενου.\n6. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί, αυτοκίνητο όχημα ή ρυμουλκούμενο το οποίο δεν είναι εφοδιασμένο με τα φώτα θέσης που προβλέπονται στις παρ. 1 έως 5, κατατάσσονται στην κατηγορία Ε2-Α.`},
  70: {title:`Φώτα όγκου και φώτα πλευρικά`,text:`1. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα, το πλάτος των οποίων υπερβαίνει τα δύο μέτρα και δέκα εκατοστά (2,10 μ.) επιβάλλεται να έχουν δύο (2) τουλάχιστον φώτα όγκου, τα οποία πρέπει να εκπέμπουν λευκό ή κίτρινο φως προς τα εμπρός και ερυθρό φως προς τα πίσω. Με τα ίδια πιο πάνω φώτα μπορεί να είναι εφοδιασμένα και τα οχήματα των οποίων το πλάτος υπερβαίνει το ένα μέτρο και ογδόντα εκατοστά (1,80 μ.).\n2. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα εφοδιάζονται με κίτρινα πλευρικά φώτα.\n3. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί αυτοκίνητο όχημα ή ρυμουλκούμενο το οποίο δεν είναι εφοδιασμένο με τα φώτα των παρ. 1 και 2, κατατάσσονται στην κατηγορία Ε2-Α.`},
  71: {title:`Φως πινακίδας αριθμού κυκλοφορίας`,text:`1. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα επιβάλλεται να έχουν φώτα ικανής έντασης, για τον επαρκή φωτισμό της πινακίδας του αριθμού κυκλοφορίας, ώστε ο αριθμός, όταν φωτίζεται, να είναι ευανάγνωστος κατά τη διάρκεια νύχτας με καθαρές καιρικές συνθήκες, από απόσταση τουλάχιστον είκοσι μέτρων (20 μ.) και μη απευθείας ορατό από τους οδηγούς των οχημάτων που ακολουθούν.\n2. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί αυτοκίνητο όχημα ή ρυμουλκούμενο, το οποίο δεν είναι εφοδιασμένο με το φως πινακίδας αριθμού κυκλοφορίας της παρ. 1, κατατάσσονται στην κατηγορία Ε1-Β.`},
  72: {title:`Φώτα τροχοπέδησης`,text:`1. Τα αυτοκίνητα οχήματα, τα οποία μπορούν να υπερβούν την ταχύτητα των είκοσι πέντε (25) χιλιομέτρων την ώρα σε ευθεία οριζόντια οδό, και τα ρυμουλκούμενα έχουν στο οπίσθιο μέρος τους τουλάχιστον δύο (2) ερυθρά φώτα τροχοπέδησης, η φωτιστική ένταση των οποίων να είναι σημαντικά μεγαλύτερη εκείνης των πίσω φώτων θέσης.\n2. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί, αυτοκίνητο όχημα ή ρυμουλκούμενο, το οποίο δεν είναι εφοδιασμένο με τα φώτα πέδησης της παρ. 1, κατατάσσονται στην κατηγορία Ε2-Β.`},
  73: {title:`Φώτα ομίχλης`,text:`1. Τα αυτοκίνητα οχήματα μπορούν να φέρουν μπροστά δύο (2) φώτα ομίχλης αντιθαμβωτικά, λευκού ή ειδικής επιλογής κίτρινου χρώματος και τοποθετημένα με τρόπο ώστε κανένα σημείο της φωτιστικής τους επιφάνειας να μη βρίσκεται ψηλότερα από το ανώτατο σημείο της φωτιστικής επιφάνειας των φωτών διασταύρωσης και το εξωτερικό σημείο της φωτιστικής τους επιφάνειας να απέχει λιγότερο από σαράντα εκατοστά (0,40 μ.) από το ακρότατο εξωτερικό όριο της ίδιας πλευράς του οχήματος.\n2. Τα αυτοκίνητα και τα ρυμουλκούμενα μπορούν να φέρουν πίσω ένα (1) ή δύο (2) φώτα ομίχλης ερυθρού χρώματος.\n3. Οι παραβάσεις του παρόντος από αυτόν που θέτει σε κυκλοφορία, καθώς και από αυτόν που οδηγεί όχημα το οποίο φέρει φώτα ομίχλης που δεν πληρούν τους όρους των παρ. 1 και 2, κατατάσσονται στην κατηγορία Ε1-Α.`},
  75: {title:`Φώτα δεικτών κατεύθυνσης (φλας) και φώτα έκτακτης ανάγκης`,text:`1. Τα αυτοκίνητα οχήματα, τα τρίτροχα οχήματα, οι μοτοσικλέτες, τα μοτοποδήλατα και τα ρυμουλκούμενα, έχουν ζυγό αριθμό σταθερών δεικτών κατεύθυνσης με κίτρινα φώτα που αναβοσβήνουν, ορατά κατά την ημέρα και νύχτα από τους χρήστες της οδού. Η συχνότητα με την οποία αναβοσβήνει το φως είναι ενενήντα (90) παλμοί το λεπτό, με ανοχή συν πλην τριάντα (30) παλμών. Με τα φώτα της παρούσας μπορούν να αναβοσβήνουν συγχρόνως και τα πλευρικά φώτα θέσης.\n2. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα εφοδιάζονται με συσκευή που επιτρέπει τη σύγχρονη λειτουργία των φώτων δεικτών κατεύθυνσης (φώτα έκτακτης ανάγκης).\n3. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα, που αναφέρεται στις παρ. 1 και 2 και το οποίο δεν είναι εφοδιασμένο με τους προβλεπόμενους φωτεινούς δείκτες κατεύθυνσης που να λειτουργούν σύμφωνα με το άρθρο αυτό, κατατάσσονται στην κατηγορία Ε2-Α.`},
  76: {title:`Αντανακλαστήρες`,text:`1. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα επιβάλλεται να έχουν στο οπίσθιο μέρος τους δύο (2) τουλάχιστον ερυθρούς αντανακλαστήρες, ορατούς από οδηγό, κατά τη νύχτα με καθαρές καιρικές συνθήκες από απόσταση τουλάχιστον εκατόν πενήντα μέτρων (150 μ.), όταν φωτίζονται από τα φώτα πορείας, τα φώτα διασταύρωσης ή τα φώτα ομίχλης άλλου οχήματος.\n2. Οι ως άνω αντανακλαστήρες των μεν αυτοκινήτων οχημάτων μπορούν να έχουν οποιοδήποτε σχήμα, εκτός τριγωνικού, των δε ρυμουλκούμενων επιβάλλεται να έχουν σχήμα ισόπλευρου τριγώνου, πλευράς μήκους από δεκαπέντε εκατοστά (0,15 μ.) έως και είκοσι εκατοστά (0,20 μ.) και το οποίο τοποθετείται με τη μία πλευρά οριζόντια και την απέναντι αυτής κορυφή προς τα πάνω. Μέσα στο τρίγωνο αυτό απαγορεύεται η τοποθέτηση οποιουδήποτε φωτεινού σήματος.\n3. Το εξωτερικό άκρο της φωτιστικής επιφάνειας του αντανακλαστήρα δεν απέχει περισσότερο από σαράντα εκατοστά (0,40 μ.) από το ακρότατο της αυτής πλευράς εξωτερικό όριο του οχήματος.\n4. Τα ρυμουλκούμενα έχουν στο εμπρόθιο μέρος δύο (2) λευκούς αντανακλαστήρες οποιουδήποτε σχήματος, εκτός τριγωνικού, οι οποίοι ανταποκρίνονται ως προς την ορατότητα με τις απαιτήσεις της παρ. 1. 5. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα, το μήκος των οποίων υπερβαίνει τα έξι (6) μέτρα, επιβάλλεται να έχουν κίτρινους πλευρικούς αντανακλαστήρες. 6. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί αυτοκίνητο όχημα ή ρυμουλκούμενο, που δεν έχει τους κατά το παρόν άρθρο προβλεπόμενους αντανακλαστήρες, κατατάσσονται στην κατηγορία Ε2-Α.`},
  78: {title:`Φώτα μοτοποδηλάτων και μοτοσικλετών`,text:`1. Τα τρίτροχα μοτοποδήλατα είναι εφοδιασμένα με:\nα) Ένα (1) ή δύο (2) φώτα διασταύρωσης,\nβ) ένα (1) ή δύο (2) οπίσθια φώτα θέσης,\nγ) ένα (1) ή δύο (2) φώτα τροχοπέδησης.\nδ) ένα (1) ή δύο (2) σε κάθε πλευρά μη τριγωνικούς ανακλαστήρες,\nε) έναν (1) μη τριγωνικό ανακλαστήρα πίσω,\nστ) δύο (2) ανακλαστήρες σε κάθε ποδομοχλό, όταν αυτοί δεν είναι αναδιπλούμενοι. Τα δίτροχα μοτοποδήλατα μπορεί να είναι εφοδιασμένα και με:\nα) Ένα (1) ή δύο (2) φώτα πορείας,\nβ) δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης,\nγ) φώτα για τον φωτισμό της πινακίδας του αριθμού κυκλοφορίας,\nδ) ένα (1) ή δύο (2) φώτα θέσης μπροστά,\nε) έναν (1) μη τριγωνικό ανακλαστήρα μπροστά.\n2. Τα τρίτροχα μοτοποδήλατα και τα ελαφρά τετράτροχα είναι εφοδιασμένα με:\nα) Ένα (1) ή δύο (2) φώτα διασταύρωσης.\nβ) Ένα (1) ή δύο (2) φώτα θέσης μπροστά. Τα τρίτροχα μοτοποδήλατα με μέγιστο πλάτος άνω των χιλίων τριακοσίων (1.300) χιλιοστών είναι εφοδιασμένα με δύο (2) φώτα θέσης μπροστά.\nγ) Ένα (1) ή δύο (2) φώτα θέσης πίσω. Τα τρίκυκλα μοτοποδήλατα με μέγιστο πλάτος άνω των χιλίων τριακοσίων (1.300) χιλιοστών είναι εφοδιασμένα με δύο (2) φώτα θέσης πίσω.\nδ) Έναν (1) ή δύο (2) μη τριγωνικούς ανακλαστήρες πίσω. Τα τρίκυκλα μοτοποδήλατα με μέγιστο πλάτος άνω των χιλίων (1.000) χιλιοστών είναι εφοδιασμένα με δύο (2) μη τριγωνικούς ανακλαστήρες πίσω.\nε) Δύο (2) ανακλαστήρες σε κάθε ποδομοχλό, όταν αυτοί δεν είναι αναδιπλούμενοι.\nστ) Ένα (1) ή δύο (2) φώτα τροχοπέδησης. Τα τρίτροχα μοτοποδήλατα με μέγιστο πλάτος χιλίων τριακοσίων (1.300) χιλιοστών είναι εφοδιασμένα με δύο (2) φώτα τροχοπέδησης.\nζ) Δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης, για τα τρίτροχα μοτοποδήλατα με κλειστό αμάξωμα. Επίσης, τα τρίτροχα μοτοποδήλατα μπορεί να είναι εφοδιασμένα και με:\nα) Ένα (1) ή δύο (2) φώτα πορείας,\nβ) δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης, για τα τρίτροχα μοτοποδήλατα χωρίς κλειστό αμάξωμα,\nγ) φώτα για τον φωτισμό της πινακίδας του αριθμού κυκλοφορίας,\nδ) έναν (1) ή δύο (2) σε κάθε πλευρά μη τριγωνικούς ανακλαστήρες.\n3. Οι δίτροχες μοτοσικλέτες είναι εφοδιασμένες με:\nα) Ένα (1) ή δύο (2) φώτα πορείας,\nβ) ένα (1) ή δύο (2) φώτα διασταύρωσης,\nγ) δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης,\nδ) ένα (1) ή δύο (2) φώτα τροχοπέδησης,\nε) ένα (1) ή δύο (2) φώτα θέσης μπροστά,\nστ) ένα (1) ή δύο (2) φώτα θέσης πίσω,\nζ) φως για τον φωτισμό της οπίσθιας πινακίδας του αριθμού κυκλοφορίας,\nη) Έναν (1) μη τριγωνικό ανακλαστήρα πίσω. Επίσης, οι δίτροχες μοτοσικλέτες μπορεί να είναι εφοδιασμένες και με:\nα) Ένα (1) ή δύο (2) φώτα ομίχλης μπροστά,\nβ) ένα (1) ή δύο (2) φώτα ομίχλης πίσω,\nγ) ένα (1) φως έκτακτης ανάγκης,\nδ) έναν (1) ή δύο (2) σε κάθε πλευρά μη τριγωνικούς ανακλαστήρες.\n4. Οι δίτροχες μοτοσικλέτες με πλευρικό κάνιστρο είναι εφοδιασμένες με:\nα) Ένα (1) ή δύο (2) φώτα πορείας,\nβ) ένα (1) ή δύο (2) φώτα διασταύρωσης,\nγ) δύο (2) σε κάθε πλευρά δείκτες κατεύθυνσης,\nδ) ένα (1) ή δύο (2) φώτα τροχοπέδησης,\nε) δύο (2) ή τρία (3) φώτα θέσης μπροστά, από τα οποία το ένα (1) στο καλάθι,\nστ) δύο (2) ή τρία (3) φώτα θέσης πίσω, από τα οποία το ένα (1) στο καλάθι,\nζ) φως για τον φωτισμό της οπίσθιας πινακίδας του αριθμού κυκλοφορίας,\nη) δύο (2) μη τριγωνικούς ανακλαστήρες πίσω. Επίσης, οι δίτροχες μοτοσικλέτες με πλευρικό καλάθι μπορεί να είναι εφοδιασμένες και με:\nα) Ένα (1) ή δύο (2) φώτα ομίχλης μπροστά,\nβ) ένα (1) ή δύο (2) φώτα ομίχλης πίσω,\nγ) ένα (1) φως έκτακτης ανάγκης,\nδ) έναν (1) ή δύο (2) σε κάθε πλευρά μη τριγωνικούς ανακλαστήρες.\n5. Το ηλεκτρικό σύστημα μοτοσικλέτας και καλαθιού είναι κατασκευασμένο με τρόπο, ώστε τα φώτα θέσης (μετωπικό και πίσω) του καλαθιού να ανάβουν συγχρόνως με το πίσω φως θέσης της μοτοσικλέτας.\n6. Τα φώτα που προβλέπονται στις παρ. 3 και 4 πληρούν τις προδιαγραφές ως προς το χρώμα, την ένταση και την τοποθέτηση, οι οποίες καθορίζονται για τα αντίστοιχα φώτα των αυτοκινήτων οχημάτων, εκτός των μοτοποδηλάτων, τα οποία έχουν φανούς μέτριας έντασης.\n7. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα από τα πιο πάνω, το οποίο δεν είναι εφοδιασμένο με τα ως άνω προβλεπόμενα φώτα, που να λειτουργούν σύμφωνα με το άρθρο αυτό κατατάσσονται στην κατηγορία Ε2-Α.`},
  80: {title:`Φώτα ποδηλάτων και Ελαφρών Προσωπικών Ηλεκτρικών Οχημάτων (Ε.Π.Η.Ο.)`,text:`1. Τα ποδήλατα είναι εφοδιασμένα με ένα (1) λευκό ή κίτρινο φως μπροστά, ένα (1) ερυθρό φως αντανακλαστικό στοιχείο πίσω και με έναν (1) τουλάχιστον αντανακλαστήρα σε κάθε πλευρά. Ομοίως, αντανακλαστικό στοιχείο κίτρινου χρώματος τοποθετείται σε κάθε ποδομοχλό. Εξαιρούνται της υποχρέωσης να φέρουν τα ως άνω φώτα, εφόσον δεν κυκλοφορούν τη νύχτα, τα ποδήλατα των οποίων η διάμετρος τροχού δεν υπερβαίνει τα πεντακόσια (500) χιλιοστά, τα αγωνιστικά και τα ορειβατικά ποδήλατα.\n2. Τα Ε.Π.Η.Ο. είναι εφοδιασμένα με ένα (1) λευκό ή κίτρινο φως μπροστά, ένα (1) ερυθρό φως και αντανακλαστικό στοιχείο πίσω και με έναν (1) τουλάχιστον αντανακλαστήρα σε κάθε πλευρά. Εξαιρούνται της υποχρέωσης να φέρουν τα ως άνω φώτα, εφόσον δεν κυκλοφορούν τη νύχτα, ηλεκτροκίνητα αμαξίδια, scooters και handbikes ατόμων με αναπηρία.\n3. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί ποδήλατο ή Ε.Π.Η.Ο, το οποίο δεν είναι εφοδιασμένο με τα πιο πάνω προβλεπόμενα φώτα και αντανακλαστικά στοιχεία, που να λειτουργούν σύμφωνα με το παρόν άρθρο κατατάσσονται στην κατηγορία Ε1-Α.`},
  82: {title:`Φώτα αγροτικών μηχανημάτων`,text:`1. Οι διατάξεις του παρόντος Κεφαλαίου για το σύστημα φωτισμού και οπτικής γενικά σήμανσης των οχημάτων έχουν ανάλογη εφαρμογή και στα αγροτικά\nα) Ένα (1) ή δύο (2) φώτα ομίχλης μπροστά, μηχανήματα τα οποία κινούνται αυτοδύναμα και επί των υπ’ αυτών ρυμουλκούμενων, αν αυτά καλύπτουν τα πίσω φώτα του έλκοντος οχήματος. Ειδικότερα, στις περιπτώσεις συνδυασμών μονοαξονικών γεωργικών ελκυστήρων, των οποίων η πραγματική ισχύς του κινητήρα στον άξονα δεν υπερβαίνει τους επτά (7) ίππους, μετά ρυμουλκούμενων, εφαρμόζονται οι διατάξεις του παρόντος Κεφαλαίου για τις δίτροχες μοτοσικλέτες με ή χωρίς καλάθι. Αν η πραγματική ισχύς του κινητήρα στον άξονα υπερβαίνει τους (7) ίππους, εφαρμόζονται οι διατάξεις του παρόντος Κεφαλαίου για τις τρίτροχες μοτοσικλέτες.\n2. Τα αγροτικά μηχανήματα μπορούν να φέρουν ειδικό προβολέα, ο οποίος χρησιμοποιείται μόνο κατά την εκτέλεση μηχανοαγροτικών εργασιών, απαγορευμένης της χρήσης αυτού κατά την κίνησή τους στις οδούς.\n3. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα από τα πιο πάνω, το οποίο δεν είναι εφοδιασμένο με το προβλεπόμενο σύστημα φωτισμού, που να λειτουργεί σύμφωνα με τις διατάξεις του άρθρου αυτού, όπως και αυτόν που παραβαίνει την παρ. 2 του άρθρου αυτού, κατατάσσονται στην κατηγορία Ε2-Β.`},
  83: {title:`Φώτα μηχανημάτων έργου`,text:`1. Οι διατάξεις του παρόντος Κεφαλαίου για το σύστημα φωτισμού και οπτικής γενικά σήμανσης των οχημάτων, έχουν ανάλογη εφαρμογή και επί των μηχανημάτων έργου και επί των υπ’ αυτών ρυμουλκούμενων, αν αυτά καλύπτουν τα πίσω φώτα του έλκοντος οχήματος. Τα χιονοκαθαριστικά μηχανήματα είναι εφοδιασμένα και με φανούς κίτρινου φωτός.\n2. Τα μηχανήματα έργου μπορεί να έχουν ειδικούς προβολείς, οι οποίοι χρησιμοποιούνται μόνο κατά την εκτέλεση έργων, απαγορευμένης της χρήσης αυτών κατά την κίνησή τους επί των οδών.\n3. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα από τα πιο πάνω, το οποίο δεν είναι εφοδιασμένο με το προβλεπόμενο σύστημα φωτισμού, που να λειτουργεί σύμφωνα με τις διατάξεις του παρόντος άρθρου, όπως και αυτόν που παραβαίνει την παρ. 2 του παρόντος κατατάσσονται στην κατηγορία Ε2-Β.`},
  85: {title:`Μηχανισμοί, εξαρτήματα και συσκευές οχημάτων`,text:`1. Τα αυτοκίνητα οχήματα είναι εφοδιασμένα με σύστημα διεύθυνσης, το οποίο επιτρέπει στον οδηγό την ευχερή, ταχεία και ασφαλή αλλαγή κατεύθυνσης του οχήματός του.\n2. Τα αυτοκίνητα οχήματα, τα τρίτροχα οχήματα, οι μοτοσικλέτες και τα μοτοποδήλατα είναι εφοδιασμένα με έναν (1) τουλάχιστον καθρέπτη, τοποθετημένο σε θέση η οποία εξασφαλίζει την ορατότητα της οδού πίσω από το όχημα.\n3. Τα αυτοκίνητα οχήματα, τα αγροτικά μηχανήματα και τα μηχανήματα έργου, τα οποία κινούνται στις οδούς είναι εφοδιασμένα με ένα (1) τουλάχιστον ηχητικό όργανο προειδοποίησης ικανής έντασης, τα τρίτροχα οχήματα, οι μοτοσικλέτες και τα μοτοποδήλατα με όμοιο όργανο μικρότερης έντασης. Ο ήχος, ο οποίος εκπέμπεται από το ηχητικό όργανο, είναι συνεχής, του αυτού τόνου και όχι διαπεραστικός. Τα επιβατηγά οχήματα, αντί για εφεδρικό τροχό, δύνανται να είναι εφοδιασμένα με κιβώτιο επισκευής ελαστικού ή με ειδικά συστήματα συνέχισης οδήγησης.\n4. Τα οχήματα άμεσης ανάγκης, τα έχοντα προτεραιότητα και τα οχήματα δημόσιας μαζικής μεταφοράς επιβατών, μπορούν να είναι εφοδιασμένα και να χρησιμοποιούν άλλα ηχητικά όργανα, διαφόρων ήχων.\n5. Η χρήση σαλπίγγων εναλλασσόμενου ήχου, σειρήνων, σφυρικτών και άλλων παρόμοιων συσκευών απαγορεύεται, εκτός των οχημάτων της παρ. 4. 6. Τα ποδήλατα, εκτός από αυτά που χρησιμοποιούνται σε αθλητικούς αγώνες, είναι εφοδιασμένα με ένα κουδούνι. 7. Τα Ε.Π.Η.Ο. είναι εφοδιασμένα με:\nα) συσκευή ηχητικής προειδοποίησης,\nβ) σύστημα πρόωσης που εφαρμόζεται στον εμπρόσθιο ή στους εμπρόσθιους και στον οπίσθιο ή στους οπίσθιους τροχούς, εφόσον υφίστανται. Σε περίπτωση ηλεκτρικής βλάβης ή βλάβης του συστήματος πρόωσης, το Ε.Π.Η.Ο. δεν επιταχύνει ή επιβραδύνει απότομα. 8. Τα διαφανή μέρη των αυτοκινήτων, οχημάτων και των ρυμουλκούμενων, τα οποία αποτελούν τμήμα του αμαξώματος αυτών, περιλαμβανομένου και του ανεμοθώρακα, καθώς και οποιουδήποτε εσωτερικού χωρίσματος, είναι κατασκευασμένα με τρόπο ώστε σε περίπτωση θραύσης τους, ο κίνδυνος τραυματισμού προσώπων να μειώνεται στο ελάχιστο και να είναι ορατοί ο οδηγός και οι άλλοι επιβαίνοντες. Τα διαφανή μέρη του ανεμοθώρακα είναι κατασκευασμένα από τέτοια ύλη, ώστε:\nα) η διαφάνεια του ανεμοθώρακα να μην ελαττώνεται με την πάροδο του χρόνου,\nβ) να μην παραμορφώνουν τις εικόνες των αντικειμένων που φαίνονται δια μέσου του ανεμοθώρακα,\nγ) σε περίπτωση θραύσης τους, ο οδηγός να έχει ικανή καθαρή θέα της οδού. Επιτρέπεται η επικόλληση μεμβρανών στα παράθυρα πίσω από τη θέση του οδηγού - συνοδηγού, όταν το αυτοκίνητο διαθέτει δεξιό καθρέπτη, και σε όλα τα παράθυρα του αυτοκινήτου για ιατρικούς λόγους. 9. Το αυτοκίνητο όχημα, το οποίο έχει ανεμοθώρακα διαστάσεων και σχήματος που δεν επιτρέπει στον οδηγό να βλέπει κανονικά μπροστά του, παρά μόνο μέσα από το διαφανές μέρος του ανεμοθώρακα, είναι εφοδιασμένο με έναν (1) τουλάχιστον αποτελεσματικό καθαριστήρα του ανεμοθώρακα, τοποθετημένο σε κατάλληλη θέση, ο οποίος λειτουργεί με τρόπο ώστε να μην απαιτείται διαρκής ενέργεια του οδηγού. Επιπλέον, το όχημα της παρούσας είναι εφοδιασμένο με πλυντήρια του ανεμοθώρακα. Απαγορεύεται η τοποθέτηση ή ανάρτηση μπροστά ή πίσω από τον ανεμοθώρακα, καθώς και η επικόλληση σε αυτόν αντικειμένων που περιορίζουν την ορατότητα του οδηγού. 10. Τα φορτηγά όλων των κατηγοριών, τα λεωφορεία και τα ρυμουλκούμενα φέρουν στους τροχούς του οπίσθιου τελευταίου άξονα λασπωτήρες. 11. Τα αυτοκίνητα οχήματα, εκτός από τα τρίτροχα οχήματα και τις μοτοσικλέτες, είναι εφοδιασμένα με σύστημα κίνησης του οχήματος προς τα πίσω, ο χειρισμός του οποίου γίνεται από τη θέση του οδηγού. 12. Ο κινητήρας εσωτερικής καύσης, ο οποίος χρησιμοποιείται για την προώθηση οδικού οχήματος, είναι εφοδιασμένος με αποτελεσματικό σιγαστήρα, κατάλληλο να μειώνει τον θόρυβο, ο οποίος προκαλείται από την έξοδο των καυσαερίων και τέτοιας κατασκευής, ώστε να μην δύναται να τεθεί εκτός λειτουργίας από τον οδηγό από τη θέση του. 13. Οι τροχοί των μηχανοκίνητων οχημάτων, των ρυμουλκούμενων, των μοτοποδηλάτων και των ποδηλάτων φέρουν ελαστικά με ή χωρίς αεροθάλαμο ή άλλα ελαστικά ανάλογης αποτελεσματικότητας που είναι σε τέτοια κατάσταση, ώστε να εξασφαλίζονται οι συνθήκες ασφάλειας και η πρόσφυση, ακόμη και επί υγρού οδοστρώματος. Τα αυτοκίνητα οχήματα, εκτός των δίτροχων μοτοσικλετών και μοτοποδηλάτων, είναι εφοδιασμένα με έναν (1) εφεδρικό τροχό. Τα επιβατηγά οχήματα, αντί για εφεδρικό τροχό, δύνανται να είναι εφοδιασμένα με κιβώτιο επισκευής ελαστικού ή με ειδικά συστήματα συνέχισης οδήγησης. 14. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα είναι εφοδιασμένα με σύστημα ανάρτησης των τροχών, το οποίο εξασφαλίζει την ελαστική σύνδεση του αμαξώματος του οχήματος με αυτούς και την απόσβεση των ταλαντώσεων. 15. Αυτοκίνητο όχημα, το οποίο μπορεί να υπερβεί την ταχύτητα των σαράντα (40) χιλιομέτρων την ώρα, σε ευθεία οριζόντια οδό, είναι εφοδιασμένο με μετρητή ταχύτητας (ταχόμετρο) που να λειτουργεί σωστά. 16. Τα μηχανοκίνητα οχήματα, εκτός από τις δίτροχες μοτοσικλέτες χωρίς καλάθι, τα τρίτροχα μοτοποδήλατα και τα ρυμουλκούμενα, είναι εφοδιασμένα με την πινακίδα ή την ειδική συσκευή επισήμανσης, σύμφωνα με την παρ. 3 του άρθρου 33, περί κίνησης οχημάτων σε αυτοκινητόδρομους, οδούς ταχείας κυκλοφορίας και σήραγγες, και την παρ. 10 του άρθρου 38, περί στάσης και στάθμευσης. Η πιο πάνω πινακίδα αποτελείται από ισόπλευρο τρίγωνο που έχει πλευρά μήκους όχι μικρότερου των σαράντα εκατοστών (0,40 μ.) και πλάτους όχι μικρότερου των πέντε εκατοστών (0,05 μ.), και το εσωτερικό μέρος του μπορεί να είναι κενό ή χρωματισμένο με ανοικτό χρώμα. Οι πλευρές του τριγώνου αυτού είναι κατασκευασμένες από αντανακλαστική ύλη ερυθρού χρώματος. Η πινακίδα είναι κατασκευασμένη με τρόπο ώστε να μπορεί να τοποθετείται σταθερά σε κατακόρυφη θέση. 17. Τα επιβατηγά αυτοκίνητα οχήματα και τα φορτηγά μέγιστου επιτρεπόμενου βάρους μέχρι και τριών χιλιάδων πεντακοσίων χιλιόγραμμων (3.500 χλγρ.) είναι εφοδιασμένα με ζώνες ασφαλείας στα μπροστινά καθίσματα. 18. Τα αυτοκίνητα οχήματα και τα ρυμουλκούμενα, μέγιστου επιτρεπόμενου βάρους μεγαλύτερου των τριών χιλιάδων πεντακοσίων χιλιόγραμμων (3.500 χλγρ.), είναι εφοδιασμένα με κατάλληλες σφήνες αναστολής κύλισης (τάκοι). 19. Τα ζωήλατα οχήματα, μέγιστου επιτρεπόμενου βάρους μέχρι τριών χιλιάδων χιλιόγραμμων (3.000 χλγρ.), μπορούν να φέρουν μεταλλική στεφάνη στους τροχούς, το πλάτος της οποίας δεν επιτρέπεται να είναι μικρότερο των πέντε εκατοστών (0,05 μ.). Η στεφάνη αυτή είναι συνεχής, κυλινδρική και χωρίς προεξοχές, γωνίες ή διακοπές και δεν στερεώνεται στους τροχούς με καρφιά των οποίων η κεφαλή εξέχει της επιφάνειας της στεφάνης. 20. Τα μηχανήματα έργου και τα αγροτικά μηχανήματα, τα οποία δεν μπορούν να αναπτύξουν ταχύτητα μεγαλύτερη από σαράντα (40) χιλιόμετρα την ώρα σε ευθεία οριζόντια οδό, φέρουν, για την αναγνώρισή τους, στην πίσω πλευρά, ειδική μεταλλική τριγωνική πινακίδα, της οποίας το περίγραμμα φέρει αντανακλαστικό υλικό ερυθρού χρώματος, η δε υπόλοιπη επιφάνεια φθορίζον υλικό επίσης ερυθρού χρώματος. 21. Τα οχήματα, μέγιστου επιτρεπόμενου βάρους επτά χιλιάδων πεντακοσίων χιλιόγραμμων (7.500 χλγρ.) και άνω και τα ρυμουλκούμενα οχήματα μέγιστου επιτρεπόμενου βάρους τριών χιλιάδων χιλιόγραμμων (3.000 χλγρ.) και άνω, φέρουν, για την αναγνώρισή τους, στην οπίσθια πλευρά τους, μία (1) ή δύο (2) μεταλλικές πινακίδες, οι οποίες έχουν εναλλασσόμενες λοξές λωρίδες με φθορίζον υλικό ερυθρού χρώματος και αντανακλαστικό υλικό κίτρινου χρώματος. 22. Τα οχήματα ή οι συνδυασμοί οχημάτων μήκους δεκατριών (13) μέτρων και άνω, φέρουν, για την αναγνώρισή τους, στην οπίσθια πλευρά τους, μία (1) ή δύο (2) πινακίδες, των οποίων η επιφάνεια καλύπτεται με φθορίζον υλικό χρώματος ερυθρού και αντανακλαστικό υλικό χρώματος κίτρινου και επί των οποίων αναγράφονται ειδικά σύμβολα. 23. Τα οχήματα τα οποία μεταφέρουν επικίνδυνα εμπορεύματα φέρουν αναγνωριστικές της επικινδυνότητας του φορτίου πινακίδες και ειδικά σήματα, σύμφωνα με τις ισχύουσες για τις μεταφορές αυτές διατάξεις. 24. Οι παραβάσεις για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί οδικό όχημα, τρίτροχο όχημα, μοτοσικλέτα, μοτοποδήλατο, αγροτικό μηχάνημα ή μηχάνημα έργων, κατατάσσονται ως εξής:\nα) οι παραβάσεις των παρ. 1, 8, 9 και 11, στην κατηγορία Ε1-Β,\nβ) η παράβαση της παρ. 17, στην κατηγορία Ε2-Α,\nγ) οι παραβάσεις των παρ. 2, 3, 4, 5, 6, 7, 10, 14, 15, 16, 18, 19, 20, 21, 22 και 23 στην κατηγορία Ε1-Α,\nδ) η παράβαση της παρ. 13:\nδα) στην κατηγορία Ε2-Β για τρίτροχο όχημα, μοτοσικλέτα, μοτοποδήλατο, επιβατηγό όχημα ιδιωτικής χρήσης ή φορτηγό όχημα έως και τρεισήμισι (3,5) τόνους και\nδβ) στην κατηγορία Ε3-Β για φορτηγό όχημα άνω των τρεισήμισι (3,5) τόνων, λεωφορείο, αγροτικό μηχάνημα ή μηχάνημα έργου. Προκειμένου για φορτηγά οχήματα άνω των τρεισήμισι (3,5) τόνων, λεωφορεία, αγροτικά οχήματα και μηχανήματα έργου, το προβλεπόμενο διοικητικό πρόστιμο επιβάλλεται στον ιδιοκτήτη του οχήματος. 25. Η παράβαση για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί όχημα άλλης κατηγορίας, κατά παράβαση του παρόντος άρθρου ή που δεν είναι εφοδιασμένο με τους προβλεπόμενους στο παρόν άρθρο, κατά περίπτωση, μηχανισμούς, πινακίδες, συσκευές ή συστήματα ή που έχει μηχανισμούς, πινακίδες, συσκευές ή συστήματα, που δεν πληρούν τις απαιτήσεις του παρόντος άρθρου, κατατάσσεται στην κατηγορία Ε1-Α. 26. Κατ’ εξαίρεση των παρ. 24 και 25, η παράβαση της παρ. 12 κατατάσσεται στην κατηγορία Ε2-Α και στην κατηγορία Σ.`},
  87: {title:`Εξωτερική εμφάνιση αυτοκινήτων οχημάτων`,text:`1. Σε περίπτωση μεταβολής του εξωτερικού χρωματισμού που αναγράφεται στην άδεια κυκλοφορίας του αμαξώματος αυτοκινήτου οχήματος, ο κάτοχος αυτού, μέσα σε δεκαπέντε (15) ημέρες από τη μεταβολή, γνωστοποιεί αυτό στην αρμόδια υπηρεσία του Υπουργείου Υποδομών και Μεταφορών.\n2. Η αναγραφή ή τοποθέτηση διαφημίσεων στο εσωτερικό ή εξωτερικό του αμαξώματος αυτοκινήτων οχημάτων, τα οποία εκτελούν δημόσια συγκοινωνία, επιτρέπεται εφόσον δεν ανατρέπεται ο ομοιόμορφος χρωματισμός που χαρακτηρίζει το δημόσιο μέσο μεταφοράς.\n3. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε1-Α. KEΦAΛAIO Ζ’ ΤΑΞΙΝΟΜΗΣΗ, ΑΠΟΓΡΑΦΗ ΚΑΙ ΘΕΣΗ ΟΧΗΜΑΤΩΝ ΣΕ ΚΥΚΛΟΦΟΡΙΑ`},
  89: {title:`Στοιχεία αναγνώρισης πλαισίου και κινητήρα`,text:`1. Στο πλαίσιο ή το αμάξωμα των αυτοκινήτων οχημάτων και των υπ’ αυτών ρυμουλκούμενων και των τρίτροχων οχημάτων και μοτοσικλετών, σημειώνονται το όνομα του κατασκευαστή, τα στοιχεία τα οποία χαρακτηρίζουν τον τύπο του οχήματος και ο αύξων αριθμός κατασκευής του. Στον κινητήρα των οχημάτων του προηγούμενου εδαφίου, σημειώνονται τα στοιχεία που χαρακτηρίζουν τον τύπο αυτού και ο αριθμός σειράς κατασκευής του.\n2. Πριν από την αντικατάσταση ή επιδιόρθωση τμήματος του αμαξώματος ή του πλαισίου των αυτοκινήτων, των τρίτροχων οχημάτων και των μοτοσικλετών, η οποία έχει ως αποτέλεσμα την εξαφάνιση ή την αλλοίωση, ολικά ή μερικά, του τύπου και του αριθμού πλαισίου, οι κάτοχοι αυτών ενημερώνουν, πριν από την επέμβαση, τις κατά τόπους αρμόδιες υπηρεσίες της αποκεντρωμένης διοίκησης, οι οποίες προβαίνουν στη χάραξη του αριθμού κυκλοφορίας ή του αριθμού πλαισίου σε άλλη κατάλληλη θέση.\n3. Η παράβαση για τον κάτοχο οχήματος των κατηγοριών του παρόντος, ο οποίος παραποιεί ή εξαφανίζει τα αναφερόμενα στην παρ. 1 στοιχεία αναγνώρισης του οχήματος, καθώς και αυτόν που ενεργεί την παραποίηση ή αλλοίωση, κατατάσσεται στην κατηγορία Ε3-Β και τιμωρείται με ποινή φυλάκισης μέχρι ενός (1) έτους και με οριστική αφαίρεση των στοιχείων κυκλοφορίας του οχήματος, η οποία επιβάλλεται από το δικαστήριο.\n4. Η παράβαση για τον κάτοχο οχήματος των κατηγοριών του παρόντος και αυτόν που ενεργεί την αντικατάσταση ή επιδιόρθωση της παρ. 2, χωρίς να τηρηθεί η σε αυτή προβλεπόμενη διαδικασία, κατατάσσεται στην κατηγορία Ε3-Β και τιμωρείται με φυλάκιση μέχρι ενός (1) έτους και με αφαίρεση των στοιχείων κυκλοφορίας του οχήματος για χρονικό διάστημα ενός (1) έως τριών (3) μηνών, η οποία επιβάλλεται από το δικαστήριο.`},
  90: {title:`Τεχνικός έλεγχος οχημάτων`,text:`1. Τα αυτοκίνητα οχήματα, τρίτροχα οχήματα, μοτοσικλέτες και μοτοποδήλατα, τα οποία κυκλοφορούν στη χώρα, και τα υπ’ αυτών ρυμουλκούμενα, υπόκεινται σε τακτικό περιοδικό τεχνικό έλεγχο.\n2. Εάν για οδικό όχημα ή ρυμουλκούμενο της παρ. 1, δημιουργούνται αμφιβολίες για την ασφαλή και κανονική γενικά κυκλοφορία του στις οδούς, οι Αστυνομικές Αρχές και οι υπηρεσίες που είναι εξουσιοδοτημένες από τους αρμόδιους υπουργούς ή περιφερειάρχες μπορούν να διατάσσουν τον έκτακτο τεχνικό έλεγχο αυτού.\n3. Η παράβαση για τον οδηγό ή τον κάτοχο επιβατικού δημοσίας χρήσης, ασθενοφόρου, φορτηγού και ρυμουλκούμενου άνω των τρεισήμισι (3,5) τόνων και λεωφορείου που δεν το προσκομίζει για τον τακτικό ή έκτακτο τεχνικό έλεγχο εντός της καθοριζόμενης προθεσμίας ή παραβαίνει την παρ. 1 του άρθρου 5 του ν. 1350/1983 (Α’ 55), περί απαγόρευσης κυκλοφορίας οδικών οχημάτων όταν αυτά δεν έχουν εφοδιαστεί με πιστοποιητικό τεχνικού ελέγχου, κατατάσσεται στην κατηγορία Ε3-Β. Η ίδια παράβαση για τα υπόλοιπα οχήματα κατατάσσεται στην κατηγορία Ε2-Β.\n4. Το προβλεπόμενο στην παρ. 3 διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης επιβάλλεται μόνο στον οδηγό. Το διοικητικό πρόστιμο και το διοικητικό μέτρο της αφαίρεσης των στοιχείων κυκλοφορίας, όπου προβλέπεται, επιβάλλονται στον ιδιοκτήτη του οχήματος. 5.α. Όλα τα μηχανήματα έργου υπόκεινται σε περιοδικό έλεγχο τεχνικής επάρκειας κάθε πέντε (5) έτη, μετά την έκδοση αρχικής άδειας μηχανημάτων έργου. β. Το αντικείμενο του περιοδικού ελέγχου τεχνικής επάρκειας μηχανημάτων έργου αφορά σε θέματα ασφάλειας λειτουργίας και κυκλοφορίας του μηχανήματος έργου. γ. Ο περιοδικός έλεγχος τεχνικής επάρκειας των μηχανημάτων έργου διενεργείται από Φορείς Ελέγχου (Φ.Ε.) οι οποίοι έχουν εγκριθεί από το Υπουργείο Ανάπτυξης, σύμφωνα με τη διαδικασία της υπ’ αρ. 3354/91/8.2.2001 απόφασης του Υφυπουργού Ανάπτυξης «Καθορισμός πλαισίου για την αναγνώριση της ικανότητας και την έγκριση φορέων πιστοποίησης ή ελέγχου στον υποχρεωτικό τομέα» (Β’ 149), όπως εκάστοτε ισχύει και είναι διαπιστευμένοι για τον σκοπό αυτόν, σύμφωνα με το πρότυπο «ISO ΕΝ 17020», όπως κάθε φορά ισχύει. Τα πρόσωπα του Φ.Ε. που διενεργούν περιοδικούς ελέγχους τεχνικής επάρκειας μηχανημάτων έργου είναι μηχανικοί τριτοβάθμιας εκπαίδευσης. δ. Οι κυρώσεις των παρ. 3 και 4 εφαρμόζονται αναλογικά και για τα μηχανήματα έργου. ε. Για την «Οριστική Διαγραφή» και «Προσωρινή Διαγραφή» μηχανήματος έργου και οχήματος ειδικής κατηγορίας από το μητρώο μηχανημάτων έργου και οχημάτων ειδικής κατηγορίας, όπως καθορίζεται στην υπό στοιχεία οικ. 21867/26.9.2016 κοινή απόφαση των Υπουργών Οικονομικών και Υποδομών, Μεταφορών και Δικτύων «Όροι, προϋποθέσεις και διαδικασίες εγκρίσεων τύπου και αδειών κυκλοφορίας που αφορούν τα Μηχανήματα Έργων (Μ.Ε.) και τα οχήματα ειδικής κατηγορίας» ( Β’ 3276), όπως εκάστοτε ισχύει, που δεν εξαιρούνται από την καταβολή τελών χρήσης, αρκεί η προσκόμιση βεβαίωσης της αρμόδιας υπηρεσίας της Φορολογικής Διοίκησης ότι τα υπόψη τέλη είναι βεβαιωμένα και εξοφλημένα για τα προηγούμενα έτη και κατ’ ανώτατο για τα τελευταία δέκα (10) έτη από την ημερομηνία διαγραφής, όπως ορίζεται στην ανωτέρω κοινή υπουργική απόφαση. Η προσκόμιση της βεβαίωσης του προηγούμενου εδαφίου δεν επηρεάζει τις οφειλές από τέλη πέραν του άνω χρονικού διαστήματος.`},
  91: {title:`Γενική απογραφή και ταξινόμηση οχημάτων`,text:`1. Δεν επιτρέπεται σε κανένα μηχανοκίνητο όχημα ή ρυμουλκούμενο να κυκλοφορεί οπουδήποτε στη χώρα, εάν δεν έχει απογραφεί και ταξινομηθεί κατά την οριζόμενη εκάστοτε γενική απογραφή και ταξινόμηση των οχημάτων.\n2. Η παράβαση για αυτόν που κυκλοφορεί μηχανοκίνητο όχημα, το οποίο δεν έχει νόμιμα απογραφεί και ταξινομηθεί, κατατάσσεται στην κατηγορία Ε3-Β και τα στοιχεία κυκλοφορίας του οχήματός του επιστρέφονται μετά την απογραφή του. Για τη σχετική παράβαση που αφορά σε φορτηγά οχήματα εφαρμόζεται ο ν. 3446/2006 (Α’ 49), περί οργάνωσης και λειτουργίας αρχών ελέγχου κυκλοφορίας των οχημάτων. Το άρθρο 50, περί ακινητοποίησης οχήματος, μπορεί να εφαρμοστεί και στην περίπτωση του παρόντος.`},
  92: {title:`Άδεια κυκλοφορίας οχημάτων`,text:`1. Δεν επιτρέπεται μηχανοκίνητο όχημα, ρυμουλκούμενο, μοτοποδήλατο, ή ζωήλατο όχημα να κυκλοφορεί οπουδήποτε στη ώρα, αν δεν έχει εκδοθεί γι’ αυτό άδεια κυκλοφορίας.\n2. Η παράβαση για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί αυτοκίνητο όχημα ή ρυμουλκούμενο από αυτό, καθώς και τρίτροχο όχημα ή μοτοσικλέτα, που δεν είναι εφοδιασμένο με άδεια κυκλοφορίας ή του οποίου η άδεια κυκλοφορίας έχει αφαιρεθεί κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ, η επί τόπου αφαίρεση για τριάντα (30) ημέρες της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος. Εφόσον αυτά υπάρχουν και έχουν αφαιρεθεί, το χρονικό διάστημα αφαίρεσής τους προστίθεται στο ήδη επιβαλλόμενο χρονικό διάστημα αφαίρεσής τους. Για τη σχετική παράβαση που αφορά φορτηγά οχήματα έχουν εφαρμογή οι ειδικές διατάξεις του ν. 3446/2006 (Α’ 49).\n3. Η παράβαση για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί αγροτικό μηχάνημα με ή χωρίς ρυμουλκούμενο ή μηχάνημα έργου με ή χωρίς ρυμουλκούμενο, που δεν είναι εφοδιασμένο με άδεια κυκλοφορίας ή του οποίου η άδεια κυκλοφορίας έχει αφαιρεθεί κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ, η επί τόπου αφαίρεση για τριάντα (30) ημέρες της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος. Εφόσον αυτά υπάρχουν και έχουν αφαιρεθεί, το χρονικό διάστημα αφαίρεσής τους προστίθεται στο ήδη επιβαλλόμενο χρονικό διάστημα αφαίρεσής τους.\n4. Η παράβαση για αυτόν που θέτει σε κυκλοφορία, καθώς και αυτόν που οδηγεί μοτοποδήλατο που δεν είναι εφοδιασμένο με άδεια κυκλοφορίας ή του οποίου η άδεια κυκλοφορίας έχει αφαιρεθεί ή έχει λήξει, κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ, η επί τόπου αφαίρεση για τριάντα (30) ημέρες της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος. Εφόσον αυτά υπάρχουν και έχουν αφαιρεθεί, το χρονικό διάστημα αφαίρεσής τους προστίθεται στο ήδη επιβαλλόμενο χρονικό διάστημα αφαίρεσής τους. Η παράβαση για αυτόν που θέτει σε κυκλοφορία και αυτόν που οδηγεί ζωήλατο όχημα, που δεν είναι εφοδιασμένο με άδεια κυκλοφορίας, κατατάσσεται στην κατηγορία Ε2-Α.`},
  93: {title:`Μεταβολή στοιχείων της αδείας κυκλοφορίας`,text:`1. Κατά την αλλαγή κατόχου οδικού οχήματος και κατά τη μεταβολή των αναγραφόμενων κύριων χαρακτηριστικών στοιχείων στην άδεια κυκλοφορίας, όταν αυτά επιτρέπονται, απαιτείται η έκδοση νέας άδειας, μετά από εξακρίβωση των νέων στοιχείων, από τις κατά περίπτωση αρμόδιες για την έκδοση των αδειών κυκλοφορίας υπηρεσίες.\n2. Αν διαπιστωθεί από αρμόδιο όργανο ότι δεν τηρήθηκε η παρ. 1, μέσα στην προθεσμία που καθορίζεται στην απόφαση της περ. γ) της παρ. 27 του άρθρου 112, αφαιρούνται η άδεια και οι πινακίδες αριθμού κυκλοφορίας του οχήματος, οι οποίες επιστρέφονται μετά από την έκδοση νέας άδειας, σύμφωνα με την παρ. 1. 3. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε3-Β. Για τη σχετική παράβαση που αφορά σε φορτηγά οχήματα έχουν εφαρμογή οι ειδικές διατάξεις του ν. 3446/2006 (Α’ 49).`},
  94: {title:`Πινακίδες αριθμού κυκλοφορίας`,text:`1. Δεν επιτρέπεται μηχανοκίνητο όχημα, ρυμουλκούμενο, μοτοποδήλατο, ή ζωήλατο όχημα να κυκλοφορεί οπουδήποτε στη χώρα, αν δεν φέρει τις πινακίδες αριθμού κυκλοφορίας, οι οποίες χορηγήθηκαν νόμιμα. Οι χορηγούμενες πινακίδες είναι αντανακλαστικές.\n2. Απαγορεύεται για οποιαδήποτε αιτία η αντικατάσταση των πινακίδων, που καθορίζονται στην παρ. 1 με άλλες που δεν έχουν χορηγηθεί νόμιμα ή η παραποίηση αυτών με οποιαδήποτε μορφή, όπως με τεμαχισμό, αλλαγή σχήματος ή γράμματος ή με κάμψη της πινακίδας, ή η μετάθεση της πινακίδας από το ένα όχημα σε άλλο ή η κατασκευή από άλλον πλην του κατά τις διατάξεις του παρόντος οριζομένου και με τρόπο διάφορο, καθώς και η πώληση, αγορά και χρήση τέτοιων πινακίδων. Οι παραβάτες της παρούσας και αυτοί που υποβάλλουν ψευδή στοιχεία για τη λήψη ανταλλακτικών πινακίδων, έχοντας ως σκοπό την παράνομη χρησιμοποίησή τους, τιμωρούνται με φυλάκιση μέχρι ενός (1) έτους.\n3. Η παράβαση για αυτόν που θέτει σε κυκλοφορία αυτοκίνητο όχημα, το οποίο δεν έχει τοποθετημένες και τις δύο (2) πινακίδες αριθμού κυκλοφορίας, οι οποίες έχουν νόμιμα χορηγηθεί, καθώς και για εκείνον, ο οποίος κυκλοφορεί άλλης κατηγορίας όχημα, που δεν είναι εφοδιασμένο με κανονικές πινακίδες αριθμού κυκλοφορίας, κατατάσσεται στην κατηγορία Ε3-Β. Στην ίδια κατηγορία κατατάσσεται και η παράβαση για αυτόν που οδηγεί οδικό όχημα του οποίου οι πινακίδες δεν είναι, για οποιονδήποτε λόγο, ευκρινώς ορατές ή αναγνωρίσιμες από τεχνικά μέσα βεβαίωσης παραβάσεων ή τοποθετεί επ’ αυτών μη αντανακλαστικό υλικό. Για τη σχετική παράβαση που αφορά φορτηγά οχήματα έχουν εφαρμογή οι ειδικές διατάξεις του ν. 3446/2006 (Α’ 49). Επιπλέον των διοικητικών κυρώσεων της παρούσας, όποιος καταλαμβάνεται να θέτει σε κυκλοφορία όχημα οι πινακίδες του οποίου έχουν αφαιρεθεί για παραβάσεις του παρόντος νόμου τιμωρείται με ποινή φυλάκισης έως ενός (1) έτους και χρηματική ποινή τουλάχιστον δύο χιλιάδων (2.000) ευρώ, εφόσον η πράξη δεν τιμωρείται βαρύτερα με άλλη διάταξη.`},
  97: {title:`Παύση κυκλοφορίας οχήματος`,text:`1. Όταν μηχανοκίνητο όχημα ή ρυμουλκούμενο, τρίτροχο όχημα, μοτοσικλέτα, που έχει απογραφεί, καταστρέφεται, διαλύεται ή εξάγεται οριστικά στην αλλοδαπή, ο κάτοχός του, μέσα σε δύο (2) μήνες, από τον χρόνο της καταστροφής, διάλυσης ή εξαγωγής, υποβάλλει σχετική δήλωση στην αρμόδια υπηρεσία της οικείας αποκεντρωμένης διοίκησης και παραδίδει σε αυτήν την άδεια και τις πινακίδες αριθμού κυκλοφορίας του οχήματος.\n2. Οι κάτοχοι αγροτικών μηχανημάτων ή μηχανημάτων έργου που έχουν απογραφεί, στις περιπτώσεις της παρ. 1, υποχρεούνται να παραδώσουν την άδεια κυκλοφορίας και τις πινακίδες των οχημάτων αυτών στην αρμόδια υπηρεσία του Υπουργείου Αγροτικής Ανάπτυξης και Τροφίμων ή του Υπουργείου Περιβάλλοντος και Ενέργειας, κατά περίπτωση.\n3. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε1-Α. KEΦAΛAIO Η’ ΙΚΑΝΟΤΗΤΑ ΟΔΗΓΗΣΗΣ - ΕΓΓΡΑΦΑ ΑΠΟΔΕΙΞΗΣ ΙΚΑΝΟΤΗΤΑΣ - ΕΙΔΙΚΗ ΣΗΜΑΝΣΗ`},
  98: {title:`Άδειες οδήγησης - Κυρώσεις - Άδειες εκπαιδευτών υποψήφιων οδηγών`,text:`1. Για την οδήγηση μοτοποδηλάτων και ελαφρών τετρακύκλων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και αυτοκινήτων απαιτείται η κατοχή της κατάλληλης κατηγορίας άδειας οδήγησης. Οι κατηγορίες των αδειών οδήγησης, η κλιμάκωση και η ισοδυναμία μεταξύ των κατηγοριών, καθώς και η χορήγηση, η ανανέωση και η αμοιβαία αναγνώριση και ανταλλαγή αυτών ορίζονται στο π.δ. 51/2012 (Α’ 101).\n2. Απαγορεύεται η οδήγηση μοτοποδηλάτων και ελαφρών τετρακύκλων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και αυτοκινήτων:\nα) από πρόσωπα τα οποία δεν κατέχουν ισχύουσα ελληνική άδεια οδήγησης της κατάλληλης κατηγορίας. Η απαγόρευση αυτή δεν ισχύει για τα πρόσωπα, τα οποία εκπαιδεύονται ή εξετάζονται προκειμένου να αποκτήσουν ή ανανεώσουν συγκεκριμένης κατηγορίας άδεια οδήγησης, εφόσον είναι εφοδιασμένα με τα προβλεπόμενα έγγραφα για τον σκοπό αυτόν,\nβ) από πρόσωπα τα οποία δεν κατέχουν ισχύουσα ελληνική ειδική άδεια ή ισχύον ελληνικό πιστοποιητικό, τα οποία απαιτούνται για την οδήγηση ειδικών κατηγοριών οδικών οχημάτων, ακόμα και εάν κατέχουν την άδεια οδήγησης της περ. α),\nγ) ειδικά για τα μοτοποδήλατα με μέγιστη εκ κατασκευής ανώτατη ταχύτητα έως είκοσι πέντε (25) χιλιόμετρα την ώρα, από πρόσωπα που δεν έχουν συμπληρώσει την ηλικία των δεκαπέντε (15) ετών.\nδ) από πρόσωπα των οποίων έχει παύσει αυτοδικαίως να ισχύει η άδεια οδήγησης λόγω παύσης πλήρωσης των απαιτούμενων προδιαγραφών σωματικής και διανοητικής ικανότητας υπό τις οποίες τους χορηγήθηκε, όπως οι προδιαγραφές αυτές ορίζονται στο Παράρτημα ΙΙΙ του π.δ. 51/2012.\n3. Δεν υπάγονται στις απαγορεύσεις της περ. α) της παρ. 2 και εφόσον έχουν συμπληρώσει την ελάχιστη απαιτούμενη ηλικία που προβλέπεται για τη χορήγηση ελληνικής άδειας οδήγησης:\nα) οι κάτοχοι ισχύουσας άδειας οδήγησης, αντίστοιχης κατηγορίας, η οποία έχει εκδοθεί από κράτος μέλος της Ευρωπαϊκής Ένωσης ή από τη Νορβηγία, την Ισλανδία ή το Λιχτενστάιν,\nβ) οι κάτοχοι ισχύουσας διεθνούς άδειας οδήγησης η οποία έχει εκδοθεί από οποιοδήποτε κράτος, εκτός της Ελλάδος, και δεν έχουν τη συνήθη διαμονή τους στην Ελλάδα,\nγ) οι κάτοχοι ισχύουσας άδειας οδήγησης, η οποία έχει εκδοθεί από κράτη εκτός της Ευρωπαϊκής Ένωσης, με τα οποία η Ελλάδα έχει συνάψει ειδική συμφωνία, η οποία έχει κυρωθεί με νόμο και οι οποίοι δεν έχουν τη συνήθη διαμονή τους στην Ελλάδα,\nδ) οι κάτοχοι ισχύουσας άδειας οδήγησης κατά τα οριζόμενα σε διεθνείς συμβάσεις ή συμφωνίες που έχουν κυρωθεί με νόμο και οι οποίοι δεν έχουν τη συνήθη διαμονή τους στην Ελλάδα,\nε) οι οδηγοί μοτοποδηλάτων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και αυτοκινήτων, τα οποία ανήκουν στις ελληνικές ένοπλες δυνάμεις ή στα σώματα ασφαλείας, εφόσον είναι κάτοχοι ισχύουσας άδειας οδήγησης που έχει εκδοθεί από τις αρμόδιες υπηρεσίες τους,\nστ) τα μέλη διπλωματικών αποστολών και προξενικών αρχών, τα μέλη Διεθνών Οργανισμών και Γραφείων Διεθνών Οργανισμών στην Ελλάδα και τα μέλη των οικογενειών τους, υπήκοοι τρίτων χωρών, πλην των κρατών μελών της Ευρωπαϊκής Ένωσης, της Νορβηγίας, της Ισλανδίας ή του Λιχτενστάιν, καθώς και κάτοχοι δελτίου ταυτότητας εκδοθέντος από τη Διεύθυνση Εθιμοτυπίας του Υπουργείου Εξωτερικών, εφόσον κατέχουν ισχύουσα άδεια οδήγησης της χώρας τους, υπό την προϋπόθεση ότι αυτή συνοδεύεται από βεβαίωση της εκδούσας αρχής, για το δικαίωμα οδήγησης οχήματος βάσει των κατηγοριών που κατέχουν, επίσημα μεταφρασμένη,\nζ) οι κάτοχοι ισχύουσας άδειας οδήγησης μοτοποδηλάτων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και επιβατικών αυτοκινήτων που δεν έχουν τη συνήθη διαμονή τους στην Ελλάδα και η οποία έχει εκδοθεί από κράτος στο οποίο δεν εκδίδεται διεθνής άδεια οδήγησης. Προς τούτο, απαιτείται η εθνική άδεια των αντίστοιχων κατηγοριών να συνοδεύεται από επίσημη μετάφρασή της στην ελληνική ή την αγγλική γλώσσα,\nη) οι κάτοχοι ισχύουσας άδειας οδήγησης μοτοποδηλάτων, μοτοσικλετών, μηχανοκίνητων τρικύκλων, τετρακύκλων και επιβατικών αυτοκινήτων, κατά τη διαμονή τους στην Ελλάδα, η οποία έχει εκδοθεί από τις Ηνωμένες Πολιτείες Αμερικής, τον Καναδά, την Κοινοπολιτεία της Αυστραλίας, το Ηνωμένο Βασίλειο της Μεγάλης Βρετανίας και της Βόρειας Ιρλανδίας, τα εξαρτώμενα εδάφη του Βρετανικού Στέμματος (Γκέρνσεϊ, Νήσος Μαν και Τζέρσεϋ) ή το Γιβραλτάρ. 4.α) Η παράβαση για αυτόν που καταλαμβάνεται να οδηγεί και στερείται ή δεν κατέχει την κατάλληλη άδεια οδήγησης, σύμφωνα με τους όρους και τις προϋποθέσεις του π.δ. 51/2012 ή η άδεια οδήγησής του έχει ανακληθεί ή αφαιρεθεί για οποιονδήποτε λόγο, κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται η επί τόπου αφαίρεση της άδειας οδήγησης για ένα (1) έτος, εφόσον υπάρχει και των στοιχείων κυκλοφορίας του οχήματος, για τριάντα (30) ημέρες καθώς και οι ακόλουθες διοικητικές κυρώσεις, ανά περίπτωση:\nαα) για μοτοποδήλατα, μοτοσικλέτες, μηχανοκίνητα τρίκυκλα, ελαφρά τετράκυκλα ή τετράκυκλα, επιβάλλεται διοικητικό πρόστιμο πεντακοσίων (500) ευρώ,\nαβ) για επιβατηγά αυτοκίνητα ιδιωτικής χρήσης, επιβάλλεται διοικητικό πρόστιμο επτακοσίων (700) ευρώ,\nαγ) για επιβατηγά αυτοκίνητα δημόσιας χρήσης και λεωφορεία, επιβάλλεται διοικητικό πρόστιμο χιλίων (1.000) ευρώ, επιπλέον των κυρώσεων του ν. 4070/2012 (Α’ 82),\nαδ) για φορτηγά επιβάλλονται τα διοικητικά πρόστιμα και οι κυρώσεις του ν. 3446/2006 (Α’ 49) στα πρόσωπα που ορίζονται με τις διατάξεις του νόμου αυτού.\nβ) Επιπλέον των διοικητικών κυρώσεων της περ. α), αυτός που καταλαμβάνεται να οδηγεί όχημα, ενώ η άδεια οδήγησής του έχει αφαιρεθεί για παραβάσεις του παρόντος νόμου τιμωρείται με ποινή φυλάκισης έως ενός (1) έτους και με χρηματική ποινή τουλάχιστον δύο χιλιάδων (2.000) ευρώ.\nγ) Όποιος οδηγεί και στερείται ή δεν κατέχει την κατάλληλη άδεια οδήγησης, σύμφωνα με τους όρους και τις προϋποθέσεις του π.δ. 51/2012 ή η άδεια οδήγησής του έχει ανακληθεί ή αφαιρεθεί σύμφωνα με την περ. γ) της παρ. 7 και την παρ. 8 του άρθρου 46, την περ. α) της παρούσας και τις παρ. 3 και 4 του άρθρου 100, τα άρθρα 101 και 110 εάν γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε βαριά σωματική βλάβη ή σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων τιμωρείται με τις ποινές των περ. γγ) και\nδδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί επικίνδυνης οδήγησης. 5. Δικαίωμα συμμετοχής στις εξετάσεις για τη χορήγηση (αρχικής) άδειας οδήγησης σύμφωνα με την παρ. 1, έχει ο παραβάτης, μετά από το πέρας του χρονικού διαστήματος από την ημερομηνία που καταλήφθηκε να οδηγεί χωρίς άδεια, με την προσκόμιση του αποδεικτικού καταβολής του διοικητικού προστίμου. 6. Η παράβαση για αυτόν που καταλαμβάνεται να οδηγεί αυτοκίνητο φορτηγό ή λεωφορείο χωρίς να κατέχει το κατάλληλο Πιστοποιητικό Επαγγελματικής Ικανότητας σύμφωνα με το π.δ. 74/2008 (Α’ 112), κατατάσσεται στην κατηγορία Ε3-Β. 7. Για οδήγηση οχημάτων σε χώρα όπου δεν αναγνωρίζεται η ελληνική άδεια οδήγησης απαιτείται η κατοχή της κατάλληλης κατηγορίας διεθνούς άδειας οδήγησης, σύμφωνα με διεθνείς συμβάσεις ή συμφωνίες που έχουν κυρωθεί με νόμο. Η διεθνής άδεια οδήγησης εκδίδεται στην Ελλάδα από τους εθνικούς εκπροσώπους των διεθνών αυτοκινητιστικών ενώσεων.`},
  99: {title:`Ισχύς αδειών οδήγησης`,text:`1. Η ισχύς των αδειών οδήγησης ορίζεται στο π.δ. 51/2012 (Α’ 101).\n2. Η παράβαση για αυτόν που καταλαμβάνεται να οδηγεί μοτοποδήλατο, μοτοσικλέτα, μηχανοκίνητο τρίκυκλο, ελαφρύ τετράκυκλο, τετράκυκλο και αυτοκίνητο, ενώ το έντυπο της άδειας οδήγησης ή η αντίστοιχη κατηγορία άδειας οδήγησης έχει λήξει, κατατάσσεται στην κατηγορία Ε2-Α. Παράλληλα, αφαιρείται από αρμόδιο όργανο ελέγχου το έντυπο της άδειας οδήγησής του και αποστέλλεται στην αρμόδια υπηρεσία Μεταφορών και Επικοινωνιών της Περιφέρειας που το χορήγησε ή σε αυτή, στην περιοχή της οποίας θα δηλώσει ο κάτοχός της ότι κατοικεί. Νέο έντυπο άδειας οδήγησης εκδίδεται μετά από την ανανέωσή της. Για τη σχετική παράβαση που αφορά φορτηγά οχήματα έχουν εφαρμογή οι ειδικές διατάξεις του ν. 3446/2006 (Α’ 49). Για τη σχετική παράβαση που αφορά στην ειδική άδεια οδήγησης οδηγού επιβατικού δημοσίας χρήσης αυτοκινήτου έχουν εφαρμογή οι ειδικές διατάξεις του ν. 4070/2012 (Α’ 82).\n3. Η παράβαση για αυτόν που καταλαμβάνεται να οδηγεί αυτοκίνητο φορτηγό ή λεωφορείο ενώ έχει λήξει το Πιστοποιητικό Επαγγελματικής Ικανότητας, σύμφωνα με το π.δ. 74/2008 (Α’ 112), κατατάσσεται στην κατηγορία Ε3-Α. Παράλληλα, αφαιρείται από αρμόδιο όργανο ελέγχου, το έντυπο της άδειας οδήγησής του και αποστέλλεται στην αρμόδια Υπηρεσία Μεταφορών και Επικοινωνιών της Περιφέρειας που τη χορήγησε ή σε αυτή, στην περιοχή της οποίας δηλώνει ο κάτοχός της ότι κατοικεί. Νέο έντυπο άδειας οδήγησης εκδίδεται μετά από την ανανέωση του Π.Ε.Ι..`},
  100: {title:`Άδειες οδήγησης αγροτικών μηχανημάτων και μηχανημάτων έργου`,text:`1. Δεν επιτρέπεται σε κανέναν να οδηγεί αγροτικό μηχάνημα ή μηχάνημα έργου αν δεν έχει την κατά νόμο άδεια οδήγησης ή όταν η άδεια αυτή έχει αφαιρεθεί.\n2. Κατ’ εξαίρεση της παρ. 1, οχήματα ειδικής κατηγορίας που έχουν χαρακτηριστεί ως ειδικοί ελκυστήρες ή ως μηχανήματα έργου - μετατοπιστικά βαρέων αντικειμένων και κυκλοφορούν αποκλειστικά εντός εγκαταστάσεων λιμένων ή αερολιμένων δύναται να οδηγούνται από οδηγούς κατόχους αδειών οδήγησης κατηγορίας CE, σύμφωνα με το π.δ. 51/2012 (Α’ 101) ή από οδηγούς κατόχους αδειών οδήγησης μηχανημάτων έργου.\n3. Η παράβαση για αυτόν που οδηγεί αγροτικό μηχάνημα ή μηχάνημα έργου χωρίς να έχει την απαιτούμενη άδεια οδήγησης ή όταν αυτή έχει ανακληθεί, αφαιρεθεί ή έχει λήξει, κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ, η επί τόπου αφαίρεση της άδειας οδήγησης για ένα (1) έτος, εφόσον υπάρχει και των στοιχείων κυκλοφορίας του οχήματος, για τριάντα (30) ημέρες. Επιπλέον των ανωτέρω διοικητικών κυρώσεων, εκείνος που οδηγεί όχημα του προηγούμενου εδαφίου ενώ η άδεια οδήγησής του έχει αφαιρεθεί, για παραβάσεις του παρόντος νόμου τιμωρείται με ποινή φυλάκισης έως ενός (1) έτους και χρηματική ποινή τουλάχιστον δύο χιλιάδων (2.000) ευρώ.\n4. Όποιος οδηγεί αγροτικό μηχάνημα ή μηχάνημα έργου χωρίς να έχει την απαιτούμενη άδεια οδήγησης ή όταν αυτή έχει λήξει ή ανακληθεί ή αφαιρεθεί σύμφωνα με την περ. γ) της παρ. 7 και την παρ. 8 του άρθρου 46, την περ. α) της παρ. 4 του άρθρου 98 και την παρούσα, τα άρθρα 101 και 110 εάν γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε βαριά σωματική βλάβη ή σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων επιβάλλονται οι ποινές των περ. γγ) και\nδδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί επικίνδυνης οδήγησης.\n5. Δικαίωμα συμμετοχής στις εξετάσεις για τη χορήγηση (αρχικής) άδειας οδήγησης σύμφωνα με την παρ. 1, έχει ο παραβάτης, μετά από το πέρας του χρονικού διαστήματος από την ημερομηνία που καταλήφθηκε να οδηγεί χωρίς άδεια, μόνο με την προσκόμιση του αποδεικτικού καταβολής του διοικητικού προστίμου.`},
  101: {title:`Ειδικές περιπτώσεις αφαίρεσης άδειας οδήγησης`,text:`1. Αν για τη διάπραξη κακουργήματος ή εκ δόλου πλημμελήματος χρησιμοποιήθηκε οδικό όχημα ως μέσο για τη τέλεση αυτού, αφαιρούνται, με απόφαση δικαστηρίου, η άδεια και οι πινακίδες κυκλοφορίας του οχήματος, καθώς επίσης και η άδεια οδήγησης του οδηγού που οδηγούσε το πιο πάνω όχημα, για χρονικό διάστημα ενός (1) μέχρι δέκα (10) ετών, εφόσον η επιβαλλόμενη ποινή είναι φυλάκιση τριών (3) τουλάχιστον μηνών.\n2. Αυτός που καταλαμβάνεται να κατέχει πλαστή ή παραποιημένη άδεια οδήγησης ή να κάνει χρήση αυτής, τιμωρείται με τις ποινές του άρθρου 216 του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί πλαστογραφίας.\n3. Η άδεια οδήγησης οδικού οχήματος αφαιρείται με δικαστική απόφαση, αν από τις γενόμενες ανακρίσεις αποδειχθεί ότι ο κάτοχός της έγινε υπαίτιος τραυματισμού ή θανάτου με το όχημα που οδηγούσε, παραβαίνοντας διατάξεις του παρόντος. Ειδικότερα τα πιο πάνω αναφερόμενα στοιχεία αφαιρούνται ως εξής.\nα) Για χρονικό διάστημα τουλάχιστον τριών (3) μηνών και μέχρι δύο (2) ετών, αν από το τροχαίο ατύχημα προκλήθηκε σοβαρός τραυματισμός επιβαινόντων σε οποιοδήποτε όχημα ή πεζού.\nβ) Για χρονικό διάστημα τουλάχιστον δύο (2) ετών και μέχρι πέντε (5) ετών, εάν επήλθε θάνατος κατά την πρό κληση του ατυχήματος, συμπεριλαμβανομένων και των περιπτώσεων που ο θάνατος επήλθε σε χρόνο μεταγενέστερο του ατυχήματος και συνδέεται αιτιωδώς με αυτό. Στην περίπτωση αυτή η επαναχορήγηση της άδειας γίνεται μόνο μετά από επιτυχή θεωρητική και πρακτική εξέταση και εφόσον ο υπαίτιος οδηγός παρακολουθήσει το ισχύον πρόγραμμα θεωρητικής και πρακτικής εκπαίδευσης υποψήφιων οδηγών σύμφωνα με το π.δ. 51/2012 (Α’ 101).\nγ) Σε περίπτωση υποτροπής, τα παραπάνω στοιχεία αφαιρούνται, με δικαστική απόφαση, τουλάχιστον για διπλάσιο χρονικό διάστημα από τα προβλεπόμενα στις περ. α) και β). Το δικαστήριο δύναται σε αυτή την περίπτωση να επιβάλλει και την ποινή της οριστικής αφαίρεσης της άδειας οδήγησης.\n4. Αυτός που καταλαμβάνεται να οδηγεί οδικό όχημα χωρίς τη νόμιμη άδεια οδήγησης, εκτός των λοιπών προβλεπόμενων ποινών, στερείται του δικαιώματος απόκτησης άδειας οδήγησης οποιασδήποτε κατηγορίας, με απόφαση του δικαστηρίου, για τρία (3) τουλάχιστον έτη και για δέκα (10) τουλάχιστον έτη, αν έγινε υπαίτιος τροχαίου ατυχήματος με σοβαρό τραυματισμό ή θάνατο.\n5. Αυτός που καταλαμβάνεται να οδηγεί οδικό όχημα, κατά το διάστημα που του έχει αφαιρεθεί η άδεια οδήγησης για οποιονδήποτε λόγο, εκτός των λοιπών προβλεπόμενων ποινών, στερείται, με απόφαση του δικαστηρίου, του δικαιώματος επαναχορήγησης της άδειας οδήγησης για τρία (3) επιπλέον έτη, ενώ αν γίνει υπαίτιος τροχαίου ατυχήματος με τραυματισμό ή θάνατο, το δικαστήριο δύναται να επιβάλλει και την ποινή της δια βίου αφαίρεσης της άδειας οδήγησης οποιουδήποτε οδικού οχήματος.`},
  102: {title:`Παραχώρηση της οδήγησης οχήματος`,text:`1. Απαγορεύεται η παραχώρηση της οδήγησης οδικού οχήματος σε πρόσωπο το οποίο δεν έχει τη νόμιμη, κατά περίπτωση, άδεια οδήγησης και το αναγκαίο, κατά περίπτωση, πιστοποιητικό επαγγελματικής ικανότητας ή σε πρόσωπο του οποίου τα στοιχεία αυτά έχουν αφαιρεθεί για οποιαδήποτε παράβαση. Στη δεύτερη περίπτωση η απαγόρευση ισχύει μόνο κατά τη διάρκεια της αφαίρεσης των ως άνω στοιχείων.\n2. Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε3-Β.`},
  103: {title:`Έγγραφα τα οποία πρέπει να φέρει ο οδηγός`,text:`1. Ο οδηγός οδικού οχήματος, όταν οδηγεί, φέρει:\nα) τη νόμιμη άδεια οδήγησης σε έντυπη ή ψηφιακή μορφή,\nβ) την άδεια κυκλοφορίας του οχήματος,\nγ) το αποδεικτικό ασφάλισης,\nδ) την απόδειξη πληρωμής των τελών κυκλοφορίας,\nε) κατά περίπτωση:\nεα) την ειδική άδεια οδήγησης οδηγού επιβατικού δημοσίας χρήσης αυτοκινήτου,\nεβ) το Πιστοποιητικό Επαγγελματικής Ικανότητας,\nεγ) το Πιστοποιητικό Επαγγελματικής Κατάρτισης Οδηγού Οχημάτων Μεταφοράς Επικίνδυνων Εμπορευμάτων (ΑDR) και τα λοιπά έγγραφα που απαιτεί η Ευρωπαϊκή Συμφωνία για τη Διεθνή Οδική Μεταφορά Επικίνδυνων Εμπορευμάτων (ΑDR), η οποία κυρώθηκε με τον ν. 1741/1987 (Α’ 225),\nεδ) το δελτίο τεχνικού ελέγχου,\nεε) την κάρτα ελέγχου καυσαερίων, εστ) τη βεβαίωση καλής λειτουργίας ταχογράφου,\nεζ) τη βεβαίωση περιοριστή ταχύτητας και\nεη) το σχετικό αυτοκόλλητο σήμα, καθώς και\nστ) οποιοδήποτε άλλο έγγραφο, βεβαίωση, ή πιστοποιητικό απαιτείται ανάλογα με την κατηγορία του οχήματος από τις ειδικές διατάξεις. Οι οδηγοί των ποδηλάτων και των Ε.Π.Η.Ο. από δώδεκα (12) ετών και άνω φέρουν, όταν οδηγούν, οποιοδήποτε νόμιμο έγγραφο ταυτοποίησης προσώπου. Ειδικά τα οχήματα που είναι μισθωμένα από εταιρείες ενοικιαζόμενων αυτοκινήτων ή χρηματοδοτικής μίσθωσης (leasing), φέρουν μόνο αντίγραφο της άδειας κυκλοφορίας, ενώ δεν υποχρεούνται να φέρουν το αποδεικτικό ασφάλισης και την απόδειξη πληρωμής των τελών κυκλοφορίας.\n2. Η παράβαση της παρ. 1 για την έλλειψη καθενός από τα παραπάνω έγγραφα κατατάσσεται στην κατηγορία Ε1-Α.`},
  104: {title:`Χρήση βοηθητικών οργάνων κατά την οδήγηση`,text:`1. Οι οδηγοί οδικών οχημάτων, όταν οδηγούν, φορούν γυαλιά ή χρησιμοποιούν άλλα βοηθητικά όργανα ή μέσα, αν αυτό αναγράφεται στην άδειά τους. Οι οδηγοί μοτοσικλετών, αν το κράνος το οποίο φορούν δεν έχει διαφανές προστατευτικό κάλυμμα, φορούν και γυαλιά κατά του ανέμου.\n2. Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε2-Α.`},
  106: {title:`Επιβολή διοικητικών μέτρων`,text:`1. Τα στοιχεία κυκλοφορίας, άδεια και κρατικές πινακίδες κυκλοφορίας, όλων των κατηγοριών οχημάτων δεν αφαιρούνται, με εξαίρεση:\nα) παραβάσεις που η αφαίρεση επιβάλλεται με απόφαση δικαστηρίου,\nβ) παραβάσεις οι οποίες αναφέρονται σε ελλείψεις ή ελαττωματική λειτουργία του οχήματος και οι οποίες επηρεάζουν την οδική ασφάλεια ή προκαλούν εκπομπές επικίνδυνων καυσαερίων και υπερβολικούς θορύ βους, όπως προβλέπονται στην παρ. 2 του άρθρου 19, περί εκπομπών, ρύπων και θορύβων, στις παρ. 11 και 12 του άρθρου 24, περί ορίων ταχύτητας, στην παρ. 6 του άρθρου 36, περί φόρτωσης οχημάτων, στις περ. ιστ),\nιζ) και\nιη) της παρ. 2 του άρθρου 38, περί στάσης και στάθμευσης, στην περ. γ της παρ. 7 του άρθρου 46, περί οδήγησης υπό την επίδραση αλκοόλ, στην παρ. 8 του άρθρου 46, περί οδήγησης υπό την επίδραση τοξικών ουσιών, στο άρθρο 50, περί ακινητοποίησης οχήματος, στην παρ. 13 του άρθρου 85, περί μηχανισμών, εξαρτημάτων και συσκευών οχημάτων, στα άρθρα 89, περί στοιχείων αναγνώρισης πλαισίου και κινητήρα, 90, περί τεχνικού ελέγχου οχημάτων, 91, περί γενικής απογραφής και ταξινόμησης οχημάτων, στην παρ. 4 του άρθρου 92, περί άδειας κυκλοφορίας οχημάτων, στο άρθρο 93, περί μεταβολής στοιχείων της άδειας κυκλοφορίας, στο άρθρο 94, περί πινακίδων αριθμού κυκλοφορίας, στην παρ. 2 του άρθρου 98, περί αδειών οδήγησης, κυρώσεων και αδειών εκπαιδευτών υποψήφιων οδηγών, καθώς και στα άρθρα 100, περί αδειών οδήγησης αγροτικών μηχανημάτων και μηχανημάτων έργου, και 102, περί παραχώρησης της οδήγησης οχήματος,\nγ) παραβάσεις των άρθρων 7 και 8 και του άρθρου 38, περί στάσης και στάθμευσης, που αφορούν στη στάθμευση και προβλέπεται αφαίρεση της άδειας οδήγησης, όταν αυτή δεν ενεργείται αμέσως και επί τόπου από τον βεβαιούντα την παράβαση. Στην περίπτωση αυτή, τα στοιχεία κυκλοφορίας του οχήματος που αφαιρούνται επιστρέφονται στον κάτοχο με την προσκόμιση της άδειας οδήγησης.\n2. Για τις παραβάσεις της παρ. 1, οι οποίες αναφέρονται σε ελλείψεις ή ελαττωματική λειτουργία του οχήματος που επηρεάζουν την οδική ασφάλεια ή σε εκπομπές επικίνδυνων καυσαερίων και την πρόκληση υπερβολικών θορύβων, η επιστροφή των αφαιρεθέντων στοιχείων κυκλοφορίας του οχήματος γίνεται μόνον εφόσον διαπιστωθεί αρμοδίως η αποκατάσταση του ελαττώματος ή των ελλείψεων του οχήματος. Για τα οχήματα που είναι υπόχρεα σε περιοδικό τεχνικό έλεγχο, η διαπίστωση αυτή προκύπτει από την προσκόμιση δελτίου τεχνικού ελέγχου, χωρίς σοβαρές ή επικίνδυνες ελλείψεις και χωρίς τις ελλείψεις για τις οποίες σημειώθηκε η παράβαση. Αν δεν έχει αποκατασταθεί το ελάττωμα ή η έλλειψη για τα οποία έγινε η αφαίρεση των στοιχείων της κυκλοφορίας του οχήματος, μετά από την παρέλευση του χρόνου μέχρι τον οποίο διαρκεί το ληφθέν διοικητικό μέτρο, παρατείνεται η λήψη του μέτρου αυτού μέχρι να διαπιστωθεί αρμοδίως η αποκατάσταση των ελαττωμάτων ή ελλείψεων του οχήματος.\n3. Για τις παραβάσεις της παρ. 1 που αφορούν την οδήγηση οχήματος κατά παράβαση των άρθρων 46, 98, 100 και 102, η επιστροφή των αφαιρεθέντων στοιχείων κυκλοφορίας του οχήματος γίνεται μετά από την παρέλευση του χρόνου αφαίρεσης, μόνο με την προσκόμιση αποδεικτικού καταβολής των διοικητικών προστίμων. Για οχήματα που είναι μισθωμένα από εταιρείες ενοικιαζόμενων αυτοκινήτων ή από εταιρείες χρηματοδοτικής μίσθωσης (leasing), εφόσον η διάρκεια της μίσθωσης είναι μικρότερη του χρονικού διαστήματος της επιβληθείσας αφαίρεσης, τα στοιχεία κυκλοφορίας επιστρέφονται στην εκμισθώτρια εταιρεία, με την προσκόμιση του σχετικού συμφωνητικού μίσθωσης του οχήματος.\n4. Για τις παραβάσεις, στην περίπτωση των οποίων προβλέπεται αφαίρεση της άδειας οδήγησης και οι οποίες κατατάσσονται στην κατηγορία Ε4, καθώς και για τις παραβάσεις των άρθρων 46, περί οδήγησης υπό την επίδραση οινοπνεύματος, φαρμάκων ή τοξικών ουσιών, και 102, περί παραχώρησης της οδήγησης οχήματος, οι οποίες κατατάσσονται στην κατηγορία Ε3-Β, η άδεια οδήγησης επιστρέφεται μετά από την παρέλευση του χρόνου αφαίρεσής της, μόνο με την προσκόμιση αποδεικτικού καταβολής των διοικητικών προστίμων.\n5. Η αφαίρεση της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος ενεργείται αμέσως και επί τόπου από τον βεβαιούντα την παράβαση αστυνομικό ή άλλα αρμόδια όργανα. Η άδεια οδήγησης και τα στοιχεία κυκλοφορίας του οχήματος προσκομίζονται άμεσα από το όργανο που ενέργησε την αφαίρεση, στην αρμόδια Αστυνομική Αρχή μαζί με τη σχετική έκθεση της παράβασης.\n6. Τα προβλεπόμενα στις παρ. 1 έως 5 διοικητικά μέτρα μπορούν να επικυρωθούν ή να αρθούν κατόπιν υποβολής αντιρρήσεων αυτού σε βάρος του οποίου λαμβάνονται, στην αρμόδια Αρχή. Αν η άμεση αφαίρεση των πινακίδων είναι αδύνατη, ενεργείται αμέσως μόλις καταστεί αυτό δυνατόν και σε κάθε περίπτωση, πριν από την παραγραφή της παράβασης για την οποία προβλέπεται η αφαίρεση των πινακίδων. Σε κάθε περίπτωση επιβολής των διοικητικών μέτρων των παρ. 1 έως 5, ο οδηγός, κάτοχος ή ιδιοκτήτης, κατόπιν έγγραφης ή ηλεκτρονικής ειδοποίησης της οικείας αστυνομικής αρχής, παραδίδουν τα στοιχεία κυκλοφορίας του οχήματος, καθώς και την άδεια οδήγησης εντός πέντε (5) ημερών από την ειδοποίηση. Αυτός που δεν συμμορφώνεται, τιμωρείται με τις ποινές του άρθρου 169 του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί απείθειας. Η εκτέλεση του διοικητικού μέτρου δεν επηρεάζεται από την έκβαση της ποινικής δίκης.\n7. Τα προβλεπόμενα διοικητικά μέτρα του παρόντος επιβάλλονται παράλληλα και ανεξάρτητα από τις ποινικές ή άλλες κυρώσεις, που προβλέπονται από τις οικείες διατάξεις.\n8. Όταν η άδεια οδήγησης έχει αφαιρεθεί για παράβαση του παρόντος και επιβάλλεται εκ νέου αφαίρεση από άλλη παράβαση, η επιβολή του διοικητικού μέτρου αρχίζει κάθε φορά από τη λήξη του χρόνου της προηγούμενης αφαίρεσης.\n9. Στους παραβάτες των οχημάτων για την κυκλοφορία των οποίων δεν απαιτούνται στοιχεία κυκλοφορίας ή άδεια οδήγησης ή και τα δύο, επιβάλλονται οι κυρώσεις μόνο κατά το σκέλος του διοικητικού προστίμου. Σε παραβάσεις για τις οποίες δεν προβλέπεται άλλη κύρωση, επιβάλλεται το διοικητικό πρόστιμο της κατηγορίας Ε1-Α.\n10. Σε περίπτωση συρροής παραβάσεων, επιβάλλεται συνολικό διοικητικό μέτρο, το οποίο αποτελείται από το σύνολο των διοικητικών μέτρων τα οποία προβλέπονται για κάθε μία από τις επιμέρους παραβάσεις σύμφωνα με τα προβλεπόμενα στον παρόντα.\n11. Σε περίπτωση παραβίασης των πινακίδων Ρ-67 και Ρ-67α της παρ. 3 του άρθρου 7 και της περ. ι) της παρ. 8 του άρθρου 8 εξαιρούνται από την επιβολή του διοικητικού μέτρου αφαίρεσης της άδειας οδήγησης οι οδηγοί επιβατικών δημόσιας χρήσης (ΤΑΞΙ) της υποπερ. α) της περ. 19 του άρθρου 4.`},
  108: {title:`Κατηγοριοποίηση παραβάσεων`,text:`1. Οι παραβάσεις του παρόντος κατατάσσονται ανάλογα με την επικινδυνότητά τους για τη ζωή, την υγεία και τη σωματική ακεραιότητα των χρηστών του οδικού δικτύου, την υποχρέωση για ιδιαίτερη μέριμνα και προστασία για τα άτομα με αναπηρία, την πρόληψη της πρόκλησης τροχαίων ατυχημάτων, καθώς και τις επιπτώσεις της παράβασης στην οδική ασφάλεια, στις εξής κατηγορίες:\nα) κατηγορία Ε1,\nβ) κατηγορία Ε2,\nγ) κατηγορία Ε3,\nδ) κατηγορία Ε4,\nε) κατηγορία Σ (αντικοινωνικής οδικής συμπεριφοράς).\n2. Η κάθε μία από τις κατηγορίες των περ. α), β),\nγ) της παρ. 1 διακρίνεται σε δύο υποκατηγορίες, ως εξής:\nα) υποκατηγορία Α, για την οποία επιβάλλεται μόνο διοικητικό πρόστιμο, και\nβ) υποκατηγορία Β για την οποία επιβάλλονται διοικητικό πρόστιμο και διοικητικό μέτρο.\n3. Οι παραβάσεις του παρόντος που υποδηλώνουν αντικοινωνική οδική συμπεριφορά, κατατάσσονται, επιπλέον των κατηγοριών των παρ. 1 και 2, και στην κατηγορία Σ. Στις παραβάσεις του προηγούμενου εδαφίου, πέραν του διοικητικού προστίμου και του διοικητικού μέτρου που επιβάλλεται βάσει της κατηγορίας και υποκατηγορίας στην οποία κατατάσσονται, επιβάλλεται και επιπλέον διοικητικό μέτρο.\n4. Στην κατηγορία Ε4 κατατάσσονται παραβάσεις με ιδιαίτερες επιπτώσεις για την οδική ασφάλεια. Για τις παραβάσεις που εντάσσονται στην κατηγορία αυτή, επιβάλλονται το διοικητικό πρόστιμο και το διοικητικό μέτρο που αναφέρεται στη συγκεκριμένη σχετική διάταξη.\nβ) Κάποιες εκ των παραβάσεων επιφέρουν επιπλέον ή μόνο ποινικές κυρώσεις που επιβάλλονται από το δικαστήριο, όπως αναφέρονται στα επιμέρους άρθρα του παρόντος.\n5. Για κάθε παράβαση που ανήκει στην ίδια κατηγορία και υποκατηγορία επιβάλλονται οι παρακάτω διοικητικές κυρώσεις:\nα) Παράβαση κατηγορίας Ε1:\nαα) Ε1-Α επιβάλλεται διοικητικό πρόστιμο τριάντα (30) ευρώ,\nαβ) Ε1-Β επιβάλλεται το διοικητικό πρόστιμο της υποκατηγορίας Ε1-Α και το διοικητικό μέτρο αφαίρεσης της άδειας οδήγησης για δέκα (10) ημέρες.\nβ) Παράβαση κατηγορίας Ε2:\nβα) Ε2-Α επιβάλλεται διοικητικό πρόστιμο εκατόν πενήντα (150) ευρώ,\nββ) Ε2-Β επιβάλλεται το διοικητικό πρόστιμο της υποκατηγορίας Ε2-Α και το διοικητικό μέτρο αφαίρεσης της άδειας οδήγησης για είκοσι (20) ημέρες.\nγ) Παράβαση κατηγορίας Ε3:\nγα) Ε3-Α επιβάλλεται διοικητικό πρόστιμο τριακοσίων πενήντα (350) ευρώ,\nγβ) Ε3-Β επιβάλλεται το διοικητικό πρόστιμο της υποκατηγορίας Ε3-Α και το διοικητικό μέτρο αφαίρεσης της άδειας οδήγησης και των στοιχείων κυκλοφορίας του οχήματος για τριάντα (30) ημέρες, τηρουμένης της παρ. 1 του άρθρου 106, περί επιβολής διοικητικών μέτρων.\nδ) Για τις παραβάσεις της κατηγορίας Σ, πέραν των κυρώσεων που επιβάλλονται σύμφωνα με τις περ. α) έως γ), επιβάλλεται επιπρόσθετα και το διοικητικό μέτρο αφαίρεσης της άδειας οδήγησης του οδηγού για σαράντα (40) ημέρες.\n6. Στις επιμέρους διατάξεις του παρόντος αναφέρονται οι παραβάσεις που επιφέρουν, πέραν των διοικητικών κυρώσεων, και ποινικές κυρώσεις ή που επιφέρουν μόνο ποινικές κυρώσεις που επιβάλλονται από το δικαστήριο.`},
  109: {title:`Ανάκληση άδειας ικανότητας οδηγού`,text:`1. Αν διαταχθεί κατ’ εφαρμογή του παρόντος, η ανάκληση της άδειας ικανότητας οδηγού, μπορεί ο οδηγός κατά του οποίου λαμβάνεται το μέτρο αυτό, αν συντρέχουν οι νόμιμες προϋποθέσεις, να λάβει νέα άδεια μετά από τρία (3) έτη από την ανάκληση, εκτός και αν πρόκειται για ανάκληση εφ’ όρου ζωής. Η λήψη νέας αδείας ικανότητας οδηγού τελεί υπό την επιφύλαξη του άρθρου 110, περί υποτροπής.\n2. Σε περίπτωση ανάκλησης άδειας ικανότητας οδηγού αυτοκινήτων οχημάτων, η Αστυνομική Αρχή, η οποία εκτελεί τη σχετική απόφαση, διαβιβάζει την άδεια στην αρμόδια υπηρεσία της Περιφερειακής Ενότητας που την εξέδωσε.`},
  110: {title:`Υποτροπή - Σύστημα ελέγχου συμπεριφοράς των οδηγών`,text:`1. Ως υποτροπή νοείται η διάπραξη της ίδιας παράβασης εντός χρονικού διαστήματος που ορίζεται στην από φαση της παρ. 2, ανεξάρτητα από την τοπική ή χρονική εγγύτητα από την τέλεση της προηγούμενης παράβασης και ανεξάρτητα από την επίδοση ή μη των εκθέσεων βεβαίωσης παραβάσεων, με την επιφύλαξη των παρ. 3, 4 και 5. Ειδικά για την περίπτωση της παράνομης στάθμευσης του άρθρου 38, περί στάσης και στάθμευσης, όταν αυτή συνεχίζεται πέραν των τριών (3) ωρών, βεβαιώνεται νέα παράβαση και υφίσταται υποτροπή.\n2. Στο Σύστημα Ελέγχου της Συμπεριφοράς των Οδηγών (Σ.Ε.Σ.Ο.) μηχανοκίνητων οχημάτων και μοτοποδηλάτων συγκεντρώνονται και καταχωρίζονται τα στοιχεία για τις διαπραττόμενες παραβάσεις του παρόντος και του συνδυασμού κατηγορίας και υποκατηγορίας αυτών, σύμφωνα με το άρθρο 108, περί κατηγοριοποίησης παραβάσεων.\n3.\nα) Σε περίπτωση διάπραξης για δεύτερη φορά μέσα σε διάστημα πέντε (5) ετών των παραβάσεων του παρόντος που συνδέονται με:\nαα) την οδήγηση υπό την επίδραση οινοπνεύματος, σύμφωνα με τις περ. α) και\nβ) της παρ. 7 του άρθρου 46, περί οδήγησης υπό την επίδραση οινοπνεύματος, φαρμάκων ή τοξικών ουσιών,\nαβ) τη Ρυθμιστική Πινακίδα Ρ-2 Υποχρεωτικής διακοπής πορείας (STOP) και τη Ρυθμιστική Πινακίδα Ρ-29, σύμφωνα με τις παρ. 3 και 11 του άρθρου 7, περί σήμανσης οδών με πινακίδες ή την περ. α) της παρ. 2 του άρθρου 33, περί πραγματοποίησης επιτόπιας στροφής,\nαγ) τον ερυθρό φωτεινό σηματοδότη, σύμφωνα με τις περ. β), ε),η) καιι) της παρ. 1 του άρθρου 9, περί φωτεινής σηματοδότησης για την κυκλοφορία οχημάτων,\nαδ) την οδήγηση οχημάτων για επίδειξη ικανότητας, εντυπωσιασμού, ανταγωνισμού ή την τέλεση αυτοσχέδιων αγώνων, σύμφωνα με την παρ. 8 του άρθρου 16, περί κανόνων οδικής συμπεριφοράς, ή τον συναγωνισμό στην ταχύτητα, σύμφωνα με την παρ. 5 του άρθρου 23, περί ταχύτητας και απόστασης μεταξύ οχημάτων, την οδήγηση που υπερβαίνει τα διακόσια (200) χιλιόμετρα την ώρα της περ. δ) της παρ. 9 του άρθρου 24, περί ορίων ταχύτητας,\nαε) τη μη χρήση ζώνης από τους οδηγούς, σύμφωνα με την παρ. 5 και τη μη χρήση κράνους ασφαλείας από τους οδηγούς και από τους συνεπιβάτες σύμφωνα με την παρ. 6 του άρθρου 16, περί κανόνων οδικής συμπεριφοράς,\nαστ) τη μη χρήση ειδικών μέσων συγκράτησης και προστασίας κατά τη μεταφορά παιδιών, σύμφωνα με την παρ. 5 του άρθρου 16, την περ. β) της παρ. 2 και την παρ. 3 του άρθρου 37, περί μεταφοράς επιβατών με οχήματα, όσον αφορά το προστατευτικό κράνος συνεπιβάτη,\nαζ) τη χρήση κινητού κατά την οδήγηση, σύμφωνα με την παρ. 2 του άρθρου 17, περί οδηγών, και την παρ. 1 του άρθρου 44, περί ειδικών κανόνων για τους οδηγούς ποδηλάτων, μοτοποδηλάτων, μοτοσικλετών, τρίτροχων οχημάτων και Ε.Π.Η.Ο.,\nαη) την υπέρβαση κατά πενήντα (50) χιλιόμετρα και άνω του εκάστοτε ισχύοντος ορίου ταχύτητας, σύμφωνα με την περ. γ της παρ. 12 του άρθρου 24,\nαθ) τη χρήση της Λ.Ε.Α., σύμφωνα με την παρ. 9 του άρθρου 33, περί κίνησης οχημάτων σε αυτοκινητόδρομους, οδούς ταχείας κυκλοφορίας και σήραγγες,\nαι) τη στάση ή στάθμευση σε θέση όπου βρίσκεται ράμπα διάβασης ατόμων με αναπηρία, σύμφωνα με την περ. ιστ) της παρ. 2 του άρθρου 38, ή σε αποκλειστικές ή γενικές θέσεις στάθμευσης ατόμων με αναπηρία, σύμφωνα με την παρ. 3 του άρθρου 7, περί σήμανσης οδών με πινακίδες, και τις περ. ιζ) και ιη) της παρ. 4 του άρθρου 38, στον παραβάτη οδηγό επιβάλλονται διοικητικό πρόστιμο χιλίων (1.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για εκατόν ογδόντα (180) ημέρες, με εξαίρεση την παράβαση της περ. αδ) της παρούσας, για την οποία επιβάλλονται στον παραβάτη διοικητικό πρόστιμο τεσσάρων χιλιάδων (4.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για δύο (2) έτη.\nβ) Σε περίπτωση διάπραξης για δεύτερη φορά μέσα σε διάστημα πέντε (5) ετών των παραβάσεων του παρόντος που συνδέονται με:\nβα) μη συμμόρφωση με σταθερό ερυθρό σηματοδότη του άρθρου 9, όταν αυτή έχει ως αποτέλεσμα την πρόκληση τροχαίου ατυχήματος,\nββ) μη συμμόρφωση με την πινακίδα P-2 ή Ρ-29 ή τον συνδυασμό αυτής με πρόσθετες πινακίδες της περ. β) της παρ. 11 του άρθρου 7 ή την πραγματοποίηση επιτόπιας στροφής της περ. α) της παρ. 2 του άρθρου 33 όταν αυτή έχει ως αποτέλεσμα την πρόκληση τροχαίου ατυχήματος,\nβγ) τη χρήση κινητού κατά την οδήγηση, σύμφωνα με την υποπερ. βα) της περ. β) της παρ. 6 του άρθρου 17, περί οδηγών, και της παρ. 16 του άρθρου 44, περί ειδικών κανόνων για τους οδηγούς ποδηλάτων, μοτοποδηλάτων, μοτοσικλετών, τρίτροχων οχημάτων και Ε.Π.Η.Ο.,\nβδ) τη μη παραχώρηση προτεραιότητας της περ. ε) της παρ. 5 του άρθρου 30, την παραβίαση φωτεινής σηματοδότησης ή κινητού φράγματος προ ισόπεδης σιδηροδρομικής διάβασης σύμφωνα με τις περ. β),γ) καιδ) της παρ. 1 του άρθρου 31 και τη στάθμευση σε σιδηροδρομική διάβαση της περ. δ) της παρ. 2 του άρθρου 38, περί στάσης και στάθμευσης, και\nβε) την οδήγηση υπό την επίδραση οινοπνεύματος, με ποσοστό αλκοόλ άνω του ορίου της περ. γ) της παρ. 7 του άρθρου 46, περί οδήγησης υπό την επίδραση οινοπνεύματος, φαρμάκων ή τοξικών ουσιών, ή υπό την επήρεια ουσιών της παρ. 8 του άρθρου 46, βστ) την εγκατάλειψη των περ. α) και β) της παρ. 2 του άρθρου 47, περί συμπεριφοράς σε περίπτωση ατυχήματος,\nβζ) την οδήγηση χωρίς ο οδηγός να κατέχει την προβλεπόμενη ισχύουσα άδεια οδήγησης, σύμφωνα με τις περ. β) και γ) της παρ. 4 του άρθρου 98, περί αδειών οδήγησης, κυρώσεων και αδειών εκπαιδευτών υποψήφιων οδηγών, και της παρ. 4 του άρθρου 100, περί αδειών οδήγησης αγροτικών μηχανημάτων και μηχανημάτων έργου, στον παραβάτη οδηγό επιβάλλονται διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για τέσσερα (4) έτη, με εξαίρεση την οδήγηση υπό την επίδραση οινοπνεύματος άνω του ορίου της περ. γ) της παρ. 7 του άρθρου 46 ή υπό την επήρεια ουσιών της παρ. 8 του άρθρου 46 και την εγκατάλειψη των περ. α) και β) της παρ. 2 του άρθρου 47, που στον παραβάτη επιβάλλεται το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για επτά (7) έτη. 4.α) Σε περίπτωση διάπραξης για τρίτη φορά μέσα σε διάστημα πέντε (5) ετών από την αμέσως προηγούμενη διάπραξη των παραβάσεων της περ. α της παρ. 3 στον παραβάτη οδηγό επιβάλλονται διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για ένα (1) έτος, με εξαίρεση την παράβαση της περ. αδ) της παρ. 3, που στον παραβάτη επιβάλλονται διοικητικό πρόστιμο οκτώ χιλιάδων (8.000) ευρώ και αφαίρεση της άδειας οδήγησης για τέσσερα (4) έτη.\nβ) Σε περίπτωση διάπραξης για τρίτη φορά μέσα σε διάστημα πέντε (5) ετών από την αμέσως προηγούμενη διάπραξη των παραβάσεων της περ. β της παρ. 3, στον παραβάτη οδηγό επιβάλλονται διοικητικό πρόστιμο τεσσάρων χιλιάδων (4.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για οκτώ (8) έτη, με εξαίρεση την οδήγηση υπό την επίδραση οινοπνεύματος, με ποσοστό αλκοόλ άνω του ορίου της περ. γ) της παρ. 7 του άρθρου 46 ή υπό την επήρεια ουσιών της παρ. 8 του άρθρου 46 που στον παραβάτη επιβάλλεται αφαίρεση της άδειας οδήγησης για δέκα (10) έτη και την εγκατάλειψη των περ. α) και β) της παρ. 2 του άρθρου 47, που στον παραβάτη επιβάλλεται αφαίρεση της άδειας οδήγησης δια βίου. 5. Σε περίπτωση διάπραξης της ίδιας παράβασης για τέταρτη φορά και για κάθε επόμενη φορά εντός πέντε (5) ετών από τη διάπραξη της τελευταίας παράβασης, επιβάλλονται οι κυρώσεις των περ. α) και β) της παρ. 4, αναλόγως την παράβαση. Μετά την πάροδο των πέντε (5) ετών από την διάπραξη της τελευταίας παράβασης, χωρίς νέα υποτροπή, κάθε νέα παράβαση θεωρείται ως πρώτη. 6. Για τις περιπτώσεις των παρ. 3, 4 και 5 ο παραβάτης οδηγός υποχρεούται σε εκπαίδευση και εξέταση για τη χορήγηση της άδειας οδήγησης. Το δικαίωμα συμμετοχής στην εξέταση του πρώτου εδαφίου κατοχυρώνεται μετά το πέρας του χρονικού διαστήματος αφαίρεσης της άδειας οδήγησης, μόνο με την προσκόμιση του αποδεικτικού καταβολής των διοικητικών προστίμων, σύμφωνα με το άρθρο 107, κατά περίπτωση. 7. Τα διοικητικά μέτρα του παρόντος επιβάλλονται και εκτελούνται παράλληλα και // ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function catCls(c){
  const u=c.toUpperCase();
  if(u.startsWith('Ε1')||u.startsWith('E1'))return'e1';
  if(u.startsWith('Ε2')||u.startsWith('E2'))return'e2';
  if(u.startsWith('Ε3')||u.startsWith('E3'))return'e3';
  if(u.startsWith('Ε4')||u.startsWith('E4'))return'e4';
  if(u==='Σ'||u==='S')return'sg';
  return'e1';
}
function fmt(n){return n==null?'—':n.toLocaleString('el-GR')+'€';}
function afmt(a){if(!a)return'';if(typeof a==='number')return a+' ημ.';return a;}
function afDays(a){
  if(!a)return 0;
  if(typeof a==='number')return a;
  const m=(a+'').match(/(\d+)/);
  return m?parseInt(m[1],10):0;
}
function hl(t,q){if(!q)return t;const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\$&')+')','gi');return t.replace(re,'<mark>$1</mark>');}
function n(s){return(s||'').toLowerCase()
  .replace(/ά/g,'α').replace(/έ/g,'ε').replace(/ή/g,'η').replace(/ί/g,'ι').replace(/ΐ/g,'ι')
  .replace(/ό/g,'ο').replace(/ύ/g,'υ').replace(/ΰ/g,'υ').replace(/ώ/g,'ω')
  .replace(/Ά/g,'α').replace(/Έ/g,'ε').replace(/Ή/g,'η').replace(/Ί/g,'ι')
  .replace(/Ό/g,'ο').replace(/Ύ/g,'υ').replace(/Ώ/g,'ω')
  .replace(/[αΑ]/g,'α').replace(/[εΕ]/g,'ε').replace(/[ηΗ]/g,'η')
  .replace(/[ιΙ]/g,'ι').replace(/[οΟ]/g,'ο').replace(/[υΥ]/g,'υ').replace(/[ωΩ]/g,'ω');}
function match(v,q){
  if(!q)return true;
  const nq=n(q);
  return n(v.title).includes(nq)||n(v.desc).includes(nq)||n(v.article).includes(nq)||
    (v.tags||[]).some(t=>n(t).includes(nq))||
    v.cat.toLowerCase().includes(q.toLowerCase())||
    (v.amount&&String(v.amount).includes(q));
}
function tabMatch(v){
  const isTruck=v.tags&&v.tags.includes('3446');
  if(VEH==='fot'&&!isTruck)return false;
  if(VEH==='kok'&&isTruck)return false;
  if(TAB==='all'||TAB==='az'||TAB==='art')return true;
  const c=v.cat.toUpperCase();
  if(TAB==='e1')return c.startsWith('Ε1')||c.startsWith('E1');
  if(TAB==='e2')return c.startsWith('Ε2')||c.startsWith('E2');
  if(TAB==='e3')return c.startsWith('Ε3')||c.startsWith('E3');
  if(TAB==='e4')return c.startsWith('Ε4')||c.startsWith('E4');
  return false;
}

function artNum(art){

  const grps={};

  const artKeys=Object.keys(grps).sort((a,b)=>artNum(a)-artNum(b));

    const sorted=grps[art].sort((a,b)=>a.title.localeCompare(b.title,'el'));
    h+=`<div class="sec">${hl(art,Q)} <span style="color:var(--g5);font-weight:400">(${sorted.length})</span></div><div class="grp">`;
    sorted.forEach(v=>{
      const a=afmt(v.afairesi);
      const amtDisp=v.amount?fmt(v.amount)+'€':v.cat;
      const isSel = SELECTED.has(v.id);
      const rowClick = SEL_MODE ? `toggleSel(${v.id},event)` : `openDetail(${v.id})`;
      h+=`<div class="row${isSel?' sel':''}" data-id="${v.id}" onclick="${rowClick}">

function toggleSelMode(){
