<html lang="el">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="e-ΚΟΚ">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ΚΟΚ">
<title>MyKOK — Ν. 5209/2025</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0071e3;--red:#ff3b30;--orange:#ff9500;--green:#34c759;--yellow:#ffcc00;--purple:#af52de;
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;
  --g3:#3a3a3c;--g4:#48484a;--g5:#636366;--g6:#aeaeb2;
  --sep:rgba(255,255,255,0.1);--text:#fff;--text2:#aeaeb2;--r:13px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)
}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-size:16px;min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;
  background:rgba(0,0,0,0.88);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(var(--st) + 10px) 16px 10px;border-bottom:.5px solid var(--sep)}
.hdr h1{font-size:17px;font-weight:700;text-align:center;letter-spacing:-.3px}
.hdr p{font-size:11px;color:var(--g6);text-align:center;margin-top:2px}
.hdr-stats{display:flex;justify-content:center;gap:12px;margin-top:6px}
.stat{font-size:11px;color:var(--g5);background:var(--g3);padding:3px 10px;border-radius:20px}
.stat span{color:var(--text);font-weight:600}

/* SEARCH */
.srch{padding:10px 16px 6px;background:var(--bg)}
.srch-box{display:flex;align-items:center;background:var(--g3);border-radius:12px;padding:9px 12px;gap:8px}
.srch-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:16px;font-family:inherit}
.srch-box input::placeholder{color:var(--g6)}
.clr{background:var(--g5);border:none;border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;flex-shrink:0}
.clr.on{opacity:1}

/* TABS */
.tabs{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;
  cursor:pointer;border:none;background:var(--g3);color:var(--text2);transition:all .15s}
.tab.on{background:var(--blue);color:#fff}

/* VEHICLE TYPE TABS */
.vtabs{display:flex;gap:6px;padding:8px 16px 4px;background:var(--bg)}
.vtab{flex:1;padding:9px 12px;border-radius:11px;font-size:13px;font-weight:600;
  cursor:pointer;border:none;background:var(--g3);color:var(--text2);transition:all .15s;text-align:center}
.vtab.on.fot{background:#3e1800;color:#ff9500;border:1.5px solid #ff9500}
.vtab.on.kok{background:#00214a;color:var(--blue);border:1.5px solid var(--blue)}

/* CONTENT */
.main{padding:0 0 calc(var(--sb) + 90px)}
.sec{font-size:12px;font-weight:600;color:var(--g6);text-transform:uppercase;
  letter-spacing:.5px;padding:18px 16px 6px}
.grp{background:var(--card);border-radius:var(--r);margin:0 16px 2px;overflow:hidden}
.row{display:flex;align-items:center;padding:13px 16px;gap:12px;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:background .1s;border-bottom:.5px solid var(--sep)}
.row:last-child{border-bottom:none}
.row:active{background:var(--g3)}
.ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0}
.body{flex:1;min-width:0}
.ttl{font-size:14px;font-weight:500;line-height:1.3}
.sub{font-size:12px;color:var(--g6);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rgt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.bdg{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.e1{background:rgba(52,199,89,.18);color:#34c759}
.e2{background:rgba(255,149,0,.18);color:#ff9500}
.e3{background:rgba(255,59,48,.18);color:#ff3b30}
.e4{background:rgba(175,82,222,.18);color:#af52de}
.sg{background:rgba(255,204,0,.18);color:#ffcc00}
.af{font-size:11px;color:var(--g6);background:var(--g3);padding:2px 8px;border-radius:10px}

/* SHEET */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:flex-end}
.ov.on{display:flex}
.sht{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:92vh;
  overflow-y:auto;padding:0 0 calc(var(--sb)+20px);
  animation:up .28s cubic-bezier(.34,1.2,.64,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hdl{width:36px;height:4px;background:var(--g4);border-radius:2px;margin:12px auto 0}
.sttl{font-size:20px;font-weight:700;padding:14px 20px 0;letter-spacing:-.4px;line-height:1.3}
.sart{font-size:13px;color:var(--blue);padding:4px 20px 14px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px}
.gc{background:var(--card2);border-radius:12px;padding:13px}
.gc.full{grid-column:1/-1}
.gclbl{font-size:11px;color:var(--g6);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.gcval{font-size:22px;font-weight:700;letter-spacing:-.5px}
.gcsub{font-size:13px;color:var(--g6);margin-top:4px;line-height:1.45}
.cg{color:var(--green)}.co{color:var(--orange)}.cr{color:var(--red)}.cp{color:var(--purple)}.cy{color:var(--yellow)}
.msec{padding:0 16px 8px}
.mi{display:flex;align-items:flex-start;gap:11px;background:var(--card2);
  border-radius:12px;padding:11px 13px;margin-bottom:7px}
.mdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.mtxt{font-size:14px;line-height:1.45}
.closebtn{float:right;margin:14px 18px 0 0;background:var(--g3);border:none;border-radius:50%;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--g6);font-size:18px;line-height:1}

/* CATS TAB */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:6px}
.cc{background:var(--card);border-radius:var(--r);padding:15px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .1s}
.cc:active{background:var(--card2)}
.ccode{font-size:26px;font-weight:800;letter-spacing:-1px;margin-bottom:3px}
.camt{font-size:16px;font-weight:600;margin-bottom:2px}
.clbl{font-size:11px;color:var(--g6);line-height:1.4}

/* EMPTY */
.empty{text-align:center;padding:60px 32px;color:var(--g6)}
.empty .ei{font-size:48px;margin-bottom:12px}
.empty .et{font-size:16px;font-weight:500;color:var(--text);margin-bottom:6px}
mark{background:rgba(0,113,227,.28);color:inherit;border-radius:2px;padding:0 1px}

/* ── Multi-select basket ── */
.row.sel{background:rgba(10,132,255,.13);}
.row.sel .chk{color:#0a84ff;}
.chk{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--g5);}
#basket{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--g2);border-top:1px solid var(--sep);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:none;flex-direction:column;gap:8px;}
#basket.on{display:flex;}
.bk-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.bk-ttl{font-size:13px;color:var(--g5);}
.bk-amt{font-size:24px;font-weight:700;color:#0a84ff;}
.bk-sub{font-size:12px;color:var(--g5);margin-top:2px;}
.bk-btns{display:flex;gap:8px;}
.bk-btn{padding:8px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;}
.bk-clear{background:var(--g3);color:var(--text);}
.bk-detail{background:#0a84ff;color:#fff;}
#selmode-btn{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:150;
  background:var(--g3);border:none;border-radius:20px;padding:6px 14px;
  font-size:13px;font-weight:600;color:var(--text);cursor:pointer;touch-action:manipulation;}
#selmode-btn.on{background:#0a84ff;color:#fff;}
/* basket summary sheet */
#bk-sheet{padding:0 0 16px;}
.bk-item{display:flex;justify-content:space-between;align-items:flex-start;
  padding:10px 16px;border-bottom:.5px solid var(--sep);gap:12px;}
.bk-item-ttl{font-size:14px;color:var(--text);flex:1;}
.bk-item-art{font-size:12px;color:var(--g5);margin-top:2px;}
.bk-item-amt{font-size:15px;font-weight:700;flex-shrink:0;}
.bk-item-amt.primary{color:#0a84ff;}
.bk-item-amt.concurrent{color:#ff9f0a;}
.bk-total-row{display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;margin-top:4px;}
.bk-total-lbl{font-size:15px;font-weight:600;}
.bk-total-val{font-size:28px;font-weight:700;color:#0a84ff;}
.bk-measures-hdr{padding:10px 16px 4px;font-size:13px;font-weight:600;color:var(--g5);text-transform:uppercase;letter-spacing:.5px;}
.bk-mitem{padding:6px 16px;font-size:13px;color:var(--text);}
.bk-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:6px;}
.bk-badge.primary{background:rgba(10,132,255,.2);color:#0a84ff;}
.bk-badge.concurrent{background:rgba(255,159,10,.2);color:#ff9f0a;}

.art-header{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:var(--g3);border-radius:10px;margin:6px 12px 2px;cursor:pointer;font-weight:600;font-size:14px;color:var(--text)}
.art-header:active{opacity:.7}
.art-cnt{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.art-arrow{font-size:10px;color:var(--blue)}
.art-body{margin:0 12px 4px}

.desc-art{font-size:12px;color:var(--text2);margin-top:5px;line-height:1.5;white-space:normal}
.art-row{align-items:flex-start}

.art-subj{font-size:11px;color:var(--blue);font-weight:400;margin-top:2px}

.art-law-box{margin:8px 0 10px;background:var(--g2);border-radius:10px;border-left:3px solid var(--blue);overflow:hidden}
.art-law-title{font-size:12px;font-weight:700;color:var(--blue);padding:8px 12px 4px}
.art-law-text{font-size:11.5px;color:var(--text2);padding:4px 12px 10px;max-height:220px;overflow-y:auto;line-height:1.6;white-space:pre-wrap}
</style>
</head>

<div class="hdr">
  <h1>MyKOK</h1>

</div>

<div class="vtabs" id="vtabs">

  <button class="tab" onclick="setTab('az',this)">Α–Ω</button>
  <button class="tab" onclick="setTab('art',this)">Κατ' Άρθρο</button>
</div>

<div class="main" id="main"></div>

<div class="ov" id="ov" onclick="ovClick(event)">
  <div class="sht" id="sht">

    <button class="closebtn" onclick="closeSheet()">✕</button>

  </div>
</div>

const ARTICLE_TEXT = {
  4: {title:`Ορισμοί`,text:`Για τους σκοπούς του παρόντος ισχύουν οι παρακάτω ορισμοί:\n1. «Αντανακλαστικό στοιχείο»: Αντικείμενο που χρησιμοποιείται για να δείχνει την παρουσία οχήματος με αντανάκλαση φωτός που δεν προέρχεται από αυτό το όχημα.\n2. «Απόβαρο κενού οχήματος»: Το βάρος του οχήματος χωρίς πλήρωμα, επιβάτες ή φορτίο, αλλά με τη δεξαμενή καυσίμου γεμάτη καύσιμα, μέχρι το ενενήντα τοις εκατό (90%) της χωρητικότητας, με ψυκτικό μέσο, λιπαντικά, τα συνήθως φερόμενα εργαλεία και τον εφεδρικό τροχό.\n3. «Απόβαρο οχήματος σε ετοιμότητα λειτουργίας»: Το απόβαρο του κενού οχήματος μαζί με το βάρος του πληρώματος.\n4. «Αυτοκίνητο ή αυτοκίνητο όχημα»: Το μηχανοκίνητο όχημα, το οποίο χρησιμοποιείται κυρίως για τη μεταφορά προσώπων ή πραγμάτων ή για τη ρυμούλκηση στις οδούς οχημάτων που χρησιμοποιούνται για τη μεταφορά προσώπων ή πραγμάτων. Ο όρος αυτός δεν περιλαμβάνει τα οχήματα, όπως οι γεωργικοί ελκυστήρες, τα οποία χρησιμοποιούνται παρεμπιπτόντως μόνο για την οδική μεταφορά προσώπων ή πραγμάτων ή για ρυμούλκηση, στις οδούς, οχημάτων που χρησιμοποιούνται για τη μεταφορά προσώπων ή πραγμάτων.\n5. «Αυτοκίνητο δημόσιας χρήσης»: Το αυτοκίνητο όχημα με το οποίο εκτελούνται μεταφορές προσώπων ή πραγμάτων ή μικτές με ολική ή μερική μίσθωση ή με κόμιστρο ανά επιβάτη.\n6. «Αυτοκίνητο επιβατηγό»: Το προοριζόμενο κυρίως για τη μεταφορά προσώπων αυτοκίνητο όχημα, το οποίο διαθέτει κατ’ ανώτατο όριο εννέα (9) θέσεις, μαζί με τη θέση του οδηγού.\n7. «Αυτοκίνητο ιδιωτικής χρήσης»: Το αυτοκίνητο όχημα με το οποίο εκτελούνται μεταφορές προσώπων χωρίς κόμιστρο και πραγμάτων που ανήκουν στον ιδιοκτήτη ή κάτοχο αυτού.\n8. «Αυτοκίνητο λεωφορείο»: Το αυτοκίνητο όχημα που προορίζεται κυρίως για τη μεταφορά προσώπων και το οποίο διαθέτει τουλάχιστον δέκα (10) θέσεις, συμπεριλαμβανομένης και της θέσης του οδηγού.\n9. «Αυτοκίνητο φορτηγό»: Το αυτοκίνητο όχημα που προορίζεται κυρίως για τη μεταφορά πραγμάτων.\n10. «Αυτοκινητοδρόμιο»: Ειδικό γήπεδο ή χώρος κατάλληλα διαμορφωμένος που προορίζεται για αγώνες ταχύτητας, δεξιοτεχνίας, επίδειξης ή αντοχής αυτοκινήτων ή μοτοσικλετών, ασκήσεις οδήγησης και ψυχαγωγίας, καθώς επίσης και δοκιμές μηχανοκίνητων οχημάτων με σκοπό τον έλεγχο της καλής λειτουργίας τους.\n11. «Αυτοκινητόδρομος»: Οδός ειδικής μελέτης και κατασκευής για την κυκλοφορία αυτοκινήτων οχημάτων και μοτοσικλετών, η οποία δεν εξυπηρετεί τις συνορεύουσες με αυτήν ιδιοκτησίες και η οποία:\nα) διαθέτει, εκτός ειδικών σημείων ή προσωρινά, χωριστά οδοστρώματα για τις δύο κατευθύνσεις της κυκλοφορίας, που διακρίνονται μεταξύ τους είτε με διαχωριστικές νησίδες είτε, κατ’ εξαίρεση, με άλλα μέσα,\nβ) δεν διασταυρώνεται ισόπεδα με άλλη οδό, μονοπάτι, σιδηροδρομική ή τροχιοδρομική γραμμή και\nγ) έχει χαρακτηριστεί με απόφαση του Υπουργού Υποδομών και Μεταφορών και έχει ειδική σήμανση με πινακίδες ως αυτοκινητόδρομος.\n12. «Δεξιά κατεύθυνση κυκλοφορίας»: Η επί της οδού διπλής κατεύθυνσης κυκλοφορίας κίνηση, με τρόπο ώστε στην αριστερή πλευρά του οδηγού να κινούνται οι αντίθετα ερχόμενοι.\n13. «Δημόσια κυκλοφορία»: Η αόριστη και απροσδιόριστη εκ των προτέρων κυκλοφορία σε δημόσιες ή ιδιωτικές οδούς ή χώρους πεζών, οχημάτων ή ζώων.\n14. «Διάβαση πεζών»: Το τμήμα του οδοστρώματος που ορίζεται με ειδική σήμανση ή διαγράμμιση ή σηματοδότηση για τη διέλευση των πεζών.\n15. «Διακοπή πορείας»: Η σύντομη ακινησία του οχήματος είτε για την αποφυγή σύγκρουσης με εμπόδιο ή εμπλοκής με άλλο όχημα, πεζό ή ζώο που χρησιμοποιεί την οδό είτε για συμμόρφωση με τους κανονισμούς της κυκλοφορίας.\n16. «Διαχωριστική νησίδα»: Το υπερυψωμένο ή με άλλους τρόπους οριζόμενο τμήμα οδού, το οποίο χωρίζει λωρίδες κυκλοφορίας οχημάτων ή οδοστρώματα της αυτής ή αντίθετης κατεύθυνσης και επί του οποίου απαγορεύεται η κυκλοφορία, με εξαίρεση τη διέλευση πεζών, όπου αυτή επιτρέπεται.\n17. «Ελαφρύ προσωπικό ηλεκτρικό όχημα (Ε.Π.Η.Ο.)»: Το όχημα που κινείται με ηλεκτροκινητήρα και δεν υπάγεται στο πεδίο εφαρμογής του Κανονισμού 858/2018/ ΕΕ, του Κανονισμού 168/2013/ΕΕ, της Οδηγίας 2009/48/ ΕΚ και της Οδηγίας 2007/46/ΕΚ.\nα) Στα οχήματα αυτά υπάγονται τα κινούμενα με ηλεκτροκινητήρα:\nαα) πατίνια (e-scooters),\nαβ) τροχοπέδιλα (rollers) και τροχοσανίδες (skateboards),\nαγ) αυτοεξισορροπούμενα προσωπικά οχήματα, δηλαδή μηχανοκίνητα μονόκυκλα οχήματα ή μηχανοκίνητα δίκυκλα οχήματα διπλής τροχιάς, που βασίζονται σε εγγενή ασταθή ισορροπία και χρειάζονται βοηθητικό σύστημα ελέγχου για να διατηρούν την ισορροπία τους,\nαδ) Ε.Π.Η.Ο. που δεν υπάγονται σε κάποια κατηγορία εκ των ανωτέρω, στα οποία συμπεριλαμβάνονται ηλεκτροκίνητα αμαξίδια ατόμων με αναπηρία, ενισχυμένα και απλά, scooters και handbikes ατόμων με αναπηρία.\nβ) Τα Ε.Π.Η.Ο. διακρίνονται ανάλογα με την ταχύτητα κατασκευής σε:\nβα) οχήματα των οποίων η μέγιστη σχεδιαστική ταχύτητα δεν υπερβαίνει τα έξι (6) χιλιόμετρα την ώρα. Αυτά τα οχήματα θεωρούνται και κυκλοφορούν ως πεζοί,\nββ) οχήματα των οποίων η μέγιστη σχεδιαστική ταχύτητα υπερβαίνει τα έξι (6) χιλιόμετρα την ώρα, αλλά δεν υπερβαίνει τα είκοσι πέντε (25) χιλιόμετρα την ώρα. Θεωρούνται και κυκλοφορούν ως ποδήλατα, με την υποχρέωση τήρησης των κανόνων σήμανσης και σηματοδότησης και των απαιτήσεων των ποδηλάτων, εκτός αν ορίζεται διαφορετικά στα επιμέρους άρθρα.\n18. «Ελαφρό ρυμουλκούμενο»: Το ρυμουλκούμενο με μέγιστο επιτρεπόμενο βάρος μέχρι και επτακόσια πενήντα (750 kg) χιλιόγραμμα.\n19. «Επιβατηγά δημόσιας χρήσης (Ε.Δ.Χ.) αυτοκίνητα»: Τα επιβατηγά αυτοκίνητα που έχουν από κατασκευής έως εννέα (9) θέσεις, περιλαμβανομένης και της θέσης του οδηγού και μεταφέρουν επιβάτες αναλόγως προς την κατηγορία τους. Διακρίνονται σε:\nα) Ε.Δ.Χ. πέντε (5) θέσεων ή πολυμορφικά (ενός όγκου), με μετρητή (ΤΑΞΙ). Τα πολυμορφικά (ενός όγκου) ΤΑΞΙ εφόσον μπορούν να μεταφέρουν αναπηρικό αμαξίδιο πρέπει να έχουν στα εξαρτήματα ράμπα και ιμάντες στήριξης και ασφάλειας του αμαξιδίου, καθώς και οποιοδήποτε τεχνικό μέσο διευκολύνει την πρόσβαση των ατόμων με αναπηρία στο όχημα ταξί και επιτρέπεται να διενεργούν μεταφορά ατόμων με αναπηρία,\nβ) Ε.Δ.Χ. από έξι (6) έως εννέα (9) θέσεων Ειδικής Μίσθωσης (ΕΙΔΜΙΣΘ), χωρίς μετρητή. Τα Ε.Δ.Χ. ΕΙΔΜΙΣΘ αυ τοκίνητα που προορίζονται για τη μεταφορά ατόμων με αναπηρία πρέπει να είναι ειδικά διασκευασμένα για τον σκοπό αυτόν (ΕΙΔΜΙΣΘ ΑμΕΑ) και να εισπράττουν κόμιστρο όπως αυτό καθορίζεται με απόφαση του Υπουργού Υποδομών και Μεταφορών και\nγ) Ε.Δ.Χ. από πέντε (5) έως επτά (7) θέσεων Ειδικών Μεταφορών (ΕΙΔΜΕΤ) χωρίς μετρητή.\n20. «Έρεισμα»: Η πέραν του οδοστρώματος ακραία λωρίδα της οδού.\n21. «Ζώα»: Τα κατοικίδια και σταυλοδίαιτα ζώα.\n22. «Ηλεκτροκίνητο λεωφορείο (τρόλεϊ)»: Το αυτοκίνητο λεωφορείο που τροφοδοτείται από ηλεκτροφόρο γραμμή, διαθέτει ηλεκτροκινητήρα αλλά δεν κινείται επί σιδηροτροχιών.\n23. «Ημιρυμουλκούμενo (επικαθήμενο)»: Το ρυμουλκούμενο το κατασκευασμένο για σύνδεση με ρυμουλκό όχημα με τρόπο ώστε τμήμα αυτού να στηρίζεται επί του ρυμουλκού, επί του οποίου επιπίπτει μεγάλο μέρος του βάρους και του φορτίου του.\n24. «Ισόπεδος οδικός κόμβος»: Κάθε ισόπεδη συμβολή, διακλάδωση ή διασταύρωση οδών, συμπεριλαμβανομένων και των ελεύθερων χώρων που σχηματίζονται από αυτές.\n25. «Ισόπεδη σιδηροδρομική ή τροχιοδρομική διάβαση»: Κάθε ισόπεδη διασταύρωση μεταξύ οδού και σιδηροδρομικής ή τροχιοδρομικής γραμμής, η οποία έχει ίδια διαμόρφωση.\n26. «Κατοικημένη περιοχή»: Η περιοχή που έχει σημανθεί με πινακίδες ως κατοικημένη στις εισόδους και εξόδους της.\n27. «Λεωφορειόδρομος»: Οδός ή τμήμα οδού αποκλειστικής κυκλοφορίας λεωφορείων.\n28. «Λιμένας»: ζώνη ξηράς και θάλασσας μαζί με έργα και εξοπλισμό, που επιτρέπουν κυρίως την υποδοχή κάθε είδους πλωτών μέσων και σκαφών αναψυχής, τη φορτοεκφόρτωση, αποθήκευση, παραλαβή και προώθηση των φορτίων τους, την εξυπηρέτηση επιβατών και οχημάτων και την ανάπτυξη επιχειρηματικών δραστηριοτήτων, που συνδέονται άμεσα ή έμμεσα με τις θαλάσσιες μεταφορές.\n29. «Λωρίδα Έκτακτης Ανάγκης (Λ.Ε.Α.)»: Η επί αυτοκινητοδρόμου λωρίδα που βρίσκεται μεταξύ της ακραίας δεξιάς συνεχούς διαγράμμισης και του άκρου της οδού.\n30. «Λωρίδα κυκλοφορίας»: Μία των κατά μήκος ζωνών στις οποίες χωρίζεται το οδόστρωμα με ή χωρίς διαγραμμίσεις ή άλλα κατάλληλα διαχωριστικά μέσα, πλάτους επαρκούς για την κυκλοφορία μιας σειράς (στοίχου) οδικών οχημάτων.\n31. «Μέγιστο επιτρεπόμενο βάρος»: Το μέγιστο βάρος φορτωμένου οχήματος, το οποίο αναγράφεται ως επιτρεπόμενο στην άδεια κυκλοφορίας του.\n32. «Μέγιστη αποδεκτή μάζα φορτωμένου οχήματος (Μ.Α.Μ.Φ.Ο.)»: Η μέγιστη μάζα του φορτωμένου οχήματος που επιτρέπεται να κυκλοφορεί, η οποία αναγράφεται ως Μ.Α.Μ.Φ.Ο. στην άδεια κυκλοφορίας του.\n33. «Μηχάνημα αγροτικό»: Το μηχανοκίνητο όχημα που προορίζεται κυρίως για την εκτέλεση γεωργικών εργασιών (όπως αγρού, δάσους, κτηνοτροφικών, κηπευτικών και ανθοκομικών εκμεταλλεύσεων), τη μεταφορά προϊόντων ή προσώπων της αγροτικής εκμετάλλευσης του ιδιοκτήτη του αγροτικού μηχανήματος ή τη μεταφορά εφοδίων ή εργαλείων, είτε αυτοτελώς είτε με τη λειτουργία φερόμενων ή ελκόμενων μηχανημάτων, εργαλείων, ρυμουλκών. Ο όρος αυτός περιλαμβάνει:\nα) τους γεωργικούς ελκυστήρες κάθε μορφής και\nβ) τις αυτοπροωθούμενες μηχανές εκτέλεσης γεωργικών εργασιών. Στις άδειες κυκλοφορίας αναγράφονται υποχρεωτικά τα βάρη και οι διαστάσεις του αγροτικού μηχανήματος.\n34. «Μηχάνημα έργου»: Το μηχανοκίνητο όχημα που προορίζεται για την κατασκευή και συντήρηση οδικών ή άλλων τεχνικών έργων. Ο όρος αυτός περιλαμβάνει και τα οχήματα που προορίζονται για την αποκατάσταση της κυκλοφορίας, τον καθαρισμό και τη σήμανση των οδών. Δεν υπάγονται στην κατηγορία των μηχανημάτων έργου, θεωρούμενα ως αυτοκίνητα, τα μηχανοκίνητα οχήματα που εκτελούν και μεταφορά επιβατών ή εμπορευμάτων επί των οδών της Χώρας, καθώς και τα Οχήματα Ειδικής Χρήσης Ειδικού Σκοπού.\n35. «Μικτό βάρος»: Το εκάστοτε πραγματικό βάρος του οχήματος στο οποίο συνυπολογίζεται το βάρος του φορτίου, του πληρώματος και των επιβατών.\n36. «Μοτοποδήλατο»: ελαφρύ μηχανοκίνητο δίκυκλο, τρίκυκλο ή τετράκυκλο όχημα, με μέγιστη σχεδιαστική ταχύτητα σαράντα πέντε (45) χιλιομέτρων την ώρα. Αυτά τα οχήματα είναι τα εξής:\nα) το δίκυκλο μοτοποδήλατο (L1e-B) με κινητήρα κυβισμού μικρότερου από ή ίσου με πενήντα κυβικά εκατοστά (50 cm3), εάν η διάταξη πρόωσης του οχήματος περιλαμβάνει έναν κινητήρα εσωτερικής καύσης επιβαλλόμενης ανάφλεξης (positive ignition PI) ή με κινητήρα μέγιστης συνεχούς ονομαστικής ή καθαρής ισχύος μικρότερης από ή ίσης με τέσσερα κιλοβάτ (4 kW),\nβ) το τρίκυκλο μοτοποδήλατο (L2e): τρίκυκλα με κινητήρα κυβισμού μικρότερου από ή ίσου με πενήντα κυβικά εκατοστά (50 cm3) με κυβισμό κινητήρα μικρότερου από ή ίσου με πενήντα κυβικά εκατοστά (50 cm3) για κινητήρα PI ή μικρότερου από ή ίσου με πεντακόσια κυβικά εκατοστά (500 cm3) για κινητήρα ανάφλεξης με συμπίεση (compression ignition CI) ή με κινητήρα μέγιστης συνεχούς ονομαστικής ή καθαρής ισχύος μικρότερης από ή ίσης με τέσσερα κιλοβάτ (4 kW) και μάζα σε κατάσταση ετοιμότητας προς κυκλοφορία μικρότερης από διακόσια εβδομήντα (270) χιλιόγραμμα (kg) και τα οποία διαθέτουν έως δύο (2) θέσεις καθίσματος, συμπεριλαμβανομένης της θέσης καθίσματος του οδηγού,\nγ) το μηχανοκίνητο δίκυκλο (L1e-A), τρίκυκλο ή τετράκυκλο ποδήλατο: ποδήλατα που έχουν σχεδιαστεί για ποδηλάτηση, με βοηθητική μηχανή πρόωσης για υποβοήθηση της ποδηλάτησης με μέγιστη συνεχή ονομαστική ή καθαρή ισχύ μικρότερη από ή ίση με ένα κιλοβάτ (1 kW) και διακοπή της ισχύος της σε ταχύτητες οχήματος μικρότερες από ή ίσες με είκοσι πέντε (25) χιλιόμετρα την ώρα,\nδ) το ελαφρύ τετράκυκλο (L6e), με μάζα σε κατάσταση ετοιμότητας προς κυκλοφορία μικρότερης από ή ίσης με τετρακόσια είκοσι πέντε χιλιόγραμμα (425 kg) με κυβισμό κινητήρα μικρότερου από ή ίσου με πενήντα κυβικά εκατοστά (50 cm3) για κινητήρα PI ή μικρότερου από ή ίσου με πεντακόσια κυβικά εκατοστά (500 cm3) για κινητήρα CI και διαθέτουν έως δύο (2) θέσεις καθίσματος, συμπεριλαμβανομένης της θέσης καθίσματος του οδηγού. Ως «καθαρή ισχύς» λογίζεται η μέγιστη συνεχής ονομαστική ισχύς για τα ηλεκτροκίνητα οχήματα και η μέγιστη καθαρή ισχύς για τα οχήματα με κινητήρα καύσης.\n37. «Μοτοσικλέτα»: Κάθε δίτροχο μηχανοκίνητο όχημα με ή χωρίς καλάθι, του οποίου είτε η μέγιστη εκ κατασκευής ταχύτητα είναι μεγαλύτερη των σαράντα πέντε (45) χιλιομέτρων την ώρα είτε, εάν είναι εξοπλισμένο με κινητήρα εσωτερικής καύσης, ο κυλινδρισμός του κινητήρα είναι μεγαλύτερος των πενήντα κυβικών εκατοστών (50 cm3).\n38. «Νησίδα ασφαλείας»: Το υπερυψωμένο τμήμα οδοστρώματος που προορίζεται είτε για καταφύγιο των πεζών είτε για την αποβίβαση επιβίβαση επιβατών σε συγκοινωνιακά μέσα.\n39. «Νύχτα»: Η χρονική περίοδος η οποία αρχίζει μισή ώρα μετά τη δύση του ηλίου και λήγει μισή ώρα πριν από την ανατολή αυτού. Οι διατάξεις του Κώδικα οι οποίες επιβάλλουν ειδικές υποχρεώσεις κατά τη νύχτα εφαρμόζονται ανάλογα και στις περιπτώσεις κατά τις οποίες η ορατότητα είναι ανεπαρκής, λόγω ειδικών συνθηκών (όπως ομίχλης, χιονόπτωσης και ραγδαίας βροχής ή μέσα σε σήραγγες).\n40. «Οδηγός»: Πρόσωπο το οποίο οδηγεί κάθε είδους όχημα ή ζώα μεμονωμένα ή σε αγέλες και ποίμνια ή ζώα όταν χρησιμοποιούνται για έλξη, για τη μεταφορά προσώπων ή πραγμάτων ή ίππευση.\n41. «Οδός»: ολόκληρη η επιφάνεια που προορίζεται για τη δημόσια κυκλοφορία.\n42. «Οδός εξυπηρέτησης παροδίων»: οδός η οποία χρησιμοποιείται αποκλειστικά για την εξυπηρέτηση των παροδίων ιδιοκτησιών.\n43. «Οδός προτεραιότητας»: οδός ειδικά χαρακτηρισμένη και σημασμένη όπου η κυκλοφορία των οδικών οχημάτων σε αυτήν, έχει προτεραιότητα έναντι των εισερχόμενων σε αυτήν από άλλες οδούς.\n44. «Οδός ταχείας κυκλοφορίας»: οδός ειδικής μελέτης και κατασκευής για την κυκλοφορία αυτοκινήτων οχημάτων και μοτοσικλετών, η οποία δεν εξυπηρετεί τις συνορεύουσες με αυτήν ιδιοκτησίες παρά μόνο με παράπλευρες βοηθητικές οδούς και κόμβους και η οποία:\nα) συνδέεται μόνο με ειδικής διάταξης ισόπεδους ή ανισόπεδους κόμβους με το υπόλοιπο κύριο οδικό δίκτυο,\nβ) δεν διασταυρώνεται ισόπεδα με άλλη οδό, μονοπάτι, σιδηροδρομική ή τροχιοδρομική γραμμή και\nγ) έχει χαρακτηριστεί με απόφαση του Υπουργού Υποδομών και Μεταφορών και έχει ειδική σήμανση με πινακίδες ως οδός ταχείας κυκλοφορίας.\n45. «Οδόστρωμα»: Το τμήμα της οδού που προορίζεται για την κυκλοφορία των οχημάτων.\n46. «Οριογραμμή οδοστρώματος»: Η γραμμή η οποία ορίζει το τέλος του οδοστρώματος. Επί οδοστρωμάτων στα οποία υπάρχουν μία ή περισσότερες ακραίες λωρίδες κυκλοφορίας ή ζώνες για τη χρήση ορισμένων κατηγοριών οχημάτων, πεζών ή ζώων, οριογραμμή οδοστρώματος είναι, για τους λοιπούς που χρησιμοποιούν την οδό, το τέλος του οδοστρώματος που απομένει.\n47. «Όχημα αρθρωτό»: ο συνδυασμός οχημάτων που περιλαμβάνει ένα (1) ρυμουλκό όχημα και ένα (1) ημιρυμουλκούμενο (επικαθήμενο) συνδεδεμένο με αυτό.\n48. «Όχημα Ειδικής Χρήσης Ειδικού Σκοπού»: Το αυτοκίνητο ή ρυμουλκούμενο όχημα που διαθέτει ειδικά τεχνικά χαρακτηριστικά που του επιτρέπουν την εκτέλεση λειτουργίας που απαιτεί ειδικές διαρρυθμίσεις και/ή εξοπλισμό.\n49. «Όχημα ζωήλατο»: Το όχημα με τροχούς που σύρεται από ζώα.\n50. «Όχημα Καρτ»: Το μικρό τετράτροχο όχημα, με ή χωρίς αμάξωμα, με τέσσερις μη ευθυγραμμισμένους τροχούς που ακουμπούν συνέχεια στο έδαφος, οι δύο από τους οποίους εξασφαλίζουν την οδήγηση και οι άλλοι δύο την πρόωση (κίνηση). Τα κύρια μέρη του είναι: το πλαίσιο ή σασί, το αμάξωμα, τα ελαστικό και ο κινητήρας.\n51. «Όχημα οδικό»: Το μεταφορικό ή άλλων χρήσεων μέσο που κινείται στις οδούς και στους χώρους του άρθρου 3, περί πεδίου εφαρμογής, και οδηγείται από πρόσωπο, με εξαίρεση των μέσων που χρησιμοποιούνται για τη μεταφορά βρεφών και ατόμων με αναπηρία. Δεν θεωρούνται ως οδικά οχήματα αυτά που κινούνται επί σιδηροτροχιών, για τα οποία όμως εφαρμόζονται κανόνες κυκλοφορίας του Κώδικα.\n52. «Όχημα μηχανοκίνητο»: Το αυτοπροωθούμενο οδικό όχημα, πλην των μοτοποδηλάτων και των Ε.Π.Η.Ο..\n53. «Όχημα χειροκίνητο»: Το όχημα που ωθείται ή σύρεται με τα χέρια.\n54. «Παραχώρηση προτεραιότητας»: Η υποχρέωση οδηγού οχήματος, να μη συνεχίσει ή επαναλάβει την κίνηση ή τους ελιγμούς του, εάν, ενεργώντας κατ’ αυτόν τον τρόπο, μπορεί να υποχρεώσει τους οδηγούς άλλων οχημάτων να μεταβάλλουν απότομα την κατεύθυνση ή την ταχύτητα των οχημάτων τους.\n55. «Πεζοδρόμιο»: Το υπερυψωμένο ή άλλως διαχωριζόμενο τμήμα της οδού που προορίζεται για πεζούς.\n56. «Πεζόδρομος»: Οδός η οποία χρησιμοποιείται αποκλειστικά από τους πεζούς και για είσοδο - έξοδο οχημάτων προς και από χώρους στάθμευσης παρόδιων ιδιοκτησιών και παρόδιων χρήσεων, σύμφωνα με τις επιτρεπόμενες χρήσεις γης της περιοχής ή χώρους στάθμευσης που έχουν λάβει άδεια λειτουργίας κατά παρέκκλιση των υφιστάμενων χρήσεων γης δυνάμει της παρ. 1 του άρθρου 19 του ν. 4313/2014 (Α’ 261), εκτός αν άλλως ορίζεται από τον κανονισμό λειτουργίας τους, καθώς και για οχήματα εφοδιασμού ή έκτακτης ανάγκης. Είναι δυνατή η κυκλοφορία ποδηλάτων και Ε.Π.Η.Ο. σύμφωνα με την παρ. 3 του άρθρου 55, περί μέτρων ρύθμισης οδικής κυκλοφορίας.\n57. «Πεζοί»:\nα) τα πρόσωπα που σπρώχνουν ή σύρουν:\nαα) βρεφικά οχήματα,\nαβ) καθίσματα ασθενών ή αμαξίδια ατόμων με αναπηρία,\nαγ) οποιοδήποτε μικρό όχημα χωρίς κινητήρα ή δίκυκλο ή τρίκυκλο όχημα με κινητήρα, ο οποίος δεν είναι σε λειτουργία,\nαδ) ποδήλατα,\nβ) τα πρόσωπα που κινούνται σε:\nβα) μηχανοκίνητα ή μη, αμαξίδια ασθενών ή ατόμων με αναπηρία που η ταχύτητα κίνησής τους δεν ξεπερνά την ταχύτητα του πεζού,\nββ) μη μηχανοκίνητα τροχήλατα καθίσματα, τροχοπέδιλα, τροχοσανίδες και πατίνια που η ταχύτητα κίνησής τους δεν ξεπερνά την ταχύτητα του πεζού,\nβγ) Ε.Π.Η.Ο. των οποίων η μέγιστη σχεδιαστική ταχύτητα δεν υπερβαίνει τα έξι (6) χιλιόμετρα την ώρα.\n58. «Περιοχή ήπιας κυκλοφορίας»: Περιοχή κατοικίας και πολεοδομικών κέντρων, που έχει χαρακτηρισθεί και σημανθεί ως περιοχή ήπιας κυκλοφορίας.\n59. «Ποδήλατο»: Το όχημα δύο τουλάχιστον τροχών το οποίο κινείται με τη μυϊκή δύναμη εκείνων που επιβαίνουν και μπορεί να υποβοηθείται με βοηθητικό ηλεκτροκινητήρα μέγιστης συνεχούς ονομαστικής ισχύος μηδέν κόμμα είκοσι πέντε κιλοβάτ (0,25 kW) και η ισχύς του οποίου μειώνεται σταδιακά και τελικά μηδενίζεται όταν η ταχύτητα του οχήματος φθάσει τα είκοσι πέντε (25) χιλιόμετρα την ώρα ή νωρίτερα, εάν σταματήσει η ποδηλάτηση.\n60. «Ποδηλατοδρόμος»: Οδός ή τμήμα οδού αποκλειστικής κυκλοφορίας ποδηλάτων και των Ε.Π.Η.Ο.. Στους ποδηλατόδρομους που καταλαμβάνουν όλο το πλάτος της οδού (οδοί ποδηλάτων) επιτρέπονται η είσοδος - έξοδος οχημάτων και η κυκλοφορία πεζών σύμφωνα με την παρ. 7 του άρθρου 44, περί ειδικών κανόνων για τους οδηγούς ποδηλάτων, μοτοποδηλάτων, μοτοσικλετών, τρίτροχων οχημάτων και Ε.Π.Η.Ο..\n61. «Ρυμουλκό»: Το μηχανοκίνητο όχημα που χρησιμοποιείται μόνο για την έλξη άλλων οχημάτων.\n62. «Ρυμουλκούμενο»: Το όχημα που στερείται ιδίας κινητήριας δύναμης και είναι κατασκευασμένο με τρόπο ώστε να έλκεται από άλλο μηχανοκίνητο όχημα. Στην κατηγορία των οχημάτων αυτών περιλαμβάνονται και τα ημιρυμουλκούμενα. Στα ρυμουλκούμενα δεν περιλαμβάνεται τροχοφόρος εξοπλισμός για τη μεταφορά φορτίου που έλκεται ή ρυμουλκείται με τη χρήση ειδικού εξοπλισμού αποκλειστικά εντός κλειστού χώρου, και αποτελείται από άκαμπτο οριζόντιο επίπεδο αμάξωμα επί συμπαγών τροχών μικρής διαμέτρου χωρίς αεροθάλαμο.\n63. «Στάθμευση»: Η ακινησία του οχήματος για οποιονδήποτε λόγο, πλην της ανάγκης αποφυγής εμπλοκής του με άλλο όχημα που χρησιμοποιεί την οδό ή σύγκρουσης με εμπόδιο ή για τη συμμόρφωσή του με τους κανονισμούς κυκλοφορίας, εφόσον η χρονική περίοδος ακινητοποίησης του οχήματος δεν περιορίζεται στον απαιτούμενο χρόνο για την επιβίβαση ή αποβίβαση επιβατών ή φόρτωση ή εκφόρτωση πραγμάτων.\n64. «Στάση»: Η ακινησία του οχήματος επί χρόνο απαιτούμενο για την επιβίβαση ή αποβίβαση επιβατών ή φόρτωση ή εκφόρτωση πραγμάτων.\n65. «Συνδυασμός οχημάτων (συρμός)»: Τα οχήματα που είναι συνδεδεμένα και κινούνται ως μία μονάδα.\n66. «Τουριστικός λιμένας σκαφών αναψυχής (μαρίνα)»: Ο χερσαίος και θαλάσσιος χώρος που προορίζεται κατά κύριο λόγο, για την εξυπηρέτηση σκαφών αναψυχής, είτε για αγκυροβόλημα, είτε για μακροχρόνια ή παροδική χερσαία εναπόθεση, είτε για εξυπηρέτηση των διερχόμενων σκαφών (παρ. 1 του άρθρου 29 του ν. 2160/1993, Α’ 118).\n67. «Τρίτροχο όχημα»: Το μηχανοκίνητο όχημα με τρεις (3) συμμετρικούς τροχούς, του οποίου είτε η μέγιστη εκ κατασκευής ταχύτητα είναι μεγαλύτερη των σαράντα πέντε (45) χιλιομέτρων την ώρα είτε ο κυλινδρισμός του κινητήρα είναι μεγαλύτερος των πενήντα κυβικών εκατοστών (50 cm3), εάν είναι εξοπλισμένο με κινητήρα εσωτερικής καύσης. Επίσης, ως τρίτροχο όχημα λογίζεται και το τετράτροχο όχημα, εκτός των ελαφρών τετράτροχων οχημάτων της κατηγορίας των μοτοποδηλάτων, του οποίου το απόβαρο κενού οχήματος, μη συμπεριλαμβανομένου του βάρους του καυσίμου ή του μίγματος καυσίμου ελαίου ή των συσσωρευτών των ηλεκτρικών οχημάτων, δεν υπερβαίνει τα τετρακόσια χιλιόγραμμα (400 kg), όταν το όχημα προορίζεται για επιβατικές μεταφορές, ή τα πεντακόσια πενήντα χιλιόγραμμα (550 kg), όταν προορίζεται για μεταφορές εμπορευμάτων και του οποίου η μέγιστη καθαρή ισχύς δεν υπερβαίνει τα δεκαπέντε κιλοβάτ (15 kW).\n68. «Τροχιόδρομος»: Όχημα που κινείται επί σιδηροτροχιών κατά μήκος των οδών με ηλεκτροκινητήρα που τροφοδοτείται από ηλεκτροφόρο γραμμή και προορίζεται για τη μεταφορά προσώπων ή πραγμάτων.\n69. «Τροχόσπιτο»: Όχημα Ειδικής χρήσης - Ειδικού Σκοπού που διακρίνεται σε:\nα) Μηχανοκίνητο τροχόσπιτο: Όχημα μεταφοράς προσώπων με χώρο διαμονής που περιλαμβάνει τουλάχιστον τον εξής εξοπλισμό:\nαα) καθίσματα και τραπέζι (το τραπέζι μπορεί να είναι έτσι σχεδιασμένο, ώστε να αφαιρείται εύκολα),\nαβ) χώρο για ύπνο, ο οποίος μπορεί να δημιουργείται με μετατροπή των καθισμάτων,\nαγ) χώρο μαγειρείου,\nαδ) χώρο αποθήκευσης. Ο ανωτέρω εξοπλισμός πρέπει να είναι μόνιμα στερεωμένος στον χώρο διαμονής.\nβ) Ρυμουλκούμενο τροχόσπιτο: Ρυμουλκούμενο όχημα που είναι σχεδιασμένο για οδική χρήση και παρέχει κινητά καταλύματα και κατάλληλο εξοπλισμό, όπως ο ανωτέρω αναφερόμενος για τη διαμονή επιβατών, όταν είναι σταθμευμένο.\n70. «Φώτα δείκτη κατεύθυνσης (φλας)»: Τα φώτα του οχήματος που χρησιμοποιούνται για να προειδοποιούν τους λοιπούς χρήστες της οδού ότι ο οδηγός πρόκειται να αλλάξει κατεύθυνση προς τα δεξιά ή προς τα αριστερά.\n71. «Φώτα διασταύρωσης (μεσαία)»: Τα φώτα του οχήματος που χρησιμοποιούνται για τον φωτισμό της οδού μπροστά από το όχημα και τα οποία δεν προκαλούν θάμβωση ή δυσχέρεια στους οδηγούς που έρχονται αντίθετα και στους λοιπούς χρήστες της οδού.\n72. «Φώτα έκτακτης ανάγκης (σύστημα φωτεινού συναγερμού)»: Τα φώτα του οχήματος που αναβοσβήνουν και χρησιμοποιούνται όταν το όχημα έχει ακινητοποιηθεί και προκαλείται κίνδυνος για τους τρίτους από την ακινησία του οχήματος.\n73. «Φώτα θέσης μπροστά (μικρά)»: Τα φώτα του οχήματος που χρησιμοποιούνται για να διακρίνονται αυτό και το πλάτος του από μπροστά.\n74. «Φώτα θέσης πίσω (μικρά)»: Τα φώτα του οχήματος που χρησιμοποιούνται για να διακρίνονται αυτό και το πλάτος του από πίσω.\n75. «Φώτα στάθμευσης»: Τα φώτα που χρησιμοποιούνται για να δεικνύουν την παρουσία σταθμευμένου οχήματος. Αυτά μπορούν να αντικαθιστούν τα εμπρόσθια και τα οπίσθια φώτα θέσης.\n76. «Φώτα ομίχλης»: Τα φώτα του οχήματος που χρησιμοποιούνται για τη βελτίωση του φωτισμού της οδού σε περιπτώσεις ομίχλης, χιονόπτωσης, ραγδαίων βροχών, νεφών, καπνού ή κονιορτού.\n77. «Φώτα οπισθοπορείας»: Τα φώτα του οχήματος που χρησιμοποιούνται για τον φωτισμό της οδού πίσω από το όχημα και τα οποία προειδοποιούν ότι το όχημα πρόκειται να κινηθεί ή κινείται προς τα πίσω.\n78. «Φώτα τροχοπέδησης (φρένων)»: Τα φώτα του οχήματος που χρησιμοποιούνται για να ειδοποιούν αυτούς που κινούνται πίσω από το όχημα ότι ο οδηγός τροχοπεδεί (φρενάρει).\n79. «Φώτα πορείας (μεγάλα)»: Τα φώτα του οχήματος που χρησιμοποιούνται για φωτισμό της οδού σε μεγάλη απόσταση μπροστά του.\n80. «Φώτα όγκου»: Τα φώτα που τοποθετούνται σε ορισμένα οχήματα με κινητήρα και ορισμένα ρυμουλκούμενα κοντά στο ακρότατο σημείο του πλάτους και όσο πιο κοντά στο υψηλότερο σημείο του οχήματος και που χρησιμοποιούνται για να διακρίνεται με ευκρίνεια ο όγκος αυτού.\n81. «Φώτα πλευρικά»: Τα φώτα που τοποθετούνται επί των πλευρών του οχήματος για να δεικνύουν την παρουσία του από το πλάι.\n82. «Φώτα ειδικά»: Τα φώτα που χρησιμοποιούνται για επισήμανση είτε οχήματος που έχει προτεραιότητα είτε οχήματος ή ομάδας οχημάτων, η παρουσία των οποίων επί της οδού επιβάλλει στους λοιπούς χρήστες των οδών να λαμβάνουν ιδιαίτερες προφυλάξεις και ειδικότερα για επισήμανση φαλαγγών οχημάτων, υπερμεγεθών οχημάτων, καθώς και οχημάτων εξοπλισμού κατασκευών ή συντήρησης οδών.\n83. «Φωτιστική διάταξη οπίσθιας πινακίδας κυκλοφορίας»: Η διάταξη που επιτρέπει να εξασφαλίζεται ο φωτισμός του χώρου που προορίζεται για την οπίσθια πινακίδα κυκλοφορίας και που μπορεί να αποτελείται από διάφορα οπτικά στοιχεία.\n84. «Φώτα ημέρας»: Τα φώτα που χρησιμοποιούνται κατά τη διάρκεια της ημέρας για να καθιστούν ένα όχημα περισσότερο ορατό από μπροστά, όταν το όχημα είναι εν κινήσει.\n85. «Φωτιστική επιφάνεια»: Προκειμένου για φώτα, η ορατή επιφάνεια από την οποία προέρχεται το φως, προκειμένου δε για αντανακλαστικά στοιχεία, η ορατή επιφάνεια εκ της οποίας αντανακλάται το φως.`},
  6: {title:`Υποδείξεις και σήματα που δίνουν οι τροχονόμοι`,text:`1. Αυτοί που χρησιμοποιούν τις οδούς συμμορφώνονται αμέσως με τις πιο κάτω υποδείξεις και σήματα που δίνουν οι τροχονόμοι, όταν ρυθμίζουν την κυκλοφορία:\nα) βραχίονας υψωμένος κατακόρυφα, σημαίνει: προσοχή, διακοπή πορείας για όλους που χρησιμοποιούν την οδό, από όλες τις κατευθύνσεις πλην των οδηγών οι οποίοι δεν μπορούν να διακόψουν την πορεία του οχήματός τους αμέσως και ασφαλώς. Αν το σήμα αυτό δίνεται σε οδικό κόμβο, δεν απαιτείται τα οχήματα που βρίσκονται στον κόμβο να διακόψουν την πορεία τους.\nβ) βραχίονας ή βραχίονες τεντωμένοι οριζόντια σημαίνει: διακοπή πορείας για όλους που χρησιμοποιούν την οδό και πλησιάζουν από οποιαδήποτε κατεύθυνση η οποία διέρχεται κάθετα προς την οριζόμενη με τον τεντωμένο βραχίονα ή βραχίονες κατεύθυνση. Ο τροχονόμος που ρυθμίζει την κυκλοφορία μπορεί, αφού δώσει το σήμα αυτό, να κατεβάσει τον βραχίονα ή τους βραχίονές του. Η στάση αυτή σημαίνει ομοίως διακοπή πορείας γι’ αυτούς που κινούνται κατά μέτωπο και από πίσω από τον τροχονόμο.\nγ) κίνηση του χεριού προς ορισμένη κατεύθυνση σημαίνει: κίνηση των οχημάτων προς την υποδεικνυόμενη κατεύθυνση.\nδ) κινούμενο ερυθρό φως σημαίνει: διακοπή πορείας γι’ αυτούς που χρησιμοποιούν την οδό προς τους οποίους κατευθύνεται το φως.\n2. Οι τροχονόμοι, όταν οι ανάγκες της κυκλοφορίας το απαιτούν, μπορούν να επιβάλλουν επιτάχυνση ή επιβράδυνση της κυκλοφορίας, καθώς και διακοπή ή αλλαγή πορείας οχημάτων ή πεζών.\n3. Οι υποδείξεις και τα σήματα που δίνονται από τους τροχονόμους που ρυθμίζουν την κυκλοφορία υπερισχύουν των φωτεινών σηματοδοτών ρύθμισης της κυκλοφορίας ή των πινακίδων σήμανσης στις οδούς ή των διαγραμμίσεων ή συμβόλων στις οδούς, καθώς και των κανόνων κυκλοφορίας γενικά. Η ρύθμιση της κυκλοφορίας από τροχονόμο, με τρόπο αντίθετο από ενδείξεις των φωτεινών σηματοδοτών, γίνεται σε εξαιρετικές μόνο περιπτώσεις λήψης ειδικών και εκτάκτων μέτρων. Αν δεν είναι δυνατόν, μετά από προηγούμενη ειδοποίηση του τροχονόμου, να σβήσουν οι φωτεινοί σηματοδότες, η ως άνω ρύθμιση γίνεται με σήματα προς τους χρήστες της οδού και αφού βεβαιωθεί ο τροχονόμος ότι από την ενέργειά του αυτή δεν προκαλείται κίνδυνος ατυχημάτων.\n4. Οι τροχονόμοι, όταν ρυθμίζουν την κυκλοφορία, πρέπει να διακρίνονται ευκρινώς από απόσταση τόσο κατά τη νύχτα όσο και κατά την ημέρα. 5. H παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε2-Β.`},
  7: {title:`Σήμανση οδών με πινακίδες`,text:`1. Οι πινακίδες οι οποίες τοποθετούνται για τη σήμανση των οδών ανήκουν στις εξής κατηγορίες:\nα) Αναγγελίας κινδύνου (Κ), δηλωτικές:\nαα) επικίνδυνων θέσεων,\nαβ) προσβάσεων οδικών κόμβων,\nαγ) προσβάσεων ισόπεδων σιδηροδρομικών διαβάσεων ή διαβάσεων τροχιοδρόμου,\nβ) Ρυθμιστικές της κυκλοφορίας (Ρ), δηλωτικές:\nβα) προτεραιότητας,\nββ) απαγορεύσεων ή περιορισμών,\nβγ) υποχρεώσεων.\nγ) Πληροφοριακές (Π), δηλωτικές:\nγα) προειδοποίησης κατευθύνσεων,\nγβ) κατευθύνσεων,\nγγ) αριθμήσεων οδών και χιλιομετρήσεων,\nγδ) τοπωνυμιών,\nγε) επιβεβαιώσεων,\nγστ) χρήσιμων πληροφοριών για τους οδηγούς οχημάτων και\nγζ) εγκαταστάσεων.\nδ) Πρόσθετες (Πρ).\n2. Οι πινακίδες αναγγελίας κινδύνου (Κ-1 μέχρι και Κ-44) τοποθετούνται για να εφιστούν την προσοχή αυτών που χρησιμοποιούν τις οδούς για τους κινδύνους που υπάρχουν στην οδό προς την κατεύθυνση της κίνησής τους, ώστε να λαμβάνουν έγκαιρα τα κατάλληλα μέτρα και, σε περίπτωση ανάγκης, να μειώνουν την ταχύτητα πορείας τους για να τους αποφεύγουν. Η σημασία των πινακίδων αυτών είναι:\nα) Κ-1α: Επικίνδυνη αριστερή στροφή.\nβ) Κ-1δ: Επικίνδυνη δεξιά στροφή.\nγ) Κ-2α: Επικίνδυνες δύο αντίρροπες ή διαδοχικές (συνεχείς) στροφές, η πρώτη αριστερά.\nδ) Κ-2δ: Επικίνδυνες δύο αντίρροπες ή διαδοχικές (συνεχείς) στροφές, η πρώτη δεξιά.\nε) Κ-3: Επικίνδυνη κατωφέρεια (με κλίση ως η αναγραφόμενη στην πινακίδα).\nστ) Κ-4: Απότομη ανωφέρεια (με κλίση ως η αναγραφόμενη στην πινακίδα).\nζ) Κ-5: Επικίνδυνη στένωση οδοστρώματος και στις δύο πλευρές.\nη) Κ-6α: Επικίνδυνη στένωση οδοστρώματος στην αριστερή πλευρά.\nθ) Κ-6δ: Επικίνδυνη στένωση οδοστρώματος στη δεξιά πλευρά.\nι) Κ-7: Κινητή γέφυρα.\nια) Κ-8: Η οδός οδηγεί σε αποβάθρα ή όχθη ποταμού.\nιβ) Κ-9: Επικίνδυνο ανώμαλο οδόστρωμα, σε κακή κατάσταση, με λάκκους, κ.λπ.\nιγ) Κ-10: Επικίνδυνο υπερυψωμένο οδόστρωμα ή απότομη κυρτή αλλαγή της κατά μήκος κλίσης της οδού.\nιδ) Κ-11: Επικίνδυνο κάθετο ρείθρο (αυλάκι) ή απότομη κοίλη αλλαγής της κατά μήκος κλίσης της οδού.\nιε) Κ-12: Ολισθηρό οδόστρωμα.\nιστ) Κ-13: Επικίνδυνη εκτίναξη χαλίκων (ασύνδετο αμμοχάλικο).\nιζ) Κ-14: Κίνδυνος από πτώση βράχων και από την παρουσία τους στο οδόστρωμα.\nιη) Κ-15: Κίνδυνος λόγω διάβασης πεζών.\nιθ) Κ-16: Κίνδυνος λόγω συχνής κίνησης παιδιών (σχολεία, γήπεδα, κ.λπ.).\nκ) Κ-17: Κίνδυνος λόγω συχνής εισόδου ή διάβασης ποδηλατιστών.\nκα) Κ-18: Κίνδυνος από τη διέλευση οικόσιτων ζώων.\nκβ) Κ-19: Κίνδυνος από τη διέλευση άγριων ζώων.\nκγ) Κ-20: Κίνδυνος λόγω εκτελούμενων εργασιών στην οδό.\nκδ) Κ-21: Προσοχή, κόμβος ή θέση όπου η κυκλοφορία ρυθμίζεται με τρίχρωμη φωτεινή σηματοδότηση.\nκε) Κ-22: Κίνδυνος λόγω χαμηλής πτήσης προσγειούμενων ή απογειούμενων αεροσκαφών. κστ) Κ-23: Κίνδυνος λόγω συχνού ισχυρού ανέμου (που έχει την κατεύθυνση που δείχνει το ανεμούριο).\nκζ) Κ-24: Προαναγγελία διπλής κυκλοφορίας. Η πινακίδα αυτή σημαίνει επικείμενη είσοδο από μονόδρομο ή από τμήμα οδού που περιλαμβάνει δύο καταστρώματα χωρισμένα ανά κατεύθυνση με μεσαία διαχωριστική νησίδα, σε τμήμα οδού με κυκλοφορία επί του αυτού οδοστρώματος προς τις δύο κατευθύνσεις, προσωρινά ή μόνιμα.\nκη) Κ-25: Προσοχή, άλλοι κίνδυνοι (μη δηλούμενοι στις πινακίδες Κ-1 έως Κ-24).\nκθ) Κ-26: Προσοχή, διασταύρωση όπου ισχύει η προτεραιότητα από δεξιά.\nλ) Κ-27: Διασταύρωση με οδό, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.\nλα) Κ-28α: Διακλάδωση με κάθετη οδό αριστερά, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.\nλβ) Κ-28δ: Διακλάδωση με κάθετη οδό δεξιά, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.\nλγ) Κ-29α: Διακλάδωση με λοξή οδό αριστερά, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.\nλδ) Κ-29δ: Διακλάδωση με λοξή οδό δεξιά, οι επί της οποίας κινούμενοι οφείλουν να παραχωρήσουν προτεραιότητα.\nλε) Κ-30: Προσέγγιση σε κυκλική υποχρεωτική πορεία. λστ) Κ-31: Κίνδυνος λόγω ισόπεδης σιδηροδρομικής διάβασης ή διάβασης τροχιοδρόμου με κινητά φράγματα.\nλζ) Κ-32: Κίνδυνος λόγω ισόπεδης σιδηροδρομικής διάβασης χωρίς κινητά φράγματα.\nλη) Κ-33, Κ-34, Κ-35: Πρόσθετες επαναληπτικές πινακίδες στις προσβάσεις ισόπεδων σιδηροδρομικών διαβάσεων ή κινητών γεφυρών, οι οποίες δηλώνουν την προσέγγιση σε αυτές.\nλθ) Κ-36: Κίνδυνος λόγω άμεσης γειτονιάς ισόπεδης σιδηροδρομικής διάβασης, χωρίς κινητά φράγματα, μονής σιδηροδρομικής γραμμής ή διάβασης τροχιοδρόμου.\nμ) Κ-37: Κίνδυνος λόγω άμεσης γειτονίας ισόπεδης σιδηροδρομικής διάβασης, χωρίς κινητά φράγματα, δι πλής ή πολλαπλής σιδηροδρομικής γραμμής ή διάβασης τροχιοδρόμου.\nμα) Κ-38α: Επικίνδυνο έρεισμα αριστερά.\nμβ) Κ-38δ: Επικίνδυνο έρεισμα δεξιά.\nμγ) Κ-39: Συχνή κυκλοφοριακή συμφόρηση.\nμδ) Κ-40: Σήραγγα.\nμε) Κ-41: Κίνδυνος λόγω ισόπεδης διάβασης τροχιοδρόμου χωρίς κινητά φράγματα. μστ) Κ-42: Κίνδυνος λόγω ομίχλης.\nμζ) Κ-43: Κίνδυνος λόγω παράλληλων διαβάσεων πεζών και ποδηλάτων.\nμη) Κ-44: Κίνδυνος λόγω κοινής διάβασης πεζών και ποδηλάτων.\n3. Οι ρυθμιστικές της κυκλοφορίας πινακίδες (Ρ-1 μέχρι Ρ-77) τοποθετούνται για να πληροφορούν αυτούς που χρησιμοποιούν τις οδούς για τις ειδικές υποχρεώσεις, περιορισμούς ή απαγορεύσεις, προς τις οποίες πρέπει αυτοί να συμμορφώνονται. Η σημασία των πινακίδων αυτών είναι:\nα) Ρ-1: Υποχρεωτική παραχώρηση προτεραιότητας. Η πινακίδα αυτή σημαίνει ότι στον κόμβο προ του οποίου τοποθετείται, οι οδηγοί πρέπει να παραχωρούν την προτεραιότητα στα οχήματα, τα οποία κινούνται στην άλλη οδό.\nβ) Ρ-2: Υποχρεωτική διακοπή πορείας:\nβα) Η πινακίδα αυτή, που τοποθετείται πριν από κόμβο, σημαίνει υποχρεωτική διακοπή πορείας του οχήματος πριν από την είσοδο στον κόμβο και παραχώρηση προτεραιότητας στα οχήματα τα οποία κινούνται στην οδό, προς την οποία πλησιάζει.\nββ) Η αυτή πινακίδα που τοποθετείται σε άλλα σημεία, πλην κόμβου, σημαίνει υποχρεωτική διακοπή πορείας του οχήματος στη θέση της πινακίδας και μη εκ νέου εκκίνηση μέχρις ότου βεβαιωθεί ο οδηγός του ότι μπορεί να το πράξει χωρίς κίνδυνο.\nγ) Ρ-3: Οδός προτεραιότητας.\nδ) Ρ-4: Τέλος οδού προτεραιότητας.\nε) Ρ-5: Προτεραιότητα της αντιθέτως ερχόμενης κυκλοφορίας λόγω στενότητας του οδοστρώματος.\nστ) Ρ-6: Προτεραιότητα, έναντι της επερχόμενης κυκλοφορίας (λόγω στενότητας οδοστρώματος).\nζ) Ρ-7: Απαγορεύεται η είσοδος σε όλα τα οχήματα.\nη) Ρ-8: Κλειστή οδός για όλα τα οχήματα και προς τις δύο κατευθύνσεις.\nθ) Ρ-9: Απαγορεύεται η είσοδος σε μηχανοκίνητα οχήματα εκτός των δίτροχων μοτοσικλετών.\nι) Ρ-10: Απαγορεύεται η είσοδος στις μοτοσικλέτες.\nια) Ρ-11: Απαγορεύεται η είσοδος στα ποδήλατα.\nιβ) Ρ-12: Απαγορεύεται η είσοδος στα μοτοποδήλατα.\nιγ) Ρ-13: Απαγορεύεται η είσοδος στα φορτηγά αυτοκίνητα. Η αναγραφή αριθμού τόνων, είτε με λευκό χρώμα στο περίγραμμα του οχήματος είτε σε πρόσθετη πινακίδα, που τοποθετείται κάτω από την πινακίδα Ρ-13, σημαίνει ότι η απαγόρευση ισχύει μόνο αν το μέγιστο επιτρεπόμενο βάρος του οχήματος ή του συνδυασμού οχημάτων υπερβαίνει τον αριθμό αυτόν.\nιδ) Ρ-14: Απαγορεύεται η είσοδος σε μηχανοκίνητο όχημα το οποίο σύρει ρυμουλκούμενο, πλην ημιρυμουλκούμενου ή ρυμουλκούμενου ενός άξονα. Η αναγραφή αριθμού τόνων, είτε με λευκό χρώμα στο περίγραμμα του ρυμουλκούμενου, είτε σε πρόσθετη πινακίδα, που τοποθετείται κάτω από την πινακίδα Ρ-14, σημαίνει ότι η απαγόρευση ισχύει μόνο αν το μέγιστο επιτρεπόμενο βάρος του ρυμουλκούμενου υπερβαίνει τον αριθμό αυτόν.\nιε) Ρ-15: Απαγορεύεται η είσοδος σε πεζούς.\nιστ) Ρ-16: Απαγορεύεται η είσοδος σε ζωήλατα οχήματα.\nιζ) Ρ-17: Απαγορεύεται η είσοδος σε χειράμαξες.\nιη) Ρ-18: Απαγορεύεται η είσοδος σε αγροτικά μηχανήματα.\nιθ) Ρ-19: Απαγορεύεται η είσοδος σε μηχανοκίνητα οχήματα.\nκ) Ρ-20: Απαγορεύεται η είσοδος σε οχήματα ορισμένων κατηγοριών (όπως σε μηχανοκίνητα και ζωήλατα οχήματα).\nκα) Ρ-21: Απαγορεύεται η είσοδος σε οχήματα συνολικού πλάτους που υπερβαίνει τα … (π.χ. 2 μέτρα).\nκβ) Ρ-22: Απαγορεύεται η είσοδος σε οχήματα συνολικού ύψους που υπερβαίνει τα … (π.χ. 3,5 μέτρα).\nκγ) Ρ-23: Απαγορεύεται η είσοδος σε οχήματα συνολικού βάρους που υπερβαίνει τους … (π.χ. 5) τόνους.\nκδ) Ρ-24: Απαγορεύεται η είσοδος σε οχήματα βάρους ανά άξονα που υπερβαίνει τους … (π.χ. 2) τόνους.\nκε) Ρ-25: Απαγορεύεται η είσοδος σε οχήματα ή συνδυασμούς οχημάτων μήκους που υπερβαίνει τα … (π.χ. 10) μέτρα. κστ) Ρ-26: Απαγορεύεται η οδήγηση οχήματος σε απόσταση μικρότερη των… (π.χ. 70) μέτρων από το προηγούμενο.\nκζ) Ρ-27: Απαγορεύεται η αριστερή στροφή.\nκη) Ρ-28: Απαγορεύεται η δεξιά στροφή.\nκθ) Ρ-29: Απαγορεύεται η αναστροφή (στροφή κατά 180 μοίρες).\nλ) Ρ-30: Απαγορεύεται η προσπέραση μηχανοκίνητων οχημάτων, πλην των δίτροχων μοτοσικλετών χωρίς καλάθι.\nλα) Ρ-31: Απαγορεύεται στους οδηγούς φορτηγών αυτοκινήτων, μέγιστου επιτρεπόμενου βάρους που υπερβαίνει τους 3,5 τόνους, να προσπερνούν άλλα οχήματα. Αναγραφή στην πινακίδα Ρ-31 ή πρόσθετη πινακίδα, που τοποθετείται κάτω από την πινακίδα Ρ- 31, μπορεί να μεταβάλει το μέγιστο επιτρεπόμενο βάρος, πάνω από το οποίο ισχύει η απαγόρευση αυτή.\nλβ) Ρ-32: Η μέγιστη ταχύτητα περιορίζεται στον αναγραφόμενο αριθμό (50 χλμ.) την ώρα. Αναγραφή αριθμού τόνων σε πρόσθετη πινακίδα, που τοποθετείται κάτω από την πινακίδα Ρ-32, σημαίνει ότι ο περιορισμός της ταχύτητας αφορά μόνο οχήματα συνολικού βάρους που υπερβαίνει τον αριθμό αυτόν.\nλγ) Ρ-33: Απαγορεύεται η χρήση ηχητικών οργάνων προειδοποίησης (εκτός εάν η χρήση έχει ως σκοπό την αποφυγή δυστυχήματος).\nλδ) Ρ-34: Απαγορεύεται η διέλευση χωρίς στάση προ του Τελωνείου. Η αντικατάσταση της ένδειξης Τελωνείο με άλλη σημαίνει την απαγόρευση της διέλευσης χωρίς στάση προ της δηλούμενης θέσης.\nλε) Ρ-35: Απαγορεύεται η διέλευση χωρίς στάση προ του σταθμού διοδίων. λστ) Ρ-36: Τέλος όλων των τοπικών απαγορεύσεων, οι οποίες έχουν επιβληθεί με απαγορευτικές πινακίδες στα κινούμενα οχήματα.\nλζ) Ρ-37: Τέλος ορίου ταχύτητας το οποίο έχει επιβληθεί με απαγορευτική Πινακίδα (π.χ. 40 χλμ.) την ώρα.\nλη) Ρ-38: Τέλος απαγόρευσης προσπεράσματος το οποίο έχει επιβληθεί με απαγορευτική πινακίδα.\nλθ) Ρ-39: Απαγορεύεται η στάθμευση.\nμ) Ρ-40: Απαγορεύονται η στάση και η στάθμευση εφόσον δεν ορίζεται διαφορετικά με πρόσθετη πινακίδα κ.λπ. Οι απαγορεύσεις των πινακίδων μέχρι του επομένου σημείου συνάντησης με οδό και στην πλευρά του οδοστρώματος στην οποία είναι τοποθετημένες αυτές.\nμα) Ρ-41: Απαγορεύεται η στάθμευση στην πλευρά της πινακίδας τους μονούς μήνες.\nμβ) Ρ-42: Απαγορεύεται η στάθμευση στην πλευρά της πινακίδας τους ζυγούς μήνες. Οι απαγορεύσεις και οι περιορισμοί των σταθμεύσεων εφαρμόζονται μόνο στην πλευρά του οδοστρώματος στην οποία είναι τοποθετημένες οι πινακίδες Ρ-41 και Ρ-42.\nμγ) Ρ-43: Περιοχή απαγόρευσης στάθμευσης (στάθμευση περιορισμένης χρονικής διάρκειας).\nμδ) Ρ-44: Έξοδος από περιοχή απαγορευμένης στάθμευσης.\nμε) Ρ-45: Απαγορεύεται η είσοδος σε οχήματα που μεταφέρουν πάνω από ορισμένη ποσότητα εκρηκτικές ή εύφλεκτες ύλες. μστ) Ρ-46: Απαγορεύεται η είσοδος σε οχήματα που μεταφέρουν πάνω από ορισμένη ποσότητα ύλες, οι οποίες μπορεί να προκαλέσουν μόλυνση υδάτων.\nμζ) Ρ-47: Υποχρεωτική κατεύθυνση πορείας προς τα αριστερά.\nμη) Ρ-48: Υποχρεωτική κατεύθυνση πορείας προς τα δεξιά.\nμθ) Ρ-49: Υποχρεωτική κατεύθυνση πορείας προς τα εμπρός.\nν) Ρ-50: Υποχρεωτική κατεύθυνση πορείας με στροφή αριστερά ή δεξιά.\nνα) Ρ-50α: Υποχρεωτική κατεύθυνση πορείας με στροφή αριστερά.\nνβ) Ρ-50δ: Υποχρεωτική κατεύθυνση πορείας με στροφή δεξιά.\nνγ) Ρ-51α: Υποχρεωτική κατεύθυνση πορείας εμπρός ή αριστερά.\nνδ) Ρ-51δ: Υποχρεωτική κατεύθυνση πορείας εμπρός ή δεξιά.\nνε) Ρ-52: Υποχρεωτική διέλευση είτε από τη δεξιά είτε από την αριστερή πλευρά της νησίδας ή του εμποδίου. νστ) Ρ-52α: Υποχρεωτική διέλευση μόνο από την αριστερή πλευρά της νησίδας ή του εμποδίου.\nνζ) Ρ-52δ: Υποχρεωτική διέλευση μόνο από τη δεξιά πλευρά της νησίδας ή του εμποδίου.\nνη) Ρ-53: Κυκλική υποχρεωτική διαδρομή.\nνθ) Ρ-54: Οδός υποχρεωτικής διέλευσης ποδηλάτων (απαγορευμένης της διέλευσης άλλων οχημάτων).\nξ) Ρ-55: Οδός υποχρεωτικής διέλευσης πεζών (πεζόδρομος, απαγορευμένης της διέλευσης άλλων εκτός πεζών, οχημάτων άμεσης ανάγκης και οχημάτων για την είσοδο - έξοδο σε παρόδιες ιδιοκτησίες).\nξα) Ρ-56: Οδός υποχρεωτικής διέλευσης εφίππων (απαγορευμένης της διέλευσης άλλων, εκτός εφίππων που χρησιμοποιούν την οδό).\nξβ) Ρ-57: Υποχρεωτική ελάχιστη ταχύτητα που αναγράφεται με λευκούς αριθμούς σε (π.χ. 30 χλμ.) την ώρα.\nξγ) Ρ-58: Τέλος υποχρεωτικής ελάχιστης ταχύτητας, που έχει υποβληθεί με την πινακίδα Ρ-57.\nξδ) Ρ-59: Υποχρεωτικές αντιολισθητικές αλυσίδες χιονιών σε δύο τουλάχιστον από τους κινητήριους τροχούς του αυτοκινήτου.\nξε) Ρ-60: Ανώτατη ταχύτητα περιοχής. ξστ) Ρ-61: Έξοδος από περιοχή με ανώτατο όριο ταχύτητας.\nξζ) Ρ-62: Τέλος απαγόρευσης προσπέρασης από φορτηγά αυτοκίνητα, που έχει υποβληθεί με απαγορευτική πινακίδα.\nξη) Ρ-63: Απαγορεύεται το ρυμουλκούμενο όχημα να έχει βάρος μεγαλύτερο από … (π.χ. 3) τόνους.\nξθ) Ρ-64: Απαγορεύεται το ρυμουλκούμενο όχημα που μεταφέρει επικίνδυνα υλικά.\nο) Ρ-65: Η κάθε κατηγορία χρηστών που απεικονίζει το αντίστοιχο σύμβολο πρέπει να χρησιμοποιεί την πλευρά του αντιστοίχου διαδρόμου που είναι ειδικά επιλεγμένη για αυτήν την κατηγορία.\nοα) Ρ-66: Οι διάφορες κατηγορίες χρηστών που απεικονίζουν τα αντίστοιχα σύμβολα επιτρέπεται να χρησιμοποιούν ταυτόχρονα τον ειδικό διάδρομο.\nοβ) Ρ-66α: Οδός μεικτής χρήσης από οχήματα και ποδήλατα.\nογ) Ρ-67: Αποκλειστική διέλευση λεωφορείων ή τρόλεϊ.\nοδ) Ρ-67α: Αποκλειστική διέλευση λεωφορείων, τρόλεϊ και ποδηλάτων.\nοε) Ρ-68: Τέλος αποκλειστικής διέλευσης λεωφορείων ή τρόλεϊ. οστ) Ρ-68α: Τέλος αποκλειστικής διέλευσης λεωφορείων, τρόλεϊ και ποδηλάτων.\nοζ) Ρ-69: Χώρος ελεγχόμενης στάθμευσης.\nοη) Ρ-70: Χώρος στάθμευσης ορισμένης κατηγορίας οχημάτων π.χ. TAXI.\nοθ) Ρ-71: Χώρος στάθμευσης αποκλειστικά για οχήματα ατόμων με αναπηρία, ύστερα από ειδική άδεια.\nπα) Ρ-72: Χώρος στάθμευσης αποκλειστικά για συγκεκριμένο όχημα ατόμων με αναπηρία, ύστερα από ειδική άδεια και με αριθμό κυκλοφορίας.\nπβ) Ρ-73α: Υποχρεωτική κατεύθυνση πορείας οχημάτων μεταφοράς επικίνδυνων φορτίων προς τα αριστερά.\nπγ) Ρ-73δ: Υποχρεωτική κατεύθυνση πορείας οχημάτων μεταφοράς επικίνδυνων φορτίων προς τα δεξιά.\nπδ) Ρ-74α: Υποχρεωτική κατεύθυνση πορείας οχημάτων μεταφοράς επικίνδυνων φορτίων προς τα αριστερά.\nπε) Ρ-74δ: Υποχρεωτική κατεύθυνση πορείας οχημάτων μεταφοράς επικίνδυνων φορτίων προς τα δεξιά. πστ) Ρ-75: Επιβάλλει ιδιαίτερη προσοχή σε οχήματα που μεταφέρουν επικίνδυνες ύλες που μπορούν να προκαλέσουν μόλυνση των υδάτων.\nπζ) Ρ-76: Αποκλειστική διέλευση τροχιοδρόμου.\nπη) Ρ-77: Τέλος αποκλειστικής διέλευσης τροχιοδρόμου. Επιτρέπεται:\nα) Συνδυασμός ρυθμιστικής και πρόσθετης πινακίδας, με τον οποίο η ρύθμιση περιορίζεται στη συγκεκριμένη κατηγορία χρηστών της οδού που δείχνει η πρόσθετη πινακίδα.\nβ) Συνδυασμός ρυθμιστικής και πρόσθετης πινακίδας, με τον οποίο εξαιρείται από τη ρύθμιση η συγκεκριμένη κατηγορία χρηστών της οδού που δείχνει η πρόσθετη πινακίδα.\n4. Οι πληροφοριακές πινακίδες (Π-1 μέχρι Π-136γ) τοποθετούνται για την παροχή πληροφοριών σχετικά με τις οδούς και τη διευκόλυνση των χρηστών των οδών, όπως ιδίως κατευθύνσεις, αρίθμηση, χιλιομέτρηση, τοπωνυμίες και εγκαταστάσεις. Η σημασία των πινακίδων αυτών είναι:\nα) Π-1: Προειδοποιητική κατευθύνσεων, η οποία τοποθετείται στις οδούς ταχείας κυκλοφορίας προ διασταυρώσεων με αναγραφές κατευθύνσεων και χιλιομετρικών αποστάσεων.\nβ) Π-2: Προειδοποιητική κατευθύνσεων, η οποία τοποθετείται στις οδούς ταχείας κυκλοφορίας προ διακλαδώσεων με αναγραφές κατευθύνσεων και χιλιομετρικών αποστάσεων.\nγ) Π-3: Προειδοποιητική κατευθύνσεων για συνήθεις οδούς με αναγραφές κατευθύνσεων και χιλιομετρικών αποστάσεων.\nδ) Π-3α: Προειδοποιητική κατευθύνσεων με αναγραφή κατευθύνσεων και χιλιομετρικών αποστάσεων σε οδούς τοπικού οδικού δικτύου.\nε) Π-3β: Προειδοποιητική κατευθύνσεων, με αναγραφή κατευθύνσεων για περιοχές μεγάλου τουριστικού ή αρχαιολογικού ενδιαφέροντος.\nστ) Π-4: Προειδοποιητική για αδιέξοδο στα δεξιά.\nζ) Π-5: Προειδοποιητική για αδιέξοδο στα αριστερά διαγώνια.\nη) Π-6: Προειδοποιητική υποχρεωτικής διαδρομής για στροφή αριστερά στην επόμενη διασταύρωση όπου αυτή απαγορεύεται.\nθ) Π-7: Προειδοποιητική πινακίδα για προεπιλογή λωρίδας σε διασταύρωση σε οδούς με πολλές λωρίδες κυκλοφορίας.\nι) Π-8α: Κατεύθυνση μίας τοπωνυμίας με μορφή βέλους.\nια) Π-8β: Κατεύθυνση μιας τοπωνυμίας με μορφή βέλους (και με λατινικούς χαρακτήρες).\nιβ) Π-8γ: Κατεύθυνση για περισσότερες της μιας τοπωνυμίας με μορφή βέλους.\nιγ) Π-8δ: Κατεύθυνση μιας τοπωνυμίας μεγάλου τουριστικού ή αρχαιολογικού ενδιαφέροντος, με μορφή βέλους.\nιδ) Π-9: Κατεύθυνση μίας τοπωνυμίας, μορφής ορθογωνίου.\nιε) Π-10: Κατεύθυνση προς αεροδρόμιο.\nιστ) Π-11: Κατεύθυνση προς κατασκήνωση.\nιζ) Π-12: Κατεύθυνση προς Ξενώνα Νεότητας.\nιη) Π-13: Αρίθμηση εθνικών οδών.\nιθ) Π-14: Αρίθμηση διεθνών αρτηριών.\nκ) Π-15: Χιλιομέτρηση οδών.\nκβ) Π-17: Αρχή κατοικημένης περιοχής.\nκγ) Π-18: Τέλος κατοικημένης περιοχής.\nκδ) Π-19: Τοπωνύμια.\nκε) Π-20: Επιβεβαιωτική πινακίδα (παράδειγμα). κστ) Π-21: Διάβαση πεζών.\nκζ) Π-21α: Διάβαση ποδηλάτων.\nκη) Π-21β: Παράλληλες διαβάσεις πεζών και ποδηλάτων.\nκθ) Π-21γ: Κοινή διάβαση πεζών και ποδηλάτων.\nλ) Π-22: Νοσοκομείο (για την αποφυγή ή μείωση οποιουδήποτε μη αναγκαίου θορύβου).\nλα) Π-23: Μονόδρομος.\nλβ) Π-24: Μονόδρομος.\nλγ) Π-25: Οδός αδιέξοδος.\nλδ) Π-26: Οδός ταχείας κυκλοφορίας.\nλε) Π-26α: Τέλος οδού ταχείας κυκλοφορίας. λστ) Π-27: Αυτοκινητόδρομος.\nλζ) Π-27α: Τέλος αυτοκινητόδρομου.\nλη) Π-28: Στάση λεωφορείου ή τρόλεϊ.\nλθ) Π-28α: Στάση τροχιοδρόμου.\nμ) Π-29: Ορεινή οδός, ανοικτή ή κλειστή, ανάλογα με τις ενδείξεις μέσα στο πλαίσιο 1, 2, 3, της πινακίδας.\nμα) Π-30: Συνιστώνται αλυσίδες ή ελαστικά χιονιών για το πλαίσιο 2 της Π-29.\nμβ) Π-31: Χώρος επιτρεπόμενης στάθμευσης.\nμγ) Π-31α: Περιοχή επιτρεπόμενης στάθμευσης.\nμδ) Π-31β: Έξοδος από περιοχή επιτρεπόμενης στάθμευσης.\nμε) Π-31γ: Κατεύθυνση προς χώρο επιτρεπόμενης στάθμευσης. μστ) Π-31δ: Χώρος επιτρεπόμενης στάθμευσης ποδηλάτων.\nμζ) Π-32: Σταθμός πρώτων βοηθειών.\nμη) Π-33: Συνεργείο επισκευής βλαβών.\nμθ) Π-34: Τηλέφωνο.\nν) Π-35: Πρατήριο καυσίμων.\nνα) Π-35α: Θέση/Σημείο επαναφόρτισης ηλεκτροκίνητων οχημάτων.\nνβ) Π-36: Ξενοδοχείο ή MOTEL.\nνγ) Π-37: Εστιατόριο.\nνδ) Π-38: Αναψυκτήριο ή καφενείο.\nνε) Π-39: Θέση για παραμονή εκδρομέων. νστ) Π-40: Σημείο έναρξης περιπάτου.\nνζ) Π-41: Θέσεις για κατασκηνώσεις.\nνη) Π-42: Θέση για τροχόσπιτα.\nνθ) Π-43: Θέση για κατασκηνώσεις και τροχόσπιτα.\nξ) Π-44: Ξενώνας Νεότητας.\nξα) Π-45: Τουριστικές πληροφορίες.\nξβ) Π-46: Περιοχή κολύμβησης.\nξγ) Π-47: Εγκατάσταση υγιεινής.\nξδ) Π-48: Ραδιοφωνική συχνότητα πληροφοριών οδικής κυκλοφορίας.\nξε) Π-49: Σήραγγα. ξστ) Π-50: Αεροδρόμιο.\nξζ) Π-51: Ελικοδρόμιο.\nξη) Π-52: Εναέρια μεταφορά.\nξθ) Π-53: Λιμάνι.\nο) Π-54: Τουριστικό λιμάνι.\nοα) Π-55: Λιμενικός σταθμός ιπτάμενων σκαφών.\nκα) Π-16: Χιλιομέτρηση οδών.\nοβ) Π-56: Λιμενικός σταθμός εμπορικών οχηματαγωγών πλοίων.\nογ) Π-57: Αστυνομία.\nοδ) Π-58: Αρχή περιοχής κατοικίας.\nοε) Π-59: Τέλος περιοχής κατοικίας. οστ) Π-60: Άτομα με αναπηρία.\nοζ) Π-61: Άνω (υπέργεια) διάβαση πεζών.\nοη) Π-62: Κάτω (υπόγεια) διάβαση πεζών.\nοθ) Π-63: Ανισόπεδη διάβαση πεζών χωρίς σκαλοπάτια.\nπ) Π-64: Συνιστώμενη ταχύτητα.\nπα) Π-65: Γενικά όρια ταχύτητας.\nπβ) Π-66: Λωρίδα αποκλειστικής κυκλοφορίας λεωφορείων ή τρόλεϊ ή τροχιοδρόμου ή δίκυκλου ή συνδυασμού αυτών.\nπγ) Π-67: Ανώτατα όρια ταχυτήτων ανά λωρίδα κυκλοφορίας.\nπδ) Π-68: Όρια ελάχιστων ταχυτήτων ανά λωρίδα κυκλοφορίας.\nπε) Π-69: Αριθμός και κατευθύνσεις κυκλοφοριακών λωρίδων. πστ) Π-69α: Αριθμός και κατευθύνσεις κυκλοφοριακών λωρίδων.\nπζ) Π-70: Περιορισμός αριθμού κυκλοφοριακών λωρίδων.\nπη) Π-70α: Περιορισμός αριθμού κυκλοφοριακών λωρίδων.\nπθ) Π-71: Εγκαταστάσεις υγιεινής για άτομα με αναπηρία.\nρ) Π-72: Κατεύθυνση οχημάτων για στάθμευση σε συγκεκριμένο χώρο (όπως ΜΕΤΡΟ για χρησιμοποίηση του μεταφορικού αυτού μέσου).\nρα) Π-73: Προειδοποίηση κατεύθυνσης οχημάτων για στάθμευση σε συγκεκριμένο στεγασμένο χώρο.\nρβ) Π- 73α: Προειδοποίηση κατεύθυνσης οχημάτων για στάθμευση σε συγκεκριμένο υπαίθριο χώρο.\nργ) Π-74: Κατεύθυνση - επισήμανση επικίνδυνων καμπυλών.\nρδ) Π-75: Διαδοχικά βέλη κατεύθυνσης, που τοποθετούνται σε επ ξοδοι κινδύνου. Οι πινακίδες αυτές υποδεικνύουν τη θέση των εξόδων κινδύνου.\nφδ) Π-136α, Π-136β, Π-136γ: Έξοδοι κινδύνου. Οι πινακίδες αυτές υποδεικνύουν την κατεύθυνση και την απόσταση της πιο κοντινής εξόδου κινδύνου. Σε σήραγγες πρέπει να τοποθετούνται σε μέγιστη απόσταση πενήντα (50) μέτρων μεταξύ τους και σε ύψος ένα (1) έως ενάμιση (1,5) μέτρο από το πεζοδρόμιο. Οι πινακίδες Π-135α, Π-135β, Π-136α, Π-136β και Π-136-γ έχουν πράσινο υπόβαθρο και τα σύμβολα, βέλη και αποστάσεις είναι λευκά ή ανοιχτόχρωμα. Οι εμφανιζόμενοι στις κατοικημένες περιοχές κανονισμοί κυκλοφορίας, όπως ιδίως ο περιορισμός της ταχύτητας, η απαγόρευση χρήσης ηχητικών οργάνων, προειδοποιήσεων, ισχύουν από την πινακίδα Π-17 ή Π-58 μέχρι την πινακίδα Π-18 ή Π-59, εκτός των τμημάτων εκείνων της οδού, εντός κατοικημένης περιοχής, στα οποία, με άλλες πινακίδες, παρέχεται ειδοποίηση για διαφορετικούς κανονισμούς. Ρυθμιστικές πινακίδες, οι οποίες τοποθετούνται στην αυτή θέση με την πινακίδα Π-17 ή Π-18 ισχύουν σε όλο το μήκος της οδού, εντός της κατοικημένης περιοχής, εκτός αν ορίζεται διαφορετικά με άλλες πινακίδες, σε ορισμένα τμήματα της οδού αυτής.\n5. Οι πρόσθετες πινακίδες (Πρ-1 μέχρι Πρ-19β) τοποθετούνται σε συνδυασμό πάντοτε με άλλες (κύριες) πινακίδες σήμανσης για να δηλώνουν απόσταση, μήκος και λοιπά διευκρινιστικά στοιχεία ισχύος των κυρίων πινακίδων. Η σημασία των πινακίδων αυτών είναι:\nα) Πρ-1:Απόσταση από τη θέση της πινακίδας μέχρι την αρχή της επικίνδυνης θέσης ή της περιοχής στην οποία εφαρμόζεται ο καθοριζόμενος με αυτήν κανόνας ή περιορισμός (π.χ. 200 μ.).\nβ) Πρ-2: Μήκος του επικίνδυνου τμήματος ή της περιοχής στην οποία εφαρμόζεται ο καθοριζόμενος με την πινακίδα κανόνας ή περιορισμός (π.χ. 1 χιλιόμετρο).\nγ) Πρ-3α: Αρχή ισχύος πινακίδας Ρ-39 ή Ρ-40, που τοποθετείται παράλληλα προς τον άξονα της οδού. Η ισχύς της πινακίδας εκτείνεται επί … (π.χ. 10 μ.) από τη θέση της πινακίδας και προς την κατεύθυνση του βέλους.\nδ) Πρ-3β: Υπόμνηση ισχύος πινακίδας Ρ-39 ή Ρ-40 που τοποθετείται παράλληλα προς τον άξονα της οδού. Η ισχύς της πινακίδας εκτείνεται επί … (π.χ. 5μ.) και από τις δυο πλευρές της θέσης της πινακίδας.\nε) Πρ-3γ: Τέλος ισχύος πινακίδας Ρ-39 ή Ρ-40, που τοποθετείται παράλληλα προς τον άξονα της οδού. Η ισχύς της πινακίδας εκτείνεται επί … (π.χ. 10 μ.) από τη θέση της πινακίδας και προς την κατεύθυνση του βέλους.\nστ) Πρ-4α: Αρχή ισχύος πινακίδας Ρ-39 ή Ρ-40 που τοποθετείται κάθετα προς τον άξονα της οδού.\nζ) Πρ-4β: Επανάληψη ισχύος πινακίδας Ρ-39 ή Ρ-40 που τοποθετείται κάθετα προς τον άξονα της οδού.\nη) Πρ-4γ: Τέλος ισχύος πινακίδας Ρ-39 ή Ρ-40 που τοποθετείται κάθετα προς τον άξονα της οδού.\nθ) Πρ-4δ: Επιτρέπεται μόνο για οχήματα ατόμων με αναπηρία ύστερα από ειδική άδεια.\nι) Πρ-4ε: Εξαιρούνται μόνο οχήματα ατόμων με αναπηρία ύστερα από ειδική άδεια. Ως αναπηρικά οχήματα νοούνται αυτά των ατόμων με αναπηρία τα οποία φέρουν στο άνω δεξιά μέρος του πίσω κρυστάλλου το ειδικό σήμα, το οποίο χορηγείται από την αρμόδια Διεύθυνση Μεταφορών και Επικοινωνιών της Περιφέρειας.\nια) Πρ-5: Πάγος.\nιβ) Πρ-6: Βροχή.\nιγ) Πρ-7: Προτεραιότητα κατεύθυνσης σε διασταύρωση (π.χ. α-δ).\nιδ) Πρ-8: Προτεραιότητα κατεύθυνσης σε διασταύρωση μορφής (π.χ. α-β).\nιε) Πρ-9: Προτεραιότητα κατεύθυνσης σε διακλάδωση μορφής (π.χ. α-γ).\nιστ) Πρ-10: Προτεραιότητα κατεύθυνσης σε διακλάδωση μορφής (π.χ. α-β).\nιζ) Πρ-11: Προτεραιότητα κατεύθυνσης σε διακλάδωση μορφής (π.χ. α-β).\nιη) Πρ-12: Προτεραιότητα κατεύθυνσης σε διακλάδωση μορφής Y (π.χ. α-γ).\nιθ) Πρ-13: Προτεραιότητα κατεύθυνσης σε διακλάδωση μορφής Υ (π.χ. α-β).\nκ) Πρ-14α: Επικίνδυνη κλειστή στροφή αριστερά.\nκα) Πρ-14δ: Επικίνδυνη κλειστή στροφή δεξιά.\nκβ) Πρ-15α: Ανακάμπτων ελιγμός αριστερά.\nκγ) Πρ-15δ: Ανακάμπτων ελιγμός δεξιά.\nκδ) Πρ-16: Επιτρέπεται μόνο για τη συγκεκριμένη κατηγορία οχημάτων που απεικονίζει το σύμβολο. ΣΥΜΒΟΛΑ ΟΧΗΜΑΤΩΝ κδα) Πρ-16α: Ζωήλατο όχημα. κδβ) Πρ-16β: Χειράμαξα. κδγ) Πρ-16γ: Ποδήλατο. κδδ) Πρ-16δ: Μοτοποδήλατο. κδε) Πρ-16ε: Μοτοσικλέτα ή τρίτροχο όχημα. κδστ) Πρ-16στ: Επιβατηγό όχημα. κδζ) Πρ-16ζ: Επιβατηγό με ρυμουλκούμενο ενός άξονα (τρέιλερ). κδη) Πρ-16η: Αγροτικό μηχάνημα. κδθ) Πρ-16θ: Λεωφορείο ή τρόλεϊ. κδι) Πρ-16ι: Φορτηγό αυτοκίνητο. κδια) Πρ-16ια: Φορτηγό αρθρωτό. κδιβ) Πρ-16ιβ: Φορτηγό με ρυμουλκούμενο όχημα πλην ρυμουλκούμενου ενός άξονα. κδιγ) Πρ-16ιγ: Φορτηγό με ρυμουλκούμενο όχημα ενός άξονα. κδιδ) Πρ-16ιδ: Όχημα που φέρει πάνω από ορισμένη ποσότητα εκρηκτικές ή εύφλεκτες ύλες. κδιε) Πρ-16ιε: Τροχιόδρομος.\nκε) Πρ-17: Εξαιρείται (από την ισχύουσα ρύθμιση) μόνο η συγκεκριμένη κατηγορία οχημάτων που απεικονίζει το σύμβολο (αρίθμηση αντίστοιχη με την Πρ-16). κστ) Πρ-18α: Επιτρέπεται μόνο για τα «TAXI».\nκζ) Πρ-18β: Εξαιρούνται μόνο τα «TAXI».\nκη) Πρ-19α: Ηλεκτροκίνητα Οχήματα. Στην περίπτωση που η πινακίδα χρησιμοποιείται για τη στάση/στάθμευση, αυτή ισχύει μόνο για τη διάρκεια επαναφόρτισης του οχήματος.\nκθ) Πρ-19β: Εξαιρούνται τα ηλεκτροκίνητα οχήματα. Στην περίπτωση που η πινακίδα χρησιμοποιείται για τη στάση/στάθμευση, αυτή ισχύει μόνο για τη διάρκεια επαναφόρτισης του οχήματος.\n6. Το σχήμα, η μορφή, τα χρώματα και οι επ’ αυτών αναγραφές εκάστης των κατά το άρθρο αυτό πινακίδων σήμανσης οδών εμφαίνονται στον πίνακα σχεδίων πινακίδων σήμανσης οδών, που προσαρτάται στο παρόν ως Παράρτημα Α’. Ύστερα από έγκριση της Διεύθυνσης Οδικών Υποδομών της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών μπορεί να σχεδιασθούν, κατασκευαστούν και τοποθετηθούν πληροφοριακές πινακίδες σήμανσης οδών που προκύπτουν από συνδυασμό δύο ή περισσοτέρων πινακίδων σήμανσης του σχετικού πίνακα σχεδίων πινακίδων σήμανσης του παρόντος Κώδικα.\n7. Οι τοποθετούμενες πινακίδες σήμανσης οδών κατασκευάζονται και τοποθετούνται σύμφωνα με τις προδιαγραφές του Υπουργείου Υποδομών και Μεταφορών.\n8. Για τη διευκόλυνση της ερμηνείας των πινακίδων σήμανσης ή τον περιορισμό της εφαρμογής των ρυθμιστικών πινακίδων σε ορισμένες κατηγορίες οχημάτων ή κατά ορισμένες χρονικές περιόδους, είναι δυνατή η προσθήκη επεξηγηματικών εγγράφων ή συμβόλων μέσα σε ορθογώνιο παραλληλόγραμμο κάτω από την πινακίδα. Οι εγγραφές αυτές ή τα σύμβολα είναι δυνατόν να περιλαμβάνονται στην πινακίδα εφόσον δεν καθιστούν αυτή δυσνόητη.\n9. Με την απόφαση της παρ. 1 του άρθρου 112 και βάσει των σχετικών ειδικών προδιαγραφών είναι δυνατόν:\nα) οι πινακίδες σήμανσης οδών να τοποθετούνται επί καταλλήλου υποβάθρου μεγαλύτερου μεγέθους από την πινακίδα του ίδιου ή άλλου οχήματος από αυτή, προκειμένου η πινακίδα να διακρίνεται ευκρινέστερα. Για τον σκοπό αυτόν το υπόβαθρο επιτρέπεται να έχει χρώμα διαφορετικό από την πινακίδα, αλλά πάντως διαφορετικό και από τα χρώματα που χρησιμοποιούνται για τις κατηγορίες πινακίδων του άρθρου αυτού, καθώς και να φέρει ειδικά, ιδίως φωσφορίζοντα, υλικά και αντανακλαστικά στοιχεία,\nβ) να τοποθετούνται πινακίδες με μορφή φωτεινών πινάκων με μεταβλητά μηνύματα. Με την ίδια απόφαση καθορίζονται ο τρόπος λειτουργίας των πινακίδων της μορφής αυτής, οι κατηγορίες τους, η θέση τους, τα μηνύματα που μπορούν να προβάλλονται στην πινακίδα, η σημασία κάθε μηνύματος και κάθε άλλη αναγκαία λεπτομέρεια,\nγ) να τροποποιούνται τα χρώματα, η μορφή και οι αναγραφές των πινακίδων σήμανσης.\n10. Οι πινακίδες σήμανσης αφορούν τους οδηγούς, οι οποίοι κυκλοφορούν σε ολόκληρο το πλάτος του ανοικτού στην κυκλοφορία οδοστρώματος, εκτός αν, με κατάλληλη τοποθέτησή τους, απευθύνονται αποκλειστικά σε αυτούς που οδηγούν σε μία ή περισσότερες λωρίδες κυκλοφορίας που χωρίζονται με κατά μήκος διαγραμμίσεις ή κατάλληλα διαχωριστικά μέσα.\n11. Οι παραβάσεις για τον οδηγό που δεν συμμορφώνεται με τις υποχρεώσεις που επιβάλλονται με:\nα) τις ρυθμιστικές πινακίδες Ρ-1 και Ρ-29 ή τον συνδυασμό αυτών με πρόσθετες πινακίδες, και την πινακίδα Ρ-2 ή τον συνδυασμό αυτής με πρόσθετες πινακίδες, κατατάσσονται στην κατηγορία Ε3-Β,\nβ) την πινακίδα Ρ-2 ή P-29 ή τον συνδυασμό αυτών με πρόσθετες πινακίδες, κατατάσσονται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ και επί τόπου αφαίρεση της άδειας οδήγησης για εξήντα (60) ημέρες, αν η μη συμμόρφωση έχει ως αποτέλεσμα την πρόκληση τροχαίου ατυχήματος. Αν ο οδηγός γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε βαριά σωματική βλάβη ή σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων επιβάλλονται οι ποινές των περ. γγ) και\nδδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95),\nγ) τις πινακίδες Ρ-3, Ρ-4, Ρ-34, Ρ-35, Ρ-69, Ρ-75, ή τον συνδυασμό αυτών με πρόσθετες πινακίδες, κατατάσσονται στην κατηγορία Ε1-Α,\nδ) τις πινακίδες Ρ-5, Ρ-6, Ρ-32, Ρ-39, Ρ-40, Ρ-41, Ρ-42, Ρ-43, Ρ-47, Ρ-48, Ρ-49, Ρ-50, Ρ-50α, Ρ-50δ, Ρ-51α, Ρ-51δ, Ρ-52α, Ρ-52δ, Ρ-52, Ρ-53, Ρ-57, Ρ-59, Ρ-60, Ρ-63, Ρ-70 ή τον συνδυασμό αυτών με πρόσθετες πινακίδες, κατατάσσονται στην κατηγορία Ε1-Β,\nε) τις πινακίδες Ρ-7, Ρ-8, Ρ-9, Ρ-10, Ρ-11, Ρ-12, Ρ-13, Ρ-14, Ρ-18, Ρ-19, Ρ-20, Ρ-21, Ρ-22, Ρ-23, Ρ-24, Ρ-25, Ρ-26, Ρ-27, Ρ-28, Ρ-30, Ρ-31, Ρ-45, Ρ-46, Ρ-64, Ρ-73α, Ρ-73δ, Ρ-74α, Ρ-74δ, ή τον συνδυασμό αυτών με πρόσθετες πινακίδες, κατατάσσονται στην κατηγορία Ε2-Β,\nστ) τις πινακίδες Ρ-15, Ρ-16, Ρ-17 ή τον συνδυασμό αυτών με πρόσθετες πινακίδες, κατατάσσονται στην κατηγορία Ε2-Α,\nζ) τις πινακίδες Ρ-33, Ρ-54, Ρ-55, Ρ-56, Ρ-65, Ρ-66, Ρ-66α, Ρ-67, Ρ-67α, Ρ-76 ή τον συνδυασμό αυτών με πρόσθετες πινακίδες, κατατάσσονται στην κατηγορία Ε1-Α και στην κατηγορία Σ,\nη) τις πινακίδες Ρ-71, Ρ-72 ή τον συνδυασμό αυτών με πρόσθετες πινακίδες, κατατάσσονται στην κατηγορία Ε2-Β και στην κατηγορία Σ.`},
  8: {title:`Οριζόντια σήμανση οδών, υποχρεώσεις οδηγών, κατηγορίες παραβάσεων`,text:`1. Οι σημάνσεις των οδοστρωμάτων με διαγραμμίσεις ή αναγραφή λέξεων ή απεικόνιση συμβόλων χρησιμοποιούνται για τη ρύθμιση της κυκλοφορίας ή για την προειδοποίηση ή καθοδήγηση αυτών που χρησιμοποιούν οδούς, είτε μόνες είτε σε συνδυασμό με πινακίδες σήμανσης ή σηματοδότες για να τονιστεί ή να διευκρινιστεί η σημασία αυτών. Όταν χρησιμοποιούνται για ρύθμιση της στάθμευσης, σε συνδυασμό με ανάλογες πινακίδες, υπερισχύουν των πινακίδων στάθμευσης. Οι διαγραμμίσεις οδών, που προορίζονται για κινούμενα οχήματα, πρέπει να αναγνωρίζονται εύκολα και έγκαιρα από τους οδηγούς και να είναι ορατές τόσο κατά την ημέρα όσο και κατά τη νύχτα.\n2. Τα κύρια είδη των σημάνσεων επί των οδοστρωμάτων με διαγραμμίσεις είναι οι:\nα) οι κατά μήκος διαγραμμίσεις,\nβ) οι κατά πλάτος (εγκάρσιες) διαγραμμίσεις και\nγ) οι ειδικές διαγραμμίσεις.\n3. Οι κατά μήκος διαγραμμίσεις είναι:\nα) η αποτελούμενη από μία (1) ή δύο (2) συνεχείς γραμμές η οποία σημαίνει διαχωρισμό των λωρίδων αντίθετων κατευθύνσεων,\nβ) η αποτελούμενη από μία (1) διακεκομμένη γραμμή επί του οδοστρώματος, η οποία καθορίζει τα όρια των λωρίδων για την καθοδήγηση της κυκλοφορίας,\nγ) η αποτελούμενη από μία (1) διακεκομμένη γραμμή, διπλάσιου πλάτους της προηγούμενης, η οποία καθορίζει τα όρια μεταξύ της λωρίδας επιτάχυνσης ή επιβράδυνσης και της παράπλευρης λωρίδας κυκλοφορίας,\nδ) η αποτελούμενη από μία (1) διακεκομμένη γραμμή επί του οδοστρώματος με μήκη τμημάτων και των μεταξύ τους κενών, πολύ μικρότερα της διακεκομμένης γραμμής της περ. β’, η οποία σημαίνει προειδοποίηση για την προσέγγιση σε διπλή ή συνεχή γραμμή ή για την προσέγγιση σε άλλο τμήμα οδού, το οποίο παρουσιάζει ιδιαίτερο κίνδυνο.Η προειδοποιητική αυτή γραμμή μπορεί να συμπληρωθεί ή να αντικατασταθεί με βέλη εκτροπής,\nε) η αποτελούμενη από μία (1) συνεχή γραμμή και άλλη παράπλευρα διακεκομμένη, η οποία σημαίνει διαχωρισμό των λωρίδων αντίθετων κατευθύνσεων,\nστ) η αποτελούμενη από διπλές διακεκομμένες γραμμές, η οποία καθορίζει λωρίδα ή λωρίδες κυκλοφορίας στις οποίες η κατεύθυνση της κυκλοφορίας μπορεί να αντιστραφεί.\n4. Οι κατά πλάτος (εγκάρσιες) διαγραμμίσεις είναι:\nα) η γραμμή διακοπής πορείας, αποτελούμενη από μία (1) συνεχή γραμμή επί του πλάτους μίας (1) ή περισσοτέρων λωρίδων κυκλοφορίας, η οποία καθορίζει τη θέση πριν από την οποία οι οδηγοί είναι υποχρεωμένοι να διακόψουν την πορεία τους:\nαα) λόγω της πινακίδας «Ρ-2: υποχρεωτική διακοπή πορείας». Η λέξη «STOP» μπορεί να αναγράφεται επί του οδοστρώματος πριν από τις πιο πάνω διαγραμμίσεις,\nαβ) λόγω ένδειξης φωτεινού σηματοδότη,\nαγ) λόγω σήματος τροχονόμου, ή\nαδ) πριν από σιδηροδρομική διάβαση,\nβ) η αποτελούμενη από μία (1) διακεκομμένη γραμμή επί του πλάτους μίας (1) ή περισσοτέρων λωρίδων κυκλοφορίας, η οποία καθορίζει τη θέση πριν από την οποία οι οδηγοί οχημάτων οφείλουν να παραχωρούν προτεραιότητα, συμμορφούμενοι προς την πινακίδα «Ρ-1: «υποχρεωτική παραχώρηση προτεραιότητας». Μπροστά από αυτή τη διακεκομμένη γραμμή μπορεί να σημειωθεί επί του οδοστρώματος, για να συμβολίζει την πινακίδα «Ρ-1: υποχρεωτική παραχώρηση προτεραιότητας», μεγάλο τρίγωνο με τη μία (1) πλευρά παράλληλη προς τη διακεκομμένη γραμμή και την απέναντι αυτής κορυφή προς τον υποχρεούμενο να παραχωρήσει προτεραιότητα. Η διακεκομμένη αυτή γραμμή μπορεί να αντικατασταθεί με περισσότερα του ενός (1) τρίγωνα σημειούμενα το ένα (1) κοντά στο άλλο επί του οδοστρώματος, με τη μία (1) πλευρά καθενός εξ αυτών παράλληλη προς τη διακεκομμένη γραμμή και την απέναντι αυτής κορυφή προς τον οδηγό ο οποίος υποχρεούται να παραχωρήσει προτεραιότητα,\nγ) η διάβαση πεζών (ZEBRA), αποτελούμενη από ραβδώσεις μεγάλου πλάτους, παράλληλες προς τον άξονα του οδοστρώματος,\nδ) η διάβαση ποδηλάτων, αποτελούμενη από τετράγωνα ή παραλληλόγραμμα σχήματα,\nε) η επιφάνεια αναμονής ποδηλάτων, Ε.Π.Η.Ο., μοτοσικλετών και μοτοποδηλάτων, αποτελούμενη από δύο (2) συνεχείς παράλληλες γραμμές, σε απόσταση τεσσάρων (4) έως πέντε (5) μέτρων μεταξύ τους. Η επιφάνεια αναμονής διαμορφώνεται σε σηματοδοτούμενες διασταυρώσεις μπροστά από τη γραμμή υποχρεωτικής διακοπής πορείας των οχημάτων και σημαίνεται με τα σύμβολα των οχημάτων του προηγούμενου εδαφίου. Για τα οχήματα αυτά, η επιφάνεια αναμονής είναι κοινή. Σε περίπτωση ύπαρξης λωρίδας ποδηλάτου, αυτή καταλήγει στην επιφάνεια αναμονής και είναι χρωματισμένη στο ίδιο χρώμα με αυτή.\n5. Οι ειδικές διαγραμμίσεις είναι:\nα) η αποτελούμενη από παράλληλες λοξές λωρίδες, οι οποίες πλαισιώνονται από μία (1) συνεχή ή διακεκομμένη γραμμή επί τμήματος ή επί ελαφρώς ανυψωμένης περιοχής του οδοστρώματος και η οποία σημαίνει απαγόρευση ή περιορισμό εισόδου οχημάτων στις περιοχές αυτές,\nβ) η τεθλασμένη κίτρινη γραμμή (ζιγκ-ζαγκ) στην πλευρά του οδοστρώματος, η οποία σημαίνει ότι σε όλο το μήκος της γραμμής επί της πλευράς αυτής απαγορεύεται η στάθμευση, ανεξαρτήτως της παράλληλης οδικής σήμανσης με κατακόρυφες πινακίδες απαγορευτικές της στάσης και της στάθμευσης και των απαγορεύσεων του άρθρου 38, περί στάσης και στάθμευσης. Διακοπή της τεθλασμένης γραμμής που συνοδεύεται από την αναγραφή της λέξης «ΛΕΩΦΟΡΕΙΟ» ή απεικόνιση λεωφορείου μπορεί να χρησιμοποιείται για την υπόδειξη αποκλειστικά στάσης λεωφορείου ή ηλεκτροκίνητου λεωφορείου,\nγ) συνεχής κίτρινη γραμμή στο κράσπεδο ή στην άκρη του οδοστρώματος, η οποία σημαίνει ότι σε όλο το μήκος της και προς την πλευρά αυτή του οδοστρώματος απαγορεύεται η στάση και στάθμευση των οχημάτων, ανεξαρτήτως της παράλληλης οδικής σήμανσης με κατακόρυφες πινακίδες απαγορευτικές της στάσης και της στάθμευσης και των απαγορεύσεων στάθμευσης του άρθρου 38,\nδ) διακεκομμένη κίτρινη γραμμή στο κράσπεδο ή στο άκρο του οδοστρώματος, η οποία σημαίνει ότι σε όλο το μήκος της γραμμής και επί της πλευράς αυτής του οδοστρώματος απαγορεύεται ή υπόκειται σε περιορισμούς η στάθμευση, όπως υποδεικνύεται με άλλα μέσα. Αν χρησιμοποιείται η γραμμή αυτή προς ένδειξη απαγόρευσης ή περιορισμών της στάσης ή στάθμευσης πρέπει, εφόσον υπάρχει λευκή γραμμή που υποδεικνύει το άκρο του οδοστρώματος, να βρίσκεται εξωτερικώς και παραπλεύρως της λευκής γραμμής,\nε) πλέγμα κίτρινων γραμμών, οι οποίες σχηματίζουν παραλληλόγραμμα, σε ισόπεδους οδικούς κόμβους, το οποίο σημαίνει περιοχή μέσα στην οποία δεν μπορεί να εισέλθει όχημα και αν ακόμη οι φωτεινοί σηματοδότες επιτρέπουν αυτό, όταν η πυκνότητα της κυκλοφορίας είναι τέτοια ώστε, αν εισέλθει, να υποχρεωθεί πιθανώς να παραμείνει στη διασταύρωση. Η παρ. 2 του άρθρου 30, περί ισόπεδων οδικών κόμβων και υποχρεώσεων παραχώρησης προτεραιότητας, εξακολουθεί να ισχύει και αν ακόμη δεν υπάρχει η πιο πάνω διαγράμμιση,\nστ) συνεχής ή διακεκομμένη γραμμή που προσδιορίζει λωρίδα κυκλοφορίας που συνοδεύεται από πινακίδες σήμανσης ή αναγραφή λέξεων ή απεικόνιση συμβόλων στο οδόστρωμα, όπως λεωφορεία, «ΤΑΞΙ» και ποδήλατα, η οποία σημαίνει ότι η χρήση της λωρίδας κυκλοφορίας επιτρέπεται μόνο στα αναγραφόμενα ή απεικονιζόμενα οχήματα,\nζ) βέλη εκτροπής, βέλη επιλογής, παράλληλες ή λοξές λωρίδες, πικτογράμματα ή αναγραφές μπορούν να χρησιμοποιούνται για την επανάληψη των δεδομένων από πινακίδες οδηγιών ή για να δίνουν σε αυτούς που χρησιμοποιούν τις οδούς πληροφορίες, οι οποίες δεν μπορούν να δοθούν ικανοποιητικά με πινακίδες. Τέτοιες διαγραμμίσεις χρησιμοποιούνται ιδίως για να δείχνουν τις οριογραμμές ζωνών ή λωρίδων στάθμευσης, για να σημειώσουν στάσεις λεωφορείων και για την προεπιλογή λωρίδας κυκλοφορίας, μπροστά από διασταυρώσεις. Αν υπάρχει βέλος επιλογής στο οδόστρωμα, όπου αυτό είναι χωρισμένο σε λωρίδες κυκλοφορίας με κατά μήκος διαγραμμίσεις, οι οδηγοί υποχρεούνται να επιλέγουν έγκαιρα τη λωρίδα η οποία φέρει το βέλος της κατεύθυνσης την οποία θέλουν να ακολουθήσουν και δεν μπορούν πλέον να πάρουν άλλη κατεύθυνση,\nη) περιγράμματα ρόμβων κατά αποστάσεις στο μέσο λωρίδας κυκλοφορίας, τα οποία σημαίνουν ότι η λωρίδα αυτή έχει καθοριστεί ως αμέσου ανάγκης, σύμφωνα με την παρ. 3 του άρθρου 48, περί οχημάτων άμεσης ανάγκης και έργων στις οδούς.\n6. Δεν θεωρούνται ως κατά μήκος διαγραμμίσεις, με την έννοια του παρόντος:\nα) οι κατά μήκος γραμμές που χρησιμοποιούνται ως οριογραμμές των άκρων του οδοστρώματος, για να καταστούν αυτά ευκολότερα ορατά,\nβ) οι κατά μήκος γραμμές που συνδέονται με τέτοιες καθέτους οι οποίες χρησιμοποιούνται για την οριοθέτηση χώρων στάθμευσης στο οδόστρωμα και κατά μήκος γραμμές που δείχνουν απαγορεύσεις ή περιορισμούς στις στάσεις ή στις σταθμεύσεις.\n7. Οι διαγραμμίσεις των οδών είναι λευκές, εκτός από:\nα) τις διαγραμμίσεις χώρων όπου επιτρέπεται ή περιορίζεται η στάθμευση, οι οποίες μπορούν να είναι κυανές,\nβ) τις τεθλασμένες γραμμες (ζιγκ-ζαγκ) σε χώρους όπου απαγορεύεται η στάθμευση, οι οποίες είναι κίτρινες,\nγ) τη συνεχή ή διακεκομμένη γραμμή στο κράσπεδο ή το άκρο του οδοστρώματος, της απαγορευτικής ή περιοριστικής στάσης ή στάθμευσης, η οποία είναι κίτρινη,\nδ) τις γραμμές πλέγματος των διασταυρώσεων της περ. ε) της παρ. 5, οι οποίες είναι κίτρινες. Ως λευκό χρώμα νοούνται και οι αποχρώσεις του αργυρόχρου ή του ανοικτού γκρίζου χρώματος. Σε περίπτωση ανάγκης προσωρινής ακύρωσης των μόνιμων διαγραμμίσεων με αντικατάσταση με άλλες, οι προσωρινές αυτές διαγραμμίσεις πρέπει να είναι χρώματος άλλου από το συνήθως χρησιμοποιούμενο και από υλικό το οποίο δύναται να εξαλείφεται εύκολα. Για τις προσωρινές διαγραμμίσεις οδών, μπορεί να χρησιμοποιούνται κατάλληλα προς τούτο υλικά ή αντικείμενα όπως είναι, ενδεικτικά, οι ανακλαστήρες, οι φωτεινοί δείκτες και οι κώνοι, οι προδιαγραφές των οποίων καθορίζονται σύμφωνα με την παρ. 5 του άρθρου 14, περί εγκατάστασης μέσων σήμανσης και σηματοδότησης.\n8. Απαγορεύεται οι οδηγοί των οδικών οχημάτων:\nα) να διαβαίνουν την εκ μίας (1) ή δύο (2) συνεχών γραμμών, κατά μήκος, διαγράμμιση, καθώς και να κινούνται στην αριστερή πλευρά αυτής,\nβ) να διαβαίνουν την εκ διπλών διακεκομμένων γραμμών, κατά μήκος, διαγράμμιση, καθώς και να κινούνται στην αριστερή πλευρά αυτής, όταν η διαγράμμιση αυτή διαχωρίζει τις δύο (2) κατευθύνσεις,\nγ) σε μία (1) συνεχή γραμμή και άλλη παραπλεύρως διακεκομμένη, να διαβαίνουν τη συνεχή γραμμή, όταν κινούνται επί της πλευράς αυτής, επιτρεπόμενης της κίνησης και της προσπέρασης από την πλευρά της διακεκομμένης. Στην περίπτωση αυτή, η συνεχής γραμμή δεν εμποδίζει τον οδηγό ο οποίος προσπέρασε κατά τον επιτρεπόμενο τρόπο να επανέλθει στην κανονική του θέση επί του οδοστρώματος,\nδ) να κινούνται πάνω σε κατά μήκος διαγραμμίσεις (ιππαστί), με την επιφύλαξη της περ. β) της παρ. 9 του άρθρου 21, περί προσπέρασης, κυκλοφορίας σε στοίχους, επιτρεπτής αλλαγής λωρίδας και κίνησης μοτοποδηλάτων και μοτοσυκλετών σε πυκνή κυκλοφορία,\nε) να υπερβαίνουν τη διαγράμμιση μιας συνεχούς γραμμής κατά πλάτος σε περίπτωση υποχρεωτικής διακοπής πορείας,\nστ) να υπερβαίνουν τη διαγράμμιση μιας διακεκομμένης γραμμής κατά πλάτος σε περίπτωση υποχρεωτικής παραχώρησης προτεραιότητας,\nζ) να εισέρχονται σε περιοχή του οδοστρώματος η οποία προσδιορίζεται με παράλληλες λοξές λωρίδες και πλαισιώνεται με συνεχή γραμμή. Αν η περιοχή αυτή πλαισιώνεται με διακεκομμένη γραμμή, οι οδηγοί επιτρέπεται να εισέρχονται σε αυτή μόνον όταν βεβαιωθούν ότι είναι δυνατό να κάνουν αυτό ασφαλώς ή για να στρίψουν σε οδό η οποία συμβάλλεται στην πλευρά της αντίθετης κατεύθυνσης της κυκλοφορίας,\nη) να σταθμεύουν στην πλευρά της οδού που έχει διαγραμμιστεί με κίτρινη τεθλασμένη γραμμή (ζιγκ-ζαγκ),\nθ) να σταματούν ή να σταθμεύουν ή να μη συμμορφώνονται με τους περιορισμούς οι οποίοι υποδεικνύονται με άλλα μέσα, κατά περίπτωση επί της πλευράς του οδοστρώματος η οποία έχει τη συνεχή ή διακεκομμένη κίτρινη γραμμή στο κράσπεδο ή το άκρο του οδοστρώματος σε όλο το μήκος της γραμμής αυτής,\nι) να κινούνται μέσα σε λωρίδα κυκλοφορίας, η οποία έχει πινακίδες σήμανσης ή λέξεις ή σύμβολα επί του οδοστρώματος, όπως λεωφορεία, ταξί και ποδήλατα, αν δεν οδηγούν οχήματα της κατηγορία αυτής,\nια) να ακολουθούν στις διασταυρώσεις άλλη κατεύθυνση από αυτήν που δείχνουν τα βέλη επιλογής, αν κινούνται σε λωρίδα κυκλοφορίας προδιαλογής η οποία έχει τα βέλη αυτά,\nιβ) να εισέρχονται σε περιοχή ο
