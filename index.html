δοστρώματος η οποία έχει σημανθεί με πλέγμα κίτρινων γραμμών οι οποίες σχηματίζουν παραλληλόγραμμα, αν η πυκνότητα της κυκλοφορίας είναι τέτοια ώστε, αν εισέλθουν, να υποχρεωθούν, πιθανώς, να παραμείνουν στη διασταύρωση,\nιγ) να διαβαίνουν σε οδούς ταχείας κυκλοφορίας, τις διακεκομμένες κατά μήκος γραμμές, εκτός από την περίπτωση αλλαγής λωρίδας κυκλοφορίας,\nιδ) να παραμένουν, σε περίπτωση υποχρεωτικής διακοπής πορείας, σε επιφάνεια αναμονής της περ. ε) της παρ. 4, εφόσον δεν οδηγούν όχημα που σημαίνεται στην επιφάνεια αυτή.\n9. Αν τα άκρα του οδοστρώματος διαγραμμίζονται μέσω φώτων ή αντανακλαστικών στοιχείων, τα φώτα ή αντανακλαστικά στοιχεία είναι:\nα) είτε όλα λευκού ή ανοιχτού κίτρινου χρώματος,\nβ) είτε λευκού ή κίτρινου χρώματος, προς διαγράμμιση του αντίθετου προς την κατεύθυνση της κυκλοφορίας άκρου του οδοστρώματος, και ερυθρού ή σκούρου κίτρινου χρώματος, προς διαγράμμιση του αντίστοιχου προς την κατεύθυνση της κυκλοφορίας άκρου του οδοστρώματος. Η χάραξη και η σχεδίαση των διαγραμμίσεων των οδών εκτελούνται με βάση τις προδιαγραφές διαγραμμίσεων οδών της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών.\n10. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Β, εκτός από εκείνες:\nα) των περ. α), β), γ),\nστ) και\nη) της παρ. 8, που κατατάσσονται στην κατηγορία Ε2-Β,\nβ) της περ. ι) της παρ. 8, που κατατάσσεται στην κατηγορία Ε1-Α και στην κατηγορία Σ και\nγ) της παρ. 9, που κατατάσσονται στην κατηγορία Ε3-Α.`},
  9: {title:`Φωτεινή σηματοδότηση για την κυκλοφορία οχημάτων`,text:`1. Οι οδηγοί των οδικών οχημάτων συμμορφώνονται με τις πιο κάτω ενδείξεις των φωτεινών σηματοδοτών ρύθμισης της κυκλοφορίας, εκτός αν η ρύθμιση γίνεται από τροχονόμο κατά διαφορετικό τρόπο:\nα) σταθερό πράσινο φως κυκλικής μορφής: O οδηγός προχωρεί κατευθείαν μπροστά ή στρίβει προς τα δεξιά ή αριστερά, εκτός αν άλλο σήμα ή πινακίδα απαγορεύει την κατευθείαν κίνηση ή στροφή. Ακόμη και αν ο φωτεινός σηματοδότης δείχνει πράσινο φως, ο οδηγός, κινούμενος κατευθείαν μπροστά, παραχωρεί προτεραιότητα σε άλλο όχημα ή πεζό που κινείται ακόμη από προηγούμενη σηματοδότηση, ενώ εάν ο ίδιος στρίβει, παραχωρεί προτεραιότητα στους πεζούς, οι οποίοι κινούνται στην οδό στην οποία πρόκειται να εισέλθει,\nβ) σταθερό ερυθρό φως κυκλικής μορφής: Ο οδηγός σταματά προ της ειδικής γραμμής διακοπής αυτής ή, αν δεν υπάρχει τέτοια, σε αρκετή απόσταση από τον σηματοδότη, ώστε η σηματοδότηση να είναι σε αυτόν ευχερώς ορατή, και παραμένει σε στάση μέχρις ότου ανάψει το πράσινο φως. Ο οδηγός δεν εισέρχεται στον οδικό κόμβο, ούτε κινείται πάνω στις διαβάσεις πεζών, εάν ο σηματοδότης είναι τοποθετημένος στο μέσο ή στην απέναντι πλευρά του κόμβου,\nγ) σταθερό κίτρινο φως κυκλικής μορφής: Ο οδηγός σταματά, όπως και στην περ. β), εκτός εάν βρίσκεται τόσο κοντά στον σηματοδότη, ώστε να μην μπορεί να σταματήσει με ασφάλεια,\nδ) απλό ή διπλό κίτρινο φως κυκλικής μορφής, το οποίο αναβοσβήνει (αναλάμπον): Ο οδηγός ανακόπτει ταχύτητα, προχωρεί με ιδιαίτερη προσοχή και παραχωρεί προτεραιότητα στους πεζούς και στα οχήματα,\nε) απλό ερυθρό φως, το οποίο αναβοσβήνει (αναλάμπον), κυκλικής μορφής ή διπλό εναλλασσόμενο στον ίδιο ιστό, στο ίδιο ύψος και προς την ίδια κατεύθυνση, το οποίο υποδηλώνει την ύπαρξη μεγάλου κινδύνου: Ο οδηγός ακινητοποιεί το όχημά του, όπως στην περ. β). Η σηματοδότηση αυτή χρησιμοποιείται μόνο σε ισόπεδες σιδηροδρομικές διαβάσεις, σε προσβάσεις σε κινητές γέφυρες ή αποβάθρες οχηματαγωγών, όταν πυροσβεστικά οχήματα εισέρχονται στην οδό ή πλησιάζουν αεροσκάφη, τα οποία θα διέλθουν σε χαμηλό ύψος πάνω από την οδό,\nστ) πράσινο φως με μορφή ενός ή περισσοτέρων βελών: Ο οδηγός μπορεί να προχωρήσει μόνο προς την κατεύθυνση που δείχνει το βέλος ή τα βέλη. Βέλος το οποίο δείχνει προς τα πάνω σημαίνει υποχρεωτική κίνηση κατευθείαν μπροστά.\nζ) σηματοδότης τρίχρωμου συστήματος, ο οποίος περιλαμβάνει ένα (1) ή περισσότερα πρόσθετα πράσινα βέλη: Ο οδηγός μπορεί να προχωρεί προς την κατεύθυνση που δείχνει τα βέλος ή τα βέλη, ανεξάρτητα από το χρώμα το οποίο έχει ο σηματοδότης κατά τη στιγμή εκείνη, αφού προηγουμένως εισέλθει στη λωρίδα κυκλοφορίας, η οποία προορίζεται για τα οχήματα που κινούνται προς την κατεύθυνση που δείχνει το βέλος ή τα βέλη. Οδηγός, ο οποίος βρίσκεται μέσα στη λωρίδα κυκλοφορίας που προορίζεται για τα οχήματα που κινούνται προς την κατεύθυνση του βέλους, κινείται προς την κατεύθυνση αυτή, εκτός εάν η διακοπή της πορείας του δεν εμποδίζει την κίνηση των οχημάτων που κινούνται πίσω του στην ίδια λωρίδα. Ο οδηγός επιτρέπεται να προχωρήσει προς την κατεύθυνση που δείχνει το βέλος μόνο αν το επιτρέπουν οι συνθήκες κυκλοφορίας στην οδό στην οποία πρόκειται να εισέλθει και δεν εκτίθενται σε κίνδυνο οι πεζοί,\nη) ερυθρό φως με μορφή βέλους: Ο οδηγός απαγορεύεται να κινηθεί προς την κατεύθυνση που δείχνει το βέλος και σταματά το όχημά του, όπως στην περ. β).\nθ) κίτρινο φως με μορφή βέλους, το οποίο είναι σταθερό ή αναβοσβήνει: Ο οδηγός έχει τις ίδιες υποχρεώσεις όπως και προ κίτρινου φωτός κυκλικής μορφής.\nι) φως με μορφή δύο (2) ράβδων που τέμνονται σε σχήμα «Χ», το οποίο είναι τοποθετημένο πάνω από λωρίδα κυκλοφορίας, σε οδόστρωμα με περισσότερες από δύο (2) λωρίδες, οι οποίες χωρίζονται με κατά μήκος διαγραμμίσεις: Εφόσον το χρώμα του φωτός είναι κόκκινο, απαγορεύεται η χρησιμοποίηση της λωρίδας αυτής. Εφόσον το χρώμα του φωτός είναι πράσινο και έχει τη μορφή ενός βέλους το οποίο δείχνει προς τα κάτω, παρέχεται δικαίωμα κίνησης στη λωρίδα αυτή.\n2. Φωτεινοί σηματοδότες οι οποίοι έχουν ένδειξη ποδήλατο, λεωφορείο ή άλλο όχημα στα φώτα ή σηματοδότες με μέγεθος μικρότερο του κανονικού, με ορθογώνια παραλληλόγραμμη πινακίδα που φέρει ένδειξη συγκεκριμένου οχήματος στον ιστό τους, ισχύουν μόνο για τους οδηγούς των αντίστοιχων οχημάτων.\n3. Οι παραβάσεις για τον οδηγό των παρ. 1 και 2 κατατάσσονται στην κατηγορία Ε1-Α, εκτός από τις περ. β), ε),\nη) και\nι) της παρ. 1, που κατατάσσονται στην κατηγορία Ε4 και για τις οποίες επιβάλλονται στον παραβάτη διοικητικό πρόστιμο επτακοσίων (700) ευρώ και το διοικητικό μέτρο της επί τόπου αφαίρεσης της άδειας οδήγησης για εξήντα (60) ημέρες.`},
  11: {title:`Φωτεινή σηματοδότηση για τους πεζούς`,text:`1. Οι πεζοί συμμορφώνονται με τις ενδείξεις των ειδικών για τους ίδιους φωτεινών σηματοδοτών ως ακολούθως, εκτός εάν η ρύθμιση της κυκλοφορίας γίνεται από τροχονόμους κατά διαφορετικό τρόπο.\nα) σταθερό πράσινο φως με σύμβολο ατόμου που βαδίζει: Οι πεζοί μπορούν να διασχίσουν το οδόστρωμα.\nβ) σταθερό ερυθρό φως με σύμβολο ατόμου σε στάση: Οι πεζοί απαγορεύεται να διασχίσουν το οδόστρωμα.\nγ) πράσινο φως, το οποίο αναβοσβήνει με σύμβολο ατόμου που βαδίζει: Οι πεζοί μπορούν να διασχίσουν το οδόστρωμα, με ιδιαίτερη προσοχή.\n2. Αν ο πεζός καταληφθεί στη διάβαση από την ερυθρά ένδειξη του σηματοδότη του (με το σύμβολο του ατόμου σε στάση), δικαιούται να συνεχίσει την πορεία του προς την απέναντι πλευρά της οδού.\n3. H παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε1-Α.`},
  13: {title:`Σήμανση των εργασιών που εκτελούνται στις οδούς`,text:`1. Όταν εκτελούνται στις οδούς εργασίες, όλες οι πινακίδες σήμανσης που απαιτούνται κατά περίπτωση (κινδύνου, ρυθμιστικές, πληροφοριακές) τοποθετούνται σε κατάλληλες θέσεις, σύμφωνα με το άρθρο 14, περί εγκατάστασης μέσων σήμανσης και σηματοδότησης.\n2. Τα όρια των εργασιών που εκτελούνται επί του οδοστρώματος και οι χώροι εναπόθεσης υλικών επισημαίνονται με την τοποθέτηση συνεχών ή διακεκομμένων εμποδίων, τα οποία φέρουν εναλλασσόμενες λωρίδες ερυθρού και λευκού χρώματος. Κατά τη νύχτα, εάν τα εμπόδια δεν είναι αντανακλαστικά, με φώτα και αντανακλαστικά στοιχεία, τα αντανακλαστικά στοιχεία και σταθερά φώτα που χρησιμοποιούνται για τον σκοπό αυτό είναι χρώματος ερυθρού, και αν χρησιμοποιηθούν φώτα τα οποία αναβοσβήνουν, έχουν χρώμα βαθύ κίτρινο. Κατ’ εξαίρεση:\nα) φώτα και αντανακλαστικά στοιχεία ορατά μόνο από τη μία (1) κατεύθυνση της κυκλοφορίας, τα οποία επισημαίνουν τα όρια οδικών εργασιών επί της απέναντι πλευράς της οδού, είναι λευκά,\nβ) φώτα και αντανακλαστικά στοιχεία, τα οποία επισημαίνουν τα όρια οδικών εργασιών, οι οποίες διαχωρίζουν τις δύο (2) κατευθύνσεις της κυκλοφορίας, είναι λευκά ή κίτρινα ανοικτού χρώματος.\n3. Τα μέσα σήμανσης των παρ. 1 και 2 τοποθετούνται με μέριμνα και ευθύνη των εργοληπτών ή των εκτελούντων τις εργασίες και, σε περίπτωση κατά την οποία οι εργασίες εκτελούνται απολογιστικά, από τον επιβλέποντα το έργο. Οι φορείς που κατασκευάζουν τα διάφορα έργα στις οδούς ή αναθέτουν την κατασκευή τους σε τρίτους ελέγχουν την τοποθέτηση των μέσων σήμανσης.\n4. Οι παραβάσεις της παράλειψης τοποθέτησης και συντήρησης των ανωτέρω μέσων σήμανσης, της πλημμελούς τοποθέτησης και της παράλειψης αφαίρεσής τους μετά την ολοκλήρωση των εργασιών του παρόντος κατατάσσονται στην κατηγορία Ε4 και τιμωρούνται με διοικητικό πρόστιμο χιλίων πεντακοσίων (1.500) ευρώ και ποινή φυλάκισης έως δώδεκα (12) μηνών, ανεξαρτήτως εάν η πρόκληση κινδύνου ή ζημιάς ή βλάβης τιμωρείται αυτοτελώς από άλλες διατάξεις.`},
  16: {title:`Κανόνες οδικής συμπεριφοράς`,text:`1. Όποιος χρησιμοποιεί το οδικό δίκτυο πρέπει να αποφεύγει οποιαδήποτε συμπεριφορά η οποία ενδεχομένως προκαλεί κίνδυνο ή εμπόδια στην κυκλοφορία, εκθέτει σε κίνδυνο πρόσωπα ή ζώα ή προκαλεί ζημιές σε δημόσιες ή ιδιωτικές περιουσίες. Οι οδηγοί υποχρεούνται να οδηγούν με σύνεση και με διαρκώς τεταμένη την προσοχή, να επιδεικνύουν ιδιαίτερη προσοχή στα παιδιά, τους υπερήλικες, τα άτομα με αναπηρία και γενικώς στα πρόσωπα που χρειάζονται βοήθεια και να μην προκαλούν γενικά με τη συμπεριφορά τους τρόμο, ανησυχία ή παρενόχληση στους λοιπούς χρήστες των οδών, τους παρόδιους ή τους κατοικούντες πλησίον αυτών.\n2. Δεν επιτρέπεται η απόθεση ή εγκατάλειψη ή η απόρριψη οποιουδήποτε αντικειμένου ή ύλης στις οδούς, εφόσον παρακωλύει έστω και κατ’ ελάχιστο την κυκλοφορία των πεζών και των οχημάτων, καθώς και τη στάθμευση των οχημάτων. Δεν επιτρέπεται να χύνονται στις οδούς ουσίες ή υλικά, όπως είναι τα νερά, τα λάδια και ο ασβέστης, τα οποία μπορούν να καταστήσουν την οδό ολισθηρή.\n3. Δεν επιτρέπεται η απόρριψη από το όχημα οποιουδήποτε αντικειμένου, έστω και αν από αυτό δεν καθίσταται επικίνδυνη ούτε παρακωλύεται η κυκλοφορία. Δεν επιτρέπεται η απόρριψη από το όχημα κάθε αντικειμένου ή ουσίας που μπορεί να προκαλέσει πυρκαγιά ή να ρυπάνει το περιβάλλον.\n4. Αν οι χρήστες των οδών δεν μπορούν να αποφύγουν την πρόκληση εμποδίου ή κινδύνου, υποχρεούνται να λαμβάνουν αμέσως τα αναγκαία μέτρα για την απομάκρυνση ή αποτροπή αυτού και, εάν δεν μπορούν, οφείλουν να ειδοποιούν τους λοιπούς χρήστες της οδού για την ύπαρξη του εμποδίου ή του κινδύνου. Αυτοί που επιθυμούν, για εύλογη αιτία, όπως είναι οι μεταφορές, η επιβίβαση και η αποβίβαση, να καταλάβουν για λίγο μέρος του πεζοδρομίου ή του οδοστρώματος, οφείλουν να λάβουν τα κατάλληλα μέτρα για την απρόσκοπτη και ασφαλή κυκλοφορία πεζών και οχημάτων.\n5. Η χρήση των ζωνών ασφαλείας είναι υποχρεωτική τόσο για τους οδηγούς όσο και για τους επιβάτες. Σε περίπτωση μεταφοράς ανηλίκων επιβατών, εφόσον στο όχημα υπάρχει συνοδός, την ευθύνη φέρει αυτός. Για τη μεταφορά παιδιών με αυτοκίνητο είναι υποχρεωτική η χρήση ειδικών μέσων συγκράτησης και προστασίας, όπως είναι τα καθίσματα και οι ζώνες ασφαλείας.\n6. Οι οδηγοί και οι επιβάτες μοτοποδηλάτων, μοτοσικλετών και τρίτροχων οχημάτων, τα οποία δεν διαθέτουν κουβούκλιο, υποχρεούνται να φορούν προστατευτικό κράνος, κανονικά δεμένο.\n7. Οι οδηγοί οχημάτων οφείλουν να συμπεριφέρονται με ευγένεια στους πεζούς και τους άλλους οδηγούς. Οι οδηγοί των επιβατηγών αυτοκινήτων δημόσιας χρήσης (Ε.Δ.Χ.) της περ. 19 του άρθρου 4 και οι οδηγοί των μέσων μαζικής μεταφοράς, περιλαμβανομένων και των τουριστικών οχημάτων, οφείλουν να συμπεριφέρονται με ευγένεια στους επιβάτες.\n8. Για την εξοικείωση των μαθητών με τους κανόνες οδικής συμπεριφοράς, μπορεί να προβλέπεται η καθιέρωση αντίστοιχου μαθήματος.\n9. Απαγορεύεται η οδήγηση οδικών οχημάτων για επίδειξη ικανότητας, εντυπωσιασμό, ανταγωνισμό ή τέλεση αυτοσχέδιων αγώνων.\n10. Απαγορεύεται, εκατέρωθεν του οδοστρώματος των αυτοκινητοδρόμων, η στάθμευση οχημάτων και η εγκατάσταση υπαίθριων μικροκαταστημάτων ή κινητών και ακίνητων καντινών για την πώληση διαφόρων ειδών. Στο λοιπό οδικό δίκτυο είναι δυνατή η εγκατάσταση των ανωτέρω, μετά από άδεια των αρμόδιων για τη συντήρηση του οδικού δικτύου αρχών, που χορηγείται μόνο μετά από σύμφωνη γνώμη των κατά τόπους αρμόδιων υπηρεσιών της Τροχαίας. 11.α) Οι παραβάσεις των παρ. 1 και 4 κατατάσσονται στην κατηγορία Ε2-Α. Στην ίδια κατηγορία κατατάσσεται η παράβαση της παρ. 5 όσον αφορά τη μη χρήση ζώνης ασφαλείας από τους επιβάτες.\nβ) Οι παραβάσεις των παρ. 2 και 6, όσον αφορά στη μη χρήση προστατευτικού κράνους από τους επιβάτες, κατατάσσονται στην κατηγορία Ε3-Α.\nγ) Οι παραβάσεις των παρ. 3 και 7 κατατάσσονται στην κατηγορία Ε2-Α και στην κατηγορία Σ.\nδ) Οι παραβάσεις του πρώτου και του τρίτου εδαφίου της παρ. 5 που αφορούν στη μη χρήση ζώνης ασφαλείας από τον οδηγό και στη μη χρήση ειδικών μέσων συγκράτησης και προστασίας για τη μεταφορά παιδιών, της παρ. 6, όσον αφορά στη μη χρήση προστατευτικού κράνους από τον οδηγό, καθώς και η παράβαση της παρ. 10, κατατάσσονται στην κατηγορία Ε3-Β.\nε) Η παράβαση της παρ. 9 κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της επί τόπου αφαίρεσης της άδειας οδήγησης για ένα (1) έτος.`},
  17: {title:`Οδηγοί`,text:`1. Κάθε κινούμενο όχημα ή συνδυασμός οχημάτων επιβάλλεται να έχει οδηγό. α.\nαα) Κατ’ εξαίρεση του πρώτου εδαφίου της παρούσας παραγράφου επιτρέπεται να κυκλοφορεί επί της οδού, χωρίς την παρουσία οδηγού επ’ αυτού, Λεωφορείο Αστικού Τύπου στο πλαίσιο πιλοτικής εφαρμογής ή δοκιμαστικής λειτουργίας για ερευνητικούς ή άλλους σκοπούς. Η κυκλοφορία του επιτρέπεται, με απόφαση του δημοτικού συμβουλίου μετά από σύμφωνη γνώμη των κατά τόπους αρμοδίων υπηρεσιών τροχαίας ή των αστυνομικών υπηρεσιών που ασκούν καθήκοντα τροχαίας, για καθορισμένη χρονική περίοδο και συγκεκριμένη αστική ή περιαστική διαδρομή, που καθορίζεται μετά από κυκλοφοριακή μελέτη, σύμφωνα με το άρθρο 55 του παρόντος, περί μέτρων ρύθμισης οδικής κυκλοφορίας, και το άρθρο 83 του Κώδικα Δήμων και Κοινοτήτων (ν. 3463/2006, Α’ 114), περί δημοτικής συγκοινωνίας, εφόσον η κυκλοφορία του οχήματος πραγματοποιείται στο πλαίσιο εκτέλεσης δημοτικής συγκοινωνίας. Ειδικώς για την εκτέλεση της δημοτικής συγκοινωνίας επιτρέπεται, για τους σκοπούς του παρόντος, η χρήση οχημάτων ιδιοκτησίας του φορέα υλοποίησης του ερευνητικού προγράμματος ή του προμηθευτή/κατασκευαστή, στην περίπτωση που το υπόψη πρόγραμμα αποτελεί δράση προεμπορικών δημόσιων συμβάσεων.\nαβ) Το Λεωφορείο Αστικού Τύπου χωρίς οδηγό επιβάλλεται να διαθέτει κατάλληλους μηχανισμούς και αυτόματα συστήματα, τα οποία εξασφαλίζουν συμπεριφορά κίνησης, πέδησης και ακινητοποίησης, αντίστοιχη με λεωφορείο, το οποίο χειρίζεται οδηγός.\nαγ) Για τη διασφάλιση της απρόσκοπτης κίνησης του Λεωφορείου Αστικού Τύπου χωρίς οδηγό, την ασφάλεια των επιβατών και των λοιπών χρηστών της οδού, επιβάλλεται η παρακολούθηση του λεωφορείου και της οδού, στην οποία κινείται, καθ’ όλη τη διάρκεια κίνησής του, από Κέντρο Ελέγχου μέσω ηλεκτρονικών συσκευών λήψης και καταγραφής εικόνας (κάμερες) και ήχου. Οι παραπάνω συσκευές τοποθετούνται επί της εξωτερικής πλευράς του οχήματος και σε προκαθορισμένα σημεία της διαδρομής, προκειμένου να υπάρχει πλήρης έλεγχος της κίνησης του λεωφορείου, της λοιπής κυκλοφορίας της οδού και του οδικού περιβάλλοντος, ώστε να παρέχεται η δυνατότητα από το κέντρο ελέγχου, ακινητοποίησής του ή πραγματοποίησης ελιγμών για την αποφυγή εμποδίων, σε περίπτωση που το επιβάλλουν οι συνθήκες κυκλοφορίας ή λόγοι έκτακτης ανάγκης. Για λόγους ασφάλειας των επιβατών και για λόγους δημόσιας ασφάλειας είναι δυνατή η παρακολούθηση του εσωτερικού του λεωφορείου χωρίς οδηγό, καθ’ όλη τη διάρκεια κίνησής του, από κέντρο ελέγχου μέσω ηλεκτρονικών συσκευών λήψης και καταγραφής εικόνας (κάμερες) και ήχου.\nαδ) Ο υπεύθυνος για την παρακολούθηση της κίνησης του λεωφορείου που βρίσκεται στο Κέντρο Ελέγχου οφείλει να είναι κάτοχος αντίστοιχης ισχύουσας κατηγορίας άδειας οδήγησης και Πιστοποιητικού Επαγγελματικής Ικανότητας οδηγού οχημάτων μεταφοράς επιβατών και είναι υπεύθυνος για την κυκλοφορία του οχήματος χωρίς οδηγό. Ευθύνεται, κατά τις διατάξεις του παρόντος, ως οδηγός του οχήματος, για την ακινητοποίηση αυτού ή την πραγματοποίηση ελιγμών για την αποφυγή εμποδίων, σε περίπτωση που το επιβάλλουν οι συνθήκες κυκλοφορίας ή λόγοι έκτακτης ανάγκης. Ο υπεύθυνος για την παρακολούθηση της κίνησης του λεωφορείου στο κέντρο ελέγχου παρακολουθεί ταυτόχρονα την κίνηση έως τεσσάρων (4) λεωφορείων, εκτός αν ιδιαίτεροι λόγοι ασφαλείας, όπως αυξημένη ταχύτητα, υψηλός κυκλοφοριακός φόρτος, επιβάλλουν τον περιορισμό του αριθμού αυτού.\nαε) Το Λεωφορείο Αστικού Τύπου χωρίς οδηγό κυκλοφορεί επί της προκαθορισμένης διαδρομής που προβλέπεται στην ως άνω κυκλοφοριακή μελέτη και η θέση του επί της οδού καθορίζεται από το άρθρο 20, περί θέσης επί της οδού. Το Λεωφορείο Αστικού Τύπου χωρίς οδηγό συμμορφώνεται πλήρως με τους κανόνες οδικής κυκλοφορίας συμπεριλαμβανομένων εκείνων που δίνονται μέσω οδικής σήμανσης και σηματοδότησης, καθώς και με τα σήματα των τροχονόμων.\nαστ) Η κυκλοφορία του Λεωφορείου Αστικού Τύπου χωρίς οδηγό στο πλαίσιο πιλοτικής εφαρμογής ή δοκιμαστικής λειτουργίας για τους σκοπούς της παρούσας περίπτωσης διεξάγεται σε διαδοχικά στάδια, κατόπιν αξιολόγησης των αποτελεσμάτων κάθε σταδίου, τα οποία καθορίζουν τη φύση και τις προϋποθέσεις υλοποίησης του επόμενου, καθώς και την ανάγκη λήψης πρόσθετων μέτρων ή παρεμβάσεων, ώστε να ελέγχεται η ασφαλής κυκλοφορία του οχήματος. β. Κατ’ εξαίρεση του πρώτου εδαφίου της παρούσας παραγράφου, επιτρέπεται η θέση σε κυκλοφορία επί της οδού αυτοκινήτου επιβατηγού ή φορτηγού αυτοκινήτου με μέγιστο βάρος έως τρεισήμισι (3,5) τόνους, χωρίς την παρουσία οδηγού επ’ αυτού, στο πλαίσιο πιλοτικής εφαρμογής για ερευνητικούς σκοπούς, κατόπιν υποβολής από τον ενδιαφερόμενο φορέα σχετικού τεκμηριωμένου αιτήματος. Για την έγκριση θέσης σε κυκλοφορία οχήματος, δυνάμει της παρούσας περίπτωσης, ισχύουν κατ’ αντιστοιχία, οι όροι και προϋποθέσεις των υποπερ. αα) έως αστ) της περ. α’.\n2. Ο οδηγός επιβάλλεται να έχει την κατά τις σχετικές διατάξεις προβλεπόμενη άδεια οδήγησης και την αναγκαία σωματική και διανοητική ικανότητα και να βρίσκεται σε κατάλληλη κατάσταση για να οδηγεί. Κατά τον χρόνο της οδήγησης οφείλει να είναι σε θέση να ελέγχει το όχημά του ή τα ζώα του. Ο οδηγός κάθε οχήματος υποχρεούται να έχει πλήρη ελευθερία των κινήσεών του, για να ενεργεί ελεύθερα τους αναγκαίους χειρισμούς. Ιδιαίτερα, απαγορεύεται να χρησιμοποιεί εν κινήσει ενσύρματα ακουστικά που έχουν συνδεθεί με φορητά ραδιόφωνα ή άλλες παρεμφερείς ηχητικές συσκευές, καθώς και τηλεόραση ή άλλη φορητή ηλεκτρονική συσκευή με οθόνη αφής, που λειτουργεί ως τέτοια. Η εν κινήσει χρήση κινητού ή άλλης ηλεκτρονικής συσκευής για βιντεοσκόπηση ή ζωντανή μετάδοση από τη θέση του οδηγού απαγορεύεται, εκτός αν το κινητό ή η συσκευή έχουν τοποθετηθεί σε ειδική θέση. Η εν κινήσει χρήση κινητού τηλεφώνου ή άλλων συσκευών τηλεπικοινωνίας, όπως φορητών ηλεκτρονικών συσκευών με τη μορφή ρολογιού χειρός, επιτρέπεται μόνο όταν αυτό είναι τοποθετημένο σε ειδική θέση για ανοικτή ακρόαση ή για λειτουργία εφαρμογών πλοήγησης ή όταν χρησιμοποιείται με ακουστικό ασύρματης επικοινωνίας.\n3. Ο οδηγός μηχανοκίνητου οχήματος και μοτοποδηλάτου έχει, κατά τις σχετικές διατάξεις, τις αναγκαίες γνώσεις και επιδεξιότητα για να οδηγεί. Τις αυτές αναγκαίες γνώσεις πρέπει να έχει και ο εκπαιδευόμενος οδηγός, όταν οδηγεί.\n4. Ο οδηγός αυτοκινήτου οχήματος που μεταφέρει επικίνδυνες ύλες πάνω από ορισμένες ποσότητες επιβάλλεται να έχει υποστεί την, κατά τις σχετικές διατάξεις, αναγκαία επαγγελματική κατάρτιση, για να ενεργεί και να οδηγεί το όχημα, ώστε να μην κινδυνεύουν οι άνθρωποι, το περιβάλλον, τα ζώα και η προσωπική του ασφάλεια.\n5. Οι οδηγοί λεωφορείων, επιβατηγών δημόσιας χρήσης, εκμισθούμενων επιβατηγών ιδιωτικής χρήσης με οδηγό και φορτηγών αυτοκινήτων απαγορεύεται να οδηγούν πέραν των χρονικών ορίων τα οποία καθορίζονται από τις κείμενες διατάξεις. Οι κάτοχοι των επιβατηγών αυτοκινήτων δημόσιας χρήσης (Ε.Δ.Χ.) της περ. 19 του άρθρου 4, καθώς και οι κάτοχοι των μέσων μαζικής μεταφοράς και των τουριστικών οχημάτων, φροντίζουν για την ύπαρξη μέτρων παθητικής ασφάλειας των επιβατών. Οι οδηγοί οφείλουν να οδηγούν με σύνεση, ώστε να είναι απόλυτα ασφαλής η μεταφορά των επιβατών. 6.α) Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε1-Α.\nβ) Οι παραβάσεις της παρ. 2 κατατάσσονται στην κατηγορία Ε3-Β πλην της παράβασης του πρώτου εδαφίου της παρ. 2 που κατατάσσεται στην κατηγορία Ε2-Α και στην κατηγορία Σ.\nβα) Στην περίπτωση της παράβασης του έκτου εδαφίου της παρ. 2, που αφορά στην εν κινήσει χρήση κινητού τηλεφώνου, επιπλέον των διοικητικών κυρώσεων της περ. β, εάν ο οδηγός γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε βαριά σωματική βλάβη ή σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων επιβάλλονται οι ποινές των περ. γγ) και\nδδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί επικίνδυνης οδήγησης. Για την αξιόποινη πράξη του πρώτου εδαφίου της παρούσας υποπερίπτωσης, η έρευνα μπορεί να συμπεριλάβει και τη διενέργεια άρσης του απορρήτου του περιεχομένου των επικοινωνιών και των δεδομένων θέσης και κίνησης αυτών, με την τήρηση των εγγυήσεων και τις διαδικασίες των άρθρων 6, περί άρσης του απορρήτου των επικοινωνιών για τη διακρίβωση εγκλημάτων, 7, περί διαχείρισης υλικού σε άρσεις για τη διερεύνηση εγκλημάτων, και 8, περί διαδικασίας άρσης του απορρήτου, του ν. 5002/2022 (Α’ 228).\nγ) Η παράβαση της παρ. 3 κατατάσσεται στην κατηγορία Ε1-Β.\nδ) Στις παραβάσεις της παρ. 5,\nδα) η παράβαση του πρώτου εδαφίου κατατάσσεται στην κατηγορία Ε2-Α, πλην των οδηγών φορτηγών οχημάτων, οι οποίοι τιμωρούνται σύμφωνα με τις ειδικές διατάξεις του ν. 3446/2006 (Α’ 49),\nδβ) η παράβαση του δεύτερου εδαφίου κατατάσσεται στην κατηγορία Ε3-Α,\nδγ) η παράβαση του τρίτου εδαφίου κατατάσσεται στην κατηγορία Ε1-Α και στην κατηγορία Σ. 7. Ο Περιφερειάρχης ή οι από αυτόν εξουσιοδοτούμενες αρχές μπορούν να επιβάλλουν την επανεξέταση κατόχου άδειας οδήγησης, αν ανακύψουν αμφιβολίες για την ικανότητά του προς οδήγηση ή την ιατρική επανεξέτασή του, αν ανακύψουν αμφιβολίες για τη σωματική ή πνευματική του κατάσταση. Στις περιπτώσεις αυτές η άδεια οδήγησης του παραπεμπομένου για επανεξέταση οδηγού αφαιρείται μετά την έκδοση της απόφασης για επανεξέταση και αποδίδεται μόνο αν αυτός κριθεί ικανός.`},
  18: {title:`Ζώα, αναβάτες αλόγων,  συνοδοί και οδηγοί ζώων`,text:`1. Ζώα επιτρέπεται να οδηγούνται μόνο από ανθρώπους απόλυτα ικανούς στον χειρισμό τους και που είναι σε θέση να τα ελέγχουν πλήρως.\n2. Ζώα που είναι πιθανό να θέσουν σε κίνδυνο τους χρήστες των οδών δεν επιτρέπεται να κινούνται σε οδούς, εκτός αν βρίσκονται κάτω από την επίβλεψη και του έλεγχο κατάλληλου οδηγού. Τα σκυλιά πρέπει, γενικά, να είναι δεμένα με ειδικό λουρί.\n3. Ζώα επικίνδυνα, είτε σε αγέλες ή κοπάδια, πρέπει να κινούνται κάτω από τον έλεγχο ενός ατόμου επικεφαλής. Μεγάλες αγέλες ή κοπάδια ζώων πρέπει να έχουν πολλούς οδηγούς.\n4. Εφόσον μεγάλα ζώα ή αγέλες ή κοπάδια κινούνται κατά τη διάρκεια της νύχτας στις οδούς, οι οδηγοί τους υποχρεούνται να επισημαίνουν τα ζώα, καθώς και την αρχή και το τέλος της αγέλης ή του κοπαδιού με ευδιάκριτα φώτα.\n5. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε2-Α, εκτός εάν τιμωρούνται βαρύτερα με άλλη διάταξη.`},
  19: {title:`Εκπομπές ρύπων και θόρυβοι`,text:`1. Απαγορεύονται η κυκλοφορία και η οδήγηση κάθε οδικού οχήματος το οποίο:\nα) εκπέμπει ουσίες ή προϊόντα βλαπτικά για την υγεία του ανθρώπου ή που ρυπαίνουν το περιβάλλον πέραν των επιτρεπόμενων ορίων,\nβ) προκαλεί γενικά από την κίνηση και λειτουργία του θόρυβο πέραν των επιτρεπόμενων ορίων.\n2. Οι παραβάσεις της παρ. 1 κατατάσσονται στην κατηγορία Ε3-Β και στην κατηγορία Σ και τα στοιχεία κυκλοφορίας του οχήματος αφαιρούνται επί τόπου. Τα αφαιρούμενα στοιχεία κρατούνται στην αρμόδια αρχή μέχρι να προσκομιστεί από τον παραβάτη σημείωμα της αρμόδιας υπηρεσίας της Περιφερειακής Ενότητας για την καταλληλότητα του οχήματος από πλευράς εκπομπής καυσαερίων ή θορύβων. Στους παραβάτες της υποχρέωσης περί έκδοσης κάρτας ελέγχου καυσαερίων επιβάλλονται οι κυρώσεις του άρθρου 4 του π.δ. 363/1995 (Α’ 193).\n3. Οι οδηγοί οδικών οχημάτων υποχρεούνται να μην παρενοχλούν τους άλλους χρήστες της οδού, τους παρόδιους και τους διαμένοντες επί της οδού, προκαλώντας, μεταξύ άλλων, θόρυβο από τη χρήση ηχητικού συστήματος ή από οποιαδήποτε άλλη πηγή, σκόνη, καπνό ή ρίψη υγρών. Οι παραβάσεις του πρώτου εδαφίου κατατάσσονται στην κατηγορία Ε3 - Β και στην κατηγορία Σ.`},
  21: {title:`β) όταν ο οδηγός που προπορεύεται στην αυτή λωρίδα κυκλοφορίας δώσει σήμα ότι προτίθεται να προσπεράσει άλλον,`,text:`Προσπέραση, κυκλοφορία σε στοίχους, επιτρεπτή αλλαγή λωρίδας και κίνηση μοτοποδηλάτων και μοτοσυκλετών σε πυκνή κυκλοφορία\n1. Ο οδηγός επιτρέπεται να προσπεράσει προπορευόμενο όχημα μόνο εφόσον μπορεί να το κάνει χωρίς κίνδυνο ή παρακώλυση της κυκλοφορίας και εφόσον προειδοποιήσει έγκαιρα γι’ αυτό, σύμφωνα με την παρ. 2 του άρθρου 25, περί κανόνων για τους ελιγμούς των οχημάτων.\n2. Η προσπέραση επιτρέπεται, κατά κανόνα, από τα αριστερά. Κατ’ εξαίρεση, η προσπέραση επιτρέπεται από τα δεξιά αν ο προπορευόμενος οδηγός έχει δώσει σήμα ότι προτίθεται να στρίψει αριστερά και έχει μετακινήσει το όχημα ή τα ζώα του προς την πλευρά αυτή.\n3. Η προσπέραση απαγορεύεται γενικά στις εξής περιπτώσεις:\nα) όταν κάποιος από τους οδηγούς που ακολουθούν αυτόν που προτίθεται να προσπεράσει άρχισε ήδη την προσπέραση,\nγ) όταν η λωρίδα κυκλοφορίας, την οποία θα χρησιμοποιήσει ο οδηγός κατά την προσπέραση, δεν είναι ελεύθερη σε αρκετή απόσταση μπροστά του, με τρόπο ώστε, λαμβανομένης υπόψη της διαφοράς ταχύτητας του οχήματός του, κατά τον χρόνο της προσπέρασης, και εκείνη των οχημάτων, τα οποία προτίθεται να προσπεράσει, να μην εκθέσει σε κίνδυνο ή παρεμποδίσει τους ερχόμενους αντίθετα,\nδ) αμέσως προ ή επί μη κυκλικού ισόπεδου οδικού κόμβου, εκτός αν:\nδα) επιτρέπεται η προσπέραση προς τα δεξιά, κατά την περίπτωση της παρ. 2,\nδβ) η οδός, στην οποία γίνεται η προσπέραση, έχει προτεραιότητα,\nδγ) η κυκλοφορία ρυθμίζεται από τροχονόμο ή με φωτεινούς σηματοδότες και\nδδ) το όχημα το οποίο προσπερνάται είναι ποδήλατο, μοτοποδήλατο ή μοτοσικλέτα χωρίς καλάθι,\nε) αμέσως προ ή επί ισοπέδου σιδηροδρομικής διάβασης χωρίς λειτουργούντα κινητά φράγματα, εκτός αν η οδική κυκλοφορία ρυθμίζεται από φωτεινούς σηματοδότες, όπως αυτοί που χρησιμοποιούνται στους ισόπεδους οδικούς κόμβους,\nστ) αμέσως προ ή σε διάβαση πεζών, η οποία έχει σημανθεί ως διάβαση πεζών στο οδόστρωμα ή με πινακίδα σήμανσης,\nζ) μέσα στις σήραγγες με μία (1) λωρίδα κυκλοφορίας ανά κατεύθυνση,\nη) όταν σχολικό λεωφορείο έχει σταματήσει σε οδόστρωμα με μία (1) ή δύο (2) λωρίδες κυκλοφορίας προς την κατεύθυνση που κινείται και έχει αναμμένα τα φώτα έκτακτης ανάγκης για την αποβίβαση και επιβίβαση μαθητών.\n4. Ειδικότερα σε οδόστρωμα διπλής κατεύθυνσης, η προσπέραση απαγορεύεται και κατά την προσέγγιση σε κυρτή αλλαγή κλίσης ή σε στροφές με ανεπαρκή ορατότητα, εκτός αν υπάρχει στα σημεία αυτά διαχωριστική νησίδα ή δύο (2) τουλάχιστον λωρίδες κυκλοφορίας προς την κατεύθυνση αυτού που προσπερνά, οι οποίες ορίζονται με κατά μήκος διαγραμμίσεις, η δε προσπέραση γίνεται χωρίς να εγκαταλείψει ο οδηγός τις λωρίδες κυκλοφορίας που σημειώνονται ως κλειστές γι’ αυτούς που έρχονται αντίθετα.\n5. Ο οδηγός κατά την προσπέραση αφήνει στο όχημα το οποίο προσπερνά αρκετό χώρο παραπλεύρως.\n6. Ο οδηγός μετά την προσπέραση επαναφέρει το όχημά του πλησίον του δεξιού άκρου του οδοστρώματος, χωρίς να θέσει σε κίνδυνο αυτούς που προσπερνά. Αν όμως κινείται σε οδόστρωμα με δύο (2) τουλάχιστον λωρίδες κυκλοφορίας κατά κατεύθυνση και προτίθεται να προσπεράσει περισσότερα από ένα (1) οχήματα, μπορεί να παραμείνει στη λωρίδα που χρησιμοποιεί για την προσπέραση, αν η ενέργειά του αυτή δεν προκαλεί δυσχέρεια στους οδηγούς ταχύτερων οχημάτων που τον πλησιάζουν από πίσω.\n7. Οδηγός που αντιλαμβάνεται ότι άλλος οδηγός προτίθεται να τον προσπεράσει, υποχρεούται να κινείται πλησίον του δεξιού άκρου του οδοστρώματος και να μην επιταχύνει την κίνησή του. Ο οδηγός βραδέως κινούμενου ή ογκώδους οχήματος, του οποίου δεν είναι ευχερής και ασφαλής η προσπέραση, λόγω της στενότητας ή της κατάστασης του οδοστρώματος, σε συνδυασμό με την πυκνότητα της αντιθέτως ερχόμενης κυκλοφορίας, υποχρεούται να μειώνει την ταχύτητά του και να πλησιάζει κατά το δυνατόν, στο δεξιό άκρο του οδοστρώματος, για να διευκολύνει την προσπέραση από οχήματα που ακολουθούν. 8.α) Σε μονόδρομους και οδούς διπλής κατεύθυνσης, που υπάρχουν δύο (2) τουλάχιστον λωρίδες κυκλοφορίας, κατά κατεύθυνση, μέσα σε κατοικημένες περιοχές και τρεις (3) εκτός αυτών, διαχωριζόμενες με κατά μήκος διαγραμμίσεις, επιτρέπεται η κυκλοφορία σε παράλληλες σειρές (στοίχους).\nβ) Σε κάθε περίπτωση, αλλαγή λωρίδας επιτρέπεται μόνο εφόσον δεν προκαλείται κίνδυνος ή παρακώλυση της κυκλοφορίας και δίνεται έγκαιρα προειδοποίηση, σύμφωνα με την παρ. 2 του άρθρου 25.\nγ) Στην περ. α, ο προβλεπόμενος τρόπος οδήγησης δεν θεωρείται ότι αποτελεί προσπέραση κατά την έννοια του παρόντος και εφαρμόζεται η περ. στ) της παρ. 3. 9. Αν η πυκνότητα της κυκλοφορίας είναι τέτοια ώστε τα οχήματα να καταλαμβάνουν ολόκληρο το πλάτος του οδοστρώματος προς την κατεύθυνση της κυκλοφορίας και κινούνται με την ταχύτητα του προπορευόμενου αυτών οχήματος, επιτρέπονται:\nα) η αλλαγή λωρίδας μόνο προκειμένου το όχημα να στρίψει δεξιά ή αριστερά ή να σταθμεύσει,\nβ) η κίνηση δίκυκλων μοτοποδηλάτων και μοτοσικλετών χωρίς καλάθι μεταξύ των λωρίδων κυκλοφορίας της ίδιας κατεύθυνσης (διήθηση) σε οδούς με τουλάχιστον δύο (2) λωρίδες κυκλοφορίας κατά κατεύθυνση, αν η ταχύτητά τους δεν υπερβαίνει τα είκοσι (20) χιλιόμετρα την ώρα και τα λοιπά οχήματα είναι ακινητοποιημένα. Κατά τη διενέργεια της διήθησης οι οδηγοί δίκυκλων μοτοποδηλάτων και μοτοσικλετών χωρίς καλάθι έχουν αναμμένα τα φώτα διασταύρωσης, παραχωρούν προτεραιότητα, τηρούν ασφαλή πλευρική απόσταση από τα υπόλοιπα οχήματα, μειώνουν ταχύτητα και ακινητοποιούνται, αν είναι αναγκαίο για την αποφυγή ατυχήματος και κάθε κινδύνου για τους υπόλοιπους οδηγούς ή πεζούς. 10. Στις περιπτώσεις κίνησης των οχημάτων σε παράλληλες σειρές (στοίχους), οι οδηγοί των βραδυπορούντων οχημάτων υποχρεούνται να κινούν αυτό στη δεξιά λωρίδα του οδοστρώματος. 11.\nα) Οι παραβάσεις των παρ. 1 έως 3 και 5 έως 8, με την επιφύλαξη των περ. β) και\nγ) της παρούσας, κατατάσσονται στην κατηγορία Ε2-Β.\nβ) Οι παραβάσεις της περ. β) του άρθρου 8 και των παρ. 9 και 10 του παρόντος κατατάσσονται στην κατηγορία Ε1-Β.\nγ) Οι παραβάσεις των περ. α), β), ε),\nστ) και\nζ) της παρ. 3 και της παρ. 4 κατατάσσονται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ και το διοικητικό μέτρο της επιτόπου αφαίρεσης της άδειας οδήγησης για τριάντα (30) ημέρες.`},
  23: {title:`Ταχύτητα και απόσταση μεταξύ οχημάτων`,text:`1. Ο οδηγός οδικού οχήματος επιβάλλεται να έχει τον πλήρη έλεγχο του οχήματός του ώστε να μπορεί σε κάθε στιγμή να εκτελεί τους απαιτούμενους χειρισμούς.\n2. Ο οδηγός επιβάλλεται να ρυθμίζει την ταχύτητα του οχήματός του, λαμβάνοντας συνεχώς υπόψη του τις επικρατούσες συνθήκες, ιδιαίτερα τη διαμόρφωση του εδάφους, την κατάσταση και τα χαρακτηριστικά της οδού, την κατάσταση και το φορτίο του οχήματός του, τις καιρικές συνθήκες και τις συνθήκες κυκλοφορίας, με τρόπο ώστε να είναι σε θέση να διακόψει την πορεία του οχήματός του μπροστά από οποιοδήποτε εμπόδιο που μπορεί να προβλεφθεί και το οποίο βρίσκεται στο ορατό από αυτόν εμπρόσθιο τμήμα της οδού. Υποχρεούται επίσης να μειώνει την ταχύτητα του οχήματός του και, σε περίπτωση ανάγκης, να διακόπτει την πορεία του, όταν οι περιστάσεις το επιβάλλουν.\n3. Ο οδηγός επιβάλλεται ιδιαιτέρως να μειώνει την ταχύτητα του οχήματός του σε τμήματα της οδού με περιορισμένο πεδίο ορατότητας, στις στροφές, πλησίον των σχολείων, πλησίον των ισόπεδων οδικών κόμβων, στις απότομες κατωφέρειες, πλησίον των μέσων μαζικής μεταφοράς, που σταθμεύουν για να αποβιβάζουν ή επιβιβάζουν επιβάτες, κατά τις νυκτερινές ώρες, σε περίπτωση ομίχλης, βροχής, χιονιών, παγετού και γενικά όταν το οδόστρωμα είναι ολισθηρό. Την ίδια υποχρέωση έχει και κατά τη διέλευσή του από στενές διόδους και αν η διασταύρωσή του με άλλα οχήματα καθίσταται δυσχερής, όταν υπάρχουν ζώα επί της οδού που παρουσιάζουν σημεία ταραχής, κατά τη διέλευσή του από κατοικημένες περιοχές, αν πεζοί, που βρίσκονται στην τροχιά του, καθυστερούν να απομακρυνθούν, καθώς και σε κάθε άλλη ειδική περίπτωση κατά την οποία επιβάλλεται μετριασμός ταχύτητας. Οι οδηγοί αυτοκινήτων οχημάτων που κινούνται σε οδό με χιόνια υποχρεούνται, εφόσον το όχημα δεν φέρει ειδικά ελαστικά, να τοποθετούν στους δύο (2) τουλάχιστον κινητήριους τροχούς αντιολισθητικές αλυσίδες ή άλλα ανάλογα αντιολισθητικά μέσα. Την ίδια υποχρέωση έχουν οι οδηγοί των πιο πάνω οχημάτων και όταν κινούνται σε οδό με παγετό, εφόσον ειδοποιούνται προς τούτο με ρυθμιστικές πινακίδες ή από τις αρμόδιες αρχές. Αν δεν συμμορφωθεί ο οδηγός, τα αστυνομικά όργανα μπορούν να επιβάλουν ακινητοποίηση του οχήματος στο άκρο της οδού ή σε άλλο κατάλληλο σημείο, μέχρι την αποκατάσταση της κανονικής κυκλοφορίας.\n4. Ο οδηγός οχήματος υποχρεούται να μην παρεμποδίζει την ομαλή πορεία άλλων οχημάτων κινούμενος με ασυνήθη βραδύτητα, χωρίς αποχρώντα λόγο.\n5. Απαγορεύεται στους οδηγούς οχημάτων να συναγωνίζονται μεταξύ τους στην ταχύτητα.\n6. Στην τήρηση των πιο πάνω διατάξεων υποχρεούνται και οι οδηγοί ζώων έλξης, φορτίου ή ιππασίας.\n7. Ο οδηγός οχήματος, το οποίο κινείται πίσω από άλλο, υποχρεούται να τηρεί αρκετή απόσταση για την αποφυγή σύγκρουσης αν, το προ αυτού κινούμενο όχημα, μειώσει ξαφνικά την ταχύτητά του ή διακόψει την πορεία του.\n8. Εκτός των κατοικημένων περιοχών, για τη διευκόλυνση της προσπέρασης, οι οδηγοί οχημάτων, για τα οποία επιβάλλεται περιορισμός ταχύτητας, ή συνδυασμού οχημάτων συνολικού μήκους πάνω από επτά (7) μέτρα, υποχρεούνται, εκτός των περιπτώσεων κατά τις οποίες ή προσπερνούν ή ετοιμάζονται να προσπεράσουν, να τηρούν αρκετή απόσταση από τα προ αυτών κινούμενα μηχανοκίνητα οχήματα, ώστε τα άλλα οχήματα που τους προσπερνούν να μπορούν ακίνδυνα να κινηθούν στον εμπρόσθιο χώρο του οχήματός τους.\n9. Η παρ. 8 δεν έχει εφαρμογή:\nα) όταν η κυκλοφορία είναι πυκνή,\nβ) σε περιπτώσεις που απαγορεύεται η προσπέραση,\nγ) στις οδούς οι οποίες έχουν δύο (2) ή περισσότερες λωρίδες κυκλοφορίας, κατά την κατεύθυνση των οχημάτων,\nδ) όταν πρόκειται για φάλαγγα ενόπλων δυνάμεων.\n10. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α, με εξαίρεση την παράβαση της παρ. 5 που κατατάσσεται στην κατηγορία Ε4 και επιβάλλονται στον παραβάτη διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της επιτόπου αφαίρεσης της άδειας οδήγησης για ένα (1) έτος.`},
  24: {title:`αα) έως είκοσι (20) χιλιόμετρα την ώρα, κατατάσσεται στην κατηγορία Ε2-Α,`,text:`Όρια ταχύτητας, αρμοδιότητα καθορισμού τους, έλεγχος τήρησής τους, κατηγορίες παραβάσεων και κυρώσεις για μη τήρηση ορίων ταχύτητας, ελλιπή εξοπλισμό επαγγελματικών οχημάτων και παρεμβάσεις σε αυτόν, κατοχή μηχανισμών παρεμπόδισης ελέγχου ταχύτητας, μη ορθή χρήση Ελαφρού Προσωπικού Ηλεκτρικού Οχήματος\n1. Το ανώτατο επιτρεπόμενο όριο ταχύτητας, μέσα στις κατοικημένες περιοχές, ορίζεται σε τριάντα (30) χιλιόμετρα την ώρα. Σε μονόδρομους στους οποίους υπάρχουν δύο (2) τουλάχιστον λωρίδες κυκλοφορίας, διαχωριζόμενες με κατά μήκος διαγραμμίσεις, και σε οδούς διπλής κατεύθυνσης με τουλάχιστον δύο (2) λωρίδες ανά κατεύθυνση, διαχωριζόμενες με κατά μήκος διαγραμμίσεις, και σε οδούς διπλής κατεύθυνσης με διαχωριστική νησίδα, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε πενήντα (50) χιλιόμετρα την ώρα. Τα όρια ταχύτητας της παρούσας εφαρμόζονται, εφόσον δεν ορίζεται διαφορετικά με ειδική σήμανση, κατά τα προβλεπόμενα στην περ. γ) της παρ. 7 του άρθρου 112, περί εξουσιοδοτικών διατάξεων.\n2. Εκτός κατοικημένων περιοχών τα ανώτατα επιτρεπόμενα όρια ταχύτητας, για τις διάφορες κατηγορίες αυτοκίνητων οχημάτων και των συνδυασμών αυτών, ορίζονται στον παρακάτω πίνακα:\n3. Σε μη ασφαλτοστρωμένους δρόμους εκτός κατοικημένων περιοχών, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε σαράντα (40) χιλιόμετρα την ώρα, εκτός αν άλλως ορίζεται με ειδική σήμανση.\n4. Για τα φορτηγά αυτοκίνητα που μεταφέρουν πρόσωπα, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε τριάντα (30) χιλιόμετρα την ώρα μέσα σε κατοικημένες περιοχές και σε πενήντα (50) χιλιόμετρα την ώρα έξω από αυτές.\n5. Για τα μοτοποδήλατα το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε σαράντα πέντε (45) χιλιόμετρα την ώρα με την επιφύλαξη της παρ. 1. Για τα αγροτικά μηχανήματα και τα μηχανήματα έργου, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε σαράντα (40) χιλιόμετρα την ώρα με την επιφύλαξη της παρ. 1. Ειδικώς αν τα αγροτικά μηχανήματα, τα μηχανήματα έργου ή τα ρυμουλκούμενα από αυτά στερούνται ελαστικών με αεροθάλαμο, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε δεκαπέντε (15) χιλιόμετρα την ώρα.\n6. Για τα Ε.Π.Η.Ο. το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε είκοσι πέντε (25) χιλιόμετρα την ώρα. Τα Ε.Π.Η.Ο. απαγορεύεται να κυκλοφορούν σε οδούς όπου το ανώτατο επιτρεπόμενο όριο ταχύτητας των αυτοκίνητων οχημάτων υπερβαίνει τα πενήντα (50) χιλιόμετρα την ώρα.\n7. Στα φορτηγά αυτοκίνητα, στα ρυμουλκούμενα από αυτά και στα λεωφορεία αυτοκίνητα αναγράφεται στο οπίσθιο μέρος του αμαξώματός τους, με στοιχεία ύψους δεκαπέντε (15) εκατοστών μαύρου χρώματος σε άσπρη κυκλική επιφάνεια, ο αριθμός των χιλιομέτρων την ώρα του επιτρεπόμενου ανώτατου ορίου ταχύτητάς τους.\n8. Ο έλεγχος της ταχύτητας των οδικών οχημάτων μπορεί να γίνεται από τις αρμόδιες αστυνομικές αρχές και με ειδικές ηλεκτρονικές τεχνικές συσκευές ή με άλλα τεχνικά μέσα.\n9.\nα) Με την επιφύλαξη της περ. β), η παράβαση της υπέρβασης του ανώτατου ορίου ταχύτητας:\nαβ) πάνω από είκοσι (20) χιλιόμετρα την ώρα έως και τριάντα (30) χιλιόμετρα την ώρα, κατατάσσεται στην κατηγορία Ε2-Β,\nαγ) πάνω από τριάντα (30) χιλιόμετρα την ώρα έως και πενήντα (50) χιλιόμετρα την ώρα κατατάσσεται στην κατηγορία Ε3-Β.\nβ) Με την επιφύλαξη των περ. γ) και δ), κατατάσσονται στην κατηγορία Ε3-Β οι παραβάσεις της κίνησης οχημάτων:\nβα) στους αυτοκινητόδρομους με ταχύτητα πάνω από εκατόν πενήντα (150) χιλιόμετρα την ώρα,\nββ) στις οδούς ταχείας κυκλοφορίας με ταχύτητα πάνω από εκατόν τριάντα (130) χιλιόμετρα την ώρα,\nβγ) στο υπόλοιπο οδικό δίκτυο με ταχύτητα πάνω από εκατόν είκοσι (120) χιλιόμετρα την ώρα.\nγ) Με την επιφύλαξη της περ. δ), η παράβαση της υπέρβασης του ανώτατου ορίου ταχύτητας πάνω από πενήντα (50) χιλιόμετρα την ώρα κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ και το διοικητικό μέτρο της επιτόπου αφαίρεσης της άδειας οδήγησης για εξήντα (60) ημέρες.\nδ) Η παράβαση της οδήγησης με ταχύτητα ανώτερη των διακοσίων (200) χιλιομέτρων την ώρα κατατάσσεται στην κατηγορία Ε4 και στον επιβάτη επιβάλλονται διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της επί τόπου αφαίρεσης της άδειας οδήγησης για ένα (1) έτος.\nε) Η παράβαση της οδήγησης με ταχύτητα κατώτερη του ελάχιστου επιτρεπόμενου ορίου ταχύτητας και η παράβαση της παρ. 7 κατατάσσονται στην κατηγορία Ε1-Α.\n10. Η παράβαση της θέσης σε κυκλοφορία και της οδήγησης αυτοκίνητου οχήματος χωρίς να είναι εφοδιασμένο με τις συσκευές της περ. στ) της παρ. 7 του άρθρου 112, καθώς και η παράβαση της παράλειψης τοποθέτησης του φύλλου ή άλλου συστήματος καταγραφής ταχογράφου κατατάσσονται στην κατηγορία Ε3-Β. Στην ίδια κατηγορία κατατάσσονται και οι παραβάσεις επενέργειας με οποιονδήποτε τρόπο στον μηχανισμό της ανωτέρω συσκευής, με σκοπό να την καταστήσει ανενεργή ή να αλλοιωθούν οι καταγραφόμενες ενδείξεις. Εάν αμφισβητηθεί από τον οδηγό η παράβαση, το όχημα μεταφέρεται, συνοδεία αστυνομικού, στην αρμόδια για τη διενέργεια ελέγχου υπηρεσία της οικείας Περιφερειακής Ενότητας. Για τις ως άνω παραβάσεις που αφορούν σε φορτηγά οχήματα εφαρμόζεται ο ν. 3446/2006 (Α’ 49).\n11. Η παράβαση της οδήγησης μηχανοκίνητου οχήματος με εξοπλισμό εντοπισμού συσκευών μέτρησης ταχύτητας, καθώς και της οδήγησης μηχανοκίνητου οχήματος με εξοπλισμό παρεμπόδισης συσκευών μέτρησης ταχύτητας κατατάσσεται στην κατηγορία Ε3-Β.\n12. Ειδικά για τα Ε.Π.Η.Ο.:\nα) η οδήγηση κατά παράβαση του πρώτου εδαφίου της παρ. 6:\nαα) με ταχύτητα έως και τριάντα πέντε (35) χιλιόμετρα την ώρα, κατατάσσεται στην κατηγορία Ε1-Α και η θέση του σε κυκλοφορία κατατάσσεται στην κατηγορία Ε2-Α,\nαβ) με ταχύτητα άνω των τριάντα πέντε (35) χιλιομέτρων την ώρα κατατάσσεται στην κατηγορία Ε2-Α και η θέση του σε κυκλοφορία κατατάσσεται στην κατηγορία Ε3-Α,\nβ) η οδήγηση κατά παράβαση του δεύτερου εδαφίου της παρ. 6 κατατάσσεται στην κατηγορία Ε1-Α.`},
  25: {title:`Κανόνες για τους ελιγμούς των οχημάτων`,text:`1. Ο οδηγός που προτίθεται να εκτελέσει ελιγμό, οφείλει προηγουμένως να βεβαιωθεί ότι μπορεί να το πράξει χωρίς κίνδυνο ή παρακώλυση των λοιπών χρηστών της οδού, οι οποίοι κινούνται πίσω, μπροστά ή πλάι του, ή ετοιμάζονται να τον προσπεράσουν, λαμβάνοντας υπόψη τη θέση, την κατεύθυνση και την ταχύτητά τους.\n2. Πριν από κάθε ελιγμό, ο οδηγός υποχρεούται να καταστήσει έγκαιρα γνωστή την πρόθεσή του αυτή, χρησιμοποιώντας για τον σκοπό αυτό τους δείκτες κατεύθυνσης, αν δε αυτοί δεν λειτουργούν, υποχρεούται να δώσει τα ακόλουθα σήματα με το χέρι:\nα) Έκταση του βραχίονα για στροφή προς την κατεύθυνση αυτού,\nβ) κάμψη του βραχίονα προς τα πάνω για στροφή προς την αντίθετη πλευρά αυτού,\nγ) κάμψη του βραχίονα προς τα κάτω, για τον ελιγμό στάθμευσης.\n3. Η προειδοποίηση που δίνεται με τους δείκτες κατεύθυνσης επιβάλλεται να συνεχίζεται σε όλη τη διάρκεια του ελιγμού και να παύει όταν ολοκληρωθεί ο ελιγμός.\n4. H παράβαση των παρ. 1 έως 3 κατατάσσεται στην κατηγορία Ε1-Β, πλην της παράβασης για αυτόν που επιχειρεί στην οδό συνεχείς ή διακεκομμένους ελιγμούς και κίνηση που εγκυμονεί κίνδυνο για τους λοιπούς χρήστες της οδού, που κατατάσσεται στην κατηγορία Ε3-Β.`},
  27: {title:`Αλλαγή κατεύθυνσης`,text:`1. Ο οδηγός, προκειμένου να αλλάξει κατεύθυνση προς τα δεξιά, κινείται έγκαιρα προς το δεξιό άκρο του οδοστρώματος και πραγματοποιεί τη στροφή κατά το δυνατόν κλειστή.\n2. Προκειμένου ο οδηγός να αλλάξει κατεύθυνση προς τα αριστερά, πλησιάζει προοδευτικά προς τον άξονα του οδοστρώματος, αν είναι διπλής κατεύθυνσης και προς το αριστερό άκρο αυτού, αν είναι μονής κατεύθυνσης (μονόδρομος). Για να εισέλθει στην κάθετη οδό, πραγματοποιεί τη στροφή στο κέντρο της διασταύρωσης, ώστε το όχημα να εισέλθει στη δεξιά πλευρά του οδοστρώματος αυτής της οδού. Κατά την κίνηση αυτή ο οδηγός επιτρέπει τη διέλευση των οχημάτων που κινούνται αντίθετα στο οδόστρωμα που πρόκειται να εγκαταλείψει.\n3. Αν ο οδηγός κατά την αλλαγή της κατεύθυνσης, πρόκειται να διασχίσει ειδική λωρίδα που προορίζεται για την κίνηση των μέσων μαζικής μεταφοράς, ποδηλάτων ή μοτοποδηλάτων, παραχωρεί προτεραιότητα σε αυτά.\n4. Στις παρ. 1 και 2 και εφόσον ο οδηγός που προτίθεται να αλλάξει κατεύθυνση καταστήσει γνωστή την πρόθεσή του αυτή, σύμφωνα με τις παρ. 2 και 3 του άρθρου 25, περί κανόνων για τους ελιγμούς οχημάτων, οι οδηγοί που τον ακολουθούν και κινούνται στις παρακείμενες λωρίδες, τον διευκολύνουν με τη μείωση της ταχύτητας του οχήματός τους, ενώ αυτός δεν αλλάζει κατεύθυνση, αν δεν μπορεί να το πράξει με ασφάλεια.\n5. Οι παραβάσεις των παρ. 1, 2 και 4 κατατάσσονται στην κατηγορία Ε1-Β. Η παράβαση της παρ. 3 κατατάσσεται στην κατηγορία Ε1-Α και στην κατηγορία Σ.`},
  29: {title:`Ειδικοί κανόνες για τα οχήματα των δημόσιων συγκοινωνιών`,text:`1. Για τη διευκόλυνση της κίνησης των οχημάτων δημόσιων συγκοινωνιών (μαζικής μεταφοράς επιβατών) μέσα στις κατοικημένες περιοχές, οι οδηγοί των άλλων οχημάτων, εφόσον δεν προκαλείται κίνδυνος, μειώνουν την ταχύτητά τους και σε ανάγκη διακόπτουν την πορεία τους, για να επιτρέπουν στα οχήματα αυτά να εκτελέσουν τον αναγκαίο ελιγμό για την εκκίνηση από τις καθορισμένες στάσεις.\n2. Στις περιπτώσεις της παρ. 1, οι οδηγοί των οχημάτων δημόσιων συγκοινωνιών δεν απαλλάσσονται από την υποχρέωση να προειδοποιήσουν με τους δείκτες κατεύθυνσης των οχημάτων τους για την πρόθεσή τους να εκκινήσουν και να λάβουν τις αναγκαίες προφυλάξεις για την αποφυγή κάθε κινδύνου.\n3. Για την επιβίβαση ή αποβίβαση επιβατών οι οδηγοί των οχημάτων δημόσιων συγκοινωνιών πλησιάζουν, κατά το δυνατόν, το άκρο του οδοστρώματος.\n4. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α και στην κατηγορία Σ.`},
  30: {title:`Ισόπεδοι οδικοί κόμβοι και υποχρέωση παραχώρησης προτεραιότητας`,text:`1. Ο οδηγός που πλησιάζει σε ισόπεδο οδικό κόμβο καταβάλλει ιδιαίτερη προσοχή για να μην προκαλέσει επί του κόμβου κίνδυνο ή παρακώλυση της κυκλοφορίας, ρυθμίζοντας την ταχύτητα του οχήματός του, ώστε να μπορεί να διακόψει την πορεία αυτού, για να διέλθουν τα οχήματα που έχουν προτεραιότητα.\n2. Ο οδηγός απαγορεύεται να εισέρχεται στον κόμβο, έστω και αν οι τυχόν υπάρχοντες φωτεινοί σηματοδότες το επιτρέπουν, όταν η πυκνότητα της κυκλοφορίας είναι τέτοια ώστε να ενδέχεται να υποχρεωθεί να παραμείνει στη διασταύρωση.\n3. Ο οδηγός που έχει εισέλθει στον κόμβο όπου η κυκλοφορία ρυθμίζεται με φωτεινούς σηματοδότες, μπορεί να εξέλθει αυτού και πριν δοθεί το σήμα ελεύθερης κυκλοφορίας προς την κατεύθυνση την οποία θα ακολουθήσει, αν δεν παρεμποδίζεται εκ τούτου η διέλευση των λοιπών οχημάτων που χρησιμοποιούν την οδό και κινούνται προς την ανοικτή κατεύθυνση.\n4. Στους κόμβους, η προτεραιότητα ορίζεται με κατάλληλη σήμανση.\n5. Στους κόμβους χωρίς τέτοια σήμανση, η προτεραιότητα ανήκει σε αυτόν που έρχεται από τα δεξιά. Κατ’ εξαίρεση:\nα) Αυτοί που κυκλοφορούν στους αυτοκινητόδρομους, εθνικές οδούς και οδούς ταχείας κυκλοφορίας έχουν προτεραιότητα.\nβ) Αυτοί που εισέρχονται σε οδό από πεζόδρομο, χωματόδρομο, μονοπάτια, παρόδιο ιδιοκτησία, χώρο στάθμευσης και σταθμούς ανεφοδιασμού και εξυπηρέτησης παραχωρούν προτεραιότητα σε αυτούς που κινούνται στην οδό.\nγ) Αυτοί που εκκινούν ή κινούνται προς τα πίσω, όπου αυτό επιτρέπεται, παραχωρούν προτεραιότητα.\nδ) Τα τροχιοδρομικά οχήματα έχουν προτεραιότητα.\nε) Τα σιδηροδρομικά οχήματα έχουν προτεραιότητα.\n6. Οι ενδείξεις των φωτεινών σηματοδοτών κυκλοφορίας υπερισχύουν των ενδείξεων των πινακίδων σήμανσης, οι οποίες καθορίζουν την προτεραιότητα.\n7. Οι παραβάσεις των παρ. 1 έως 6 κατατάσσονται στην κατηγορία Ε3-Β. Εξαιρούνται οι παραβάσεις της περ. δ) της παρ. 5, που κατατάσσεται στην κατηγορία Ε3-Β και στην κατηγορία Σ και της περ. ε) της παρ. 5, που κατατάσσεται στην κατηγορία Ε4 και επιβάλλεται πρόστιμο χιλίων διακοσίων (1.200) ευρώ και επί τόπου αφαίρεση της άδειας οδήγησης για εξήντα (60) ημέρες.\n8. Επιπλέον των διοικητικών κυρώσεων της παρ. 7, οι παραβάσεις της περ. ε) της παρ. 5 τιμωρούνται με ποινή φυλάκισης τουλάχιστον ενός (1) έτους και χρηματική ποινή έως δύο χιλιάδες (2.000) ευρώ, εφόσον η πράξη δεν τιμωρείται βαρύτερα σύμφωνα με το άρθρο 291 του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95) ή από άλλη ποινική διάταξη.`},
  31: {title:`Ισόπεδες σιδηροδρομικές διαβάσεις`,text:`1. Αυτοί που χρησιμοποιούν τις οδούς καταβάλλουν ιδιαίτερη προσοχή, όταν πλησιάζουν ή διασχίζουν σιδηροδρομικές διαβάσεις, και τηρούν τους εξής κανόνες:\nα) Ο οδηγός οχήματος μειώνει την ταχύτητα του οχήματός του προ των πινακίδων αναγγελίας κινδύνου Κ-31 έως Κ-35.\nβ) Προ ισόπεδης σιδηροδρομικής διάβασης, χωρίς λειτουργούντα κινητά φράγματα ή λειτουργούσα φωτεινή σηματοδότηση, που επισημαίνεται με πινακίδες υποχρεωτικής διακοπής πορείας Ρ-2 και πλησίον σιδηροδρομικής διάβασης με πινακίδα Κ-36 ή Κ-37, ο οδηγός διακόπτει την πορεία του στην ειδική προς τούτο γραμμή ή, σε περίπτωση που δεν υπάρχει τέτοια, στη θέση που βρίσκονται οι πινακίδες και δεν εκκινεί, αν δεν βεβαιωθεί ότι δεν πλησιάζει σιδηροδρομικός συρμός.\nγ) Προ ισόπεδης σιδηροδρομικής διάβασης, που επισημαίνεται με φωτεινή σηματοδότηση, με κινητά φράγματα που λειτουργούν αυτόματα, ο χρήστης της οδού, μπροστά από ερυθρό φως που αναβοσβήνει ή μπροστά από δύο (2) τέτοια φώτα τα οποία αναβοσβήνουν διαδοχικά, διακόπτει την πορεία προ της ειδικής γραμμής ή, αν δεν υπάρχει τέτοια, προ του σηματοδότη. Την ίδια υποχρέωση έχει και στην περίπτωση ηχητικού σήματος που εκπέμπει συσκευή εγκατεστημένη στη διάβαση.\nδ) Αυτοί που χρησιμοποιούν την οδό δεν εισέρχονται σε ισόπεδη σιδηροδρομική διάβαση, όταν τα κινητά φράγματα έχουν κλείσει την οδό και κατά τον χρόνο που αυτά ανεβαίνουν ή κατεβαίνουν.\nε) Αυτός που διασχίζει ισόπεδη σιδηροδρομική διάβαση κινείται χωρίς καθυστέρηση.\nστ) Ο οδηγός δεν εισέρχεται σε ισόπεδη σιδηροδρομική διάβαση, χωρίς προηγουμένως να βεβαιωθεί ότι δεν θα υποχρεωθεί να ακινητοποιηθεί πάνω σε αυτή. Σε περίπτωση αναγκαστικής ακινητοποίησης του οχήματος πάνω στις σιδηροτροχιές, κατά τον χρόνο που διέρχεται την ισόπεδη σιδηροδρομική διάβαση, ο οδηγός και οι λοιποί χρήστες της οδού πλησίον της διάβασης το μετακινούν και, αν δεν μπορούν, ειδοποιούν αμέσως και με κάθε τρόπο τους μηχανοδηγούς των σιδηροδρομικών οχημάτων για τον κίνδυνο.\n2. Οι παραβάσεις των περ. α),\nε) και\nστ) της παρ. 1 κατατάσσονται στην κατηγορία Ε1-Β. Οι παραβάσεις των περ. β),\nγ) και\nδ) της παρ. 1 κατατάσσονται στην κατηγορία Ε4 και τιμωρούνται με διοικητικό πρόστιμο χιλίων διακοσίων (1.200) ευρώ και με επί τόπου αφαίρεση της άδειας οδήγησης για εξήντα (60) ημέρες. Επιπλέον των διοικητικών κυρώσεων του προηγούμενου εδαφίου, οι παραβάσεις των περ. β),\nγ) και\nδ) της παρ. 1 τιμωρούνται με ποινή φυλάκισης τουλάχιστον ενός (1) έτους και χρηματική ποινή έως δύο χιλιάδες (2.000) ευρώ εφόσον η πράξη δεν τιμωρείται βαρύτερα σύμφωνα με το άρθρο 291 του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95) ή από άλλη ποινική διάταξη.`},
  33: {title:`Κίνηση οχημάτων σε αυτοκινητόδρομους, οδούς ταχείας κυκλοφορίας και σήραγγες`,text:`1. Στους αυτοκινητόδρομους και στις οδούς ταχείας κυκλοφορίας, οι οποίες διακρίνονται από τις ειδικές πινακίδες σήμανσης και στις οδούς εισόδου και εξόδου εξ αυτών, απαγορεύεται η κυκλοφορία πεζών, εφίππων, ζώων, ποδηλάτων, ζωηλάτων οχημάτων και γενικά οχημάτων τα οποία δεν κινούνται με κινητήρα, καθώς και μηχανοκίνητων οχημάτων, τα οποία εκ κατασκευής ή από άλλη αιτία, δεν μπορούν να αναπτύξουν σε οριζόντια οδό ταχύτητα μεγαλύτερη των εβδομήντα (70) χιλιομέτρων την ώρα, με την επιφύλαξη ειδικότερων διατάξεων.\n2. Στις πιο πάνω οδούς απαγορεύεται:\nα) Η πραγματοποίηση επιτόπιας στροφής, δηλαδή αναστροφής εκατόν ογδόντα (180ο) μοιρών,\nβ) η οπισθοπορεία και\nγ) η οδήγηση οχημάτων στην κεντρική διαχωριστική λωρίδα, συμπεριλαμβανομένων και των επ’ αυτής σημείων σύνδεσης των δύο οδοστρωμάτων.\n3. Αν όχημα ακινητοποιηθεί αναγκαστικά επί του οδοστρώματος από βλάβη ή άλλη αιτία, ο οδηγός του καταβάλλει κάθε προσπάθεια να το μετακινήσει εκτός του οδοστρώματος και, αν δεν μπορεί, τοποθετεί αμέσως την τριγωνική πινακίδα της παρ. 16 του άρθρου 85, περί μηχανισμών, εξαρτημάτων και συσκευών οχημάτων σε απόσταση εκατό (100) τουλάχιστον μέτρων πίσω από το όχημα ή την ειδική προειδοποιητική συσκευή σε κατάλληλη θέση και κατά τη νύχτα έχει αναμμένα τα φώτα θέσης. Αν το όχημα εξαιτίας βλάβης ρυμουλκείται στον αυτοκινητόδρομο ή την οδό ταχείας κυκλοφορίας, εξέρχεται αυτών στην πρώτη έξοδο.\n4. Σε αυτοκινητόδρομους ή οδούς ταχείας κυκλοφορίας τριών (3) ή περισσότερων λωρίδων κυκλοφορίας προς την αυτή κατεύθυνση απαγορεύεται στους οδηγούς των φορτηγών αυτοκινήτων, μέγιστου επιτρεπόμενου βάρους άνω των τριών κόμμα πέντε (3,5) τόνων, των λεωφορείων ή των συνδυασμών οχημάτων (συρμών), μήκους μεγαλύτερου των επτά (7) μέτρων, να καταλαμβάνουν άλλη λωρίδα, εκτός των δύο (2) πλησιέστερων προς το δεξιό άκρο του οδοστρώματος. Η ακραία αριστερή λωρίδα χρησιμοποιείται από επιβατηγά οχήματα ή μοτοσικλέτες ως λωρίδα προσπέρασης και καθίσταται και αυτή λωρίδα κυκλοφορίας, εφόσον οι υπόλοιπες λωρίδες τελούν υπό καθεστώς κυκλοφοριακής συμφόρησης.\n5. Οι οδηγοί που εισέρχονται σε αυτοκινητόδρομο ή οδό ταχείας κυκλοφορίας:\nα) Αν η οδός εισόδου δεν συνεχίζεται με λωρίδα επιτάχυνσης, παραχωρούν προτεραιότητα στα κινούμενα οχήματα επί του αυτοκινητόδρομου ή της οδού ταχείας κυκλοφορίας.\nβ) Αν υπάρχει λωρίδα επιτάχυνσης, χρησιμοποιούν αυτήν και, καθώς εισέρχονται στον αυτοκινητόδρομο ή την οδό ταχείας κυκλοφορίας, τηρούν το άρθρο 25, περί κανόνων για τους ελιγμούς των οχημάτων.\n6. Ο οδηγός που εξέρχεται από αυτοκινητόδρομο ή οδό ταχείας κυκλοφορίας καταλαμβάνει έγκαιρα τη λωρίδα κυκλοφορίας που αντιστοιχεί στην έξοδο του αυτοκινητόδρομου ή της οδού ταχείας κυκλοφορίας και εισέρχεται το ταχύτερο στη λωρίδα επιβράδυνσης, αν υπάρχει τέτοια.\n7. Απαγορεύονται σε κάθε περίπτωση η δημιουργία και η χρήση πρόσβασης προς ή από αυτοκινητοδρόμους και οδούς ταχείας κυκλοφορίας, για την εξυπηρέτηση παρόδιων ιδιοκτησιών.\n8. Σε σήραγγες που υποδεικνύονται από ειδικές πινακίδες:\nα) οι οδηγοί απαγορεύεται:\nαα) να πραγματοποιούν οπισθοπορεία,\nαβ) να πραγματοποιούν επιτόπια στροφή, δηλαδή αναστροφή εκατόν ογδόντα μοιρών (180ο),\nαγ) να σταθμεύουν στις ειδικές διαπλατύνσεις, εκτός των περιπτώσεων έκτακτων οδικών συμβάντων.\nβ) οι οδηγοί:\nβα) ακόμα και αν η σήραγγα είναι φωτισμένη, ανάβουν τα φώτα διασταύρωσης ή τα φώτα πορείας,\nββ) σε περίπτωση παρατεταμένης ακινητοποίησης, σβήνουν τη μηχανή του οχήματός τους,\nβγ) συμμορφώνονται με τα ηλεκτρονικά μέσα σήμανσης και τις οδηγίες που δίδονται σε αυτούς από τα κέντρα ελέγχου σήραγγας μέσω μεγαφώνου ή ραδιοφώνου.\n9. Η Λ.Ε.Α. προορίζεται αποκλειστικά για την κίνηση οχημάτων άμεσης ανάγκης και οχημάτων συντήρησης των αρμόδιων κρατικών υπηρεσιών ή των εταιρειών που, κατά παραχώρηση από το Δημόσιο, λειτουργούν, συντηρούν και εκμεταλλεύονται αυτοκινητόδρομο ή οδό ταχείας κυκλοφορίας, για την αντιμετώπιση έκτακτων γεγονότων, περιστατικών ή άλλων αναγκών. Οποιαδήποτε άλλη χρήση των λωρίδων έκτακτης ανάγκης, εξαιρουμένων των περιπτώσεων της παρ. 3, απαγορεύεται.\n10. Απαγορεύεται η κυκλοφορία οχημάτων σε αυτοκινητοδρόμους, οδούς ταχείας κυκλοφορίας, σήραγγες και γέφυρες που διακρίνονται με ειδικές πινακίδες σήμανσης χωρίς την καταβολή διοδίου τέλους, όταν προβλέπεται η καταβολή αυτή. Για την καταβολή του διοδίου τέλους είναι υπόχρεοι εις ολόκληρον ο κύριος και ο οδηγός του οχήματος. Εάν το όχημα ανήκει σε επιχείρηση ενοικίασης και είναι μισθωμένο, ως υπόχρεος λογίζεται ο μισθωτής που προκύπτει από το μισθωτήριο συμβόλαιο. Η βεβαίωση της παράβασης γίνεται από τα αρμόδια αστυνομικά όργανα που τη διαπιστώνουν αυτοπροσώπως ή μέσω τεχνικών ή ηλεκτρονικών μέσων, σύμφωνα με την παρ. 4 του άρθρου 107, περί επιβολής διοικητικών προστίμων από αστυνομικά όργανα.\n11. Η παράβαση της παρ. 10 κατατάσσεται στην κατηγορία Ε2-Α. Η παράβαση της παρ. 9 κατατάσσεται στην κατηγορία Ε2-Α και στην κατηγορία Σ. Οι παραβάσεις των περ. α) και\nβ) της παρ. 2, του πρώτου εδαφίου της παρ. 4 και των περ. α) και\nβ) της παρ. 8 κατατάσσονται στην κατηγορία Ε3-Β. Οι λοιπές παραβάσεις του άρθρου με την επιφύλαξη της παρ. 12, κατατάσσονται στην κατηγορία Ε2-Β. Οι παραβάσεις της περ. α) της παρ. 2 κατατάσσονται στην κατηγορία Ε-4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ και επί τόπου αφαίρεση της άδειας οδήγησης για εξήντα (60) ημέρες, αν η μη συμμόρφωση είχε ως αποτέλεσμα την πρόκληση τροχαίου ατυχήματος. Αν ο οδηγός γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή βαριά σωματική βλάβη ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων επιβάλλονται οι ποινές των περ. γγ) και\nδδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95).\n12. Η παράβαση της παρ. 7 τιμωρείται με ποινή φυλάκισης έως δώδεκα (12) μήνες ή με χρηματική ποινή. Η χρήση της πρόσβασης που έχει δημιουργηθεί κατά παράβαση της παρ. 7, συνιστά παράβαση που κατατάσσεται στην κατηγορία Ε2-Α.`},
  34: {title:`Άνοιγμα των θυρών οχημάτων`,text:`1. Απαγορεύεται σε όλους να ανοίγουν ή να αφήνουν τις πόρτες οχήματος ανοικτές ή να εισέρχονται/εξέρχονται αυτού, αν προηγουμένως δεν βεβαιωθούν ότι, από τις ενέργειές τους, δεν προκαλείται κίνδυνος στους χρήστες της οδού.\n2. Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε1-Α.`},
  36: {title:`Φόρτωση οχημάτων`,text:`1. Η μάζα του φορτωμένου οχήματος δεν υπερβαίνει τη μέγιστη αποδεκτή μάζα του φορτωμένου οχήματος που καθορίζεται από την ισχύουσα νομοθεσία για την κατηγορία του οχήματος ή τον συνδυασμό οχημάτων.\n2. Οι φορτίσεις των αξόνων των φορτωμένων οχημάτων δεν υπερβαίνουν:\nα) τις μέγιστα τεχνικά επιτρεπόμενες φορτίσεις που καθορίζονται από τον κατασκευαστή τους ανάλογα με την τεχνική διαμόρφωση των οχημάτων και\nβ) τις μέγιστες αποδεκτές επιτρεπόμενες φορτίσεις που καθορίζονται σύμφωνα με το π.δ. 1161/1977 (Α’ 380) για τα οχήματα εθνικών μεταφορών και το π.δ. 77/1998 (Α’ 71) για τα οχήματα διεθνών μεταφορών, και σύμφωνα με την κατηγορία του οχήματος.\n3. Οι διαστάσεις του φορτωμένου οχήματος δεν υπερβαίνουν τις μέγιστες επιτρεπόμενες διαστάσεις που προβλέπονται από την ισχύουσα νομοθεσία για κάθε κατηγορία οχήματος ή συνδυασμό οχημάτων.\n4. Το φορτίο του οχήματος προετοιμάζεται προς φόρτωση, τακτοποιείται και στοιβάζεται με τρόπο ώστε:\nα) Να μην εκτίθενται σε κίνδυνο πρόσωπα, ζώα και να μην προκαλούνται ζημιές σε δημόσια περιουσία ή περιουσία τρίτων,\nβ) να μην παρεμποδίζεται η κυκλοφορία άλλων οχημάτων, ειδικότερα από διαρροή, πτώση ή διασκόρπισή του στην οδό,\nγ) να μην μετακινείται, ιδιαίτερα όταν αυτό μπορεί να επηρεάσει την ευστάθεια του οχήματος,\nδ) να μην περιορίζεται ή παρεμποδίζεται η ορατότητα τoυ οδηγού, να μην εμποδίζεται η οδήγηση του οχήματος και να μην μειώνεται η σταθερότητα αυτού,\nε) να μην προκαλούνται περιττές οχλήσεις, όπως θόρυβος και κονιορτός,\nστ) να μην καλύπτονται τα φώτα θέσης, πορείας και στάθμευσης, οι δείκτες κατεύθυνσης, τα αντανακλαστικά στοιχεία, oι πινακίδες αριθμού κυκλοφορίας, τo διακριτικό σήμα της χώρας απογραφής τoυ οχήματος, καθώς και τα σήματα που δίνονται με το χέρι, σύμφωνα με τον παρόντα και\nζ) να μην σύρεται στο έδαφος ή στο οδόστρωμα.\n5. Για την τακτοποίηση, στοιβασία, προστασία και ασφάλιση του φορτίου χρησιμοποιούνται, ανάλογα με το είδος του φορτίου, κατάλληλα εξαρτήματα, όπως καλώδια, σχοινιά, αλυσίδες, ιμάντες, καλύμματα και μέσα συσκευασίας, τα οποία είναι σε καλή κατάσταση χωρίς ορατές φθορές, δένονται σφικτά και στερεώνονται καλά. Οι οπίσθιες θύρες του αμαξώματος, αν για τις ανάγκες της φόρτωσης πρέπει να βρίσκονται στην ανοικτή θέση, δεν χρησιμοποιούνται για να στηρίξουν το φορτίο κατά την κίνηση του οχήματος. Κινούμενα εξαρτήματα, όπως αλυσίδες, ιμάντες, γερανοί και οπίσθιες θύρες, ασφαλίζονται, ώστε να μην προεξέχουν του περιγράμματος του οχήματος κατά τις ταλαντώσεις τους από την κίνηση του οχήματος, και να μην σύρονται στο έδαφος ή το οδόστρωμα.\n6. Για τη μεταφορά εμπορευματοκιβωτίων χρησιμοποιούνται κατάλληλα κλειδιά (κλείστρα) ενσωματωμένα στο όχημα, που στερεώνουν και ασφαλίζουν όλα τα αντίστοιχα σημεία του εμπορευματοκιβωτίου.\n7. Φορτίο σε όχημα με ανοικτό αμάξωμα, που αποτελείται από υλικά για τα οποία υπάρχει κίνδυνος κατά τη διαδρομή να εκφύγουν από το αμάξωμα ή να παρασυρθούν από τον αέρα (όπως αδρανή υλικά), καλύπτεται με εύκαμπτο κάλυμμα κατάλληλο προς τη φύση των υλικών, στερεωμένο επαρκώς στο αμάξωμα. Το κάλυμμα και οι διατάξεις στερέωσης αυτού επιτρέπεται να εξέχουν του αμαξώματος:\nα) μέχρι και είκοσι (20) χιλιοστά του μέτρου, αν δεν απέχουν περισσότερο από δύο (2) μέτρα από το επίπεδο του εδάφους ή\nβ) μέχρι και πενήντα (50) χιλιοστά του μέτρου, αν απέχουν περισσότερο από δύο (2) μέτρα από το επίπεδο του εδάφους. Οι ανωτέρω περιορισμοί τηρούνται σε κάθε περίπτωση τοποθέτησης καλύμματος επί οχήματος.\n8. Σε οχήματα που προορίζονται για την ταυτόχρονη μεταφορά φορτίου, επιβατών ή ζώων, το φορτίο είναι ασφαλώς προσδεδεμένο.\n9. To φορτίο απαγορεύεται να προεξέχει από το εμπρόσθιο μέρος του οχήματος. Κατ’ εξαίρεση, το φορτίο επιτρέπεται να προεξέχει του πλάγιου ή του οπίσθιου μέρους του οχήματος, με την επιφύλαξη της παρ. 3, ως εξής:\nα) γενικά:\nαα) συμμετρικά στο πλάι του οχήματος, μέχρι τριάντα (30) εκατοστά σε κάθε πλευρά,\nαβ) από το οπίσθιο μέρος του οχήματος, μέχρι τριάντα τοις εκατό (30%) του μήκους του ή του ρυμουλκούμενου στον συνδυασμό οχημάτων (συρμός ή αρθρωτό όχημα),\nβ) ειδικότερα, στα μοτοποδήλατα, τις μοτοσικλέτες και τα τρίτροχα οχήματα:\nβα) συμμετρικά μέχρι σαράντα (40) εκατοστά από τις πλευρές τους, υπολογιζόμενου από το εξωτερικό άκρο του εμπρόσθιου πλευρικού φανού του οχήματος ή του εμπρόσθιου ή οπίσθιου ακραίου σημείου αυτών,\nββ) σε μήκος που η προβολή του στο οριζόντιο επίπεδο είναι μέχρι σαράντα (40) εκατοστά, υπολογιζόμενων από το πίσω ακραίο σημείο για τις μοτοσικλέτες και τρίτροχα οχήματα και μέχρι είκοσι (20) εκατοστά για τα μοτοποδήλατα.\n10. Στην περίπτωση φορτηγών αυτοκινήτων, αρθρωτών οχημάτων ή συρμών που μεταφέρουν ογκώδη αντικείμενα, τα οποία δεν μπορούν να κατατμηθούν ή να αποσυνδεθούν εύκολα σε περισσότερα από ένα τεμάχια όπως δοκοί, στύλοι, σωλήνες ή άλλα φορτία μεγάλου μήκους, με την επιφύλαξη της παρ. 3, το φορτίο αυτό επιτρέπεται να προεξέχει:\nα) σε οχήματα συνολικού μήκους μέχρι πέντε (5) μέτρων, σε μήκος που η προβολή του στο οριζόντιο επίπεδο είναι μέχρι τριάντα τοις εκατό (30%) του συνολικού μήκους τους από το εμπρόσθιο μέρος και τριάντα τοις εκατό (30%) από το οπίσθιο μέρος τους,\nβ) σε οχήματα συνολικού μήκους άνω των πέντε (5) μέτρων, σε μήκος που η προβολή του στο οριζόντιο επίπεδο είναι μέχρι δύο (2) μέτρα από το εμπρόσθιο μέρος και μέχρι τρία (3) μέτρα από το οπίσθιο μέρος τους. Αν η μικρότερη διάσταση του φορτωμένου αντικειμένου υπερβαίνει το πλάτος του οχήματος, επιτρέπεται να προεξέχει μέχρι σαράντα (40) εκατοστά σε κάθε πλευρά του οχήματος.\n11. Η κυκλοφορία οχημάτων που υπερβαίνουν το ανώτατο προβλεπόμενο βάρος ή τις ανώτατες διαστάσεις επιτρέπεται σύμφωνα με την παρ. 1 του άρθρου 57 εφόσον:\nα) μεταφέρουν αδιαχώριστο φορτίο, δηλαδή φορτίο το οποίο, για τους σκοπούς της μεταφοράς επί της οδού, δεν μπορεί να διαχωρισθεί σε δύο ή περισσότερα φορτία, χωρίς δυσανάλογη δαπάνη ή κίνδυνο καταστροφής και το οποίο, λόγω των διαστάσεων ή της μάζας του, δεν μπορεί να μεταφερθεί από όχημα που πληροί τις προϋποθέσεις των παρ. 1 και 3 του παρόντος ή\nβ) μεταφέρουν πολλά, ίδια, αντικείμενα, τα οποία υπερβαίνουν τις μέγιστες διαστάσεις, όπως δοκούς, στύλους, σωλήνες ή άλλα φορτία μεγάλου μήκους, με την επιφύλαξη της παρ. 1. 12. Κατ’ εξαίρεση της παρ. 3 για τα οχήματα ή συνδυασμούς οχημάτων μεταφοράς οχημάτων (αυτοκινητοφόρα), επιτρέπεται η μεταφορά οχημάτων που προεξέχουν από το εμπρόσθιο τμήμα τους μέχρι πενήντα (50) εκατοστά και από το οπίσθιο τμήμα τους μέχρι ενάμιση (1,50) μέτρο. Οι προεξοχές αυτές μετρώνται από το απώτερο σταθερό τμήμα του αμαξώματος του συνδυασμού οχήματος μεταφοράς, εμπρός ή πίσω μέχρι του απώτερου σημείου του πρώτου ή τελευταίου οχήματος που αποτελούν μέρος του φορτίου, αντίστοιχα. Κάποια από τα οχήματα, που αποτελούν το φορτίο, μπορούν να στηρίζονται σε εκτεινόμενες φορητές κατασκευές που προεξέχουν του αμαξώματος, οι οποίες όμως δεν λαμβάνονται υπόψη κατά τη μέτρηση των διαστάσεων και δεν επιτρέπεται να εξέχουν του φορτίου. 13. Τα προεξέχοντα φορτία από το οπίσθιο μέρος του οχήματος, εφόσον η προβολή τους στο οριζόντιο επίπεδο υπερβαίνει το ένα (1) μέτρο, επισημαίνονται με σταθερή προσαρτημένη πινακίδα διαστάσεων τουλάχιστον πενήντα επί πενήντα (50 x 50) εκατοστών λευκού χρώματος με διαγώνιες ερυθρές λωρίδες και κατασκευασμένη από υλικά υψηλής αντανακλαστικότητας. Η πινακίδα αυτή τοποθετείται με το πάνω άκρο σε ύψος που δεν ξεπερνά το ένα και εξήντα (1,60) μέτρο και το κάτω άκρο σε ύψος τουλάχιστον σαράντα (40) εκατοστά από το οδόστρωμα. Όταν το φορτίο προεξέχει σε ολόκληρο το πλάτος του οπίσθιου μέρους του οχήματος, τοποθετούνται δύο πινακίδες της παρούσας, μια σε κάθε άκρο του φορτίου. Επιπλέον, κατά τη νύχτα, το άκρο του φορτίου που εξέχει από το εμπρόσθιο μέρος, εφόσον επιτρέπεται, επισημαίνεται με λευκό φως, το άκρο που εξέχει από το οπίσθιο μέρος με ερυθρό φως. 14. Επιτρέπεται:\nα) η μεταφορά ποδηλάτων στην οροφή και στο οπίσθιο μέρος των οχημάτων με εξαρτήματα εγκεκριμένα σύμφωνα με τις ισχύουσες διατάξεις, τα οποία τοποθετούνται με μέριμνα και ευθύνη του οδηγού. Κατά τη μεταφορά ποδηλάτων στο οπίσθιο μέρος των οχημάτων, δεν επιτρέπεται να καλύπτονται τα πίσω φώτα θέσης, στάθμευσης, οι δείκτες κατεύθυνσης και η πινακίδα κυκλοφορίας του οχήματος, ενώ η όλη προεξοχή επισημαίνεται με ερυθρό ανακλαστικό στοιχείο και αφαιρείται όταν δεν πραγματοποιείται αυτού του είδους η μεταφορά.\nβ) Η μεταφορά ποδηλάτων, μοτοποδηλάτων και μοτοσικλετών στο οπίσθιο μέρος των μηχανοκίνητων τροχόσπιτων με εξαρτήματα εγκεκριμένα σύμφωνα με τις ισχύουσες διατάξεις. Δεν επιτρέπεται να καλύπτονται τα πίσω φώτα θέσης, στάθμευσης, οι δείκτες κατεύθυνσης και η πινακίδα αριθμού κυκλοφορίας. Η προεξοχή αυτή επισημαίνεται με ερυθρό ανακλαστικό στοιχείο. 15. Για την οδική μεταφορά, φόρτωση, εκφόρτωση και στοιβασία επικίνδυνων εμπορευμάτων, εφαρμόζεται η ισχύουσα νομοθεσία που ρυθμίζει τα θέματα αυτά. 16. Οι παραβάσεις:\nα) των παρ. 4, 7, 10, 12 και 13, με την επιφύλαξη της περ. β), κατατάσσονται στην κατηγορία Ε2-Α,\nβ) της περ. β) της παρ. 4 κατατάσσονται στην κατηγορία Ε2-Β,\nγ) των παρ. 5, 8, 9 και 14 κατατάσσονται στην κατηγορία Ε1-Α και\nδ) των παρ. 6 και 11 κατατάσσονται στην κατηγορία Ε3-Β. Για την παράβαση της παρ. 6, αν δεν υφίσταται ο κατάλληλος εξοπλισμός στο όχημα, το προβλεπόμενο διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης επιβάλλεται μόνο στον οδηγό, ενώ διοικητικό πρόστιμο και το διοικητικό μέτρο της αφαίρεσης των στοιχείων κυκλοφορίας επιβάλλονται στον κάτοχο του οχήματος. Για τις παραβάσεις των παρ. 1, 2 και 3 εφαρμόζεται το άρθρο 57. Σε περίπτωση επικίνδυνης φόρτωσης, κατά παράβαση του παρόντος, επιβάλλεται και ακινητοποίηση του οχήματος σύμφωνα με το άρθρο 50, περί ακινητοποίησης οχήματος. Για τις ανωτέρω παραβάσεις και εφόσον δεν υφίσταται σχετική ρύθμιση από τις ειδικότερες διατάξεις του ν. 3446/2006 (Α’ 49), επιβάλλονται οι κυρώσεις του παρόντος.`},
  37: {title:`Μεταφορά επιβατών με οχήματα`,text:`1. Απαγορεύεται η μεταφορά επιβατών με οδικά οχήματα με τρόπο τέτοιο ώστε να προκαλείται κίνδυνος για τους ίδιους τους επιβάτες, το όχημα και τον οδηγό, τρίτους, ζώα ή περιουσία.\n2. Ειδικότερα απαγορεύεται:\nα) Η μεταφορά επιβατών που υπερβαίνουν τον αναγραφόμενο ανώτατο αριθμό επιβατών στην άδεια κυκλοφορίας του οχήματος.\nβ) Η κατάληψη θέσης παραπλεύρως του οδηγού, από παιδιά ηλικίας μικρότερης των δώδεκα (12) ετών, εφόσον δεν συγκρατούνται με εγκεκριμένο σύστημα συγκράτησης κατάλληλο για την ηλικία, το ύψος και το βάρος τους.\nγ) Η κατάληψη θέσης παραπλεύρως του οδηγού από περισσότερα πρόσωπα από όσα επιτρέπεται στη θέση ή τις θέσεις.\nδ) Η μεταφορά επιβάτη με μοτοσικλέτα ή μοτοποδήλατο:\nδα) σε άλλη εκτός του συνεπιβάτη θέση,\nδβ) εφόσον δεν έχει τη δυνατότητα να στηρίζεται στα υποπόδια,\nδγ) εφόσον πρόκειται για ανηλίκους έως πέντε (5) ετών και δεν συγκρατούνται με εγκεκριμένο σύστημα συγκράτησης κατάλληλο για την ηλικία, το ύψος και το βάρος τους.\n3. Ο οδηγός μηχανοκίνητου οχήματος και μοτοποδηλάτου επιβάλλεται να μεριμνά για την ασφάλεια των συνεπιβατών του και ειδικότερα να ελέγχει αν φορούν τις ζώνες ασφαλείας και το προστατευτικό κράνος κατά τη μεταφορά τους.\n4.\nα) Οι παραβάσεις για τον οδηγό των παρ. 1 έως 2 με την επιφύλαξη της περ. β) κατατάσσονται στην κατηγορία Ε1-Β.\nβ) Οι παραβάσεις της περ. β) της παρ. 2 που αφορά στην κατάληψη θέσης παραπλεύρως του οδηγού, από παιδιά ηλικίας μικρότερης των δώδεκα (12) ετών, εφόσον δεν συγκρατούνται με εγκεκριμένο σύστημα συγκράτησης κατάλληλο για την ηλικία, το ύψος και το βάρος τους και της περ. γ) της παρ. 2, κατατάσσονται στην κατηγορία Ε3-Β.\nγ) Οι παραβάσεις της παρ. 3 όσον αφορά τις ζώνες ασφαλείας κατατάσσονται στην κατηγορία Ε2-Β, όσον αφορά το προστατευτικό κράνος του συνεπιβάτη κατατάσσεται στην κατηγορία Ε3 - Β.`},
  38: {title:`Στάση και στάθμευση`,text:`1. Η στάση και η στάθμευση επιτρέπονται, αν δεν προκαλείται εξ αυτών κίνδυνος ή παρακώλυση της κυκλοφορίας και αν δεν υπάρχουν σχετικές απαγορευτικές πινακίδες ή διαγραμμίσεις.\n2. Η στάση ή στάθμευση οχήματος απαγορεύεται:\nα) επί διάβασης πεζών ή ποδηλατιστών και σε απόσταση μικρότερη από πέντε (5) μέτρα εκατέρωθεν αυτής,\nβ) σε απόσταση μικρότερη από δώδεκα (12) μέτρα εκατέρωθεν στάσεων αστικών, υπεραστικών, ηλεκτροκίνητων λεωφορείων, και τροχιοδρομικών οχημάτων. Αν σε στάση λεωφορείου είναι τοποθετημένη επί του οδοστρώματος ειδική προεξοχή για την επιβίβαση και την αποβίβαση επιβατών και τη διασφάλιση της προσβασιμότητας των ατόμων με αναπηρία και των εμποδιζόμενων ατόμων γενικότερα, η απόσταση του προηγούμενου εδαφίου:\nβα) μειώνεται στο ήμισυ, όταν ο υπολειπόμενος χώρος μετά τα έξι (6) και μέχρι τα δώδεκα (12) μέτρα εκατέρωθεν της στάσης διατίθεται από την αρμόδια για τη συντήρηση της οδού αρχή, ως χώρος αποκλειστικής στάθμευσης μοτοσικλετών, μοτοποδηλάτων, ποδηλάτων και Ε.Π.Η.Ο. και σημαίνεται με την προβλεπόμενη σήμανση,\nββ) μηδενίζεται, όταν υφίστανται εκατέρωθεν της προεξοχής, εσοχές στάθμευσης,\nγ) σε εισόδους και εξόδους κόμβων και σε απόσταση μικρότερη από δέκα (10) μέτρα από τη νοητή προέκταση της πλησιέστερης οριογραμμής του κάθετου οδοστρώματος,\nδ) σε σιδηροδρομικές ή τροχιοδρομικές γραμμές ή πολύ πλησίον αυτών, ώστε να παρεμποδίζεται η κίνηση των σιδηροδρομικών ή τροχιοδρομικών οχημάτων ή να προκύπτει χρήση επί των σιδηροδρομικών ή τροχιοδρομικών λειτουργουσών γραμμών κατά την πορεία αυτών,\nε) σε πεζοδρόμια, πλατείες, ειδικά ερείσματα που προορίζονται, για πεζούς καθώς και ποδηλατοδρόμους, εκτός αν επιτρέπεται σε αυτούς η στάθμευση με ειδική σήμανση,\nστ) πάνω και κάτω από τις γέφυρες, εκτός αν υπάρχουν χώροι για στάθμευση ειδικά προορισμένοι,\nζ) πλησίον και πάνω σε κυρτές καμπύλες αλλαγής των κατά μήκος κλίσεων των οδών (ράχεων) και σε στροφές ανεπαρκούς ορατότητας για προσπέραση,\nη) σε οδοστρώματα που είναι χωρισμένα σε δύο λωρίδες κυκλοφορίας και αν το εναπομένον πλάτος της λωρίδας μεταξύ οχήματος και απαγορευτικής γραμμής υπέρβασης είναι μικρότερο από τρία (3) μέτρα,\nθ) σε απόσταση μικρότερη από είκοσι (20) μέτρα από φωτεινούς σηματοδότες και δώδεκα (12) μέτρα από πινακίδες υποχρεωτικής διακοπής πορείας (STOP) (Ρ-2) ή υποχρεωτικής παραχώρησης προτεραιότητας (Ρ-1), καθώς και σε θέση, στην οποία το όχημα κρύβει από τους χρήστες της οδού τη θέα των πινακίδων σήμανσης και σηματοδοτών. Τα όρια του προηγούμενου εδαφίου μειώνονται στο ήμισυ αν:\nθα) η στάθμευση γίνεται σε εσοχές στάθμευσης,\nθβ) ο υπολειπόμενος χώρος μετά από τα δέκα (10) ή έξι (6) μέτρα αντίστοιχα, διατίθεται από την αρμόδια για τη συντήρηση της οδού αρχή, ως χώρος αποκλειστικής στάθμευσης μοτοσικλετών, μοτοποδηλάτων, ποδηλάτων και Ε.Π.Η.Ο. που σημαίνεται με την προβλεπόμενη σήμανση.\nι) σε απόσταση πέντε (5) μέτρων από την τομή ρυμοτομικών γραμμών ή των νοητών προεκτάσεων αυτών,\nια) πάνω στις νησίδες ασφαλείας καθώς και στις διαχωριστικές νησίδες,\nιβ) στους αυτοκινητοδρόμους και τις οδούς ταχείας κυκλοφορίας, εκτός των χώρων στάθμευσης, που καθορίζονται με σήμανση,\nιγ) σε λωρίδες επιτάχυνσης και επιβράδυνσης,\nιδ) σε σήραγγες που υποδεικνύονται από ειδικές πινακίδες, εκτός από τους χώρους που υποδεικνύονται ειδικά γι’ αυτόν τον σκοπό,\nιε) επί σημασμένης βοηθητικής οδού, η οποία προορίζεται για οχήματα που μετακινούνται βραδέως,\nιστ) σε θέση όπου βρίσκεται κεκλιμένο επίπεδο (ράμπα) διάβασης ατόμων με αναπηρία ή οδηγός τυφλών και σε απόσταση μικρότερη από πενήντα εκατοστά (0,50 μ.) εκατέρωθεν αυτών,\nιζ) σε ειδικούς χώρους στάθμευσης οχημάτων ατόμων με αναπηρία,\nιη) σε χώρους στάθμευσης αποκλειστικά για συγκεκριμένο όχημα ατόμων με αναπηρία.\nιθ) σε θέση/σημείο επαναφόρτισης ηλεκτροκίνητων οχημάτων, εξαιρουμένων των ηλεκτροκίνητων οχημάτων κατά τη διάρκεια της φόρτισής τους.\nκ) σε σημεία που έχει ως αποτέλεσμα την παρεμπόδιση διέλευσης οχημάτων που εξυπηρετούν δημόσια συγκοινωνία ή αστικών, υπεραστικών και ηλεκτροκίνητων λεωφορείων, εφόσον τα σημεία αυτά επισημαίνονται ευκρινώς.\n3. Η στάθμευση οχήματος στο οδόστρωμα απαγορεύεται και:\nα) σε απόσταση μικρότερη από δεκαπέντε (15) μέτρα προ και μετά τις ισόπεδες σιδηροδρομικές διαβάσεις,\nβ) μπροστά από την είσοδο και έξοδο οχημάτων παροδίου ιδιοκτησίας καθώς και απέναντι από αυτή, όταν η οδός είναι στενή και παρεμποδίζεται η είσοδος-έξοδος οχημάτων εξ αυτής,\nγ) σε θέση από την οποία παρεμποδίζεται όχημα που σταθμεύει κανονικά να εξέλθει από τον χώρο που έχει σταθμεύσει,\nδ) αν το ελεύθερο μέρος της οδού που απομένει είναι ανεπαρκές για την κυκλοφορία των οχημάτων,\nε) παράπλευρα άλλου οχήματος, σε στάση ή στάθμευση, εκτός αν άλλως ορίζεται με ειδική σήμανση. Κατ’ εξαίρεση, τα δίτροχα ποδήλατα, μοτοποδήλατα και μοτοσικλέτες χωρίς καλάθι καθώς και τα Ε.Π.Η.Ο. μπορούν να σταθμεύουν το ένα παράπλευρα στο άλλο είτε σε διπλή σειρά είτε υπό γωνία σε σχέση με την οριογραμμή του οδοστρώματος,\nστ) σε απόσταση μικρότερη από πέντε (5) μέτρα προ και μετά από πυροσβεστικά σημεία,\nζ) προ της εισόδου και εξόδου της προοριζόμενης για τη διακίνηση ασθενών προς και από νοσοκομεία, κλινικές και σταθμούς πρώτων βοηθειών γενικά,\nη) αν εμποδίζει τη χρήση χώρων στάθμευσης που σημαίνεται κατάλληλα,\nθ) σε ειδικούς χώρους στάθμευσης επιβατηγών αυτοκινήτων δημόσιας χρήσης (ΤΑΞΙ),\nι) στις εισόδους και εξόδους των πεζόδρομων ως και πάνω σε αυτούς,\nια) επί του κεντρικού οδοστρώματος οδών τριών (3) λωρίδων, καθώς και εκτός κατοικημένων περιοχών, επί των οδοστρωμάτων οδών σημασμένων ως οδών προτεραιότητας με κατάλληλες πινακίδες.\n4. Ειδικά η στάση και η στάθμευση των Ε.Π.Η.Ο. που κινούνται εντός κατοικημένων περιοχών, λιμένων και χερσαίων ζωνών λιμένων απαγορεύονται:\nα) επάνω σε διαβάσεις πεζών ή ποδηλατιστών και σε απόσταση μικρότερη από πέντε (5) μέτρα από αυτές,\nβ) σε απόσταση μικρότερη από δώδεκα (12) μέτρα από στάσεις αστικών, υπεραστικών, ηλεκτροκίνητων λεωφορείων και τροχιοδρομικών οχημάτων,\nγ) σε εισόδους και εξόδους κόμβων και σε απόσταση μικρότερη από δέκα (10) μέτρα από τη νοητή προέκταση της πλησιέστερης οριογραμμής του κάθετου οδοστρώματος,\nδ) σε σιδηροδρομικές ή τροχιοδρομικές γραμμές ή πολύ πλησίον αυτών, ώστε να παρεμποδίζεται η κίνηση των σιδηροδρομικών ή τροχιοδρομικών οχημάτων,\nε) πάνω και κάτω από τις γέφυρες, εκτός αν υπάρχουν χώροι για στάθμευση ειδικά προορισμένοι,\nστ) πάνω στις νησίδες ασφαλείας καθώς και στις διαχωριστικές νησίδες,\nζ) στους αυτοκινητοδρόμους και τις οδούς ταχείας κυκλοφορίας, εκτός των χώρων στάθμευσης που καθορίζονται με σήμανση,\nη) σε λωρίδες επιτάχυνσης και επιβράδυνσης,\nθ) σε σήραγγες που υποδεικνύονται από ειδικές πινακίδες, εκτός από τους χώρους που υποδεικνύονται ειδικά για αυτόν τον σκοπό,\nι) σε θέση όπου βρίσκεται κεκλιμένο επίπεδο (ράμπα) διάβασης ατόμων με αναπηρία ή οδηγός τυφλών και σε απόσταση μικρότερη από μισό (0,50) μέτρο εκατέρωθεν αυτών,\nια) σε ειδικούς χώρους στάθμευσης οχημάτων ατόμων με αναπηρία,\nιβ) σε χώρους στάθμευσης αποκλειστικά για συγκεκριμένο όχημα ατόμων με αναπηρία,\nιγ) σε απόσταση μικρότερη από επτά (7) μέτρα πριν και μετά τις ισόπεδες σιδηροδρομικές διαβάσεις,\nιδ) σε θέση από την οποία παρεμποδίζεται όχημα που σταθμεύει κανονικά να εξέλθει από τον χώρο όπου έχει σταθμεύσει,\nιε) αν το ελεύθερο μέρος της οδού που απομένει είναι ανεπαρκές για την κυκλοφορία των οχημάτων ή το ελεύθερο μέρος του πεζοδρομίου που απομένει είναι ανεπαρκές για την κυκλοφορία πεζών,\nιστ) προ της εισόδου και εξόδου που προορίζεται για τη διακίνηση ασθενών προς και από νοσοκομεία, κλινικές και σταθμούς πρώτων βοηθειών γενικά,\nιζ) αν εμποδίζει τη χρήση χώρων στάθμευσης που σημαίνονται κατάλληλα,\nιη) σε ειδικούς χώρους στάθμευσης επιβατηγών αυτοκινήτων δημόσιας χρήσης (ΤΑΞΙ),\nιθ) στις εισόδους και εξόδους των πεζόδρομων,\nκ) σε ειδικούς χώρους στάθμευσης και αφετηρίες υπεραστικών λεωφορείων, τουριστικών λεωφορείων και τουριστικών λεωφορείων ανοιχτού τύπου,\nκα) στις ζώνες λιμένων και στη χερσαία ζώνη λιμένων που χρησιμοποιούνται για την επιβίβαση/αποβίβαση ατόμων και τη φορτοεκφόρτωση σε πλοία και σκάφη.\n5. Εκτός κατοικημένων περιοχών, επιτρέπεται η στάση ή η στάθμευση μόνο στους χώρους που έχουν διατεθεί για τον σκοπό αυτό ή στα ερείσματα των οδών, αν δεν υπάρχουν τέτοια, όσο το δυνατόν πλησιέστερα στο δεξιό άκρο του οδοστρώματος και παράλληλα προς τον άξονά του, εκτός αν απαγορεύεται αυτό.\n6. Μέσα στις κατοικημένες περιοχές, σε θέσεις όπου επιτρέπεται η στάση ή η στάθμευση, οι οδηγοί οχημάτων ή ζώων υποχρεούνται να θέτουν αυτά όσο το δυνατόν πλησιέστερα στο δεξιό άκρο του οδοστρώματος. Στους μονόδρομους επιτρέπεται η στάση ή η στάθμευση και στην αριστερή πλευρά. Αν δεν υπάρχει πεζοδρόμιο, οι οδηγοί υποχρεούνται να αφήνουν ελεύθερο χώρο πλάτους ενός (1) μέτρου, τουλάχιστον, για τη διέλευση των πεζών. Σε αυτή την περίπτωση επιτρέπεται η τοποθέτηση κατακόρυφων ελαστικών εύκαμπτων επαναφερόμενων κυλίνδρων (οριοδεικτών) της παρ. 13 για την οριοθέτηση του χώρου διέλευσης πεζών. Στις κατοικημένες περιοχές απαγορεύεται η στάθμευση φορτηγών αυτοκινήτων μεγίστου επιτρεπόμενου βάρους πάνω από τρεισήμισι (3,5) τόνους, λεωφορείων, μηχανημάτων έργου, αγροτικών μηχανημάτων, ρυμουλκούμενων, ρυμουλκούμενων τροχόσπιτων, μηχανοκίνητων τροχόσπιτων συνολικού μήκους άνω των επτά μέτρων και πενήντα εκατοστών (7,50 μ.) και σκαφών, πέρα από είκοσι τέσσερις (24) συνεχείς ώρες. Για τη στάθμευση σε χώρους εκτός κατοικημένων περιοχών των ρυμουλκούμενων και μηχανοκίνητων τροχόσπιτων εφαρμόζεται η παρ. 5. Η στάθμευση αυτών μπορεί να πραγματοποιείται σε κατάλληλους περιφραγμένους χώρους που ορίζονται από τους οικείους δήμους ή από τον Γενικό Γραμματέα Ναυτιλίας και Λιμένων του Υπουργείου Ναυτιλίας και Νησιωτικής Πολιτικής για τους λιμένες με φορέα διαχείρισης νομικό προσώπου ιδιωτικού δικαίου και για τους τουριστικούς λιμένες της παρ. 11 του άρθρου δέκατου ενάτου του ν. 2932/2001 (Α’ 145) ή από τον Γενικό Γραμματέα Τουριστικής Πολιτικής και Ανάπτυξης του Υπουργείου Τουρισμού, κατόπιν γνωμοδότησης της Επιτροπής Τουριστικών Λιμένων της παρ. 2 του άρθρου 30 του ν. 2160/1993 για τους λοιπούς τουριστικούς λιμένες ή τον αρμόδιο φορέα διαχείρισης λιμένα, σύμφωνα με το άρθρο 56 του παρόντος, περί μέτρων ρύθμισης οδικής κυκλοφορίας στους χερσαίους χώρους λιμένων, ή το άρθρο 44 του ν. 4150/2013 (Α’ 102), περί της Επιτροπής Σχεδιασμού και Ανάπτυξης Λιμένων, οι οποίοι μεριμνούν και για τη φύλαξή τους.\n7. Τα οχήματα που βρίσκονται σε στάση ή στάθμευση, επιβάλλεται να τοποθετούνται παράλληλα με την οριογραμμή του οδοστρώματος και επί της πλευράς που αντιστοιχεί στην κατεύθυνση κυκλοφορίας τους, εκτός αν ορίζεται με σήμανση διαφορετικά. Η επί της άλλης πλευράς στάση ή στάθμευση επιτρέπεται, όταν η στάση ή η στάθμευση επί της αντιστοιχούσας προς κατεύθυνση της κυκλοφορίας πλευράς εμποδίζεται λόγω παρουσίας σιδηροτροχιών. Η στάση και η στάθμευση στο μέσον του οδοστρώματος επιτρέπονται αποκλειστικά σε ειδικά σημειούμενες θέσεις.\n8. Οι οδηγοί οχημάτων ή ζώων, όταν σταθμεύουν, δεν επιτρέπεται να απομακρύνονται από αυτά, εάν δεν λάβουν προηγουμένως τα κατάλληλα μέτρα για την αποφυγή δυστυχήματος. Για μηχανοκίνητα οχήματα, υποχρεούνται ειδικότερα να λάβουν προηγουμένως τα κατάλληλα μέτρα, ώστε να εμποδιστεί η χρησιμοποίηση αυτών χωρίς την άδεια των οδηγών τους.\n9. Τα αρμόδια αστυνομικά όργανα μπορούν να ακινητοποιούν τα οχήματα με ειδικούς μηχανισμούς (όπως τροχοσφιγκτήρες), να ενεργούν τη μεταφορά οχήματος το οποίο σταθμεύει σε απαγορευμένη θέση ή την απομάκρυνση τροχόσπιτων, σκαφών ή άλλων ογκωδών αντικειμένων, αν εξαιτίας της στάθμευσης των οχημάτων ή της εγκατάλειψης των τροχόσπιτων και σκαφών καθώς και των αντικειμένων αυτών παρεμποδίζεται η κυκλοφορία. Η μεταφορά των οχημάτων γίνεται με κατάλληλα τεχνικά μέσα, αποκλειομένης της παραβίασης των θυρών του οχήματος, σε σταθμό αυτοκινήτων ή άλλον κατάλληλο χώρο, αφού ληφθούν μέτρα για την αποτροπή υλικών ζημιών. Για τη μεταφορά ειδοποιείται ο ιδιοκτήτης ή κάτοχος του οχήματος μέσα σε εύλογη προθεσμία. Τα έξοδα μεταφοράς, τα οποία καθορίζονται μ
