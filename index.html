function toggleSel(id, e){
  e.stopPropagation();
  if(SELECTED.has(id)) SELECTED.delete(id);
  else SELECTED.add(id);
  updateBasket();
  // toggle class on row without full re-render
  const row = document.querySelector(`.row[data-id="${id}"]`);
  if(row) row.classList.toggle('sel', SELECTED.has(id));
}

function clearSel(){
  SELECTED.clear();
  updateBasket();
  document.querySelectorAll('.row.sel').forEach(r=>r.classList.remove('sel'));
}

/* Συρρέουσα λογική:
   - Η παράβαση με το μεγαλύτερο πρόστιμο → πλήρες ποσό
   - Κάθε άλλη → 50% του προστίμου της
*/
function calcBasket(){
  const items = [...SELECTED].map(id => V.find(v=>v.id===id)).filter(Boolean);
  if(!items.length) return {items:[], primary:null, total:0, totalDays:0};
  const sorted = [...items].sort((a,b)=>(b.amount||0)-(a.amount||0));
  const primary = sorted[0];
  let total = primary.amount || 0;
  sorted.slice(1).forEach(v=>{ total += Math.round((v.amount||0) * 0.5); });
  // Sum all afairesi days
  const totalDays = sorted.reduce((s,v)=>s+afDays(v.afairesi),0);
  return {items: sorted, primary, total, totalDays};
}

function updateBasket(){
  const {items, primary, total, totalDays} = calcBasket();
  const basket = document.getElementById('basket');
  if(!items.length || !SEL_MODE){
    basket.classList.remove('on');
    document.getElementById('main').style.paddingBottom = '';
    return;
  }
  basket.classList.add('on');
  document.getElementById('main').style.paddingBottom = '110px';
  document.getElementById('bk-cnt').textContent = items.length + ' παράβαση' + (items.length===1?'':'εις') + ' επιλεγμέν' + (items.length===1?'η':'ες');
  document.getElementById('bk-total').textContent = fmt(total);
  const concurrent = items.length > 1 ? items.slice(1) : [];
  const daysStr = totalDays > 0 ? ' · αφαίρεση ' + totalDays + ' ημ.' : '';
  document.getElementById('bk-sub').textContent = items.length > 1
    ? 'Κύρια: ' + fmt(primary.amount||0) + '€ + ' + concurrent.length + ' συρρέουσ' + (concurrent.length===1?'α':'ες') + ' (×50%)' + daysStr
    : (totalDays > 0 ? 'Αφαίρεση ' + totalDays + ' ημ.' : '');
}

function showBasketDetail(){
  const {items, primary, total, totalDays} = calcBasket();
  if(!items.length) return;

  // Collect all afairesi from selected violations (deduplicate by description)
  const measuresAll = [];
  items.forEach(v=>{
    if(v.measures && v.measures.length){
      v.measures.forEach(m=>{
        measuresAll.push({m, vtitle: v.title});
      });
    }
  });

  // Build afairesi summary (max days per type heuristic)
  const afaireseItems = items.filter(v=>v.afairesi);

  let html = `<div id="bk-sheet">`;
  html += `<div class="sec" style="padding-top:12px">Παραβάσεις &amp; Πρόστιμα</div>`;
  items.forEach((v,i)=>{
    const isPrimary = i===0;
    const amt = isPrimary ? (v.amount||0) : Math.round((v.amount||0)*0.5);
    const badgeCls = isPrimary ? 'primary' : 'concurrent';
    const badgeTxt = isPrimary ? 'Κύρια' : 'Συρρέουσα ×50%';
    const amtDisp = v.amount ? fmt(amt)+'€' : '—';
    const daysItem = afDays(v.afairesi);
    html += `<div class="bk-item">
      <div style="flex:1">
        <div class="bk-item-ttl">${v.title}</div>
        <div class="bk-item-art">${v.article}${daysItem?' · ⏱ '+daysItem+' ημ.':''}</div>
      </div>
      <div style="text-align:right">
        <div class="bk-item-amt ${badgeCls}">${amtDisp}</div>
        <div><span class="bk-badge ${badgeCls}">${badgeTxt}</span></div>
      </div>
    </div>`;
  });

  html += `<div class="bk-total-row">
    <div>
      <div class="bk-total-lbl">Σύνολο Προστίμου</div>
      ${totalDays?`<div style="font-size:13px;color:#ff9f0a;margin-top:2px">⏱ Αφαίρεση άδειας: ${totalDays} ημέρες</div>`:''}
    </div>
    <div class="bk-total-val">${fmt(total)}</div>
  </div>`;



  if(measuresAll.length){
    html += `<div class="bk-measures-hdr">Λοιπά Διοικητικά Μέτρα &amp; Ποινικές Κυρώσεις</div>`;
    measuresAll.forEach(({m, vtitle})=>{
      html += `<div class="bk-mitem">• <span style="color:var(--g5)">${vtitle}:</span> ${m}</div>`;
    });
  }

  html += `</div>`;

  document.getElementById('sc').innerHTML = html;
  openSheet();
}
