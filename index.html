αστ) Η κυκλοφορία του Λεωφορείου Αστικού Τύπου χωρίς οδηγό στο πλαίσιο πιλοτικής εφαρμογής ή δοκιμαστικής λειτουργίας για τους σκοπούς της παρούσας περίπτωσης διεξάγεται σε διαδοχικά στάδια, κατόπιν αξιολόγησης των αποτελεσμάτων κάθε σταδίου, τα οποία καθορίζουν τη φύση και τις προϋποθέσεις υλοποίησης του επόμενου, καθώς και την ανάγκη λήψης πρόσθετων μέτρων ή παρεμβάσεων, ώστε να ελέγχεται η ασφαλής κυκλοφορία του οχήματος. β. Κατ’ εξαίρεση του πρώτου εδαφίου της παρούσας παραγράφου, επιτρέπεται η θέση σε κυκλοφορία επί της οδού αυτοκινήτου επιβατηγού ή φορτηγού αυτοκινήτου με μέγιστο βάρος έως τρεισήμισι (3,5) τόνους, χωρίς την παρουσία οδηγού επ’ αυτού, στο πλαίσιο πιλοτικής εφαρμογής για ερευνητικούς σκοπούς, κατόπιν υποβολής από τον ενδιαφερόμενο φορέα σχετικού τεκμηριωμένου αιτήματος. Για την έγκριση θέσης σε κυκλοφορία οχήματος, δυνάμει της παρούσας περίπτωσης, ισχύουν κατ’ αντιστοιχία, οι όροι και προϋποθέσεις των υποπερ. αα) έως αστ) της περ. α’.
2. Ο οδηγός επιβάλλεται να έχει την κατά τις σχετικές διατάξεις προβλεπόμενη άδεια οδήγησης και την αναγκαία σωματική και διανοητική ικανότητα και να βρίσκεται σε κατάλληλη κατάσταση για να οδηγεί. Κατά τον χρόνο της οδήγησης οφείλει να είναι σε θέση να ελέγχει το όχημά του ή τα ζώα του. Ο οδηγός κάθε οχήματος υποχρεούται να έχει πλήρη ελευθερία των κινήσεών του, για να ενεργεί ελεύθερα τους αναγκαίους χειρισμούς. Ιδιαίτερα, απαγορεύεται να χρησιμοποιεί εν κινήσει ενσύρματα ακουστικά που έχουν συνδεθεί με φορητά ραδιόφωνα ή άλλες παρεμφερείς ηχητικές συσκευές, καθώς και τηλεόραση ή άλλη φορητή ηλεκτρονική συσκευή με οθόνη αφής, που λειτουργεί ως τέτοια. Η εν κινήσει χρήση κινητού ή άλλης ηλεκτρονικής συσκευής για βιντεοσκόπηση ή ζωντανή μετάδοση από τη θέση του οδηγού απαγορεύεται, εκτός αν το κινητό ή η συσκευή έχουν τοποθετηθεί σε ειδική θέση. Η εν κινήσει χρήση κινητού τηλεφώνου ή άλλων συσκευών τηλεπικοινωνίας, όπως φορητών ηλεκτρονικών συσκευών με τη μορφή ρολογιού χειρός, επιτρέπεται μόνο όταν αυτό είναι τοποθετημένο σε ειδική θέση για ανοικτή ακρόαση ή για λειτουργία εφαρμογών πλοήγησης ή όταν χρησιμοποιείται με ακουστικό ασύρματης επικοινωνίας.
3. Ο οδηγός μηχανοκίνητου οχήματος και μοτοποδηλάτου έχει, κατά τις σχετικές διατάξεις, τις αναγκαίες γνώσεις και επιδεξιότητα για να οδηγεί. Τις αυτές αναγκαίες γνώσεις πρέπει να έχει και ο εκπαιδευόμενος οδηγός, όταν οδηγεί.
4. Ο οδηγός αυτοκινήτου οχήματος που μεταφέρει επικίνδυνες ύλες πάνω από ορισμένες ποσότητες επιβάλλεται να έχει υποστεί την, κατά τις σχετικές διατάξεις, αναγκαία επαγγελματική κατάρτιση, για να ενεργεί και να οδηγεί το όχημα, ώστε να μην κινδυνεύουν οι άνθρωποι, το περιβάλλον, τα ζώα και η προσωπική του ασφάλεια.
5. Οι οδηγοί λεωφορείων, επιβατηγών δημόσιας χρήσης, εκμισθούμενων επιβατηγών ιδιωτικής χρήσης με οδηγό και φορτηγών αυτοκινήτων απαγορεύεται να οδηγούν πέραν των χρονικών ορίων τα οποία καθορίζονται από τις κείμενες διατάξεις. Οι κάτοχοι των επιβατηγών αυτοκινήτων δημόσιας χρήσης (Ε.Δ.Χ.) της περ. 19 του άρθρου 4, καθώς και οι κάτοχοι των μέσων μαζικής μεταφοράς και των τουριστικών οχημάτων, φροντίζουν για την ύπαρξη μέτρων παθητικής ασφάλειας των επιβατών. Οι οδηγοί οφείλουν να οδηγούν με σύνεση, ώστε να είναι απόλυτα ασφαλής η μεταφορά των επιβατών. 6.α) Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε1-Α.
β) Οι παραβάσεις της παρ. 2 κατατάσσονται στην κατηγορία Ε3-Β πλην της παράβασης του πρώτου εδαφίου της παρ. 2 που κατατάσσεται στην κατηγορία Ε2-Α και στην κατηγορία Σ.
βα) Στην περίπτωση της παράβασης του έκτου εδαφίου της παρ. 2, που αφορά στην εν κινήσει χρήση κινητού τηλεφώνου, επιπλέον των διοικητικών κυρώσεων της περ. β, εάν ο οδηγός γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε βαριά σωματική βλάβη ή σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων επιβάλλονται οι ποινές των περ. γγ) και
δδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95), περί επικίνδυνης οδήγησης. Για την αξιόποινη πράξη του πρώτου εδαφίου της παρούσας υποπερίπτωσης, η έρευνα μπορεί να συμπεριλάβει και τη διενέργεια άρσης του απορρήτου του περιεχομένου των επικοινωνιών και των δεδομένων θέσης και κίνησης αυτών, με την τήρηση των εγγυήσεων και τις διαδικασίες των άρθρων 6, περί άρσης του απορρήτου των επικοινωνιών για τη διακρίβωση εγκλημάτων, 7, περί διαχείρισης υλικού σε άρσεις για τη διερεύνηση εγκλημάτων, και 8, περί διαδικασίας άρσης του απορρήτου, του ν. 5002/2022 (Α’ 228).
γ) Η παράβαση της παρ. 3 κατατάσσεται στην κατηγορία Ε1-Β.
δ) Στις παραβάσεις της παρ. 5,
δα) η παράβαση του πρώτου εδαφίου κατατάσσεται στην κατηγορία Ε2-Α, πλην των οδηγών φορτηγών οχημάτων, οι οποίοι τιμωρούνται σύμφωνα με τις ειδικές διατάξεις του ν. 3446/2006 (Α’ 49),
δβ) η παράβαση του δεύτερου εδαφίου κατατάσσεται στην κατηγορία Ε3-Α,
δγ) η παράβαση του τρίτου εδαφίου κατατάσσεται στην κατηγορία Ε1-Α και στην κατηγορία Σ. 7. Ο Περιφερειάρχης ή οι από αυτόν εξουσιοδοτούμενες αρχές μπορούν να επιβάλλουν την επανεξέταση κατόχου άδειας οδήγησης, αν ανακύψουν αμφιβολίες για την ικανότητά του προς οδήγηση ή την ιατρική επανεξέτασή του, αν ανακύψουν αμφιβολίες για τη σωματική ή πνευματική του κατάσταση. Στις περιπτώσεις αυτές η άδεια οδήγησης του παραπεμπομένου για επανεξέταση οδηγού αφαιρείται μετά την έκδοση της απόφασης για επανεξέταση και αποδίδεται μόνο αν αυτός κριθεί ικανός.`},
  18: {title:`Ζώα, αναβάτες αλόγων,  συνοδοί και οδηγοί ζώων`,text:`1. Ζώα επιτρέπεται να οδηγούνται μόνο από ανθρώπους απόλυτα ικανούς στον χειρισμό τους και που είναι σε θέση να τα ελέγχουν πλήρως.
2. Ζώα που είναι πιθανό να θέσουν σε κίνδυνο τους χρήστες των οδών δεν επιτρέπεται να κινούνται σε οδούς, εκτός αν βρίσκονται κάτω από την επίβλεψη και του έλεγχο κατάλληλου οδηγού. Τα σκυλιά πρέπει, γενικά, να είναι δεμένα με ειδικό λουρί.
3. Ζώα επικίνδυνα, είτε σε αγέλες ή κοπάδια, πρέπει να κινούνται κάτω από τον έλεγχο ενός ατόμου επικεφαλής. Μεγάλες αγέλες ή κοπάδια ζώων πρέπει να έχουν πολλούς οδηγούς.
4. Εφόσον μεγάλα ζώα ή αγέλες ή κοπάδια κινούνται κατά τη διάρκεια της νύχτας στις οδούς, οι οδηγοί τους υποχρεούνται να επισημαίνουν τα ζώα, καθώς και την αρχή και το τέλος της αγέλης ή του κοπαδιού με ευδιάκριτα φώτα.
5. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε2-Α, εκτός εάν τιμωρούνται βαρύτερα με άλλη διάταξη.`},
  19: {title:`Εκπομπές ρύπων και θόρυβοι`,text:`Εκπομπές ρύπων και θόρυβοι
1. Απαγορεύονται η κυκλοφορία και η οδήγηση κάθε οδικού οχήματος το οποίο:
α) εκπέμπει ουσίες ή προϊόντα βλαπτικά για την υγεία του ανθρώπου ή που ρυπαίνουν το περιβάλλον πέραν των επιτρεπόμενων ορίων,
β) προκαλεί γενικά από την κίνηση και λειτουργία του θόρυβο πέραν των επιτρεπόμενων ορίων.
2. Οι παραβάσεις της παρ. 1 κατατάσσονται στην κατηγορία Ε3-Β και στην κατηγορία Σ και τα στοιχεία κυκλοφορίας του οχήματος αφαιρούνται επί τόπου. Τα αφαιρούμενα στοιχεία κρατούνται στην αρμόδια αρχή μέχρι να προσκομιστεί από τον παραβάτη σημείωμα της αρμόδιας υπηρεσίας της Περιφερειακής Ενότητας για την καταλληλότητα του οχήματος από πλευράς εκπομπής καυσαερίων ή θορύβων. Στους παραβάτες της υποχρέωσης περί έκδοσης κάρτας ελέγχου καυσαερίων επιβάλλονται οι κυρώσεις του άρθρου 4 του π.δ. 363/1995 (Α’ 193).
3. Οι οδηγοί οδικών οχημάτων υποχρεούνται να μην παρενοχλούν τους άλλους χρήστες της οδού, τους παρόδιους και τους διαμένοντες επί της οδού, προκαλώντας, μεταξύ άλλων, θόρυβο από τη χρήση ηχητικού συστήματος ή από οποιαδήποτε άλλη πηγή, σκόνη, καπνό ή ρίψη υγρών. Οι παραβάσεις του πρώτου εδαφίου κατατάσσονται στην κατηγορία Ε3 - Β και στην κατηγορία Σ.`},
  20: {title:`Θέση επί της οδού`,text:`Θέση επί της οδού
1. Στο οδικό δίκτυο της χώρας ισχύει η δεξιά κατεύθυνση κυκλοφορίας. Ο οδηγός κάθε οχήματος, με την επιφύλαξη της παρ. 1 του άρθρου 16, περί κανόνων οδικής συμπεριφοράς, και της παρ. 6 του άρθρου 21, περί προσπέρασης και κυκλοφορίας και σε στοίχους, οδηγεί το όχημά του πλησίον του δεξιού άκρου του οδοστρώματος και αν ακόμη ολόκληρο το οδόστρωμα είναι ελεύθερο.
2. Ο οδηγός, με εξαίρεση την περίπτωση απόλυτης ανάγκης, κινείται αποκλειστικά στις καθορισμένες για την κατηγορία του οχήματός του ειδικές οδούς, οδοστρώματα και λωρίδες κυκλοφορίας, όπου υφίστανται τέτοιες. Αν δεν έχει οριστεί λωρίδα κυκλοφορίας ή ειδική οδός γι’ αυτούς, οι μεν οδηγοί φορτηγών, λεωφορείων και βραδυκίνητων και βραδυπορούντων γενικά οδικών οχημάτων υποχρεούνται, με την επιφύλαξη της παρ. 6 του άρθρου 21, να οδηγούν τα οχήματα αυτά στη δεξιά λωρίδα κυκλοφορίας στις οδούς οι οποίες έχουν δύο (2) τουλάχιστον λωρίδες κατά κατεύθυνση, οι δε οδηγοί μοτοποδηλάτων, ποδηλάτων και μη μηχανοκίνητων οχημάτων, καθώς και οι οδηγοί ζώων υποχρεούνται να κινούνται κατά μήκος οποιουδήποτε προς την κατεύθυνση της κυκλοφορίας βατού ερείσματος της οδού, εφόσον υπάρχει, και δεν προκαλείται δυσχέρεια στους χρήστες αυτού, άλλως πλησίον του άκρου δεξιού του οδοστρώματος.
3. Με την επιφύλαξη της παρ. 1, σε οδοστρώματα που είναι χωρισμένα σε δύο (2) ή περισσότερες λωρίδες κυκλοφορίας, κατά κατεύθυνση με κατά μήκος διαγραμμίσεις, οι οδηγοί οχημάτων οδηγούν αυτά μέσα στα όρια μιας λωρίδας και κατά το δυνατόν στο μέσο αυτής.
4. Ο οδηγός απαγορεύεται να κυκλοφορεί σε οδόστρωμα που προορίζεται για την αντίθετη προς την κατεύθυνσή του κυκλοφορία, καθώς και σε πλατείες, πεζόδρομους, πεζοδρόμια, νησίδες ασφαλείας και διαχωριστικές νησίδες ή ειδικά ερείσματα, τα οποία προορίζονται για την κυκλοφορία των πεζών, εκτός από περιπτώσεις απολύτου ανάγκης ή όταν ειδικές ρυθμίσεις το επιτρέπουν.
5. Σε οδοστρώματα διπλής κατεύθυνσης, τα οποία έχουν τέσσερις (4) ή περισσότερες λωρίδες κυκλοφορίας, ο οδηγός δεν επιτρέπεται να καταλαμβάνει τις λωρίδες κυκλοφορίας που προορίζονται για την κίνηση προς την αντίθετη κατεύθυνση.
6. Σε οδοστρώματα διπλής κατεύθυνσης, τα οποία έχουν τρεις (3) λωρίδες κυκλοφορίας, ο οδηγός δεν επιτρέπεται να καταλαμβάνει την ακραία λωρίδα κυκλοφορίας της αντίθετης κατεύθυνσης.
7. Σε μονόδρομους (οδούς μοναδικής κατεύθυνσης), οι οποίοι έχουν ειδικώς σημανθεί, ο οδηγός απαγορεύεται να οδηγεί αντίθετα προς την κατεύθυνση του μονόδρομου.
8.
α) Οι παραβάσεις των παρ. 1, 2 και 3, με την επιφύλαξη της περ. β) της παρούσας, κατατάσσονται στην κατηγορία Ε1-Β.
β) Οι λοιπές παραβάσεις, συμπεριλαμβανομένων αυτών της παρ. 2, όσον αφορά στα φορτηγά και τα λεωφορεία, και της παρ. 4, κατατάσσονται στην κατηγορία Ε3-Β και στην κατηγορία Σ.`},
  21: {title:`Αριστερή λωρίδα — υποχρεώσεις οδηγών`,text:`Προσπέραση, κυκλοφορία σε στοίχους, επιτρεπτή αλλαγή λωρίδας και κίνηση μοτοποδηλάτων και μοτοσυκλετών σε πυκνή κυκλοφορία
1. Ο οδηγός επιτρέπεται να προσπεράσει προπορευόμενο όχημα μόνο εφόσον μπορεί να το κάνει χωρίς κίνδυνο ή παρακώλυση της κυκλοφορίας και εφόσον προειδοποιήσει έγκαιρα γι’ αυτό, σύμφωνα με την παρ. 2 του άρθρου 25, περί κανόνων για τους ελιγμούς των οχημάτων.
2. Η προσπέραση επιτρέπεται, κατά κανόνα, από τα αριστερά. Κατ’ εξαίρεση, η προσπέραση επιτρέπεται από τα δεξιά αν ο προπορευόμενος οδηγός έχει δώσει σήμα ότι προτίθεται να στρίψει αριστερά και έχει μετακινήσει το όχημα ή τα ζώα του προς την πλευρά αυτή.
3. Η προσπέραση απαγορεύεται γενικά στις εξής περιπτώσεις:
α) όταν κάποιος από τους οδηγούς που ακολουθούν αυτόν που προτίθεται να προσπεράσει άρχισε ήδη την προσπέραση,
β) όταν ο οδηγός που προπορεύεται στην αυτή λωρίδα κυκλοφορίας δώσει σήμα ότι προτίθεται να προσπεράσει άλλον,
γ) όταν η λωρίδα κυκλοφορίας, την οποία θα χρησιμοποιήσει ο οδηγός κατά την προσπέραση, δεν είναι ελεύθερη σε αρκετή απόσταση μπροστά του, με τρόπο ώστε, λαμβανομένης υπόψη της διαφοράς ταχύτητας του οχήματός του, κατά τον χρόνο της προσπέρασης, και εκείνη των οχημάτων, τα οποία προτίθεται να προσπεράσει, να μην εκθέσει σε κίνδυνο ή παρεμποδίσει τους ερχόμενους αντίθετα,
δ) αμέσως προ ή επί μη κυκλικού ισόπεδου οδικού κόμβου, εκτός αν:
δα) επιτρέπεται η προσπέραση προς τα δεξιά, κατά την περίπτωση της παρ. 2,
δβ) η οδός, στην οποία γίνεται η προσπέραση, έχει προτεραιότητα,
δγ) η κυκλοφορία ρυθμίζεται από τροχονόμο ή με φωτεινούς σηματοδότες και
δδ) το όχημα το οποίο προσπερνάται είναι ποδήλατο, μοτοποδήλατο ή μοτοσικλέτα χωρίς καλάθι,
ε) αμέσως προ ή επί ισοπέδου σιδηροδρομικής διάβασης χωρίς λειτουργούντα κινητά φράγματα, εκτός αν η οδική κυκλοφορία ρυθμίζεται από φωτεινούς σηματοδότες, όπως αυτοί που χρησιμοποιούνται στους ισόπεδους οδικούς κόμβους,
στ) αμέσως προ ή σε διάβαση πεζών, η οποία έχει σημανθεί ως διάβαση πεζών στο οδόστρωμα ή με πινακίδα σήμανσης,
ζ) μέσα στις σήραγγες με μία (1) λωρίδα κυκλοφορίας ανά κατεύθυνση,
η) όταν σχολικό λεωφορείο έχει σταματήσει σε οδόστρωμα με μία (1) ή δύο (2) λωρίδες κυκλοφορίας προς την κατεύθυνση που κινείται και έχει αναμμένα τα φώτα έκτακτης ανάγκης για την αποβίβαση και επιβίβαση μαθητών.
4. Ειδικότερα σε οδόστρωμα διπλής κατεύθυνσης, η προσπέραση απαγορεύεται και κατά την προσέγγιση σε κυρτή αλλαγή κλίσης ή σε στροφές με ανεπαρκή ορατότητα, εκτός αν υπάρχει στα σημεία αυτά διαχωριστική νησίδα ή δύο (2) τουλάχιστον λωρίδες κυκλοφορίας προς την κατεύθυνση αυτού που προσπερνά, οι οποίες ορίζονται με κατά μήκος διαγραμμίσεις, η δε προσπέραση γίνεται χωρίς να εγκαταλείψει ο οδηγός τις λωρίδες κυκλοφορίας που σημειώνονται ως κλειστές γι’ αυτούς που έρχονται αντίθετα.
5. Ο οδηγός κατά την προσπέραση αφήνει στο όχημα το οποίο προσπερνά αρκετό χώρο παραπλεύρως.
6. Ο οδηγός μετά την προσπέραση επαναφέρει το όχημά του πλησίον του δεξιού άκρου του οδοστρώματος, χωρίς να θέσει σε κίνδυνο αυτούς που προσπερνά. Αν όμως κινείται σε οδόστρωμα με δύο (2) τουλάχιστον λωρίδες κυκλοφορίας κατά κατεύθυνση και προτίθεται να προσπεράσει περισσότερα από ένα (1) οχήματα, μπορεί να παραμείνει στη λωρίδα που χρησιμοποιεί για την προσπέραση, αν η ενέργειά του αυτή δεν προκαλεί δυσχέρεια στους οδηγούς ταχύτερων οχημάτων που τον πλησιάζουν από πίσω.
7. Οδηγός που αντιλαμβάνεται ότι άλλος οδηγός προτίθεται να τον προσπεράσει, υποχρεούται να κινείται πλησίον του δεξιού άκρου του οδοστρώματος και να μην επιταχύνει την κίνησή του. Ο οδηγός βραδέως κινούμενου ή ογκώδους οχήματος, του οποίου δεν είναι ευχερής και ασφαλής η προσπέραση, λόγω της στενότητας ή της κατάστασης του οδοστρώματος, σε συνδυασμό με την πυκνότητα της αντιθέτως ερχόμενης κυκλοφορίας, υποχρεούται να μειώνει την ταχύτητά του και να πλησιάζει κατά το δυνατόν, στο δεξιό άκρο του οδοστρώματος, για να διευκολύνει την προσπέραση από οχήματα που ακολουθούν. 8.α) Σε μονόδρομους και οδούς διπλής κατεύθυνσης, που υπάρχουν δύο (2) τουλάχιστον λωρίδες κυκλοφορίας, κατά κατεύθυνση, μέσα σε κατοικημένες περιοχές και τρεις (3) εκτός αυτών, διαχωριζόμενες με κατά μήκος διαγραμμίσεις, επιτρέπεται η κυκλοφορία σε παράλληλες σειρές (στοίχους).
β) Σε κάθε περίπτωση, αλλαγή λωρίδας επιτρέπεται μόνο εφόσον δεν προκαλείται κίνδυνος ή παρακώλυση της κυκλοφορίας και δίνεται έγκαιρα προειδοποίηση, σύμφωνα με την παρ. 2 του άρθρου 25.
γ) Στην περ. α, ο προβλεπόμενος τρόπος οδήγησης δεν θεωρείται ότι αποτελεί προσπέραση κατά την έννοια του παρόντος και εφαρμόζεται η περ. στ) της παρ. 3. 9. Αν η πυκνότητα της κυκλοφορίας είναι τέτοια ώστε τα οχήματα να καταλαμβάνουν ολόκληρο το πλάτος του οδοστρώματος προς την κατεύθυνση της κυκλοφορίας και κινούνται με την ταχύτητα του προπορευόμενου αυτών οχήματος, επιτρέπονται:
α) η αλλαγή λωρίδας μόνο προκειμένου το όχημα να στρίψει δεξιά ή αριστερά ή να σταθμεύσει,
β) η κίνηση δίκυκλων μοτοποδηλάτων και μοτοσικλετών χωρίς καλάθι μεταξύ των λωρίδων κυκλοφορίας της ίδιας κατεύθυνσης (διήθηση) σε οδούς με τουλάχιστον δύο (2) λωρίδες κυκλοφορίας κατά κατεύθυνση, αν η ταχύτητά τους δεν υπερβαίνει τα είκοσι (20) χιλιόμετρα την ώρα και τα λοιπά οχήματα είναι ακινητοποιημένα. Κατά τη διενέργεια της διήθησης οι οδηγοί δίκυκλων μοτοποδηλάτων και μοτοσικλετών χωρίς καλάθι έχουν αναμμένα τα φώτα διασταύρωσης, παραχωρούν προτεραιότητα, τηρούν ασφαλή πλευρική απόσταση από τα υπόλοιπα οχήματα, μειώνουν ταχύτητα και ακινητοποιούνται, αν είναι αναγκαίο για την αποφυγή ατυχήματος και κάθε κινδύνου για τους υπόλοιπους οδηγούς ή πεζούς. 10. Στις περιπτώσεις κίνησης των οχημάτων σε παράλληλες σειρές (στοίχους), οι οδηγοί των βραδυπορούντων οχημάτων υποχρεούνται να κινούν αυτό στη δεξιά λωρίδα του οδοστρώματος. 11.
α) Οι παραβάσεις των παρ. 1 έως 3 και 5 έως 8, με την επιφύλαξη των περ. β) και
γ) της παρούσας, κατατάσσονται στην κατηγορία Ε2-Β.
β) Οι παραβάσεις της περ. β) του άρθρου 8 και των παρ. 9 και 10 του παρόντος κατατάσσονται στην κατηγορία Ε1-Β.
γ) Οι παραβάσεις των περ. α), β), ε),
στ) και
ζ) της παρ. 3 και της παρ. 4 κατατάσσονται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ και το διοικητικό μέτρο της επιτόπου αφαίρεσης της άδειας οδήγησης για τριάντα (30) ημέρες.`},
  22: {title:`Διέλευση οχημάτων που κινούνται αντίθετα`,text:`Διέλευση οχημάτων που κινούνται αντίθετα
1. Ο οδηγός κατά τη συνάντησή του με οχήματα που έρχονται αντίθετα υποχρεούται να παραχωρεί επαρκή χώρο παραπλεύρως, κινούμενος στο δεξιό άκρο του οδοστρώματος. Αν κατά τη συνάντηση αυτή παρεμποδίζεται η διέλευση του οχήματος, λόγω εμποδίου ή από άλλη αιτία, ο οδηγός υποχρεούται να μειώνει την ταχύτητα και αν είναι αναγκαίο, να διακόπτει την πορεία του για να επιτρέπει τη διέλευση στον ερχόμενο ή τους ερχόμενους.
2. Σε οδούς μεγάλης κλίσης, που η διέλευση των οχημάτων που έρχονται αντίθετα είναι αδύνατη ή δυσχερής, ο οδηγός του κατερχόμενου οχήματος υποχρεούται να παραχωρήσει επαρκή χώρο για τη διέλευση του ανερχόμενου οχήματος. Αν το ένα (1) από τα δύο (2) οχήματα απαιτείται να οπισθοδρομήσει, για να μπορέσει να περάσει το άλλο, ο συνδυασμός οχημάτων (συρμός) έχει προτεραιότητα διέλευσης σε σχέση με τα άλλα οχήματα, τα βαρέα προς τα ελαφρά και τα λεωφορεία προς τα φορτηγά αυτοκίνητα. Αν και τα δύο (2) οχήματα είναι της ίδιας κατηγορίας, υποχρεούται να οπισθοδρομήοει ο οδηγός του κατερχόμενου οχήματος εκτός αν, λόγω των συνθηκών κυκλοφορίας, της διαμόρφωσης και κατάστασης της οδού και του μεταφερόμενου φορτίου, μπορεί πιο εύκολα να οπισθοδρομήσει ο οδηγός του ανερχομένου.
3. Σε κάθε άλλη περίπτωση κατά την οποία η διέλευση οχημάτων που κινούνται αντίθετα είναι δυσχερής ή αδύνατη, εφαρμόζονται αναλόγως το δεύτερο και το τρίτο εδάφιο της παρ. 2, με την προσθήκη ότι σε περίπτωση οχημάτων της αυτής κατηγορίας υποχρεούται να οπισθοδρομήσει ο οδηγός του οχήματος που του επιτρέπουν αι κυκλοφοριακές συνθήκες.
4. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α.`},
  23: {title:`Ταχύτητα και απόσταση μεταξύ οχημάτων`,text:`Ταχύτητα και απόσταση μεταξύ οχημάτων
1. Ο οδηγός οδικού οχήματος επιβάλλεται να έχει τον πλήρη έλεγχο του οχήματός του ώστε να μπορεί σε κάθε στιγμή να εκτελεί τους απαιτούμενους χειρισμούς.
2. Ο οδηγός επιβάλλεται να ρυθμίζει την ταχύτητα του οχήματός του, λαμβάνοντας συνεχώς υπόψη του τις επικρατούσες συνθήκες, ιδιαίτερα τη διαμόρφωση του εδάφους, την κατάσταση και τα χαρακτηριστικά της οδού, την κατάσταση και το φορτίο του οχήματός του, τις καιρικές συνθήκες και τις συνθήκες κυκλοφορίας, με τρόπο ώστε να είναι σε θέση να διακόψει την πορεία του οχήματός του μπροστά από οποιοδήποτε εμπόδιο που μπορεί να προβλεφθεί και το οποίο βρίσκεται στο ορατό από αυτόν εμπρόσθιο τμήμα της οδού. Υποχρεούται επίσης να μειώνει την ταχύτητα του οχήματός του και, σε περίπτωση ανάγκης, να διακόπτει την πορεία του, όταν οι περιστάσεις το επιβάλλουν.
3. Ο οδηγός επιβάλλεται ιδιαιτέρως να μειώνει την ταχύτητα του οχήματός του σε τμήματα της οδού με περιορισμένο πεδίο ορατότητας, στις στροφές, πλησίον των σχολείων, πλησίον των ισόπεδων οδικών κόμβων, στις απότομες κατωφέρειες, πλησίον των μέσων μαζικής μεταφοράς, που σταθμεύουν για να αποβιβάζουν ή επιβιβάζουν επιβάτες, κατά τις νυκτερινές ώρες, σε περίπτωση ομίχλης, βροχής, χιονιών, παγετού και γενικά όταν το οδόστρωμα είναι ολισθηρό. Την ίδια υποχρέωση έχει και κατά τη διέλευσή του από στενές διόδους και αν η διασταύρωσή του με άλλα οχήματα καθίσταται δυσχερής, όταν υπάρχουν ζώα επί της οδού που παρουσιάζουν σημεία ταραχής, κατά τη διέλευσή του από κατοικημένες περιοχές, αν πεζοί, που βρίσκονται στην τροχιά του, καθυστερούν να απομακρυνθούν, καθώς και σε κάθε άλλη ειδική περίπτωση κατά την οποία επιβάλλεται μετριασμός ταχύτητας. Οι οδηγοί αυτοκινήτων οχημάτων που κινούνται σε οδό με χιόνια υποχρεούνται, εφόσον το όχημα δεν φέρει ειδικά ελαστικά, να τοποθετούν στους δύο (2) τουλάχιστον κινητήριους τροχούς αντιολισθητικές αλυσίδες ή άλλα ανάλογα αντιολισθητικά μέσα. Την ίδια υποχρέωση έχουν οι οδηγοί των πιο πάνω οχημάτων και όταν κινούνται σε οδό με παγετό, εφόσον ειδοποιούνται προς τούτο με ρυθμιστικές πινακίδες ή από τις αρμόδιες αρχές. Αν δεν συμμορφωθεί ο οδηγός, τα αστυνομικά όργανα μπορούν να επιβάλουν ακινητοποίηση του οχήματος στο άκρο της οδού ή σε άλλο κατάλληλο σημείο, μέχρι την αποκατάσταση της κανονικής κυκλοφορίας.
4. Ο οδηγός οχήματος υποχρεούται να μην παρεμποδίζει την ομαλή πορεία άλλων οχημάτων κινούμενος με ασυνήθη βραδύτητα, χωρίς αποχρώντα λόγο.
5. Απαγορεύεται στους οδηγούς οχημάτων να συναγωνίζονται μεταξύ τους στην ταχύτητα.
6. Στην τήρηση των πιο πάνω διατάξεων υποχρεούνται και οι οδηγοί ζώων έλξης, φορτίου ή ιππασίας.
7. Ο οδηγός οχήματος, το οποίο κινείται πίσω από άλλο, υποχρεούται να τηρεί αρκετή απόσταση για την αποφυγή σύγκρουσης αν, το προ αυτού κινούμενο όχημα, μειώσει ξαφνικά την ταχύτητά του ή διακόψει την πορεία του.
8. Εκτός των κατοικημένων περιοχών, για τη διευκόλυνση της προσπέρασης, οι οδηγοί οχημάτων, για τα οποία επιβάλλεται περιορισμός ταχύτητας, ή συνδυασμού οχημάτων συνολικού μήκους πάνω από επτά (7) μέτρα, υποχρεούνται, εκτός των περιπτώσεων κατά τις οποίες ή προσπερνούν ή ετοιμάζονται να προσπεράσουν, να τηρούν αρκετή απόσταση από τα προ αυτών κινούμενα μηχανοκίνητα οχήματα, ώστε τα άλλα οχήματα που τους προσπερνούν να μπορούν ακίνδυνα να κινηθούν στον εμπρόσθιο χώρο του οχήματός τους.
9. Η παρ. 8 δεν έχει εφαρμογή:
α) όταν η κυκλοφορία είναι πυκνή,
β) σε περιπτώσεις που απαγορεύεται η προσπέραση,
γ) στις οδούς οι οποίες έχουν δύο (2) ή περισσότερες λωρίδες κυκλοφορίας, κατά την κατεύθυνση των οχημάτων,
δ) όταν πρόκειται για φάλαγγα ενόπλων δυνάμεων.
10. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α, με εξαίρεση την παράβαση της παρ. 5 που κατατάσσεται στην κατηγορία Ε4 και επιβάλλονται στον παραβάτη διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της επιτόπου αφαίρεσης της άδειας οδήγησης για ένα (1) έτος.`},
  24: {title:`Ταχύτητα κυκλοφορίας`,text:`Όρια ταχύτητας, αρμοδιότητα καθορισμού τους, έλεγχος τήρησής τους, κατηγορίες παραβάσεων και κυρώσεις για μη τήρηση ορίων ταχύτητας, ελλιπή εξοπλισμό επαγγελματικών οχημάτων και παρεμβάσεις σε αυτόν, κατοχή μηχανισμών παρεμπόδισης ελέγχου ταχύτητας, μη ορθή χρήση Ελαφρού Προσωπικού Ηλεκτρικού Οχήματος
1. Το ανώτατο επιτρεπόμενο όριο ταχύτητας, μέσα στις κατοικημένες περιοχές, ορίζεται σε τριάντα (30) χιλιόμετρα την ώρα. Σε μονόδρομους στους οποίους υπάρχουν δύο (2) τουλάχιστον λωρίδες κυκλοφορίας, διαχωριζόμενες με κατά μήκος διαγραμμίσεις, και σε οδούς διπλής κατεύθυνσης με τουλάχιστον δύο (2) λωρίδες ανά κατεύθυνση, διαχωριζόμενες με κατά μήκος διαγραμμίσεις, και σε οδούς διπλής κατεύθυνσης με διαχωριστική νησίδα, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε πενήντα (50) χιλιόμετρα την ώρα. Τα όρια ταχύτητας της παρούσας εφαρμόζονται, εφόσον δεν ορίζεται διαφορετικά με ειδική σήμανση, κατά τα προβλεπόμενα στην περ. γ) της παρ. 7 του άρθρου 112, περί εξουσιοδοτικών διατάξεων.
2. Εκτός κατοικημένων περιοχών τα ανώτατα επιτρεπόμενα όρια ταχύτητας, για τις διάφορες κατηγορίες αυτοκίνητων οχημάτων και των συνδυασμών αυτών, ορίζονται στον παρακάτω πίνακα:
3. Σε μη ασφαλτοστρωμένους δρόμους εκτός κατοικημένων περιοχών, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε σαράντα (40) χιλιόμετρα την ώρα, εκτός αν άλλως ορίζεται με ειδική σήμανση.
4. Για τα φορτηγά αυτοκίνητα που μεταφέρουν πρόσωπα, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε τριάντα (30) χιλιόμετρα την ώρα μέσα σε κατοικημένες περιοχές και σε πενήντα (50) χιλιόμετρα την ώρα έξω από αυτές.
5. Για τα μοτοποδήλατα το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε σαράντα πέντε (45) χιλιόμετρα την ώρα με την επιφύλαξη της παρ. 1. Για τα αγροτικά μηχανήματα και τα μηχανήματα έργου, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε σαράντα (40) χιλιόμετρα την ώρα με την επιφύλαξη της παρ. 1. Ειδικώς αν τα αγροτικά μηχανήματα, τα μηχανήματα έργου ή τα ρυμουλκούμενα από αυτά στερούνται ελαστικών με αεροθάλαμο, το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε δεκαπέντε (15) χιλιόμετρα την ώρα.
6. Για τα Ε.Π.Η.Ο. το ανώτατο επιτρεπόμενο όριο ταχύτητας ορίζεται σε είκοσι πέντε (25) χιλιόμετρα την ώρα. Τα Ε.Π.Η.Ο. απαγορεύεται να κυκλοφορούν σε οδούς όπου το ανώτατο επιτρεπόμενο όριο ταχύτητας των αυτοκίνητων οχημάτων υπερβαίνει τα πενήντα (50) χιλιόμετρα την ώρα.
7. Στα φορτηγά αυτοκίνητα, στα ρυμουλκούμενα από αυτά και στα λεωφορεία αυτοκίνητα αναγράφεται στο οπίσθιο μέρος του αμαξώματός τους, με στοιχεία ύψους δεκαπέντε (15) εκατοστών μαύρου χρώματος σε άσπρη κυκλική επιφάνεια, ο αριθμός των χιλιομέτρων την ώρα του επιτρεπόμενου ανώτατου ορίου ταχύτητάς τους.
8. Ο έλεγχος της ταχύτητας των οδικών οχημάτων μπορεί να γίνεται από τις αρμόδιες αστυνομικές αρχές και με ειδικές ηλεκτρονικές τεχνικές συσκευές ή με άλλα τεχνικά μέσα.
9.
α) Με την επιφύλαξη της περ. β), η παράβαση της υπέρβασης του ανώτατου ορίου ταχύτητας:
αα) έως είκοσι (20) χιλιόμετρα την ώρα, κατατάσσεται στην κατηγορία Ε2-Α,
αβ) πάνω από είκοσι (20) χιλιόμετρα την ώρα έως και τριάντα (30) χιλιόμετρα την ώρα, κατατάσσεται στην κατηγορία Ε2-Β,
αγ) πάνω από τριάντα (30) χιλιόμετρα την ώρα έως και πενήντα (50) χιλιόμετρα την ώρα κατατάσσεται στην κατηγορία Ε3-Β.
β) Με την επιφύλαξη των περ. γ) και δ), κατατάσσονται στην κατηγορία Ε3-Β οι παραβάσεις της κίνησης οχημάτων:
βα) στους αυτοκινητόδρομους με ταχύτητα πάνω από εκατόν πενήντα (150) χιλιόμετρα την ώρα,
ββ) στις οδούς ταχείας κυκλοφορίας με ταχύτητα πάνω από εκατόν τριάντα (130) χιλιόμετρα την ώρα,
βγ) στο υπόλοιπο οδικό δίκτυο με ταχύτητα πάνω από εκατόν είκοσι (120) χιλιόμετρα την ώρα.
γ) Με την επιφύλαξη της περ. δ), η παράβαση της υπέρβασης του ανώτατου ορίου ταχύτητας πάνω από πενήντα (50) χιλιόμετρα την ώρα κατατάσσεται στην κατηγορία Ε4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ και το διοικητικό μέτρο της επιτόπου αφαίρεσης της άδειας οδήγησης για εξήντα (60) ημέρες.
δ) Η παράβαση της οδήγησης με ταχύτητα ανώτερη των διακοσίων (200) χιλιομέτρων την ώρα κατατάσσεται στην κατηγορία Ε4 και στον επιβάτη επιβάλλονται διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της επί τόπου αφαίρεσης της άδειας οδήγησης για ένα (1) έτος.
ε) Η παράβαση της οδήγησης με ταχύτητα κατώτερη του ελάχιστου επιτρεπόμενου ορίου ταχύτητας και η παράβαση της παρ. 7 κατατάσσονται στην κατηγορία Ε1-Α.
10. Η παράβαση της θέσης σε κυκλοφορία και της οδήγησης αυτοκίνητου οχήματος χωρίς να είναι εφοδιασμένο με τις συσκευές της περ. στ) της παρ. 7 του άρθρου 112, καθώς και η παράβαση της παράλειψης τοποθέτησης του φύλλου ή άλλου συστήματος καταγραφής ταχογράφου κατατάσσονται στην κατηγορία Ε3-Β. Στην ίδια κατηγορία κατατάσσονται και οι παραβάσεις επενέργειας με οποιονδήποτε τρόπο στον μηχανισμό της ανωτέρω συσκευής, με σκοπό να την καταστήσει ανενεργή ή να αλλοιωθούν οι καταγραφόμενες ενδείξεις. Εάν αμφισβητηθεί από τον οδηγό η παράβαση, το όχημα μεταφέρεται, συνοδεία αστυνομικού, στην αρμόδια για τη διενέργεια ελέγχου υπηρεσία της οικείας Περιφερειακής Ενότητας. Για τις ως άνω παραβάσεις που αφορούν σε φορτηγά οχήματα εφαρμόζεται ο ν. 3446/2006 (Α’ 49).
11. Η παράβαση της οδήγησης μηχανοκίνητου οχήματος με εξοπλισμό εντοπισμού συσκευών μέτρησης ταχύτητας, καθώς και της οδήγησης μηχανοκίνητου οχήματος με εξοπλισμό παρεμπόδισης συσκευών μέτρησης ταχύτητας κατατάσσεται στην κατηγορία Ε3-Β.
12. Ειδικά για τα Ε.Π.Η.Ο.:
α) η οδήγηση κατά παράβαση του πρώτου εδαφίου της παρ. 6:
αα) με ταχύτητα έως και τριάντα πέντε (35) χιλιόμετρα την ώρα, κατατάσσεται στην κατηγορία Ε1-Α και η θέση του σε κυκλοφορία κατατάσσεται στην κατηγορία Ε2-Α,
αβ) με ταχύτητα άνω των τριάντα πέντε (35) χιλιομέτρων την ώρα κατατάσσεται στην κατηγορία Ε2-Α και η θέση του σε κυκλοφορία κατατάσσεται στην κατηγορία Ε3-Α,
β) η οδήγηση κατά παράβαση του δεύτερου εδαφίου της παρ. 6 κατατάσσεται στην κατηγορία Ε1-Α.`},
  25: {title:`Κανόνες για τους ελιγμούς των οχημάτων`,text:`Κανόνες για τους ελιγμούς των οχημάτων
1. Ο οδηγός που προτίθεται να εκτελέσει ελιγμό, οφείλει προηγουμένως να βεβαιωθεί ότι μπορεί να το πράξει χωρίς κίνδυνο ή παρακώλυση των λοιπών χρηστών της οδού, οι οποίοι κινούνται πίσω, μπροστά ή πλάι του, ή ετοιμάζονται να τον προσπεράσουν, λαμβάνοντας υπόψη τη θέση, την κατεύθυνση και την ταχύτητά τους.
2. Πριν από κάθε ελιγμό, ο οδηγός υποχρεούται να καταστήσει έγκαιρα γνωστή την πρόθεσή του αυτή, χρησιμοποιώντας για τον σκοπό αυτό τους δείκτες κατεύθυνσης, αν δε αυτοί δεν λειτουργούν, υποχρεούται να δώσει τα ακόλουθα σήματα με το χέρι:
α) Έκταση του βραχίονα για στροφή προς την κατεύθυνση αυτού,
β) κάμψη του βραχίονα προς τα πάνω για στροφή προς την αντίθετη πλευρά αυτού,
γ) κάμψη του βραχίονα προς τα κάτω, για τον ελιγμό στάθμευσης.
3. Η προειδοποίηση που δίνεται με τους δείκτες κατεύθυνσης επιβάλλεται να συνεχίζεται σε όλη τη διάρκεια του ελιγμού και να παύει όταν ολοκληρωθεί ο ελιγμός.
4. H παράβαση των παρ. 1 έως 3 κατατάσσεται στην κατηγορία Ε1-Β, πλην της παράβασης για αυτόν που επιχειρεί στην οδό συνεχείς ή διακεκομμένους ελιγμούς και κίνηση που εγκυμονεί κίνδυνο για τους λοιπούς χρήστες της οδού, που κατατάσσεται στην κατηγορία Ε3-Β.`},
  26: {title:`Κίνηση προς τα πίσω`,text:`Κίνηση προς τα πίσω
1. Απαγορεύεται η προς τα πίσω κίνηση των οχημάτων, με εξαίρεση τις περιπτώσεις κατά τις οποίες η προς τα μπρος κίνηση είναι αδύνατη ή γίνεται ελιγμός στάθμευσης, καθώς και στις περιπτώσεις εκπαίδευσης και εξέτασης υποψήφιων οδηγών, σύμφωνα με τα προβλεπόμενα από τις εκάστοτε ισχύουσες διατάξεις. Ο ελιγμός στάθμευσης επιτρέπεται να εκτελείται στην ίδια οδό και σε μήκος όχι μεγαλύτερο του διπλάσιου μήκους του οχήματος.
2. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε1-Α.`},
  27: {title:`Αλλαγή κατεύθυνσης`,text:`Αλλαγή κατεύθυνσης
1. Ο οδηγός, προκειμένου να αλλάξει κατεύθυνση προς τα δεξιά, κινείται έγκαιρα προς το δεξιό άκρο του οδοστρώματος και πραγματοποιεί τη στροφή κατά το δυνατόν κλειστή.
2. Προκειμένου ο οδηγός να αλλάξει κατεύθυνση προς τα αριστερά, πλησιάζει προοδευτικά προς τον άξονα του οδοστρώματος, αν είναι διπλής κατεύθυνσης και προς το αριστερό άκρο αυτού, αν είναι μονής κατεύθυνσης (μονόδρομος). Για να εισέλθει στην κάθετη οδό, πραγματοποιεί τη στροφή στο κέντρο της διασταύρωσης, ώστε το όχημα να εισέλθει στη δεξιά πλευρά του οδοστρώματος αυτής της οδού. Κατά την κίνηση αυτή ο οδηγός επιτρέπει τη διέλευση των οχημάτων που κινούνται αντίθετα στο οδόστρωμα που πρόκειται να εγκαταλείψει.
3. Αν ο οδηγός κατά την αλλαγή της κατεύθυνσης, πρόκειται να διασχίσει ειδική λωρίδα που προορίζεται για την κίνηση των μέσων μαζικής μεταφοράς, ποδηλάτων ή μοτοποδηλάτων, παραχωρεί προτεραιότητα σε αυτά.
4. Στις παρ. 1 και 2 και εφόσον ο οδηγός που προτίθεται να αλλάξει κατεύθυνση καταστήσει γνωστή την πρόθεσή του αυτή, σύμφωνα με τις παρ. 2 και 3 του άρθρου 25, περί κανόνων για τους ελιγμούς οχημάτων, οι οδηγοί που τον ακολουθούν και κινούνται στις παρακείμενες λωρίδες, τον διευκολύνουν με τη μείωση της ταχύτητας του οχήματός τους, ενώ αυτός δεν αλλάζει κατεύθυνση, αν δεν μπορεί να το πράξει με ασφάλεια.
5. Οι παραβάσεις των παρ. 1, 2 και 4 κατατάσσονται στην κατηγορία Ε1-Β. Η παράβαση της παρ. 3 κατατάσσεται στην κατηγορία Ε1-Α και στην κατηγορία Σ.`},
  28: {title:`Επιβράδυνση`,text:`Επιβράδυνση
1. Απαγορεύεται η απότομη τροχοπέδηση, εκτός αν την επιβάλλουν λόγοι ασφάλειας.
2. Με εξαίρεση την περίπτωση που η μείωση της ταχύτητας γίνεται για την αποτροπή επικείμενου κινδύνου, ο οδηγός μπορεί να επιβραδύνει σε σημαντικό βαθμό την κίνηση του οχήματός του, μόνο αν αυτό δεν προκαλεί κίνδυνο ή δυσχέρεια στους άλλους οδηγούς και μετά από προηγούμενη πάντοτε σαφή και έγκαιρη προειδοποίηση. Η προειδοποίηση δίνεται με τα φώτα πέδησης ή με χρήση φωτεινού συναγερμού του οχήματος ή με το χέρι (έκταση του βραχίονα και συνεχής κίνηση αυτού προς τα πάνω και κάτω).
3. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α.`},
  29: {title:`Ειδικοί κανόνες για τα οχήματα των δημόσιων συγκοινωνιών`,text:`Ειδικοί κανόνες για τα οχήματα των δημόσιων συγκοινωνιών
1. Για τη διευκόλυνση της κίνησης των οχημάτων δημόσιων συγκοινωνιών (μαζικής μεταφοράς επιβατών) μέσα στις κατοικημένες περιοχές, οι οδηγοί των άλλων οχημάτων, εφόσον δεν προκαλείται κίνδυνος, μειώνουν την ταχύτητά τους και σε ανάγκη διακόπτουν την πορεία τους, για να επιτρέπουν στα οχήματα αυτά να εκτελέσουν τον αναγκαίο ελιγμό για την εκκίνηση από τις καθορισμένες στάσεις.
2. Στις περιπτώσεις της παρ. 1, οι οδηγοί των οχημάτων δημόσιων συγκοινωνιών δεν απαλλάσσονται από την υποχρέωση να προειδοποιήσουν με τους δείκτες κατεύθυνσης των οχημάτων τους για την πρόθεσή τους να εκκινήσουν και να λάβουν τις αναγκαίες προφυλάξεις για την αποφυγή κάθε κινδύνου.
3. Για την επιβίβαση ή αποβίβαση επιβατών οι οδηγοί των οχημάτων δημόσιων συγκοινωνιών πλησιάζουν, κατά το δυνατόν, το άκρο του οδοστρώματος.
4. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α και στην κατηγορία Σ.`},
  30: {title:`Ισόπεδοι οδικοί κόμβοι και υποχρέωση παραχώρησης προτεραιότητας`,text:`Ισόπεδοι οδικοί κόμβοι και υποχρέωση παραχώρησης προτεραιότητας
1. Ο οδηγός που πλησιάζει σε ισόπεδο οδικό κόμβο καταβάλλει ιδιαίτερη προσοχή για να μην προκαλέσει επί του κόμβου κίνδυνο ή παρακώλυση της κυκλοφορίας, ρυθμίζοντας την ταχύτητα του οχήματός του, ώστε να μπορεί να διακόψει την πορεία αυτού, για να διέλθουν τα οχήματα που έχουν προτεραιότητα.
2. Ο οδηγός απαγορεύεται να εισέρχεται στον κόμβο, έστω και αν οι τυχόν υπάρχοντες φωτεινοί σηματοδότες το επιτρέπουν, όταν η πυκνότητα της κυκλοφορίας είναι τέτοια ώστε να ενδέχεται να υποχρεωθεί να παραμείνει στη διασταύρωση.
3. Ο οδηγός που έχει εισέλθει στον κόμβο όπου η κυκλοφορία ρυθμίζεται με φωτεινούς σηματοδότες, μπορεί να εξέλθει αυτού και πριν δοθεί το σήμα ελεύθερης κυκλοφορίας προς την κατεύθυνση την οποία θα ακολουθήσει, αν δεν παρεμποδίζεται εκ τούτου η διέλευση των λοιπών οχημάτων που χρησιμοποιούν την οδό και κινούνται προς την ανοικτή κατεύθυνση.
4. Στους κόμβους, η προτεραιότητα ορίζεται με κατάλληλη σήμανση.
5. Στους κόμβους χωρίς τέτοια σήμανση, η προτεραιότητα ανήκει σε αυτόν που έρχεται από τα δεξιά. Κατ’ εξαίρεση:
α) Αυτοί που κυκλοφορούν στους αυτοκινητόδρομους, εθνικές οδούς και οδούς ταχείας κυκλοφορίας έχουν προτεραιότητα.
β) Αυτοί που εισέρχονται σε οδό από πεζόδρομο, χωματόδρομο, μονοπάτια, παρόδιο ιδιοκτησία, χώρο στάθμευσης και σταθμούς ανεφοδιασμού και εξυπηρέτησης παραχωρούν προτεραιότητα σε αυτούς που κινούνται στην οδό.
γ) Αυτοί που εκκινούν ή κινούνται προς τα πίσω, όπου αυτό επιτρέπεται, παραχωρούν προτεραιότητα.
δ) Τα τροχιοδρομικά οχήματα έχουν προτεραιότητα.
ε) Τα σιδηροδρομικά οχήματα έχουν προτεραιότητα.
6. Οι ενδείξεις των φωτεινών σηματοδοτών κυκλοφορίας υπερισχύουν των ενδείξεων των πινακίδων σήμανσης, οι οποίες καθορίζουν την προτεραιότητα.
7. Οι παραβάσεις των παρ. 1 έως 6 κατατάσσονται στην κατηγορία Ε3-Β. Εξαιρούνται οι παραβάσεις της περ. δ) της παρ. 5, που κατατάσσεται στην κατηγορία Ε3-Β και στην κατηγορία Σ και της περ. ε) της παρ. 5, που κατατάσσεται στην κατηγορία Ε4 και επιβάλλεται πρόστιμο χιλίων διακοσίων (1.200) ευρώ και επί τόπου αφαίρεση της άδειας οδήγησης για εξήντα (60) ημέρες.
8. Επιπλέον των διοικητικών κυρώσεων της παρ. 7, οι παραβάσεις της περ. ε) της παρ. 5 τιμωρούνται με ποινή φυλάκισης τουλάχιστον ενός (1) έτους και χρηματική ποινή έως δύο χιλιάδες (2.000) ευρώ, εφόσον η πράξη δεν τιμωρείται βαρύτερα σύμφωνα με το άρθρο 291 του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95) ή από άλλη ποινική διάταξη.`},
  31: {title:`Ισόπεδες σιδηροδρομικές διαβάσεις`,text:`Ισόπεδες σιδηροδρομικές διαβάσεις
1. Αυτοί που χρησιμοποιούν τις οδούς καταβάλλουν ιδιαίτερη προσοχή, όταν πλησιάζουν ή διασχίζουν σιδηροδρομικές διαβάσεις, και τηρούν τους εξής κανόνες:
α) Ο οδηγός οχήματος μειώνει την ταχύτητα του οχήματός του προ των πινακίδων αναγγελίας κινδύνου Κ-31 έως Κ-35.
β) Προ ισόπεδης σιδηροδρομικής διάβασης, χωρίς λειτουργούντα κινητά φράγματα ή λειτουργούσα φωτεινή σηματοδότηση, που επισημαίνεται με πινακίδες υποχρεωτικής διακοπής πορείας Ρ-2 και πλησίον σιδηροδρομικής διάβασης με πινακίδα Κ-36 ή Κ-37, ο οδηγός διακόπτει την πορεία του στην ειδική προς τούτο γραμμή ή, σε περίπτωση που δεν υπάρχει τέτοια, στη θέση που βρίσκονται οι πινακίδες και δεν εκκινεί, αν δεν βεβαιωθεί ότι δεν πλησιάζει σιδηροδρομικός συρμός.
γ) Προ ισόπεδης σιδηροδρομικής διάβασης, που επισημαίνεται με φωτεινή σηματοδότηση, με κινητά φράγματα που λειτουργούν αυτόματα, ο χρήστης της οδού, μπροστά από ερυθρό φως που αναβοσβήνει ή μπροστά από δύο (2) τέτοια φώτα τα οποία αναβοσβήνουν διαδοχικά, διακόπτει την πορεία προ της ειδικής γραμμής ή, αν δεν υπάρχει τέτοια, προ του σηματοδότη. Την ίδια υποχρέωση έχει και στην περίπτωση ηχητικού σήματος που εκπέμπει συσκευή εγκατεστημένη στη διάβαση.
δ) Αυτοί που χρησιμοποιούν την οδό δεν εισέρχονται σε ισόπεδη σιδηροδρομική διάβαση, όταν τα κινητά φράγματα έχουν κλείσει την οδό και κατά τον χρόνο που αυτά ανεβαίνουν ή κατεβαίνουν.
ε) Αυτός που διασχίζει ισόπεδη σιδηροδρομική διάβαση κινείται χωρίς καθυστέρηση.
στ) Ο οδηγός δεν εισέρχεται σε ισόπεδη σιδηροδρομική διάβαση, χωρίς προηγουμένως να βεβαιωθεί ότι δεν θα υποχρεωθεί να ακινητοποιηθεί πάνω σε αυτή. Σε περίπτωση αναγκαστικής ακινητοποίησης του οχήματος πάνω στις σιδηροτροχιές, κατά τον χρόνο που διέρχεται την ισόπεδη σιδηροδρομική διάβαση, ο οδηγός και οι λοιποί χρήστες της οδού πλησίον της διάβασης το μετακινούν και, αν δεν μπορούν, ειδοποιούν αμέσως και με κάθε τρόπο τους μηχανοδηγούς των σιδηροδρομικών οχημάτων για τον κίνδυνο.
2. Οι παραβάσεις των περ. α),
ε) και
στ) της παρ. 1 κατατάσσονται στην κατηγορία Ε1-Β. Οι παραβάσεις των περ. β),
γ) και
δ) της παρ. 1 κατατάσσονται στην κατηγορία Ε4 και τιμωρούνται με διοικητικό πρόστιμο χιλίων διακοσίων (1.200) ευρώ και με επί τόπου αφαίρεση της άδειας οδήγησης για εξήντα (60) ημέρες. Επιπλέον των διοικητικών κυρώσεων του προηγούμενου εδαφίου, οι παραβάσεις των περ. β),
γ) και
δ) της παρ. 1 τιμωρούνται με ποινή φυλάκισης τουλάχιστον ενός (1) έτους και χρηματική ποινή έως δύο χιλιάδες (2.000) ευρώ εφόσον η πράξη δεν τιμωρείται βαρύτερα σύμφωνα με το άρθρο 291 του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95) ή από άλλη ποινική διάταξη.`},
  32: {title:`Τροχιοδρομικά οχήματα που κινούνται σε σιδηροτροχιές`,text:`Τροχιοδρομικά οχήματα που κινούνται σε σιδηροτροχιές
1. Όπου επί οδοστρωμάτων κινούνται τροχιοδρομικά οχήματα, αυτοί που χρησιμοποιούν την οδό, αφήνουν ελεύθερη τη σιδηροτροχιά, όταν αυτά πλησιάζουν, για να επιτρέπουν το πέρασμά τους.
2. Η προσπέραση των κινούμενων τροχιοδρομικών οχημάτων ή αυτών που βρίσκονται σε στάση γίνεται από τα δεξιά. Αν αυτό είναι αδύνατο λόγω έλλειψης χώρου, η διέλευση ή η προσπέραση μπορεί να γίνει και από τα αριστερά, αν δεν προκαλούνται κίνδυνοι ή δυσχέρειες γι’ αυτούς που έρχονται αντίθετα. Στους μονόδρομους η προσπέραση των τροχιοδρομικών οχημάτων μπορεί να γίνει και από τα αριστερά, αν οι συνθήκες της κυκλοφορίας το επιτρέπουν.
3. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε2-Β και στην κατηγορία Σ.`},
  33: {title:`Κίνηση οχημάτων σε αυτοκινητόδρομους, οδούς ταχείας κυκλοφορίας και σήραγγες`,text:`Κίνηση οχημάτων σε αυτοκινητόδρομους, οδούς ταχείας κυκλοφορίας και σήραγγες
1. Στους αυτοκινητόδρομους και στις οδούς ταχείας κυκλοφορίας, οι οποίες διακρίνονται από τις ειδικές πινακίδες σήμανσης και στις οδούς εισόδου και εξόδου εξ αυτών, απαγορεύεται η κυκλοφορία πεζών, εφίππων, ζώων, ποδηλάτων, ζωηλάτων οχημάτων και γενικά οχημάτων τα οποία δεν κινούνται με κινητήρα, καθώς και μηχανοκίνητων οχημάτων, τα οποία εκ κατασκευής ή από άλλη αιτία, δεν μπορούν να αναπτύξουν σε οριζόντια οδό ταχύτητα μεγαλύτερη των εβδομήντα (70) χιλιομέτρων την ώρα, με την επιφύλαξη ειδικότερων διατάξεων.
2. Στις πιο πάνω οδούς απαγορεύεται:
α) Η πραγματοποίηση επιτόπιας στροφής, δηλαδή αναστροφής εκατόν ογδόντα (180ο) μοιρών,
β) η οπισθοπορεία και
γ) η οδήγηση οχημάτων στην κεντρική διαχωριστική λωρίδα, συμπεριλαμβανομένων και των επ’ αυτής σημείων σύνδεσης των δύο οδοστρωμάτων.
3. Αν όχημα ακινητοποιηθεί αναγκαστικά επί του οδοστρώματος από βλάβη ή άλλη αιτία, ο οδηγός του καταβάλλει κάθε προσπάθεια να το μετακινήσει εκτός του οδοστρώματος και, αν δεν μπορεί, τοποθετεί αμέσως την τριγωνική πινακίδα της παρ. 16 του άρθρου 85, περί μηχανισμών, εξαρτημάτων και συσκευών οχημάτων σε απόσταση εκατό (100) τουλάχιστον μέτρων πίσω από το όχημα ή την ειδική προειδοποιητική συσκευή σε κατάλληλη θέση και κατά τη νύχτα έχει αναμμένα τα φώτα θέσης. Αν το όχημα εξαιτίας βλάβης ρυμουλκείται στον αυτοκινητόδρομο ή την οδό ταχείας κυκλοφορίας, εξέρχεται αυτών στην πρώτη έξοδο.
4. Σε αυτοκινητόδρομους ή οδούς ταχείας κυκλοφορίας τριών (3) ή περισσότερων λωρίδων κυκλοφορίας προς την αυτή κατεύθυνση απαγορεύεται στους οδηγούς των φορτηγών αυτοκινήτων, μέγιστου επιτρεπόμενου βάρους άνω των τριών κόμμα πέντε (3,5) τόνων, των λεωφορείων ή των συνδυασμών οχημάτων (συρμών), μήκους μεγαλύτερου των επτά (7) μέτρων, να καταλαμβάνουν άλλη λωρίδα, εκτός των δύο (2) πλησιέστερων προς το δεξιό άκρο του οδοστρώματος. Η ακραία αριστερή λωρίδα χρησιμοποιείται από επιβατηγά οχήματα ή μοτοσικλέτες ως λωρίδα προσπέρασης και καθίσταται και αυτή λωρίδα κυκλοφορίας, εφόσον οι υπόλοιπες λωρίδες τελούν υπό καθεστώς κυκλοφοριακής συμφόρησης.
5. Οι οδηγοί που εισέρχονται σε αυτοκινητόδρομο ή οδό ταχείας κυκλοφορίας:
α) Αν η οδός εισόδου δεν συνεχίζεται με λωρίδα επιτάχυνσης, παραχωρούν προτεραιότητα στα κινούμενα οχήματα επί του αυτοκινητόδρομου ή της οδού ταχείας κυκλοφορίας.
β) Αν υπάρχει λωρίδα επιτάχυνσης, χρησιμοποιούν αυτήν και, καθώς εισέρχονται στον αυτοκινητόδρομο ή την οδό ταχείας κυκλοφορίας, τηρούν το άρθρο 25, περί κανόνων για τους ελιγμούς των οχημάτων.
6. Ο οδηγός που εξέρχεται από αυτοκινητόδρομο ή οδό ταχείας κυκλοφορίας καταλαμβάνει έγκαιρα τη λωρίδα κυκλοφορίας που αντιστοιχεί στην έξοδο του αυτοκινητόδρομου ή της οδού ταχείας κυκλοφορίας και εισέρχεται το ταχύτερο στη λωρίδα επιβράδυνσης, αν υπάρχει τέτοια.
7. Απαγορεύονται σε κάθε περίπτωση η δημιουργία και η χρήση πρόσβασης προς ή από αυτοκινητοδρόμους και οδούς ταχείας κυκλοφορίας, για την εξυπηρέτηση παρόδιων ιδιοκτησιών.
8. Σε σήραγγες που υποδεικνύονται από ειδικές πινακίδες:
α) οι οδηγοί απαγορεύεται:
αα) να πραγματοποιούν οπισθοπορεία,
αβ) να πραγματοποιούν επιτόπια στροφή, δηλαδή αναστροφή εκατόν ογδόντα μοιρών (180ο),
αγ) να σταθμεύουν στις ειδικές διαπλατύνσεις, εκτός των περιπτώσεων έκτακτων οδικών συμβάντων.
β) οι οδηγοί:
βα) ακόμα και αν η σήραγγα είναι φωτισμένη, ανάβουν τα φώτα διασταύρωσης ή τα φώτα πορείας,
ββ) σε περίπτωση παρατεταμένης ακινητοποίησης, σβήνουν τη μηχανή του οχήματός τους,
βγ) συμμορφώνονται με τα ηλεκτρονικά μέσα σήμανσης και τις οδηγίες που δίδονται σε αυτούς από τα κέντρα ελέγχου σήραγγας μέσω μεγαφώνου ή ραδιοφώνου.
9. Η Λ.Ε.Α. προορίζεται αποκλειστικά για την κίνηση οχημάτων άμεσης ανάγκης και οχημάτων συντήρησης των αρμόδιων κρατικών υπηρεσιών ή των εταιρειών που, κατά παραχώρηση από το Δημόσιο, λειτουργούν, συντηρούν και εκμεταλλεύονται αυτοκινητόδρομο ή οδό ταχείας κυκλοφορίας, για την αντιμετώπιση έκτακτων γεγονότων, περιστατικών ή άλλων αναγκών. Οποιαδήποτε άλλη χρήση των λωρίδων έκτακτης ανάγκης, εξαιρουμένων των περιπτώσεων της παρ. 3, απαγορεύεται.
10. Απαγορεύεται η κυκλοφορία οχημάτων σε αυτοκινητοδρόμους, οδούς ταχείας κυκλοφορίας, σήραγγες και γέφυρες που διακρίνονται με ειδικές πινακίδες σήμανσης χωρίς την καταβολή διοδίου τέλους, όταν προβλέπεται η καταβολή αυτή. Για την καταβολή του διοδίου τέλους είναι υπόχρεοι εις ολόκληρον ο κύριος και ο οδηγός του οχήματος. Εάν το όχημα ανήκει σε επιχείρηση ενοικίασης και είναι μισθωμένο, ως υπόχρεος λογίζεται ο μισθωτής που προκύπτει από το μισθωτήριο συμβόλαιο. Η βεβαίωση της παράβασης γίνεται από τα αρμόδια αστυνομικά όργανα που τη διαπιστώνουν αυτοπροσώπως ή μέσω τεχνικών ή ηλεκτρονικών μέσων, σύμφωνα με την παρ. 4 του άρθρου 107, περί επιβολής διοικητικών προστίμων από αστυνομικά όργανα.
11. Η παράβαση της παρ. 10 κατατάσσεται στην κατηγορία Ε2-Α. Η παράβαση της παρ. 9 κατατάσσεται στην κατηγορία Ε2-Α και στην κατηγορία Σ. Οι παραβάσεις των περ. α) και
β) της παρ. 2, του πρώτου εδαφίου της παρ. 4 και των περ. α) και
β) της παρ. 8 κατατάσσονται στην κατηγορία Ε3-Β. Οι λοιπές παραβάσεις του άρθρου με την επιφύλαξη της παρ. 12, κατατάσσονται στην κατηγορία Ε2-Β. Οι παραβάσεις της περ. α) της παρ. 2 κατατάσσονται στην κατηγορία Ε-4 και στον παραβάτη επιβάλλονται διοικητικό πρόστιμο επτακοσίων (700) ευρώ και επί τόπου αφαίρεση της άδειας οδήγησης για εξήντα (60) ημέρες, αν η μη συμμόρφωση είχε ως αποτέλεσμα την πρόκληση τροχαίου ατυχήματος. Αν ο οδηγός γίνει υπαίτιος τροχαίου ατυχήματος, με το οποίο επήλθε σημαντική βλάβη σε κοινωφελείς εγκαταστάσεις ή βαριά σωματική βλάβη ή θάνατος ή θάνατοι μεγάλου αριθμού ανθρώπων επιβάλλονται οι ποινές των περ. γγ) και
δδ) της παρ. 1 του άρθρου 290Α του Ποινικού Κώδικα (ν. 4619/2019, Α’ 95).
12. Η παράβαση της παρ. 7 τιμωρείται με ποινή φυλάκισης έως δώδεκα (12) μήνες ή με χρηματική ποινή. Η χρήση της πρόσβασης που έχει δημιουργηθεί κατά παράβαση της παρ. 7, συνιστά παράβαση που κατατάσσεται στην κατηγορία Ε2-Α.`},
  34: {title:`Άνοιγμα των θυρών οχημάτων`,text:`Άνοιγμα των θυρών οχημάτων
1. Απαγορεύεται σε όλους να ανοίγουν ή να αφήνουν τις πόρτες οχήματος ανοικτές ή να εισέρχονται/εξέρχονται αυτού, αν προηγουμένως δεν βεβαιωθούν ότι, από τις ενέργειές τους, δεν προκαλείται κίνδυνος στους χρήστες της οδού.
2. Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε1-Α.`},
  35: {title:`Εμπόδια στο οδόστρωμα`,text:`Εμπόδια στο οδόστρωμα
1. Με την επιφύλαξη του άρθρου 20, περί θέσης επί της οδού, οι οδηγοί επιτρέπεται να διέρχονται από την αριστερή ή δεξιά πλευρά κάθε κατασκευής, νησίδας, στύλου, πασσάλου, μνημείου, έργου ή συσκευής που βρίσκονται στο οδόστρωμα και τα οποία αποτελούν εμπόδιο για την κατευθείαν κίνηση των οχημάτων, εκτός αν, με πινακίδες σήμανσης, ορίζεται η πλευρά στην οποία υποχρεούνται να κινηθούν.
2. Αν εμπόδιο από αυτά της παρ. 1 βρίσκεται στον άξονα οδοστρώματος διπλής κατεύθυνσης, οι οδηγοί διέρχονται από τη δεξιά πλευρά αυτού.
3. Η παράβαση του παρόντος κατατάσσεται στην κατηγορία Ε1-Α.`},
  36: {title:`Φόρτωση οχημάτων`,text:`Φόρτωση οχημάτων
1. Η μάζα του φορτωμένου οχήματος δεν υπερβαίνει τη μέγιστη αποδεκτή μάζα του φορτωμένου οχήματος που καθορίζεται από την ισχύουσα νομοθεσία για την κατηγορία του οχήματος ή τον συνδυασμό οχημάτων.
2. Οι φορτίσεις των αξόνων των φορτωμένων οχημάτων δεν υπερβαίνουν:
α) τις μέγιστα τεχνικά επιτρεπόμενες φορτίσεις που καθορίζονται από τον κατασκευαστή τους ανάλογα με την τεχνική διαμόρφωση των οχημάτων και
β) τις μέγιστες αποδεκτές επιτρεπόμενες φορτίσεις που καθορίζονται σύμφωνα με το π.δ. 1161/1977 (Α’ 380) για τα οχήματα εθνικών μεταφορών και το π.δ. 77/1998 (Α’ 71) για τα οχήματα διεθνών μεταφορών, και σύμφωνα με την κατηγορία του οχήματος.
3. Οι διαστάσεις του φορτωμένου οχήματος δεν υπερβαίνουν τις μέγιστες επιτρεπόμενες διαστάσεις που προβλέπονται από την ισχύουσα νομοθεσία για κάθε κατηγορία οχήματος ή συνδυασμό οχημάτων.
4. Το φορτίο του οχήματος προετοιμάζεται προς φόρτωση, τακτοποιείται και στοιβάζεται με τρόπο ώστε:
α) Να μην εκτίθενται σε κίνδυνο πρόσωπα, ζώα και να μην προκαλούνται ζημιές σε δημόσια περιουσία ή περιουσία τρίτων,
β) να μην παρεμποδίζεται η κυκλοφορία άλλων οχημάτων, ειδικότερα από διαρροή, πτώση ή διασκόρπισή του στην οδό,
γ) να μην μετακινείται, ιδιαίτερα όταν αυτό μπορεί να επηρεάσει την ευστάθεια του οχήματος,
δ) να μην περιορίζεται ή παρεμποδίζεται η ορατότητα τoυ οδηγού, να μην εμποδίζεται η οδήγηση του οχήματος και να μην μειώνεται η σταθερότητα αυτού,
ε) να μην προκαλούνται περιττές οχλήσεις, όπως θόρυβος και κονιορτός,
στ) να μην καλύπτονται τα φώτα θέσης, πορείας και στάθμευσης, οι δείκτες κατεύθυνσης, τα αντανακλαστικά στοιχεία, oι πινακίδες αριθμού κυκλοφορίας, τo διακριτικό σήμα της χώρας απογραφής τoυ οχήματος, καθώς και τα σήματα που δίνονται με το χέρι, σύμφωνα με τον παρόντα και
ζ) να μην σύρεται στο έδαφος ή στο οδόστρωμα.
5. Για την τακτοποίηση, στοιβασία, προστασία και ασφάλιση του φορτίου χρησιμοποιούνται, ανάλογα με το είδος του φορτίου, κατάλληλα εξαρτήματα, όπως καλώδια, σχοινιά, αλυσίδες, ιμάντες, καλύμματα και μέσα συσκευασίας, τα οποία είναι σε καλή κατάσταση χωρίς ορατές φθορές, δένονται σφικτά και στερεώνονται καλά. Οι οπίσθιες θύρες του αμαξώματος, αν για τις ανάγκες της φόρτωσης πρέπει να βρίσκονται στην ανοικτή θέση, δεν χρησιμοποιούνται για να στηρίξουν το φορτίο κατά την κίνηση του οχήματος. Κινούμενα εξαρτήματα, όπως αλυσίδες, ιμάντες, γερανοί και οπίσθιες θύρες, ασφαλίζονται, ώστε να μην προεξέχουν του περιγράμματος του οχήματος κατά τις ταλαντώσεις τους από την κίνηση του οχήματος, και να μην σύρονται στο έδαφος ή το οδόστρωμα.
6. Για τη μεταφορά εμπορευματοκιβωτίων χρησιμοποιούνται κατάλληλα κλειδιά (κλείστρα) ενσωματωμένα στο όχημα, που στερεώνουν και ασφαλίζουν όλα τα αντίστοιχα σημεία του εμπορευματοκιβωτίου.
7. Φορτίο σε όχημα με ανοικτό αμάξωμα, που αποτελείται από υλικά για τα οποία υπάρχει κίνδυνος κατά τη διαδρομή να εκφύγουν από το αμάξωμα ή να παρασυρθούν από τον αέρα (όπως αδρανή υλικά), καλύπτεται με εύκαμπτο κάλυμμα κατάλληλο προς τη φύση των υλικών, στερεωμένο επαρκώς στο αμάξωμα. Το κάλυμμα και οι διατάξεις στερέωσης αυτού επιτρέπεται να εξέχουν του αμαξώματος:
α) μέχρι και είκοσι (20) χιλιοστά του μέτρου, αν δεν απέχουν περισσότερο από δύο (2) μέτρα από το επίπεδο του εδάφους ή
β) μέχρι και πενήντα (50) χιλιοστά του μέτρου, αν απέχουν περισσότερο από δύο (2) μέτρα από το επίπεδο του εδάφους. Οι ανωτέρω περιορισμοί τηρούνται σε κάθε περίπτωση τοποθέτησης καλύμματος επί οχήματος.
8. Σε οχήματα που προορίζονται για την ταυτόχρονη μεταφορά φορτίου, επιβατών ή ζώων, το φορτίο είναι ασφαλώς προσδεδεμένο.
9. To φορτίο απαγορεύεται να προεξέχει από το εμπρόσθιο μέρος του οχήματος. Κατ’ εξαίρεση, το φορτίο επιτρέπεται να προεξέχει του πλάγιου ή του οπίσθιου μέρους του οχήματος, με την επιφύλαξη της παρ. 3, ως εξής:
α) γενικά:
αα) συμμετρικά στο πλάι του οχήματος, μέχρι τριάντα (30) εκατοστά σε κάθε πλευρά,
αβ) από το οπίσθιο μέρος του οχήματος, μέχρι τριάντα τοις εκατό (30%) του μήκους του ή του ρυμουλκούμενου στον συνδυασμό οχημάτων (συρμός ή αρθρωτό όχημα),
β) ειδικότερα, στα μοτοποδήλατα, τις μοτοσικλέτες και τα τρίτροχα οχήματα:
βα) συμμετρικά μέχρι σαράντα (40) εκατοστά από τις πλευρές τους, υπολογιζόμενου από το εξωτερικό άκρο του εμπρόσθιου πλευρικού φανού του οχήματος ή του εμπρόσθιου ή οπίσθιου ακραίου σημείου αυτών,
ββ) σε μήκος που η προβολή του στο οριζόντιο επίπεδο είναι μέχρι σαράντα (40) εκατοστά, υπολογιζόμενων από το πίσω ακραίο σημείο για τις μοτοσικλέτες και τρίτροχα οχήματα και μέχρι είκοσι (20) εκατοστά για τα μοτοποδήλατα.
10. Στην περίπτωση φορτηγών αυτοκινήτων, αρθρωτών οχημάτων ή συρμών που μεταφέρουν ογκώδη αντικείμενα, τα οποία δεν μπορούν να κατατμηθούν ή να αποσυνδεθούν εύκολα σε περισσότερα από ένα τεμάχια όπως δοκοί, στύλοι, σωλήνες ή άλλα φορτία μεγάλου μήκους, με την επιφύλαξη της παρ. 3, το φορτίο αυτό επιτρέπεται να προεξέχει:
α) σε οχήματα συνολικού μήκους μέχρι πέντε (5) μέτρων, σε μήκος που η προβολή του στο οριζόντιο επίπεδο είναι μέχρι τριάντα τοις εκατό (30%) του συνολικού μήκους τους από το εμπρόσθιο μέρος και τριάντα τοις εκατό (30%) από το οπίσθιο μέρος τους,
β) σε οχήματα συνολικού μήκους άνω των πέντε (5) μέτρων, σε μήκος που η προβολή του στο οριζόντιο επίπεδο είναι μέχρι δύο (2) μέτρα από το εμπρόσθιο μέρος και μέχρι τρία (3) μέτρα από το οπίσθιο μέρος τους. Αν η μικρότερη διάσταση του φορτωμένου αντικειμένου υπερβαίνει το πλάτος του οχήματος, επιτρέπεται να προεξέχει μέχρι σαράντα (40) εκατοστά σε κάθε πλευρά του οχήματος.
11. Η κυκλοφορία οχημάτων που υπερβαίνουν το ανώτατο προβλεπόμενο βάρος ή τις ανώτατες διαστάσεις επιτρέπεται σύμφωνα με την παρ. 1 του άρθρου 57 εφόσον:
α) μεταφέρουν αδιαχώριστο φορτίο, δηλαδή φορτίο το οποίο, για τους σκοπούς της μεταφοράς επί της οδού, δεν μπορεί να διαχωρισθεί σε δύο ή περισσότερα φορτία, χωρίς δυσανάλογη δαπάνη ή κίνδυνο καταστροφής και το οποίο, λόγω των διαστάσεων ή της μάζας του, δεν μπορεί να μεταφερθεί από όχημα που πληροί τις προϋποθέσεις των παρ. 1 και 3 του παρόντος ή
β) μεταφέρουν πολλά, ίδια, αντικείμενα, τα οποία υπερβαίνουν τις μέγιστες διαστάσεις, όπως δοκούς, στύλους, σωλήνες ή άλλα φορτία μεγάλου μήκους, με την επιφύλαξη της παρ. 1. 12. Κατ’ εξαίρεση της παρ. 3 για τα οχήματα ή συνδυασμούς οχημάτων μεταφοράς οχημάτων (αυτοκινητοφόρα), επιτρέπεται η μεταφορά οχημάτων που προεξέχουν από το εμπρόσθιο τμήμα τους μέχρι πενήντα (50) εκατοστά και από το οπίσθιο τμήμα τους μέχρι ενάμιση (1,50) μέτρο. Οι προεξοχές αυτές μετρώνται από το απώτερο σταθερό τμήμα του αμαξώματος του συνδυασμού οχήματος μεταφοράς, εμπρός ή πίσω μέχρι του απώτερου σημείου του πρώτου ή τελευταίου οχήματος που αποτελούν μέρος του φορτίου, αντίστοιχα. Κάποια από τα οχήματα, που αποτελούν το φορτίο, μπορούν να στηρίζονται σε εκτεινόμενες φορητές κατασκευές που προεξέχουν του αμαξώματος, οι οποίες όμως δεν λαμβάνονται υπόψη κατά τη μέτρηση των διαστάσεων και δεν επιτρέπεται να εξέχουν του φορτίου. 13. Τα προεξέχοντα φορτία από το οπίσθιο μέρος του οχήματος, εφόσον η προβολή τους στο οριζόντιο επίπεδο υπερβαίνει το ένα (1) μέτρο, επισημαίνονται με σταθερή προσαρτημένη πινακίδα διαστάσεων τουλάχιστον πενήντα επί πενήντα (50 x 50) εκατοστών λευκού χρώματος με διαγώνιες ερυθρές λωρίδες και κατασκευασμένη από υλικά υψηλής αντανακλαστικότητας. Η πινακίδα αυτή τοποθετείται με το πάνω άκρο σε ύψος που δεν ξεπερνά το ένα και εξήντα (1,60) μέτρο και το κάτω άκρο σε ύψος τουλάχιστον σαράντα (40) εκατοστά από το οδόστρωμα. Όταν το φορτίο προεξέχει σε ολόκληρο το πλάτος του οπίσθιου μέρους του οχήματος, τοποθετούνται δύο πινακίδες της παρούσας, μια σε κάθε άκρο του φορτίου. Επιπλέον, κατά τη νύχτα, το άκρο του φορτίου που εξέχει από το εμπρόσθιο μέρος, εφόσον επιτρέπεται, επισημαίνεται με λευκό φως, το άκρο που εξέχει από το οπίσθιο μέρος με ερυθρό φως. 14. Επιτρέπεται:
α) η μεταφορά ποδηλάτων στην οροφή και στο οπίσθιο μέρος των οχημάτων με εξαρτήματα εγκεκριμένα σύμφωνα με τις ισχύουσες διατάξεις, τα οποία τοποθετούνται με μέριμνα και ευθύνη του οδηγού. Κατά τη μεταφορά ποδηλάτων στο οπίσθιο μέρος των οχημάτων, δεν επιτρέπεται να καλύπτονται τα πίσω φώτα θέσης, στάθμευσης, οι δείκτες κατεύθυνσης και η πινακίδα κυκλοφορίας του οχήματος, ενώ η όλη προεξοχή επισημαίνεται με ερυθρό ανακλαστικό στοιχείο και αφαιρείται όταν δεν πραγματοποιείται αυτού του είδους η μεταφορά.
β) Η μεταφορά ποδηλάτων, μοτοποδηλάτων και μοτοσικλετών στο οπίσθιο μέρος των μηχανοκίνητων τροχόσπιτων με εξαρτήματα εγκεκριμένα σύμφωνα με τις ισχύουσες διατάξεις. Δεν επιτρέπεται να καλύπτονται τα πίσω φώτα θέσης, στάθμευσης, οι δείκτες κατεύθυνσης και η πινακίδα αριθμού κυκλοφορίας. Η προεξοχή αυτή επισημαίνεται με ερυθρό ανακλαστικό στοιχείο. 15. Για την οδική μεταφορά, φόρτωση, εκφόρτωση και στοιβασία επικίνδυνων εμπορευμάτων, εφαρμόζεται η ισχύουσα νομοθεσία που ρυθμίζει τα θέματα αυτά. 16. Οι παραβάσεις:
α) των παρ. 4, 7, 10, 12 και 13, με την επιφύλαξη της περ. β), κατατάσσονται στην κατηγορία Ε2-Α,
β) της περ. β) της παρ. 4 κατατάσσονται στην κατηγορία Ε2-Β,
γ) των παρ. 5, 8, 9 και 14 κατατάσσονται στην κατηγορία Ε1-Α και
δ) των παρ. 6 και 11 κατατάσσονται στην κατηγορία Ε3-Β. Για την παράβαση της παρ. 6, αν δεν υφίσταται ο κατάλληλος εξοπλισμός στο όχημα, το προβλεπόμενο διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης επιβάλλεται μόνο στον οδηγό, ενώ διοικητικό πρόστιμο και το διοικητικό μέτρο της αφαίρεσης των στοιχείων κυκλοφορίας επιβάλλονται στον κάτοχο του οχήματος. Για τις παραβάσεις των παρ. 1, 2 και 3 εφαρμόζεται το άρθρο 57. Σε περίπτωση επικίνδυνης φόρτωσης, κατά παράβαση του παρόντος, επιβάλλεται και ακινητοποίηση του οχήματος σύμφωνα με το άρθρο 50, περί ακινητοποίησης οχήματος. Για τις ανωτέρω παραβάσεις και εφόσον δεν υφίσταται σχετική ρύθμιση από τις ειδικότερες διατάξεις του ν. 3446/2006 (Α’ 49), επιβάλλονται οι κυρώσεις του παρόντος.`},
  37: {title:`Μεταφορά επιβατών με οχήματα`,text:`Μεταφορά επιβατών με οχήματα
1. Απαγορεύεται η μεταφορά επιβατών με οδικά οχήματα με τρόπο τέτοιο ώστε να προκαλείται κίνδυνος για τους ίδιους τους επιβάτες, το όχημα και τον οδηγό, τρίτους, ζώα ή περιουσία.
2. Ειδικότερα απαγορεύεται:
α) Η μεταφορά επιβατών που υπερβαίνουν τον αναγραφόμενο ανώτατο αριθμό επιβατών στην άδεια κυκλοφορίας του οχήματος.
β) Η κατάληψη θέσης παραπλεύρως του οδηγού, από παιδιά ηλικίας μικρότερης των δώδεκα (12) ετών, εφόσον δεν συγκρατούνται με εγκεκριμένο σύστημα συγκράτησης κατάλληλο για την ηλικία, το ύψος και το βάρος τους.
γ) Η κατάληψη θέσης παραπλεύρως του οδηγού από περισσότερα πρόσωπα από όσα επιτρέπεται στη θέση ή τις θέσεις.
δ) Η μεταφορά επιβάτη με μοτοσικλέτα ή μοτοποδήλατο:
δα) σε άλλη εκτός του συνεπιβάτη θέση,
δβ) εφόσον δεν έχει τη δυνατότητα να στηρίζεται στα υποπόδια,
δγ) εφόσον πρόκειται για ανηλίκους έως πέντε (5) ετών και δεν συγκρατούνται με εγκεκριμένο σύστημα συγκράτησης κατάλληλο για την ηλικία, το ύψος και το βάρος τους.
3. Ο οδηγός μηχανοκίνητου οχήματος και μοτοποδηλάτου επιβάλλεται να μεριμνά για την ασφάλεια των συνεπιβατών του και ειδικότερα να ελέγχει αν φορούν τις ζώνες ασφαλείας και το προστατευτικό κράνος κατά τη μεταφορά τους.
4.
α) Οι παραβάσεις για τον οδηγό των παρ. 1 έως 2 με την επιφύλαξη της περ. β) κατατάσσονται στην κατηγορία Ε1-Β.
β) Οι παραβάσεις της περ. β) της παρ. 2 που αφορά στην κατάληψη θέσης παραπλεύρως του οδηγού, από παιδιά ηλικίας μικρότερης των δώδεκα (12) ετών, εφόσον δεν συγκρατούνται με εγκεκριμένο σύστημα συγκράτησης κατάλληλο για την ηλικία, το ύψος και το βάρος τους και της περ. γ) της παρ. 2, κατατάσσονται στην κατηγορία Ε3-Β.
γ) Οι παραβάσεις της παρ. 3 όσον αφορά τις ζώνες ασφαλείας κατατάσσονται στην κατηγορία Ε2-Β, όσον αφορά το προστατευτικό κράνος του συνεπιβάτη κατατάσσεται στην κατηγορία Ε3 - Β.`},
  38: {title:`Στάση και στάθμευση`,text:`Στάση και στάθμευση
1. Η στάση και η στάθμευση επιτρέπονται, αν δεν προκαλείται εξ αυτών κίνδυνος ή παρακώλυση της κυκλοφορίας και αν δεν υπάρχουν σχετικές απαγορευτικές πινακίδες ή διαγραμμίσεις.
2. Η στάση ή στάθμευση οχήματος απαγορεύεται:
α) επί διάβασης πεζών ή ποδηλατιστών και σε απόσταση μικρότερη από πέντε (5) μέτρα εκατέρωθεν αυτής,
β) σε απόσταση μικρότερη από δώδεκα (12) μέτρα εκατέρωθεν στάσεων αστικών, υπεραστικών, ηλεκτροκίνητων λεωφορείων, και τροχιοδρομικών οχημάτων. Αν σε στάση λεωφορείου είναι τοποθετημένη επί του οδοστρώματος ειδική προεξοχή για την επιβίβαση και την αποβίβαση επιβατών και τη διασφάλιση της προσβασιμότητας των ατόμων με αναπηρία και των εμποδιζόμενων ατόμων γενικότερα, η απόσταση του προηγούμενου εδαφίου:
βα) μειώνεται στο ήμισυ, όταν ο υπολειπόμενος χώρος μετά τα έξι (6) και μέχρι τα δώδεκα (12) μέτρα εκατέρωθεν της στάσης διατίθεται από την αρμόδια για τη συντήρηση της οδού αρχή, ως χώρος αποκλειστικής στάθμευσης μοτοσικλετών, μοτοποδηλάτων, ποδηλάτων και Ε.Π.Η.Ο. και σημαίνεται με την προβλεπόμενη σήμανση,
ββ) μηδενίζεται, όταν υφίστανται εκατέρωθεν της προεξοχής, εσοχές στάθμευσης,
γ) σε εισόδους και εξόδους κόμβων και σε απόσταση μικρότερη από δέκα (10) μέτρα από τη νοητή προέκταση της πλησιέστερης οριογραμμής του κάθετου οδοστρώματος,
δ) σε σιδηροδρομικές ή τροχιοδρομικές γραμμές ή πολύ πλησίον αυτών, ώστε να παρεμποδίζεται η κίνηση των σιδηροδρομικών ή τροχιοδρομικών οχημάτων ή να προκύπτει χρήση επί των σιδηροδρομικών ή τροχιοδρομικών λειτουργουσών γραμμών κατά την πορεία αυτών,
ε) σε πεζοδρόμια, πλατείες, ειδικά ερείσματα που προορίζονται, για πεζούς καθώς και ποδηλατοδρόμους, εκτός αν επιτρέπεται σε αυτούς η στάθμευση με ειδική σήμανση,
στ) πάνω και κάτω από τις γέφυρες, εκτός αν υπάρχουν χώροι για στάθμευση ειδικά προορισμένοι,
ζ) πλησίον και πάνω σε κυρτές καμπύλες αλλαγής των κατά μήκος κλίσεων των οδών (ράχεων) και σε στροφές ανεπαρκούς ορατότητας για προσπέραση,
η) σε οδοστρώματα που είναι χωρισμένα σε δύο λωρίδες κυκλοφορίας και αν το εναπομένον πλάτος της λωρίδας μεταξύ οχήματος και απαγορευτικής γραμμής υπέρβασης είναι μικρότερο από τρία (3) μέτρα,
θ) σε απόσταση μικρότερη από είκοσι (20) μέτρα από φωτεινούς σηματοδότες και δώδεκα (12) μέτρα από πινακίδες υποχρεωτικής διακοπής πορείας (STOP) (Ρ-2) ή υποχρεωτικής παραχώρησης προτεραιότητας (Ρ-1), καθώς και σε θέση, στην οποία το όχημα κρύβει από τους χρήστες της οδού τη θέα των πινακίδων σήμανσης και σηματοδοτών. Τα όρια του προηγούμενου εδαφίου μειώνονται στο ήμισυ αν:
θα) η στάθμευση γίνεται σε εσοχές στάθμευσης,
θβ) ο υπολειπόμενος χώρος μετά από τα δέκα (10) ή έξι (6) μέτρα αντίστοιχα, διατίθεται από την αρμόδια για τη συντήρηση της οδού αρχή, ως χώρος αποκλειστικής στάθμευσης μοτοσικλετών, μοτοποδηλάτων, ποδηλάτων και Ε.Π.Η.Ο. που σημαίνεται με την προβλεπόμενη σήμανση.
ι) σε απόσταση πέντε (5) μέτρων από την τομή ρυμοτομικών γραμμών ή των νοητών προεκτάσεων αυτών,
ια) πάνω στις νησίδες ασφαλείας καθώς και στις διαχωριστικές νησίδες,
ιβ) στους αυτοκινητοδρόμους και τις οδούς ταχείας κυκλοφορίας, εκτός των χώρων στάθμευσης, που καθορίζονται με σήμανση,
ιγ) σε λωρίδες επιτάχυνσης και επιβράδυνσης,
ιδ) σε σήραγγες που υποδεικνύονται από ειδικές πινακίδες, εκτός από τους χώρους που υποδεικνύονται ειδικά γι’ αυτόν τον σκοπό,
ιε) επί σημασμένης βοηθητικής οδού, η οποία προορίζεται για οχήματα που μετακινούνται βραδέως,
ιστ) σε θέση όπου βρίσκεται κεκλιμένο επίπεδο (ράμπα) διάβασης ατόμων με αναπηρία ή οδηγός τυφλών και σε απόσταση μικρότερη από πενήντα εκατοστά (0,50 μ.) εκατέρωθεν αυτών,
ιζ) σε ειδικούς χώρους στάθμευσης οχημάτων ατόμων με αναπηρία,
ιη) σε χώρους στάθμευσης αποκλειστικά για συγκεκριμένο όχημα ατόμων με αναπηρία.
ιθ) σε θέση/σημείο επαναφόρτισης ηλεκτροκίνητων οχημάτων, εξαιρουμένων των ηλεκτροκίνητων οχημάτων κατά τη διάρκεια της φόρτισής τους.
κ) σε σημεία που έχει ως αποτέλεσμα την παρεμπόδιση διέλευσης οχημάτων που εξυπηρετούν δημόσια συγκοινωνία ή αστικών, υπεραστικών και ηλεκτροκίνητων λεωφορείων, εφόσον τα σημεία αυτά επισημαίνονται ευκρινώς.
3. Η στάθμευση οχήματος στο οδόστρωμα απαγορεύεται και:
α) σε απόσταση μικρότερη από δεκαπέντε (15) μέτρα προ και μετά τις ισόπεδες σιδηροδρομικές διαβάσεις,
β) μπροστά από την είσοδο και έξοδο οχημάτων παροδίου ιδιοκτησίας καθώς και απέναντι από αυτή, όταν η οδός είναι στενή και παρεμποδίζεται η είσοδος-έξοδος οχημάτων εξ αυτής,
γ) σε θέση από την οποία παρεμποδίζεται όχημα που σταθμεύει κανονικά να εξέλθει από τον χώρο που έχει σταθμεύσει,
δ) αν το ελεύθερο μέρος της οδού που απομένει είναι ανεπαρκές για την κυκλοφορία των οχημάτων,
ε) παράπλευρα άλλου οχήματος, σε στάση ή στάθμευση, εκτός αν άλλως ορίζεται με ειδική σήμανση. Κατ’ εξαίρεση, τα δίτροχα ποδήλατα, μοτοποδήλατα και μοτοσικλέτες χωρίς καλάθι καθώς και τα Ε.Π.Η.Ο. μπορούν να σταθμεύουν το ένα παράπλευρα στο άλλο είτε σε διπλή σειρά είτε υπό γωνία σε σχέση με την οριογραμμή του οδοστρώματος,
στ) σε απόσταση μικρότερη από πέντε (5) μέτρα προ και μετά από πυροσβεστικά σημεία,
ζ) προ της εισόδου και εξόδου της προοριζόμενης για τη διακίνηση ασθενών προς και από νοσοκομεία, κλινικές και σταθμούς πρώτων βοηθειών γενικά,
η) αν εμποδίζει τη χρήση χώρων στάθμευσης που σημαίνεται κατάλληλα,
θ) σε ειδικούς χώρους στάθμευσης επιβατηγών αυτοκινήτων δημόσιας χρήσης (ΤΑΞΙ),
ι) στις εισόδους και εξόδους των πεζόδρομων ως και πάνω σε αυτούς,
ια) επί του κεντρικού οδοστρώματος οδών τριών (3) λωρίδων, καθώς και εκτός κατοικημένων περιοχών, επί των οδοστρωμάτων οδών σημασμένων ως οδών προτεραιότητας με κατάλληλες πινακίδες.
4. Ειδικά η στάση και η στάθμευση των Ε.Π.Η.Ο. που κινούνται εντός κατοικημένων περιοχών, λιμένων και χερσαίων ζωνών λιμένων απαγορεύονται:
α) επάνω σε διαβάσεις πεζών ή ποδηλατιστών και σε απόσταση μικρότερη από πέντε (5) μέτρα από αυτές,
β) σε απόσταση μικρότερη από δώδεκα (12) μέτρα από στάσεις αστικών, υπεραστικών, ηλεκτροκίνητων λεωφορείων και τροχιοδρομικών οχημάτων,
γ) σε εισόδους και εξόδους κόμβων και σε απόσταση μικρότερη από δέκα (10) μέτρα από τη νοητή προέκταση της πλησιέστερης οριογραμμής του κάθετου οδοστρώματος,
δ) σε σιδηροδρομικές ή τροχιοδρομικές γραμμές ή πολύ πλησίον αυτών, ώστε να παρεμποδίζεται η κίνηση των σιδηροδρομικών ή τροχιοδρομικών οχημάτων,
ε) πάνω και κάτω από τις γέφυρες, εκτός αν υπάρχουν χώροι για στάθμευση ειδικά προορισμένοι,
στ) πάνω στις νησίδες ασφαλείας καθώς και στις διαχωριστικές νησίδες,
ζ) στους αυτοκινητοδρόμους και τις οδούς ταχείας κυκλοφορίας, εκτός των χώρων στάθμευσης που καθορίζονται με σήμανση,
η) σε λωρίδες επιτάχυνσης και επιβράδυνσης,
θ) σε σήραγγες που υποδεικνύονται από ειδικές πινακίδες, εκτός από τους χώρους που υποδεικνύονται ειδικά για αυτόν τον σκοπό,
ι) σε θέση όπου βρίσκεται κεκλιμένο επίπεδο (ράμπα) διάβασης ατόμων με αναπηρία ή οδηγός τυφλών και σε απόσταση μικρότερη από μισό (0,50) μέτρο εκατέρωθεν αυτών,
ια) σε ειδικούς χώρους στάθμευσης οχημάτων ατόμων με αναπηρία,
ιβ) σε χώρους στάθμευσης αποκλειστικά για συγκεκριμένο όχημα ατόμων με αναπηρία,
ιγ) σε απόσταση μικρότερη από επτά (7) μέτρα πριν και μετά τις ισόπεδες σιδηροδρομικές διαβάσεις,
ιδ) σε θέση από την οποία παρεμποδίζεται όχημα που σταθμεύει κανονικά να εξέλθει από τον χώρο όπου έχει σταθμεύσει,
ιε) αν το ελεύθερο μέρος της οδού που απομένει είναι ανεπαρκές για την κυκλοφορία των οχημάτων ή το ελεύθερο μέρος του πεζοδρομίου που απομένει είναι ανεπαρκές για την κυκλοφορία πεζών,
ιστ) προ της εισόδου και εξόδου που προορίζεται για τη διακίνηση ασθενών προς και από νοσοκομεία, κλινικές και σταθμούς πρώτων βοηθειών γενικά,
ιζ) αν εμποδίζει τη χρήση χώρων στάθμευσης που σημαίνονται κατάλληλα,
ιη) σε ειδικούς χώρους στάθμευσης επιβατηγών αυτοκινήτων δημόσιας χρήσης (ΤΑΞΙ),
ιθ) στις εισόδους και εξόδους των πεζόδρομων,
κ) σε ειδικούς χώρους στάθμευσης και αφετηρίες υπεραστικών λεωφορείων, τουριστικών λεωφορείων και τουριστικών λεωφορείων ανοιχτού τύπου,`},
  39: {title:`Κανόνες χρήσης φώτων εντοπισμού θέσης`,text:`Κανόνες χρήσης φώτων εντοπισμού θέσης
1. Τα μηχανοκίνητα οχήματα στις οδούς, πλην των δίτροχων μοτοσικλετών χωρίς καλάθι, επιβάλλεται να έχουν τη νύχτα και οποτεδήποτε η ορατότητα είναι ανεπαρκής, αναμμένα τουλάχιστον τα δύο (2) λευκά ή ειδικής επιλογής κίτρινα φώτα θέσης στο εμπρόσθιο μέρος τους και ίσο αριθμό ερυθρών φώτων θέσης στο οπίσθιο μέρος τους, σύμφωνα με τα άρθρα 69, περί φώτων θέσης (μικρών), και 70, περί φώτων όγκου και φώτων πλευρικών. Στον συνδυασμό μηχανοκίνητου οχήματος με ένα (1) ή περισσότερα ρυμουλκούμενα, πρέπει τα ερυθρά φώτα θέσης να είναι προσαρμοσμένα και στο οπίσθιο μέρος του τελευταίου ρυμουλκούμενου. Τα ρυμουλκούμενα, των οποίων το πλάτος υπερβαίνει το ένα μέτρο και εξήντα εκατοστά (1,60), επιβάλλεται να έχουν αναμμένα στο εμπρόσθιο μέρος τους τα δύο (2) λευκά φώτα θέσης (πλευρικά) του άρθρου 69.
2. Οχήματα ή συνδυασμός οχημάτων, στα οποία δεν εφαρμόζεται η παρ. 1, επιβάλλεται τη νύχτα να έχουν αναμμένα τουλάχιστον ένα (1) λευκό ή ειδικής επιλογής κίτρινο φως στο εμπρόσθιο μέρος και τουλάχιστον ένα (1) ερυθρό φως στο οπίσθιο μέρος αυτών. Αν υπάρχει μόνο ένα (1) φως μπροστά και ένα (1) φως πίσω, πρέπει να τοποθετείται αυτό στην κεντρική γραμμή του οχήματος ή στην αριστερή του πλευρά.
3. Τη νύχτα και οποτεδήποτε η ορατότητα είναι ανεπαρκής, η παρουσία μηχανοκίνητων οχημάτων και των ρυμουλκούμενων οχημάτων που βρίσκονται σε στάση ή στάθμευση πρέπει να επισημαίνεται με τα εμπρόσθια και οπίσθια φώτα θέσης ή στάθμευσης. Εξαιρούνται:
α) Τα οχήματα που βρίσκονται σε στάση ή στάθμευση σε οδό που φωτίζεται αρκετά,
β) τα δίτροχα ποδήλατα, δίτροχα μοτοποδήλατα ή δίτροχες μοτοσικλέτες χωρίς καλάθι, που βρίσκονται σε στάση ή στάθμευση στο άκρο του οδοστρώματος σε κατοικημένη περιοχή και δεν είναι εφοδιασμένα με συσσωρευτή (μπαταρία),
γ) τα οχήματα που βρίσκονται σε στάση ή στάθμευση σε ειδικούς χώρους έξω από το οδόστρωμα και
δ) τα οχήματα που βρίσκονται σε στάση ή στάθμευση σε οδούς κατοικημένων περιοχών με ελάχιστη κυκλοφορία οχημάτων.
4. Τα φώτα που καθορίζονται στην παρ. 1 πρέπει να είναι ικανά ώστε να γίνεται αντιληπτή η παρουσία του οχήματος στους χρήστες της οδού. Κατά τις ώρες της ημέρας, οι οδηγοί μοτοποδηλάτων και μοτοσικλετών πρέπει να κινούνται με αναμμένο ένα (1) τουλάχιστον εμπρόσθιο φως διασταύρωσης και ένα οπίσθιο ερυθρό φως. Το εμπρόσθιο και οπίσθιο φως απαγορεύεται να εκπέμπονται από τον ίδιο φανό ή την ίδια συσκευή, εκτός αν το επιτρέπουν τα χαρακτηριστικά του οχήματος, ιδιαίτερα το μήκος του.
5. Τα μηχανοκίνητα οχήματα, το μήκος των οποίων δεν υπερβαίνει τα έξι (6) μέτρα και το πλάτος τα δύο (2) μέτρα και στα οποία δεν έχει συνδεθεί άλλο όχημα, επιτρέπεται, όταν βρίσκονται σε στάση ή στάθμευση, σε οδό κατοικημένης περιοχής, να έχουν αναμμένο ένα πλευρικό φως προς το μέρος όπου διεξάγεται η κυκλοφορία. Το φως αυτό πρέπει να είναι λευκό ή κίτρινο μπροστά και ερυθρό ή κίτρινο πίσω.
6. Δεν επιτρέπεται σε όχημα να φέρει μπροστά ερυθρά φώτα, ερυθρές αντανακλαστικές συσκευές ή ερυθρά αντανακλαστικά υλικά και πίσω λευκά ή ειδικής επιλογής κίτρινα φώτα, λευκής ή ειδικής επιλογής κίτρινες αντανακλαστικές συσκευές ή λευκά ή ειδικής επιλογής κίτρινα αντανακλαστικά υλικά. Το προηγούμενο εδάφιο δεν εφαρμόζεται προκειμένου για χρήση λευκών ή ειδικής επιλογής κίτρινων φώτων οπισθοδρόμησης ούτε για την αντανάκλαση των ανοικτού χρώματος αριθμών ή γραμμάτων των οπίσθιων πινακίδων αναγνώρισης ή άλλων χαρακτηριστικών ή διακριτικών σημάτων, που προβλέπονται και περιγράφονται στο Κεφάλαιο Ε’. Επίσης, δεν εφαρμόζεται για την αντανάκλαση του ανοικτού χρώματος των ως άνω πινακίδων ή σημάτων, ούτε για τα ερυθρά φώτα ορισμένων οχημάτων άμεσης ανάγκης, τα οποία περιστρέφονται ή αναβοσβήνουν.
7. Οι οδηγοί των οδικών και τροχιοδρομικών οχημάτων που κυκλοφορούν κατά τη διάρκεια της νύχτας, υποχρεούνται να μεριμνούν για τον φωτισμό της οπίσθιας πινακίδας αριθμού κυκλοφορίας, ώστε να είναι εύκολη η αναγνώριση των στοιχείων της.
8. Στα ζωήλατα οχήματα και χειράμαξες η συσκευή που εκπέμπει τον φωτισμό μπορεί να φέρεται από τον οδηγό ή από τον συνοδό, ο οποίος βαδίζει στην αριστερή πλευρά αυτών.
9. Ομάδες πεζών οι οποίες οδηγούνται από επιφορτισμένο για τον σκοπό αυτό πρόσωπο ή σχηματίζουν πομπή, όπως επίσης οι οδηγοί ζώων ή ζώων έλξης φορτίου ή ιππασίας, οι οποίοι κινούνται κατά μήκος του οδοστρώματος τη νύχτα, υποχρεούνται να έχουν προς την πλευρά στην οποία διεξάγεται η κυκλοφορία αντανακλαστικό στοιχείο ή ένα (1) τουλάχιστον αναμμένο φως λευκό ή ειδικής επιλογής κίτρινο μπροστά και ένα ερυθρό φως πίσω ή κίτρινο φως και στα δύο πιο πάνω σημεία. Τα φώτα αυτά είναι δυνατόν να εκπέμπονται και από την αυτή συσκευή. Η παρούσα δεν εφαρμόζεται σε κατοικημένη περιοχή που φωτίζεται αρκετά.
10. Εξαιρούνται του παρόντος άρθρου τα αμαξίδια βρεφών και ατόμων με αναπηρία καθώς και άλλα μικρά οχήματα χωρίς μηχανή, τα οποία σύρονται ή προωθούνται από τους πεζούς, εκτός αν κυκλοφορούν τη νύχτα εκτός κατοικημένης περιοχής, οπότε υποχρεούνται να φέρουν αντανακλαστικά στοιχεία χρώματος λευκού ή κίτρινου.
11. Δεν επιτρέπεται σε όχημα να έχει φώτα διαφορετικού χρώματος από αυτά που ορίζονται κατά περίπτωση στο παρόν.
12. Οι παραβάσεις των παρ. 1 έως 11 κατατάσσονται στην κατηγορία Ε1-Α πλην της παράβασης της παρ. 7 που κατατάσσεται στην κατηγορία Ε1-Β.`},
  40: {title:`Κανόνες χρήσης των φώτων οχημάτων`,text:`Κανόνες χρήσης των φώτων οχημάτων
1. Κατά τη διάρκεια της νύχτας ο οδηγός υποχρεούται να έχει τα φώτα του οχήματός του αναμμένα και να τα χρησιμοποιεί ως εξής:
α) Τα φώτα πορείας απαγορεύεται να είναι αναμμένα, όταν το οδόστρωμα φωτίζεται, αρκετά μεν μέσα στις κατοικημένες περιοχές, αρκετά δε και συνεχώς εκτός κατοικημένων περιοχών, ώστε ο οδηγός να μπορεί να βλέπει ευκρινώς από απόσταση τουλάχιστον εκατό (100) μέτρων, καθώς και όταν το όχημα βρίσκεται σε στάση ή στάθμευση.
β) Τα φώτα πορείας πρέπει να μην είναι αναμμένα ή, όταν είναι αναμμένα, η λειτουργία τους να ρυθμίζεται με τρόπο ώστε να αποτρέπεται η θάμβωση, στις ακόλουθες περιπτώσεις:
αα) Όταν ο οδηγός πρόκειται να συναντηθεί με όχημα που έρχεται αντίθετα, τα τυχόν αναμμένα φώτα πορείας πρέπει να σβήνουν ή η λειτουργία τους να ρυθμίζεται με τρόπο ώστε να αποτρέπεται η θάμβωση για αρκετό διάστημα και αντ’ αυτών να είναι αναμμένα τα φώτα διασταύρωσης, για να μπορεί ο οδηγός του άλλου οχήματος να προχωρήσει εύκολα και ακίνδυνα.
ββ) Όταν ένα όχημα ακολουθεί πίσω και πλησίον άλλου, τα φώτα πορείας μπορούν να χρησιμοποιούνται κατά την παρ. 4 για να δοθεί προειδοποίηση για την πρόθεση προσπέρασης σύμφωνα με το άρθρο 41, περί ηχητικών και φωτεινών προειδοποιήσεων.
γγ) Σε κάθε άλλη περίπτωση, κατά την οποία είναι αναγκαίο να αποφευχθεί η θάμβωση των άλλων που χρησιμοποιούν την ίδια οδό, ή αυτών που χρησιμοποιούν άλλη οδό ή υδάτινη οδό ή σιδηροδρομική γραμμή, οι οποίες βαίνουν παράπλευρα αυτής.
γ) Τα φώτα διασταύρωσης επιβάλλεται να ανάβουν μέσα και έξω από τις κατοικημένες περιοχές όπου απαγορεύεται η χρήση των φώτων πορείας.
δ) Τα φώτα θέσης επιβάλλεται να χρησιμοποιούνται εκτός των περιπτώσεων του άρθρου 39, περί κανόνων χρήσης φώτων εντοπισμού θέσης, και με τα φώτα πορείας, τα φώτα διασταύρωσης και τα φώτα ομίχλης. Σε περίπτωση στάσης ή στάθμευσης, μπορούν να ανάβουν τα φώτα θέσης ή τα φώτα στάθμευσης.
2. Αν υπάρχουν φώτα ομίχλης, σύμφωνα με το άρθρο 73, πρέπει να χρησιμοποιούνται μόνο σε περίπτωση ομίχλης, χιονόπτωσης ή καταρρακτώδους βροχής, μόνα τους ή μαζί με τα φώτα διασταύρωσης. Τα φώτα αυτά επιτρέπεται να χρησιμοποιούνται σε στενούς ελικοειδείς οδούς ακόμα και αν δεν συντρέχουν οι πιο πάνω προϋποθέσεις.
3. Με εξαίρεση τις περιπτώσεις της παρ. 3 του άρθρου 41 απαγορεύονται, κατά τη συνάντηση με όχημα που έρχεται αντίθετα, το άναμμα και το σβήσιμο των φώτων ή η εναλλαγή της χρήσης τους κατά μικρά χρονικά διαστήματα.
4. Η κατά την παρ. 3 του άρθρου 41 φωτεινή προειδοποίηση είναι το άναμμα των φώτων διασταύρωσης, με διακοπές σε μικρά χρονικά διαστήματα ή το άναμμα με διακοπές των φώτων πορείας ή η εναλλαγή των φώτων διασταύρωσης και των φώτων πορείας με διακοπές επίσης σε μικρά χρονικά διαστήματα.
5. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α, πλην της περ. β) της παρ. 1 που κατατάσσεται στην κατηγορία Ε3-Β.`},
  41: {title:`Ηχητικές και φωτεινές προειδοποιήσεις`,text:`Ηχητικές και φωτεινές προειδοποιήσεις
1. Η χρήση ηχητικών οργάνων προειδοποίησης επιτρέπεται μόνο:
α) Σε περίπτωση έκτακτης ανάγκης, για την αποφυγή δυστυχήματος,
β) εκτός κατοικημένων περιοχών, κατά την προσπέραση, για να ειδοποιηθεί ο οδηγός του προπορευόμενου οχήματος, αν αυτό είναι απαραίτητο,
γ) όταν μεταφέρονται με οχήματα άτομα, τα οποία κινδυνεύουν ή έχουν άμεση ανάγκη ιατρικής βοήθειας.
2. Η χρήση των ηχητικών οργάνων πρέπει να μην παρατείνεται πέραν του απολύτως αναγκαίου χρόνου.
3. Οι οδηγοί αυτοκινήτων οχημάτων μπορούν τη νύχτα, αντί ηχητικών προειδοποιήσεων, να δίνουν τις φωτεινές προειδοποιήσεις της παρ. 4 του άρθρου 40, περί κανόνων χρήσης των φώτων οχημάτων.
4. Ο οδηγός σχολικού λεωφορείου ή οχήματος μεταφοράς ατόμων με αναπηρία οφείλει να έχει αναμμένο το σύστημα φωτεινού συναγερμού, όσο χρόνο διαρκεί η επιβίβαση ή αποβίβαση.
5. Οι οδηγοί αυτοκινήτων οχημάτων, εκτός από την περίπτωση ακινησίας του οχήματος, επιτρέπεται να θέτουν σε λειτουργία τα φώτα έκτακτης ανάγκης (σύστημα φωτεινού συναγερμού), μόνο όταν κινδυνεύουν τρίτοι από το δικό τους όχημα.
6. Η παράβαση της παρ. 1 κατατάσσεται στην κατηγορία Ε1-Α και οι παραβάσεις των παρ. 2 έως 5 κατατάσσονται στην κατηγορία Ε1-Β.`},
  42: {title:`Κανόνες κυκλοφορίας πεζών`,text:`Κανόνες κυκλοφορίας πεζών
1. Οι πεζοί υποχρεούνται να χρησιμοποιούν τα πεζοδρόμια ή τα ειδικά γι’ αυτούς ερείσματα. Κατ’ εξαίρεση, μπορούν να χρησιμοποιούν το οδόστρωμα, αφού λάβουν τις αναγκαίες προφυλάξεις:
α) Πεζοί που ωθούν, σύρουν ή μεταφέρουν ογκώδη αντικείμενα, οι οποίοι, αν βάδιζαν στο πεζοδρόμιο ή το έρεισμα, θα προκαλούσαν σοβαρή δυσχέρεια στην κίνηση των άλλων πεζών,
β) ομάδες πεζών, όταν οδηγούνται από ειδικά για τον σκοπό αυτό επιφορτισμένο πρόσωπο ή σχηματίζουν πομπή,
γ) άτομα με αναπηρία, τα οποία κινούνται σε αναπηρικά καθίσματα.
2. Αν είναι αδύνατη η χρησιμοποίηση των πεζοδρομίων ή των ερεισμάτων, που προορίζονται για τους πεζούς, ή δεν υπάρχουν πεζοδρόμια ή ερείσματα, οι πεζοί μπορούν να βαδίζουν στο οδόστρωμα, με τρόπο ώστε να μην παρεμποδίζουν την κυκλοφορία. Αν το οδόστρωμα διαθέτει λωρίδα για ποδήλατα ή μοτοποδήλατα, μπορούν να βαδίζουν σ’ αυτή, αν το επιτρέπει η πυκνότητα της κυκλοφορίας και δεν παρεμποδίζουν την κίνηση των μοτοποδηλάτων ή ποδηλάτων στη λωρίδα. Οι πεζοί δεν επιτρέπεται να υπερπηδούν εμπόδια όπως δοκούς, αλυσίδες, νησίδες, στηθαία και κιγκλιδώματα, που έχουν τοποθετηθεί από τις αρμόδιες αρχές για ειδικούς λόγους. Η ύπαρξη τέτοιων εμποδίων σημαίνει απαγόρευση εισόδου του πεζού στην αποκλεισμένη επιφάνεια της οδού.
3. Οι πεζοί που χρησιμοποιούν το οδόστρωμα υποχρεούνται να βαδίζουν αντίθετα με την κατεύθυνση της κυκλοφορίας και όσο το δυνατόν πλησιέστερα στο άκρο του οδοστρώματος, εκτός αν κατ’ αυτόν τον τρόπο κινδυνεύουν ή δεν το επιτρέπουν ειδικές περιστάσεις. Κατ’ εξαίρεση, πρόσωπα που ωθούν ή σύρουν χειράμαξες, ωθούν ποδήλατο, μοτοποδήλατο ή μοτοσικλέτα, άτομα με αναπηρία, που κινούνται σε αναπηρικά καθίσματα και ομάδες πεζών, όταν σχηματίζουν πομπή ή οδηγούνται από ειδικά επιφορτισμένο πρόσωπο, υποχρεούνται να βαδίζουν πλησίον του δεξιού άκρου του οδοστρώματος. Οι πεζοί που βαδίζουν στο οδόστρωμα, αν δεν σχηματίζουν πομπή, υποχρεούνται να βαδίζουν σε απλό στοίχο, όταν το απαιτεί η ασφάλεια της κυκλοφορίας, εξαιτίας των συνθηκών ορατότητας, της πυκνότητας ή άλλων λόγων. Ομάδες πεζών που κινούνται στις οδούς υποχρεούνται να αφήνουν ελεύθερη στα δεξιά της οδού επαρκή επιφάνεια του οδοστρώματος, ώστε να μπορεί να διέρχεται ένα όχημα.
4. Οι πεζοί προκειμένου να διασχίσουν το οδόστρωμα, υποχρεούνται:
α) Αν υπάρχουν στο οδόστρωμα διαβάσεις πεζών, να τις χρησιμοποιούν,
β) αν στη διάβαση πεζών την οποία πρόκειται να χρησιμοποιήσουν, υπάρχουν φωτεινοί σηματοδότες πεζών, να συμμορφώνονται στα σήματά τους,
γ) αν στη διάβαση δεν υπάρχουν φωτεινοί σηματοδότες πεζών, αλλά η κυκλοφορία ρυθμίζεται με φωτεινούς σηματοδότες οχημάτων ή από τροχονόμους και δίνεται σήμα για να προχωρήσουν τα οχήματα, να μην κατέρχονται στο οδόστρωμα,
δ) σε διαβάσεις που η κυκλοφορία τόσο των πεζών όσο και των οχημάτων δεν ρυθμίζεται με φωτεινούς σηματοδότες, να μην κατεβαίνουν στο οδόστρωμα πριν λάβουν υπόψη τους την απόσταση και την ταχύτητα των οχημάτων τα οποία πλησιάζουν,
ε) αν δεν υπάρχουν στο οδόστρωμα διαβάσεις πεζών, να μην κατεβαίνουν σ’ αυτό, αν δεν βεβαιωθούν ότι δεν θα παρεμποδίσουν την κυκλοφορία των οχημάτων, στη συνέχεια δε να διασχίζουν το οδόστρωμα κάθετα προς τον άξονά του,
στ) σε ισόπεδους οδικούς κόμβους, στους οποίους η κυκλοφορία ρυθμίζεται με φωτεινούς σηματοδότες οχημάτων ή τροχονόμους, να διασχίζουν το οδόστρωμα βαδίζοντας παράλληλα με τα κινούμενα οχήματα,
ζ) να διασχίζουν το οδόστρωμα κάθετα, χωρίς να βραδυπορούν ή να σταματούν σε αυτό αδικαιολόγητα.
5. Οι παραβάσεις του παρόντος κατατάσσονται στην κατηγορία Ε1-Α.`},
  43: {title:`Συμπεριφορά των οδηγών προς τους πεζούς`,text:`Συμπεριφορά των οδηγών προς τους πεζούς
1. Οι οδηγοί πρέπει να αποφεύγουν να συμπεριφέρονται με τρόπο που μπορεί να θέσει σε κίνδυνο τους πεζούς. Τηρουμένων της παρ. 1 του άρθρου 16, περί κανόνων οδικής συμπεριφοράς, της περ. στ) της παρ. 3 του άρθρου 21, περί προσπέρασης, κυκλοφορίας σε στοίχους, επιτρεπτής αλλαγής λωρίδας και κίνησης μοτοποδηλάτων και μοτοσυκλετών σε πυκνή κυκλοφορία, και της παρ. 1 του άρθρου 23, περί ταχύτητας και απόστασης μεταξύ οχημάτων, όπου σε οδοστρώματα υπάρχουν διαβάσεις πεζών, οι οποίες έχουν σημανθεί με πινακίδες ή διαγραμμίσεις και η κυκλοφορία των οχημάτων ρυθμίζεται με φωτεινή σηματοδότηση ή τροχονόμους, οι οδηγοί οχημάτων υποχρεούνται:
