βζ) την οδήγηση χωρίς ο οδηγός να κατέχει την προβλεπόμενη ισχύουσα άδεια οδήγησης, σύμφωνα με τις περ. β) και γ) της παρ. 4 του άρθρου 98, περί αδειών οδήγησης, κυρώσεων και αδειών εκπαιδευτών υποψήφιων οδηγών, και της παρ. 4 του άρθρου 100, περί αδειών οδήγησης αγροτικών μηχανημάτων και μηχανημάτων έργου, στον παραβάτη οδηγό επιβάλλονται διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για τέσσερα (4) έτη, με εξαίρεση την οδήγηση υπό την επίδραση οινοπνεύματος άνω του ορίου της περ. γ) της παρ. 7 του άρθρου 46 ή υπό την επήρεια ουσιών της παρ. 8 του άρθρου 46 και την εγκατάλειψη των περ. α) και β) της παρ. 2 του άρθρου 47, που στον παραβάτη επιβάλλεται το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για επτά (7) έτη. 4.α) Σε περίπτωση διάπραξης για τρίτη φορά μέσα σε διάστημα πέντε (5) ετών από την αμέσως προηγούμενη διάπραξη των παραβάσεων της περ. α της παρ. 3 στον παραβάτη οδηγό επιβάλλονται διοικητικό πρόστιμο δύο χιλιάδων (2.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για ένα (1) έτος, με εξαίρεση την παράβαση της περ. αδ) της παρ. 3, που στον παραβάτη επιβάλλονται διοικητικό πρόστιμο οκτώ χιλιάδων (8.000) ευρώ και αφαίρεση της άδειας οδήγησης για τέσσερα (4) έτη.
β) Σε περίπτωση διάπραξης για τρίτη φορά μέσα σε διάστημα πέντε (5) ετών από την αμέσως προηγούμενη διάπραξη των παραβάσεων της περ. β της παρ. 3, στον παραβάτη οδηγό επιβάλλονται διοικητικό πρόστιμο τεσσάρων χιλιάδων (4.000) ευρώ και το διοικητικό μέτρο της αφαίρεσης της άδειας οδήγησης για οκτώ (8) έτη, με εξαίρεση την οδήγηση υπό την επίδραση οινοπνεύματος, με ποσοστό αλκοόλ άνω του ορίου της περ. γ) της παρ. 7 του άρθρου 46 ή υπό την επήρεια ουσιών της παρ. 8 του άρθρου 46 που στον παραβάτη επιβάλλεται αφαίρεση της άδειας οδήγησης για δέκα (10) έτη και την εγκατάλειψη των περ. α) και β) της παρ. 2 του άρθρου 47, που στον παραβάτη επιβάλλεται αφαίρεση της άδειας οδήγησης δια βίου. 5. Σε περίπτωση διάπραξης της ίδιας παράβασης για τέταρτη φορά και για κάθε επόμενη φορά εντός πέντε (5) ετών από τη διάπραξη της τελευταίας παράβασης, επιβάλλονται οι κυρώσεις των περ. α) και β) της παρ. 4, αναλόγως την παράβαση. Μετά την πάροδο των πέντε (5) ετών από την διάπραξη της τελευταίας παράβασης, χωρίς νέα υποτροπή, κάθε νέα παράβαση θεωρείται ως πρώτη. 6. Για τις περιπτώσεις των παρ. 3, 4 και 5 ο παραβάτης οδηγός υποχρεούται σε εκπαίδευση και εξέταση για τη χορήγηση της άδειας οδήγησης. Το δικαίωμα συμμετοχής στην εξέταση του πρώτου εδαφίου κατοχυρώνεται μετά το πέρας του χρονικού διαστήματος αφαίρεσης της άδειας οδήγησης, μόνο με την προσκόμιση του αποδεικτικού καταβολής των διοικητικών προστίμων, σύμφωνα με το άρθρο 107, κατά περίπτωση. 7. Τα διοικητικά μέτρα του παρόντος επιβάλλονται και εκτελούνται παράλληλα και ανεξάρτητα με τις ποινικές κυρώσεις. 8. Ειδικά για τις παραβάσεις του παρόντος που επισύρουν στερητική της ελευθερίας ποινή, ως υπότροπος θεωρείται όποιος έχει καταδικαστεί αμετάκλητα σε ποινή φυλάκισης τουλάχιστον έξι (6) μηνών για οποιοδήποτε ποινικό αδίκημα του παρόντος τέλεσε εντός των προηγούμενων δέκα (10) ετών από τον χρόνο τέλεσης της πράξης.
α) Στην περίπτωση πλημμελήματος που τιμωρείται με φυλάκιση έως δύο (2) έτη, το ελάχιστο όριο της ποινής για τον υπότροπο αυξάνεται κατά τρεις (3) μήνες. Στις λοιπές περιπτώσεις πλημμελημάτων, το ελάχιστο όριο αυτής αυξάνεται κατά έξι (6) μήνες.

ΜΕΡΟΣ Δ’ ΕΞΟΥΣΙΟΔΟΤΙΚΕΣ, ΤΕΛΙΚΕΣ, ΜΕΤΑΒΑΤΙΚΕΣ  ΚΑΙ ΚΑΤΑΡΓΟΥΜΕΝΕΣ ΔΙΑΤΑΞΕΙΣ`},
  112: {title:`Εξουσιοδοτικές διατάξεις`,text:`Εξουσιοδοτικές διατάξεις
1. Για την εφαρμογή του άρθρου 7, περί σήμανσης οδών με πινακίδες:
α) Με απόφαση του Υπουργού Υποδομών και Μεταφορών μπορεί να επεκταθεί και σε άλλες κατηγορίες οδών με αντίστοιχη χρωματική κωδικοποίηση για κάθε κατηγορία, η εφαρμογή των πληροφοριακών πινακίδων Π-80 έως Π-90γ.
β) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται τα ειδικότερα ζητήματα τοποθέτησης πινακίδων της παρ. 9.
2. Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται οι λεπτομέρειες και οι προδιαγραφές, τις οποίες πληρούν οι διάφορες σημάνσεις των εργασιών που εκτελούνται στις οδούς, όπως αυτές ορίζονται στο άρθρο 13, περί σημάνσεων των εργασιών που εκτελούνται στις οδούς.
3. Για την εφαρμογή του άρθρου 14, περί εγκατάστασης μέσων σήμανσης και σηματοδότησης:
α) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται οι τεχνικές προδιαγραφές, οι όροι και ο τρόπος της κατακόρυφης και οριζόντιας σήμανσης των οδών, της σηματοδότησής τους, της σήμανσης και σηματοδότησης των εκτελούμενων έργων, της δημιουργίας ειδικών διαμορφώσεων του οδοστρώματος, της τοποθέτησης κινητών εμποδίων και κάθε άλλη συναφής λεπτομέρεια.
β) Με προεδρικό διάταγμα, που εκδίδεται μετά από πρόταση του Υπουργού Υποδομών και Μεταφορών, μπορεί να τροποποιείται ή να συμπληρώνεται το σύστημα κατακόρυφης και οριζόντιας σήμανσης και το σύστημα σηματοδότησης που προβλέπονται.
γ) Με κοινή απόφαση του Υπουργού Υποδομών και Μεταφορών και του αρμόδιου Υπουργού για τα δικαιώματα των ατόμων με αναπηρία σύμφωνα με το άρθρο 69 του ν. 4488/2017 (Α’ 137), λαμβάνονται μέτρα για τη διευκόλυνση της κυκλοφορίας ατόμων με αναπηρία, σύμφωνα με την παρ. 4.
4. Για την εφαρμογή του άρθρου 16, περί κανόνων οδικής συμπεριφοράς:
α) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται οι προδιαγραφές για τα ειδικά μέσα συγκράτησης, καθώς και εξαιρέσεις από την υποχρέωση της παρ. 5.
β) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται τα χαρακτηριστικά, οι προδιαγραφές, καθώς και κάθε άλλη αναγκαία λεπτομέρεια για την εφαρμογή της παρ. 6. Με την ίδια απόφαση καθορίζονται και οι εξαιρέσεις από την υποχρέωση αυτή.
γ) Με κοινή απόφαση των Υπουργών Παιδείας, Θρησκευμάτων και Αθλητισμού και Υποδομών και Μεταφορών λαμβάνονται τα αναγκαία μέτρα ώστε το μάθημα της οδικής κυκλοφορίας της παρ. 8, να διδάσκεται στα σχολεία, σε όλες τις βαθμίδες.
5. Για την εφαρμογή του άρθρου 17, περί οδηγών:
α) Με κοινή απόφαση των Υπουργών Υποδομών και Μεταφορών, Εσωτερικών, Προστασίας του Πολίτη και Ψηφιακής Διακυβέρνησης, εξειδικεύονται οι προϋποθέσεις τοποθέτησης συσκευών της υποπερ. αγ) της περ. α) της παρ. 1. Η απόφαση της παρούσας περίπτωσης εκδίδεται κατόπιν διαβούλευσης με την Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα και σύμφωνα με τον Γενικό Κανονισμό (ΕΕ) 2016/679 για την προστασία των φυσικών προσώπων έναντι της επεξεργασίας των δεδομένων προσωπικού χαρακτήρα και για την ελεύθερη κυκλοφορία των δεδομένων αυτών και την κατάργηση της Οδηγίας 95/46/ΕΚ, τον ν. 4624/2019 (Α’ 137) και τον ν. 4579/2018 (Α’ 201).
β) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται οι όροι, οι προϋποθέσεις και η διαδικασία θέσης σε κυκλοφορία του Λεωφορείου Αστικού Τύπου χωρίς οδηγό, της υποπερ. αε) της περ. α) της παρ. 1 του άρθρου 17, ειδικότερα τεχνικά θέματα για την ασφαλή κυκλοφορία του επί της καθορισμένης διαδρομής, καθώς και ο τρόπος υλοποίησης της κυκλοφορίας του λεωφορείου αυτού, ανά στάδια.
γ) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται τα δικαιολογητικά που συνοδεύουν το σχετικό αίτημα, οι όροι, οι προϋποθέσεις και η διαδικασία θέσης σε κυκλοφορία του οχήματος, καθώς και κάθε τεχνικό θέμα για την ασφαλή κυκλοφορία του οχήματος επί καθορισμένης διαδρομής της περ. β) της παρ. 1.
δ) Με προεδρικό διάταγμα, που εκδίδεται με πρόταση του Υπουργού Υποδομών και Μεταφορών, ορίζεται σύστημα επιβολής διοικητικών ποινών (τρόπος επιβολής ποινής, ύψος ποινών, όργανα επιβολής ποινών, περιγραφή ποινών) σε όσους παραβαίνουν την παρ. 4.
ε) Με απόφαση του Υπουργού Υποδομών και Μεταφορών και του κατά περίπτωση αρμόδιου Υπουργού καθορίζονται τα σχετικά με τον τρόπο και τη διαδικασία επανεξέτασης των οδηγών, καθώς και κάθε άλλη αναγκαία λεπτομέρεια για την εφαρμογή της παρ. 7.
6. Για την εφαρμογή του άρθρου 19, περί εκπομπών, ρύπων και θορύβων, με κοινή απόφαση των Υπουργών Περιβάλλοντος και Ενέργειας και Υποδομών και Μεταφορών καθορίζονται το επιτρεπόμενα όρια περιεκτικότητας σε βλαπτικές ουσίες για την υγεία του ανθρώπου και σε προϊόντα αερίων που ρυπαίνουν το περιβάλλον, που εκπέμπονται από τα οδικά οχήματα, καθώς επίσης και τα επιτρεπόμενα όρια των θορύβων που προκαλούνται από αυτά. Όλα τα πιο πάνω όρια μπορούν να κλιμακώνονται ανάλογα με την ηλικία του κινητήρα και με άλλα τεχνικά χαρακτηριστικά του οχήματος.
7. Για την εφαρμογή του άρθρου 24, περί ορίων ταχύτητας, αρμοδιότητας καθορισμού τους, ελέγχου τήρησής τους, κατηγοριών παραβάσεων και περί κυρώσεων για μη τήρηση ορίων ταχύτητας, ελλιπούς εξοπλισμού επαγγελματικών οχημάτων και παρεμβάσεων σε αυτόν, κατοχής μηχανισμών παρεμπόδισης ελέγχου ταχύτητας, μη ορθής χρήσης Ελαφρού Προσωπικού Ηλεκτρικού Οχήματος:
α) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται τα ανώτατα επιτρεπόμενα όρια ταχύτητας για τα φορτηγά αυτοκίνητα και τους συνδυασμούς αυτών, που μεταφέρουν επικίνδυνα φορτία, που είναι χαμηλότερα εκείνων της παρ. 2, αναλόγως της επικινδυνότητας του μεταφερομένου φορτίου και των τεχνικών προδιαγραφών του μεταφορικού μέσου.
β) Με κοινή απόφαση των Υπουργών Προστασίας του Πολίτη και Υποδομών και Μεταφορών μπορούν να μεταβάλλονται τα οριζόμενα όρια ταχύτητας.
γ) Με βάση μελέτες που έχουν εκπονηθεί ή εγκριθεί από ή για λογαριασμό των αρμόδιων τεχνικών υπηρεσιών και με απόφαση του οικείου δημοτικού ή περιφερειακού συμβουλίου και μετά από έγκριση της Αποκεντρωμένης Διοίκησης σύμφωνα με τις διαδικασίες της παρ. 1 του άρθρου 55, περί μέτρων ρύθμισης οδικής κυκλοφορίας δύναται να καθορίζονται και να μεταβάλλονται τα ανώτατα όρια ταχύτητας στις οδούς για τις οποίες έχουν την αρμοδιότητα επίβλεψης και συντήρησης. Τα όρια αυτά είναι κατώτερα των ανωτάτων ορίων που προβλέπονται στην παρ. 2 του άρθρου 24. Ειδικά στις περιπτώσεις που εμπίπτουν στο πεδίο εφαρμογής του πρώτου εδαφίου της παρ. 1 του άρθρου 24, τα όρια μπορούν να ανέρχονται έως και τα πενήντα (50) χιλιόμετρα την ώρα.
δ) Για τους αυτοκινητοδρόμους, όπως ορίζονται με τις σχετικές αποφάσεις του Υπουργού Υποδομών και Μεταφορών, τα όρια ταχύτητας, εκτός των ανωτάτων επιτρεπόμενων ορίων, που προβλέπονται από το άρθρο αυτό, καθορίζονται και μεταβάλλονται ύστερα από μελέτη και με απόφαση του Υπουργού Υποδομών και Μεταφορών.
ε) Για τις οδούς ταχείας κυκλοφορίας και το πρωτεύον εθνικό οδικό δίκτυο, όπως αυτό ορίζεται με τις σχετικές αποφάσεις του Υπουργού Υποδομών και Μεταφορών, τα όρια ταχύτητας, εκτός των ανωτάτων επιτρεπόμενων ορίων του παρόντος, καθορίζονται και μεταβάλλονται ύστερα από μελέτη των τεχνικών υπηρεσιών των φορέων που έχουν την αρμοδιότητα συντήρησης των οδών αυτών και μετά από έγκριση της Αποκεντρωμένης Διοίκησης, σύμφωνα με την παρ. 1 του άρθρου 55. Τα όρια ταχύτητας που ορίζονται στις αποφάσεις που εκδίδονται σύμφωνα με την παρούσα και τις περ. γ) και δ) εφαρμόζονται από την τοποθέτηση των προβλεπόμενων πινακίδων στις ανωτέρω οδούς.
στ) Με απόφαση του Υπουργού Υποδομών και Μεταφορών μπορεί να επιβάλλεται για τον έλεγχο των στοι χείων πορείας (διανυόμενα χιλιόμετρα, διακοπές πορείας και χρόνος, ταχύτητα) των φορτηγών, λεωφορείων και άλλων κατηγοριών αυτοκινήτων, ο εφοδιασμός τους με αυτόματη συσκευή καταγραφής των στοιχείων αυτών και με μηχανισμό περιορισμού της ταχύτητας του οχήματος, καθώς και η υποχρέωση λειτουργίας αυτών. Με την ίδια απόφαση καθορίζονται ο τύπος και οι τεχνικές προδιαγραφές των συσκευών, καθώς και κάθε άλλη αναγκαία λεπτομέρεια.
ζ) Με κοινή απόφαση των Υπουργών Προστασίας του Πολίτη, Υποδομών και Μεταφορών και Ψηφιακής Διακυβέρνησης καθορίζονται οι τεχνικές προδιαγραφές των ειδικών συσκευών της περ. στ καθώς και κάθε άλλη λεπτομέρεια αναγκαία για την εφαρμογή της.
8. Για την εφαρμογή του άρθρου 36, περί φόρτωσης οχημάτων, με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται οι ειδικότεροι κανόνες φόρτωσης και μεταφοράς φορτίων ανάλογα με τα διάφορα είδη φορτίου, τις κατηγορίες των οχημάτων μεταφοράς και τον τρόπο μεταφοράς, καθώς και κάθε άλλο ειδικότερο, τεχνικό και λεπτομερειακό θέμα.
9. Για την εφαρμογή του άρθρου 38, περί στάσης και στάθμευσης:
α) Με κοινή απόφαση των Υπουργών Εσωτερικών, Προστασίας του Πολίτη, Υποδομών και Μεταφορών και Ναυτιλίας και Νησιωτικής Πολιτικής δύνανται να καθορίζονται οι λεπτομέρειες εφαρμογής της παρ. 6 και ειδικότερα ζητήματα, όπως οι δαπάνες φύλαξης και συντήρησης.
β) Με κοινή απόφαση των Υπουργών Εσωτερικών, Εθνικής Οικονομίας και Οικονομικών, Υποδομών και Μεταφορών και Προστασίας του Πολίτη δύνανται να ορίζονται τα ειδικότερα θέματα και οι λεπτομέρειες για την εφαρμογή της παρ. 10.
γ) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται τα κριτήρια χωροθέτησης των θέσεων στάσης/στάθμευσης (πιάτσες) των επιβατικών αυτοκινήτων δημόσιας χρήσης (ΤΑΞΙ), καθώς και κάθε άλλη λεπτομέρεια για την εφαρμογή της περ. β) της παρ. 17.
δ) Ο καθορισμός των θέσεων στάσης, αφετηρίας και στάθμευσης σύμφωνα με την περ. α) της παρ. 17, λαμβάνει χώρα για τις μεν περιοχές αρμοδιότητας του Οργανισμού Αστικών Συγκοινωνιών Αθηνών (ΟΑΣΑ) και του Οργανισμού Συγκοινωνιακού Έργου Θεσσαλονίκης (ΟΣΕΘ) από αυτούς, ύστερα από ειδική μελέτη αυτών, προκειμένου δε για τις λοιπές περιοχές της χώρας με απόφαση του οικείου Δημοτικού ή Περιφερειακού Συμβουλίου ή της δημοτικής επιτροπής στο οδικό δίκτυο αρμοδιότητάς τους με βάση μελέτες που έχουν εκπονηθεί από ή για λογαριασμό των αρμοδίων Τεχνικών Υπηρεσιών των Οργανισμών Τοπικής Αυτοδιοίκησης α’ και β’ βαθμού για τον καθορισμό τέτοιων θέσεων και με τις οποίες εξασφαλίζεται η ομαλή, ασφαλής και απρόσκοπτη διεξαγωγή της κυκλοφορίας στις θέσεις αυτές.
ε) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται οι προδιαγραφές των προεξοχών, καθώς και των οριοδεικτών και η διαδικασία της τοποθέτησής τους σύμφωνα με την περ. α) της παρ. 17, περί τοποθέτησης αυτών σε στάσεις μέσων μαζικής μεταφοράς, ειδικών προεξοχών επί του οδοστρώματος για την επιβίβαση και την αποβίβαση επιβατών και τη διασφάλιση της προσβασιμότητας των ατόμων με αναπηρία και των εμποδιζομένων ατόμων γενικότερα.
στ) Για τον καθορισμό των θέσεων αφετηρίας, στάσης/στάθμευσης (πιάτσες) των επιβατηγών αυτοκινήτων δημοσίας χρήσης (ΤΑΞΙ) στις κατοικημένες περιοχές σύμφωνα με την περ. β) της παρ. 17, στις περιπτώσεις:
αα) αρμοδιότητας του ΟΑΣΑ και του ΟΣΕΘ, ο καθορισμός γίνεται από τους φορείς αυτούς, έπειτα από πρόταση του οικείου Δημοτικού ή Περιφερειακού Συμβουλίου ή της δημοτικής επιτροπής στο οδικό δίκτυο αρμοδιότητάς τους και
αβ) για τις λοιπές περιοχές της χώρας ο καθορισμός γίνεται με βάση μελέτες που έχουν εκπονηθεί από ή για λογαριασμό των αρμοδίων τεχνικών υπηρεσιών των Οργανισμών Τοπικής Αυτοδιοίκησης α’ και β’ βαθμού, με απόφαση του οικείου Δημοτικού ή Περιφερειακού Συμβουλίου ή της δημοτικής επιτροπής στο οδικό δίκτυο αρμοδιότητάς τους.
ζ) Με απόφαση του οικείου Δημοτικού Συμβουλίου ή της δημοτικής επιτροπής στο οδικό δίκτυο αρμοδιότητάς τους καθορίζονται σε κατοικημένες περιοχές ειδικοί χώροι στάθμευσης Ε.Π.Η.Ο. σύμφωνα με την παρ. 18.
10. Για την εφαρμογή του άρθρου 46, περί οδήγησης υπό την επίδραση οινοπνεύματος, φαρμάκων ή τοξικών ουσιών, με κοινές αποφάσεις των Υπουργών Υγείας, Προστασίας του Πολίτη και Υποδομών και Μεταφορών μπορεί να ορίζεται και μικρότερο ποσοστό από το αναφερόμενο στο πρώτο εδάφιο της παρ. 1, να καθοριστούν ειδικές κατηγορίες οδηγών με μικρότερα ποσοστά, προσαρμοζόμενων αναλόγως και των ορίων της παρ. 7, να εξειδικεύονται τα όρια τοξικών ουσιών ή φαρμάκων, που ενδέχεται να επηρεάζουν την ικανότητα του οδηγού, να καθορίζονται οι επιστημονικοί τρόποι και η διαδικασία διαπίστωσης της χρήσης οινοπνεύματος, τοξικών ουσιών ή φαρμάκων σύμφωνα με το άρθρο 46, καθώς και κάθε άλλο σχετικό θέμα.
11. Με απόφαση του Υπουργού Προστασίας του Πολίτη καθορίζονται οι λεπτομέρειες για την εφαρμογή του άρθρου 47, περί συμπεριφοράς σε περίπτωση ατυχήματος.
12. Με απόφαση του Υπουργού Υποδομών και Μεταφορών μπορεί να παρέχεται το δικαίωμα να τοποθετούνται τα φώτα της παρ. 1 του άρθρου 48, περί οχημάτων άμεσης ανάγκης και έργων στις οδούς και σε άλλες κατηγορίες οχημάτων.
13. Με κοινή απόφαση των Υπουργών Προστασίας του Πολίτη και Υποδομών και Μεταφορών καθορίζονται οι λεπτομέρειες για την εφαρμογή του άρθρου 50, περί ακινητοποίησης οχημάτων, όπως η διαδικασία, ο τρόπος και οι περιπτώσεις ακινητοποίησης του οχήματος.
14. Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται οι προδιαγραφές των επενδυτών της παρ. 4 του άρθρου 51, περί εργασιών και εναπόθεσης υλικών στις οδούς.
15. Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται οι λεπτομέρειες για την εφαρμογή της παρ. 3 του άρθρου 52, περί κατάληψης τμήματος οδού και πεζοδρομίου. 16. Για την εφαρμογή του άρθρου 55, περί μέτρων ρύθμισης οδικής κυκλοφορίας:
α) με αποφάσεις του Περιφερειακού ή Δημοτικού Συμβουλίου στο οδικό δίκτυο αρμοδιότητάς τους λαμβάνονται τα μέτρα της παρ. 1 του άρθρου 55, με βάση μελέτες που έχουν εκπονηθεί από ή για λογαριασμό των αρμοδίων τεχνικών υπηρεσιών τους. Οι αποφάσεις του προηγούμενου εδαφίου, εγκρίνονται από τον Γραμματέα της Αποκεντρωμένης Διοίκησης, ο οποίος αποφαίνεται εντός αποκλειστικής προθεσμίας δύο (2) μηνών από την κοινοποίηση της απόφασης του Περιφερειακού Συμβουλίου και εντός αποκλειστικής προθεσμίας ενός (1) μηνός από την κοινοποίηση της απόφασης του Δημοτικού Συμβουλίου και αν η προθεσμία παρέλθει άπρακτη, τεκμαίρεται η χορήγηση της έγκρισης. Κατ’ εξαίρεση, τα μέτρα του πρώτου εδαφίου της παρ. 1 του ανωτέρω άρθρου, που καθορίζονται στις μελέτες που έχουν εκπονηθεί ή εγκριθεί από τη Γενική Διεύθυνση Συγκοινωνιακών Υποδομών της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών ή της Αποκεντρωμένης Διοίκησης, λαμβάνονται με αποφάσεις των κατά τόπους αρμοδίων Περιφερειακών Αστυνομικών Διευθύνσεων ή Διευθύνσεων Τροχαίας, όταν αυτά αφορούν:
αα) τους αυτοκινητόδρομους, τις οδούς ταχείας κυκλοφορίας και το εθνικό οδικό δίκτυο της χώρας, τις παρακαμπτήριες οδούς αυτών και αυτές που τα επηρεάζουν,
αβ) τα εκτελούμενα ή υπάρχοντα ή προγραμματιζόμενα συγκοινωνιακά έργα του Υπουργείου Υποδομών και Μεταφορών στο αστικό και υπεραστικό δίκτυο,
αγ) το βασικό οδικό δίκτυο, όπως αυτό ορίζεται με αποφάσεις του Υπουργού Υποδομών και Μεταφορών: i) Των δήμων της Περιφέρειας Αττικής, εκτός των δήμων της Περιφερειακής Ενότητας Νήσων, ii) του πολεοδομικού συγκροτήματος Θεσσαλονίκης, ήτοι των Δήμων Θεσσαλονίκης, Κορδελιού Ευόσμου, Παύλου Μελά, Αμπελοκήπων-Μενεμένης, Καλαμαριάς, Νεάπολης-Συκεών, πλην της δημοτικής ενότητας Πεύκων, Πυλαίας-Χορτιάτη, πλην της δημοτικής ενότητας Χορτιάτη, της δημοτικής ενότητας Θέρμης του Δήμου Θέρμης και της δημοτικής κοινότητας Καλοχωρίου του Δήμου Δέλτα, iii) του πολεοδομικού συγκροτήματος Βόλου, ήτοι των δημοτικών ενοτήτων Βόλου, Νέας Ιωνίας, Αισωνίας και Ιωλκού του Δήμου Βόλου, iv) Του πολεοδομικού συγκροτήματος Ηρακλείου, ήτοι των δημοτικών ενοτήτων Ηρακλείου και Νέας Αλικαρνασσού του Δήμου Ηρακλείου και της δημοτικής Ενότητας Γαζίου του Δήμου Μαλεβιζίου, v) του πολεοδομικού συγκροτήματος Πατρών, ήτοι των δημοτικών κοινοτήτων Ανατολικού, Αρκτικού, Κεντρικού και Νότιου Τομέα Δήμου Πατρέων, της δημοτικής κοινότητας Ρίου (Αγίου Γεωργίου Ρίου), της τοπικής κοινότητας Ακταίου (Βερναδαίικων) και της δημοτικής κοινότητας Παραλίας, vi) Του πολεοδομικού συγκροτήματος Λάρισας, ήτοι της δημοτικής ενότητας Λαρισαίων.
αδ) Τις παρακαμπτήριες οδούς του βασικού δικτύου της υποπερ. αγ) και τις οδούς που επηρεάζουν το ανωτέρω δίκτυο.
αε) Την κυκλοφορία στο οδικό δίκτυο επί των ορίων, μεταξύ όμορων οργανισμών τοπικής αυτοδιοίκησης. Οι αποφάσεις της παρούσας γνωστοποιούνται άμεσα στις κατά τόπους Υπηρεσίες Τροχαίας ή στις Αστυνομικές Υπηρεσίες που ασκούν καθήκοντα Τροχαίας, καθώς και στις αρμόδιες υπηρεσίες κυκλοφορίας της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών.
β) Με απόφαση του Υπουργού Υποδομών και Μεταφορών προσδιορίζεται το δίκτυο οδών του πέμπτου εδαφίου της παρ. 1 του άρθρου 55.
γ) Με απόφαση του Γενικού Διευθυντή Συγκοινωνιακών Υποδομών της Γενικής Γραμματείας Υποδομών του Υπουργείου Υποδομών και Μεταφορών λαμβάνονται τα μέτρα των μελετών που προβλέπονται στο έκτο εδάφιο της παρ. 1 του άρθρου 55.
δ) Με απόφαση του Υπουργού Υποδομών και Μεταφορών γίνεται η ανάθεση του έβδομου εδαφίου της παρ. 1 του άρθρου 55.
ε) Με απόφαση των κατά τόπους αρμοδίων Διευθύνσεων Αστυνομίας ή Διευθύνσεων Τροχαίας, μπορούν να λαμβάνονται τα προσωρινά μέτρα της παρ. 2 του άρθρου 55.
στ) Με απόφαση του οικείου Δημάρχου, γίνεται ο καθορισμός της περ. α) της παρ. 4 του άρθρου 55.
ζ) Με απόφαση του Υπουργού Υποδομών και Μεταφορών, μετά από εισήγηση του κατά περίπτωση αρμόδιου οργανισμού με βάση τον στρατηγικό και επιχειρησιακό σχεδιασμό τους, γίνεται ο καθορισμός της περ. β) της παρ. 4 του άρθρου 55. Με όμοια απόφαση που λαμβάνεται μετά από σχετική μελέτη και πρόταση των αρμόδιων υπηρεσιών εκπόνησης ή έγκρισης των κυκλοφοριακών μελετών, είναι δυνατόν να επιτρέπεται στις οδούς ή λωρίδες του προηγούμενου εδαφίου η κυκλοφορία, δικύκλων μοτοσικλετών, μοτοποδηλάτων και ποδηλάτων, καθώς επίσης και η εφαρμογή των μέτρων αυτών για ορισμένες ημέρες και ώρες. Με απόφαση του Υπουργού Υποδομών και Μεταφορών εγκρίνονται η επιλογή του είδους και του υλικού διαχωρισμού, η συνοδευτική οριζόντια και κατακόρυφη σήμανση για όλες τις περιπτώσεις καθορισμού οδών ή λωρίδων της περ. β) της παρ. 4 του άρθρου 55. Με κοινή απόφαση των Υπουργών Προστασίας του Πολίτη και Υποδομών και Μεταφορών καθορίζεται η αρμόδια Υπηρεσία Τροχαίας και οι διαδικασίες για την αφαίρεση της άδειας κυκλοφορίας και οδήγησης στους παραβάτες της παρ. 6 του άρθρου 55, για ορισμένο χρονικό διάστημα, από δέκα (10) ημέρες μέχρι τρεις (3) μήνες. Με κοινή απόφαση των Υπουργών Υποδομών και Μεταφορών, Υγείας και του κατά περίπτωση αρμόδιου Υπουργού, ορίζονται επιπλέον εξαιρέσεις από την απαγόρευση κυκλοφορίας επιβατικών δημόσιας χρήσης (Ε.Δ.Χ.) στις λωρίδες των περ. α) και β) της παρ. 4 του άρθρου 55, για μεταφορά προσώπων για λόγους υγείας, όπως για τη μεταφορά νεφροπαθών ή καρκινοπαθών για την εξυπηρέτηση των θεραπευτικών τους αναγκών, οι προϋποθέσεις και κάθε άλλη αναγκαία λεπτομέρεια για την εφαρμογή του παρόντος.
η) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται τα χαρακτηριστικά, οι προδιαγραφές, οι προϋποθέσεις και κάθε άλλη λεπτομέρεια σχετικά με την εφαρμογή της περ. δ της παρ. 4 του άρθρου 55.
θ) Με απόφαση του οικείου Δημοτικού Συμβουλίου μπορεί να ορίζεται η δημιουργία ειδικών διαμορφώσεων του οδοστρώματος ή η τοποθέτηση κινητών εμποδίων για τις οδούς του πρώτου εδαφίου της παρ. 5 του άρθρου 55.
ι) Με απόφαση του Υπουργού Υποδομών και Μεταφορών καθορίζονται οι κατηγορίες των οδών στις οποίες επιτρέπεται η δημιουργία των διαμορφώσεων ή η τοποθέτηση κινητών εμποδίων της περ. θ), οι προϋποθέσεις δημιουργίας ή τοποθέτησής τους, οι προδιαγραφές και τα τεχνικά χαρακτηριστικά τους και η ειδική σήμανση που πρέπει να εφαρμόζεται, κατά περίπτωση.`},
  113: {title:`Τελικές διατάξεις`,text:`Τελικές διατάξεις
1. Καταργείται η παρ. 8 του άρθρου δεύτερου του ν. 4388/2016 (Α’ 93), περί Συστήματος Ηλεκτρονικής Διαχείρισης Οδικών Υποδομών Υπηρεσία Οδικών Τελών και Ηλεκτρονικής Διαχείρισης Οδικών Υποδομών. Κάθε αναφορά στην παράγραφο αυτή νοείται ως αναφορά στην παρ. 9 του άρθρου 55 του παρόντος.
2. Κατά την κατάρτιση, σύμφωνα με το άρθρο 185 του Κώδικα Ποινικής Δικονομίας (ν. 4620/2019, Α’ 96), του πίνακα πραγματογνωμόνων και για τα θέματα τα οποία σχετίζονται με τα συμβάντα από τροχαία ατυχήματα περιλαμβάνονται σε αυτόν πρόσωπα, τα οποία έχουν τεχνική επιστημονική κατάρτιση ή εμπειρία για θέματα κυκλοφορίας κατά προτίμηση από δημόσιους υπαλλήλους ή συνταξιούχους, που υποδεικνύονται από το Υπουργείο Προστασίας του Πολίτη, το Υπουργείο Υποδομών και Μεταφορών, το Τεχνικό Επιμελητήριο της Ελλάδος και το νομικό πρόσωπο που εκπροσωπεί στη χώρα μας τη Διεθνή Ομοσπονδία Αυτοκινήτου.
3. Παραπομπές στον Κώδικα Οδικής Κυκλοφορίας (ν. 2696/1999, Α’57) νοούνται, μετά από την έναρξη ισχύος του παρόντος, ως παραπομπές στα αντίστοιχα άρθρα του παρόντος.`},
  114: {title:`Μεταβατικές διατάξεις`,text:`Μεταβατικές διατάξεις
1. Μέχρι την 1η Ιανουαρίου 2026 διατηρείται το γενικό όριο ταχύτητας των πενήντα (50) χιλιομέτρων την ώρα σύμφωνα με την παρ. 1 του άρθρου 20 του Κώδικα Οδικής Κυκλοφορίας (ν. 2696/1999, Α’ 57). Μέχρι την 1η Ιανουαρίου 2026 διατηρείται το ανώτατο επιτρεπόμενο όριο ταχύτητας των σαράντα (40) χιλιομέτρων, για τα φορτηγά οχήματα που μεταφέρουν πρόσωπα εντός κατοικημένων περιοχών.
2. Η αφαίρεση της άδειας οδήγησης για επτά (7) έτη της υποπερ. βε) της περ. β) της παρ. 3 του άρθρου 110 του παρόντος, εφαρμόζεται και για τις παραβάσεις της παρ. 6 του άρθρου 28 του ν. 4530/2018 (Α’ 59) που βεβαιώθηκαν στο χρονικό διάστημα από την ημερομηνία έναρξης ισχύος του ν. 4530/2018 έως την ημερομηνία έναρξης ισχύος του παρόντος.
3. Μέχρι τη θέση σε ισχύ της κοινής απόφασης της παρ. 40 του άρθρου 112 του παρόντος εξακολουθεί να ισχύει η υπό στοιχεία οικ. 21504/2601/25.4.2007 κοινή απόφαση των Υπουργών Μεταφορών και Επικοινωνιών και Δημόσιας Τάξης «Σύστημα Ελέγχου Συμπεριφοράς Οδηγών Αυτοκινήτων, Μοτοσικλετών και Μοτοποδηλάτων (Σ.Ε.Σ.Ο.)» (Β’ 623) και παραβάσεις που έχουν τελεσθεί υπό την ισχύ της λαμβάνονται υπόψη κατά την εφαρμογή των κυρώσεων του άρθρου 110, περί συστήματος ελέγχου συμπεριφοράς των οδηγών.
4. Κανονιστικές πράξεις που έχουν εκδοθεί κατ’ εξουσιοδότηση του Κώδικα Οδικής Κυκλοφορίας (ν. 2696/1999, Α’ 57), εξακολουθούν να ισχύουν.`},
  115: {title:`Καταργούμενες διατάξεις`,text:`ΜΕΡΟΣ Ε’ ΛΟΙΠΕΣ ΔΙΑΤΑΞΕΙΣ
ΚΕΦΑΛΑΙΟ Α’ ΔΙΑΤΑΞΕΙΣ ΓΙΑ ΤΗΝ ΥΠΑΙΘΡΙΑ ΔΙΑΦΗΜΙΣΗ
Καταργούμενες διατάξεις Από την ισχύ του παρόντος καταργούνται σύμφωνα με το άρθρο 129:
α) Τα άρθρα 27, περί δυνατότητας καθορισμού των κατηγοριών παραβάσεων που αφορούν τη ρύθμιση κυκλοφορίας ποδηλάτων με απόφαση του Υπουργού Υποδομών και Μεταφορών, 28, περί κατάταξης των παραβάσεων που προβλέπονται από τον Κώδικα Οδικής Κυκλοφορίας με βάση την επικινδυνότητά τους για τη ζωή, την υγεία και τη σωματική ακεραιότητα των χρηστών του οδικού δικτύου, την υποχρέωση για ιδιαίτερη μέριμνα και προστασία για τα άτομα με αναπηρία, την πρόληψη της πρόκλησης τροχαίων ατυχημάτων, καθώς και τις επιπτώσεις της παράβασης στην οδική ασφάλεια και 29 περί μεταβατικών προβλέψεων, του ν. 4530/2018 (Α’ 59),
β) ο Κώδικας Οδικής Κυκλοφορίας (ν. 2696/1999, Α’ 57), με την εξαίρεση των άρθρων 86Α, 87Α, 90Α και 90Β.
ΜΕΡΟΣ Ε’ ΛΟΙΠΕΣ ΔΙΑΤΑΞΕΙΣ
ΚΕΦΑΛΑΙΟ Α’ ΔΙΑΤΑΞΕΙΣ ΓΙΑ ΤΗΝ ΥΠΑΙΘΡΙΑ ΔΙΑΦΗΜΙΣΗ`},
  116: {title:`Προσθήκη χώρων στους οποίους απαγορεύεται η υπαίθρια διαφήμιση και πρόβλεψη εξαιρέσεων - Τροποποίηση παρ. 1 και 2 άρθρου 2 ν. 2946/2001`,text:`Προσθήκη χώρων στους οποίους απαγορεύεται η υπαίθρια διαφήμιση και πρόβλεψη εξαιρέσεων - Τροποποίηση παρ. 1 και 2 άρθρου 2 ν. 2946/2001 Στο άρθρο 2 του ν. 2946/2001 (Α’ 224), περί χώρων στους οποίους απαγορεύεται η υπαίθρια διαφήμιση, επέρχονται οι ακόλουθες τροποποιήσεις:
α) στην παρ. 1,αα) η περ. η’ αντικαθίσταται, αβ) προστίθενται περ. θ’ και ι’,β) στην παρ. 2, βα) στην περ. α’, (i) μετά από τις λέξεις «προσόψεις των κτιρίων» προστίθενται οι λέξεις «, σε κάθε επιφάνεια ορατή από τους χρήστες των παρακείμενων οδών», (ii) στο τέλος της περίπτωσης προστίθενται οι λέξεις «εξαιρουμένης της ανάρτησης διαφημίσεων επί είκοσι τοις εκατό (20%) της επιφάνειας των καλυμμάτων των ικριωμάτων σε κτίρια των οποίων οι όψεις ανακαινίζονται κατ’ εφαρμογή προγράμματος αποκατάστασης και συντήρησης των όψεων κτιρίων της παρ. 3α του άρθρου 34 του ν. 3164/2003 (Α’ 176)»,ββ) στην περ. γ’, οι λέξεις «, πέρα από το ιδεατό στερεό του οικοπέδου και πάνω στην οροφή του κτιρίου» αντικαθίστανται από τις λέξεις «πάνω στην οροφή, σε κάθε εσωτερική ή εξωτερική επιφάνεια ορατή από τους χρήστες των οδών, περιμετρικά του κτιρίου, σε εσωτερικές βιτρίνες ορατές από την οδό όψεως όπως και εντός των ορίων του ιδεατού στερεού του οικοπέδου» και οι παρ. 1 και 2 διαμορφώνονται ως εξής: «1. Η προβολή υπαίθριας διαφήμισης απαγορεύεται στους εξής χώρους:
α. Σε αρχαιολογικούς χώρους, ιστορικούς τόπους και στις ζώνες προστασίας γύρω από αυτούς, σε παραδοσιακούς οικισμούς, στον περιβάλλοντα χώρο τους, καθώς και σε τόπους που χαρακτηρίζονται ως ιδιαίτερου φυσικού κάλλους, σύμφωνα με τις διατάξεις που ισχύουν κάθε φορά, εξαιρουμένων των μέσων της περ. γ’ της παρ. 2 του άρθρου1.
β. Σε μνημεία, στον περιβάλλοντα χώρο τους ή και στις ζώνες προστασίας τους και παραδοσιακά κτίρια.
γ. Σε κτίρια στα οποία στεγάζονται δημόσιες υπηρεσίες και υπηρεσίες των οργανισμών τοπικής αυτοδιοίκησης και άλλων νομικών προσώπων δημοσίου δικαίου.
δ. Σε κοιμητήρια, κτίρια ναών κάθε θρησκείας και δόγματος, καθώς και στον περιβάλλοντα χώρο τους.
ε. Σε επιφάνειες τεχνικών έργων φορέων του δημόσιου τομέα, όπως αυτός προσδιορίζεται στο άρθρο 14 παρ. 1 του ν. 2190/1994 (Α’ 28), όπως τοίχοι αντιστήριξης, γέφυρες, σήραγγες, το κατάστρωμα δρόμων και πεζοδρομίων, καθώς και στύλοι και υποσταθμοί εγκαταστάσεων κοινής ωφέλειας.
στ. Σε στοές κτιρίων.
ζ. Σε πινακίδες δημόσιας πληροφόρησης, σε πινακίδες οδικής σήμανσης και στους φωτεινούς σηματοδότες οδικής κυκλοφορίας.
η. Σε πεζοδρόμια, με εξαίρεση τα πεζοδρόμια μέσα σε χώρους σιδηροδρομικών, λιμενικών και αεροπορικών σταθμών και επί των στεγάστρων αφετηριών ή στάσεων αναμονής επιβατών, αστικών και υπεραστικών συγκοινωνιών, σύμφωνα με την υποπερ. ββ) της περ. α’ και την περ. γ’ της παρ. 2 του άρθρου 1. Ειδικότερα για τις εγκαταστάσεις υπαίθριων διαφημίσεων σε πεζοδρόμια πλευράς πόλης αεροσταθμών, επιπλέον του άρθρου 219 του ν. 4782/2021 (Α’ 36) και της απόφασης της παρ. 2 αυτού, εξασφαλίζεται με μέριμνα του φορέα λειτουργίας, ότι τηρούνται οι προϋποθέσεις των περ. c και d του άρθρου 9 του Κανονισμού EASA EE 139/2014 «Monitoring of aerodrome surroundings» και οι απαιτήσεις των προδιαγραφών πιστοποίησης CS ADR. OPS.B.075 «Safeguarding of aerodromes» AMC1/(d)(2). θ. Σε οχήματα, εξαιρουμένων των οχημάτων σιδηροδρόμων, τροχιοδρόμων και κάθε τύπου οχημάτων που εκτελούν δημόσια, δημοτική, αστική και υπεραστική συγκοινωνία σύμφωνα με την περ. γ’ της παρ. 2 του άρθρου 1, καθώς και των οχημάτων της παρ. 5 του άρθρου 36 του ν. 3710/2008 (Α’ 216). ι. Από θαλάσσης, με εξαίρεση τα επιβατηγά και οχηματαγωγά πλοία, δρομολογημένα σε τακτική γραμμή επιβατικών μεταφορών.
2. Απαγορεύεται:
α. Η ανάρτηση πανώ, αεροπανώ ή άλλων όμοιων αντικειμένων για οποιονδήποτε λόγο, σε οδούς, πλατείες ή άλλους κοινόχρηστους χώρους, στις προσόψεις των κτιρίων, σε κάθε επιφάνεια ορατή από τους χρήστες των παρακείμενων οδών και στους ακάλυπτους χώρους, καθώς και επί της ρυμοτομικής γραμμής, όταν υπάρχει πρασιά, εξαιρουμένης της ανάρτησης διαφημίσεων επί του είκοσι τοις εκατό (20%) της επιφάνειας των καλυμμάτων των ικριωμάτων σε κτίρια των οποίων οι όψεις ανακαινίζονται κατ’ εφαρμογή προγράμματος αποκατάστασης και συντήρησης των όψεων κτιρίων της παρ. 3α του άρθρου 34 του ν. 3164/2003 (Α’ 176)
β. Η τοποθέτηση σε κατοικημένες περιοχές ενδεικτικών πινακίδων που προσδιορίζουν τη θέση ή τη διεύθυνση ιδιωτικών επιχειρήσεων ή καταστημάτων. Σε ειδικές περιπτώσεις, όταν πρόκειται για καταστήματα που πωλούν είδη ή παρέχουν υπηρεσίες άμεσης ανάγκης, ιδίως φαρμακεία, κέντρα υγείας, διαγνωστικά εργαστήρια, πολυϊατρεία και νοσοκομεία, η τοποθέτηση ενδεικτικών πινακίδων μπορεί να επιτραπεί, μετά από προηγούμενη άδεια του Δημοτικού Συμβουλίου κατά τα οριζόμενα στο άρθρο 7.
γ. Η προβολή έντυπων, χειρόγραφων, φωτεινών ή φωτιζόμενων και ηλεκτρονικών ή άλλων διαφημίσεων πάνω στην οροφή, σε κάθε εσωτερική ή εξωτερική επιφάνεια ορατή από τους χρήστες των οδών, περιμετρικά του κτιρίου, σε εσωτερικές βιτρίνες ορατές από την οδό όψεως, όταν αφορούν σε προϊόντα που δεν σχετίζονται με τη δραστηριότητα της επιχείρησης που κατέχει τη βιτρίνα, όπως και εντός των ορίων του ιδεατού στερεού του οικοπέδου.»`},
  117: {title:`Χώροι στους οποίους επιτρέπεται η υπαίθρια διαφήμιση - Τροποποίηση παρ. 1 και 3 άρθρου 3 ν. 2946/2001`,text:`Χώροι στους οποίους επιτρέπεται η υπαίθρια διαφήμιση - Τροποποίηση παρ. 1 και 3 άρθρου 3 ν. 2946/2001
1. Στην παρ. 1 του άρθρου 3 του ν. 2946/2001 (Α’ 224), περί χώρων στους οποίους επιτρέπεται η υπαίθρια διαφήμιση, επέρχονται οι ακόλουθες τροποποιήσεις:
α) στο δεύτερο εδάφιο οι λέξεις «η οποία εκδίδεται κατά τους τρεις τελευταίους μήνες πριν από τη λήξη του ημερολογιακού έτους και ισχύει για τα επόμενα τρία (3) έτη» αντικαθίστανται από τις λέξεις «και ισχύει για τα επόμενα τρία (3) έως πέντε (5) έτη, εφόσον η απόφαση λαμβάνεται με απλή πλειοψηφία, και έως δώδεκα (12) έτη, εφόσον η απόφαση λαμβάνεται με πλειοψηφία των τριών πέμπτων (3/5) του συνόλου των μελών του»,
β) στο τρίτο εδάφιο προστίθεται η λέξη «την»,
γ) προστίθεται τέταρτο εδάφιο, και η παρ. 1 διαμορφώνεται ως εξής: «1. Εντός των διοικητικών τους ορίων, οι Οργανισμοί Τοπικής Αυτοδιοίκησης (Ο.Τ.Α.) α’ βαθμού μπορούν να καθορίζουν κατάλληλους χώρους, στους οποίους και μόνον επιτρέπεται να τοποθετούνται ειδικά διαμορφωμένα πλαίσια για την προβολή των διαφημίσεων που αναφέρονται στην περ. αα’ της παρ. 2 του άρθρου 1. Ο καθορισμός γίνεται με απόφαση του δημοτικού συμβουλίου και ισχύει για τα επόμενα τρία (3) έως πέντε (5) έτη, εφόσον η απόφαση λαμβάνεται με απλή πλειοψηφία, και έως δώδεκα (12) έτη, εφόσον η απόφαση λαμβάνεται με πλειοψηφία των τριών πέμπτων (3/5) του συνόλου των μελών του. Με την ίδια απόφαση μπορεί να αποφασίζεται ο μη καθορισμός χώρων προβολής υπαίθριας διαφήμισης.
2. Στην παρ. 3 του άρθρου 3 του ν. 2946/2001,
α) στο δεύτερο εδάφιο, οι λέξεις «αντίστοιχα και οι διατάξεις των προεδρικών διαταγμάτων 370/1995 (ΦΕΚ 199Α’) και 346/1998 (ΦΕΚ 230Α’), όπως τροποποιήθηκαν και ισχύουν,» αντικαθίστανται από τις λέξεις «αναλογικά οι διατάξεις του ν. 4412/2016 (Α’ 147)»,
β) προστίθεται νέο τέταρτο εδάφιο και η παρ. 3 διαμορφώνεται ως εξής: «3. Το δικαίωμα παραχώρησης της χρήσης των χώρων που αναφέρονται στην παρ. 1 για υπαίθρια διαφήμιση, ανήκει στον Ο.Τ.Α. α’ βαθμού, σύμφωνα με τις διατάξεις που ισχύουν κάθε φορά για την εκμίσθωση ακινήτων των Δήμων. Εφόσον η παραχώρηση της χρήσης γίνεται σε συνδυασμό με την ανάληψη εκ μέρους του μισθωτού της υποχρέωσης προμήθειας ειδών ή της παροχής υπηρεσιών προς τον Δήμο, τότε εφαρμόζονται αναλογικά οι διατάξεις του ν. 4412/2016 (Α’ 147), εάν η προέχουσα παροχή είναι η προμήθεια ειδών ή η παροχή υπηρεσιών. Οι διατάξεις του προηγούμενου εδαφίου εφαρμόζονται και για την παραχώρηση χώρων για την προβολή υπαίθριας διαφήμισης στους χώρους και τα οχήματα που αναφέρονται στην περ. γ’ της παρ. 2 του άρθρου 1, εάν ο φορέας που προβαίνει στην παραχώρηση υπάγεται στο πεδίο ρύθμισης των ανωτέρω διαταγμάτων. Στις μισθώσεις που καταρτίζονται σύμφωνα με το πρώτο εδάφιο, δύναται να εφαρμόζεται αναλογικά η παρ. 3 του άρθρου 192 του Κώδικα Δήμων και Κοινοτήτων (ν. 3463/2006, Α’ 114), περί ρύθμισης εμπορικών μισθώσεων, υπό την επιφύλαξη ότι η διάρκεια της παράτασης δεν υπερβαίνει την αρχική διάρκεια της μίσθωσης. Με κοινή απόφαση των Υπουργών Εσωτερικών και Εθνικής Οικονομίας και Οικονομικών ρυθμίζεται κάθε θέμα σχετικό με την εφαρμογή της παρούσας παραγράφου.»
3. Υφιστάμενες αποφάσεις της παρ. 1, κατά την έναρξη ισχύος του παρόντος, εξακολουθούν να ισχύουν μέχρι τη λήξη ή ανάκλησή τους.`},
  118: {title:`Γενικοί όροι για την προβολή υπαίθριας διαφήμισης - Τροποποίηση παρ. 1 άρθρου 4 ν. 2946/2001`,text:`Γενικοί όροι για την προβολή  υπαίθριας διαφήμισης –
Τροποποίηση  παρ. 1 άρθρου 4 ν. 2946/2001 Στην παρ. 1 του άρθρου 4 του ν. 2946/2001 (Α’ 224), οι λέξεις «είτε των διαφημιζομένων» αντικαθίστανται από τις λέξεις «οπότε η κυριότητα επ’ αυτών καθορίζεται σύμφωνα με τους όρους των συμβάσεων της παρ. 3 του άρθρου 3» και η παρ. 1 διαμορφώνεται ως εξής: «1. Η υπαίθρια διαφήμιση γίνεται υποχρεωτικά σε μόνιμα και σταθερά ή προσωρινά και κινητά πλαίσια που κατασκευάζονται με βάση τις προδιαγραφές οι οποίες ορίζονται στις κανονιστικές πράξεις που εκδίδονται κατ’ εξουσιοδότηση της παρ. 8 του προηγούμενου άρθρου. Τα πλαίσια τοποθετούνται με δαπάνες και φροντίδα είτε εκείνου που έχει το δικαίωμα παραχώρησης της χρήσεως του χώρου είτε των διαφημιστικών εταιρειών, οπότε η κυριότητα επ’ αυτών καθορίζεται σύμφωνα με τους όρους των συμβάσεων της παρ. 3 του άρθρου 3.»`},
  119: {title:`Άδεια για την υπαίθρια διαφήμιση και την τοποθέτηση πλαισίων διαφημίσεων - Τροποποίηση παρ. 2 και 4 άρθρου 5 ν. 2946/2001`,text:`Άδεια για την υπαίθρια διαφήμιση και την τοποθέτηση πλαισίων διαφημίσεων - Τροποποίηση παρ. 2 και 4 άρθρου 5 ν. 2946/2001
1. Στην παρ. 2 του άρθρου 5 του ν. 2946/2001 (Α’ 224), περί άδειας για την υπαίθρια διαφήμιση και την τοποθέτηση πλαισίων διαφημίσεων, επέρχονται οι ακόλουθες τροποποιήσεις:
α) στο πρώτο εδάφιο,
αα) οι λέξεις «ιδιωτικό κτίριο ή οικόπεδο» αντικαθίστανται από τις λέξεις «περιφράξεις οικοπέδων, γήπεδα εκτός σχεδίου, ακάλυπτες μεσοτοιχίες και τυφλές όψεις κτιρίων εκτός σχεδίου,»,
αβ) μετά από τη λέξη «προηγούμενη» προστίθεται η λέξη «σύμφωνη»,
αγ) οι λέξεις «γνώμη της πρωτοβάθμιας Ε.Π.Α.Ε., η οποία» αντικαθίστανται από τις λέξεις «η προηγούμενη σύμφωνη γνώμη του αρμόδιου Συμβουλίου Αρχιτεκτονικής, το οποίο»,
β) το τρίτο εδάφιο αντικαθίσταται, και η παρ. 2 διαμορφώνεται ως εξής: «2. Για τη χορήγηση άδειας προβολής υπαίθριας διαφήμισης ή για την τοποθέτηση πλαισίων διαφημίσεων σε περιφράξεις οικοπέδων, γήπεδα εκτός σχεδίου, ακάλυπτες μεσοτοιχίες και τυφλές όψεις κτιρίων εκτός σχεδίου, απαιτείται επίσης και η προηγούμενη σύμφωνη γνώμη του αρμόδιου Τοπικού Συμβουλίου Μνημείων του Υπουργείου Πολιτισμού, που εξετάζει αν περιορίζεται η θέα και προκαλείται υποβάθμιση μνημείων και αρχαιολογικών χώρων, καθώς και η προηγούμενη σύμφωνη γνώμη του αρμόδιου Συμβουλίου Αρχιτεκτονικής, το οποίο εξετάζει αν θίγεται η αισθητική της περιοχής, αν επιβαρύνεται στατικώς το κτίριο ή αν δημιουργείται τεχνικό πρόβλημα σε αυτό από τη διαφημιστική κατασκευή. Οι γνώμες του προηγούμενου εδαφίου παρέχονται μέσα σε προθεσμία ενός μηνός από την υποβολή της σχετικής αίτησης. Σε περίπτωση μη παροχής της σύμφωνης γνώμης εντός ενός (1) μηνός, η άδεια δεν εγκρίνεται. Η άδεια της παραγράφου αυτής ισχύει μέχρι τρία έτη και μπορεί να ανανεώνεται μία ή περισσότερες φορές, για ίσο χρονικό διάστημα, με την ίδια διαδικασία.»
2. Στην παρ. 4 του άρθρου 5 του ν. 2946/2001 προστίθεται δεύτερο εδάφιο, και η παρ. 4 διαμορφώνεται ως εξής: «4. Για διαφημίσεις οι οποίες διενεργούνται από τον αέρα, αρμόδιος, για τη χορήγηση της άδειας, Δήμος είναι εκείνος στα διοικητικά όρια του οποίου έχει την έδρα της η επιχείρηση του διαφημιζόμενου. Η άδεια χορηγείται υπό τους όρους ότι:
α) τα πτητικά μέσα, επιχειρώντας πτήσεις είτε κατά μόνας είτε σε ομαδικούς σχηματισμούς, δεν είναι φωτεινά ή φωτιζόμενα,
β) έχει ληφθεί η σχετική άδεια από την Αρχή Πολιτικής Αεροπορίας σύμφωνα με τις διατάξεις περί εκτέλεσης πτήσεων, και
γ) τηρούνται οι διατάξεις περί εκτέλεσης πτήσεων, συμπεριλαμβανομένων των διατάξεων που ισχύουν για την τήρηση της γενικής ασφάλειας σε συγκεντρώσεις προσώπων κατά τη διενέργεια της διαφήμισης.»`},
  121: {title:`Προϋποθέσεις καταχώρισης υπαίθριων διαφημίσεων από φορείς του Δημοσίου - Προσθήκη παρ. 5 στο άρθρο 14 του ν. 2946/2001`,text:`ΚΕΦΑΛΑΙΟ Β’ ΤΕΧΝΙΚΕΣ ΠΡΟΔΙΑΓΡΑΦΕΣ ΑΜΑΞΟΣΤΑΣΙΩΝ ΛΕΩΦΟΡΕΙΩΝ
α) τα διαφημιστικά πλαίσια που χρησιμοποιούνται πληρούν τις προϋποθέσεις του παρόντος και
β) στους χώρους εγκατάστασης των διαφημιστικών μέσων είναι επιτρεπτή η διαφήμιση και έχουν νομίμως παραχωρηθεί στους διαφημιστές στο πλαίσιο εν ισχύ σύμβασης.»
ΚΕΦΑΛΑΙΟ Β’ ΤΕΧΝΙΚΕΣ ΠΡΟΔΙΑΓΡΑΦΕΣ ΑΜΑΞΟΣΤΑΣΙΩΝ ΛΕΩΦΟΡΕΙΩΝ`},
  122: {title:`Τεχνικές προδιαγραφές αμαξοστασίων αστικών, ημιαστικών και υπεραστικών λεωφορείων - Αντικατάσταση παρ. 3 άρθρου 12 ν. 4974/2022`,text:`ΚΕΦΑΛΑΙΟ Γ’ ΑΝΑΔΙΟΡΓΑΝΩΣΗ ΔΙΟΙΚΗΣΗΣ ΡΥΘΜΙΣΤΙΚΗΣ ΑΡΧΗΣ ΣΙΔΗΡΟΔΡΟΜΩΝ
Τεχνικές προδιαγραφές αμαξοστασίων αστικών, ημιαστικών και υπεραστικών λεωφορείων - Αντικατάσταση παρ. 3 άρθρου 12 ν. 4974/2022
1. Η παρ. 3 του άρθρου 12 του ν. 4974/2022 (Α’ 185), περί σταθμών και εγκαταστάσεων εξυπηρέτησης επιβατών, αντικαθίσταται ως εξής: «3. Ως αμαξοστάσια αστικών, ημιαστικών ή υπεραστικών λεωφορείων ορίζονται οι εγκαταστάσεις στάθμευσης, συντήρησης πλύσης καθώς και οι εγκαταστάσεις παροχής καυσίμων και ενέργειας των αστικών, ημιαστικών ή υπεραστικών λεωφορείων. Για τις εγκαταστάσεις των πρατήριων παροχής καυσίμων και ενέργειας εφαρμόζεται το τρίτο εδάφιο της περ. β) της παρ. 2 του άρθρου 4 του ν.2963/2001 (Α’ 268), περί σκοπού Κ.Τ.Ε.Λ. Α.Ε..»
2. Στο άρθρο 31 του ν. 4974/2022, περί μεταβατικών διατάξεων, προστίθεται παρ. 4, ως εξής: «4. Υφιστάμενοι κατά την 31.3.2025 χώροι αμαξοστασίων αστικών, ημιαστικών ή υπεραστικών λεωφορείων συμμορφώνονται με τις απαιτήσεις της υπ’ αρ. 148169/10.5.2023 απόφασης του Υφυπουργού Υποδομών και Μεταφορών «Καθορισμός των τεχνικών προδιαγραφών για την ίδρυση και λειτουργία των αμαξοστασίων στάθμευσης, συντήρησης και φύλαξης των αστικών ή ημιαστικών λεωφορείων» (Β’ 3120) εντός έξι (6) μηνών από τη δημοσίευση του παρόντος, κατά παρέκκλιση των προβλεπομένων χρήσεων γης και έως την έγκριση των Ειδικών και Τοπικών Πολεοδομικών Σχεδίων.»
ΚΕΦΑΛΑΙΟ Γ’ ΑΝΑΔΙΟΡΓΑΝΩΣΗ ΔΙΟΙΚΗΣΗΣ ΡΥΘΜΙΣΤΙΚΗΣ ΑΡΧΗΣ ΣΙΔΗΡΟΔΡΟΜΩΝ`},
  123: {title:`Συγκρότηση και λειτουργία της διοίκησης της Ρυθμιστικής Αρχής Σιδηροδρόμων - Τροποποίηση παρ. 1 άρθρου 23, παρ. 1, 2 και 4 άρθρου 27 ν. 3891/2010`,text:`ΚΕΦΑΛΑΙΟ Δ’ ΡΥΘΜΙΣΗ ΑΛΛΩΝ ΘΕΜΑΤΩΝ ΑΡΜΟΔΙΟΤΗΤΑΣ ΥΠΟΥΡΓΕΙΟΥ ΥΠΟΔΟΜΩΝ ΚΑΙ ΜΕΤΑΦΟΡΩΝ
Συγκρότηση και λειτουργία της διοίκησης της Ρυθμιστικής Αρχής Σιδηροδρόμων - Τροποποίηση παρ. 1 άρθρου 23, παρ. 1, 2 και 4 άρθρου 27 ν. 3891/2010
1. Στο πρώτο εδάφιο της παρ. 1 του άρθρου 23 του ν. 3891/2010 (Α’ 188), περί συγκρότησης, επέρχονται οι ακόλουθες τροποποιήσεις:
α) το αρκτικόλεξο «Ρ.Α.Σ.» αντικαθίσταται από τις λέξεις «Ρυθμιστική Αρχή Σιδηροδρόμων (Ρ.Α.Σ.)»,
β) οι λέξεις «καθένα εκ των οποίων αναπληρώνεται από ένα αντίστοιχο αναπληρωματικό μέλος» διαγράφονται και η παρ. 1 διαμορφώνεται ως εξής: «1. Η Ρυθμιστική Αρχή Σιδηροδρόμων (Ρ.Α.Σ.) συγκροτείται από τον Πρόεδρο, τον Αντιπρόεδρο και τρία (3) ακόμη τακτικά μέλη. Τα μέλη της Ρ.Α.Σ. είναι πρόσωπα εγνωσμένου κύρους και διακρίνονται για την επιστημονική τους κατάρτιση και την επαγγελματική τους ικανότητα στον τεχνικό, οικονομικό ή νομικό τομέα και απολαμβάνουν ευρείας κοινωνικής αποδοχής.»
2. Στο άρθρο 27 του ν. 3891/2010, περί σύνθεσης, συνεδριάσεων, λειτουργίας, αποφάσεων της Ρυθμιστικής Αρχής Σιδηροδρόμων, επέρχονται οι ακόλουθες τροποποιήσεις:
α) στην παρ. 1, στο έκτο εδάφιο πριν από τις λέξεις «μέλη της Ρ.Α.Σ.» η λέξη «τακτικά» διαγράφεται,
β) στην παρ. 2,
βα) στο πρώτο εδάφιο μετά από τις λέξεις «και καλεί τα» οι λέξεις «τακτικά και τα αναπληρωματικά» διαγράφονται,
ββ) στο δεύτερο εδάφιο, οι λέξεις «τηλεγράφημα, τηλεομοιοτυπία ή άλλο πρόσφορο μέσο, εφόσον το γεγονός τούτο αποδεικνύεται από σχετική σημείωση σε ειδικό βιβλίο, η οποία πρέπει να φέρει χρονολογία και την υπογραφή του προσώπου που έκανε την πρόσκληση» αντικαθίστανται από τις λέξεις «μήνυμα ηλεκτρονικού ταχυδρομείου ή άλλο πρόσφορο μέσο», και οι παρ. 1 και 2 διαμορφώνονται ως εξής: «1. Η Ρ.Α.Σ. συνέρχεται στην έδρα της ή και εκτός αυτής, αν τούτο έχει οριστεί προηγουμένως, τακτικώς μεν τουλάχιστον μία (1) φορά το μήνα και εκτάκτως όταν ζητηθεί από τον Πρόεδρο αυτής. Η Ρ.Α.Σ. συνεδριάζει νομίμως, εφόσον μετέχουν στη συνεδρίαση ο Πρόεδρος ή, απουσιάζοντος αυτού, ο Αντιπρόεδρος και τρία (3) τουλάχιστον μέλη (απαρτία). Η απαρτία πρέπει να υπάρχει σε όλη τη διάρκεια της συνεδρίασης. Αν, κατά την πρώτη συνεδρίαση, διαπιστωθεί έλλειψη απαρτίας, η Ρ.Α.Σ. καλείται εκ νέου σε συνεδρίαση, η οποία πραγματοποιείται το νωρίτερο σε είκοσι τέσσερις (24) ώρες, με την ίδια ημερήσια διάταξη. Κατά τη συνεδρίαση αυτή, υπάρχει απαρτία αν μετέχουν στη σύνθεση ο Πρόεδρος ή, απουσιάζοντος αυτού, ο Αντιπρόεδρος και τρία (3) τουλάχιστον μέλη. Τα μέλη της Ρ.Α.Σ. δεν μπορούν να απουσιάζουν αδικαιολόγητα για περισσότερες από τρεις (3), κατά σειρά, συνεδριάσεις. Η Ρ.Α.Σ. μπορεί να λειτουργήσει, όχι όμως πέρα από ένα τρίμηνο, αν κάποια από τα μέλη της εκλείψουν ή αποχωρήσουν για οποιονδήποτε λόγο ή απωλέσουν την ιδιότητα βάσει της οποίας ορίστηκαν, εφόσον, κατά τις συνεδριάσεις της, τα λοιπά μέλη επαρκούν ώστε να υπάρχει απαρτία. 2. Ο Πρόεδρος της Ρ.Α.Σ. καθορίζει την ημέρα, την ώρα και τον τόπο των συνεδριάσεων και καλεί τα μέλη να συμμετάσχουν. Η πρόσκληση, η οποία περιλαμβάνει την ημερήσια διάταξη, γνωστοποιείται, από τον Πρόεδρο, στα μέλη της Ρ.Α.Σ. τουλάχιστον σαράντα οκτώ (48) ώρες πριν από τη συνεδρίαση, μπορεί δε να γίνει και με τηλεφώνημα, μήνυμα ηλεκτρονικού ταχυδρομείου ή άλλο πρόσφορο μέσο. Η προθεσμία αυτή μπορεί, σε περίπτωση κατεπείγοντος, να συντμηθεί, η πρόσκληση όμως, τότε, πρέπει να είναι έγγραφη και να βεβαιώνονται σε αυτήν οι λόγοι που κατέστησαν τη σύντμηση αναγκαία. Πρόσκληση των μελών της Ρ.Α.Σ. δεν απαιτείται όταν οι συνεδριάσεις γίνονται σε ημερομηνίες τακτές, που ορίζονται με απόφασή της, η οποία και γνωστοποιείται στα μέλη της. Πρόσκληση δεν απαιτείται, επίσης, όταν μέλος της Ρ.Α.Σ. έχει δηλώσει, πριν από τη συνεδρίαση, κώλυμα συμμετοχής του σε αυτήν ή όταν το κώλυμα τούτο είναι γνωστό στον πρόεδρο της Ρ.Α.Σ..»
3. Στην παρ. 4 του άρθρου 27 του ν. 3891/2010, επέρχονται οι ακόλουθες τροποποιήσεις:
α) στο πρώτο εδάφιο μετά από τη λέξη «συνεδρίαση» η λέξη «τακτικό» διαγράφεται,
β) το δεύτερο εδάφιο διαγράφεται, και η παρ. 4 διαμορφώνεται ως εξής: «4. Αν κατά τη συνεδρίαση απουσιάσει μέλος της Ρ.Α.Σ. το οποίο δεν είχε προσκληθεί, η συνεδρίαση είναι παράνομη. Αν υπήρξαν πλημμέλειες ως προς την κλήτευση μέλους, η Ρ.Α.Σ. συνεδριάζει νομίμως αν αυτό είναι παρόν και δεν αντιλέγει για την πραγματοποίηση της συνεδρίασης.»
4. Από την έναρξη ισχύος του παρόντος καταργείται η παρ. 3 του άρθρου 27 του ν. 3891/2010, περί σύνθεσης, συνεδριάσεων, λειτουργίας και αποφάσεων της Ρ.Α.Σ..
ΚΕΦΑΛΑΙΟ Δ’ ΡΥΘΜΙΣΗ ΑΛΛΩΝ ΘΕΜΑΤΩΝ  ΑΡΜΟΔΙΟΤΗΤΑΣΥΠΟΥΡΓΕΙΟΥ ΥΠΟΔΟΜΩΝ  ΚΑΙ ΜΕΤΑΦΟΡΩΝ`},
  125: {title:`Θέματα Μητρώων συντελεστών παραγωγής δημοσίων και ιδιωτικών έργων, μελετών, τεχνικών και λοιπών συναφών επιστημονικών υπηρεσιών - Τροποποίηση παρ. 1 και 2 άρθρου 39 και παρ. 1 και 6 άρθρου 65 π.δ. 71/2019`,text:`1. Στο άρθρο 39 του π.δ. 71/2019 (Α’ 112), περί μεταβατικών διατάξεων, επέρχονται οι ακόλουθες τροποποιήσεις:
α) στο πρώτο εδάφιο της παρ. 1 η ημερομηνία «30ή Ιουνίου 2025» αντικαθίσταται από την ημερομηνία «31η Δεκεμβρίου 2025»,
β) στην παρ. 2:
βα) στο πρώτο και στο δεύτερο εδάφιο η ημερομηνία «30ή Ιουνίου 2025» αντικαθίσταται από την ημερομηνία «31η Δεκεμβρίου 2025»,
ββ) στο τέταρτο εδάφιο η ημερομηνία «30ής Ιουνίου 2025» αντικαθίσταται από την ημερομηνία «31ης Δεκεμβρίου 2025» και το άρθρο 39 διαμορφώνεται ως εξής: «1. Οι μελετητικές επιχειρήσεις που είναι εγγεγραμμένες στα Μητρώα Μελετητών και Γραφείων Μελετών υποχρεούνται να υποβάλουν αίτηση επανάκρισης για την κατάταξή τους στην αντίστοιχη κατηγορία μελέτης και τάξη, σύμφωνα με τις προϋποθέσεις του παρόντος μέχρι την 31η Δεκεμβρίου 2025. Η απόφαση κατάταξης της μελετητικής επιχείρησης στο ΜΗ.Μ.Ε.Δ.Ε. εκδίδεται μέσα σε προθεσμία εννέα (9) μηνών από την υποβολή της αίτησης στην υπηρεσία τήρησης του ΜΗ.Μ.Ε.Δ.Ε..
2. Τα πτυχία των εγγεγραμμένων στο Μητρώο Μελετητών και στο Μητρώο Γραφείο Μελετών που είναι σε ισχύ κατά την 3η Ιουλίου 2019 και όσα εκδόθηκαν σε συνέχεια αιτήσεων που υποβλήθηκαν πριν από την έκδοση της διαπιστωτικής πράξης της παρ. 24 του άρθρου 118 του ν. 4472/2017 (Α’ 74), εξακολουθούν να ισχύουν μέχρι την 31η Δεκεμβρίου 2025. Για το διάστημα από την 31η Δεκεμβρίου 2025 και μέχρι την έκδοση απόφασης κατάταξης της μελετητικής επιχείρησης στο ΜΗ.Μ.Ε.Δ.Ε. τα πτυχία του προηγούμενου εδαφίου εξακολουθούν να ισχύουν υπό την προϋπόθεση υποβολής της αίτησης επανάκρισης μέχρι την παραπάνω ημερομηνία. Η απόφαση κατάταξης εκδίδεται εντός της προθεσμίας του δεύτερου εδαφίου της παρ. 1. Μετά την άπρακτη πάροδο της προθεσμίας της 31ης Δεκεμβρίου 2025 παύει η ισχύς όλων των πτυχίων για τα οποία δεν υποβλήθηκε αίτηση επανάκρισης.» 2. Στο πρώτο εδάφιο της παρ. 1 του άρθρου 65 του π.δ. 71/2019, περί μεταβατικών διατάξεων, η ημερομηνία «30ή Ιουνίου 2025» αντικαθίσταται από την ημερομηνία «31η Δεκεμβρίου 2025», και η παρ. 1 διαμορφώνεται ως εξής: «1. Οι εργοληπτικές επιχειρήσεις που είναι εγγεγραμμένες στο Μ.Ε.ΕΠ. υποχρεούνται να υποβάλουν αίτηση επανάκρισης για την κατάταξή τους στην αντίστοιχη κατηγορία έργων ή εξειδικευμένη εργασία και τάξη στα Τμήματα I και II του ΜΗ.Ε.Ε.Δ.Ε. (άρθρα 45 και 47), σύμ φωνα με τις προϋποθέσεις του παρόντος, μέχρι την 31η Δεκεμβρίου 2025. Η επανάκριση διενεργείται σύμφωνα με τα οριζόμενα στο παρόν. Η απόφαση κατάταξης της εργοληπτικής επιχείρησης στο ΜΗ.Ε.Ε.Δ.Ε. εκδίδεται μέσα σε προθεσμία εννέα (9) μηνών από την υποβολή της αίτησης στην υπηρεσία τήρησης του ΜΗ.Ε.Ε.Δ.Ε..»
3. Στην παρ. 6 του άρθρου 65 του π.δ. 71/2019, περί μεταβατικών διατάξεων, επέρχονται οι ακόλουθες τροποποιήσεις:
α) στο πρώτο, δεύτερο και πέμπτο εδάφιο η ημερομηνία «30ή Ιουνίου 2025» αντικαθίσταται από την ημερομηνία «31η Δεκεμβρίου 2025»,
β) στο τέταρτο εδάφιο η ημερομηνία «30ής Ιουνίου 2025» αντικαθίσταται από την ημερομηνία «31ης Δεκεμβρίου 2025» και η παρ. 6 διαμορφώνεται ως εξής: «6. Οι βεβαιώσεις εγγραφής στο Μ.Ε.ΕΠ., καθώς και τα πτυχία εργοληπτών Δημοσίων Δασοτεχνικών Έργων που είναι σε ισχύ κατά την 3η Ιουλίου 2019, και όσα εκδόθηκαν σε συνέχεια αιτήσεων που υποβλήθηκαν πριν από την έκδοση της διαπιστωτικής πράξης της παρ. 24 του άρθρου 118 του ν. 4472/2017 (Α’ 74), εξακολουθούν να ισχύουν μέχρι την 31η Δεκεμβρίου 2025. Για το διάστημα από την 31η Δεκεμβρίου 2025 και εφεξής μέχρι την έκδοση απόφασης κατάταξης της εργοληπτικής επιχείρησης στο ΜΗ.Ε.Ε.Δ.Ε. τα πτυχία του προηγούμενου εδαφίου εξακολουθούν να ισχύουν υπό την προϋπόθεση υποβολής της από την παρ. 1 του άρθρου 65 προβλεπόμενης αίτησης επανάκρισης, εντός της προθεσμίας που προβλέπεται σε αυτό. Η απόφαση κατάταξης εκδίδεται εντός της προθεσμίας του δεύτερου εδαφίου της παρ. 1. Μετά την άπρακτη πάροδο της προθεσμίας της 31ης Δεκεμβρίου 2025 παύει η ισχύς όλων των πτυχίων για τα οποία δεν υποβλήθηκε αίτηση επανάκρισης. Για το χρονικό διάστημα μέχρι την 31η Δεκεμβρίου 2025, και εφόσον εντός αυτού υποβληθεί αίτηση επανάκρισης ή δήλωσης της παρ. 2, μέχρι την έκδοση σχετικής απόφασης, εξακολουθεί να εκδίδεται, σύμφωνα με τα ισχύοντα μέχρι την 3η Ιουλίου 2019, η ενημερότητα πτυχίου για εργοληπτικές επιχειρήσεις που είναι καταταγμένες στις τάξεις 3η έως 7η.»`},
  128: {title:`Προσωρινή λειτουργία συνεργείων βαρέων οχημάτων στη νησιωτική χώρα - Μεταβατική διάταξη`,text:`Προσωρινή λειτουργία συνεργείων βαρέων οχημάτων στη νησιωτική χώρα - Μεταβατική διάταξη
1. Στη νησιωτική χώρα, με απόφαση του οικείου Περιφερειάρχη, επιτρέπεται η επέκταση λειτουργίας υφιστάμενου συνεργείου συνήθων οχημάτων, επιβατικών αυτοκινήτων, μοτοσυκλετών και μοτοποδηλάτων:
α) μέχρι τρεισήμισι (3,5) τόνων μικτού φορτίου ή
β) δυνατότητας μεταφοράς μέχρι εννέα (9) ατόμων, κατά παρέκκλιση των διατάξεων περί χρήσεων γης, εφόσον δεν υπάρχει αντίστοιχο συνεργείο εντός της ίδιας νήσου, προκειμένου να συντηρεί και να επισκευάζει συνήθη και μεγάλα βαρέα οχήματα άνω των τρεισήμισι (3,5) τόνων μικτού φορτίου ή δυνατότητας μεταφοράς άνω των εννέα (9) ατόμων.
2. Tο παρόν ισχύει μέχρι την ολοκλήρωση των Τοπικών Πολεοδομικών Σχεδίων και σε κάθε περίπτωση όχι πέραν της 31ης Δεκεμβρίου 2026.`},
  129: {title:`Ανανέωση συμβάσεων ΙΔΟΧ στον τομέα φύλαξης του Ο.Σ.Ε. Α.Ε. και στο συγκοινωνιακό έργο του Οργανισμού Αστικών Συγκοινωνιών Θεσσαλονίκης`,text:`ΚΕΦΑΛΑΙΟ Ε’ ΡΥΘΜΙΣΕΙΣ ΑΡΜΟΔΙΟΤΗΤΑΣ ΥΠΟΥΡΓΕΙΩΝ ΕΣΩΤΕΡΙΚΩΝ ΚΑΙ ΥΓΕΙΑΣ
Ανανέωση συμβάσεων ΙΔΟΧ στον τομέα φύλαξης του Ο.Σ.Ε. Α.Ε. και στο συγκοινωνιακό έργο του Οργανισμού Αστικών Συγκοινωνιών Θεσσαλονίκης
1. Συμβάσεις εργασίας Ιδιωτικού Δικαίου Ορισμένου Χρόνου προσωπικού, εκατόν είκοσι τριών (123) εργαζομένων ειδικότητας ΥΕ Φυλάκων που προσελήφθησαν στον τομέα της φύλαξης ισόπεδων διαβάσεων και εγκαταστάσεων της εταιρείας με την επωνυμία «Οργανισμός Σιδηροδρόμων Ελλάδος Ανώνυμη Εταιρεία» (ΟΣΕ Α.Ε.) που συνήφθησαν σύμφωνα με το άρθρο όγδοο του ν. 4506/2017 (Α’ 191), και οι οποίες τέθηκαν εκ νέου σε ισχύ με διάρκεια έως και την 30ή Ιουνίου 2025, σύμφωνα με το άρθρο 78 του ν. 5039/2023 (Α’ 83), δύνανται να ανανεώνονται για διάστημα έως είκοσι τεσσάρων (24) μηνών, από την ημερομηνία λήξης τους. Με σκοπό την κάλυψη των υπηρεσιακών αναγκών που ανακύπτουν, ο ΟΣΕ Α.Ε. δύναται:
α) να τοποθετεί το προσωπικό της παρούσας σε οποιεσδήποτε θέσεις του Τμήματος Γραμμής,
β) να απασχολεί το προσωπικό αυτό ως ΥΕ Εργατών Γενικών Καθηκόντων.
2. Συμβάσεις εργασίας Ιδιωτικού Δικαίου Ορισμένου Χρόνου προσωπικού, εκατόν πενήντα (150) οδηγών, ειδικότητας ΔΕ Οδηγών, που προσελήφθησαν από το νομικό πρόσωπο ιδιωτικού δικαίου, με την επωνυμία «Οργανισμός Αστικών Συγκοινωνιών Θεσσαλονίκης» (Ο.Α.Σ.Θ.), δυνάμει της υπό στοιχεία ΣΟΧ 1/2023 Ανακοίνωσης, που ανανεώθηκαν με το άρθρο 41 του ν. 5131/2024 (Α’ 128) και το άρθρο 42 του ν. 5160/2024 (Α’ 195) και δεν έχουν λυθεί έως τη δημοσίευση του παρόντος, ανανεώνονται αυτοδικαίως από τη λήξη τους έως την ολοκλήρωση της ανάθεσης του συγκοινωνιακού έργου στον Ο.Α.Σ.Θ. και πάντως όχι πέραν της 31ης Δεκεμβρίου 2025.
3. Συμβάσεις Εργασίας Ιδιωτικού Δικαίου Ορισμένου Χρόνου προσωπικού σαράντα (40) οδηγών, ειδικότητας ΔΕ Οδηγών, που προσελήφθησαν από τον Ο.Α.Σ.Θ., δυνάμει της υπό στοιχεία ΣΟΧ 1/2024 Ανακοίνωσης, που ανανεώθηκαν με το άρθρο 42 του ν. 5160/2024 και δεν έχουν λυθεί έως τη δημοσίευση του παρόντος, ανανεώνονται αυτοδικαίως από τη λήξη τους έως την ολοκλήρωση της ανάθεσης του συγκοινωνιακού έργου στον Ο.Α.Σ.Θ. και πάντως όχι πέραν της 31ης Δεκεμβρίου 2025.
4. Οι ανανεώσεις του παρόντος δεν μεταβάλλουν τον χαρακτήρα Ιδιωτικού Δικαίου Ορισμένου Χρόνου της σχέσης εργασίας, βάσει της οποίας προσελήφθησαν οι απασχολούμενοι στις θέσεις αυτές και δεν προσμετρώνται στο ανώτατο χρονικό διάστημα των είκοσι τεσσάρων (24) μηνών, κατά την έννοια των άρθρων 5 έως 7 του π.δ. 164/2004 (Α’ 134).
